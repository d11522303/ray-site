lead: HELLO
title: 你好，我是 Ray
body: |-
  在大學旅運系教書，教的是領隊導遊、郵輪旅遊和觀光法規。教書之前在中華徵信所和旅行業工作過，大學時在民生東路的老旅行社騎機車送簽證，那兩年的故事寫在「駱老闆和他的朋友們」系列裡。

  這個網站整理我在方格子沙龍「隨峰而趣 Rayfong's Travelogue」和 Facebook 上寫的文章，也放課程講義與證照資源。
