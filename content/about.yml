lead: HELLO
title: 我是瑞峰老師！
body: |-
  職涯前十年在中華徵信所、台北市青少年育樂中心和旅行資訊業工作過。
  職涯進行式已經在技職學院當教師兼行政工作快二十年。
  從此時此刻起，我要開創我的遊戲人生。
