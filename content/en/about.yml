lead: HELLO
title: I'm Teacher Ray!
body: |-
  I spent the first ten years of my career at China Credit Information Service, the Taipei Youth Recreation Centre and in the travel information industry.
  For almost twenty years now I have been teaching and doing administrative work at vocational universities.
  From this moment on, I'm starting my life as a game.
boxes:
  - title: Where I teach
    text: |-
      Department of Travel Management, Hsing Wu University (HWU)
      Department of Hospitality Management, Taiwan Hospitality & Tourism College (THT)
