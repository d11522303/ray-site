<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日期天數計算器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: mobile-first single column of two tool panels, big tap targets, result shown inline under each button */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --fg: #1c2321;
  --muted: #5e6b66;
  --line: #d9dfdb;
  --accent: #1f7a5c;
  --accent-fg: #ffffff;
  --result-bg: #e6f2ec;
  --error: #b3261e;
  --warn: #c2410c;
  --font-body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-num: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1b211e; --fg: #e8eeea; --muted: #9aa8a1; --line: #2e3833;
  --accent: #4fbf94; --accent-fg: #0b1a14; --result-bg: #1d3329; --error: #f2b8b5; --warn: #fdba74; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b211e; --fg: #e8eeea; --muted: #9aa8a1; --line: #2e3833;
  --accent: #4fbf94; --accent-fg: #0b1a14; --result-bg: #1d3329; --error: #f2b8b5; --warn: #fdba74; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 480px; margin: 0 auto; display: grid; gap: 20px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  flex: none; width: 64px; height: 64px;
  display: grid; place-items: center; color: var(--muted); font-family: var(--font-num);
  font-size: .7rem; letter-spacing: .08em; overflow: hidden;
}
.logo img { width: 100%; height: 100%; object-fit: contain; }
header h1 { font-size: 1.5rem; margin: 0; text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--muted); font-family: var(--font-num); letter-spacing: .02em; }
section {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px; display: grid; gap: 14px;
}
h2 { margin: 0; font-size: 1.1rem; display: grid; }
h2 small { font-weight: 400; color: var(--muted); font-size: .85rem; }
.field { display: grid; gap: 6px; }
label { font-weight: 500; display: grid; line-height: 1.3; }
label span { font-weight: 400; color: var(--muted); font-size: .85rem; }
input {
  width: 100%; min-height: 52px; font-size: 1.1rem; font-family: var(--font-num);
  padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: var(--fg); -webkit-appearance: none; appearance: none;
}
input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
input[aria-invalid="true"] { border-color: var(--error); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--fg); font: inherit; font-size: .9rem; cursor: pointer;
}
.chip:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  width: 100%; min-height: 56px; border: 0; border-radius: 14px; background: var(--accent);
  color: var(--accent-fg); font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer;
}
.btn:active { transform: scale(.99); }
.result {
  background: var(--result-bg); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px;
}
.result .big { font-family: var(--font-num); font-size: 2rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.result .sub { color: var(--muted); font-size: .9rem; }
.error { color: var(--error); font-weight: 500; }
.group { display: grid; gap: 8px; }
.group h3 { margin: 4px 0 0; font-size: 1rem; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.group h3 a { font-size: .8rem; font-weight: 400; color: var(--accent); }
.dl { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
.dl .who { flex: 1; min-width: 0; display: grid; }
.dl .who b { font-weight: 500; overflow-wrap: anywhere; }
.dl .who span { color: var(--muted); font-size: .85rem; font-family: var(--font-num); }
.dl .left { flex: none; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; line-height: 1.1; }
.dl .left strong { display: block; font-size: 1.6rem; color: var(--accent); }
.dl .left small { color: var(--muted); font-size: .75rem; }
.dl.soon .left strong { color: var(--warn); }
.dl.done { opacity: .55; }
.dl.done .left strong { font-size: .95rem; color: var(--muted); }
.meta { color: var(--muted); font-size: .8rem; }
footer { color: var(--muted); font-size: .8rem; text-align: center; }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>

  <section aria-labelledby="t1">
    <h2 id="t1">一、計算兩日期相隔天數<small>Date Difference Calculator</small></h2>
    <div class="field">
      <label for="d1-start">開始日期<span>Start Date</span></label>
      <input type="date" id="d1-start">
    </div>
    <div class="field">
      <label for="d1-end">結束日期<span>End Date</span></label>
      <input type="date" id="d1-end">
    </div>
    <button class="btn" id="btn-diff" type="button">計算天數差 / Calculate Days Difference</button>
    <div class="result" id="res-diff" aria-live="polite"></div>
  </section>

  <section aria-labelledby="t2">
    <h2 id="t2">二、起始日期加天數後的日期<small>Calculate Date After Adding Days</small></h2>
    <div class="field">
      <label for="d2-start">起始日期<span>Start Date</span></label>
      <input type="date" id="d2-start">
    </div>
    <div class="field">
      <label for="d2-days">要增加的天數<span>Number of Days to Add（可輸入負數 / negative allowed）</span></label>
      <input type="number" id="d2-days" inputmode="numeric" step="1" placeholder="例如 100">
      <div class="row" aria-label="快速填入 / Quick fill">
        <button class="chip" type="button" data-days="7">+7</button>
        <button class="chip" type="button" data-days="30">+30</button>
        <button class="chip" type="button" data-days="100">+100</button>
        <button class="chip" type="button" data-days="365">+365</button>
        <button class="chip" type="button" data-days="-30">−30</button>
      </div>
    </div>
    <button class="btn" id="btn-add" type="button">計算結果日期 / Calculate Result Date</button>
    <div class="result" id="res-add" aria-live="polite"></div>
  </section>

  <section aria-labelledby="t3">
    <h2 id="t3">三、實習招募截止倒數<small>Internship Application Deadlines</small></h2>
    <div id="deadlines"><p class="meta">載入中… Loading…</p></div>
    <p class="meta" id="dl-updated"></p>
  </section>

  <footer>天數以日曆日計算，不含開始當天。Counts calendar days, start day excluded.</footer>
</div>

<script>
const WEEK_ZH = ["日","一","二","三","四","五","六"];
const WEEK_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY = 86400000;

function parse(v) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || "");
  if (!m) return null;
  const t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  const d = new Date(t);
  if (d.getUTCFullYear() !== +m[1] || d.getUTCMonth() !== +m[2] - 1 || d.getUTCDate() !== +m[3]) return null;
  return t;
}
function iso(t) { return new Date(t).toISOString().slice(0, 10); }
function fmt(t) {
  const d = new Date(t), w = d.getUTCDay();
  return { zh: `${d.getUTCFullYear()} 年 ${d.getUTCMonth() + 1} 月 ${d.getUTCDate()} 日（星期${WEEK_ZH[w]}）`, en: `${iso(t).replaceAll("-", "/")} (${WEEK_EN[w]})` };
}
function today() { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); }
const $ = id => document.getElementById(id);
function show(el, html) { el.innerHTML = html; }
function err(el, zh, en) { show(el, `<div class="error">${zh}</div><div class="sub">${en}</div>`); }
function mark(input, bad) { input.setAttribute("aria-invalid", bad ? "true" : "false"); }

function calcDiff() {
  const a = parse($("d1-start").value), b = parse($("d1-end").value), el = $("res-diff");
  mark($("d1-start"), a === null); mark($("d1-end"), b === null);
  if (a === null || b === null) return err(el, "請選擇開始日期與結束日期。", "Please choose both a start date and an end date.");
  const n = Math.round((b - a) / DAY), abs = Math.abs(n);
  const weeks = Math.floor(abs / 7), rest = abs % 7;
  let note = n < 0 ? `<div class="sub">結束日期早於開始日期，相差 ${abs} 天。End date is before start date.</div>` : "";
  show(el, `<div class="sub">相隔 / Difference</div>
    <div class="big">${n.toLocaleString()} 天</div>
    <div class="sub">${abs.toLocaleString()} days · ${weeks} 週 ${rest} 天 (${weeks} wk ${rest} d)</div>${note}`);
}

function calcAdd() {
  const a = parse($("d2-start").value), raw = $("d2-days").value.trim(), el = $("res-add");
  const n = Number(raw);
  const badDays = raw === "" || !Number.isInteger(n) || Math.abs(n) > 1000000;
  mark($("d2-start"), a === null); mark($("d2-days"), badDays);
  if (a === null) return err(el, "請選擇起始日期。", "Please choose a start date.");
  if (badDays) return err(el, "請輸入整數天數（可為負數，最多 ±1,000,000）。", "Enter a whole number of days (negative allowed, up to ±1,000,000).");
  const r = a + n * DAY;
  if (!isFinite(r) || new Date(r).getUTCFullYear() > 9999 || new Date(r).getUTCFullYear() < 1) return err(el, "結果超出可計算的日期範圍。", "The result is outside the supported date range.");
  const f = fmt(r);
  show(el, `<div class="sub">${n >= 0 ? "加" : "減"} ${Math.abs(n).toLocaleString()} 天後 / Result date</div>
    <div class="big">${iso(r).replaceAll("-", "/")}</div>
    <div class="sub">${f.zh} · ${f.en}</div>`);
}

$("btn-diff").addEventListener("click", calcDiff);
$("btn-add").addEventListener("click", calcAdd);
["d1-start","d1-end"].forEach(id => $(id).addEventListener("change", calcDiff));
["d2-start","d2-days"].forEach(id => $(id).addEventListener("input", calcAdd));
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => { $("d2-days").value = c.dataset.days; calcAdd(); }));

// Example starting state: today → end of next year; today + 100 days
const t = today();
$("d1-start").value = iso(t);
$("d1-end").value = `${new Date(t).getUTCFullYear() + 1}-12-31`;
$("d2-start").value = iso(t);
$("d2-days").value = "100";
calcDiff(); calcAdd();

// 三、實習招募截止倒數：資料由網站每天自動抓取醒吾旅運系公告
function renderDeadlines(data) {
  const box = $("deadlines"), t0 = today();
  const esc = x => String(x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  box.innerHTML = "";
  (data.groups || []).forEach(g => {
    const items = (g.items || []).map(it => {
      const t = parse(it.date); if (t === null) return null;
      const n = Math.round((t - t0) / DAY);
      return { ...it, t, n, done: it.closed || n < 0 };
    }).filter(Boolean).sort((a, b) => (a.done - b.done) || (a.done ? b.t - a.t : a.t - b.t));
    const div = document.createElement("div"); div.className = "group";
    div.innerHTML = `<h3>${esc(g.title)}<a href="${esc(g.url)}" target="_blank" rel="noopener">看原公告 ↗</a></h3>` +
      items.map(it => {
        const d = new Date(it.t), w = d.getUTCDay();
        const when = `${d.getUTCMonth() + 1}/${d.getUTCDate()}（${WEEK_ZH[w]}）截止`;
        const left = it.done ? `<strong>已截止</strong><small>Closed</small>`
          : it.n === 0 ? `<strong>今天</strong><small>Due today</small>`
          : `<strong>${it.n}</strong><small>天 · days left</small>`;
        const cls = it.done ? "dl done" : it.n <= 7 ? "dl soon" : "dl";
        return `<div class="${cls}"><div class="who"><b>${esc(it.name)}</b><span>${when}</span></div><div class="left">${left}</div></div>`;
      }).join("");
    box.appendChild(div);
  });
  if (!box.children.length) box.innerHTML = `<p class="meta">目前沒有招募資料。No deadlines listed right now.</p>`;
  if (data.updated) $("dl-updated").textContent = `資料更新：${data.updated.replace("T", " ").slice(0, 16)}（每天自動更新）· Updated daily`;
}
fetch("deadlines.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(renderDeadlines)
  .catch(() => { $("deadlines").innerHTML = `<p class="error">讀不到截止日資料，請稍後重新整理。</p><p class="meta">Could not load deadlines. Please refresh later.</p>`; });
</script>
</body>
</html>
