amily. If you are too familiar with wicked youths, you will eventually suffer for it; if you humbly keep company with the experienced and mature, you can rely on them in a crisis. When you hear something said carelessly, how do you know it is not a slander by someone else? Be patient and think it over three times. When you quarrel over some matter, how do you know it is not you who are in the wrong? Calm your mind and reflect quietly.<\/p>\n<p>Do not dwell on the kindness you have given, and never forget the kindness you have received. In all things leave some room to spare, and do not go back again to a place where you have already succeeded. When others have cause for celebration, do not feel envy; when others suffer misfortune, do not feel glad. A good deed that you want others to see is not true goodness; an evil deed that you fear others will learn of is great evil indeed. If you give rise to lust at the sight of beauty, the retribution will fall on your wife and daughters; if you hide resentment and shoot hidden arrows, the disaster will extend to your descendants.<\/p>\n<p>When the household is harmonious and peaceful, even if meals are not assured, there is still joy to spare; when the taxes of the state are paid early, even if your purse is empty, you will naturally find the greatest happiness. In study, set your aim on the sages; in office, keep the ruler and the country in your heart. Be content with your lot and accept your fate; follow the times and leave the outcome to Heaven. If you live this way, you will come close to the ideal.<\/p>\n<hr />\n<p><a href=\"http://tw.news.yahoo.com/花蓮推讀經-人本-應家長同意-050027590.html\">http://tw.news.yahoo.com/花蓮推讀經-人本-應家長同意-050027590.html<\/a><\/p>", "zt": "小朋友在花蓮念書很多地方都不錯, 但是唯獨這種儒家思想的…"}, {"id": "f1366795971", "file": "2013-04-24-f1366795971", "date": "2013-04-24", "title": "Opposite Case Study", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "Work & Moving", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A disappointing meal at a chain restaurant in Hualien becomes a service-encounter case study, seen through the lens of service theatre and service recovery.", "len": 287, "body": "<p>Opposite Case Study<\/p>\n<p>In April I had a meal at a chain restaurant in Hualien. I wanted to order the extra-large beef rice bowl, large size, NT$159 (it is right there on the printed menu!), but the server told me there was only the small set meal at NT$139. I asked why it wasn't available.<\/p>\n<p>Server: Sorry, only our noodle dishes can be upsized.<\/p>\n<p>Me: But it's on the colour menu from your head office.<\/p>\n<p>Server: Really?<\/p>\n<p>Me: Go and get the menu at the counter and show her. Look!<\/p>\n<p>Server: Oh, well, we still don't sell it, because if we upsize rice dishes, it doesn't work with our costs.<\/p>\n<p>Me: Speechless...<\/p>\n<p>This was only my second visit since I had been looking forward to this chain reopening in Hualien. The first time, the staff ignored me and the service attitude disappointed me so much that I stayed away for a while. Recently I saw the staff had changed and wanted to give them another chance, and it turned out to be even more disappointing!!<\/p>\n<p>In the end I sent the company a private message on its Facebook page, asking them to keep up the effort!!<\/p>\n<p>Their reply was as follows...<\/p>\n<p>From the viewpoint of service theatre theory, a service encounter contains many moments that offer a chance for service recovery. This is especially true when a loyal customer makes a suggestion politely: the front-line staff member should be the lead performer in a show, rather than explaining things to the customer in terms of internal costs. But then, perhaps this shop is a franchise and it really was the proprietress herself explaining to me that one upsized bowl of rice would put them out of business!<\/p>", "zt": "Opposite Case Study"}, {"id": "f1366701411", "file": "2013-04-23-f1366701411", "date": "2013-04-23", "title": "No Need to Pay for Language Schools or Buy Self-Study Books!", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Two English teachers from the Department of Tourism and Hospitality offer a free TOEIC and English proficiency preparation course, with a refundable NT$300 deposit.", "len": 186, "body": "<p>No need to pay for a language school! No need to buy self-study books!!<\/p>\n<p>Two excellent English teachers from the Department of Tourism and Hospitality will help you get a high TOEIC score for free!!!<\/p>\n<p>~~~~~English Proficiency Test Preparation Course~~~~~<\/p>\n<p>As part of the Northern Region Teaching Resource Center project, we are offering an \"English Proficiency Test Preparation Course.\" Students are welcome to sign up.<\/p>\n<p>The course details are below. Please help spread the word. Thank you.<\/p>\n<p>Yours sincerely, Yu-Chia Liu, Department of Tourism and Hospitality<\/p>\n<p>※ Details:<\/p>\n<ol>\n<li>\n<p>Course: \"English Proficiency Test Preparation Course\"<\/p>\n<\/li>\n<li>\n<p>Dates: April 24 to May 16<\/p>\n<\/li>\n<\/ol>\n<p>Class A (Grammar and Writing): every Monday 6:00-9:00 pm and Wednesday 2:00-5:00 pm;<\/p>\n<p>Class B (Listening and Reading): every Tuesday 6:00-9:00 pm and Thursday 2:00-5:00 pm.<\/p>\n<ol start=\"3\">\n<li>\n<p>Location: Room 201, Tourism Building<\/p>\n<\/li>\n<li>\n<p>Capacity: 30 students<\/p>\n<\/li>\n<li>\n<p>Registration: Please sign up at the Department of Tourism and Hospitality office.<\/p>\n<\/li>\n<li>\n<p>Notes:<\/p>\n<\/li>\n<\/ol>\n<p>Registration is free, but to keep up a good learning atmosphere, a deposit of NT$300 is required;<\/p>\n<p>If you miss no more than 3 classes (inclusive), the deposit will be refunded in full at the end of the course.<\/p>", "zt": "花錢去地球村不必! 買書自修不必!!"}, {"id": "f1365588859", "file": "2013-04-10-f1365588859", "date": "2013-04-10", "title": "Department of Tourism and Hospitality Offers a Course on Mobile Media Concepts and App Production", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Courses & Classrooms", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The department is hosting a free introductory course on Android and app design, with 20 places. Students and faculty are welcome to register.", "len": 202, "body": "<p>The Department of Tourism and Hospitality is running the Northern Region Teaching Resource Center project and is offering the course \"Introduction to Mobile Media Concepts and Production\". Students and faculty are welcome to sign up. Course details are below, and we would appreciate your help in announcing it. Thank you.<\/p>\n<p>Respectfully, Kuei-Yuan Tsou, Department of Tourism and Hospitality<\/p>\n<p>Course details:<\/p>\n<p>(1) Purpose: To introduce the Android system, and to design and publish an app.<\/p>\n<p>(2) Instructor: Associate Professor Yu-Tseng Lin, Director of the Library and Information Center.<\/p>\n<p>(3) Time: Starting 17 April 2013 (ROC year 102), every Wednesday from 3:00 to 5:00 pm.<\/p>\n<p>Venue: Room 402, Library and Information Building.<\/p>\n<p>(4) Capacity: 20 people.<\/p>\n<p>(The class is kept small to make coaching easier and to improve learning outcomes.)<\/p>\n<p>(5) Registration: Please complete the online registration form before the course begins; places are limited and will close once full. Link:<\/p>\n<p><a href=\"https://docs.google.com/a/mail.tht.edu.tw/spreadsheet/viewform?formkey=dFVVVDBudW5qNl9yQ1FIdGRzU3BKaWc6MQ\">https://docs.google.com/a/mail.tht.edu.tw/spreadsheet/viewform?formkey=dFVVVDBudW5qNl9yQ1FIdGRzU3BKaWc6MQ<\/a><\/p>\n<p>(6) Contact: Project assistant Hsin-Tao Lu (student)<\/p>\n<p>(Email: 10168103@mail.tht.edu.tw)<\/p>\n<p>(7) Notes:<\/p>\n<p>Registration is free, but to maintain a good learning atmosphere a deposit of NT$300 is required.<\/p>\n<p>Participants who miss no more than 3 sessions will receive a full refund at the end of the course, along with a certificate of training.<\/p>", "zt": "觀光餐旅系承辦北區教學資源中心計畫，開設「行動媒體概念與…"}, {"id": "f1363354035", "file": "2013-03-15-f1363354035", "date": "2013-03-15", "title": "The Best-Value Investment You Can Make in Yourself", "cat": "Ageing Well", "cats": ["Ageing Well"], "sub": "Health", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A recommendation for Master Chen Guo-Zhang's new book on practising qigong at home, a quick way for busy people to sweat out stress and renew their energy.", "len": 183, "body": "<p>The Best-Value Investment You Can Make in Yourself<\/p>\n<p>At the NCCU Bookstore I came across Master Chen Guo-Zhang's new book, [Practising Qigong at Home]. Let me ask Ah-Gou to speak up and recommend it:<\/p>\n<p>This book really is a rescue for busy modern people like us, who live every day under pressure from time and social obligations. Master Chen introduces basic exercises that work from the outside in, softening the muscles and loosening the tendons. In the least time and space, in just a short while they draw out a body full of sweat and stale breath, replacing them with a clear and carefree physical state. I have personally benefited enormously from it to this day, and on the strength of my own experience and rich rewards I recommend Master Chen's book to readers. I hope more people who love martial arts will make this best-value investment in their own health and future lives, and I hope every reader will follow the illustrations step by step and enjoy the surprising feeling of body, energy and spirit all made new.<\/p>\n<p>Books.com.tw online bookstore: <a href=\"http://www.books.com.tw/exep/prod/booksfile.php?item=0010578011\">http://www.books.com.tw/exep/prod/booksfile.php?item=0010578011<\/a><\/p>", "zt": "對自己最實惠的投資"}, {"id": "f1345696262", "file": "2012-08-23-f1345696262", "date": "2012-08-23", "title": "Due to the typhoon, check-in originally set for 8/25 (Sat) will be done by mail", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "Admissions & Falling Birth Rate", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Because of the typhoon, new students admitted through the college's independent admission must check in by mail instead of in person on 8/25.", "len": 245, "body": "<p>Due to the typhoon, check-in originally scheduled for 8/25 (Sat) has been changed to check-in by mail.<\/p>\n<p>The details are as follows:<\/p>\n<p>Colleagues, please help pass this on to new students when you receive their calls. Thank you.<\/p>\n<p>Taiwan Hospitality &amp; Tourism College: Check-in and Registration Instructions for the Independent Admission to the Four-Year and Two-Year Vocational Day Programmes<\/p>\n<ol>\n<li>\n<p>Time of sending the results and admission notices: Thursday, 101.08.23 (2012-08-23) at 5:00 pm, delivered by courier.<\/p>\n<\/li>\n<li>\n<p>Check-in instructions:<\/p>\n<\/li>\n<li>\n<p>Originally scheduled on-site check-in: Saturday, 101.08.25, 1:00 pm to 4:00 pm.<\/p>\n<\/li>\n<\/ol>\n<p>(Because of Typhoon Tembin, all check-in will be done by mail. Admitted students should mail their check-in documents to the college's Admissions Office by 8/28 (Tue).)<\/p>\n<ol start=\"3\">\n<li>\n<p>Admitted students who wish to apply for dormitory housing should register for beds online starting at 8:00 am on 8/24 (Fri).<\/p>\n<\/li>\n<li>\n<p>Uniform fitting can be done on the New Student Orientation Day, Wednesday, September 12, 1:30 pm to 4:00 pm.<\/p>\n<\/li>\n<li>\n<p>Documents to bring for check-in:<\/p>\n<\/li>\n<li>\n<p>The original graduation certificate or certificate of attendance.<\/p>\n<\/li>\n<li>\n<p>Four 2-inch photos (write on the back: independent admission, admitted programme, department, name).<\/p>\n<\/li>\n<li>\n<p>Photocopies of the front and back of the ID card.<\/p>\n<\/li>\n<li>\n<p>Documents proving special status (supporting documents required, e.g. low-income household certificate, indigenous household registration transcript or disability handbook, for tuition and fee reductions).<\/p>\n<\/li>\n<li>\n<p>Complete payment by Friday, September 7.<\/p>\n<\/li>\n<li>\n<p>Dormitories open at 08:00 on Saturday, September 8.<\/p>\n<\/li>\n<li>\n<p>New Student Orientation Days are Monday to Wednesday, September 10-12, 08:00 to 17:00. New students must attend.<\/p>\n<\/li>\n<\/ol>", "zt": "因颱風影響原訂8/25(六)報到，改為通訊報到，"}, {"id": "f1345435415", "file": "2012-08-20-f1345435415", "date": "2012-08-20", "title": "To Our Graduates (Please Recommend Hualien to Your Juniors)", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "Admissions & Falling Birth Rate", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A message to graduates, asking them to recommend Taiwan Hospitality & Tourism College and life in Hualien to younger students before the independent-admission deadline on 8/23.", "len": 305, "body": "<p>To Our Graduates (Please Recommend Hualien to Your Juniors)<\/p>\n<p>Now that you have graduated, do you ever think back to the days when you left home and came from all over the island to live on the east coast, going through the sweet and sour of adapting and learning? I believe that amid your busy lives in western Taiwan, the beauty of Hualien and the leisurely pace of campus life still linger deep in your hearts. Besides the mountains, the countryside and the starry skies, I believe you also found lifelong friends or partners here. I did too. Because you walked this road with me, my life in Hualien has been so rich and wonderful.<\/p>\n<p>If you are nostalgic and willing to recommend us, and the people and things at Taiwan Hospitality &amp; Tourism College still mean something to you, Teacher Ruifeng hopes you can help recommend your juniors to come and enjoy the good life in Hualien. Our college's independent admission is under way. They can register for the exam online, and the final deadline is Thursday, 8/23. You are welcome to recommend your juniors, or relatives and friends, to study in Hualien. Tell them this is a short study-abroad experience within Taiwan, one that will bring challenges and, even more, plenty of rewards.<\/p>\n<p>Registration system (http://ibook.tht.edu.tw/newman)<\/p>\n<p>Online exam for the Independent Admission to Four-Year and Two-Year Technical Programmes <a href=\"http://ibook.tht.edu.tw/newman/testlogin.aspx\">http://ibook.tht.edu.tw/newman/testlogin.aspx<\/a><\/p>\n<p>Final deadline: 8/23 (Thu), 12:00 noon<\/p>\n<p>Your interested juniors can contact me through FB or MSN, and of course you can also ask teachers in the department whom you know better to help them register!!<\/p>\n<p>Here are the important registration links. Feel free to contact me, and please do share this post~<\/p>\n<p>Registration system (http://ibook.tht.edu.tw/newman)<\/p>\n<p>Online exam for the Independent Admission to Four-Year and Two-Year Technical Programmes <a href=\"http://ibook.tht.edu.tw/newman/testlogin.aspx\">http://ibook.tht.edu.tw/newman/testlogin.aspx<\/a><\/p>\n<p>Final deadline: 8/23 (Thu), 12:00 noon<\/p>", "zt": "給畢業生(歡迎你們推薦學弟妹來花蓮)"}, {"id": "f1336223553", "file": "2012-05-05-f1336223553", "date": "2012-05-05", "title": "Gengsheng Daily", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A Gengsheng Daily report on the Taiwan Hospitality & Tourism College travel management graduation exhibition in Hualien, themed on green tourism.", "len": 195, "body": "<p>2012-05-05 Gengsheng Daily<\/p>\n<p>Photo: Aboriginal-style dishes made of paper, using the colours of paper and natural materials to recreate indigenous cuisine. (Photo by reporter Jung Jen-shun / Reported by reporter Cheng Ke-hsin)<\/p>\n<p>The graduation exhibition of the Department of Travel Management at Taiwan Hospitality &amp; Tourism College is being held yesterday and today from 1:30 pm to 5:00 pm at the Heping Plaza of Far Eastern Department Store in Hualien. This year's exhibition takes green tourism as its concept: green tourism not only protects the environment but also serves as a way of learning. All the works on display were created by students after months of careful thought and effort, and the exhibition is lively and fun. The public is warmly invited to come and see it.<\/p>\n<p>The exhibition also features interactive games and a dance performance by the college's Indigenous Peoples Club, giving visitors a first-hand experience of indigenous culture and a deeper understanding of its richness. The event is lively and varied: besides static guided displays, there are dynamic activities, including DIY handmade souvenirs, a low-carbon food feast, an eco-friendly fashion hair show, charity haircuts, a plant adoption drive and band performances.<\/p>\n<p><a href=\"http://www.ksnews.com.tw/newsdetail.php?n_id=0000247101&amp;level2_id=104\">http://www.ksnews.com.tw/newsdetail.php?n_id=0000247101&amp;level2_id=104<\/a><\/p>", "zt": "更生日報"}, {"id": "f1335790138", "file": "2012-04-30-f1335790138", "date": "2012-04-30", "title": "Register Online", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Courses & Classrooms", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "How to register online for a MICE industry training course, plus the full 19-session curriculum on service etiquette, teamwork, exhibition planning and event management.", "len": 181, "body": "<p>Register Online<\/p>\n<ol>\n<li>\n<p>First go to the Vocational Training e-Network: <a href=\"http://www.etraining.gov.tw/index.html\">http://www.etraining.gov.tw/index.html<\/a> and join as a member<\/p>\n<\/li>\n<li>\n<p>Then register at the Industry Talent Investment Programme website: <a href=\"http://tims.etraining.gov.tw/timsonline/index.aspx\">http://tims.etraining.gov.tw/timsonline/index.aspx<\/a><\/p>\n<\/li>\n<\/ol>\n<p>Course Content<\/p>\n<ol>\n<li>\n<p>Introduction to Service Etiquette (1 hour)<\/p>\n<\/li>\n<li>\n<p>Work Teams and Teamwork Methods (I) (2 hours)<\/p>\n<\/li>\n<li>\n<p>Work Teams and Teamwork Methods (II) (3 hours)<\/p>\n<\/li>\n<li>\n<p>Overview of the MICE Industry in the Hualien–Taitung Area (3 hours)<\/p>\n<\/li>\n<li>\n<p>Basic Structure and Policy of the MICE Industry (3 hours)<\/p>\n<\/li>\n<li>\n<p>Introduction to Conventions, Exhibitions and International Conferences (3 hours)<\/p>\n<\/li>\n<li>\n<p>MICE Budgeting and Proposal Writing (3 hours)<\/p>\n<\/li>\n<li>\n<p>MICE Marketing Planning (3 hours)<\/p>\n<\/li>\n<li>\n<p>Exhibition Event Planning (3 hours)<\/p>\n<\/li>\n<li>\n<p>Incentive Travel Marketing (3 hours)<\/p>\n<\/li>\n<li>\n<p>On-site Conference Management Skills (3 hours)<\/p>\n<\/li>\n<li>\n<p>Practical Drills on Conference Registration and Reception Procedures (3 hours)<\/p>\n<\/li>\n<li>\n<p>Practical MICE English (3 hours)<\/p>\n<\/li>\n<li>\n<p>Conference Operations Planning in Practice (3 hours)<\/p>\n<\/li>\n<li>\n<p>MICE Venue Planning and Use: Audiovisual Equipment and Traffic Flow (3 hours)<\/p>\n<\/li>\n<li>\n<p>Exhibition Publicity Materials, Venue Decoration and Human Resource Management (3 hours)<\/p>\n<\/li>\n<li>\n<p>Case Analysis of MICE Marketing Events (3 hours)<\/p>\n<\/li>\n<li>\n<p>Practicum in International Conference Events and Programming (tentatively APTA) (3 hours)<\/p>\n<\/li>\n<li>\n<p>Arranged Visits to an International Conference or Exhibition (3 hours)<\/p>\n<\/li>\n<\/ol>", "zt": "採網路報名"}, {"id": "f1312877116", "file": "2011-08-09-f1312877116", "date": "2011-08-09", "title": "To My THT Graduates", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A message to THT alumni, recalling life in Hualien and asking them to recommend the college's 8/28 independent admissions exam to younger friends and relatives.", "len": 265, "body": "<p>To My THT Graduates<\/p>\n<p>Now that you've graduated, do you ever think back on the days when you left home and came from all over the island to live on the east coast, going through the adjustment and all the ups and downs of learning? I'm sure that amid your busy lives wherever you are now, the beauty of Hualien and the easy pace of campus life still linger deep in your hearts. Besides the mountains, the fields and the starry skies, I believe you also found lifelong friends or partners here. I did too. Because you walked this road with me, my life in Hualien has been so rich and wonderful.<\/p>\n<p>If you feel nostalgic and are willing to recommend us: if the people and things at Taiwan Hospitality &amp; Tourism College still mean something to you, I hope you can help recommend to your junior schoolmates the joys of life in Hualien. On 8/28 the college will hold its independent admissions exam. You are welcome to recommend it to your younger schoolmates, relatives or friends who want to study in Hualien. Tell them this is a little taste of studying abroad, right here in Taiwan. There will be challenges, and plenty of rewards too.<\/p>\n<p>You can contact me via FB or email. I can help fill out the application form, pay the registration fee and so on. Feel free to get in touch~<\/p>\n<p>Teacher Ray<\/p>\n<p>8/28 exam venues:<\/p>\n<p>East: Taiwan Hospitality &amp; Tourism College<\/p>\n<p>North: National Taipei University of Technology<\/p>\n<p>Central: National Taichung Institute of Technology<\/p>\n<p>South: National Kaohsiung University of Applied Sciences<\/p>", "zt": "給畢業的THT校友們"}, {"id": "f1288186487", "file": "2010-10-27-f1288186487", "date": "2010-10-27", "title": "Travel Reminders for Thailand and Bali from the Bureau of Consular Affairs (27 October 2010)", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Bangkok, Thailand", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A relayed press release from Taiwan's Bureau of Consular Affairs reminding travellers about flooding in Thailand and the rabies threat in Bali, Indonesia.", "len": 179, "body": "<p>Relaying the press release issued by the Bureau of Consular Affairs, Ministry of Foreign Affairs, on 27 October 2010 (ROC year 99), reminding Taiwanese travellers of points to note when travelling to Thailand and Bali, Indonesia for business or leisure (latest information published on the Bureau's website <a href=\"http://www.boca.gov.tw\">http://www.boca.gov.tw<\/a>):<\/p>\n<ol>\n<li><\/li>\n<\/ol>\n<p>Thailand: The flooding that has hit the northern, northeastern and central regions of Thailand since the 10th of this month has clearly improved. The travel alert for the whole of Thailand remains at yellow. Before travelling to Thailand, please check local weather reports and traffic conditions first. If your itinerary in Thailand includes a river cruise, the water levels of the Chao Phraya River and rivers in other provinces are high and the currents are swift, so please confirm with the travel agency arranging your trip whether it can go ahead, for your own<\/p>\n<p>safety.<\/p>\n<ol start=\"2\">\n<li>Bali, Indonesia: Bali continues to face the threat of rabies, and the outbreak has not been effectively brought under control. If you are travelling there, please take particular care to protect yourself and avoid infection.<\/li>\n<\/ol>", "zt": "轉述外交部領事事務局99年10月27日發布之新聞稿，提醒…"}];

const b64dec=t=>new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\n/g,'')),c=>c.charCodeAt(0)));
function b64enc(str){ const u=new TextEncoder().encode(str); let s=''; for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(s); }
async function hideArticle(file, btn){
  const tok=ghToken();
  if(!tok){ window.open('../admin/#/collections/articles_en/entries/'+file,'_blank'); return; }
  btn.textContent='Hiding…';
  const url=`https://api.github.com/repos/${REPO}/contents/content/en/articles/${encodeURIComponent(file)}.md`;
  const H={Authorization:'Bearer '+tok, Accept:'application/vnd.github+json'};
  try{
    const r=await fetch(url+'?ref=main',{headers:H}); if(!r.ok) throw new Error(r.status);
    const j=await r.json(); let t=b64dec(j.content);
    t=/^published:.*$/m.test(t)? t.replace(/^published:.*$/m,'published: false') : t.replace(/^---\n/,'---\npublished: false\n');
    const w=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:'Hide English article: '+file,content:b64enc(t),sha:j.sha,branch:'main'})});
    if(!w.ok) throw new Error(w.status);
    const i=ARTS.findIndex(a=>a.file===file); if(i>=0) ARTS.splice(i,1);
    btn.textContent='Hidden'; btn.classList.remove('armed');
    toast('Hidden. The site updates in 1–2 minutes. To restore it, switch “published” back on in the admin.');
    setTimeout(()=>{ if(location.hash.startsWith('#a-')) location.hash='#writing'; else route(); },1200);
  }catch(err){ btn.textContent='Hide'; btn.classList.remove('armed'); toast('Could not hide ('+err.message+'). Please switch “published” off in the admin.'); }
}

const year = a => a.date.slice(0,4);
function matchQ(a){ const q=filt.q.trim(); return !q || a.title.includes(q) || a.body.includes(q); }
function inYear(a){ return !filt.year || year(a)===filt.year; }
function inCat(a){ return (!filt.cat||catsOf(a).includes(filt.cat)) && (!filt.sub||(a.cat===filt.cat&&a.sub===filt.sub)) && (!filt.det||(a.cat===filt.cat&&a.det===filt.det)); }
function tally(list, key){ const m=new Map(); list.forEach(a=>{ [].concat(key(a)).forEach(k=>{ if(k) m.set(k,(m.get(k)||0)+1); }); }); return m; }
function renderSide(){
  const base = ARTS.filter(matchQ);
  const forYears = base.filter(inCat), forCats = base.filter(inYear);
  const ys = [...tally(forYears, year).entries()].sort((a,b)=>b[0].localeCompare(a[0]));
  const btn = (f,v,label,n,on,cls='') => `<button type="button" class="tb ${cls} ${on?'on':''}" data-f="${f}" data-v="${esc(v)}"><span>${label}</span><i>${n}</i></button>`;
  let h = `<h4>Year</h4><div class="years">${btn('year','','All',forYears.length,!filt.year,'y')}${ys.map(([y,n])=>btn('year',y,y,n,filt.year===y,'y')).join('')}</div>`;
  h += `<h4>Topics</h4><ul class="tree">${`<li>${btn('cat','','All topics',forCats.length,!filt.cat)}</li>`}`;
  const cc = tally(forCats, catsOf);
  for(const c of [...CATS].sort((x,y)=>(cc.get(y)||0)-(cc.get(x)||0))){
    if(!cc.get(c)) continue;
    const open = filt.cat===c;
    h += `<li>${btn('cat',c,`<b class="dot" style="background:${(ICON[c]||ICON['Life & Memories'])[1]}"></b>${c}`,cc.get(c),open&&!filt.sub)}`;
    if(open){
      const inC = forCats.filter(a=>a.cat===c);
      const subs = [...tally(inC, a=>a.sub).entries()].sort((a,b)=>b[1]-a[1]);
      h += `<ul>${subs.map(([sb,n])=>{
        const so = filt.sub===sb;
        let li = `<li>${btn('sub',sb,sb,n,so&&!filt.det,'t2')}`;
        if(so){
          const dets=[...tally(inC.filter(a=>a.sub===sb), a=>a.det).entries()].sort((a,b)=>b[1]-a[1]);
          if(dets.length) li += `<ul>${dets.map(([d,m])=>`<li>${btn('det',d,d,m,filt.det===d,'t3')}</li>`).join('')}</ul>`;
        }
        return li+'</li>';
      }).join('')}</ul>`;
    }
    h += '</li>';
  }
  h += '</ul>';
  const total = ARTS.filter(a => matchQ(a) && inYear(a) && inCat(a)).length;
  h += `<button type="button" class="chip see-res" id="seeres">See ${total} articles ↓</button>`;
  document.getElementById('side').innerHTML = h;
  const parts=[];
  if(filt.year) parts.push(['year',filt.year]);
  if(filt.cat) parts.push(['cat',[filt.cat,filt.sub,filt.det].filter(Boolean).join(' › ')]);
  if(filt.q.trim()) parts.push(['q','Search: “'+filt.q.trim()+'”']);
  document.getElementById('crumbs').innerHTML = parts.map(([k,t])=>`<button type="button" class="crumb hand" data-clear="${k}">${esc(t)} <span aria-hidden="true">✕</span></button>`).join('') + (parts.length>1?`<button type="button" class="crumb clear-all" data-clear="all">Clear all</button>`:'');
}
function renderList(){

  return `<h1 style="font-size:34px;margin-bottom:6px">Teaching</h1><p class="lead" style="margin:0">Course resources, licensing exam prep and internship experience for tourism students at Hsing Wu University and beyond.</p>
  <section><div class="cols">
    <div class="box hand">${doodle('Licensing Exams')}<h3>Tour Leader &amp; Guide Licensing</h3><ul><li>Course notes for tour leaders and guides</li><li>Mock exam questions</li><li>Daily exam countdown (now in Writing)</li></ul></div>
    <div class="box hand">${doodle('Travel & Cruises')}<h3>Cruises, Travel Fairs &amp; Micro-credits</h3><ul><li>Cruise tourism</li><li>ITF Taipei International Travel Fair</li><li>Micro-credit course sign-up</li></ul></div>
    <div class="box hand">${doodle('Vocational Education')}<h3>Tourism Law Cases</h3><ul><li>Comparing the Gansu and Japan tour cases</li><li>Travel agency financial analysis</li></ul></div>
  </div><p class="note">These three sections still live on the old Google Sites page; handouts, notes and downloads will move here.</p></section>
  <section><div class="sec-head"><h2>Related articles</h2></div><div class="cards">${t.map(card).join('')}</div></section>`;
}

function travel(){
  const t = ARTS.filter(a=>catsOf(a).includes('Travel & Cruises'));
  const place = (code,name,txt,col)=>`<div class="box hand"><svg class="doodle" viewBox="0 0 76 76" aria-hidden="true"><ellipse cx="38" cy="40" rx="31" ry="27" fill="${col}" opacity=".75" filter="url(#wash)"/><text x="38" y="47" text-anchor="middle" font-family="LXGW WenKai TC, serif" font-size="20" font-weight="700" fill="#4a3426">${code}</text></svg><h3>${name}</h3><p>${txt}</p></div>`;
  return `<h1 style="font-size:34px;margin-bottom:6px">Travel</h1><p class="lead" style="margin:0">Notes from leading tours, student study trips and travelling on my own.</p>
  <section><div class="cols">
    ${place('BKK','Thailand','Currently on the old Google Sites Thailand page; moving here soon.','#f2d488')}
    ${place('NGO','Nagoya','Currently on the old Google Sites Nagoya page; moving here soon.','#f1b79c')}
    ${place('YVR','Canada','Hsing Wu tourism students’ study tour to Vancouver and Victoria.','#a9c9d9')}
  </div></section>
  <section><div class="sec-head"><h2>Travel articles</h2></div><div class="cards">${t.map(card).join('')}</div></section>`;
}

function cvBlock(){
  const cv=(ABOUT.cv||[]).filter(x=>x&&x.title&&(x.items||[]).length);
  if(!cv.length) return '';
  const groups=[]; cv.forEach((x,i)=>{x._id='cv-'+i; const g=x.group||''; let G=groups.find(y=>y.g===g); if(!G){G={g,list:[]};groups.push(G);} G.list.push(x);});
  const row=it=>`<li>${it.year?`<span class="y">${esc(String(it.year))}</span>`:''}<span class="t">${esc(String(it.text||''))}${it.note?`<span class="n">${esc(String(it.note))}</span>`:''}</span></li>`;
  const sec=x=>{
    const its=x.items, noy=!its.some(it=>it.year), avg=its.reduce((n,it)=>n+String(it.text||'').length,0)/its.length;
    const wide=avg>60||its.length>10, MAX=(+x.show>0)?+x.show:(wide?6:8);
    const cls='cv-list'+(noy?' noyear':'');
    return `<div class="cv-sec hand${wide?' wide':''}" id="${x._id}"><h4>${esc(x.title)}<span>${its.length}</span></h4>
      <ul class="${cls}">${its.slice(0,MAX).map(row).join('')}</ul>
      ${its.length>MAX?`<details><summary>Show ${its.length-MAX} more</summary><ul class="${cls}">${its.slice(MAX).map(row).join('')}</ul></details>`:''}</div>`;
  };
  return `<section id="cv"><div class="cv-head"><h2>${esc(ABOUT.cv_title||'Curriculum Vitae')}</h2>${ABOUT.cv_updated?`<small>Updated ${esc(String(ABOUT.cv_updated))}</small>`:''}</div>
    <div class="cv-nav">${cv.map(x=>`<a class="chip" href="#hello" data-cv="${x._id}">${esc(x.title)}</a>`).join('')}</div>
    ${groups.map(G=>`<div class="cv-group">${G.g?`<h3>${esc(G.g)}</h3>`:''}<div class="cv-grid">${G.list.map(sec).join('')}</div></div>`).join('')}</section>`;
}

function hello(){
  const icons=['Morning Reading','Vocational Education','Life & Memories','Travel & Cruises','Licensing Exams','Game-Based Learning'];
  const ext=h=>h.replace(/<a href="http/g,'<a target="_blank" rel="noopener" href="http');
  return `${EDIT?`<div style="text-align:right;margin-bottom:-10px"><span class="edit-btn" role="link" tabindex="0" data-edit-about="1" title="Edit the About page in admin">✎ Edit About page</span></div>`:''}<div class="article">${ABOUT.lead?`<div class="lead">${esc(ABOUT.lead)}</div>`:''}<h1>${esc(ABOUT.title||'')}</h1>
  <div class="prose">${ext(ABOUT.body||'')}</div></div>
  <section>${(ABOUT.boxes||[]).length?`<div class="cols${ABOUT.boxes.length===2?' c2':''}">${ABOUT.boxes.map((x,i)=>`<div class="box hand">${doodle(icons[i%icons.length])}<h3>${esc(x.title)}</h3>${ext(x.text)}</div>`).join('')}</div>`:''}${ABOUT.note?`<p class="note">${esc(ABOUT.note)}</p>`:''}</section>${cvBlock()}`;
}

function route(){
  const h = (location.hash||'#home').slice(1);
  let v = h.startsWith('a-') ? 'writing' : (['home','writing','teaching','travel','hello'].includes(h)?h:'home');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(h.startsWith('a-')) app.innerHTML = article(h.slice(2));
  else if(v==='writing'){ app.innerHTML = writing(); renderList(); }
  else app.innerHTML = ({home,teaching,travel,hello})[v]();
  window.scrollTo(0,0);
}
document.addEventListener('click', e=>{ const L=e.target.closest('[data-lang]'); if(L){ e.preventDefault(); location.href=L.getAttribute('href')+location.hash; } });
app.addEventListener('input', e=>{ if(e.target.id==='q'){ filt.q=e.target.value; filt.n=PER; renderList(); }});
app.addEventListener('click', e=>{
  const ed = e.target.closest('[data-edit]');
  if(ed){ e.preventDefault(); e.stopPropagation(); window.open('../admin/#/collections/articles_en/entries/'+ed.dataset.edit,'_blank'); return; }
  { const c=e.target.closest('[data-cv]'); if(c){ e.preventDefault(); const t=document.getElementById(c.dataset.cv); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); return; } }
  if(e.target.closest('[data-edit-about]')){ e.preventDefault(); window.open('../admin/#/collections/settings_en/entries/about','_blank'); return; }
  if(e.target.closest('[data-edit-home]')){ e.preventDefault(); window.open('../admin/#/collections/settings_en/entries/home','_blank'); return; }
  const hd = e.target.closest('[data-hide]');
  if(hd){ e.preventDefault(); e.stopPropagation();
    if(!hd.classList.contains('armed')){ hd.classList.add('armed'); hd.textContent='Hide it?'; setTimeout(()=>{ if(hd.classList.contains('armed')){ hd.classList.remove('armed'); hd.textContent='Hide'; } },4000); return; }
    hideArticle(hd.dataset.hide, hd); return; }
  const f = e.target.closest('[data-f]');
  if(f){ const k=f.dataset.f, v=f.dataset.v;
    if(k==='year') filt.year=v;
    else if(k==='cat'){ filt.cat=v; filt.sub=''; filt.det=''; }
    else if(k==='sub'){ filt.sub=v; filt.det=''; }
    else if(k==='det'){ filt.det=v; }
    filt.n=PER; renderList(); return; }
  if(e.target.id==='seeres'){ document.getElementById('sidebox').open=false; document.getElementById('crumbs').scrollIntoView({behavior:'smooth'}); return; }
  const cl = e.target.closest('[data-clear]');
  if(cl){ const k=cl.dataset.clear;
    if(k==='year'||k==='all') filt.year='';
    if(k==='cat'||k==='all'){ filt.cat=''; filt.sub=''; filt.det=''; }
    if(k==='q'||k==='all'){ filt.q=''; const qi=document.getElementById('q'); if(qi) qi.value=''; }
    filt.n=PER; renderList(); return; }
  if(e.target.id==='more'){ filt.n+=PER; renderList(); return; }
  const g = e.target.closest('[data-go]');
  if(g){ filt.cat=g.dataset.go; filt.sub=''; filt.det=''; filt.year=''; filt.q=''; filt.n=PER; location.hash='writing'; }
});
window.addEventListener('hashchange', route);
route();
</script>
