 all the teachers.<\/p>\n<p>I did not cry at the time, and neither did my classmate. The \"big brother\" said to me sincerely: \"Sorry, it won't happen again.\"<\/p>\n<p>Even as I type these words, I can still feel the burning heat on my backside and the heartache of humiliation and resentment!<\/p>\n<p>But from that day on, I no longer had to be afraid walking around outside in Yonghe, I felt no unease inside, I could study again, and I slept until I could hardly get up.<\/p>\n<p>But to this day, I still hate my second-year homeroom teacher.<\/p>", "zt": "【拒絕的勇氣需要培養】"}, {"id": "f1521641099", "file": "2018-03-21-f1521641099", "date": "2018-03-21", "title": "Taiwan's Tourism Knowledge Revolution", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Travel Industry & Transport", "det": "Travel Agencies", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "An invitation to the RTM Association inaugural meeting and the Big Travel Innovation Era 5 forum in Taipei on 24 March 2018, free to attend.", "len": 198, "body": "<p>【Taiwan's Tourism Knowledge Revolution】<\/p>\n<p>On 3/24 (Sat), the RTM Association will take the pulse of the future of Taiwan's tourism and travel industry!<\/p>\n<p>Teachers and friends are all welcome to join!<\/p>\n<p>【RTM Association Inaugural Meeting &amp; Big Travel Innovation Era 5 Forum: Knowledge Revolution × Play-Work Uprising】<\/p>\n<p>｜Date｜Saturday, 24 March 2018<\/p>\n<p>｜Time｜10:30-18:00 (doors open for check-in at 10:00)<\/p>\n<p>｜Venue｜2F, No. 151, Shitan Road, Neihu District, Taipei City<\/p>\n<p>｜Admission｜Free<\/p>\n<p>｜Who should attend｜<\/p>\n<p>Whether or not you work in the travel industry, you are welcome if you support innovation and young people, care about Taiwan with passion, want to find a job in the travel industry, or want to learn tourism industry knowledge and future trends and insights!<\/p>\n<p>🔴 Free forum registration<\/p>\n<p><a href=\"https://lihi.cc/DMPDB/0321spkr\">https://lihi.cc/DMPDB/0321spkr<\/a><\/p>\n<p>🔴 Knowledge-learning membership application<\/p>\n<p><a href=\"https://lihi.cc/1cl0E/0321spkr\">https://lihi.cc/1cl0E/0321spkr<\/a><\/p>\n<p>◇ 10:00 - 10:30【Check-in and Entry】<\/p>\n<p>◇ 10:30 - 11:00【No More Travel Startups】<\/p>\n<p>◇ 11:00 - 12:30【Hotel-Booking OTAs and Super Technology】<\/p>\n<p>... 12:30 - 13:00 Break ...<\/p>\n<p>◇ 13:00 - 14:00【RTM Association Inaugural Meeting】<\/p>\n<p>◇ 14:00 - 15:00【The Truth and Illusion of Travel Agency Innovation】<\/p>\n<p>... 15:00 - 15:30 Break ...<\/p>\n<p>◇ 15:30 - 16:30【The Paradigm Shift in Inbound Markets】<\/p>\n<p>◇ 16:30 - 17:30【Peripheral Strategy x Niche Monopoly】<\/p>\n<p>◇ 17:30 - 18:00【Networking】<\/p>", "zt": "【台灣觀光知識革命】"}, {"id": "f1514939928", "file": "2018-01-03-f1514939928", "date": "2018-01-03", "title": "The 2017 WEF Global Competitiveness Index Report…", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Current Affairs", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Taiwan ranks 15th in the 2017 WEF Global Competitiveness Index, ahead of Israel, the UAE, Australia and Korea, with four problem areas above 10 points.", "len": 88, "body": "<p>The 2017 WEF (World Economic Forum) Global Competitiveness Index report. Taiwan ranks 15th in the world, ahead of Israel (16), the UAE (Dubai) (17), Australia (21) and South Korea (26).<\/p>\n<p>But the report points out four problems for us that score above 10:<\/p>\n<ol>\n<li>\n<p>Policy instability 20.2<\/p>\n<\/li>\n<li>\n<p>Restrictive labor regulations 15.7<\/p>\n<\/li>\n<li>\n<p>Insufficient capacity to innovate 15.4<\/p>\n<\/li>\n<li>\n<p>Inefficient government bureaucracy 14.6<\/p>\n<\/li>\n<\/ol>\n<p><a href=\"http://reports.weforum.org/global-competitiveness-index-2017-2018/competitiveness-rankings/\">http://reports.weforum.org/global-competitiveness-index-2017-2018/competitiveness-rankings/<\/a><\/p>\n<p>We are not bad, we just need to work harder. That was my biggest takeaway from being immersed in RTM (pan-tourism) on the first working day of 2018.<\/p>", "zt": "2017 WEF世界經濟論壇的世界競爭力指標Global…"}, {"id": "f1514965754", "file": "2018-01-03-f1514965754", "date": "2018-01-03", "title": "The Ministry of Education is drafting an Act on Off-Campus Internship Education for Colleges, to strengthen ...", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The MOE's draft Off-Campus Internship Education Act for post-secondary schools, with public hearings from 4 January 2018, and its five key points.", "len": 329, "body": "<p>The Ministry of Education is drafting an \"Act on Off-Campus Internship Education for Junior Colleges and Above\" to firmly strengthen the off-campus internship system and protect the rights of interns, and will hold four public hearings starting on 4 January 2018.<\/p>\n<p>Key points of the legislation:<\/p>\n<ol>\n<li>\n<p>The principles for schools running off-campus internship education are written into law. Schools must offer off-campus internship courses according to the nature of each department's specialty and its competency-training needs. If an internship is a graduation requirement, it must be written into the school's regulations, and the school must select suitable internship organisations that meet the requirements for students.<\/p>\n<\/li>\n<li>\n<p>The mechanisms for schools running off-campus internship education are strengthened. Schools must set up internship committees at each level, and must assign staff to guide and visit students during their internships. If students feel their rights are being harmed during an internship, there must be a mechanism for dispute resolution or complaints.<\/p>\n<\/li>\n<li>\n<p>The protection of interns' rights is made explicit. Depending on the content of the internship, off-campus internships are divided into a general type and a work type, with clearly defined rights protections for each type, and the provisions on compensation for injuries arising from learning, training or internship work are strengthened, so as to genuinely safeguard interns' rights and safety during their internships.<\/p>\n<\/li>\n<li>\n<p>The principles for schools arranging internships overseas are strengthened and the protection of overseas interns' rights is increased. Schools must clarify the relevant local laws and visa requirements and properly assess the host organisations. If an intern's rights are harmed and the situation is urgent, the intern must be recalled immediately.<\/p>\n<\/li>\n<li>\n<p>A penalty mechanism is established. Penalty clauses are set out for each type of violation by schools and internship organisations, and for some violations a deadline for improvement is set. If improvement is not completed or proves ineffective, the competent authority may bar the school or internship organisation from running or taking part in off-campus internship education.<\/p>\n<\/li>\n<\/ol>\n<p><a href=\"https://www.edu.tw/News_Content.aspx?n=9E7AC85F1954DDA8&amp;s=BC344F28A3D97395\">https://www.edu.tw/News_Content.aspx?n=9E7AC85F1954DDA8&amp;s=BC344F28A3D97395<\/a><\/p>", "zt": "教育部研擬「專科以上學校校外實習教育法」草案，以確實強化…"}, {"id": "f1505355401", "file": "2017-09-14-f1505355401", "date": "2017-09-14", "title": "I think the China Post wrote this one for us!", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Current Affairs", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Taiwan's sidewalks are clogged with motorcycles, pedestrians have lost their right of way, and good tourism has to start with walking and public transport.", "len": 221, "body": "<p>I think the China Post wrote this one for us!<\/p>\n<p>On the sidewalks of Taiwan's cities, aren't motorcycles parked everywhere too? Pedestrians have lost their right of way entirely. With no sidewalk worth walking on, everyone is pushed onto the road, or simply falls into the habit of riding a motorcycle. This is really an indicator of a country lagging behind, yet everyone turns a blind eye. On this small island of Taiwan, in 2017, there are 13,711,075 motorcycles on the roads, which means nearly every adult in Taiwan has one (data source: <a href=\"http://stat.motc.gov.tw/mocdb/stmain.jsp?sys=100&amp;funid=a3301.\">http://stat.motc.gov.tw/mocdb/stmain.jsp?sys=100&amp;funid=a3301.<\/a>). For the sake of convenience, we let swarms of scooters multiply everywhere like cancer cells in our cities. They kill the look of the city, and they are a problem for national development.<\/p>\n<p>Jakarta, Indonesia, has already begun to deal with this. In Taiwan, by contrast, motorcycle ads are still running nonstop just before the new school term, tempting young students to swap or upgrade their bikes. Yet when our students go on internships in Singapore or Japan, don't they get around perfectly well on foot plus public transport? If Taiwan wants to develop tourism properly, it should start with each of us.<\/p>\n<p>If everyone switched to walking plus public transport, scrapped old motorcycles, and bought fewer new vehicles, Taiwan would slowly become more beautiful!<\/p>\n<p><a href=\"http://www.chinapost.com.tw/asia/2017/09/14/500237/in-traffic-choked.htm\">http://www.chinapost.com.tw/asia/2017/09/14/500237/in-traffic-choked.htm<\/a><\/p>", "zt": "我想這篇是中國郵報寫給我們看的！"}, {"id": "f1483179487", "file": "2016-12-31-f1483179487", "date": "2016-12-31", "title": "Goodbye 2016~", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "International Students", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray's New Year greeting to family, friends and students, with Happy New Year wishes in many Asian languages to welcome 2017.", "len": 163, "body": "<p>Goodbye 2016~<\/p>\n<p>Wishing all my family, teachers, friends, classmates and students a Happy New Year!<\/p>\n<p>They say that if a Facebook post says \"Happy New Year\", it will set off fireworks!<\/p>\n<p>Let's welcome a wonderful and happy 2017 with greetings from across Asia~<\/p>\n<p>Japan: あけましておめでとう (thanks to Hank Li for this one, let's welcome the new year together)<\/p>\n<p>Korea: 새해 복 많이 받으세요 (Corinna Pai 黃茱蒂, let's enjoy 2017 together)<\/p>\n<p>Philippines: Happy New Year<\/p>\n<p>Vietnam: Chúc mừng năm mới<\/p>\n<p>Cambodia: រីករាយឆ្នាំថ្មី<\/p>\n<p>Thailand: สวัสดีปีใหม่<\/p>\n<p>Malaysia: Selamat Tahun Baru<\/p>\n<p>Indonesia: Selamat Tahun Baru<\/p>\n<p>Nepal: नयाँ वर्षको शुभकामना<\/p>\n<p>Java: seneng taun anyar<\/p>\n<p>Laos: ສະບາຍດີປີໃຫມ່<\/p>\n<p>Myanmar: ပျြောရှငျတဲ့နှစ်သစ်<\/p>\n<p>Sri Lanka: සුභ නව වසරක් වේවා<\/p>\n<p>India: नया साल मुबारक हो<\/p>\n<p>Mongolia: Шинэ жилийн мэнд хүргэе<\/p>\n<p>May all my family, friends, colleagues, classmates and students have a Happy, Prosperous, and Productive 2017.<\/p>\n<p>There will be firework if you or me post \" Happy new year\" on the Facebook, let us make a global blessing for our fruitful coming year 2017~~<\/p>", "zt": "2016再見～"}, {"id": "f1477640157", "file": "2016-10-28-f1477640157", "date": "2016-10-28", "title": "Sheng-Tsung Hou: \"Exploring knowledge and truth is the essence of a university; accompanying students in finding themselves...", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A quotation from Sheng-Tsung Hou on how teachers can help students find their sense of purpose and begin their own hero's journey.", "len": 113, "body": "<p>Sheng-Tsung Hou: \"Exploring knowledge and truth is the essence of a university; but accompanying students in finding themselves is its real value. Although a university cannot simply hand students a clear purpose in life, teachers can still do a great deal. For example, through project-based work, industry placements, overseas exchanges, and hands-on lab guidance, we can give students opportunities to think independently, room for diverse conversations, deep sharing of life experience, and resources at the right moment. All of this aims at nurturing a sense of purpose in young people, helping them find their own calling in life, awaken their inner motivation to exist, and set out on their own hero's journey.\"<\/p>\n<p><a href=\"http://opinion.cw.com.tw/blog/profile/394/article/4925?utm_source=facebook&amp;utm_medium=social&amp;utm_campaign=daily\">http://opinion.cw.com.tw/blog/profile/394/article/4925?utm_source=facebook&amp;utm_medium=social&amp;utm_campaign=daily<\/a><\/p>", "zt": "侯勝宗：「探索知識與真理，是大學存在的本質；陪伴學生找到…"}, {"id": "f1475071294", "file": "2016-09-28-f1475071294", "date": "2016-09-28", "title": "A bad school is one that is broken, not because of its students!", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "On my tenth year as an educator, a reflection on how teachers shape students, and a thank-you to ten years of students.", "len": 152, "body": "<p>A bad school is one that is broken, not because of its students!<\/p>\n<p>Educators are their students' career leaders!<\/p>\n<p>Students are shaped by the conduct and expectations of their teachers!<\/p>\n<p>Help students set goals and move forward steadily; give learners dreams, and don't crush their confidence with words! Put love into the classroom so that every student can feel it. This is my tenth year as an educator, and on this unexpected day off I used the time to ask myself again whether I have lived up to this.<\/p>\n<p>I often tell my family that today's students are more polite than I was as a student, work harder to support themselves, and face their own futures more seriously. As I walk into my next ten years, I want to use today to thank my students of the past ten years. Because of you, being a teacher has been such a joy!<\/p>\n<p><a href=\"https://www.ted.com/talks/linda_cliatt_wayman_how_to_fix_a_broken_school_lead_fearlessly_love_hard?language=zh-tw\">https://www.ted.com/talks/linda_cliatt_wayman_how_to_fix_a_broken_school_lead_fearlessly_love_hard?language=zh-tw<\/a><\/p>", "zt": "壞學校是因為學校壞掉了，與學生無關！"}, {"id": "f1469502349", "file": "2016-07-26-f1469502349", "date": "2016-07-26", "title": "[Le Cordon Bleu Grand Diplôme Programme: Chinese-Interpreted Class Starts 2016/09/23!]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Courses & Classrooms", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Announcement of the Chinese-interpreted Le Cordon Bleu Grand Diplôme in French cuisine and pastry, taught in Taiwan by French chefs, with 2016-17 intake dates.", "len": 142, "body": "<p>[Le Cordon Bleu Grand Diplôme Programme: Chinese-Interpreted Class Starts 2016/09/23!]<\/p>\n<p>Registration for the 08/05 information session is open: <a href=\"http://goo.gl/forms/gahK0RIyXYPNcac93\">http://goo.gl/forms/gahK0RIyXYPNcac93<\/a><\/p>\n<p>The Le Cordon Bleu Grand Diplôme programme is divided into French cuisine and French pastry courses. It runs for 15 months in total, with 16 students per class, and includes hands-on culinary practice and food and beverage management courses. French Le Cordon Bleu chefs teach on site in person, so you don't need to fly abroad, saving airfare and accommodation costs!<\/p>\n<p>Register for the 2016-17 programme before 2016/11/30 and enjoy a waiver of the screening fee.<\/p>\n<p>Chinese-interpreted class start dates<\/p>\n<p>2016: Autumn intake 09/23<\/p>\n<p>2017: Winter intake 01/06, Spring intake 04/07, Summer intake 07/14, Autumn intake 09/29<\/p>\n<p>Brochure for the Chinese-interpreted Le Cordon Bleu Grand Diplôme programme: <a href=\"https://goo.gl/kyh8v1\">https://goo.gl/kyh8v1<\/a><\/p>\n<p>You can book a visit to see the facilities in advance!<\/p>\n<p>☎ 07-8010909<\/p>\n<p>✉ Taiwan-NKUHT@cordonbleu.edu<\/p>", "zt": "【「藍帶頂級廚師證書課程」2016/09/23 中文翻譯…"}, {"id": "f1466497834", "file": "2016-06-21-f1466497834", "date": "2016-06-21", "title": "Such a great deal that even teachers want to join in.", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Teaching Career", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A free two-day Hakka industry summer camp for young people aged 17 to 35, including forums, industry visits and a free hotel stay in Sanxia.", "len": 127, "body": "<p>Such a great deal that even teachers want to join in.<\/p>\n<p>What a pity that I am no longer a youth under 35!<\/p>\n<p>On 29-30 June there will be a two-day, one-night \"Youth Hakka Industry Summer Camp\", with industry forums and industry visits covering clothing, food, education and leisure. It will broaden your horizons and prepare you early for employment, and you will stay in a four-person suite at the Sanxia Fullon Hotel (completely free).<\/p>\n<p>Eligibility: young people aged 17 to 35; 200 places, while spaces last. Please register on the website of the New Taipei City Hakka Affairs Bureau (see the poster and the registration guidelines). (Please try to register in groups of four.) Thank you! For questions, call Mr. Chen at 29603456-6021.<\/p>\n<p>Registration form<\/p>\n<p><a href=\"https://docs.google.com/forms/d/1s8Ys_fxOds4gB-nCzlPFGiNuQ_W9MuraknpeB0cb_sM/viewform?c=0&amp;w=1\">https://docs.google.com/forms/d/1s8Ys_fxOds4gB-nCzlPFGiNuQ_W9MuraknpeB0cb_sM/viewform?c=0&amp;w=1<\/a><\/p>", "zt": "那麼好康的事，連老師都想參加了。"}, {"id": "f1463286046", "file": "2016-05-15-f1463286046", "date": "2016-05-15", "title": "It's been so hot these days, and everyone is starting to plan summer activities; if you follow international news…", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Bangkok, Thailand", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "With summer travel plans underway, Ray lists the countries on Taiwan's Level 2 Alert for the Zika virus, which women who may be pregnant should avoid.", "len": 202, "body": "<p>It's been so hot these days, and everyone is starting to plan summer activities. If you follow international news, the hottest and most frightening topic lately is the Zika virus, for which there is no cure.<\/p>\n<p>Taiwan's Ministry of Health and Welfare website also lists a number of countries under a Level 2 Alert. If you are considering any of the following countries for summer travel, women who may be pregnant should avoid going there.<\/p>\n<p>Countries under the Level 2 Alert for Zika virus<\/p>\n<ol>\n<li>\n<p>Southeast Asia: the Philippines, Thailand, Vietnam<\/p>\n<\/li>\n<li>\n<p>South Asia: Maldives<\/p>\n<\/li>\n<li>\n<p>Oceania: American Samoa, Fiji, Republic of the Marshall Islands, New Caledonia, Papua New Guinea, Samoa, Solomon Islands, Tonga, Vanuatu<\/p>\n<\/li>\n<li>\n<p>South America: Brazil, Bolivia, Colombia, Ecuador, French Guiana, Guyana, Paraguay, Peru, Suriname, Venezuela<\/p>\n<\/li>\n<li>\n<p>Central America and the Caribbean: Barbados, Bonaire (Netherlands), Belize, Costa Rica, Cuba, Curaçao (Netherlands), Dominica, Dominican Republic, El Salvador, Grenada, Guatemala, Guadeloupe (France), Haiti, Honduras, Jamaica, Martinique (France), Mexico, Nicaragua, Panama, Puerto Rico (US), Saint Barthélemy (France), Saint Lucia, Saint Vincent and the Grenadines, Sint Maarten, Saint Martin (France), Trinidad and Tobago, US Virgin Islands, Aruba (Netherlands)<\/p>\n<\/li>\n<\/ol>\n<p>Ministry of Health and Welfare table of travel epidemic advisory levels: <a href=\"http://www.cdc.gov.tw/countryepidlevel.aspx?treeid=aa2d4b06c27690e6&amp;nowtreeid=4dd5edd98f8580aa\">http://www.cdc.gov.tw/countryepidlevel.aspx?treeid=aa2d4b06c27690e6&amp;nowtreeid=4dd5edd98f8580aa<\/a><\/p>\n<p>Image source: World Health Organization, CDC<\/p>\n<p><a href=\"http://www.cdc.gov/zika/pdfs/imported_case_chikv_denv_zika.pdf\">http://www.cdc.gov/zika/pdfs/imported_case_chikv_denv_zika.pdf<\/a><\/p>\n<p><a href=\"http://www.who.int/emergencies/zika-virus/situation-report/12-may-2016/en/\">http://www.who.int/emergencies/zika-virus/situation-report/12-may-2016/en/<\/a><\/p>", "zt": "這幾天好熱，也都開始規劃暑假的活動；如果大家有看國際新聞…"}, {"id": "f1460643256", "file": "2016-04-14-f1460643256", "date": "2016-04-14", "title": "Careers in Hospitality and Tourism: The Present and Future of the Sommelier Profession", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Higher Education", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "An announcement for a campus lecture by sommelier Alex Tsai at Hsing Wu University, covering his wine certifications and competition record.", "len": 144, "body": "<p>【Careers in Hospitality and Tourism: The Present and Future of the Sommelier Profession】<\/p>\n<p>【Campus Lecture Tour with Top Sommelier Alex Tsai (蔡孝倫)】<\/p>\n<p>Time: 1:10-3:00 pm, May 3, 2016<\/p>\n<p>Venue: International Conference Hall, 6th Floor, College of Hospitality and Tourism, Hsing Wu University (HWU) (seating is limited, so please arrive early)<\/p>\n<p>WSET (Wine and Spirit Education Trust, UK) Level 1 Foundation, Level 2 Intermediate (2009) and Level 3 Advanced (2013) certifications<\/p>\n<p>Certified instructor, The Wine Academy of Spain (2011)<\/p>\n<p>International Sommelier Guild (ISG) Level 1 Foundation and Level 2 Advanced (2012) sommelier certifications<\/p>\n<p>Expert certification from the BIVB (Bureau Interprofessionnel des Vins de Bourgogne), France (2013): Honour of Burgundy Wine Connoisseur Certificate<\/p>\n<p>[Competition Record]<\/p>\n<p>Finalist, TSA Taiwan Best Sommelier Competition (Sep. 2012)<\/p>\n<p>Runner-up, Sopexa Taiwan Best French Wine Sommelier Competition (Jul. 2015)<\/p>\n<p>Taiwan representative and semi-finalist, Sopexa Asia Best French Wine Sommelier Competition (Dec. 2015)<\/p>", "zt": "【觀光餐旅職涯發展--侍酒師職業的現況與未來】"}, {"id": "f1458533105", "file": "2016-03-21-f1458533105", "date": "2016-03-21", "title": "Look Here~~ Look Here~~", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Exam Info & Tips", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Working tour guides can now train in Korean, Indonesian, Vietnamese or Thai, to be able to lead foreign groups. Details of the 2016 programme.", "len": 216, "body": "<p>Look Here~~ Look Here~~<\/p>\n<p>Working tour guides who already hold a tour guide practising licence now have a chance to learn Korean, Indonesian, Vietnamese or Thai, so that you can lead foreign groups too.<\/p>\n<ol>\n<li>\n<p>Training period: late April 2016 to 30 April 2017 (ROC years 105 to 106).<\/p>\n<\/li>\n<li>\n<p>Eligible trainees: working tour guides who already hold a tour guide practising licence.<\/p>\n<\/li>\n<li>\n<p>Languages: Korean, Indonesian, Vietnamese, Thai.<\/p>\n<\/li>\n<li>\n<p>Training regions: northern, central and southern Taiwan.<\/p>\n<\/li>\n<li>\n<p>Number of sessions (classes): 16 sessions in total across the north, centre and south, with a maximum of 30 people per session in principle; a class will not open with fewer than 12 people.<\/p>\n<\/li>\n<li>\n<p>Format and curriculum: 48 lessons of 50 minutes each, including:<\/p>\n<\/li>\n<\/ol>\n<p>(1) Opening ceremony, 1 lesson.<\/p>\n<p>(2) Introduction to the market for that language, 2 lessons.<\/p>\n<p>(3) Practical language training, 42 lessons, including learning basic language skills, self-introductions and airport transfer reception practice, vocabulary, phrases and sentences used in tour guiding at tourist attractions, and general discussion and exchange of views.<\/p>\n<p>(4) Final oral test, 3 lessons.<\/p>\n<ol start=\"7\">\n<li>Training fee: NT$5,000 per person.<\/li>\n<\/ol>\n<p>The Bureau's \"2016 Tour Guide Training in Other Foreign Languages (Korean, Indonesian, Vietnamese, Thai)\" has been awarded to the Taiwan Tour Guide Association (R.O.C.). For matters concerning the commissioned work, please contact the association: tel. 02-25922207~9, website: <a href=\"http://www1.tourguide.org.tw.\">http://www1.tourguide.org.tw.<\/a><\/p>", "zt": "照過來~~照過來~~"}, {"id": "f1453174593", "file": "2016-01-19-f1453174593", "date": "2016-01-19", "title": "[Last call: registration for the 2nd-semester 2015-16 TOEIC campus course at Hsing Wu University]", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "English & TOEIC", "det": "TOEIC", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Registration for the TOEIC elite tutoring course at Hsing Wu University closes on Wednesday 20 January, aiming at a 550 score, and is open to Travel Management students in years 2 and 3.", "len": 201, "body": "<p>【Last call: registration for the 2nd-semester 2015-16 TOEIC campus course at Hsing Wu University】<\/p>\n<p>To raise and sharpen the English ability of all students and meet the English graduation requirement, the university has set up a TOEIC TA elite seed tutoring class for English certification. Through professional, intensive training, students will master the methods and tricks of English certification exams, raise their test scores and gain confidence in earning an English certificate. They can then spread this to every department and class, sharing their experience and helping classmates in the same class or department prepare for English exams. The target is mainly TOEIC CEFR B1, a score of 550 (275 in listening and 275 in reading).<\/p>\n<p>Fee: NT$800 for books (you can find out what it costs elsewhere with a quick Google)<\/p>\n<p>Eligibility: Department of Travel Management students at Hsing Wu University, years 2 and 3<\/p>\n<p>Instructors:<br />\nTourism &amp; Hospitality Class A: Tue periods 6-7, Thu periods 8-9, industry instructor Kelly<br />\nTourism &amp; Hospitality Class B: Tue periods 6-7, Wed periods 6-7, industry instructor David<\/p>\n<p>If you want to be a flight attendant, this is the first hurdle~~<\/p>\n<p>Please sign up with the teacher by Wednesday 1/20.<\/p>\n<p>Feel free to repost~~<\/p>", "zt": "【104學年第2學期TOEIC醒吾科大校園課程報名最後期…"}, {"id": "f1449195930", "file": "2015-12-04-f1449195930", "date": "2015-12-04", "title": "To students on the 2015-16 overseas study visits", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Overseas Study Tours", "det": "Cross-Strait & Southeast Asia", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Instructions for submitting the overseas study visit reports, with deadlines for the Ningxia, Beijing and Henan groups and how to claim credit exemption.", "len": 193, "body": "<p>To the students on the 2015-16 academic year overseas study visits:<\/p>\n<p>Please download the attached template and complete your overseas visit study report according to the following rules:<\/p>\n<ol>\n<li>\n<p>Length: the main text, including photos, must be at least 12 pages, not including attachments.<\/p>\n<\/li>\n<li>\n<p>Print in full colour, have it glue-bound, and hand it in to the office on the 6th floor of the college building.<\/p>\n<\/li>\n<li>\n<p>Email the electronic file to: h111@mail.hwu.edu.tw<\/p>\n<\/li>\n<li>\n<p>Deadline: all reports must be submitted within 2 weeks after the visit ends.<\/p>\n<\/li>\n<\/ol>\n<p>Ningxia group: deadline 12/8<\/p>\n<p>Beijing group: deadline 12/16<\/p>\n<p>Henan group: deadline 12/24 (students who joined the Henan visit last semester are subject to the same deadline)<\/p>\n<p>[Important] Students who submit their report to the college office within 2 weeks after completing the visit can collect a study certificate. Students who wish to have credits exempted should fill in the \"Overseas Visit Study Credit Exemption Application Form\" and send it to the college office for review. This form will be provided before the start of next semester as the voucher for students to apply for \"overseas visit\" credit exemption at the Registration Section of the Office of Academic Affairs.<\/p>\n<p><a href=\"http://b017.hwu.edu.tw/files/15-1049-31085,c1106-1.php?Lang=zh-tw\">http://b017.hwu.edu.tw/files/15-1049-31085,c1106-1.php?Lang=zh-tw<\/a><\/p>", "zt": "104學年度海外參訪活動的同學們："}, {"id": "f1445247241", "file": "2015-10-19-f1445247241", "date": "2015-10-19", "title": "QUOTE: Lin Hsien-Tang, with his eldest son Lin Pan-Lung and second son Lin Yu-Lung, set out in 1927…", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "North America", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A passage on Lin Hsien-Tang's year-and-a-half journey around the world in 1927-28 by ocean liner and train, and a recommendation of the film about his life.", "len": 298, "body": "<p>QUOTE: Lin Hsien-Tang, with his eldest son Lin Pan-Lung and second son Lin Yu-Lung, set out on May 15, 1927, and arrived on the European continent on June 20 of the same year. They left on March 14 of the following year (1928) for North America, arriving in the United States on March 20. They then departed on May 9 and crossed the Pacific, reaching Yokohama, Japan, on May 25, and returned safely to Taiwan on November 8, 1928, a total journey of about a year and a half. Their sea travel was mainly aboard mail steamers (ocean liners). From Keelung they took the Hozan Maru, changed at Hong Kong to the Kashima Maru, and sailed via Singapore, Penang, Sri Lanka and the Suez Canal in Egypt to Marseille in France. They then toured eleven countries on the European continent, from Denmark to Spain, from Britain to Germany, from the Netherlands to Switzerland, that is, from island to mountain recess, from coast to inland. Here they travelled mainly by train and car, with trains in particular being the main means of transport between countries. Later they sailed from Cherbourg in northwestern France on the great steamship R.M.S. Aquitania to New York in the United States. They then bought a \"combined ship-and-rail ticket\" from Nippon Yusen Kaisha and took the train from Boston and Chicago to Los Angeles, then went on to San Francisco to board the Tenyo Maru bound for Japan, passing through Hawaii on the way. (Lin Hsien-Tang, Travel Notes on a Journey Around the World)<\/p>\n<p>A good film has come out recently, Wufeng Lin Family 2 (Aru-Wu Storm 2), which tells the story of Lin Hsien-Tang! It is not that Taiwan has no history, but that those who write history think they can control it.<\/p>\n<p><a href=\"http://www.cw.com.tw/article/article.action?id=5071527&amp;utm_source=Facebook&amp;utm_medium=referral&amp;utm_campaign=Facebook\">http://www.cw.com.tw/article/article.action?id=5071527&amp;utm_source=Facebook&amp;utm_medium=referral&amp;utm_campaign=Facebook<\/a><\/p>", "zt": "QUOTE；林獻堂與其長子林攀龍與次子林猶龍，於一九二七…"}, {"id": "f1441854572", "file": "2015-09-10-f1441854572", "date": "2015-09-10", "title": "[Students, Please Take Statistics]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray urges his students to enrol in statistics, joking that it will save small money, earn real money, and maybe even win the lottery.", "len": 382, "body": "<p>[Students, Please Take Statistics]<\/p>\n<p>Yesterday, in our LINE group, I begged my students to take statistics. Besides what the seniors said about needing it for your capstone project, it will also help you in the following ways:<\/p>\n<p>Learning statistics saves you small money<\/p>\n<p>Learning statistics can earn you money<\/p>\n<p>Learning statistics might win you big money<\/p>\n<ol>\n<li>Learning statistics saves you small money<\/li>\n<\/ol>\n<p>Learn to track your daily spending in Excel, and you will discover that the \"flesh money\" you earn by bowing and scraping goes partly to big meals that grow more flesh, partly to clothes and shoes that cover the flesh, and a small part gets swiped away by the telecom company on your phone! So after learning statistics you will eat out less, buy fewer new clothes and shoes, and use more Wi-Fi. That is saving small money.<\/p>\n<ol start=\"2\">\n<li>Learning statistics can earn you money<\/li>\n<\/ol>\n<p>Learn to run a statistical survey and hand out questionnaires, and you will find that near the school there are only 3 convenience stores, 5 drink shops, 1 pool hall, 1 buffet restaurant and countless breakfast shops, which is lopsided for nearly ten thousand students on campus. You could open a few Chinese-style curry restaurants at the school gate, and a few bubble tea shops where the likes of Xu Taiyu and Lin Zhenxin can study; the campus food court could add a tasty buffet. So after learning statistics, perhaps you will own 3 shops before you even graduate, and earn quite a lot of money!<\/p>\n<ol start=\"3\">\n<li>Learning statistics might win you big money<\/li>\n<\/ol>\n<p>Once you have mastered statistical probability, you can enter the winning numbers from all 72 draws of 2015 into Excel, use the statistical methods I taught you to work out the six most probable numbers, then invest another 100 dollars of flesh money. From the hour of Hai (9 p.m.) today, you might never have to earn flesh money, keep accounts, shake pearl tea or make breakfast again. Because you learned statistics, you would be a billionaire!<\/p>\n<p>And in the end, you could buy a whole row of shops at the school gate, and I will come rent one from you to open a breakfast shop!<\/p>\n<p>So please be sure to add statistics to your schedule. It is about your future!!<\/p>\n<h1>HWUCourseSelectionSystem: <a href=\"http://portal.hwu.edu.tw/Portal/login.htm\">http://portal.hwu.edu.tw/Portal/login.htm<\/a><\/h1>", "zt": "【同學們請選修統計學】"}, {"id": "f1433036203", "file": "2015-05-31-f1433036203", "date": "2015-05-31", "title": "Episode 3 is \"Crazy College\": contestants must experience university life in one week…", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A tongue-in-cheek take on university life as a reality show, with a heartfelt thank-you to the homeroom students who helped their teacher move house and look after his dog.", "len": 204, "body": "<p>Episode 3 is \"Crazy College\". Contestants have to experience university life in a single week: learning to tap an RFID card for attendance within the ten minutes before and after each class, handling online course registration that keeps crashing or won't connect at all, submitting assignments on iCan, a platform even Professor Lien can't use, and checking academic warnings and grades in a school system that is not much different from a computer virus.<\/p>\n<p>They are also forced to take part in flipped classrooms where you must watch videos at home, and in group discussions and problem-based learning where you are made to speak even when you don't want to. As for the labour portion, they must act as teaching assistants to a group of juniors who are pretending to be dumb, do ten people's worth of experiments in the lab, and write papers, sweep floors, look after children and help move house for the professor.<\/p>\n<p>==================================================<\/p>\n<p>Oh dear~~ I really did ask my homeroom students to help me move house!! And to look after my little dog when I went abroad. I'm so sorry~~ @[664396576:2048:Jason Chen], @[1744380865:2048:Chih-i Huang], @[100000143594393:2048:Lin Mini], @[100000345041010:2048:世孝徐], and so many others I'd love to thank again but can't tag~~<\/p>", "zt": "第三集是「瘋狂的學院」，參賽者們要在一週內體驗大學生活，…"}, {"id": "f1430469248", "file": "2015-05-01-f1430469248", "date": "2015-05-01", "title": "[Call for Papers]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Teaching Career", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Call for papers for the 2015 Global Overseas Chinese Hospitality & Tourism Industry-academic Cooperation Forum, to be held at the Grand Hotel, Taipei, on 15-18 November 2015.", "len": 98, "body": "<p>[Call for Papers]<\/p>\n<p>Call for Papers<\/p>\n<p>Global Overseas Chinese Hospitality &amp; Tourism Industry-academic Cooperation Forum and International Academic Conference<\/p>\n<p>7th Annual Meeting of the Cross-Strait Tourism Education Alliance and Cross-Strait Tourism Research Conference<\/p>\n<p>2015 Global Overseas Chinese Hospitality &amp; Tourism Industry-academic Cooperation Forum &amp; International Academic Conference<\/p>\n<p>Dates: 15-18 November 2015 (Sunday to Wednesday), four days in total<\/p>\n<p>Venue: The Grand Hotel, Taipei<\/p>\n<p>Organiser: Chinese Society of Tourism Management<\/p>\n<p>Supervising bodies: Ministry of Science and Technology, Tourism Bureau (MOTC), Bureau of Foreign Trade (Ministry of Economic Affairs)<\/p>\n<p>Submission email: 2015forum@mail.hwu.edu.tw<\/p>\n<p>To register, please visit the official website: <a href=\"http://forum.tourism.org.tw\">http://forum.tourism.org.tw<\/a><\/p>", "zt": "【Call for Papers】徵稿通知"}, {"id": "f1430208424", "file": "2015-04-28-f1430208424", "date": "2015-04-28", "title": "The National Dagu Cup Tourism Itinerary Design Competition aims to draw on the creativity of young students...", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Travel Industry & Transport", "det": "Travel Agencies", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The 2015 National Dagu Cup Tourism Itinerary Design Competition invites students to design creative travel itineraries for the travel industry; entries are due by 10 June 2015.", "len": 197, "body": "<p>The National Dagu Cup Tourism Itinerary Design Competition is held in the hope that the creativity of young students can help us find more Taiwan travel itineraries worth promoting to the industry.<\/p>\n<p>We hope participants will come up with many creative, high-quality and diverse itineraries for the travel industry to promote, thereby achieving a real link between industry and academia.<\/p>\n<p>Organisers: National Association of Travel Agencies of the R.O.C., Taiwan Quality Tourism Development Association<\/p>\n<p>Co-organisers: Department of Tourism, Taipei City University of Science and Technology; Lianhe Xin Business Management Consulting Co., Ltd.<\/p>\n<p>Sponsor: Hua Li Books Co., Ltd.<\/p>\n<p>Executing unit: Department of Tourism, College of Human Ecology, Taipei City University of Science and Technology<\/p>\n<p>How to register - see the attached guidelines<\/p>\n<p>By 17:00 on Wednesday, 10 June 2015, deliver the registration documents, seven copies of the tour proposal, and one disc containing the written files<br />\n(including the tour proposal in Word format and the PowerPoint presentation) (please show the itinerary theme on the cover)<br />\nto the Department of Tourism, Taipei City University of Science and Technology<br />\n(Address: No. 2, Xueyuan Rd., Beitou District, Taipei City; please note \"2015 National Dagu Cup Tourism Itinerary Design Competition\").<\/p>\n<p><a href=\"http://www.htm.tpcu.edu.tw/bin/downloadfile.php?file=WVhSMFlXTm9MelEyTDNCMFlWOHhORGcyTmw4NE5Ea3lNVEE1WHpBME9ETTFMbVJ2WXc9PQ==&amp;fname=KLRPST45WXB5NPOPA5OPHD40CDOPOPQPRLNLFDQPJDUTKL04A5114040UXMLID55STJHZTA5KLMLTWB551NLYX55UXVTCDRL14EDJDA515NLCDB1ED11HCCHEDVTWXOPJDEDEDEHUXIH45QLUTJHVXA5STOPDDA5RLVTVTRPUXUTDG551501EDQPCDVTGDOPJDJHJH45UX11KOKO\">http://www.htm.tpcu.edu.tw/bin/downloadfile.php?file=WVhSMFlXTm9MelEyTDNCMFlWOHhORGcyTmw4NE5Ea3lNVEE1WHpBME9ETTFMbVJ2WXc9PQ==&amp;fname=KLRPST45WXB5NPOPA5OPHD40CDOPOPQPRLNLFDQPJDUTKL04A5114040UXMLID55STJHZTA5KLMLTWB551NLYX55UXVTCDRL14EDJDA515NLCDB1ED11HCCHEDVTWXOPJDEDEDEHUXIH45QLUTJHVXA5STOPDDA5RLVTVTRPUXUTDG551501EDQPCDVTGDOPJDJHJH45UX11KOKO<\/a><\/p>", "zt": "全國大觀盃觀光遊程設計競賽的舉辦是希望透過年輕學子的創意…"}, {"id": "f1425546324", "file": "2015-03-05-f1425546324", "date": "2015-03-05", "title": "[Exclusively for Students of the HWU College of Tourism and Hospitality]", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Industry News", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Part-time work opportunity: Princess Cruises turnaround staff training briefing in Keelung, with a daily wage of NT$1,500 and ten sessions in April and May 2015.", "len": 145, "body": "<p>[Exclusively for Students of the HWU College of Tourism and Hospitality]<\/p>\n<p>Princess Cruises (UK) in Keelung<\/p>\n<p>Briefing on Training for Turnaround Service Staff at Keelung Port<\/p>\n<p>[Type] Part-time job opportunity<\/p>\n<p>[Date] 7 April 2015 (ROC year 104), 13:00-15:00 (Room D103)<\/p>\n<p>[Daily pay] NT$1,500 (lunch provided)<\/p>\n<p>[Duties] Handling boarding and disembarkation procedures for international cruise ships and guiding passengers<\/p>\n<p>[Working hours] Of the 10 sessions on the dates below, you must work at least 5. Each session runs 6:10-16:00.<\/p>\n<p>4/27 (Mon), 4/29 (Wed), 4/30 (Thu), 5/5 (Tue), 5/8 (Fri), 5/14 (Thu), 5/17 (Sun), 5/20 (Wed), 5/23 (Sat), 5/28 (Thu) (students with class conflicts will be given official leave)<\/p>\n<p>[Transport] Shuttle bus from the school or from Yuanshan Station; gather at 06:10 am<\/p>\n<p>Students who are interested, please fill out the registration form at the Department of Applied English office or the Language Center, starting today:<\/p>\n<p><a href=\"http://c009.hwu.edu.tw/files/14-1059-27208,r271-1.php\">http://c009.hwu.edu.tw/files/14-1059-27208,r271-1.php<\/a><\/p>", "zt": "【醒吾科大觀餐學院學生專屬】"}, {"id": "f1417439291", "file": "2014-12-01-f1417439291", "date": "2014-12-01", "title": "2015 Ordinary Examination for Tour Guides and Tour Leaders…", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Exam Info & Tips", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Registration dates, exam dates, venues and registration rules for the 2015 (ROC year 104) ordinary national examination for tour guides and tour leaders.", "len": 280, "body": "<p>The 2015 (ROC year 104) Ordinary Examination for Professionals and Technicians: Tour Guides and Tour Leaders.<\/p>\n<p>Registration period: from November 25, 2014 to 5:00 p.m. on December 4.<\/p>\n<p>Registration website: <a href=\"http://register.moex.gov.tw\">http://register.moex.gov.tw<\/a><\/p>\n<p>Exam dates:<\/p>\n<p>(1) Foreign-language tour leaders and Mandarin tour leaders: Saturday, March 14, 2015.<\/p>\n<p>(2) Foreign-language tour guides (Stage 1 written exam) and Mandarin tour guides: Sunday, March 15, 2015. The Stage 2 oral exam for foreign-language tour guides is tentatively scheduled for Saturday, May 23 to Sunday, May 24, 2015, in several sessions; the actual oral exam dates will be announced separately.<\/p>\n<ol start=\"3\">\n<li>\n<p>Exam venues: The exam is held in 12 exam districts: Taipei, Taoyuan, Hsinchu, Taichung, Chiayi, Tainan, Kaohsiung, Hualien, Taitung, Penghu, Kinmen and Matsu. (Detailed venues are printed on the admission ticket that will be sent to you.)<\/p>\n<\/li>\n<li>\n<p>Registration rules:<\/p>\n<\/li>\n<\/ol>\n<p>(1) Registration period: from November 25, 2014 to 5:00 p.m. on December 4.<\/p>\n<p>(2) Deadline for receipt of application documents: Applicants must send their registration forms and documents by registered mail on or before December 5, 2014 (the postmark counts) to complete registration. Late applications will not be accepted and the original documents will be returned.<\/p>\n<p>(3) Mailing address: Section 1, Department of Professional and Technical Examinations, Ministry of Examination, No. 1-1 Shiyuan Road, Wenshan District, Taipei City 11602.<\/p>\n<p>(4) Registration method: Registration is online only. Applicants should log in to the Ministry's website at www.moex.gov.tw and click the main or new online registration site to enter the online registration portal, or go directly to register.moex.gov.tw (main site) or register.moex2.nat.gov.tw (new site). Download and print the registration forms, then send them by registered mail to the address above together with proof of eligibility and proof of payment.<\/p>", "zt": "104年專門職業及技術人員普通考試導遊人員、領隊人員考試…"}, {"id": "f1413513916", "file": "2014-10-17-f1413513916", "date": "2014-10-17", "title": "The 2014 Chinese Society of Tourism Management Master's Thesis Award is closing soon. Please recommend your graduates…", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A reminder that the 2014 master's thesis award for tourism studies closes on 15 November, with prizes of up to NT$10,000, along with the application instructions.", "len": 248, "body": "<p>The selection for the 2014 Chinese Society of Tourism Management Master's Thesis Award is closing soon. Please recommend your graduates to apply.<\/p>\n<p>【Description】<\/p>\n<p>Students who graduate in 2014 from a master's programme in a tourism-related department at a public or private university in Taiwan (including those who have completed their thesis and expect to graduate this year; applicants must be valid members of the Society from the time of application until the award ceremony that year) are eligible to enter if their thesis research is outstanding and has been recommended by their supervising professor.<\/p>\n<p>First prize: NT$10,000 and one certificate.<\/p>\n<p>Second prize: NT$8,000 and one certificate.<\/p>\n<p>Third prize: NT$6,000 and one certificate.<\/p>\n<p>Honourable mention: one certificate.<\/p>\n<p>【How to apply】<\/p>\n<ol>\n<li>\n<p>By 15 November 2014, please email 1. the application form and 2. an electronic copy of the master's thesis (full text) to Pi-Shen Ku, editorial assistant of the Journal of Tourism and Leisure Studies (jts@tourism.org.tw). If you do not receive a confirmation email from the Society within one week, please resend your submission or contact the editor-in-chief or the executive editor.<\/p>\n<\/li>\n<li>\n<p>Please also prepare (1) the application form (signed) and (2) one bound hard copy of the master's thesis, and mail them to \"Pi-Shen Ku, Graduate Institute of Tourism and Leisure Management, National Chiayi University\" for review. Address: Graduate Institute of Tourism and Leisure Management, No. 580 Xinmin Road, Chiayi City 60054.<\/p>\n<\/li>\n<\/ol>\n<p>Thank you for your recommendations, and you are very welcome to share this with students and teachers.<\/p>", "zt": "2014年中華觀光管理學會碩士論文獎甄選即將截止。敬請推…"}, {"id": "f1400236146", "file": "2014-05-16-f1400236146", "date": "2014-05-16", "title": "Taiwan's Night Markets Are Booming, but Who Pays the Hidden Costs?", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Family & Pets", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "With Tourism Bureau support, night markets are everywhere, yet no receipts, no credit cards, no business registration. I wonder what this costs the taxpaying public.", "len": 223, "body": "<p>With the push from the Tourism Bureau, Taiwan's night market culture has blossomed everywhere and become a \"pride of Taiwan\"?<\/p>\n<p>But after visiting quite a few, I found that from south to north, the stalls in every night market are much the same; the designs are equally tacky; the surroundings equally messy.<\/p>\n<p>Yet there is a big question that keeps nagging at me:<\/p>\n<p>Every time we go to a night market, my family of three spends NT$300 or more on average.<\/p>\n<p>But nobody issues a receipt?<\/p>\n<p>And not a single stall takes credit cards??<\/p>\n<p>And not one stall has a business registration???<\/p>\n<p>And of course, the part-time girls calling out to customers (who look like child labour!), do they have labour and health insurance????<\/p>\n<p>If I eat fried crab and have an allergic reaction, will the health department help investigate?????<\/p>\n<p>..............<\/p>\n<p>Thinking about this, I really feel sorry for those of us salaried workers who dutifully pay our taxes in Taiwan.<\/p>\n<p>Even the official figures show that in 2013 the annual business revenue of Taiwan's street vendors was NT$551 billion<\/p>\n<p>(I don't know whether this includes the newer large night market stalls), but most likely, beyond making the official unemployment rate a little lower, the cost paid by society may be even higher.<\/p>\n<p>Reference: Directorate-General of Budget, Accounting and Statistics, 2013 statistics<\/p>\n<p><a href=\"http://www.dgbas.gov.tw/np.asp?ctNode=2846\">http://www.dgbas.gov.tw/np.asp?ctNode=2846<\/a><\/p>", "zt": "台灣的夜市文化在觀光局的推波助瀾之下已經處處開花；成為台…"}, {"id": "f1397530770", "file": "2014-04-15-f1397530770", "date": "2014-04-15", "title": "Dear Members of the Society", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Industry News", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "An invitation to the Chinese Society of Tourism Management's member assembly and cruise industry-academia forum on April 21 in Taipei.", "len": 205, "body": "<p>Dear Members of the Society<\/p>\n<p>We again invite you to join the Chinese Society of Tourism Management's general assembly and Cruise Industry-Academia Cooperation Forum next Monday. We have invited General Manager Hsu Ching-Chi of Princess Cruises and the general manager of Carnival Cruise Line (Caribbean) to give keynote speeches. With the support of tourism industry, government and academia on both sides of the Taiwan Strait, we will also hold a summit forum, \"Perspectives from Industry, Government and Academia on the Asian Cruise Market.\"<\/p>\n<p>Summit forum speakers:<\/p>\n<p>(1) Deputy Director-General Liu Hsi-Lin, Tourism Bureau, MOTC<\/p>\n<p>(2) Director Man Hung-Wei, Taipei Office of the Association for Tourism Exchange Across the Taiwan Straits<\/p>\n<p>(3) Chairman Chen Kuo-Sen, Sanfu Travel Service<\/p>\n<p>(4) General Manager Lu Li-Ling, Royal Caribbean Cruises Taiwan<\/p>\n<p>(5) Dean Li Ming-Hui, College of Hospitality and Tourism, Hsing Wu University<\/p>\n<p>Time: 4/21 (Mon) 09:00-16:00<\/p>\n<p>Venue: 3F, Tourism Bureau Travel Service Center, No. 240, Sec. 1, Dunhua N. Rd., Taipei<\/p>\n<p>Please be sure to complete the online RSVP registration form.<\/p>\n<p>If you need any assistance, you are welcome to reply directly to us by email.<\/p>\n<p>We look forward to your participation.<\/p>\n<p>With respect, the Secretariat<\/p>\n<p>The Chinese Society of Tourism Management looks forward to your presence and guidance.<\/p>", "zt": "各位親愛的學會會員"}, {"id": "f1394609923", "file": "2014-03-12-f1394609923", "date": "2014-03-12", "title": "Cruise Seed Teacher Training: Chinese Tourism Management Association with Royal Caribbean and Lion Travel", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Careers & Courses", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A six-day training aboard Royal Caribbean's Voyager of the Seas, offering three cruise management seed-teacher certificates; only 30 places remain.", "len": 230, "body": "<p>The Chinese Tourism Management Association is running an industry-academia collaboration with Royal Caribbean's Taiwan general agent and Lion Travel. For the first time, the 140,000-ton Voyager of the Seas, the largest cruise ship in Asia, will serve as the training venue, with the most in-depth and professional programme on the latest cruise travel trends in tourism and hospitality. On completion, participants will receive three seed-teacher certificates in cruise management, logistics management and gaming management.<\/p>\n<p>Training details are as follows:<\/p>\n<p>(1) Dates: Sunday, May 18 to Friday, May 23, 2014 (Republic of China year 103), six days and five nights in total.<\/p>\n<p>(2) Venues: The Chinese Tourism Management Association's training venue, and Royal Caribbean's [Voyager of the Seas] on its \"Keelung, Nagasaki, Fukuoka route\".<\/p>\n<p>(3) Fees:<\/p>\n<ol>\n<li>\n<p>Non-members of the Chinese Tourism Management Association: NT$38,500 (four per room).<\/p>\n<\/li>\n<li>\n<p>Members of the Chinese Tourism Management Association: NT$37,500 (four per room).<\/p>\n<\/li>\n<\/ol>\n<p>Note: The two-day optional shore excursions to Fukuoka and Nagasaki (NT$5,000) are already included in this fee.<\/p>\n<p>(4) Training certificates:<\/p>\n<p>Certificate of completion and licence for \"Cruise Operations Management Seed Teacher, 16 hours\"<\/p>\n<p>Certificate of completion and licence for \"Cruise Logistics Management Seed Teacher, 16 hours\"<\/p>\n<p>Certificate of completion and licence for \"Cruise Gaming and Entertainment Management Seed Teacher, 16 hours\"<\/p>\n<p>Only 30 places are reserved, and the market has already sold out. If you are interested, feel free to message me privately!!<\/p>", "zt": "「中華觀光管理學會」與「皇家加勒比海郵輪臺灣總代理」及「…"}, {"id": "f1389269032", "file": "2014-01-09-f1389269032", "date": "2014-01-09", "title": "Agou Asked: \"Dad, Look at This Book. Which Rifle Did You Use in the Army?\"", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A father and his son hunt through books and Wikipedia to work out which rifle he carried during his military service.", "len": 136, "body": "<p>Agou asked: \"Dad, look at this book. Which rifle did you use in the army?\"<\/p>\n<p>Me: \"The Type 57 rifle.\"<\/p>\n<p>Agou asked: \"But there's no Type 57 in here?\"<\/p>\n<p>Agou's dad: \"Then let me find it online and show you: <a href=\"http://zh.wikipedia.org/wiki/57%E5%BC%8F%E6%AD%A5%E6%A7%8D\">http://zh.wikipedia.org/wiki/57%E5%BC%8F%E6%AD%A5%E6%A7%8D<\/a> (said rather impatiently...)\"<\/p>\n<p>Agou: \"Oh, so that's the M14 automatic rifle!!\"<\/p>\n<p>Agou's dad: \"Then see if you can find the .30 rifle, because I remember using the .30 rifle at Chenggong Ridge and for target practice in high school.\"<\/p>\n<p>Agou: \"It's not here either...\"<\/p>\n<p>Afterwards: I looked it up myself. It turns out the \".30 rifle\" was the 1903 Springfield, a product of the Second World War era. Whether I actually ever used one, I honestly don't remember very well, but judging by its shape, it's hard to forget that rifle's distinctive bolt handle.<\/p>\n<p><a href=\"http://zh.wikipedia.org/wiki/M1903%E6%98%A5%E7%94%B0%E6%AD%A5%E6%A7%8D\">http://zh.wikipedia.org/wiki/M1903%E6%98%A5%E7%94%B0%E6%AD%A5%E6%A7%8D<\/a><\/p>", "zt": "阿狗問: 「拔拔你看這本書，你當兵時用那一種槍?」"}, {"id": "f1387943174", "file": "2013-12-25-f1387943174", "date": "2013-12-25", "title": "Our Paper Cited in Dr. Ken Black's Business Statistics Textbook", "cat": "Morning Reading", "cats": ["Morning Reading"], "sub": "Journal Papers", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A short note of pleasure that Dr. Ken Black cited our 2011 paper on cruise passengers across the Taiwan Straits as a case study in his newest textbook edition.", "len": 57, "body": "<p>It's our pleasure for the Author, Dr. Ken Black, cited our paper which published in 2011, Titled \"Differences in Tourism Image among Cruise Passengers across the Taiwan Straits\" , being a case study for business analysis in categorical data in his newest edition book.<\/p>\n<p>It's published and available in Amazon,  but it is too expensive to me.<\/p>", "zt": "It's our pleasure for the Au…"}, {"id": "f1385441134", "file": "2013-11-26-f1385441134", "date": "2013-11-26", "title": "I Saw Chef Ah-Chi on Campus, Just Out of Teaching in the Kitchen,", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray sees celebrity chef Ah-Chi on the THT campus with his students, and shares the application deadline for the graduate institute of hospitality and tourism.", "len": 87, "body": "<p>I Saw Chef Ah-Chi on Campus, Just Out of Teaching in the Kitchen,<\/p>\n<p>in his chef's uniform, with hardworking, earnest students at his side!<\/p>\n<p>Now he is at the training restaurant, eating and tasting dishes for the students at the same time,<\/p>\n<p>education and hands-on practice together!<\/p>\n<p>I truly feel it is a blessing to teach at this school!!<\/p>\n<p>Want to apply to the most professional hospitality and tourism graduate institute in Hualien?<\/p>\n<p>Only three days left, the deadline is 11/28.<\/p>\n<p>The admissions brochure is here:<\/p>\n<p><a href=\"http://www.tht.edu.tw/newspic/103%E5%AD%B8%E5%B9%B4%E5%BA%A6%E8%87%BA%E7%81%A3%E8%A7%80%E5%85%89%E5%AD%B8%E9%99%A2%E7%A0%94%E7%A9%B6%E6%89%80%E7%94%84%E8%A9%A6%E7%B0%A1%E7%AB%A0.pdf\">http://www.tht.edu.tw/newspic/103%E5%AD%B8%E5%B9%B4%E5%BA%A6%E8%87%BA%E7%81%A3%E8%A7%80%E5%85%89%E5%AD%B8%E9%99%A2%E7%A0%94%E7%A9%B6%E6%89%80%E7%94%84%E8%A9%A6%E7%B0%A1%E7%AB%A0.pdf<\/a><\/p>", "zt": "在校園內看到阿基師剛由廚房上完課出來，"}, {"id": "f1385343013", "file": "2013-11-25-f1385343013", "date": "2013-11-25", "title": "To the Students Who Keep Dogs: Something Your Teacher Has Never Been Able to Say", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Family & Pets", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray shares the story of his 14-year-old dog and offers two pieces of advice to students who keep dogs: think carefully before getting one, and adopt rather than buy.", "len": 346, "body": "<p>To the Students Who Keep Dogs: Something Your Teacher Has Never Been Able to Say<\/p>\n<p>I have a daughter who is 14. She has followed us through countless moves, from Taipei to Hualien. No matter how busy we were, she would wait at home for us to come back, however long it took, however many days! Then one day she got stuck behind a cabinet while home alone, and we were travelling in Korea. When we came home after seven days, she was barely alive!<\/p>\n<p>She stayed with us through our hardest days. When we were forced out of our home in Sanchong by gangsters, and during the weekly \"ant-moving\" between Muzha and Hualien, when load after load of belongings was carried over bit by bit, she was there with us, just like the memories we refused to give up, which had to be pieced back together one fragment at a time. She was family to us, and she could not miss a single occasion.<\/p>\n<p>So when I see you bring your adorable, store-bought puppies to school, there are two things I really want to tell you:<\/p>\n<p>First, if you are young and still have big dreams, if you still hope to go on a working holiday or study abroad, or you will move away for work and leave your hometown, I suggest you not keep a dog. They will miss you and wait for you, but you will forget them.<\/p>\n<p>Second, if you love dogs very much and have the means to care for them and make them part of your family, please adopt a stray. They are just as lovable and just as loyal as a dog from a pet shop, but you will not be encouraging unreasonable breeding practices and a thoroughly corrupted pet market, and you can give one of them a home.<\/p>\n<p>And if you love dogs but do not have time to keep one, then from November 29 please support this Taiwanese film. Giddens (Jiubadao) says all of its profits will go to help every life it possibly can.<\/p>\n<p><a href=\"http://youtu.be/FFedOSmGaAE\">http://youtu.be/FFedOSmGaAE<\/a><\/p>", "zt": "給很多在養狗狗的同學們，老師一直說不出口的事。"}, {"id": "f1384213668", "file": "2013-11-12-f1384213668", "date": "2013-11-12", "title": "Guangfeng Farmers' Association Holds a Matai'an Creative Ingredients Travel Itinerary Design Competition", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Competition Coaching", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A call for entries to a Matai'an creative-ingredient tour design contest in Guangfu, Hualien, with NT$50,000 for first prize and a deadline of 5 December.", "len": 253, "body": "<p>Guangfeng Farmers' Association, with the theme of developing the Matai'an leisure agriculture area, is holding a Matai'an Creative Ingredients Travel Itinerary Design Competition. The organiser hopes entrants will use ingredients grown and sold locally in Matai'an as the basis for creative products, and combine them with other distinctive local resources in Guangfu Township, innovatively pairing local ingredients and integrating the agricultural resources of the leisure agriculture area and its surroundings, such as agricultural production, farmers' daily life, rural ecology, cultural character and natural scenery. By linking these with agriculture-related activities and bringing out local character, entrants should design a diverse, refined and distinctive form of agricultural tourism.<\/p>\n<ol>\n<li>\n<p>Deadline: 5:00 p.m. on 5 December<\/p>\n<\/li>\n<li>\n<p>Anyone interested in this itinerary design competition, whether an individual or a team, may enter. Entries are being accepted from now until 5:00 p.m. on 5 December this year. At 9:00 a.m. on 6 December, the organiser will invite a panel of judges to review the entries on the second floor of the Guangfeng Farmers' Association supermarket. The scoring criteria are theme creativity (30%), creative ingredients (20%), travel itinerary (20%) and overall completeness (30%).<\/p>\n<\/li>\n<li>\n<p>The top three entries will be selected. First prize is NT$50,000, second prize NT$30,000 and third prize NT$20,000. The winners will be announced in an advertisement in the Keng Sheng Daily News on 10 December this year.<\/p>\n<\/li>\n<li>\n<p>Entrants should submit their work, including an electronic file, to the Extension Section of Guangfeng Farmers' Association, at No. 1-1, Ziqiang Road, Datong Village, Guangfu Township, Hualien County.<\/p>\n<\/li>\n<\/ol>\n<p><a href=\"http://www.ksnews.com.tw/newsdetail.php?n_id=0000496446&amp;level2_id=106#.UoFjVEKkzAw.facebook\">http://www.ksnews.com.tw/newsdetail.php?n_id=0000496446&amp;level2_id=106#.UoFjVEKkzAw.facebook<\/a><\/p>", "zt": "光豐農會以開發馬太鞍休閒農業區為主題，舉辦馬太鞍創意食材…"}, {"id": "f1380437115", "file": "2013-09-29-f1380437115", "date": "2013-09-29", "title": "Taiwan is actually a treasure trove for research, and it is so much fun!", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Current Affairs", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray marvels at Taiwan's research opportunities, such as the heat-loving crabs of Guishan Island, while noting how small the research funding is.", "len": 156, "body": "<p>Taiwan is actually a treasure trove for research, and it is so much fun!<\/p>\n<p>It's just that the funding the National Science Council gives to Ming-Shiou Jeng's research amounts to only a little over NT$2 million over two years,<\/p>\n<p><a href=\"https://nscnt07.nsc.gov.tw/WRS/program_list.asp?a=421$415$414$422$418$417$414$413$414$434$9290&amp;b=%E9%84%AD%E6%98%8E%E4%BF%AE\">https://nscnt07.nsc.gov.tw/WRS/program_list.asp?a=421$415$414$422$418$417$414$413$414$434$9290&amp;b=%E9%84%AD%E6%98%8E%E4%BF%AE<\/a><\/p>\n<p>which, compared with many university departments, is gone once you buy a single piece of equipment~<\/p>\n<p>Strange crab spotted: the documentary \"Crabs on the Hot Pot\" explores the secrets of the deep sea<\/p>\n<p>China Times [reported by Bing-Jun Lai, Yilan]<\/p>\n<p>The turtle-shell crab (Xenograpsus testudinatus), which lives in the waters off Guishan Island, is a crab species unique to Yilan and can survive in hot springs of 100 degrees. Lin Yu-Hsiang, a 37-year-old young director, and his team spent more than two years diving into the deep sea and enduring the heat to film the crabs. At the moment they captured the crab swarm on camera, Lin said: \"It was a wonderful surprise, and so beautiful!\"<\/p>", "zt": "其實台灣就是做研究的寶地，實在是太有趣!"}, {"id": "f1379990267", "file": "2013-09-24-f1379990267", "date": "2013-09-24", "title": "Important Notice", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The baking skills training for Indigenous students moves to Fridays 15:00-19:00, taught by a chef from the Culinary Arts department. Registration is open.", "len": 129, "body": "<p>Important Notice]<\/p>\n<p>To fit everyone's class schedules, the baking skills training for Indigenous students has been moved to 15:00-19:00 every Friday. All students are welcome to join! Chef Huang Wen-Long from our university's Culinary Arts department will teach everyone how to make delicious bread. It's really great!<\/p>\n<p>Ray<\/p>\n<p>Details below. Hurry up and sign up~~<\/p>\n<hr />\n<p>Subject: Baking skills training for Indigenous students<\/p>\n<p>Time: Every Friday 15:00-19:00 starting 2013/10/04 (ROC year 102), continuing until early December<\/p>\n<p>Content: Purpose: to train students in a second specialty and increase their employability and confidence.<\/p>\n<p>Duration: First semester of the 2013 academic year (ROC year 102)<\/p>\n<p>Indigenous students of our university get priority in registration<\/p>\n<p>Number of participants: about 35 students expected<\/p>\n<p>For the registration brochure, please visit the Department of Hospitality Management office.<\/p>", "zt": "重要通知]"}, {"id": "f1379311241", "file": "2013-09-16-f1379311241", "date": "2013-09-16", "title": "SMEA Entrepreneurs' Forum in Hualien, Tuesday 9/24 at 10:00", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Taiwan", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A free entrepreneurs' forum in Hualien on 9/24 about leisure tourism with a cultural flavour, featuring successful local business founders. Students and teachers welcome.", "len": 161, "body": "<p>SMEA Entrepreneurs' Forum in Hualien, Tuesday 9/24 at 10:00<\/p>\n<p>The Small and Medium Enterprise Administration, Ministry of Economic Affairs, is holding the Entrepreneurs' Forum <Hualien Session> at the Information Building of Hualien Senior Commercial High School on 9/24 (Tuesday) at 10:00.<\/p>\n<p>This session has invited successful entrepreneurs and business leaders: Chairman Chang Ching-Lai of the Hualien Shangri-La, Chairman Hsu Chao-Lin of Ming Li Travel Service, Founder Fan Chi-Ming of Ji Zheng Ranch, and Founder Chiang Kuan-Ming of PASA Space. They will share on the theme [Leisure Tourism with a Cultural Flavour Is More Appealing]. The hosts are Chairwoman Chen Hui-Tzu of the Hualien County Tourist Hotel Association and Associate Vice President Yen Hsin-Chun of Hotung Venture Capital!<\/p>\n<p>Students and teachers are both welcome to sign up. It is a rare opportunity and places are limited, so register early!<\/p>\n<p>The forum provides a boxed lunch and refined refreshments, and the event is completely free!<\/p>\n<p>Register online now at the Startup Incubation Learning Network (http://www.527188.com.tw/Web/RC.aspx)!<\/p>", "zt": "經濟部中小企業處於9/24（二）10點"}, {"id": "f1376359883", "file": "2013-08-13-f1376359883", "date": "2013-08-13", "title": "Want to Be a Big Brother Daren?", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Airline Internships", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "TransAsia Airways is recruiting ground staff, with applications closing 19 August. A few THT graduates are already working there, and admissions are still open.", "len": 126, "body": "<p>Want to Be a Big Brother Daren?<\/p>\n<p>Back in the day I actually passed the exam for ground staff at TransAsia Airways, you know! But luckily I didn't go, otherwise with the amount of hair I have now, I wouldn't look handsome at all!!<\/p>\n<p>TransAsia Airways is recruiting new blood, and applications close on 8/19.<\/p>\n<p>@[1284236696:2048:Shyh-shin Guo], a senior who now works as ground staff at TransAsia Airways, and @[100005078321158:2048:陳怡君] and @[100000272599932:2048:Max Huang], who work as ground staff at EVA Air, are all graduates of the Department of Tourism and Travel at Taiwan Hospitality &amp; Tourism College.<\/p>\n<p>The best choice for learning a profession: Taiwan Hospitality &amp; Tourism College<\/p>\n<p>Last chance to enrol: the dedicated online admissions registration site<\/p>\n<p><a href=\"http://ibook.tht.edu.tw/newman\">http://ibook.tht.edu.tw/newman<\/a><\/p>\n<p>Past entrance exam question bank<\/p>\n<p><a href=\"http://www.tht.edu.tw/newspic/102學年度日間部四技二專單獨招生考試題庫.pdf\">http://www.tht.edu.tw/newspic/102學年度日間部四技二專單獨招生考試題庫.pdf<\/a><\/p>", "zt": "想當大仁哥嗎？"}, {"id": "f1375151667", "file": "2013-07-30-f1375151667", "date": "2013-07-30", "title": "Aug 19 (Mon) to Aug 22 (Thu) is the last chance for your juniors to enter the school…", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A message to students: the final registration window for independent admission to THT runs 19 to 22 August, and recommending a classmate earns a NT$1,000 scholarship.", "len": 129, "body": "<p>Dear students,<\/p>\n<p>From 8/19 (Mon) to 8/22 (Thu) is the last chance for your juniors to enter our school. Graduates of any track, whether hospitality, business management, information technology or mechanical engineering, can register. The registration website is: <a href=\"http://ibook.tht.edu.tw/newman/\">http://ibook.tht.edu.tw/newman/<\/a><\/p>\n<p>They will then take an online exam, and placement into departments will be based on the exam results.<\/p>\n<p>Most importantly, if you recommended a classmate to register, please fill in the attached application form for the admissions-assistance scholarship as soon as possible. For every independent-admission student you recommend who enrols, you can receive a NT$1,000 scholarship. (Be sure to apply before the results are announced on 8/23. If you are not in Hualien, you can ask a teacher or a classmate to help.)<\/p>\n<p><a href=\"http://administration.tht.edu.tw/student_affairs/%E7%94%9F%E8%BC%94%E7%B5%84/100/%E6%A0%A1%E5%85%A7%E7%8D%8E%E5%8A%A9%E5%AD%B8%E9%87%91/%E8%A1%A8%E5%96%AE/%E5%AD%B8%E7%94%9F%E6%A0%A1%E8%AD%BD%E8%A1%8C%E9%8A%B7%E7%8D%8E%E5%AD%B8%E9%87%91%E7%94%B3%E8%AB%8B%E8%A1%A8.doc\">http://administration.tht.edu.tw/student_affairs/%E7%94%9F%E8%BC%94%E7%B5%84/100/%E6%A0%A1%E5%85%A7%E7%8D%8E%E5%8A%A9%E5%AD%B8%E9%87%91/%E8%A1%A8%E5%96%AE/%E5%AD%B8%E7%94%9F%E6%A0%A1%E8%AD%BD%E8%A1%8C%E9%8A%B7%E7%8D%8E%E5%AD%B8%E9%87%91%E7%94%B3%E8%AB%8B%E8%A1%A8.doc<\/a><\/p>\n<p>Teacher Ray, Department of Hospitality Management<\/p>", "zt": "(一)~8/22(四)是各位的學弟妹進入學校的最後機會，…"}, {"id": "f1371102561", "file": "2013-06-13-f1371102561", "date": "2013-06-13", "title": "Taiwan Hospitality & Tourism College Opens Independent Admissions for Four-Year, Two-Year and Five-Year Programmes", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "Admissions & Falling Birth Rate", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "THT is accepting independent admissions applications from high school and vocational graduates, no hospitality background required. Here is how to pick your department.", "len": 157, "body": "<p>Taiwan Hospitality &amp; Tourism College Opens Independent Admissions for Four-Year, Two-Year and Five-Year Programmes<\/p>\n<p>High school and vocational school graduates are welcome (no hospitality or tourism background needed).<\/p>\n<p>Please register on the online application site and fill in your order of preference:<\/p>\n<p><a href=\"http://ibook.tht.edu.tw/newman/\">http://ibook.tht.edu.tw/newman/<\/a><\/p>\n<p>If you are a fresh new student:<\/p>\n<ol>\n<li>\n<p>Want to be Chef Aji's apprentice? Choose: Department of Culinary Arts Management<\/p>\n<\/li>\n<li>\n<p>Want to work in a five-star hotel? Choose: Department of Hospitality Management<\/p>\n<\/li>\n<li>\n<p>Absolutely love fine food and restaurants? Choose: Department of Food and Beverage Management<\/p>\n<\/li>\n<li>\n<p>Hoping to become a tour guide or tour leader and follow in Lin Long's footsteps? Choose: Department of Tourism and Travel<\/p>\n<\/li>\n<li>\n<p>Passionate about outdoor leisure in Hualien's mountains and sea? Choose: Department of Tourism and Leisure<\/p>\n<\/li>\n<\/ol>\n<p>Whether you come from an industrial, electronics or business programme, or a general high school, you can apply!<\/p>\n<p>Download the admissions brochure: <a href=\"http://www.tht.edu.tw/newspic/20130610.pdf\">http://www.tht.edu.tw/newspic/20130610.pdf<\/a><\/p>\n<p>Register right away here: <a href=\"http://ibook.tht.edu.tw/newman\">http://ibook.tht.edu.tw/newman<\/a><\/p>\n<p>The college welcomes our new students!!!<\/p>", "zt": "台灣觀光學院四技、二專、五專部單獨招生"}, {"id": "f1370998088", "file": "2013-06-12-f1370998088", "date": "2013-06-12", "title": "Many thanks to Ariel Chen for finding my thesis from over ten years ago, ...", "cat": "Morning Reading", "cats": ["Morning Reading"], "sub": "Journal Papers", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Recovering an old thesis brings back warm memories of Professor Wen-Hsien Chou, my mentor in statistics and market research.", "len": 275, "body": "<p>Many thanks to Ariel Chen for finding my thesis from over ten years ago. It also keeps reminding me of the statistics classes Professor Wen-Hsien Chou taught for the market research department after work at China Credit Information Service. His solid grounding in statistics and his witty lectures influence me at every moment. It also reminds me of the day I went to Li-Cheng Construction at Taimall Shopping Center to present a research report, and Professor Chou's presence there as a professional defender of the decision-making system.<\/p>\n<p>Later, before I graduated from graduate school, I asked him to serve on my oral examination committee. Instead, Professor Chou had me go to the Department of Business Administration at National Chung Hsing University every week to discuss my thesis with his graduate students. I still remember that in those days I worked at Shinshin during the day, and after my classes at Chinese Culture University I still had to go to the office on Fuxing North Road to attend class and prepare discussion material, then join the seminars with the Chung Hsing business graduate students.<\/p>\n<p>One evening, the professor even brought a table of statistics on names for his newborn little daughter for us all to choose from, hoping to give his precious girl a beautiful and bright name. Professor Chou was my first mentor at work and my co-advisor in graduate school; his effort and achievements are a model for my whole life. In industry he was a professional consultant; in academia he was a rigorous master. With a shelf of publications to his name, he left a lasting example for statistics and business administration.<\/p>\n<p><a href=\"http://docs.google.com/leaf?id=0B7IuUJKEN1UbMzA2ZmQwNzItOWM2ZS00MTIyLWE2OWYtY2U5NGRkY2I4ZDQ5&amp;sort=name&amp;layout=list&amp;num=50\">http://docs.google.com/leaf?id=0B7IuUJKEN1UbMzA2ZmQwNzItOWM2ZS00MTIyLWE2OWYtY2U5NGRkY2I4ZDQ5&amp;sort=name&amp;layout=list&amp;num=50<\/a><\/p>", "zt": "非常感謝 Ariel Chen 找回了10多年前論文, …"}, {"id": "f1369655776", "file": "2013-05-27-f1369655776", "date": "2013-05-27", "title": "My child's schooling in Hualien is good in many ways, but this forced Confucian drilling is hard to accept…", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray finds it hard to accept the forced memorisation of Confucian classics in Hualien primary schools, and wonders whether children really need to memorise Zhu Xi's Family Maxims.", "len": 897, "body": "<p>My child's schooling in Hualien is good in many ways, but this forced Confucian drilling is really hard to accept!!<\/p>\n<p>Before finishing primary school, children have to memorise, mindlessly, the Standards for Being a Good Student and Child (Di Zi Gui), the Three Character Classic, the Analects, Tang poems, Zhu Xi's Family Maxims, the \"Great Harmony\" chapter of the Book of Rites, and Zhuge Liang's Letter to His Son. Item seven of the Hualien County Government's inspection recommendations even says teachers need not explain it line by line, and can simply offer \"teachable moments\" when these things come up in daily life!<\/p>\n<p>I had never read Zhu Xi's Family Maxims myself. After looking up the full text online, I felt even more strongly: does this really need to be memorised by children?<\/p>\n<hr />\n<p>Rise at dawn and sweep the courtyard, keeping the inside and outside of the house clean and tidy. Retire at dusk, lock the doors and gates, and always check them yourself. Of every bowl of porridge and every meal, remember how hard it was to come by; of every half thread and half strand, always think how difficult the materials were to produce. Prepare before the rain comes; do not dig the well when you are already thirsty. Be frugal in your own living, and do not linger over banquets for guests. Utensils that are simple and clean are better than gold and jade; meals that are plain and refined are better than rare delicacies. Do not build grand houses, and do not scheme for fine fields.<\/p>\n<p>Gossipy matchmakers and female busybodies are the go-betweens of lewdness and theft; a beautiful maid or a charming concubine is no blessing for the household. Do not employ handsome servants, and wives and concubines should avoid showy make-up. Though your ancestors are far away, the sacrifices to them must be sincere; though your descendants may be dull, they must still read the classics. Aim for simplicity in how you conduct yourself, and raise your sons with a sense of righteousness. Do not covet windfall wealth, and do not drink wine to excess.<\/p>\n<p>Do not take advantage of peddlers who carry their goods on a shoulder pole; when you see poor and struggling relatives and neighbours, be generous in sympathy and help. A family built on meanness will not enjoy its fortune for long; where the proper human relationships are violated, ruin soon follows. Brothers, uncles and nephews should share their means generously with the poor; elders and juniors, those within the household and those without, should be governed by strict and orderly speech. To heed a wife's words and estrange one's own flesh and blood — how is that the conduct of a husband? To prize wealth and slight one's parents — that does not make a proper son. When marrying off a daughter, choose a good son-in-law and do not demand a heavy betrothal gift; when taking a daughter-in-law, seek a virtuous woman and do not count the size of her dowry.<\/p>\n<p>To look at the rich and powerful with a flattering face is the most shameful thing; to put on airs of arrogance before the poor is the lowest thing of all. In your household, avoid quarrels and lawsuits, for lawsuits end only in misfortune. In dealing with the world, avoid talking too much, for the more you say, the more you will get wrong. Do not rely on power to bully orphans and widows, and do not indulge your appetite by needlessly slaughtering birds and animals. Perversity and self-righteousness bring much regret and error; idleness and self-indulgence will never build a f
