<p>I pray deeply and hope that wounded Hualien will slowly recover.<\/p>", "zt": "20240403花蓮地震"}, {"id": "f1711120327", "file": "2024-03-22-f1711120327", "date": "2024-03-22", "title": "Do You Dream of Working on a Cruise Ship?", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Careers & Courses", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Resorts World Cruises will hold an introduction session on 3/29 and online interviews in March and April for cruise internships won by Professor Chi-Wen Wu.", "len": 191, "body": "<p>Do You Dream of Working on a Cruise Ship?<\/p>\n<p>The cruise service staff interviews that many people have been curious about are finally here, a cruise internship opportunity that Professor Chi-Wen Wu worked hard to win. Resorts World Cruises will first give an introduction to the job next Friday, 2024/3/29, with a Q&amp;A session, and then arrange online interviews in March and April.<\/p>\n<p>Interview time: See the login link for details (in the comments)<\/p>\n<p>Interview format: Online interview<\/p>\n<p>Eligible candidates: Alumni, graduating students and those about to start internships.<\/p>\n<p>Note: Even if you have not yet been trained or received a seafarer's book, you can still sign up if you intend to work on a cruise ship this year. After the interview, you will be notified of the next training course.<\/p>\n<p>The full-time recruitment is looking for fourth-year students and graduates who are willing. If you have already graduated and are working but still want to work on cruise ships, or if you have friends who are interested, this is a rare opportunity. Please join, spread the word, and give yourself a chance to make your dream come true.<\/p>\n<h1>PleaseShare<\/h1>\n<h1>SignUpInComments<\/h1>", "zt": "你有郵輪工作的夢想嗎？"}, {"id": "f1709346161", "file": "2024-03-02-f1709346161", "date": "2024-03-02", "title": "A Quick Guide to 2024 University GSAT Placement Analysis Tools", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A list of websites and apps for estimating which university departments your 2024 GSAT scores can get you into, including the official application portals.", "len": 68, "body": "<p>A Quick Guide to 2024 University GSAT Placement Analysis Tools<\/p>\n<p>🎯Yi Quan Enterprise <a href=\"https://www.com.tw/p.html\">https://www.com.tw/p.html<\/a><\/p>\n<p>🎯Winner Education Placement System <a href=\"https://www.xn--kbry83cgjudux.tw/\">https://www.xn--kbry83cgjudux.tw/<\/a><\/p>\n<p>🎯104 Bank <a href=\"https://student.104.com.tw/hs/\">https://student.104.com.tw/hs/<\/a><\/p>\n<p>🎯1111 Job Bank Placement Analysis <a href=\"https://hs.1111.com.tw/\">https://hs.1111.com.tw/<\/a><\/p>\n<p>🎯Zhen Zhan AI Placement <a href=\"https://www.reallygood.com.tw/forecast/index\">https://www.reallygood.com.tw/forecast/index<\/a><\/p>\n<p>🎯Lexue Network <a href=\"https://exam.347.com.tw/apply/#use-area\">https://exam.347.com.tw/apply/#use-area<\/a><\/p>\n<p>🎯University Student Gan Dan app <a href=\"https://apps.apple.com/us/app/id786897895\">https://apps.apple.com/us/app/id786897895<\/a><\/p>\n<p>📌College Entrance Examination Center, University Admissions Committee (official) <a href=\"https://www.cac.edu.tw/apply113/system/ColQry_vforStu113apply_GF84ad9zx/QrybyStuTGrd3.htm\">https://www.cac.edu.tw/apply113/system/ColQry_vforStu113apply_GF84ad9zx/QrybyStuTGrd3.htm<\/a><\/p>\n<p>📌Joint Admissions for the Four-Year Technical Programme, Day Division, Application Admission (official, for high school graduates)<\/p>\n<p><a href=\"https://techexpo.moe.edu.tw/search/profile_classes.php?comid=comc04&amp;cid=216\">https://techexpo.moe.edu.tw/search/profile_classes.php?comid=comc04&amp;cid=216<\/a><\/p>", "zt": "2024大學學測落點分析工具懶人包"}, {"id": "f1707647211", "file": "2024-02-11-f1707647211", "date": "2024-02-11", "title": "152 Straight Weeks of Running: Another Year with My Apple Watch", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Running & Exercise", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "After 152 consecutive weeks of running with my Apple Watch, here are six updated thoughts, from marathon battery anxiety to its price.", "len": 309, "body": "<p>152 consecutive weeks of running means this Apple Watch (AW) is almost 3 years old. I wrote up my thoughts last year, and a year later I have quite a few new impressions:<\/p>\n<ol>\n<li>\n<p>Over these three years, whether the AW can be worn to run a full marathon has always been a question. After running the Evergreen Marathon last year, I truly feel that at my pace the AW is not up to running a marathon. Besides worrying about whether I would have the stamina to finish, the long GPS timing sync gave me battery anxiety while wearing it, not to mention the worry about being swept off the course, aid stations running short of things and later even out of water. With all these anxieties, if I take on another one this year I will have to find another solution.<\/p>\n<\/li>\n<li>\n<p>I used to care about whether the AW could sync podcasts and Bluetooth headphones. Now I don't want to listen to anything while running, so my bone-conduction headphones and syncing problems are all gone.<\/p>\n<\/li>\n<li>\n<p>The AW can work as an Apple Pay offline credit card, which is very convenient, but since I changed phones it hasn't been able to sync and can't make offline payments. It's still a nuisance.<\/p>\n<\/li>\n<li>\n<p>The AW lets you check your heart rate and health indicators at any time. I still highly recommend this part.<\/p>\n<\/li>\n<li>\n<p>The battery lasts only one day before it needs charging, which is a hassle for trips since you have to carry a charging cable. On my first trip abroad after the pandemic I wore my original Seiko mechanical watch instead. Not to mention that electronics can't be worn at the TOEIC or other important exams, and an empty wrist during an exam feels very insecure.<\/p>\n<\/li>\n<li>\n<p>The biggest drawback is still that the AW is too expensive. Time is priceless.<\/p>\n<\/li>\n<\/ol>", "zt": "連續跑步152週表示這隻Apple Watch (AW)…"}, {"id": "f1704516904", "file": "2024-01-06-f1704516904", "date": "2024-01-06", "title": "Fewer High School GSAT Test-Takers Than University Places", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A parent's grumbles about the General Scholastic Ability Test: fewer candidates than university seats, and a disproportionate share of exam time given to Chinese.", "len": 439, "body": "<p>Fewer High School GSAT Test-Takers Than University Places<\/p>\n<p>The General Scholastic Ability Test (GSAT) for Year 113 of the Republic (2024) will be held from January 20 to 22, with an estimated 120,000 candidates registered. In Year 109 (2020), Taiwan's universities (excluding vocational universities of technology) offered 174,000 places for new students. The Ministry of Education's statistics (see the attached image) are released more slowly, but the figure should not be much different.<\/p>\n<p>What follows is some grumbling from the parent of a candidate. Read on only if you're interested.<\/p>\n<h1>The time and weight given to each subject are unreasonable<\/h1>\n<p>The GSAT subjects are Chinese (180 minutes), English (100 minutes), Mathematics A (100 minutes), Mathematics B (100 minutes), Social Studies (110 minutes) and Natural Sciences (110 minutes), six subjects in all. In terms of exam time, Chinese takes up two class periods. What's more, the GSAT Chinese exam is split into 2 papers, [Integrated Chinese Language Ability] and [Chinese Writing Ability], each 90 minutes.<\/p>\n<p>The Integrated Chinese Language Ability test has an astonishing number of questions, up to 14 pages packed with them. There are 25 single-choice questions worth 2 points each, 7 multiple-choice questions worth 4 points each, mixed questions including 2 single-choice questions at 2 points, and 4 short passages at 4 points each. The questions are highly varied and have almost no overlap with the curriculum guidelines.<\/p>\n<p>The Chinese Writing Ability test has two major questions, worth 25 points each. The first is divided into 2 sub-questions, mainly argumentative essays. The second tests candidates' ability to express feelings and sentiments, and asks them to write 3 pieces within 90 minutes.<\/p>\n<h1>Sorry, Chinese teachers<\/h1>\n<p>I ask high school Chinese teachers to stop demanding that this or that important text be added to the curriculum, because it means nothing for the nation's future strength or for education. By contrast, I think the STEM-related Natural Sciences paper is vitally important: testing the fundamental abilities of four subjects, physics, chemistry, biology and earth science, in 110 minutes is highly unreasonable in terms of time proportion. For a Taiwan to which technological development matters so much, the fact that top universities' quality departments have abandoned the Chinese score shows that Chinese as a subject is completely out of balance between the supply side of high school teaching and the demand side of society's professional needs.<\/p>\n<p>I love reading and writing very much, but I hardly remember what I read or what I was tested on in Chinese class in junior high and high school, and I have also forgotten what I stated in my essays in those few short dozen minutes.<\/p>", "zt": "高中學測人數<大學招生人數"}, {"id": "f1704297365", "file": "2024-01-03-f1704297365", "date": "2024-01-03", "title": "Times Change and Things Move On", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Overseas Study Tours", "det": "Cross-Strait & Southeast Asia", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "As my class of 41 Vietnamese students nears the end of its course, I recall my 1995 exchange trip to Ho Chi Minh City and reflect on their life in Taiwan.", "len": 552, "body": "<p>Times Change and Things Move On<\/p>\n<p>As the new year begins, the course for the Vietnamese international class is also nearing its end. Over a year of classes and interaction, I have slowly gotten to know all 41 students from all over Vietnam. Since I took part in a short student exchange visit to Nong Lam University in Ho Chi Minh City in 1995, my classmates back then are probably the parents of this group of students now, so it feels very familiar that their children come to study in Taiwan and meet them in my classroom.<\/p>\n<p>The photo taken at Nong Lam University in Ho Chi Minh City shows my Vietnamese classmates of those days, and now I have Vietnamese students in my class. Before the trip abroad, the chair of the Fu Jen sociology department, whom I called Boss, instructed me over and over not to be too flashy by shopping and showing off wealth, because 30 years ago the standard of living in Vietnam was some way behind Taiwan's. Today, Vietnamese students find Taiwanese tuition reasonable, and living in rented rooms in New Taipei with the transport is acceptable to them. At a meeting today I also heard that many private vocational high schools have brought in large numbers of foreign students to make up for the shortage of local ones, with foreign students reaching nearly half of enrolment, becoming the bread and butter of private-school teachers.<\/p>\n<p>The Vietnamese class at HWU is the spring intake. I am not very clear about the channel through which they came to study in Taiwan, but it must be through the university's International Affairs Office recruiting on the ground. The students told me that the first semester's tuition is subsidised by the Taiwanese government and that they pay for the following seven semesters themselves. I was curious and asked what university tuition costs in Vietnam. They said it is about the same as in Taiwan, 40,000 to 50,000 NT dollars a semester, so studying in Taiwan is an economical and good-value choice.<\/p>\n<p>For a full four years, these students are like Taiwanese university students: they take part in campus courses and activities during class time and, after class, go to work part-time just as their Taiwanese classmates do. On holidays they can travel freely around Taiwan, with no one managing them as a group and no collective work in factories. On their Instagram or Facebook you can see records of their trips and food all over Taiwan, and I am quite envious. The students can't all be called diligent, and their phones never leave their hands. Their whole outfits are bought online, and they don't lack for trendy shoes and clothes. I hear they have their own channels, which are much cheaper than Taiwanese retailers.<\/p>\n<p>Now attendance in class every week is very high, and in recent weeks everyone has been present with no absences, handing in assignments and sitting exams without exception. When I hand back marked handouts, students receive them with both hands, make eye contact and say thank you, which is very polite.<\/p>\n<p>Becoming their teacher is a matter of fate. A few days ago in class I told the students I would like to learn Vietnamese, and asked how much they would charge for an hour of tutoring.<\/p>", "zt": "往事悠悠物換星移"}, {"id": "f1703735112", "file": "2023-12-28-f1703735112", "date": "2023-12-28", "title": "Posting the Requirements of a Recent Quality Internship Host", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The requirements of a good internship host, followed by a tongue-in-cheek translation into plain student language.", "len": 167, "body": "<p>Posting the requirements of a recent quality internship host:<\/p>\n<p>Eligibility: please see the attachment.<\/p>\n<p>Additional notes:<\/p>\n<p>(1) Average grade of 70 or above in all subjects and average conduct grade of 80 or above while at school, with no demerit record.<\/p>\n<p>(2) Familiar with basic computer word-processing systems; positive, proactive, enthusiastic and responsible, patient and careful; willing to try club activities, all kinds of part-time jobs or off-campus service; happy to learn diverse things and accept challenges.<\/p>\n<p>(3) Applicants from non-related departments applying for the OO job category must have taken basic OO-related courses and provide written records (transcripts, etc.).<\/p>\n<p>Translated into student campus language, that means:<\/p>\n<p>(1) Come to class properly; don't sleep through the daytime, don't bully classmates or scold teachers.<\/p>\n<p>(2) Use the computer to write reports more, and read from your phone less. Part-time jobs, clubs and volunteering all matter. In competitions, be the team leader or person in charge.<\/p>\n<p>(3) Certificate exams matter a lot; don't take courses that are too easy.<\/p>", "zt": "貼一個近期優質實習單位的要求內容："}, {"id": "f1702435340", "file": "2023-12-13-f1702435340", "date": "2023-12-13", "title": "Registration Open for the 2024 Tourism Administration Tour Guide and Tour Leader Exams", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Exam Info & Tips", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Registration closes 21 December. International students can register with a residence permit number, but Vietnamese students may only register for foreign-language tour guide.", "len": 294, "body": "<p>Registration open for the 2024 Tourism Administration tour guide and tour leader assessment exams<\/p>\n<p>2024 Cơ quan Du lịch và Hướng dẫn viên đang tiến hành đăng ký kỳ thi đánh giá hướng dẫn viên lãnh đạo<\/p>\n<p>Registration closes on December 21. The registration link is in the comments.<\/p>\n<p>Because the Department of Travel Management at Hsing Wu University (HWU) has quite a few international students, students cannot register on the assessment system using a passport number. Vietnamese students can only register for the foreign-language tour guide exam. Remember that of the four exam subjects, the three professional subjects are still set in Chinese, so I suggest that only students with strong Chinese reading ability register. Those who have not prepared by studying should not register, otherwise the NT$1,000 registration fee is wasted.<\/p>\n<p>Ngày đăng ký chỉ đến ngày 21 tháng 12, địa chỉ đăng ký nằm trong phần bình luận.<\/p>\n<p>Vì Trường du lịch Xích Thông có nhiều sinh viên nước ngoài, sinh viên không thể đăng ký hệ thống đánh giá bằng số hộ chiếu. Sinh viên Việt Nam chỉ có thể đăng ký hướng dẫn viên nước ngoài. Hãy nhớ rằng ba môn thi chuyên ngành vẫn được đặt bằng tiếng Trung, nên sinh viên có khả năng đọc tiếng Trung cao mới nên đăng ký, những người không chuẩn bị học sách không nên đăng ký, nếu không sẽ là một sự lãng phí phí đăng ký là NTD1000.<\/p>\n<h1>InternationalStudentsShouldBeAbleToRegisterWithResidencePermitNumber<\/h1>\n<h1>OnlyForeignLanguageTourGuideHasVietnamese<\/h1>\n<h1>ForeignLanguageTourLeaderHasOnlyFiveLanguagesNoVietnamese<\/h1>\n<p>Sinh viên nước ngoài nên có thể sử dụng số chứng minh thường trú để đăng ký<\/p>\n<p>Hướng dẫn viên nước ngoài mới có tiếng Việt<\/p>\n<p>Người hướng dẫn nước ngoài chỉ có năm ngôn ngữ mà không có tiếng Việt<\/p>\n<p>The Vietnamese above was translated with AI.<\/p>", "zt": "2024觀光署導遊領隊評量考試報名中"}, {"id": "f1702025388", "file": "2023-12-08-f1702025388", "date": "2023-12-08", "title": "Hundun Gets His Seven Openings", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Running & Exercise", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A late-night drive, a conversation about Zhuangzi with my child, and a teaching philosophy drawn from the fable of Hundun: give learners resources, not forced openings.", "len": 517, "body": "<p>【Hundun Gets His Seven Openings】<\/p>\n<p>The emperor of the South Sea was Shu, the emperor of the North Sea was Hu, and the emperor of the Centre was Hundun (Chaos). Shu and Hu often met in the land of Hundun, and Hundun treated them very well. Shu and Hu discussed how to repay Hundun's kindness, saying: \"All people have seven openings for seeing, hearing, eating and breathing, but this one alone has none. Let's try boring some for him.\" Each day they bored one opening, and on the seventh day Hundun died. [Zhuangzi, \"Normal for Emperors and Kings\"]<\/p>\n<p>Every night after cram school, on the drive home, I mostly listen to podcasts while driving. The daily round trip between the basin and the plateau becomes a stretch of self-learning time, mostly interviews and thought-provoking content. I love and treasure this time, just like my 30-minute run every day: it resets body and mind.<\/p>\n<p>One day my child, who is usually quiet and resting in the back seat, broke the silence and mentioned a passage we had just heard. He said his classmates had been discussing how the human soul might be antimatter, something current science simply cannot prove, which doesn't mean it doesn't exist. He also said he very much likes Zhuangzi's view of the universe, a very scientific kind of philosophical thinking.<\/p>\n<p>I was surprised that, on top of the maths, physics, chemistry and English he studies at cram school every night, he was discussing Zhuangzi with me. Right then I talked with him about Zhuangzi's philosophy, from the perspective of fish versus humans to dreams versus reality, and about my own view of the universe and my values. There wasn't much I could discuss with him, because I don't have a PhD and I'm certainly not a scientist, just a family member who tries to find time to read and listen to books alongside my child.<\/p>\n<p>In the fable of Hundun, Shu and Hu cleverly \"open up\" Hundun, and as a result Hundun is killed. My child is about the same age as my students. I'm not an anxious father, nor a teacher who pushes students. In learning, I truly agree with the way of Zhuang Zhou. Each student in class needs something different. Students are like Hundun in the sea, encountering all kinds of ideas and norms in the great ocean of knowledge and expertise. So Hundun doesn't need openings; he can feel, think and take shape through his natural, innate perceptions. When students come to campus, the teacher should give as many learning resources as possible, let students find the teacher to chat, and give them a safe place to lean on when they are troubled. Quite naturally, year after year goes by, and students may grow their own seven openings and unlock their wisdom.<\/p>\n<p>If a teacher believes it is so necessary to dwell on a single missed essay such as Gu Yanwu's \"On Integrity and Shame\", that is like Shu and Hu boring openings in their self-righteousness. Boring one opening a day, they slowly smother the possibilities of the student's development.<\/p>", "zt": "【渾沌開竅】"}, {"id": "f1700921523", "file": "2023-11-25-f1700921523", "date": "2023-11-25", "title": "When the Cart Reaches the Hill, a Road Will Appear: Simply Providence", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Attending the 2023 Chinese Society of Tourism Management conference at Providence University, I recalled years of organising conferences in Hualien and felt it was providence.", "len": 561, "body": "<p>When the Cart Reaches the Hill, a Road Will Appear: Simply Providence<\/p>\n<p>I left home at first light to attend a conference I had long looked forward to, the 2023 conference of the Taiwan Society of Tourism Management. It was not because the host was the TSSCI-indexed Journal of Tourism and Leisure Studies; I actually went to find something again.<\/p>\n<p>The society's conference is one of the most important gatherings of research for Taiwan's tourism and hospitality academics. When it was founded 31 years ago, it was formed by a few senior professors from the handful of universities with tourism-related departments and graduate institutes at the time: Chinese Culture, Shih Hsin, Providence, Hsing Wu and Ming Chuan. I was required to join as a student in 1999 when I was studying in the tourism graduate institute, but my first real paper presentation was at the 2000 Kaohsiung Hospitality College conference.<\/p>\n<p>By happenstance I later went to work at the Hualien tourism college, and began another round of organising academic conferences. Which of these events have my friends attended?<\/p>\n<p>2010 Asia Tourism Forum @ Hualien Ideal Land<\/p>\n<p>2011 World Culinary Forum @ Chientan (Youth Activity Center), Taipei<\/p>\n<p>2012 APTA Asia Pacific Tourism Association International Conference @ Yuanshan, Taipei<\/p>\n<p>2014 Cross-Strait Tourism Conference @ Fuzhou, China<\/p>\n<p>2016 Tourism Industry Innovation and Quality Service Workshop @ Hsing Wu, Linkou<\/p>\n<p>2018 Global Chinese Tourism and Hospitality Summit @ Hsing Wu, Linkou<\/p>\n<p>Compiling this list reminded me how many friends and peers I annoyed with my frantic emails. It also reminded me of how fast I walked across the Shoufeng campus, answering everything immediately, strange behaviour that really did not fit the relaxed life of Hualien or its quiet campus. I remember several times being so busy that my car ran out of fuel and stopped by the highway, and I had to phone a colleague to pick me up and then go fetch my child to our rented home. Once I even drove my little dog to the school by mistake, and only discovered him sleeping in the back seat when I stopped and closed the car door. I then drove him back to the daycare in Jian.<\/p>\n<p>The next ten thousand words are omitted......<\/p>\n<p>Back in Taichung, basking in the warm sun, I thought of the peaceful time of my childhood with my grandparents in the Chung Hsing University dormitory. My last training event at Providence University was the 1992 HTML campus camp on information networks, and I still remember the computer science teachers teaching simple lessons on editing code to make web pages. As the car reached the gate I saw the English name Providence University. What a simply providence. It was surely heaven's will, asking me to come to the conference with a simple heart and role: to chat with teachers and senior colleagues, to present a paper on institutional research, to accompany a lovely Hsing Wu advisee, now a graduate student in hospitality at Fu Jen, as she presented her master's thesis, and to serve as session chair commenting on six very interesting studies. Thank you to the organising team of the Department of Tourism at Providence University, and thank you to the society's team.<\/p>\n<p>A wonderful day.<\/p>\n<p>I thought of my teachers' guidance, of the details of organising events, of the air in Hualien, and of myself as a student.<\/p>", "zt": "車到山前必有路 Simply Providence"}, {"id": "f1700382103", "file": "2023-11-19-f1700382103", "date": "2023-11-19", "title": "[Current Affairs]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray's 2011 cruise study with Alumi Lu was featured as a chi-square case in Ken Black's Business Statistics; he reflects on statistics and shares the case.", "len": 818, "body": "<p>[Current Affairs]<\/p>\n<p>Current affairs soon become the past, and where there is a wish, it will come true.<\/p>\n<p>A close friend sent me a screenshot of a statistics text, which was a surprise and a delight, so happy that I could hardly speak.<\/p>\n<p>I immediately shared it with the first author, Teacher Alumi Lu.<\/p>\n<p>-----Updated 2023.11.26-----<\/p>\n<p>Statistics is not easy to learn, and once learned, you don't know where to use it.<\/p>\n<p>After finishing graduate school, I discovered that the statistical methods in academic papers come in all varieties, and are difficult and unfathomable. Statistics is a specialty, and for many people it is a hurdle. These past few days, everyone has been stuck between 3% and 6%, each with their own explanation, which is truly helpless.<\/p>\n<p>At this moment, when everyone is so fond of statistics, I want to use this post to look for an original textbook:<\/p>\n<p>Business Statistics: For Contemporary Decision Making, 8th Edition, published by Wiley,<\/p>\n<p>Author: Ken Black<\/p>\n<p>I have searched many libraries in Taiwan and none have this book. It has now reached its 11th edition. I would very much like to see the printed pages listed, and I don't know where to find a copy.<\/p>\n<p>The attached pages are the cruise study of city image across port cities in the three regions on both sides of the Taiwan Strait, which Teacher Lu and I co-published in 2011. It was included by statistics master Dr. Ken Black as a business case in his enduring masterpiece, \"Business Statistics.\"<\/p>\n<p>Students and graduate students still interested in statistics can read carefully the proof pages that the Wiley editor sent us back then. Dr. Ken Black used our cruise survey case to illustrate the use of the chi-square test in business decisions, and urged students to read and think deeply about the reasons behind the statistics, and gave researchers suggestions on comparing the statistical methods he mentions with their purposes.<\/p>\n<p>I remember then the many people on board the SuperStar Virgo of Star Cruises who worked hard to collect hundreds of tourist surveys. Our study used only the most basic chi-square test to verify hypotheses. Using the statistical methods I had not yet given back to my teachers, I thought about the fundamental questions and research goals for our target cruise passengers, and used a suitable research method to test whether it fit the pattern of facts we originally wanted to understand.<\/p>\n<p>I can look myself in the eye, and my heart is at ease.<\/p>\n<hr />\n<p>2025.11.19<\/p>\n<p>Below is the full text of the AI translation into Chinese:<\/p>\n<h1>CriticalThinkingInTodaysBusinessStatistics<\/h1>\n<h1>CityImageOfTaiwanStraitCruiseDestinations<\/h1>\n<p>Researchers Chiang-Chuan Lu (Alumi Lu) and Ruey-Feng Chen conducted a study with the aim, in part, of finding out whether cruise passengers perceive differences in the city image of three port cities across the Taiwan Strait: Hong Kong, Shanghai and Taipei. The researchers administered questionnaires to cruise passengers over four years to collect data. Approximately half of the respondents were male and half female, and over 50% had a university education. Slightly more than half of the respondents were from one of the three ports in the study, and 72% were from Malaysia, Singapore, China or Taiwan.<\/p>\n<p>One of the research hypotheses was whether travellers living in the three cities (Hong Kong, Shanghai, Taipei) differ from travellers living elsewhere in whether they perceive differences in the image of the three cities. To test this hypothesis, the researchers conducted a chi-square test of independence. Below is the 2×2 contingency table and raw data used for this test:<\/p>\n<p>Difference perceived / No difference perceived<\/p>\n<p>Residents of the three port cities 58 5<\/p>\n<p>Residents of other places 37 25<\/p>\n<p>The null hypothesis of this test is that views on whether the three port cities differ in image are independent of the respondent's place of residence. The chi-square value calculated from the data is 17.97. At a significance level of α = 0.05 and degrees of freedom df = 1, the critical value is 3.8415. Since 17.97 is greater than 3.8415, the decision is to reject the null hypothesis. That is, the perception of whether the three port cities differ is not independent of where the traveller lives.<\/p>\n<p>In fact, over 90% of travellers living in the three port cities believed the three cities differ, whereas among travellers living elsewhere, only slightly under 60% believed there were differences.<\/p>\n<h1>ThingsToPonder<\/h1>\n<p>Why do you think such a high proportion of residents of the three port cities believe the three cities are different, while the proportion among out-of-town travellers is clearly lower?<\/p>\n<p>How could this question be analysed using the methods of Section 10.4 of this book? Compare the results of using that section's techniques with the chi-square test of independence in this example, noting similarities and differences.<\/p>\n<p>Source: Chiang-Chuan Lu and Ruey-Feng Chen, \"Differences in Tourism Image Among Cruise Passengers across the Taiwan Straits,\" Global Journal of Business Research, Vol. 5 (2011), 95–108.<\/p>", "zt": "【時事】"}, {"id": "f1698104510", "file": "2023-10-24-f1698104510", "date": "2023-10-24", "title": "Teacher, Why Didn't You Fight Back?", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A reflection on the video of a Keelung vocational teacher abused by students in a baking classroom, and a call to protect teachers on private campuses.", "len": 784, "body": "<p>Teacher, Why Didn't You Fight Back?<\/p>\n<p>Late last night this video suddenly appeared online. I found it shocking and had nightmares all night. Was it fear? Perhaps, because I woke from a bad dream and couldn't get back to sleep.<\/p>\n<p>I dreamed that I too was dealing with a conflict between students. In the dream I could clearly see the vicious glares between them. I stepped in between two boys in conflict. One of them was clenching his fists and spewing unspeakable curses, demanding that the other come out and settle it. I saw their hostile eyes and felt the animal violence of young blood running hot, and I felt that perhaps I would have to take a few punches before the students stopped. Then I woke up in a fright.<\/p>\n<p>As a fellow teacher at a private institution, I truly want to pay my respects to this teacher, because in her place I would have hit back long ago. Yet she used all her patience to explain the department's and the teaching's position to the furious students, defending what little dignity remained to her as a teacher. In a baking classroom, a teacher should be making good use of all kinds of equipment to demonstrate professional skills, teaching students hand in hand how to make nutritious and delicious cakes and breads, just like the professional beauty and social responsibility of vocational education described in many well-known lifestyle magazines. Yes, most campuses in Taiwan are like that. The students at the School of Tourism and Hospitality where I work are even more earnest, polite, dedicated and good at working with others, and anyone who has the chance to visit our campus will feel it deeply.<\/p>\n<p>But in the video, this teacher had to stand bravely in front of her students, tidying chairs that had been knocked all over the floor, handling her own emotions and the difficulty of managing the classroom, enduring the students' out-of-control responses, while actively facing their provocation and abuse. Throughout, she tried to guide students not to do wrong or say wrong things, through both her example and her words. She was even asked to leave the classroom first to reduce the chances of anyone doing or saying something wrong, until she walked out of her classroom, her lecture hall, her kitchen, leaving behind a group of self-righteous students with no upbringing.<\/p>\n<p>I think she must have been afraid too, especially when students' chairs were flying straight at her head. All the while she was defending her teaching space. A classroom has a sacredness about learning. We teachers are ordinary people who get tired, lazy and annoyed, but as soon as we step onto the podium our role is to pass on the way, impart knowledge, resolve doubts and teach according to each student's aptitude.<\/p>\n<p>Choosing to be a teacher may mean having a bit of counselling skill, a bit of conscience and a bit more kindness.<\/p>\n<p>But teachers don't come to campus to solve students' social affairs, family difficulties, emotional troubles or physical fights, let alone to risk their personal safety. On campus there are teachers actively refining their teaching skills for their students' learning, teachers who have long cared for students and built family-like bonds with them, and teachers who worry that the pressure of entrance exams overworks both students and teachers and who find every way to squeeze time out of busy administrative duties to counsel students again. This is the everyday life of teachers.<\/p>\n<p>As a fellow vocational teacher, I once again offer my highest respect and concern to this university teacher in Keelung.<\/p>\n<p>These days \"fight the teacher\" has replaced the classic three-word Taiwanese curse as a joke made behind people's backs in many settings. On campus, teachers sometimes face students who have long lost interest in learning, silent classrooms, and even, as the video showed, maliciously threatening words and out-of-control physical conflict. As a vocational teacher myself, I watched the video and could not sleep all night.<\/p>\n<p>Turning this profession into a vocation is much harder in today's social climate than in the past, and even more so for private school teachers, who lack full job protection. I hope the school will provide legal assistance, so that teachers are not left as victims on campus. The one cursing was not only a student but also an adult over 18 who must take responsibility for his improper behaviour and words. And do not let the perpetrator be inexplicably protected on campus in the name of the right to an education.<\/p>\n<p>Don't let teachers leave in helpless disappointment, like the uproar at the end of the video, as the classroom is taken over by the students...<\/p>", "zt": "老師，您為什麼不還手！"}, {"id": "f1697080432", "file": "2023-10-12-f1697080432", "date": "2023-10-12", "title": "One Blade of Grass, One Drop of Dew", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "With fewer than 130,000 newborns a year, Taiwan should focus on nurturing every young person's potential rather than only worrying about private universities closing.", "len": 409, "body": "<p>One Blade of Grass, One Drop of Dew (Taiwanese proverb: every living thing has its own share of nourishment)<\/p>\n<p>A few days ago I returned an item at a nearby home goods store. Because I had paid with my Apple Watch, the clerk had to write the refund method on the return slip. The young clerk stopped mid-writing and turned to others for help, because he, who looked about 18, could not spell the word APPLE.<\/p>\n<p>Newborns in Taiwan this year, 2023, may be fewer than 130,000, lower than last year. Given how unfriendly the school system, the social atmosphere and the overall environment are, what reason do we have to ask young people to have children?<\/p>\n<p>If a country in the future has only 130,000 new school entrants a year, I think what we should discuss is not the falling birth rate \"tsunami\" of private schools unable to recruit students, but, more importantly, how to educate and cultivate those 130,000 babies born each year. The old exam-based competitive, tiered system existed because the population was large and there were too few places for too many people. Now that only 130,000 precious children remain, every young person is part of the nation's strength. Finding each individual's potential, rethinking how they learn, and strengthening their abilities so they become professionals or capable talents is a task for everyone in a society that wants to progress.<\/p>\n<h1>楊陽英文 (Yang Yang English) noted in a shared post: the ranking lists do not show that every year possibly tens of thousands of high school students give up on learning English. This suggests that school English teaching currently leaves too many students behind and makes them give up, and teachers should reflect on this. Exempting these tens of thousands of students who have lost interest from the required English courses at every school, and appropriately directing them into other training or learning with development and potential, might be the solution. In the longer term, we must plan how to integrate bilingual ability into teaching so that students are not afraid of English, and stop defining student outcomes by scores. That is the direction educators should think about.<\/h1>\n<p>On another note, private schools that cannot find students should simply close. Having the Ministry of Education take charge of placing the school property instead misallocates professional staff and wastes national education resources. When a school cannot recruit students, its campus is just a piece of empty land.<\/p>", "zt": "一支草一點露"}, {"id": "f1696731834", "file": "2023-10-08-f1696731834", "date": "2023-10-08", "title": "Counting the Friends Around Me, I Feel Deeply Fortunate: From Primary School, Junior High, Early and Late High School...", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "I'm grateful for friends from every stage of life, though I forget conversations, which strained my marriage. Becoming a father taught me what it means to love someone.", "len": 185, "body": "<p>Taking stock of the circle of friends around me, I feel deeply fortunate: from primary school, junior high, early high school, late high school, university, army comrades, colleagues, graduate school classmates, academic partners and more. I am truly grateful to have met so many people.<\/p>\n<p>Sadly, although my mind remembers surrounding scenery at a glance, my memory of conversations and interactions between people is very vague. Because of this, my partner has been very unforgiving. What she cares about, I don't remember; what she doesn't mind, I feel deeply. This has caused a great deal of unhappiness in our married life.<\/p>\n<p>Until my son came into this world.<\/p>\n<p>Because of him, I felt for the first time that besides myself there was someone in this world I care about enormously, not out of romantic love, and not out of self-love, but simply and purely loving one person, a unique individual.<\/p>\n<p>I think my partner feels the same as I do. Without him, the two of us, such self-centred individuals, would have had a hard time finding common ground, let alone similarities to last a lifetime.<\/p>", "zt": "盤點身邊的朋友群深感幸運，從國小、國中、高中前期、高中後…"}, {"id": "f1694306336", "file": "2023-09-10-f1694306336", "date": "2023-09-10", "title": "If Teachers All Get the Same Salary, Then Of Course They'd Look for the School Where They Control Their Own Time…", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Reflections on Chinese Culture University's troubles: lax teachers, unmotivated students and no investment, with a school that has run on tuition income for years.", "len": 98, "body": "<p>If teachers' pay is all the same, then of course they will look for the school where they have the most control over their own time, and use the extra time for a second career to make a profit. The problems of Chinese Culture University were already there when I studied there many years ago: lazy teachers, students who don't work hard, no investment in the campus or facilities, and a management approach that has always been about collecting tuition and accumulating capital.<\/p>\n<p>That it has come to this today is, I think, simply cause and effect. <a href=\"https://tw.news.yahoo.com/%E5%85%BC%E8%A1%8C%E6%94%BF%E8%81%B7%E6%8A%B5%E9%90%98%E9%BB%9E-%E5%A4%A7%E5%AD%B8%E5%B8%AB%E6%80%92-%E6%89%93%E9%9B%B6%E5%B7%A5%E5%97%8E-224532250.html\">https://tw.news.yahoo.com/%E5%85%BC%E8%A1%8C%E6%94%BF%E8%81%B7%E6%8A%B5%E9%90%98%E9%BB%9E-%E5%A4%A7%E5%AD%B8%E5%B8%AB%E6%80%92-%E6%89%93%E9%9B%B6%E5%B7%A5%E5%97%8E-224532250.html<\/a><\/p>", "zt": "如果教師的工作薪水都相同，那當然是去找時間最能自己掌握的…"}, {"id": "f1694130289", "file": "2023-09-08-f1694130289", "date": "2023-09-08", "title": "Taiwan Cares a Lot About Money, and Blames Money for Everything It Can't Do", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Family & Pets", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A reflection on chasing money for its own sake, and on what is truly worth pursuing: health, ability and happiness, plus giving back to society.", "len": 268, "body": "<p>Taiwan cares a lot about whether people have money, and when many things cannot be done, the blame goes to not having enough money.<\/p>\n<p>The result is that wherever there is money, people chase it, no matter what the job or purpose is.<\/p>\n<p>I see many students and friends doing work that does nothing for society or the public. It is just about making money.<\/p>\n<p>For money, they sell high-margin, high-profit products that are not necessities of life, and do nothing to raise quality of life or a sense of beauty.<\/p>\n<p>For money, they use the pursuit of progress and retirement dreams as an excuse, but looked at closely, it is just words and ideas being turned over and over for sale, in order to find followers.<\/p>\n<p>What we should truly pursue in life is physical and mental health, our own abilities, and a sense of happiness. These three have nothing to do with money and nothing to do with comparing ourselves with others. Building on ourselves, a little progress each day is enough to achieve them. While pursuing them, if we also give to society and others, improve our relationships with others, and care about the social environment, starting from family and extending to friends and neighbours, and even making it part of our enterprises and business, it is even better.<\/p>\n<p>So how do we begin?<\/p>\n<p>Let every trade and profession focus on its expertise: students do their studying well, teachers teach with dedication, restaurants value nutrition and safety, and scholars, farmers, workers and merchants all take part, towards the Great Harmony of the Book of Rites.<\/p>", "zt": "台灣很重視有沒有錢，很多事做不到就推給錢不夠，不夠有錢。"}, {"id": "f1693054169", "file": "2023-08-26-f1693054169", "date": "2023-08-26", "title": "In my memory, the National Chung Hsing University faculty dormitory was my playground through long childhood summers...", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "Childhood", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A memoir of childhood summers and winters in my grandparents' Taichung dormitory home, of pickled cucumbers and radish cake, and of my grandmother's quiet, enduring love.", "len": 830, "body": "<p>In my memory, the faculty dormitory of National Chung Hsing University was my playground through the long summers of my childhood. Turning in from Zhongming South Road at the Nanmen Bridge, the main road stopped just before Ming-Te Home Economics and Commerce School, and from there extended a small looping lane. At the entrance to the residential area there seemed to be a signboard in black Kai-style characters reading \"Xingda Fifth Village\". Whether you walked clockwise or counterclockwise, you could circle all the scholars' dwellings. My grandparents' home in Taichung was the second one clockwise, with a red front door between grey concrete pillars.<\/p>\n<p>Past the door was a corridor. On both sides, in the earth, my grandmother grew green rain lilies that often burst into white blossoms after the rain, clump after clump standing in rows, leading up to the door of the plain two-storey faculty home. Looking out from the front door, on the right stood a magnolia tree as tall as the building. Its branches were always scattered with magnolia buds. The low ones were often picked early in the morning to be offered before the family Buddhist altar, while the high ones bloomed freely at their fullest and most unrestrained moment, then fell as white petals into the corridor.<\/p>\n<p>This corridor had many uses. In the evenings it was the playground where I, the little grandson, rode my tricycle, little feet pushing the front pedals round and round for many turns before completing one circuit. It was also the open-air dining table where my grandmother patiently fed me. I would take one mouthful for each lap, but as a child who didn't like eating, I went very, very slowly, and a bowl of rice often took more than half an hour, with my mouth still full of food.<\/p>\n<p>In my memory of summer, this corridor was laid with long melons drying in the sun that Taichung never lacks. It was the season when cucumbers were plentiful. My grandmother and I would peel lots of the big yellow cucumbers she had bought, cut them in half, and in the fresh cucumber scent lay them out in rows on bamboo sieves, leaving them under the fierce summer sun of central Taiwan. Day after day, the cucumbers slowly wrinkled and shrank, their colour turning from fresh green to yellow, and finally to a shade just short of earthy brown, their shape flattened into ovals. Then they were packed into glass jars to pickle, with salt and sugar added and the lid screwed tight. A few months later they would become the pickled melon side dish seen at every meal, three times a day. Plain white rice without that melon was too bland for me.<\/p>\n<p>In my memory of winter, this corridor became the pressing area for white rice batter. Glutinous rice soaked through with water was taken to the market to be ground into a white paste, then carried back in a bucket, packed in white cotton bags. My grandmother would press it with a long wooden bench and big stones, and slowly the water would seep through the outside of the cotton. Meanwhile she would be beside it, cutting winter white radish into fine shreds and stir-frying a little with fried shallots, and then she would mix in the thick rice batter, which I never knew how long it had been pressed. She then found every container in the house to fill: round ones, square ones, long strips. She lined them with gauze, poured in the batter one by one, and put them in the big steamer over high heat. As for me, apart from watching grandma make radish cake, I had long since lost patience and was playing alone to one side. In my memory, grandmother and I rarely spoke, yet we kept each other company. I knew grandma was busy, and grandma knew I was playing quietly.<\/p>\n<p>The photo of the Chung Hsing University dormitory was taken in the 1970s. My memories are blurry and fragmentary, but I still remember that however much I did not want to eat, my grandmother fed me patiently. She never shouted at me, let alone said anything harsh. She was a traditional Taiwanese woman who lived through the Taisho, Showa and Republic eras. In those years of war and turmoil she never had schooling, and the women of that time did not say much. But through her long companionship I became familiar with her example of calmly observing the world and speaking little but acting in earnest. My character was shaped most deeply by my grandmother. From infancy to kindergarten, my early years and childhood were spent in her care.<\/p>\n<p>If my life could be like my grandmother's, resilient, optimistic, warm, simple and healthy through a hundred years, that would be a lasting influence and blessing I owe to her for my whole life.<\/p>\n<p>Thank you, Grandma. I love you. Let's be grandmother and grandchild again in the next life.<\/p>", "zt": "記憶裡中興大學的教職員宿舍是我幼時漫漫夏日的遊戲場，從南…"}, {"id": "01fca453", "file": "2023-08-05-01fca453", "date": "2023-08-05", "title": "Why Naming an Insurance Beneficiary Matters", "cat": "Personal Finance", "cats": ["Personal Finance"], "sub": "Insurance", "det": "", "src": "方格子", "url": "https://vocus.cc/article/64cde52ffd89780001fca453", "ex": "Always designate a beneficiary rather than writing only 'statutory heirs': it reflects who you love now, keeps the payout out of your estate, and prompts regular reviews.", "len": 523, "body": "<p><b>Key idea: always designate a beneficiary; don't just write \"statutory heirs\"<\/b><\/p><p>When you buy insurance for yourself as a young person on a modest budget, besides the <b>policyholder<\/b> and the <b>insured<\/b>, there is a field for the <b>beneficiary<\/b>. The person in this role will often change over your life. When you are young it may be your parents or the relatives who raised you; after marriage it may be your spouse; once you have children, your children are your dearest; and in old age you may not want to leave any money to the next generation at all, perhaps wanting it to go to the caregiver who has looked after you all along.<\/p><p>First, let's talk about what statutory heirs are. At the moment the insurance payout is needed, you are no longer in this world, so if the beneficiary is written only as statutory heirs, the payout simply becomes part of the inheritance. According to Article 1138 of the Civil Code, heirs to an estate, apart from the <b>spouse<\/b>, are determined in this order: 1. Direct descendants (children / adopted children / grandchildren). 2. Parents. 3. Siblings. 4. Grandparents.<\/p><p>Under the above distribution rules of the Civil Code, the spouse has the greatest rights. If there are children, they can share the estate equally with the spouse; otherwise everyone else must wait until the spouse has received 50% of the estate before dividing the remainder. Note also that this places great weight on the status of legal spouse: ex-partners and divorced persons do not count, and with the arrival of diverse family forms, roles differ from the traditional view. So if you are someone's spouse, make sure you legally hold that status; registration with the household registration office is crucial.<\/p><p><b>So why designate a beneficiary?<\/b><\/p><p><b>1. Because the one you love most keeps changing<\/b><\/p><p>After you pass away, whatever people or things you care about most can become your beneficiary, so besides natural persons you can also name an organisation or a legal entity. Nowadays, for many policies where the policyholder and the insured are both yourself, you can easily change the beneficiary online or in a mobile app.<\/p><p><b>2. A designated beneficiary receives the death benefit, which is not counted as part of the estate<\/b><\/p><p>If your dearest is your spouse and you do not designate a beneficiary, then after you are gone this insurance money will become part of the estate and may be subject to 10-20% estate tax. (For details see the Ministry of Finance's <a target=\"_blank\" rel=\"noopener\" href=\"https://www.etax.nat.gov.tw/etwmain/tax-info/understanding/tax-saving-manual/national/estate-and-gift-tax/QbA7Lqp\">introduction to estate tax<\/a>.)<\/p><p><b>3. You can come back from time to time to rethink your insurance planning<\/b><\/p><p>Often we buy insurance without much thought: we are introduced to a policy and buy it on the spot, and after several or a dozen years we have no idea why we keep paying premiums. So you can set a mid-year or year-end review of your finances: log in to the website, look at the contents of your policies and your beneficiary arrangements, and think about your relationship with your family. This helps you appreciate the value of being a human being.<\/p>", "zt": "指定保險受益人很重要"}, {"id": "01e1ab56", "file": "2023-08-04-01e1ab56", "date": "2023-08-04", "title": "Taiwan's Insurance Companies Ranked, 2022", "cat": "Personal Finance", "cats": ["Personal Finance"], "sub": "Insurance", "det": "", "src": "方格子", "url": "https://vocus.cc/article/64cc8f35fd89780001e1ab56", "ex": "Ray looks at Taiwan's largest life insurers in the 2022 top 5,000 company survey and recalls his gruelling early career as a researcher at China Credit Information Service.", "len": 439, "body": "<p>My old employer, China Credit Information Service, publishes its latest survey report on Taiwan's 5,000 largest enterprises every year. Do you know which five insurance companies in Taiwan had the highest revenue in 2022, after the pandemic? How will they develop in future?<\/p><figure class=\"ph\">Photo<\/figure><p>Among the large enterprises ranked within Taiwan's top 50 by net revenue (<a target=\"_blank\" rel=\"noopener\" href=\"https://www.credit.com.tw/CreditOnline/sample/2023Top5000_06.pdf\">2022 China Credit Information Service report<\/a>), there are as many as seven life insurers, so you can imagine how large life insurance's share of Taiwan's overall economy is. The ranking is shown in the table above, with Cathay, Fubon and Nan Shan ranking as the top three; by number of employees, Cathay and Fubon each have 20,000 to 30,000 staff. Revenue in 2022 was a winter for the life insurance industry because of the pandemic, and with such a low base, the growth rate and financial reports of Cathay and Fubon in 2023 can be looked forward to.<\/p><p>In the last century, I was an assistant researcher in the marketing department of China Credit Information Service, responsible each year for writing the ranking report, while also using this valuable market data to reorganise and help various companies with market analysis, or to help write listing proposals. Companies I handled include Sakura Construction, Chingyun Electronics and Zuanquan Enterprise; those I helped with capital increases include Taifeng, Tungtex and Changsheng Enterprise (then the operator of the airport MRT); Nomura Securities at the time also commissioned China Credit to write an industry impact report on Taiwan's accession to the GATT (now the WTO). I spent at least 3 months at the World Trade Center library working day and night to finish the Chinese version of this report, which Nomura Research Institute and the Interchange Association, Japan then translated into Japanese and published in Japan for industry reference.<\/p><p>While working at China Credit, I lived in a rented place in Sanchong, and every day rode with tens of thousands of other scooter commuters down Taipei Bridge to work in Taipei's Songshan District, arriving at 9 and leaving at 9. There was no two-day weekend then, so I worked at least 6 days a week, which is just the same as the \"996\" work system now popular in China; it was really a realistic experience of Taiwan's fresh graduates \"selling their livers\". With low pay and long hours, I do not remember how much I earned! And I left no memories either. The most real thing is that in those two years I began to lose my hair, slowly losing the full head of hair of my youth, which was not worth what I gave up.<\/p>", "zt": "台灣保險企業2022排名"}, {"id": "0185c3ed", "file": "2023-08-02-0185c3ed", "date": "2023-08-02", "title": "So This Is What It Means When Someone Buys Insurance for You", "cat": "Personal Finance", "cats": ["Personal Finance"], "sub": "Insurance", "det": "", "src": "方格子", "url": "https://vocus.cc/article/64ca030efd8978000185c3ed", "ex": "Policyholder, insured and beneficiary are different roles. Learn why the policyholder holds the real power and how to check your own insurance contracts.", "len": 509, "body": "<p>Have you ever heard a conversation like this?<\/p><p>\"Mom bought you a life insurance policy. In twenty years you can get back NT$750,000 at maturity, and you have lifelong medical protection too. And if you pass away there is NT$1 million for the beneficiary!\"; \"From now on you need to prepare NT$5,000 a month for the premium. Think of it as savings. You'll thank Mom later!\"<\/p><p>Not quite understanding, having never signed an insurance policy, you sign one out of your family's [good intentions]. Twenty years later you go back and ask your family: the premiums are all paid, can I get the money now? By then you may be just buying a house, raising a newborn or paying your children's tuition, only to find that the money was collected by your family, and nobody ever told you. When you go home to ask, you only get a casual response.<\/p><p>\"Oh yes, Mom took that money first. Once I'm old you won't need to support me.\"<\/p><p>You are speechless, and since it is your closest family, it is hard to explain. If your spouse finds out, they may be so angry they stop speaking to you.<\/p><p>If you are in this situation, it is actually because you are not familiar with the contents of the policy and got confused by the several key parties on it.<\/p><p><b>Policyholder<\/b>: Mom<br/><b>Insured<\/b>: Son<br/><b>Beneficiary<\/b>: Daughter-in-law<br/><b>Payment account<\/b>: Son's account<\/p><p>An insurance contract is a financial product, and because it intertwines relationships between people, you must be very clear about the four key parties above.<\/p><p>1. The insured is listed first in the contract, meaning the policy exists because of this person; but the <b>most powerful person in the whole contract<\/b> is the <b>policyholder<\/b>.<\/p><p>2. It seems natural to pay the monthly premium for yourself, but the <b>maturity annuity is collected by the policyholder<\/b> and the <b>death benefit is collected by the beneficiary<\/b>. The insured amount can only be used when the insured has an accident or falls ill, so it looks like you are the sucker.<\/p><p>3. And the <b>policyholder has the right to change the beneficiary<\/b>; the insured son only has the right to consent, so one day when the mother-in-law is unhappy, she can change the beneficiary back to herself at any time.<\/p><p>To avoid family discord and to keep you from losing both money and goodwill, I suggest you go back and review your own insurance contracts. First, for every policy you are paying for, the policyholder should be yourself. If it isn't, arrange a day to go together to the insurance company and change it in person. Second, if you are paying and the insured is not you, or the beneficiary is not who you thought, have a good talk together and likewise go there in person to make the change.<\/p><p>Let me repeat: in an insurance contract the <b>policyholder<\/b> is the most important. If you are the one paying, go online right away and check the content of your policy.<\/p>", "zt": "原來幫你保險的意思是這樣"}, {"id": "f1688861516", "file": "2023-07-09-f1688861516", "date": "2023-07-09", "title": "Yesterday I Ate at Ohtoya at Past 5 pm, When the Taipei Main Station Underground Mall…", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Seeing a screened-off rest area for restaurant staff, Ray reflects on teachers' lack of private space, from his shared office to homeroom teachers in Taiwan's schools.", "len": 282, "body": "<p>Yesterday I ate at Ohtoya at past 5 pm. Because of the heat at street level, quite a few people were dining in the Taipei Main Station underground mall. I saw that the restaurant had a privacy area screened off by curtains for the staff's break between shifts, so they could rest properly. I was very envious.<\/p>\n<p>At work I normally sit in a big office without even partitions. It is called the faculty research office, but it is really a space with 16 computer desks lined up in rows, where teachers can only use their monitors and books to mark off a working space. Between classes, if I want to nap, I feel too embarrassed to lay my head down, so I put up with it, wash my face, and come back to grade assignments or prepare lessons, and a dozen or so minutes of free time slip away.<\/p>\n<p>Often I have to wait until the students have finished class and gone home and my colleagues have all left, and only then can I doze at my desk without being startled by a student suddenly walking in.<\/p>\n<p>In many of Taiwan's elementary and junior high schools, homeroom teachers' desks are at the back of the classroom. They have no office of their own. Teachers go to school, attend class and mark assignments together with the children, arriving before 8 am, watching over cleaning and keeping order and the children's interactions, even sitting in on the subject teachers' lessons. After the students leave at five, you often see the teacher alone in the classroom, working.<\/p>\n<p>But perhaps I understand: that is when the teacher finally has time and space to themselves.<\/p>\n<h1>RayChenTeacher<\/h1>", "zt": "昨天在大戶屋用餐時是下午5點多，北車地下街因為地面高溫反…"}, {"id": "f1688605914", "file": "2023-07-06-f1688605914", "date": "2023-07-06", "title": "[Mid-Career Change and Silver-Age Reskilling: A Plumbing and Electrical Degree Programme at Technological Universities]", "cat": "Ageing Well", "cats": ["Ageing Well"], "sub": "Retirement & Career", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Why a weekend or evening plumbing-and-electrical degree programme could suit unemployed middle-aged people and retirees, and how universities could refocus on vocational skills.", "len": 367, "body": "<p>[Mid-Career Change and Silver-Age Reskilling: A Plumbing and Electrical Degree Programme at Technological Universities]<\/p>\n<p>I think a plumbing and electrical engineering department holds little appeal for young students today. But for those of us in our fifties and sixties who face the risk of unemployment yet still have the physical strength, or for older brothers and sisters who retired early and draw monthly pensions, if such a programme were offered on weekends or in continuing education, taught by teachers with professional technical skills, and combined with preparation for certificates from the Ministry of Labor or official trade associations, I would want to spend four years learning the trade.<\/p>\n<p>The German-style education system and approach that @[100003046621143:2048:李忠憲] proposed is very suitable as a direction for professional transformation of technological universities. Many technological universities have received large Higher Education Sprout Project grants. For example, a certain technological university where many staff have just lost their jobs still received more than NT$60 million a year in 2023. Perhaps the project indicators are all ESG items that can't find a landing point. If this annual NT$5 billion-plus programme could drop the pretty regional revitalisation activities and research-output indicators, and instead be used to increase the number of professional certificates held by middle-aged people and the employment capacity and participation rate of those aged 50 to 70, it might be a chance for technological universities to return to vocational expertise and shed their reputation for flashy but empty thesis indicators.<\/p>\n<p>Retirees in Taiwan keep eating, drinking and travelling around. Although that helps the weekday group business of our tourism industry, it contributes rather little to personal growth and social good. This is especially true for those whose monthly pensions are higher than the NT$27K that young people earn. If the system could require, through a credit-point scheme, that people drawing monthly pensions return to campus to learn skills and earn certificates, they could meet more good friends in class, and the skills they learn could be used to repair their own homes and maintain their neighbourhoods. How wonderful it would be to benefit on three fronts: practical life skills, mutual respect between self and community, and personal health.<\/p>\n<h1>SkillsAICannotReplace<\/h1>\n<h1>LearnByDoingNeverTooOldToLearn<\/h1>\n<h1>TechUniversitiesAndVocationalTrainingCertificates<\/h1>\n<h1>TeacherRayChen<\/h1>", "zt": "【中年轉職橘齡專業再造-技專校院水電學位學程專班】"}, {"id": "f1688226914", "file": "2023-07-01-f1688226914", "date": "2023-07-01", "title": "[2023 Higher Education Sprout Project, Phase Two: Universities of Technology]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Taiwan's technical universities are overlooked by the media and misunderstood by parents. Ray looks at the funding gap and praises the hidden champions of vocational education.", "len": 589, "body": "<p>[2023 Higher Education Sprout Project, Phase Two: Universities of Technology]<\/p>\n<p>Continuing from the previous post, this one is about Taiwan's technological and vocational universities and colleges, which the media ignores, parents don't understand, and which are only occasionally called the \"Pride of Taiwan\" in passing.<\/p>\n<p>First, a question: in which city or county is each of these schools located? Cheng Shiu (), Southern Taiwan (), Kun Shan (), Lunghwa (), Hungkuang (), Ming Chi (), Chia Nan (), Chaoyang (), Shu-Te (), Chihlee (), Hsing Wu (). These 11 universities are all among the top twenty private universities of technology in the latest round of the Higher Education Sprout Project. The public schools are easy to name, since almost all of them are national universities named after a place.<\/p>\n<p>[More private than public in the top twenty]<\/p>\n<p>Among the top twenty technical universities receiving subsidies, 11 are private and 9 are public. The media rarely reports on the importance and efforts of private technical universities. It was only because this round of the Sprout Project for vocational higher education evaluated teaching and industry cooperation that these schools, which work hard to train industry talent, came to the surface.<\/p>\n<p>[Heavy on universities, light on vocational education]<\/p>\n<p>All 79 technical universities in Taiwan together received only NT$5.6 billion in subsidies, less than the NT$6.4 billion received by the four top universities (NTU, NTHU, NCKU and NYCU) combined. In 2021, Taiwan had 1.18 million college students: 640,000 at general universities and 540,000 at technical universities. General universities received NT$12.6 billion, twice the funding of the technical ones.<\/p>\n<p>[The strong take more, the weak take less: survival of the fittest among technical universities]<\/p>\n<p>The Sprout Project is a competitive programme, so the strong receive more and the weak receive less. You can see it in the funding distribution chart: universities ranked in the lower part of the competition receive only token amounts. In this era of a falling birth rate, universities are already caught in a law of the jungle.<\/p>\n<p>[Vocational teachers and students: hidden champions]<\/p>\n<p>Perhaps in the competition over handwritten school subjects such as Chinese, English, maths, science, literature, history and civics, test scores once defined these vocational students as being at the \"back of the line\". But vocational schools and their teachers work hard to design courses, emphasise connection to the workplace, actively engage with what companies need, and help students break through their self-imposed limits. They strengthen hands-on ability through training, rebuild confidence through skills, and so redefine what \"the back of the line\" means.<\/p>\n<p>I really want to give a big encouragement to every vocational teacher who trains students in skills, coaches language, and prepares them for professional certificates. In this day and age we still insist that students respect workplace ethics and proper conduct, and learn that in service you must bow, smile, and be quick on your feet. Some may say we are training an unsuitable kind of labour. But if you joined us in teaching and training in the vocational education environment and cared about students' learning and development, you would know why we are so proud to give ourselves, and the students we have trained, a big round of applause. I hope society sees this group of earnest, hardworking pillars of the community.<\/p>\n<p>Do you know the answers to the question above?<\/p>\n<p>The answers are in the third attached image. When you have the chance to travel around, go and see these hidden-champion universities of technology that train the pride of Taiwan.<\/p>\n<h1>FeelFreeToShare<\/h1>\n<h1>RayTeacherAfterClassNotes<\/h1>", "zt": "【2023高教深耕計畫第二期：技職科大篇】"}, {"id": "f1688089223", "file": "2023-06-30-f1688089223", "date": "2023-06-30", "title": "[2023 Higher Education Sprout Project, Phase 2: General Universities]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "Admissions & Falling Birth Rate", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "NT$12.6 billion goes to 72 general universities, yet Taiwan's falling birth rate means university freshmen are now fewer than half of primary school entrants.", "len": 239, "body": "<p>[2023 Higher Education Sprout Project, Phase 2: General Universities]<\/p>\n<p>The Higher Education Sprout Project, the five-year competitive programme that Taiwan's higher education sector cares about most, has quietly been announced on the Ministry of Education's website, with some celebrating and others worrying.<\/p>\n<p>The 2023 (ROC year 112) subsidies for the 72 general universities (see attached table) total NT$12.6 billion. Only 4 universities, including National Taiwan, National Cheng Kung, National Tsing Hua and National Yang Ming Chiao Tung, receive more than NT$1 billion, while 22 universities receive more than NT$100 million a year.<\/p>\n<p>In truth, the Sprout Project is the small item. The big money is in the Ministry of Education's annual budget, with nearly NT$300 billion set aside in 2023 to invest in Taiwan's education environment. Higher education takes over NT$100 billion of that. Compared with the all-important 12-year national basic education, I can hardly judge whether the funding for Taiwan's higher education is reasonable (the report is in the comments)! But in 2023 about 200,000 children entered primary school in Taiwan, while the universities on the list are down to fewer than 100,000 new students. Even adding the new students at universities of science and technology, the total does not reach 200,000.<\/p>\n<p>Everyone lately has been focused on the NT$35,000 tuition subsidy for private universities. As a private-school teacher, I am truly happy for my students, but as a citizen I cannot feel happy about it.<\/p>\n<h1>FeelFreeToShare<\/h1>\n<h1>RayTeachersAfterClassNotes<\/h1>", "zt": "【2023高教深耕計畫第二期：一般大學篇】"}, {"id": "f1687619755", "file": "2023-06-24-f1687619755", "date": "2023-06-24", "title": "2023 Times Higher Education Asia University Rankings: Taiwan", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A look at Taiwan's 46 ranked universities in the 2023 THE Asia rankings, what the ranking really measures, and Ray's thoughts for students, parents and vocational universities.", "len": 525, "body": "<p>【2023 Times Higher Education Asia University Rankings: Taiwan】<\/p>\n<p>Does anyone know which university National Formosa University is? It's on the ranking list! I honestly learned for the first time that Taiwan has a \"National Formosa University\".<\/p>\n<p>Summary of the ranking report:<\/p>\n<ol>\n<li>\n<p>Public universities did not do well; the four top universities (NTU, NCKU, NTHU and NYCU) did not make the top 4.<\/p>\n<\/li>\n<li>\n<p>The ranking mainly reflects the quality and quantity of journal publications by a school's faculty and doctoral students.<\/p>\n<\/li>\n<li>\n<p>Universities with medical schools have an advantage.<\/p>\n<\/li>\n<li>\n<p>STEM fields (science, technology, engineering and mathematics) are the trend of the future.<\/p>\n<\/li>\n<li>\n<p>Globally, teaching at universities is defined as research-oriented.<\/p>\n<\/li>\n<\/ol>\n<p>Only 46 Taiwanese universities made the Asia rankings, of which 22 are public, less than half of those listed. Even with ample funding and national subsidies, Taiwan's national universities are not particularly outstanding. Some will say rankings can be bought, but this is still public information. In an unequal competition, any university has the right to use reasonable and lawful means to win students for itself, because this is, after all, a competitive luxury good.<\/p>\n<p>The 2023 Times Higher Education (THE) World University Rankings sampled 1,799 universities from 104 countries and regions. They measure institutional performance in four areas: teaching, research, knowledge transfer and international outlook. The ranking analyses more than 121 million citations across over 15.5 million research publications, plus survey responses from 40,000 scholars worldwide. So we can say with confidence that THE values academic work: research and publication account for 60%. The number of journal papers should be the focus. In the teaching portion, the figures come from the reputation survey (15%), staff-to-student ratio (4.5%), doctorate-to-bachelor's ratio (2.25%), doctorates awarded to academic staff ratio (6%) and institutional income (2.25%).<\/p>\n<p>My personal thoughts and takeaways:<\/p>\n<ol>\n<li>\n<p>The Times ranking evaluates the strengths and weaknesses of the teachers on campus, and internationally a university teacher is defined as a researcher first and a teacher second. University teachers do not teach students step by step what they must know and what they needn't.<\/p>\n<\/li>\n<li>\n<p>If a traditional Taiwanese university wants to compete internationally and be globally competitive, it must focus on STEM research, because other fields can hardly stand out in quantity and quality.<\/p>\n<\/li>\n<li>\n<p>If a Taiwanese university student decides to attend a research university but lacks the foundational prerequisite knowledge, studying at a traditional research university is a waste of four years of tuition and time.<\/p>\n<\/li>\n<li>\n<p>Taiwan's universities of science and technology should teach with employment in mind and rarely focus on publishing papers, so it is hard for them to score well in such evaluations. The teacher's role lies in mentoring, teaching and career guidance, which has little to do with this kind of ranking.<\/p>\n<\/li>\n<li>\n<p>Ranking Taiwanese schools as public or private comes from guidance based on the past experience of teachers and parents. When parents send their children to a research university, they really should also consider whether the student's potential is suited to it.<\/p>\n<\/li>\n<\/ol>\n<p>Finally, the ranking table is attached. If you're interested, click through to see how Taiwan's 46 listed universities rank in Asia overall, and how universities in other countries compete.<\/p>\n<h1>FeelFreeToShare<\/h1>\n<h1>RayTeacherAfterClassNotes<\/h1>", "zt": "【2023泰晤士亞洲區大學排名-台灣】"}, {"id": "f1687420636", "file": "2023-06-22-f1687420636", "date": "2023-06-22", "title": "The July University Entrance Exam Has Never Really Gone Away", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "In 2023 about half of Taiwan's graduating high school students are still preparing for the July subject tests, showing how the old joint entrance exam lives on in new forms.", "len": 698, "body": "<p>【The July University Entrance Exam Has Never Really Gone Away】<\/p>\n<p>The university entrance exam is back in 2023? Half of this year's graduating high school students are still preparing for the subject tests!?<\/p>\n<p>It is the Dragon Boat Festival, with the scent of zongzi in the air, and the summer solstice of 2023 in Taiwan. The hard-working senior students of academic year 112 are the second cohort under the 108 curriculum guidelines, and half of the boys are the unlucky ones whose military service went from four months back to one year. While the media and top schools are already celebrating how many students got into the medical school of University X, most candidates are still at school, in the library or at cram school during this long holiday break, all because they are still preparing for the subject tests on July 12-13.<\/p>\n<p>With a falling birth rate and no reduction in university places, getting into university is no longer what matters; getting into a top university is what students and parents care about. Of this year's 118,000 high school candidates, how many will sit this pseudo university entrance exam on July 12-13? My own estimate is around 50,000. In the sweltering summer heat, there are still diligent students forced by a system we adults designed to go sweating into the exam hall, to sit again the subjects they already prepared for half a year ago. It really is strange. Why not simply use the General Scholastic Ability Test (GSAT) results to apply and be placed? What is the point of testing again?<\/p>\n<p>The multiple-channel admission system was meant to steadily reduce the share of exam-based placement (like the old joint entrance exam). As the table shows, the design intention was for only a quarter of students to use this route, while gradually raising the share of the Star Plan and application admission. But amid a market where the birth rate is falling and university places have not been cut, the number of students giving up the earlier Star Plan and application routes hit a new high in year 112 (2023). Judging from the likely
