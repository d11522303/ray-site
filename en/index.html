 final admission proportions this year, it may even exceed 50%.<\/p>\n<p>After years of education reform, the university entrance exam still lingers like a corpse brought back to life, split into two, with a third inside the two. Add the learning portfolios and diverse learning designs of high school, and young Taiwanese students, already forced to accept the system's arrangements during secondary school despite the falling birth rate, must still sit both the GSAT and the subject tests. Let us look at how Taiwan's university entrance exam has evolved. It was called the Joint College Entrance Exam (years 43-60), then the University and Independent College Entrance Examination (the \"joint entrance exam\", years 61-90), then the Advanced Subjects Test (years 91-110), and then the GSAT (from year 111) plus the Advanced Subjects Test's successor, the Subject Tests. From academic year 111 the \"Advanced Subjects Test\" became the \"Subject Tests\", cutting from 10 subjects to 7: Chinese, English and Math B are no longer tested separately and instead draw on the GSAT scores. The subjects available in the Subject Tests are Math A, History, Geography, Civics and Society, Physics, Chemistry and Biology. Looking at the subjects, in fact nothing has really changed. The old form is still there, and to match social expectations it has been patched here and there until it is even more complicated.<\/p>\n<p>Especially in 2023, many candidates and parents, having seen last year's many cases of \"low score, high placement\" in the subject tests, had students whose GSAT scores fell short of expectations skip individual application admission and go all in on the subject tests. Reports also note that at the leading schools in southern Taiwan, more than half of students are registered for the subject tests, and the students I know at leading schools in northern Taiwan are likewise still wrestling with the exam subjects. In this Dragon Boat Festival season, I wish them well: may they \"zong\" (a pun on the zongzi and \"hit the mark\") into their ideal departments in this steamer-like heat.<\/p>\n<h1>WelcomeToShare<\/h1>\n<h1>RayTeachersAfterClassNotes<\/h1>\n<h1>VocationalUniversitiesAreAlsoGreat<\/h1>\n<h1>FewRegularUniversitiesOfferFullTimeInternships<\/h1>\n<h1>StudyYourselfHalfToDeathAndStillEarn30K<\/h1>\n<h1>AMarketableSkillIsKing<\/h1>", "zt": "【每年七月的大學聯考其實並未消失】"}, {"id": "f1686748647", "file": "2023-06-14-f1686748647", "date": "2023-06-14", "title": "[University Admissions Results Are Out: How Do We Read the Numbers?]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Admission rates fell almost everywhere in the second year of the 108 curriculum. Why mid-ranked schools lose the most students, and why registration rates lag.", "len": 416, "body": "<p>[University Admissions Results Are Out: How Do We Read the Numbers?]<\/p>\n<p>This is the second cohort under the 108 curriculum. Judging from each school's admission growth rate published for 2022 to 2023 (ROC years 111 to 112), almost all of them declined. Only National Taiwan University, National Cheng Kung University, National Tsing Hua University, National Chiao Tung University, Taipei Medical University and a few specialised schools grew. For schools with an admission rate below sixty percent, where there are too few candidates and many applicants apply repeatedly, even moving quotas over to the subject-test allocation will not make things much better. But once all admissions are finished, it is the schools in the middle of the ranking that lose the most students, while schools in the lower half do not necessarily recruit worse than the middle ones.<\/p>\n<p>Why? Because the current admissions system is the result of coordination. My reasoning is as follows:<\/p>\n<ol>\n<li>\n<p>Top universities keep their traditional advantage and are getting harder to get into, with registration rates close to 100%.<\/p>\n<\/li>\n<li>\n<p>Mid-ranked universities, public or private, that offer programmes similar to those at the top universities mostly receive waitlisted candidates from the recommendation and screening route. These are students who respect the system and its design, but because of the falling birth rate there are fewer students overall, and the further down the ranking order a school sits, the fewer students it can take, so registration rates fall between 50% and 80%.<\/p>\n<\/li>\n<li>\n<p>Lower-ranked schools, under the current system, can only take a few students who don't understand the situation (for example the 4 students at the now-closed Mingdao University). Whether through individual application or the subject-test allocation, hardly any new students remain, so I infer that their registration rates would all be below fifty percent.<\/p>\n<\/li>\n<\/ol>\n<p>But the registration rates announced in October turn out rather different! Because of a special arrangement called [independent admissions], some schools that fell short of their quotas can choose to run their own admissions. They can attract the last group of students who don't want to prepare application materials and don't want to take exams, and just want a university diploma, by offering no exam, no portfolio review, and an easy path to graduation. As a result, their final registration rates also land between 50% and 80%.<\/p>\n<p>So the registration rates published by the Ministry of Education are a lagging indicator. If anything, the individual application stage may be where we can see students' real choices and thinking.<\/p>\n<h1>FeelFreeToShare<\/h1>\n<h1>RayTeachersAfterClassNotes<\/h1>", "zt": "【大學申請入學分發公布，數字如何看？】"}, {"id": "f1686531141", "file": "2023-06-12-f1686531141", "date": "2023-06-12", "title": "[Running and Climate Change]", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Running & Exercise", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Running every day makes Ray feel the heat and humidity keenly. He shares a global temperature map, a warning about a record-hot summer, and why he now runs at dawn.", "len": 211, "body": "<p>[Running and Climate Change]<\/p>\n<p>Because running makes you more aware of the environment, I feel the relationship between temperature and my body every day. Since summer began, whenever I run the streets of urban Taipei, I mostly feel I am running through thick, humid air. Running on a plateau is better: at 250 metres elevation it is about 1.5°C cooler. Linkou now has no fog, and because the sea breeze blows through the surrounding forest, it is much more comfortable than the basin.<\/p>\n<p>The attached image is a global temperature map for 6/10 taken from NCEP Climate Forecast System (CFS) data. The places that are red to the point of turning grey are over 40°C. In Asia, only the Tibetan Plateau looks cool, while everything from Europe to Siberia is warm.<\/p>\n<p>Judging from the rising trend of the black line, we may be heading into the hottest summer in history. Around the turn of July and August, the 2023 global temperature (black line) keeps exceeding the +2°C average predicted by climate change forecasts.<\/p>\n<p>Since 6/10 I have moved my running time to early morning. After exercising, my body also regulates itself better to room temperature, so I depend less on air conditioning. A DC fan saves electricity and is environmentally friendly.<\/p>", "zt": "【跑步與氣候變遷】"}, {"id": "f1686377345", "file": "2023-06-10-f1686377345", "date": "2023-06-10", "title": "Graduation & Commencement", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray's graduation message to the Class of 2023 in Hsing Wu University's Department of Travel Management, who studied through the pandemic and a year of internships.", "len": 208, "body": "<p>【Graduation &amp; Commencement】<\/p>\n<p>The school's graduation ceremony was actually held at the end of May, but I'm stubborn and have always believed this ritual belongs in June, so I decided to write my reflections in June.<\/p>\n<p>These two classes spent almost their whole university life in the pandemic, and at least half of it wearing masks. Looking at the photos, I remembered how youthful and innocent everyone looked when they first arrived from high school. It is a beautiful memory I won't forget, and I will keep it in my heart.<\/p>\n<p>Thank you, students, for your hard work during your year of internship. Because of you, we teachers can face all our partner companies with confidence and speak up loudly. Thanks to your outstanding performance, company managers keep asking for Hsing Wu Travel Management graduates by name. I know all these achievements are woven from your tears and sweat. I am only the one gleaning the ears of grain.<\/p>\n<p>Here I wish all the graduates of the Class of 2023 (cohort 108) of Hsing Wu Travel Management a bright future. Excellent as you are, you have already built strong professional wings on your own, and you now fly confidently toward a wonderful future.<\/p>\n<h1>HWUTravelManagement<\/h1>\n<h1>HsingWuUniversityDepartmentOfTravelManagement<\/h1>\n<h1>HsingWuUniversity<\/h1>\n<h1>HWUTravel<\/h1>\n<p>✈️🚄🚞🚢🚌✈️<\/p>", "zt": "【Graduation & Commencement】"}, {"id": "f1682741944", "file": "2023-04-29-f1682741944", "date": "2023-04-29", "title": "Is Taiwan's Most Professional Vocational High School About to Be Phased Out?", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "Admissions & Falling Birth Rate", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Taitung's Tung-Kung vocational school has been placed under special guidance. Ray argues that society's mindset and policy choices, not poor teaching, are hollowing out hands-on vocational education.", "len": 401, "body": "<p>【Is Taiwan's Most Professional Vocational High School About to Be Phased Out⁉️ 】<\/p>\n<p>The news: Taitung's Tung-Kung Vocational High School placed under special guidance<\/p>\n<p>Loving to make things with our hands is human nature. Because of my work I travel all over Taiwan recruiting students. Back when I was in Hualien, I visited the Tung-Kung vocational school twice at admissions fairs, and I greatly admired the students' work and the expertise the teachers had passed on. Yet more than ten years later, because of the falling birth rate, Tung-Kung is still on the list of schools under special guidance, and has formally entered the \"hospice ward\" of private schools.<\/p>\n<p>In Daxi, Taoyuan, in northern Taiwan, there is also a private school, Chih Shan High School, with a professional woodworking department. I worry people don't know about it. These schools can't recruit students not because the teaching is poor or the teachers aren't excellent. Ask yourself, as a parent, would you send your child to study woodworking?<\/p>\n<p>For years our education system has assessed students only by having them write answers with a pen: memorise, recite, fill in the blanks. So everyone in society says hands-on vocational education is important, but the cram schools near the schools are doing assessment worksheets, and the scrolling signs read 【Midterm math 100: Chen OO, 100: Lin OO, 99: Wang OO】. Wealthy families have their children learn violin and piano in music classes, and the posters read 【Chang OO and Chiu OO passed the music certification】. So, besides the falling birth rate, the atmosphere of society and the outlook of the education authorities shape what people choose to study.<\/p>\n<p>I am grateful that the tourism and hospitality industry has had role models such as Wu Pao-chun, Chef Ah-chi and Chairman Yen, who were praised and promoted by the media, so parents who send their children into the hospitality and tourism programmes don't feel disappointed or anxious. But the Ministry of Education is cutting vocational tourism and hospitality places by 5% every year, slowly starving the training of talent for the industry at the root. What a pity! Instead of using the enthusiasm and momentum for learning to improve the quality of society from its foundations, they swing the direction of learning for short-term gain. Over the past decade, haven't the metaverse, NFTs, regional revitalisation, and even AI all risen and fallen, washed away with the tide?<\/p>", "zt": "【台灣專業最強高工將被退場⁉️ 】"}, {"id": "01c86910", "file": "2023-04-19-01c86910", "date": "2023-04-19", "title": "Tips for Passing the Third-Round Interview for the Taiwan High Speed Rail Internship", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "High-Speed Rail Internships", "src": "方格子", "url": "https://vocus.cc/article/644006d9fd89780001c86910", "ex": "How to prepare for the THSR internship's final interview round: announcements, bilingual self-introduction, Q&A, plus my own TransAsia Airways interview story.", "len": 761, "body": "<figure class=\"ph\">Photo<\/figure><p>Here are my tips for getting through. Among many competitors, our students have reached the third round, the interview. (Happy!) At this stage the most important thing is to give yourself a pat on the back: out of so many candidates, you have finally made it to the last round, the one about personal rapport.<\/p><p><br/>THSR internship third-round interview<br/><b>1. Announcement script<\/b><br/>There will be a sheet on the table with a few short sentences in Chinese and English. Read them out confidently in your own voice; this is the most basic part of the process. You may be asked to read in Taiwanese (Hokkien), which takes practice, so find a few sample sentences to rehearse.<br/><b>2. Prepare a self-introduction in Chinese and English<\/b> (I hear it may not be asked, but I recommend preparing it anyway)<br/>Prepare about 2 minutes of content in advance. In Chinese, start with your education and experience; opening with the most sincere and familiar self-introduction is the best way to get into a flow state, and your nervousness will vanish at once. The English introduction works the same way. If your English isn't strong, you can use ChatGPT as a little helper: ask it to turn your Chinese introduction into a 1-2 minute English version that matches your actual ability, then work hard to memorise it and read it aloud ten times. Ask a teacher or a classmate with good English to correct your pronunciation, or record yourself and listen to your pronunciation and intonation. These are all useful tools and methods for completing your English self-introduction.<br/><b>3. Questions and answers<\/b><br/>THSR is a service industry and interns are students, so the interviewers will mostly start from that angle. Treat it like a chat, but answer on topic.<br/>(1) Have you worked in the service industry? Was there a memorable customer service experience, and how did you handle it?<br/>(2) What do you think are your strengths? How have you performed at school?<br/>(3) What do you think a summer intern can learn?<\/p><p>-----------I am a divider--------------<br/><br/>Let me digress here and talk about my own interview experience at TransAsia Airways ground services. I remember it was close to the end of my military service, and I used the interview notice to ask my unit for leave. I get nervous easily, so of course I slept badly and had an upset stomach, and I don't have any relaxed, happy experience to share. I just want to tell every student who is about to have an interview: as long as you care, it will feel uncomfortable, you will worry about gain and loss, and you may even want to give up and not show up.<\/p><p>TransAsia Airways was in the Chung Shing Security headquarters building at Taipei Main Station. I set off by train directly from Longgang in Taoyuan for the interview. There weren't many people that day, probably because the earlier written exam had already filtered out quite a few, and more likely because back then TransAsia Airways was a small domestic airline and the service industry wasn't fashionable, so not many people applied.<\/p><p>The process that day was as follows:<br/>1. Self-introduction in Chinese and English:<br/>About 1-3 minutes. The interviewers would first ask standard questions to lead you into your Chinese and English self-introduction.<br/>2. Live Q&A:<br/>As I recall, the questions back then were:<br/>(1) You're a man, so why are you applying for a ground service counter at Chiang Kai-shek Airport?<br/>(2) If opening the counter on site means arriving at three in the morning, do you have transport?<br/>(3) Can you describe what you imagine the counter job involves?<br/>(4) If you aren't hired for this job, how will you plan your next step?<br/>(5) From the tests you did earlier, we know your aptitude. Now can you tell us what traits you think make you suited to this job?<\/p><p>A few days later I received an offer, but I didn't report for work, because their questions also made me think about my own career plan, and I gave up the chance to work ground services for TransAsia Airways at Chiang Kai-shek Airport. Later I changed jobs often, and gradually found that an interview is also a good chance to get to know the company: see what kind of people are interviewing you and what the company atmosphere is like. You will slowly discover your own choices and preferences.<\/p><p>I wish my students the best of results through their hard work. Opportunity is left for those who are prepared.<br/><br/><\/p>", "zt": "台灣高鐵實習第三關面試過關技巧TIPS"}, {"id": "010cb82e", "file": "2023-04-12-010cb82e", "date": "2023-04-12", "title": "Tips for Passing the Written Test in Round Two of the Taiwan High Speed Rail Internship", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "High-Speed Rail Internships", "src": "方格子", "url": "https://vocus.cc/article/64368a13fd897800010cb82e", "ex": "What to expect in the written exam for the 2023 THSR summer internship: English, logic, maths and essay questions, plus practical tips from past interns.", "len": 478, "body": "<figure class=\"ph\">Photo<\/figure><p>A few weeks ago, a senior alumna from our Department of Travel Management who works at Taiwan High Speed Rail (THSR) messaged me about a summer internship opportunity. I immediately forwarded it to my homeroom class of students about to enter their third year, encouraging anyone interested to apply. Congratulations to the students who have just received notice that they passed the first round of document screening. Here is the latest interview content for the 2023 THSR internship. I hope the last-minute cramming the teacher has gathered for you will help, so hold on tight to it.<br/><br/>The content below is compiled from the written-test experiences of all the intern students, and I'd like to thank the alumna who often provides internship opportunities, as well as the generations of interns who keep learning through their interviews.<br/>------------ This is a divider ----------------<\/p><p>Round two: Written test (2023.4.16)<br/>Location: THSR Operations Building in Taoyuan, Exit 5 of THSR Taoyuan Station<\/p><p><b>English:<\/b> Cloze, grammar, reading comprehension<br/>50 questions, 30 minutes<br/>TIPS: English depends on real ability. If you don't have it, go with your gut feeling or just fill in C.<\/p><p><b>Logic:<\/b> Similar to an aptitude test, spatial and figure reasoning<br/>50 questions, 22 minutes<br/>TIPS: You'll be shown four figures and have to choose the fifth. You can practise this beforehand.<\/p><p><b>Mathematical analysis:<\/b> Maths word problems (triangle angles, lengths and widths, circles, etc.)<br/>35 questions, 10 minutes<br/>TIPS: Finish the ones you can do first and leave the ones you can't blank. Don't get stuck on hard problems. Use the 10 minutes to find the questions you have a chance of getting right.<\/p><p><b>Essay topics:<\/b> Two essays, at least 200 characters each, 15 minutes<br/>Sample topic: How to become an outstanding THSR employee<br/>Sample topic: The value of high speed rail to Taiwan<br/>Sample topic: My understanding of THSR service<br/>Sample topic: The responsibilities THSR bears<br/><b>Scenario questions:<\/b><br/>If all seats are full over a long weekend, how would you calm the passengers?<br/>If someone in a group misses the train, how would you handle the passengers' complaints?<br/>TIPS: I suggest students first write a 200-character draft based on the company introduction on the THSR <a target=\"_blank\" rel=\"noopener\" href=\"https://www.thsrc.com.tw/corp\">company website<\/a>, memorise it, and then rewrite it by copying, reciting and adapting. Writing will then go smoothly.<br/><br/>Actually, all we teachers can do these days is, before the THSR document screening, nag everyone about approaching deadlines, help tidy up fragmented résumés and personal statements full of family members and total freedom of style, and send them off once they look presentable. Before the exam we say a cheerful \"you're all great\", and afterwards we say \"it's okay, try again next time\", and so on.<br/>Beyond that, teachers are honestly pretty useless. It is these brave students who dare to try who are truly admirable.<\/p><p>Wishing everyone success in the written test.<\/p>", "zt": "台灣高鐵實習第二關筆試過關技巧TIPS"}, {"id": "015adfdd", "file": "2023-04-11-015adfdd", "date": "2023-04-11", "title": "The 15K Dilemma", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "方格子", "url": "https://vocus.cc/article/6434a462fd897800015adfdd", "ex": "Most students at vocational universities of technology work part-time, earning about NT$15,000 a month, at the cost of study, growth and relationships.", "len": 369, "body": "<p>Most of the students in my class have part-time jobs, for one simple reason: money.<\/p><figure class=\"ph\">Photo<\/figure><p>This is something a vocational education teacher has to understand first when managing a class. It is more common at private schools than public ones, and at universities of technology than at general universities. I often see students attending class by day and working by night, going to school on weekdays and working on weekends. With that much time spent working, how much can they earn at NT$180 an hour? I asked several students, and they all said that, besides class, they make about NT$15,000 a month on average. That 15K means every working student reports for four hours a day on more than 20 days of the month.<\/p><p>So for students at vocational universities of technology who work to add 15K to their monthly income, it equals no time to discuss assignments = no time for deep learning = no time to develop themselves = no time for peer groups and clubs = no time to nurture family, friendship, or even love.<\/p><p>The biggest difference between a vocational university of technology and a general university is the 18-credit, year-long off-campus internship, in which students are placed in a related company for a full year before graduation, as most people in society know. But the University Act requires students to complete at least 128 credits to graduate. When a whole year cannot be spent taking courses on campus and yields only 20 credits, the other 108 credits must be completed during their time at school, averaging 36 credits a year. What society doesn't know, then, is that vocational students' course loads on campus are tighter than at general universities, which squeezes the time they have for part-time work and makes the room and time to earn that 15K even more compressed.<\/p><p>This is the students' dilemma, the teachers' puzzle, and above all society's reality show. When we see young faces serving us at shop counters after work, perhaps she or he is one of those students who gave up learning languages, taking certifications, joining clubs and making friends for a monthly income of 15K. Give her or him a smile and a thank-you!<\/p>", "zt": "15K的困境"}, {"id": "f1680920314", "file": "2023-04-08-f1680920314", "date": "2023-04-08", "title": "Common Mistakes in Internship Job Applications and Interviews", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Airline Internships", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A checklist of recurring mistakes I see when helping students prepare for company internship interviews, from emails and CVs to interview manners.", "len": 231, "body": "<p>Here is a summary of the problems that keep coming up when I help students with company internship interviews. No need to take it personally or feel hurt; just check yourself against each one and improve.<\/p>\n<p>When making contact:<\/p>\n<ol>\n<li>\n<p>The job application email has no subject line, or only a name<\/p>\n<\/li>\n<li>\n<p>The body of the email has no recipient and no signature<\/p>\n<\/li>\n<li>\n<p>The CV and attachments are not combined into a single PDF, making the interviewer hunt for the attachments<\/p>\n<\/li>\n<li>\n<p>The CV has no photo, or has an inappropriate photo<\/p>\n<\/li>\n<\/ol>\n<p>At the interview:<\/p>\n<ol>\n<li>\n<p>Arriving late or even being a no-show<\/p>\n<\/li>\n<li>\n<p>Clothes not ironed<\/p>\n<\/li>\n<li>\n<p>Hair needs to be tidy, and not dyed<\/p>\n<\/li>\n<li>\n<p>Bring an extra copy of your CV and your own pen<\/p>\n<\/li>\n<li>\n<p>Always be ready with a self-introduction in English or another foreign language<\/p>\n<\/li>\n<\/ol>\n<p>That's it for now. Because aviation and travel internship opportunities are plentiful this year, most students have already found the organisation they like. But I want to remind you that the first 1-3 months after you start work are the key, and before starting you should still keep the serious attitude above and remind yourself constantly. Especially for interns going into an English-language environment, please practise your language listening, speaking, reading and writing often before you start, and make good use of your remaining time at school to reach your own language goals.<\/p>\n<h1>HWUTravelManagement<\/h1>\n<h1>HWUTravel<\/h1>\n<h1>RayTeacherCourseDesign<\/h1>\n<h1>RayTeacherInternshipGuidance<\/h1>", "zt": "整理一下最近協助同學進行企業實習面試時常出現的問題，不用…"}, {"id": "f1679958347", "file": "2023-03-28-f1679958347", "date": "2023-03-28", "title": "Have You Read Charlotte's Web?", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Films & Books", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Reflecting on Charlotte's Web, Wilbur the pig and Charlotte the spider, and on the Taoyuan baboon that lived free for only a dozen days.", "len": 220, "body": "<p>Have you read Charlotte's Web?<\/p>\n<p>Wilbur the piglet and Charlotte the spider are good friends on a farm. Pigs on a farm are raised to be slaughtered and eaten, but Wilbur refuses to accept his fate. With his friend's help and care, he makes a series of desperate efforts to stay alive.<\/p>\n<p>Charlotte uses all her strength and wisdom to help Wilbur win the fair, and in doing so helps him find a reason and a worth for living. This is how Charlotte describes the days they both look forward to:<\/p>\n<p>\"This autumn days will shorten and grow cold. The leaves will shake loose form the trees and fall. Christmas will come, then the snowes of winter. ------ Winter will pass, the days will lengthen, the ice will melt in the pasture pond. The song sparrow will return and sing, the frogs will awake, the warm wind will blow again. All these sights and sounds and smells will be yours to enjoy, ------this lovely world, these precious days...\"<\/p>\n<p>In fact, I think the Taoyuan baboon probably imagined that a free life was something like this during these past dozen or so days.<\/p>\n<p>RIP Taoyuan Baboon<\/p>\n<p>Photo: harvested rice fields in the Mugua River Valley in Shoufeng in early spring, with the snow-capped Qilai Mountains in the distance (photographer: Rayfong Chen)<\/p>", "zt": "有讀過夏綠蒂的網嗎？"}, {"id": "f1679704457", "file": "2023-03-25-f1679704457", "date": "2023-03-25", "title": "[The Egg Affair, and What Can We Do]", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "Work & Moving", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "While Taiwan scrambled for eggs, I studied the EU egg code printed on an egg from a friend's fridge in Spain and thought about Taiwan's hens.", "len": 414, "body": "<p>[The Egg Affair, and What Can We Do]<\/p>\n<p>This egg comes from the fridge of Jessie Huang, who has a super cute daughter, was formerly the beautiful girl at the Y17 climbing gym's front desk, and is now a gorgeous Spanish housewife. A few weeks ago, when everyone in Taiwan was looking everywhere for eggs, I was reading articles about eggs and discovered that the management of eggs in the European common market is very different from Taiwan's. So I asked her to take an egg out of her fridge and photograph it.<\/p>\n<p>C. P. (should be the brand)<\/p>\n<p>27-MAR (best-before date, 27 March)<\/p>\n<p>2ES43006 (the 2 means this egg was laid by a barn hen; ES is the country code for Spain)<\/p>\n<p>Since 2004 the EU has required all eggs sold on the market to be marked: DE for Germany, NL for the Netherlands, and so on.<\/p>\n<p>I think the first digit of the mark is the most important, from 0 to 3.<\/p>\n<p>It tells whether the hens that laid the eggs produced our food while living with some rights as chickens.<\/p>\n<p>0: Organic eggs. Indoors, only 6 hens per square metre, with at least 4 square metres of outdoor space for them to roam; the feed the hens eat must also be organically produced and traceable to its source.<\/p>\n<p>1: Free-range eggs. Indoors, only 9 hens per square metre, and there must also be an outdoor area available all day. The minimum outdoor space per hen is 4 square metres.<\/p>\n<p>2: Barn eggs. The hens live in indoor houses with comfortable litter, again with only 9 hens per square metre indoors. They are not kept in cages, but sit on raised platforms in the barn covered with wood shavings.<\/p>\n<p>3: Cage eggs. The minimum space per hen is 750 cm2, roughly 27 by 27 cm.<\/p>\n<p>Before writing this post, the only thing I could read on the egg was the best-before date, 27-MAR. While gathering the material, I kept thinking of Taiwan's hens, spending their whole lives squeezed into tiny cages laying eggs for us, and when they lay less, being culled in droves and turned into salt-water chicken to be sold at Taiwan's night markets. I feel an eggy sadness for Taiwan's hens.<\/p>\n<p>All right, reporting to General Manager Jessie Huang: I finished the article before the egg expired! I wonder if that egg is still in your fridge? Next time I'm back in Taiwan, I'll treat you to salt-water chicken!<\/p>", "zt": "【蛋事又何奈】"}, {"id": "f1679535824", "file": "2023-03-23-f1679535824", "date": "2023-03-23", "title": "The Courage to Refuse Needs to Be Cultivated", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "Childhood", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A rewritten memory of being caned in front of the whole faculty for changing a bully's exam answers in junior high, and why Ray still resents that teacher.", "len": 605, "body": "<p>【The Courage to Refuse Needs to Be Cultivated】<\/p>\n<p>The junior high I attended as a child was all boys, and classes were divided into A+ classes (front), A-track classes (middle) and B-track classes (back). I have been in all three kinds, and will share the reasons another time. In my second year I was in an A-track class, and my homeroom teacher then is now a well-known retired high school principal.<\/p>\n<p>My grades were not bad, so I served as the teaching assistant for one of the homeroom teacher's subjects, recording scores and helping mark papers. Once the papers were marked and the scores recorded, it was the teacher's time to hit people: palm strikes, spankings, cheek pulling, half-squats, every kind of punishment. So everyone who took an exam was afraid, and so was whoever marked the papers and recorded the scores. If I got a score wrong, a classmate would be hit the wrong number of times, and I would be in trouble with everyone.<\/p>\n<p>Classmates often came to the teaching assistant asking to fix \"marking mistakes\" on their papers. Mostly it was a \"misreading\" that could always be corrected before the teacher dealt with us. It was a hassle and a worry, but hard to refuse! After I became a teacher myself, I realised that changing scores should never be the teaching assistant's job; it was really the teacher being lazy.<\/p>\n<p>The big trouble was bound to come one day.<\/p>\n<p>A classmate who was a kind of \"big brother\" in the class had done terribly on the exam, and it was certain he would be beaten until his backside was black and blue. At noon break he came to me to \"discuss\" it, and asked for my answers so he could copy them! I did not want to, but I was also afraid he would come after me outside school. I had learned this in first year when I was messing around in the B-track class: you have to read the situation, and you have to bow your head.<\/p>\n<p>A few days passed, and I felt miserable and worried. I could not study and could not sleep well! Then the homeroom teacher appeared and called the two of us to the year-level teachers' general office, a very large one where many teachers sit together (and now my own teachers' office is just like that, which is really uncomfortable).<\/p>\n<p>The teacher said he did not believe that classmate could have scored well, and asked me whether I had helped change his answers. I was terrified. I glanced at my classmate, he nodded, so I nodded and admitted it too!<\/p>\n<p>The teacher exploded. Right there, with all the teachers of the whole year present, he made the classmate and me lean with our hands on the desk and our backsides raised, and with a cane half as long as a person he viciously gave the classmate 20 hard strokes on the backside first, then, just as furiously, gave me the same 20 strokes in front of all the teachers.<\/p>\n<p>I did not cry at the time, and neither did my classmate. The \"big brother\" said to me sincerely: \"Sorry, it won't happen again.\"<\/p>\n<p>Even as I type these words, I can still feel the burning heat on my backside and the heartache of humiliation and resentment! But from that day on, I no longer had to be afraid walking around outside in Yonghe, I felt no unease inside, I could study again, and I slept until I could hardly get up.<\/p>\n<p>But to this day, I still hate my second-year homeroom teacher.<\/p>\n<h1>ThoughtsOnTheRevisedDisciplineLaw<\/h1>\n<h1>RewritingAnOldPost<\/h1>\n<h1>RefusingIsNotEasy<\/h1>", "zt": "【拒絕的勇氣需要培養】"}, {"id": "f1677467923", "file": "2023-02-27-f1677467923", "date": "2023-02-27", "title": "Mickey Mouse Degrees", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A Telegraph report ranks the ten UK degrees with the lowest pay five years after graduation, and what that means for students choosing a major in the age of AI.", "len": 219, "body": "<p>Mickey Mouse Degrees<\/p>\n<p>Have you heard of \"Mickey Mouse degrees\"?<\/p>\n<p>The Telegraph in the UK ran an article (link in the comments) listing the ten subjects whose graduates earn the lowest average salaries five years after graduating. Graduates of these subjects can hardly earn a reasonable wage, simply because they studied Mickey Mouse degrees, that is, the subjects with the worst value for money.<\/p>\n<ol>\n<li>\n<p>Photography<\/p>\n<\/li>\n<li>\n<p>Translation<\/p>\n<\/li>\n<li>\n<p>Film<\/p>\n<\/li>\n<li>\n<p>Fine art<\/p>\n<\/li>\n<li>\n<p>Criminology<\/p>\n<\/li>\n<li>\n<p>Music<\/p>\n<\/li>\n<li>\n<p>English<\/p>\n<\/li>\n<li>\n<p>Event management<\/p>\n<\/li>\n<li>\n<p>Fashion<\/p>\n<\/li>\n<li>\n<p>Architecture<\/p>\n<\/li>\n<\/ol>\n<p>UK graduates in the subjects above earn an average of less than £27K a year, which is less than one million Taiwan dollars. A Big Mac in the UK costs £3.79, about NT$140. The Taiwan General Scholastic Ability Test has just ended, and many high school students are now thinking about what to study and how to choose a department and a school. If you think about the future in terms of earning power, quite a few subjects might really be Mickey Mouse degrees.<\/p>\n<p>At the singularity of AI development, university coursework, written and illustrated reports, and even statistical papers could be replaced in an instant.<\/p>\n<p>The attached picture was generated by Midjourney one minute after I typed my prompt. Sadly my free trial under my ID has run out, and I'm considering whether to spend NT$300 a month to become a member.<\/p>", "zt": "【米老鼠學位】"}, {"id": "f1677296045", "file": "2023-02-25-f1677296045", "date": "2023-02-25", "title": "MSC Cruises' World Cruise Is Due to Call at Keelung Port on March 15", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Industry News", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "MSC Poesia's 119-day world cruise will stop at Keelung on March 15; Ray would love to photograph it and to take the journey himself.", "len": 181, "body": "<p>MSC Cruises' world cruise is expected to call at Keelung Port on Wednesday, March 15, from 09:00 to 18:00. Today, Feb 25, the Poesia is sailing across the South Pacific toward Sydney, Australia, and I really want to go to Keelung Port to take photos! The cruise class on Wednesday, March 15, periods 8 and 9, should simply move to the port's passenger terminal (the teacher is talking in his sleep).<\/p>\n<p>MSC Poesia set out from Milan, Italy on Jan 5 this year on a 119-day round-the-world voyage, passing through 33 countries and 53 ports. Surely someone is wondering how much it costs. According to comments I found on Cruise Critic, it starts at US$15,750 per person for two people sharing a cabin, roughly NT$500,000, though of course the price differs by cabin type. Would you like to join MSC's world cruise?<\/p>\n<p>I want to so badly! 🥰<\/p>\n<p>For more about the Poesia, the Wikipedia page is in the comments if you'd like to take a look.<\/p>\n<p>Image source: MSC's official website; the Cruisemapper link is noted in the image area.<\/p>", "zt": "MSC地中海郵輪環遊世界航線3/15(三)預計在09:0…"}, {"id": "f1676106462", "file": "2023-02-11-f1676106462", "date": "2023-02-11", "title": "100 Straight Weeks of Running: Notes on My Apple Watch", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Running & Exercise", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "After 100 consecutive weeks of running with my Apple Watch, here are eight honest notes on what works, what doesn't, and why it's so expensive.", "len": 253, "body": "<p>100 consecutive weeks of running means this Apple Watch is almost 2 years old. Here are some notes on it:<\/p>\n<ol>\n<li>\n<p>I mainly use the AW to tell the time and record runs. The Nike app can remind me of the time and record runs, but it can't measure cadence. Since I run for health and habit, I don't mind.<\/p>\n<\/li>\n<li>\n<p>Syncing a podcast before a run and wearing bone-conduction headphones lets me listen to good radio programmes or interviews while running. I highly recommend this.<\/p>\n<\/li>\n<li>\n<p>The AW works as an offline credit card for payments, which is very convenient. You can go out without carrying money.<\/p>\n<\/li>\n<li>\n<p>The AW can't work as an EasyCard, so it can't be used to borrow a UBike (I tried many times without success; maybe I'm wrong).<\/p>\n<\/li>\n<li>\n<p>The AW lets you check your heart rate and health indicators at any time. But I don't wear the watch to sleep, so I can't track my sleep.<\/p>\n<\/li>\n<li>\n<p>I've used it for swimming a few times. Waterproofing is no problem, and in an indoor pool it can record short laps, because with 25-metre lengths I often lose count of how many I've swum.<\/p>\n<\/li>\n<li>\n<p>The battery lasts only one day before it needs charging, which is a hassle for trips since you have to carry a charging cable. If I run a full marathon, will it run out of power? This year I could try it at a race.<\/p>\n<\/li>\n<li>\n<p>The biggest drawback is that one watch costs over NT$10,000, which I find very expensive.<\/p>\n<\/li>\n<\/ol>", "zt": "連續跑步100週表示這隻Apple Watch快2年，記…"}, {"id": "f1674437907", "file": "2023-01-23-f1674437907", "date": "2023-01-23", "title": "Cruise Refugee Camps", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Industry News", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Scotland is housing thousands of Ukrainian refugees aboard cruise ships, and Ray wonders where Taiwanese could flee if war came: only peace makes tourism possible.", "len": 259, "body": "<p>【Cruise Refugee Camps】<\/p>\n<p>The [Ambition Cruise Ship], moored beside King George V Dock on the River Clyde in Glasgow, the capital of Scotland, is a temporary home for Ukrainian refugees. Refugees living aboard can use the restaurants, children's play facilities, shops, cleaning and public spaces the cruise ship was originally designed with, while the Scottish government also provides some healthcare and welfare support services.<\/p>\n<p>The Scottish government has arranged several cruise ships to house refugees fleeing the war between Ukraine and Russia, because the ship's complete living facilities give displaced children and women a place to stay through the cold winter and the burning summer. Ambition and MS Victoria I now house more than 2,000 refugees between them.<\/p>\n<p>【Only with peace can there be tourism】<\/p>\n<p>Scotland has provided more housing for Ukrainian refugees than any other part of the UK. The war in Ukraine is almost a year old, and more than 22,000 Ukrainian refugees have come to Scotland. In 2022 the Scottish government provided a fund of £50 million to turn unused venues into housing and to recruit willing landlords, to increase the housing available to refugees.<\/p>\n<p>After three years of closed borders for epidemic control, plus a back-and-forth conscription system, if war broke out, does Taiwan have a neighbouring country that could take us in and give us refuge? I think not. Taiwanese without a US green card, a Commonwealth visa or Japanese residency have only this land. How to use political wisdom to lower the possibility of war should be what most Taiwanese hope for.<\/p>\n<h1>BBCReportInTheComments<\/h1>", "zt": "【郵輪難民營】"}, {"id": "f1674180081", "file": "2023-01-20-f1674180081", "date": "2023-01-20", "title": "When the Pub Closes, I Leave", "cat": "Ageing Well", "cats": ["Ageing Well"], "sub": "Ageing Society", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray reflects on Churchill's famous line about leaving when the pub closes, and on politicians who cannot let go of the stage.", "len": 208, "body": "<p>When the pub closes, I leave<\/p>\n<p>Churchill, the legendary British prime minister who led Britain through the Second World War, probably imagined and hoped to serve his country until his dying day. Yet when he lost an election, he told the press an intriguing line: \"Mr. Editor, I leave when the pub closes#.\" Some say this is the graceful figure of a politician retiring; others say it is the drunken talk of an old man leaving the table.<\/p>\n<p>In recent days I saw a former Premier and Vice President publish a book#, and Premier Su resign along with his cabinet, and the comparison struck me deeply. As a former foot soldier who worked for the KMT for many years and once took pride in working for the party and the country, I watched an elderly man, who sold off the party's assets in a failed bid for victory, publish a book years later, apparently believing the pub was still open for him. The sight of him lingering at the door, muttering resentfully, made me laugh.<\/p>\n<p>Churchill, The Economist, 1 February 1965, quoted in Lang- worth, ed., Churchill By Himself, 528.<\/p>\n<p>Lien Chan, Lien Chan Memoirs, 17 January 2023, Commonwealth Publishing.<\/p>\n<p>photo source: Gunmaker, Traditional English pub in Marylebone.<\/p>", "zt": "酒館關門我就離開"}, {"id": "f1673667676", "file": "2023-01-14-f1673667676", "date": "2023-01-14", "title": "By 2040, Taiwan Is Projected to Become an Elder Nation Like Japan Today", "cat": "Ageing Well", "cats": ["Ageing Well"], "sub": "Caregiving", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Taiwan's population projections point to an elder nation by 2040, as Japan is today. Japan's responses to extreme ageing offer ideas worth learning from.", "len": 170, "body": "<p>According to Taiwan's population statistics, by 2040 (ROC year 129), as the chart shows, Taiwan will become an Elder Nation just like Japan in 2021, defined as a country where more than thirty percent of citizens are over 65.<\/p>\n<p>There are three causes: #LivingTooLong, #TooFewBirths, #RefusingImmigrants<\/p>\n<p>For Japan this outcome is already irreversible, yet Japan's advanced society is gradually finding solutions, and extreme ageing has even sparked innovation in many areas:<\/p>\n<ol>\n<li>\n<p>Bringing retirees back to work, so that older people become contributors to society rather than recipients.<\/p>\n<\/li>\n<li>\n<p>Government policy and education focus on the care industry, encouraging more people to learn self-care skills.<\/p>\n<\/li>\n<li>\n<p>City planning emphasises walking and public transport; the more people who can walk, the lower the national health insurance spending.<\/p>\n<\/li>\n<li>\n<p>Improving integrated community mechanisms for mutual care, using small communities that combine housing, shopping and care so that residents look after one another.<\/p>\n<\/li>\n<li>\n<p>Nursing homes, insurance companies and life parks are being horizontally integrated.<\/p>\n<\/li>\n<li>\n<p>Health technology applications are a research and development priority for advanced industries.<\/p>\n<\/li>\n<\/ol>\n<h1>TheNationalGeographicLinkIsInTheComments<\/h1>", "zt": "依據台灣的人口統計預估2040年(民國129年)#如圖，…"}, {"id": "f1673403905", "file": "2023-01-11-f1673403905", "date": "2023-01-11", "title": "The Wedding Venue Matters a", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Everyday Notes", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray weighs in on the banquet-style street feast versus the star-rated hotel wedding, and laughs about holding his own wedding at the National Central Library.", "len": 369, "body": "<p>The Wedding Venue Matters a<\/p>\n<p>Suddenly the open-air wedding banquet versus the star-rated hotel has become a topic of conversation.<\/p>\n<p>I'll stand on the side of the open-air banquet first, because the best wedding feast I ever ate was at a student's wedding in Tainan, held at a community activity centre. The food was lavish, delicious and fresh, the emcee kept the mood great throughout, and we went home with bags and bags of chicken soup, mud crab sticky rice and fruit drinks that we couldn't finish, savouring them again all the way back to Taipei. That 500 km drive was totally worth it.<\/p>\n<p>But I also want to support good restaurants. The best wedding dishes I have ever eaten were at a seafood restaurant next to the Taipei Botanical Garden, where a graduate school classmate held his wedding. There wasn't a dull moment from start to finish, every plate was cleared, we were well fed and well wined, and I still remember it today.<\/p>\n<p>As for why star-rated hotels win the support of a former bride-to-be, the reason is simple: the whole banquet is her showcase. She probably won't take more than a couple of bites of the dishes, which start at NT$20,000 a table, since she has gone hungry for months to fit into the most beautiful, dreamy outfit, hair and make-up. Who cares about the menu? What matters is that perhaps one and only wedding, where everything must be presented perfectly, and she cares even more that no one on stage could possibly be more beautiful than she is, not even the performers. Only five-star decor and pink bubbles are fit for a star-rated bride.<\/p>\n<p>Finally, I realised that our own wedding banquet was held at the National Central Library, right in front of Chiang Kai-shek Memorial Hall, which fits none of the categories above. Perhaps when many teachers and friends came to congratulate us, the topic of conversation at the time was still:<\/p>\n<p>a... You can hold a wedding banquet at the National Central Library?<\/p>\n<p>We drive along Zhongshan South Road almost every week, and we still often wonder what on earth we two were thinking back then 🤣<\/p>\n<p>Image source: Taipei Computer Association, Edtech.tw<\/p>", "zt": "婚宴場地很重要a"}, {"id": "f1673050462", "file": "2023-01-07-f1673050462", "date": "2023-01-07", "title": "Chatting with Students After the Exam, Before the Holiday: Sophomores Face Corporate Internships in a Year…", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "High-Speed Rail Internships", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A conversation with a sophomore who works part-time at McDonald's, about time planning, preparing for internships at airlines and THSR, and why opportunities go to the prepared.", "len": 267, "body": "<p>Before the holiday, after the exam, I chatted with my students. The sophomores in my class will face corporate internships in just a year. Watching the juniors keep announcing the companies that have accepted them, I could feel that everyone has a sense of urgency.<\/p>\n<p>Me: Why do you keep working part-time?<\/p>\n<p>Student: Teacher, I need money!<\/p>\n<p>Me: If you work at McDonald's every day after class and on weekends, about how much do you earn a month?<\/p>\n<p>Student: About NT$10,000, depending on how many hours I put in.<\/p>\n<p>Me: McDonald's is very busy, so you have no time to prepare for the self-improvement content from your classes!<\/p>\n<p>Student: Probably, but I still really want to get my certificates and learn useful tools.<\/p>\n<p>Me: Then you need to plan your time, make good use of the school's resources, and come to class and keep up with the schedule.<\/p>\n<p>Student: Teacher, do I have a chance to intern like the seniors do at #StarLuxAirlines #EVAAir #UNIAir #LionTravel #TaiwanHighSpeedRail?<\/p>\n<p>Me: Of course, but opportunities go to those who are prepared. When the seniors intern, they are treated just like full-time staff. Some companies even offer interns NT$28,000, which is much better than the NT$10,000 you're working yourself half to death for. You'd also get regular days off, even two-day weekends, and after graduation you have a chance to be converted to a full-time employee.<\/p>\n<p>Student: Thank you, Teacher. I'll think about it carefully.<\/p>\n<p>Me: Remember, don't just think about it! Plan and take action! I'm always here for you.<\/p>\n<p>✈️🚄🚞🚢🚌✈️<\/p>\n<h1>PractitionersOfFlightAttendantTravelInternshipAndCareerOrientedEducation<\/h1>\n<h1>HWUTravelManagement<\/h1>\n<h1>HsingWuUniversityTravelManagement<\/h1>\n<h1>HsingWuUniversity<\/h1>\n<h1>HWUTravel<\/h1>\n<h1>intern<\/h1>\n<h1>MostPreferredByEmployersUniversityRankedSeventhNationwide<\/h1>\n<h1>NotGettingIntoANationalUniversityIsFine<\/h1>\n<h1>JoinHWUTravelManagementAndBeColleaguesWithTopUniversityGrads<\/h1>", "zt": "放假前考試後與學生聊聊，班上大二學生再一年就要面對企業實…"}, {"id": "f1671950085", "file": "2022-12-25-f1671950085", "date": "2022-12-25", "title": "In 2070, Half of Taiwan's Population Will Be Elderly", "cat": "Ageing Well", "cats": ["Ageing Well"], "sub": "Ageing Society", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "According to the National Development Council's population projections, by 2070 Taiwan's pyramid will invert, with fewer earners than dependants and mostly single-person households.", "len": 213, "body": "<p>[In ROC year 159 (2070), half of Taiwan's population will be elderly] 4.4 times &gt;&gt; 1.1 times<\/p>\n<p>[In ROC year 159, Taiwan will have fewer people earning money than spending it] Dependency ratio 40.2 &gt;&gt; 109.1<\/p>\n<p>[In ROC year 159, everyone reading this post now will probably be elderly] 18+<\/p>\n<p>The National Development Council has a graphical system for population projections. The left chart is the current population pyramid, and the right is Taiwan 48 years later, which has become an inverted population pyramid. Because of good healthcare, non-marriage, \"marriage without cohabitation\" and the falling birth rate, most households in the future will be people living alone, and family life will become a minority.<\/p>\n<p>How old will you be in ROC year 159?<\/p>\n<p>In 2070, half of Taiwan's population will be old people and there will be fewer people earning money than spending.<\/p>\n<p>The National Development Council has a graphical system for population forecasting. The blue diagram is the current The diagram in blue is the current population pyramid, and the diagram in red is Taiwan 48 years later. It has become an inverted population pyramid; and because of health care, non-marriage and declining birth rate, most households will be homealone, family life will become a minority.<\/p>\n<p>How old were you in 2070?<\/p>", "zt": "【民國159年時台灣有一半的人口是老人】4.4倍>>1.…"}, {"id": "f1667108154", "file": "2022-10-30-f1667108154", "date": "2022-10-30", "title": "Crushed in the Crowd: A Memory from Seventh Grade", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "School & Military Service", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A news report brings back the frightening day in junior high when I was lifted off my feet and trampled in a packed corridor.", "len": 271, "body": "<p>Many years ago, when I was in seventh grade, I was only about 143-150 cm tall. Every morning the school held a morning assembly. There were more than 50 students in a class and 37 classes in a grade, and the school's not-so-big playground had to squeeze in 5,000 to 6,000 people in a short time. So every morning, class after class of students had to move to the playground, passing through several very narrow corridors. Junior high students pushed and shoved their way toward the playground exit. There were truly so many people, and it was miserable, especially for a small seventh grader like me.<\/p>\n<p>Then one day, in the middle of all the pushing and shoving, I was squeezed right off the ground and carried along with the crowd. Then a gap suddenly opened, and I fell and was pinned underneath. Time seemed to stop. Everything was a mass of darkness, and I have no idea how many classmates stepped on me and pushed over me. Suddenly one classmate pulled me up with all his strength, and pushing and pulling, got me out of that terrifying dark corridor. Only when I saw the light of the playground did I regain my senses.<\/p>\n<p>This was the second time I nearly lost my life. I don't know whether it left any after-effects, but when I saw the news, I faintly remembered the dreadful feeling of that day: the darkness, the helplessness, the loss of any sense of time.<\/p>\n<p>It is truly frightening!<\/p>\n<p>May the dead rest in peace and the injured recover safely!<\/p>\n<p>Image source: 1987 Yonghe Junior High School yearbook<\/p>", "zt": "好多年前念國一時，我只有143-150公分高左右，每天早…"}, {"id": "f1663802833", "file": "2022-09-22-f1663802833", "date": "2022-09-22", "title": "\"Between Two Worlds\": Social Immobility in Cruise Ship Work", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Reflections on student part-time jobs, my own teenage work experience, and a film about hidden labour that reminds us how hard it is to move between social classes.", "len": 391, "body": "<p>\"Between Two Worlds\": Social Immobility in Cruise Ship Work<\/p>\n<p>Most vocational university students go straight to part-time jobs after class. The long hours and low pay of restaurant and convenience-store work are a vicious cycle that is hard to bear.<\/p>\n<p>I really sympathise with how students juggle school and work. When I was in the \"B-track\" class in junior high, there were no remedial classes in the summer, so my family arranged for me to test circuit boards at a home workshop under Yongfu Bridge. In high school, while classmates went to cram schools near Taipei Main Station for physics, chemistry and English after class, I would rush off in my school uniform to a bowling alley on Zhulin Road in Yonghe to make coffee and carry plates.<\/p>\n<p>I feel quite embarrassed thinking about it now. In fact, I think I only lasted a few months each time before I was too exhausted to continue, because I simply could not withstand the double pressure of long part-time hours and the intense schoolwork of high school.<\/p>\n<p>These past few days the online debate over educational qualifications has been fierce, with everyone holding their own position. But I often wonder: if I had had the resources and time back then, would I have done better? Not necessarily, because success and failure cannot be guaranteed by one's educational or work background at any single moment.<\/p>\n<p>One year, when I ran a cruise teaching programme and student study camp, I met a housekeeping cleaner at sea who was an industry-academia cooperation student from a tourism college. After having the chance to talk more and learn about their pay and working conditions, I came away with a very different understanding and impression of cruise travel.<\/p>\n<p>I recommend everyone watch #BetweenTwoWorlds (Ouistreham), starring the famed French actress. She plays a writer who goes undercover on a ferry service and joins the cleaning crew doing housekeeping. Because of recruitment without borders, such jobs are often the only option for migrants and migrant workers. Beyond the complex shock of life experience and of cooperative-education employees, you feel the helplessness of how hard it is to move between the layers of an unpredictable social hierarchy.<\/p>\n<p>If you have the chance to study with a focused mind and enjoy campus and club life, remember to go back and thank your family.<\/p>", "zt": "「失業風暴」郵輪工作中的階級不流動"}, {"id": "f1662862694", "file": "2022-09-11-f1662862694", "date": "2022-09-11", "title": "Weekend Reading: How Did Japan Win the Traffic War? (Article in the Comments)", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Japan's pedestrian road deaths are a fraction of America's. A reflection on how Taiwan could remake its streets to respect people who walk.", "len": 214, "body": "<p>Weekend Reading: How Did Japan Win the Traffic War? (Article in the Comments)<\/p>\n<p>In Japan, an average of 2.24 pedestrians per 100,000 people die each year in road crashes, versus 12.7 in the United States. Forty years ago, 41% of American children walked to school; now only 13% do.<\/p>\n<p>The article discusses how Japan designed urban environments suited to pedestrian life. At a time when we can't travel to Japan as tourists, we can think about how to reshape Taiwan's environment into a good living environment that respects pedestrians and passers-by.<\/p>\n<p>For reference, Taiwan had 2,962 traffic fatalities in 2021. In descending order: Kaohsiung (330), Tainan (293), Taichung (280), Taoyuan (264), New Taipei (264) and Taipei (130). There is a clear geographic pattern. Why?<\/p>\n<p>I personally love walking. Anywhere I can walk, I walk, and if not, I ride a YouBike. My son walked to and from school by himself all through elementary and junior high school. We did worry, but he still had to learn how to survive in Taiwan's frightening traffic environment.<\/p>\n<p>Across Taiwan, there is hardly any decent environment where pedestrians can walk safely and smoothly.<\/p>\n<p>Taiwan's sidewalks suffer three plagues: scooters, stray dogs and electrical boxes.<\/p>\n<p>But the worst of all: there is no sidewalk at all along the road.<\/p>", "zt": "假日閱讀：日本如何贏得交通戰爭？(文章在留言處)"}, {"id": "f1657930649", "file": "2022-07-16-f1657930649", "date": "2022-07-16", "title": "Years ago on Zhixue Street in Hualien, I saw a student in slippers walk out of his dormitory...", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray observes how Taiwanese habitually ride motorcycles even for fifty-metre trips to breakfast, forgetting they have two legs to walk with.", "len": 329, "body": "<p>Years ago on Zhixue Street in Hualien, I saw a student in slippers walk out of his dormitory on the street, get on his motorcycle and twist the throttle. His feet had not even reached the front footrests before he stopped at a breakfast shop 50 metres away.<\/p>\n<p>I had cycled there to buy breakfast. Soon I watched the student, with his food bought, climb onto his ride again, and after another twist of the throttle he was back at the dormitory 50 metres away and went upstairs.<\/p>\n<p>Zhixue Street has proper pedestrian pavements, but the two-lane road is lined on both sides with the motorcycles of students and residents. Too many people in Taiwan are so used to two-wheeled motor vehicles that they forget they still have two legs to walk on.<\/p>\n<p>The same thing happened a few days ago when I went to a breakfast shop and saw a man, fully able-bodied, ride his motorcycle a few dozen metres out of his neighbourhood to pick up breakfast and then ride back in.<\/p>\n<p>Many years ago, Hualien, I saw a student wearing slippers, walking out of the dormitory on the street, riding a motorcycle, his feet were still not on the front pedal, and than he stopped at breakfast restaurant at 50 meters away.<\/p>\n<p>At that time I went for breakfast on bicycle, and soon I watched the student with food and straddle his ride again. Such distance with the accelerator in seconds, he went back to the dormitory and went upstairs.<\/p>\n<p>Taiwan has a well sidewalk or pedestrian arcade along the narrow streets, but where are full of motorcycles of students and residents. However, Taiwanese are used to two wheels, forgetting that they still have feet to walk.<\/p>\n<p>Recently, I went to the breakfast shop a few days ago and saw an young man, riding a motorcycle dozens of meters out of the community to get food and then back to his house in few seconds.<\/p>\n<p>God.<\/p>", "zt": "多年前在花蓮志學街上曾看到一位學生穿著拖鞋，從街上的宿舍…"}, {"id": "f1656373637", "file": "2022-06-28-f1656373637", "date": "2022-06-28", "title": "Those of Us Who Lived Through the 20th Century Will Realise: The 21st Century Brings Great Change", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Current Affairs", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A speculative essay on population shifts, resource competition and the rise of a new online tribe I call the Weberian, over the next hundred years.", "len": 360, "body": "<p>[Those of Us Who Lived Through the 20th Century Will Realise: The 21st Century Will Bring Great Change]<\/p>\n<p>Within the next hundred years, the populations of developing countries will largely replace those of developed countries. Unless there is very good political planning and implementation, uneven economic development will become the greatest worry, as humans fight over resources and even go to war with each other. Looking back at human civilisation, population has little to do with the development of culture and ideas. The falling birth rate issue appears only in civilised countries, but however hard civilised countries try to have children, they cannot out-produce developing countries, and turning back is difficult.<\/p>\n<p>A prediction: here are possible ways to live stably and avoid the suffering of war over the next thirty years.<\/p>\n<p>Politically, moving to the US or Canada, China, or island countries such as Japan, Taiwan, Australia and New Zealand are all good places, because strong militaries, natural geographic borders and stable national systems are important protections against large populations in developing regions fighting over limited resources. In Europe, if the EU and NATO integrate successfully, there is a chance; if not, it will return to the chaos of the early 20th century, because Arabs and Africans will appear at the borders, mirroring the European history of the past thousand years, which is hard to avoid.<\/p>\n<p>Economically, because of rapid technological development, large enterprises controlling resource allocation will dominate living standards. Every aspect of life will be completely affected by technological resources, and even a different kind of group and lifestyle will develop in the information environment, crossing national borders and races to become another kind of mutually dependent community. I tentatively call it the Weberian.<\/p>\n<p>The Weberians already exist within today's society. For example, groups formed around anime and Cosplay, regardless of nationality, have turned imagination into reality and exist within society, and they are far more active online than they ever were in real-world interactions. If so, conflicts of population, religion and race will have nothing to do with these people, and within these groups there will be completely independent social strata and lifestyles (to be continued).<\/p>\n<h1>Weberian<\/h1>", "zt": "【走過20世紀的我們將要體認：21世紀將有巨大的轉變】"}, {"id": "f1656399346", "file": "2022-06-28-f1656399346", "date": "2022-06-28", "title": "My Running Mentor, Teacher Wu Chin-Yun, RIP", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Running & Exercise", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Remembering my university jogging teacher Wu Chin-Yun, a former triathlon queen whose demanding classes taught me lessons I still use today.", "len": 329, "body": "<p>My Running Mentor, Teacher Wu Chin-Yun, RIP<\/p>\n<p>Even today, university PE electives always seem to be popular, and everyone tries every way to avoid ending up in a sport they dislike. I honestly cannot remember why I signed up for Teacher Wu Chin-Yun's jogging class back then. As I recall, none of my classmates took the same session as me. I was just one of the thousands of nameless students in Teacher Wu's PE electives, but of all the PE classes I have taken since childhood, I remember only Teacher Wu Chin-Yun's, and I still benefit from it enormously today.<\/p>\n<p>Teacher Wu's classes were very substantial. She taught with a strong, full voice, and as I remember it she joined us herself even for the warm-up and shuttle runs before class, and we had to keep up. In the first lesson, before we had even started jogging, our legs were weak and our hands were shaking. In the second lesson we had to run 10 laps of the track on Guizi Road before cooling down and ending class. Students with poor stamina could give all they had and still not satisfy Teacher Wu enough to be dismissed, and for the final exam we had to run three laps around the outermost edge of the campus.<\/p>\n<p>I knew back then that Teacher Wu had been a sports star in her youth, but I really never expected that in her class, university students who were not PE majors would be drilled like this. Only after seeing the news today did I learn that Teacher Wu had been the \"Queen of Triathlon.\" No wonder she shook her head the whole time as she trained alongside us. Compared with her fitness, we useless university students were truly just feed chickens.<\/p>\n<p>This summer I will find time to go back to the school and run those three laps, in gratitude for your guidance and teaching back then!<\/p>\n<p>Beloved Teacher Wu, rest in peace. R.I.P.<\/p>", "zt": "我的跑步啟蒙師-吳錦雲老師 RIP"}, {"id": "f1656317710", "file": "2022-06-27-f1656317710", "date": "2022-06-27", "title": "[2022 Summer Reading List]", "cat": "Morning Reading", "cats": ["Morning Reading"], "sub": "Book Notes", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A list of 29 recommended books for summer reading, with a reminder to students to use the break to explore, read and keep learning.", "len": 409, "body": "<p>[2022 Summer Reading List]<\/p>\n<p>These days people rarely read physical books because of all kinds of screens, but reading still has many benefits. It can calm the mind, spark imagination, prompt reflection and even bring creative ideas. So when students finish their final exams and I can finally nag them a little, I keep reminding them: make good use of the summer to travel and look around, and build a habit of reading and learning. Part-time work to earn money is understandable, but the time to build your abilities is now.<\/p>\n<p>Below is the summer reading list from \"Ah Gou's school\". Let's read together! If you can't finish all 29, at least pick one and read it properly, and we'll wait to hear your thoughts!<\/p>\n<ol>\n<li>\n<p>Nelly Sachs, <em>The Weight of a Butterfly<\/em> (Taiwanese edition), Ballad Publishing<\/p>\n<\/li>\n<li>\n<p>Wu Dai-ying, <em>The Dream Maker<\/em>, Rye Field Publishing<\/p>\n<\/li>\n<li>\n<p>Chu Kuo-chen, <em>Dear Little Conscript: Let's Walk Hand in Hand<\/em>, INK<\/p>\n<\/li>\n<li>\n<p>Yu-wen Cheng, <em>Our Song<\/em>, Yu Lu Culture<\/p>\n<\/li>\n<li>\n<p>Wang Sheng-hung, <em>Chevrolet<\/em>, Marco Polo Press<\/p>\n<\/li>\n<li>\n<p>Lai Hsiang-yin, <em>White Portrait<\/em>, INK<\/p>\n<\/li>\n<li>\n<p>Tsai Su-fen, <em>The Blue House<\/em>, Linking Publishing<\/p>\n<\/li>\n<li>\n<p>Chen Te-cheng, <em>Where the Gods Dwell<\/em>, Eslite New Classics<\/p>\n<\/li>\n<li>\n<p>Chen Lang, <em>A Long Commemoration<\/em>, Spring Hill Publishing<\/p>\n<\/li>\n<li>\n<p>Shen Hsin-hung, <em>How to Become a Man<\/em>, Ballad Publishing<\/p>\n<\/li>\n<li>\n<p>Fang Tzu-chi, <em>Not Yet My Era<\/em>, Yu Lu Culture<\/p>\n<\/li>\n<li>\n<p>Sun Tzu-ping, ed., <em>Chiuko Prose Selection, Year 110 (2021)<\/em>, Chiuko Publishing<\/p>\n<\/li>\n<li>\n<p>Hu Ching-fang, ed., <em>My Taipei, My Streets<\/em>, Ecus Publishing<\/p>\n<\/li>\n<li>\n<p>Lin Hwai-min, <em>Torrents and Reflections<\/em>, China Times Publishing<\/p>\n<\/li>\n<li>\n<p>Bi Liu-ying, <em>Fasting for a Good Death<\/em>, Rye Field Publishing<\/p>\n<\/li>\n<li>\n<p>Chen Yi-chih, <em>For the Next Reunion<\/em>, Chiuko Publishing<\/p>\n<\/li>\n<li>\n<p>Fan Chun-chi, <em>Hollowing and Relief II<\/em>, Yu Lu Culture<\/p>\n<\/li>\n<li>\n<p>Huang Tsung-hui and Huang Tsung-chieh, <em>Even If It Has No Face<\/em>, Rye Field Publishing<\/p>\n<\/li>\n<li>\n<p>Yang Tu, <em>The Unburned Books<\/em>, Linking Publishing<\/p>\n<\/li>\n<li>\n<p>Liu Tzu-chao, <em>The Lost Satellite<\/em>, Eslite New Classics<\/p>\n<\/li>\n<li>\n<p>Chen Yu-hsuan, <em>Those Fierce Silences<\/em>, Locus Publishing<\/p>\n<\/li>\n<li>\n<p>Chen Szu-hung, <em>The Good Person Upstairs<\/em>, Mirror Fiction<\/p>\n<\/li>\n<li>\n<p>Yang Fu-min, <em>Peace Throughout the Land<\/em>, Crown Publishing<\/p>\n<\/li>\n<li>\n<p>Chu Hsi-ning and Liu Mu-sha, <em>Not Love Letters<\/em>, INK<\/p>\n<\/li>\n<li>\n<p>Lo Chih-cheng, <em>The Desolate Candy Store<\/em>, Unitas Publishing<\/p>\n<\/li>\n<li>\n<p>Kuo Chiang-sheng, <em>If Literature Were Easy, We Wouldn't Have It So Hard<\/em>, Ecus Publishing<\/p>\n<\/li>\n<li>\n<p>Lin Kai-lun, <em>A Guide to Fake Fishmongers<\/em>, Ballad Publishing<\/p>\n<\/li>\n<li>\n<p>Chen Po-yu, <em>The Scientist<\/em>, China Times Publishing<\/p>\n<\/li>\n<li>\n<p>Yang Chia-hsien, ed., <em>When We Return to Our Desks<\/em>, Azure Culture<\/p>\n<\/li>\n<\/ol>\n<h1>BabyClassPuppies<\/h1>", "zt": "【2022暑假課外閱讀書目】"}, {"id": "f1656247752", "file": "2022-06-26-f1656247752", "date": "2022-06-26", "title": "A Good Listen: 49 Minutes Well Spent", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Current Affairs", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray reflects on three decades of jobs, why private-school teaching feels the most precarious, and recommends a podcast about life after early retirement.", "len": 353, "body": "<p>A good listen to share: it takes 49 minutes<\/p>\n<p>Over more than thirty years in the workforce, I have been a summer assembly worker in an electronics factory, a part-time attendant at a bowling alley, a visa-filing runner at a travel agency, a telephone surveyor, a book reviewer for Books.com.tw, and an author of exam prep books; and in full-time roles a market survey researcher, a clerk in the signal corps, an industry analyst for listed companies, an internet marketing project member, a leisure venue manager, a meeting-space rental salesperson, a marketing campaign manager, an information systems sales promoter, a travel agency manager, an international tour leader, a secretary-general of an NGO, and a teacher at a private vocational school. Looking back on it all in a jumble, the job in which I have felt the greatest sense of crisis is that of private-school teacher!<\/p>\n<p>So at the end of each semester, when students graduate, besides helping them enter the workplace, I also think about my own future, turning that sense of crisis into motivation and help. I review my own efforts and direction, confirm the relationship between organisations and myself, and of course compare my expectations and dreams to see how far they are from my goals, letting them collide for real with my sense of crisis.<\/p>\n<p>Today I would like to recommend that you join me in facing and thinking about the future from a different angle. This Dr. Hsieh, a graduate of the University of Maryland, a famous American university, devoted himself to the restaurant business after retirement and has observed the many possibilities for role changes among people in middle and later age. For Dr. Hsieh, his public-service pension was a major asset, but the situation of losing a work position too early gave me, who also feels a deep sense of crisis, a chance to think carefully about how to respond to changes that may come.<\/p>\n<p>If you have thoughts after listening, I would be glad to hear them. If it helps your family or friends, you can also chat with them about what they think.<\/p>\n<h1>LittlePuppyOnTheSwingAgain<\/h1>\n<h1>SeniorsNeverClosedInTheComments<\/h1>", "zt": "好聽分享-所需時間49mins"}, {"id": "f1656069181", "file": "2022-06-24-f1656069181", "date": "2022-06-24", "title": "Worth Sharing: 12 Minutes 44 Seconds", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A video sent by my kid made me tear up at lunch. Sam shares four simple principles for a happy life.", "len": 234, "body": "<p>Worth sharing: 12 minutes 44 seconds<\/p>\n<p>In the middle of a busy day, A-Gou, who was doing an assignment for an online class, sent me a link. I had no time to watch it, so I saved it.<\/p>\n<p>At lunchtime I watched it while eating, and ended up eating my rice with tears.<\/p>\n<p>The star of the video, Sam, uses a positive view of life to describe things that are not easy, especially to people who complain all day and are always comparing education, wealth, position and even looks with others. Perhaps it is human nature, and all those achievements matter, but what matters most?<\/p>\n<p>Read this first, then watch the video, then Google Sam. It is the weekend! Let's bravely take on life's challenges and enjoy it together.<\/p>\n<p>Sam shared the philosophy of his happy life with us. Here are brief notes:<\/p>\n<ol>\n<li>Be OK with what you ultimately can't do, because there is so much you can do.<\/li>\n<\/ol>\n<p>Be Ok with what you ultimately can't do, because there is so much you Can do.<\/p>\n<ol start=\"2\">\n<li>Surround yourself with people you want to be around.<\/li>\n<\/ol>\n<p>Surround yourself with people you want to be around.<\/p>\n<ol start=\"3\">\n<li>Keep moving forward.<\/li>\n<\/ol>\n<p>Keep moving forward.<\/p>\n<ol start=\"4\">\n<li>Never miss a party if you can help it.<\/li>\n<\/ol>\n<p>Never miss a party if you can help it.<\/p>\n<p>The link is in the comments. If it moves you as it did me, save it.<\/p>\n<h1>ChangingToBabyClassPuppyTakesTheStage<\/h1>", "zt": "好看分享-時間12m44s"}, {"id": "f1655636904", "file": "2022-06-19-f1655636904", "date": "2022-06-19", "title": "Good Listening Share No. 4: 83 Minutes", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Travel Industry & Transport", "det": "Airlines & Railways", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray shares a podcast about a travel agency thriving during the pandemic, and muses on luxury train trips versus his own everyday local-market dinners.", "len": 279, "body": "<p>Good Listening Share No. 4: 83 minutes<\/p>\n<p>[What are you having for dinner? Japanese? Western? Chinese? Taiwanese?]<\/p>\n<p>During the pandemic, one travel agency said in an interview that it seems to be getting busier and busier, so busy that it has opened a branch. If you are curious what kind of travel agency can keep its business going at a time like this, click the link in the comments and listen. I'd love to know what you think after listening.<\/p>\n<p>Not long ago my family wanted to join a trip on the Ming Ri Hao train. When I checked the website and saw the price of three days and two nights, it was quite different from what I knew of domestic rail tour products. If you really had the means, you would want to experience that top-tier design, with exquisite meals and local travel flavour.<\/p>\n<p>But as dinner time approached, I was still typing and wondering how, with prices soaring, to once again reluctantly weigh the bento shops, set-meal restaurants and little noodle stalls we had already eaten at again and again, or go to the evening market to see whether today's three bunches of vegetables for NT$50 and a plate of cooked dishes for NT$100 could take care of the family's meal. I recalled every stall in the Nanshijiao evening market in Zhonghe, Guting Market, the Sanhe morning market and night market in Sanchong, Muxin Market in Muzha, Zhongxing Market in Xindian, Ji'an evening market, the Zhixue student street, and the Linkou Wenyi, Wener and Fude evening markets. For me, perhaps that is my local-style travel at the end of each week or each working day.<\/p>\n<h1>LittleClassLittleDog<\/h1>\n<h1>GoodListeningLinkInComments<\/h1>", "zt": "好聽分享4-所需時間83mins"}, {"id": "f1655535373", "file": "2022-06-18-f1655535373", "date": "2022-06-18", "title": "Good Listening Share No. 3: 28 Minutes", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "Work & Moving", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A podcast made me look back at skills I picked up easily but later had to relearn. Mine was holding a pen correctly, which took me six months.", "len": 343, "body": "<p>Good
