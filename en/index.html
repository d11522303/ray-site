 Listening Share No. 3: 28 Minutes<\/p>\n<p>[The Trap That Keeps Life Stuck]<\/p>\n<p>Some skills come naturally, for example: eating.<\/p>\n<p>But using the tools for eating well is not so simple.<\/p>\n<p>Can everyone hold chopsticks properly?<\/p>\n<p>On the way home from working late the night before last, I listened to a thought-provoking podcast (link in the comments), and I really thought back: what are the things I picked up easily and made a habit of, but later had to spend a great deal of effort and time rebuilding?<\/p>\n<p>There are far too many. Let me give a funny example of my own.<\/p>\n<p>[Learning to Hold a Pen Correctly]<\/p>\n<p>Because I learned to hold chopsticks correctly first, from childhood I treated the pen like a chopstick, resting it on my ring finger to write. I wrote that way all the way from kindergarten through my military service to my job at China Credit Information Service. My colleagues there were all highly educated, which stirred in me the idea of taking a graduate school entrance exam while working, and after work I went to master's prep classes on Nanyang Street. Because I had to write exam papers, and my grip was wrong, my fingers hurt after writing a lot and I couldn't write fast. So I decided then and there to retrain how I held the pen.<\/p>\n<p>It took me nearly six months to relearn how to hold a pen and write, going from ugly handwriting back to neat handwriting, and I could quickly write a lot on open-ended graduate exam papers without strain. In exam season I took the entrance exams for five or six business graduate schools. My nice handwriting didn't get me into National Chengchi University or National Taiwan University, but to this day I'm glad I can write the correct way.<\/p>\n<p>And later I used this same approach of tearing down and starting over to fix quite a few boring little things that bothered me. They didn't help my life much either, but it always feels more comfortable.<\/p>\n<h1>TheLittleClassDogIsBackAgain<\/h1>\n<h1>GrownUpsLearnPodcastsSoListenSeriously<\/h1>\n<h1>LinkInTheComments<\/h1>", "zt": "好聽分享3-所需時間28mins"}, {"id": "f1654923688", "file": "2022-06-11-f1654923688", "date": "2022-06-11", "title": "The Platform to Protect Taiwan's Education Is Run by Professor Tai Po-Fen of FJU Sociology, and as an Alumnus…", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "Admissions & Falling Birth Rate", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "As a Fu Jen sociology alumnus working at a private vocational school, I reflect on private-school finances, student-teacher ratios and enrolment rates.", "len": 377, "body": "<p>The Platform to Protect Taiwan's Education is a platform that Professor Tai Po-Fen of the Department of Sociology at Fu Jen Catholic University works hard on. As an alumnus of Fu Jen's sociology department who is also an employee of a private vocational school, I find myself in a conflicting role.<\/p>\n<p>For someone who works at a school, of course the financial security of a private school matters most (so this chart is ranked by the rightmost column, from the green, blue and cyan zones through yellow to the red-light zone). Personally, I also feel that for students, what matters most is having teachers who can teach with peace of mind.<\/p>\n<p>In addition, the student-teacher ratio and enrolment rate that the Ministry of Education often publishes can be adjusted and controlled, so they are only for reference. Whether students will still have an alma mater in the future depends, for a private school, on whether it has the money to keep operating.<\/p>\n<p>:::Student-teacher ratio:::<\/p>\n<p>Just look at the colours and you can see that a school's student-teacher ratio and its financial security are inversely related. In short, the more students per class on average, the more money the school naturally makes and the healthier its finances. So judging teaching quality by the student-teacher ratio is not necessarily accurate. The theory that teaching quality requires teachers not to teach too many students probably only applies in the environment of public universities.<\/p>\n<p>:::Enrolment rate:::<\/p>\n<p>The enrolment rate is even more open to debate. A private school that has been reinvested in by a business group may enrol only a hundred or so students across the whole school, with all its teachers on project-based contracts, and of course the numbers look good.<\/p>\n<p>:::Financial security:::<\/p>\n<p>The Ministry of Education is very conservative about this information and rarely mentions it. The platform openly hopes the figures will be announced as soon as possible. We who draw private-school salaries only know to work hard at recruiting and retaining students, keep teaching quality up, and provide internships and lifelong service to graduates. Only then does the school's finances have a moment of security, and it is only a moment.<\/p>\n<p>Image source: The link to the Platform to Protect Taiwan's Education is in the comments<\/p>", "zt": "守護台灣教育平台是輔大社會系戴伯芬老師在努力的平臺，身為…"}, {"id": "f1652526069", "file": "2022-05-14-f1652526069", "date": "2022-05-14", "title": "Did I Forget, or Did I Remember Too Many Other Things?", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "School & Military Service", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A friend mentions a junior-high graduation trip I have no memory of, and I recall instead the caning and hard years of those school days.", "len": 286, "body": "<p>Did I forget? Or did I remember too many other things?<\/p>\n<p>Yesterday an old friend brought up something I have absolutely no memory of: the Yonghe Junior High round-the-island graduation trip. It was the era when junior high schools had hair regulations. I opened the graduation yearbook I had not looked at closely in more than thirty years, and the small photos in it proved that the graduation trip really did happen.<\/p>\n<p>I truly have no memory of the last two years of junior high.<\/p>\n<p>All I remember is that I changed classes three times, had 150 different classmates, and went from the B-track class to the A+ class.<\/p>\n<p>All I remember is that when I went back to school after the entrance exams to get my results, the teacher only said to me: \"Ruey-Feng Chen, you got into the Affiliated Senior High School of National Taiwan Normal University with the lowest English score in the whole school.\"<\/p>\n<p>All I remember is<\/p>\n<p>for nearly 1,000 days<\/p>\n<p>the teacher's cane made a sound in the air<\/p>\n<p>falling lightly on my left palm like winter rain<\/p>\n<p>I did not close my eyes<\/p>\n<p>I just watched with open eyes as the burning red lines on my hand<\/p>\n<p>built up one by one into a patch of red<\/p>\n<p>I made no sound<\/p>\n<p>because wisps of pain, one after another, had turned into warmth<\/p>\n<p>and I quietly turned fear into helplessness and let it sink to the bottom of my heart<\/p>\n<p>I kept my eyes open<\/p>\n<p>and looked at my left palm, where the constant bruising of those years is long gone<\/p>\n<p>but when I think of the fright of having nowhere to escape back then, I still shudder<\/p>\n<h1>IShakeWhileTypingThis<\/h1>\n<h1>ActuallyMyBottomRemembersToo<\/h1>", "zt": "是忘記了？還是記了太多別的事？"}, {"id": "f1650006305", "file": "2022-04-15-f1650006305", "date": "2022-04-15", "title": "Good Listening Share No. 2: 49 Minutes", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Industry News", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray recommends a podcast interview with a travel agency general manager about when overseas travel will resume, and reflects on the pandemic, travel and cruise recovery.", "len": 413, "body": "<p>Good Listening Share No. 2: 49 minutes<\/p>\n<p>Taiwan's local COVID cases passed a thousand in April, so I'm making a note of it.<\/p>\n<p>The photo is also from today: students from the HWU Department of Travel Management being interviewed on site for jobs at Starlux Airlines' ground services.<\/p>\n<p>So I still want to share some information about when we might travel abroad again. I recommend the \"King's Travel Ears\" series from the Pan-Travel Guests Club podcast, in which General Manager Lin of Jiguang Travel is interviewed and shares his latest observations with unique insight. After listening, I really felt how admirable a professional manager who can run a travel agency is, both in professional ability and in the way he speaks and explains things.<\/p>\n<p>First, a disclaimer: we must not make any value judgement about catching the virus, and we must never use numbers to label the people or the region of a place as something bad, because a virus does not choose its people. Where there is a host, it infects; where there is space, it survives and spreads. For ourselves, the only thing to do is look after our own health and immunity, to improve our chances of staying well, and so reduce our social responsibility for spreading it after infection.<\/p>\n<p>In fact, I have been browsing flights abroad online lately. I just look around and don't dare book. But then I see classmates and friends in Europe, the US and Japan, who have long since reopened and are travelling everywhere, like a parallel universe, and it is hard to bear. In class I also share with students that since 2022, the share prices of major global cruise companies such as RCCI and CCL have already rebounded, and passenger numbers and bookings are gradually returning to pre-pandemic levels. So what I care about most is when we can travel abroad and return home without quarantine! My personal hope is that as long as vaccination is effective in real-world prevention and in confidence about disease control, we can open the borders and stop locking ourselves in. I hope that day comes soon, whether July or September, the sooner the better.<\/p>\n<p>So what does General Manager Domingo Lin of Jiguang Travel think? Working on the front line, he gives us his most exclusive observations and insights, and shares what he expects and what he is preparing and doing now. If you want to travel abroad, give it a listen.<\/p>\n<h1>HWUTravelManagementStarluxInterviews<\/h1>\n<h1>DoYouLikeLearningByListening<\/h1>\n<h1>ILoveItAndWillShareMoreOften<\/h1>\n<h1>PodcastLinkInComments<\/h1>", "zt": "好聽分享2-所需時間49mins"}, {"id": "f1649910122", "file": "2022-04-14-f1649910122", "date": "2022-04-14", "title": "A Great Listen, Part 1: 46 Minutes", "cat": "Morning Reading", "cats": ["Morning Reading"], "sub": "Book Notes", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The most moving radio programme I have heard lately, about a man whose integrity and small daily commitments carried him from hotel doorman to CEO.", "len": 224, "body": "<p>A Great Listen, Part 1: 46 Minutes<\/p>\n<p>This is the most moving broadcast I have listened to recently.<\/p>\n<p>It made me feel that becoming a \"complete\" person starts with persevering in small things.<\/p>\n<p>When Mr. Lin first went to the United States at about 19 or 20, he worked as a doorman at the famous Long Island hotel. Thanks to his knack for quickly getting to know people and finding common ground, and because he dealt with others so earnestly and honestly, he went with the same values from doorman to engineer, councilman, mayor and CEO of a multinational company, and so came to have a rich and positive life.<\/p>\n<p>To be honest, of course I envy that he had money and the chance to study, train and even work in the United States. But looking back, if I had been given the same opportunity, with my own abilities and personality, I could not have said many of the things he said when facing racial issues or challenges, let alone stood up and tried to take on responsibility.<\/p>\n<p>Life would have followed a different pattern, and the results might have been different too. Either way, I gained a great deal and am sharing it with friends here. If you can spare your ears, have a listen to this rewarding online interview.<\/p>\n<h1>DoYouLikeAbsorbingInformationOrKnowledgeByListening<\/h1>\n<h1>ILikeItAlotAndWillShareMoreInTheFuture<\/h1>\n<h1>PodcastLinkIsInTheComments<\/h1>", "zt": "好聽分享1-所需時間46mins"}, {"id": "f1640922094", "file": "2021-12-31-f1640922094", "date": "2021-12-31", "title": "2021 Was a Year of Gratitude", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Running & Exercise", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A year-end note of thanks to family, mentors, colleagues and students, and Ray's hopes for 2022: running daily, reading, writing and applying for a doctorate.", "len": 211, "body": "<p>2021 was a year of gratitude<\/p>\n<p>Thank you to my other half, who has accompanied me and put up with my unexplained moods all along<\/p>\n<p>Moved that heaven gave me a handsome son, whose self-discipline and effort have broadened his horizons<\/p>\n<p>Grateful to the senior mentors and superiors who have supported my career and brought me to a new stage<\/p>\n<p>Thankful for the colleagues who work hard alongside me and the thoughtful students<\/p>\n<p>And even more appreciative of every family member and friend: in every way, I can feel your support.<\/p>\n<p>2021 was a year of changing direction, adjusting my focus so that my viewpoint and my heart can be closer to myself. Years of interpersonal overload had suppressed my emotions and spirit. For 2022 I hope to keep running every day, to listen to and read books often, to work hard at starting to write, and to learn how to get along with people. I also hope to have a chance to be admitted to a doctoral programme in science and engineering to learn new things, hoping not only for a change but also for improvement.<\/p>\n<p>Finally, I wish every family member, friend, classmate, comrade, colleague and student clear skies and wishes fulfilled in 2022.<\/p>\n<h1>MayThePandemicRetreatAndTravelAbroadReturn<\/h1>\n<h1>StrongBodyAndEatAllTheFood<\/h1>\n<h1>WorkHardAndGetAGoodYearEndBonus<\/h1>\n<h1>FamilySafeAndParentsHealthy<\/h1>\n<h1>ThisIsMyVulgarWish<\/h1>", "zt": "2021年是感恩年"}, {"id": "f1640247537", "file": "2021-12-23-f1640247537", "date": "2021-12-23", "title": "-- When You See the World Through Tinted Glasses, the World Becomes the Colour of Your Lenses --", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Industry News", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Asia is racing to develop cruise tourism, yet Taiwan's first cruise tours are being stigmatised. A plea to support the cruise economy and stop the smearing.", "len": 325, "body": "<p>-- When You See the World Through Tinted Glasses, the World Becomes the Colour of Your Lenses --<\/p>\n<p>All of Asia is working hard to develop cruise tourism, and China has recently built giant cruise ships of its own, waiting to seize a huge share of the global cruise industry's growth. Yet when Taiwan's travel industry merely organises a cruise group tour, some people pick up a high-minded magnifying glass and scrutinise every shortcoming. This uses the pandemic as an excuse to bring the cruise industry to a standstill, and may even cost us the chance to develop during the global recovery.<\/p>\n<p>Cruise tourism is a travel industry well suited to Taiwan's circumstances. There is training, there is expertise, and there are employees and companies who make a living from it. It gives the industry a chance to move towards high-quality, refined service through professionalism, and a chance for the outlying islands to add infrastructure and add value to all kinds of products and services. Yet at a time when every branch of tourism needs encouragement and support, a self-righteous and inappropriate label has been stuck on it.<\/p>\n<p>It is like Taiwan's dot-com portal Yam (蕃薯藤) (anyone heard of it? It actually still exists!). At the end of the twentieth century it led the search engine market across Taiwan and even the Chinese-speaking world, with a great opportunity to commercialise and scale up, and even to influence the Chinese-language internet. But because its founder insisted on a public-interest mission, it missed its big chance to enter the online world, and in the end became a bubble that never quite burst.<\/p>\n<p>Every trade and profession, from the mountains to the courts, works hard and shares in the rain and dew. This is the effort of the cruise travel industry under the pandemic, and its call for government policy support.<\/p>\n<p>Please support the campaign promoted by Professor Chiang-Chuan Lu: \"Fight for the Cruise Economy, Don't Stigmatise It\".<\/p>", "zt": "--用有色眼鏡看世界時，世界就變成你眼鏡上的顏色--"}, {"id": "f1637123255", "file": "2021-11-17-f1637123255", "date": "2021-11-17", "title": "A Bitter Memory of Teaching at Fanji Senior High School", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Looking back on a year of weekly teaching support at Fanji, its bright students, and the falling birth rate that now threatens schools of every kind.", "len": 278, "body": "<p>What a wretched industry!<\/p>\n<p>This time last year, I was still going to Fanji every week to support a full day of teaching activities, and it is a very good memory. After finishing four morning classes, I could follow the teachers to the main hall to get the group meal. Students and teachers alike ate four dishes and a soup, and I would take my own reusable bowl, serve myself, and sit in the quiet hall eating with the teachers and staff. I did not have to go out looking for food, and I could finish quickly and rest before the consecutive afternoon classes.<\/p>\n<p>The students were chatty too. Everyone knew I was a teacher from Hsing Wu University, though in fact they were not even taking the technical-college joint entrance exam; they had all finished the General Scholastic Ability Test and were preparing for regular universities. Perhaps because they knew I was there out of bitterness, they were even more considerate and asked about the plight of the education industry. The students felt strongly about the career prospects of university departments and the falling birth rate affecting enrolment. A classmate even joked that across the street Wende Girls' High School has hardly any students left, and if a school is going to close, Wende would go first.<\/p>\n<p>In fact, when I taught the senior-year tourism and travel practice course at Fanji last year, the students were all very motivated, and the Fanji teachers worked hard at teaching. The students did well on the scholastic ability test, and most could get into national universities. The school is also conveniently located on the Neihu MRT line.<\/p>\n<p>And the result...<\/p>", "zt": "去年此時還每週要去方濟支援一整天的教學活動，是個很好的回…"}, {"id": "f1634307275", "file": "2021-10-15-f1634307275", "date": "2021-10-15", "title": "Nothing in Excess (Delphic Maxims)", "cat": "Personal Finance", "cats": ["Personal Finance"], "sub": "Money Management", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Prompted by a new market report from his former employer CCIS, Ray recalls his gruelling 1997 job as a research assistant, with its 996-style hours and hair loss.", "len": 503, "body": "<p>Nothing in Excess (Delphic Maxims)<\/p>\n<p>My old employer, the China Credit Information Service (CCIS), recently published its latest market survey report!<\/p>\n<p>Do you know which three companies had the highest restaurant revenues in Taiwan in 2020, under the pandemic? How has the pandemic changed the food-service landscape, and how will it develop in the future? The report is in the comments, if you're interested in reading it.<\/p>\n<p>Every year, CCIS compiles the Top 5000 Corporations in Taiwan from various objective sources. In 1997 I was still an assistant researcher in CCIS's marketing department, responsible for writing the report each year, and also for reorganising this market-valuable data to help companies with market analysis. The companies I helped write listing proposals for included Sakura Construction, Chingyun Electronics and Zuanchuan Enterprise; those I helped with capital increases after listing included Taiwan Fengyuan (Tai Feng), Tuntex and Evergreen Enterprise (then the operator of the airport MRT). Many of these companies have since been delisted or disappeared. I still remember going to their headquarters to report or negotiate, and the looks those companies gave a market research firm. But isn't work really just about everyone earning a meal?<\/p>\n<p>The most memorable project, as I recall, was when the Nomura Research Institute commissioned CCIS to write a report on the industrial impact of Taiwan joining the GATT (now the WTO). The budget was so small that CCIS could only assign a new recruit to write it, otherwise the cost would not have been covered. But the interviews were so interesting that I gave it my all to study every kind of news report and research. Much of the academic literature was so fragmentary as to be useless. For this report I shuttled between the office, the National Central Library and the World Trade Center library, and it took at least three months, day and night, to finish the Chinese version. Nomura Research Institute and the Interchange Association, Japan then translated it into Japanese and published it in Japan as an industry reference. I still have, on hand, the blood and sweat of that work, typed word by word.<\/p>\n<p>When I worked at CCIS in 1997, Taipei still had no MRT system. I rented a place on Sanhe Road in Sanchong, and every day rode with tens of thousands of other scooter commuters across Taipei Bridge to work in Songshan District. I started at 9 a.m. and finished at 9 p.m., at least six days a week, the same as the \"996\" work schedule that has become a fashionable term in China today. It was truly a realistic experience of a young Taiwanese graduate \"selling their liver\" for work. With low pay and long hours, I don't remember how much money I made! And I left no memories of life from that time either!<\/p>\n<p>The harshest reality is that in those two years at CCIS, I began losing my hair and slowly lost the full head of hair of my youth, which was hardly worth the trade.<\/p>\n<h1>996WorkHours<\/h1>\n<h1>CCIS<\/h1>", "zt": "凡事勿過度Nothing in Excess (Delp…"}, {"id": "f1632811670", "file": "2021-09-28-f1632811670", "date": "2021-09-28", "title": "[Funny Moments from My Days as a Class Helper]", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "Childhood", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Memories of attending the most crowded primary school in the world, my first TV appearance, and one very embarrassing morning as a science class helper.", "len": 392, "body": "<p>[Funny Moments from My Days as a Class Helper]<\/p>\n<p>When I attended Houpu Elementary School in Banqiao, it was the most crowded primary school in the world. Across its six grades there were 195 classes and more than 11,500 pupils. The flag-raising ceremony rotated by grade, and the lower and middle grades could only attend half-day classes because there weren't enough classrooms. The small, sandy playground couldn't hold the whole school, so for flag raising each class stood in the corridor in front of its own classroom and sang the national anthem. At the end of the day, the walking groups heading home were like long human dragons, and it took a long time to get the whole school dispersed.<\/p>\n<p>I still remember one year when the news anchor Chou Chuan from CTV came to interview students. The school picked a few pupils who wouldn't say anything out of line. I remember telling the camera and \"Auntie Chou Chuan\": \"Lots of us need the toilet during break, and everybody has to queue to pee. If we don't make it in time, we have to go back to the classroom.\" That clip was later broadcast on CTV's seven o'clock evening news. It was my media debut.<\/p>\n<p>In fact, in fifth and sixth grade I was the science class helper. Every morning during self-study I had to read out the textbook text or test questions for classmates to write down or be tested on. One morning I needed the toilet badly but had to read out the questions, and I didn't dare go. In the end I really couldn't hold it, and I peed right there on the platform. My trousers were soaked and there was a puddle on the floor.<\/p>\n<p>Afterwards I even fetched a bucket of water to the classroom and pretended to sprinkle the floor. I can't remember why classrooms back then were often sprinkled with water. Was it the heat? Was it all the dust? I smugly pretended to dilute my own pee...<\/p>\n<p>Forty years have passed, and as far as I'm concerned nothing has been diluted at all. If anything, I remember it even more clearly.<\/p>\n<p>Does that count as a funny moment of being a teacher? @Cherng has plenty of funny examples, and the link is in the comments. Go and have a good laugh!!<\/p>\n<h1>HappyTeachersDayToEveryTeacher<\/h1>\n<h1>SchoolToiletsMatter<\/h1>\n<h1>MaybeInAFewYearsOldMeWillLeakOnThePlatformAgain<\/h1>", "zt": "【我的小老師妙事】"}, {"id": "f1628815215", "file": "2021-08-13-f1628815215", "date": "2021-08-13", "title": "A Publisher Asked for a MICE Textbook During the Pandemic", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Other Certificates", "det": "Cruises & MICE", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A publisher unexpectedly invited me to write a MICE textbook in the middle of COVID-19, and a reminder about registering for the 2021 MICE professional certification exam.", "len": 262, "body": "<p>A few weeks ago, a publisher phoned the department to invite a manuscript, and to my surprise they wanted a textbook on MICE tourism. I casually asked the editor why they would publish about an industry that is currently badly affected during the pandemic. The editor could not answer and said it was the editor-in-chief's idea.<\/p>\n<p>Nothing has come of it since, but the plague of the century is still spreading, and the related national certification exams are still being held, oblivious to the suffering of the world. Should you sign up?<\/p>\n<p>If you have taken related courses and are interested in exhibition promotion, this is a qualification certified by the Bureau of Foreign Trade, Ministry of Economic Affairs. It is not very easy to pass, but you can give it a try! After all, you cannot go job hunting upon graduation with just a single university diploma and compete with the army of unemployed for fewer and fewer jobs.<\/p>\n<p>——————— The real point is below ———————<\/p>\n<p>The brochure for the 2021 (ROC year 110) Domestic Meeting and Exhibition Professional Certification Exam is now online. Please check and register on the website of the Taiwan Academy of Banking and Finance.<\/p>\n<p>Registration: June 11, 2021 (Fri) 10:00 to September 15 (Wed) 17:00<\/p>\n<p>Exam date: October 17, 2021 (Sun)<\/p>\n<p>Exam administration entrusted to: Testing Center, Taiwan Academy of Banking and Finance<\/p>\n<p>Contact phone: 02-3365-3666, press 1<\/p>\n<p>Service hours: Monday to Friday 9:00-17:30<\/p>\n<p>--&gt; For registration information, please click the link in the comments (external link to the Taiwan Academy of Banking and Finance website)<\/p>", "zt": "幾週前出版社打電話來系上邀書稿，嚇了一跳竟然是想出一本會…"}, {"id": "f1626936982", "file": "2021-07-22-f1626936982", "date": "2021-07-22", "title": "Thinking of Henan and My Study Trip There in 2014", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "China", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray recalls his 2014 study trip to Zhengzhou, Luoyang and Dengfeng, his family's roots by the Ying River, and the history of Yellow River floods as Henan suffers.", "len": 335, "body": "<p>Since the day before yesterday I have kept thinking about my 2014 study trip to Zhengzhou, Luoyang and Dengfeng in Henan. The ancestral tablets in my home bear the hall name \"Yingchuan\" (穎川), common among Hakka families, which means my family name probably originated from the banks of the Ying River shown at the bottom of the attached picture. I felt it on that trip, and now, in this great disaster, it is even more painful.<\/p>\n<p>There is not much news on Taiwan's television, and not much to read in the material from across the Strait. But it is very clear that at this very moment tens of thousands of families in these Henan cities cannot find their relatives, cannot find help, and cannot see the full picture.<\/p>\n<p>YouTube video: Disaster at the 4-kilometre-long Jingguang Road Tunnel in Zhengzhou<\/p>\n<p><a href=\"https://www.youtube.com/watch?v=b8Z7WOTSRko&amp;t=3s\">https://www.youtube.com/watch?v=b8Z7WOTSRko&amp;t=3s<\/a><\/p>\n<p>Zhengzhou and Luoyang in Henan lie in the Central Plains and were the capitals of many past Chinese dynasties, but because of the Yellow River's flooding over thousands of years, the land of these two ancient capitals sits lower than the riverbed. Especially in the summer flood season, when this heavy rain is added, the water simply has nowhere to go.<\/p>\n<p>Floods can be natural disasters or man-made. In 1938, during the Sino-Japanese War, the Nationalist army exploited the fact that the Yellow River bed is higher than the ground and chose, strategically, to use the force of nature to resist foreign invasion. It did win space and time as a buffer at that moment of the war, but there is much controversy over the lives of ordinary people and the impact on farming for the following years.<\/p>\n<p>Wikipedia: Huayuankou Dike Breach: <a href=\"https://zh.wikipedia.org/wiki/%E8%8A%B1%E5%9B%AD%E5%8F%A3%E5%86%B3%E5%A0%A4%E4%BA%8B%E4%BB%B6\">https://zh.wikipedia.org/wiki/%E8%8A%B1%E5%9B%AD%E5%8F%A3%E5%86%B3%E5%A0%A4%E4%BA%8B%E4%BB%B6<\/a><\/p>\n<p>Today, the people and events of World War II have long passed, but the Henan floods have struck again and the people are suffering. I do not much care about Foxconn's Zhengzhou plant; I only care that the fellow villagers I met on the 2014 study trip are all safe and well.<\/p>", "zt": "從前天起就一直想起2014年到河南鄭州、洛陽、登封見學的…"}, {"id": "f1620531169", "file": "2021-05-09-f1620531169", "date": "2021-05-09", "title": "Starting Over in the Teaching World, Approaching Fifty", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Everyday Notes", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Reflections on my work principles before and after becoming a teacher, and why I feel I must build my next ability as I approach fifty.", "len": 246, "body": "<p>Before I became a teacher, my work principle was that I must stay at any job for more than a year, and within the same job I should change units at least once a year to keep jumping out of my comfort zone. Besides, if I could take a side job alongside my full-time one (now called a \"slash career\"), I would try my best within my ability and time. Success or failure is judged by pay; heroes come from the young.<\/p>\n<p>After becoming a teacher, my previous work experience and years of labour service were all reset to zero. In the education environment, seniority and age order matter, so I started again. At work, how long you have been there is the basis, and how close you are to retirement is what gets talked about. What matters most is whether you get promoted, and the work is similar and repetitive year after year. As for the students I teach, I hear every year that they are worse than the year before (or perhaps I am teaching worse every year).<\/p>\n<p>So I have been trying to start again within the teaching environment. In 2021 I obtained the ministry-certified associate professor title, and my years of service will soon reach 15. I feel my teaching ability declines year by year, and both students and schools are nearly becoming history.<\/p>\n<p>Approaching fifty, I must build another ability, and only then will I have a chance to rise again.<\/p>", "zt": "在當老師之前，我給自己的工作原則是一份工作一定要做一年以…"}, {"id": "f1588484079", "file": "2020-05-03-f1588484079", "date": "2020-05-03", "title": "[OPEN CAMPUS]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The Department of Travel Management at Hsing Wu University opens its campus on Saturdays 9 and 16 May, 10 am to 12 noon; registration required.", "len": 204, "body": "<p>[OPEN CAMPUS]<\/p>\n<p>The Travel Management campus is open on Saturday 9 May and Saturday 16 May.<\/p>\n<p>※ Time: 10 am to 12 noon<\/p>\n<p>※ Location: Department of Travel Management, 3rd floor, Tourism and Hospitality Building, Hsing Wu University, Linkou District, New Taipei City<\/p>\n<p>Registration link ↓↓↓↓↓↓<\/p>\n<p><a href=\"https://forms.gle/gfZRU6CPWpimujEj7\">https://forms.gle/gfZRU6CPWpimujEj7<\/a><\/p>\n<p>※ Interested students and parents are all welcome to visit.<\/p>\n<p>※ Please register in advance so we can keep track of the number of visitors.<\/p>\n<p>※ Programme:<\/p>\n<p>09:50-10:00 Check-in (T306 Practice Travel Agency)<\/p>\n<p>10:10-10:50 Introduction to admission routes and faculty teaching<\/p>\n<p>10:50-11:10 Tour of the College of Tourism and Hospitality (teaching facilities on each floor)<\/p>\n<p>11:10-11:15 Tea break<\/p>\n<p>11:15-11:40 Tour of the men's and women's dormitories (optional)<\/p>\n<p>11:40-12:00 Refreshments and chat<\/p>\n<p>Flight attendant students and senior students will be on hand to show you around the campus at any time.<\/p>\n<p>Please fill in the registration form below, and a teacher and students will contact you!<\/p>\n<p>Phone: 02-26015310 ext. 2131<\/p>\n<p>Teacher Ruey-Feng Chen<\/p>\n<p>Teacher Ling-Yang Kong<\/p>\n<p>Getting here: If you drive, you can park on campus.<\/p>\n<p>Bus: take bus 936 from Yuanshan MRT station.<\/p>\n<p>During the pandemic: please register in advance and bring your own mask. Safety and cleaning measures are all in place.<\/p>\n<p>Registration link ↓↓↓↓↓↓<\/p>\n<p><a href=\"https://forms.gle/gfZRU6CPWpimujEj7\">https://forms.gle/gfZRU6CPWpimujEj7<\/a><\/p>", "zt": "【OPEN CAMPUS】"}, {"id": "f1586650279", "file": "2020-04-12-f1586650279", "date": "2020-04-12", "title": "The e-go Taiwan Tourist Bus Case Reflects the State of the Whole Travel Industry", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "North America", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The e-go bus's plight is not an isolated case but a symptom of Taiwan's travel industry under COVID-19, and Ray urges the government to support its families and firms.", "len": 315, "body": "<p>The situation of e-go Taiwan Tourist Bus is the reality of many travel and transport businesses. It is not an isolated case but a clear symptom of Taiwanese society, and the country must take it seriously and help. In fact, Taiwan's travel industry can no longer hold on. Most employees in these companies know that business has long since dropped to zero. Many drivers' and back-office workers' families depend on active travel and transport for their livelihood. Many business owners had already done their best in the past to fulfil their social responsibility, and now the country should give something back and help every hard-working family and business owner who is struggling to hold on.<\/p>\n<p>Why do the leaders of Japan, the United States and China always think twice when controlling the epidemic? It is precisely because of the economic damage: the unemployment that follows has an equally huge and far-reaching impact on society and the country. So a full shutdown of work and a closed border would put most businesses in crisis. The surge in unemployment in the United States since March 2020 will have an impact on this powerful country that no past economic analysis anticipated. The same reasoning explains why mainland China, once the epidemic was under control, hurried to resume work and reopen markets.<\/p>\n<p>Taiwan today is not a big-corporation, high-tax, high-welfare state, but an economy of small and medium-sized enterprises in foreign trade and services. Because the epidemic has been well controlled, most industries are still working hard to hold on, but the plight of the travel industry cannot be ignored.<\/p>\n<p>The vitality of Taiwan's small and medium-sized service businesses is like the immune cells in the body of the country. I hope even more that the government and its policies will give something back, so that the whole nation has a chance to regain a healthy society.<\/p>\n<h1>TheDailyAfternoonCaseAnalysisIsImportant<\/h1>\n<h1>TheLivelihoodOfGrassrootsTravelIndustryWorkersIsMoreImportant<\/h1>", "zt": "e-go台灣觀光巴士是很多旅運產業的現狀，這不是個案，是…"}, {"id": "f1582589795", "file": "2020-02-25-f1582589795", "date": "2020-02-25", "title": "Have you seen the 2016 Oscar-nominated film Hidden Fi...", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Films & Books", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Remembering Katherine Johnson, the real-life heroine of Hidden Figures, who passed away at 101, and a reminder to resist prejudice.", "len": 140, "body": "<p>Have you seen the 2016 Oscar-nominated film Hidden Figures?<\/p>\n<p>The real-world heroine, Katherine Johnson, passed away yesterday, 24 February, at the age of 101.<\/p>\n<p>Hidden Figures is one of the most touching films I have seen in recent years, and it keeps reminding me that, as human beings, we should not hold discrimination or prejudice over nationality, race, skin colour, gender or language.<\/p>\n<p>Even though it is everywhere in Taiwan, where I live!!<\/p>\n<p>Have you seen the \"Hidden Figures\", the best Oscar film in 2016?<\/p>\n<p>The real-world heroine Catherine G. Johnson passed away yesterday at the age of 101.<\/p>\n<p>Hidden Figures is one of the most touching films I've seen in recent years, and I keep reminding myself that as human beings, we should not have discrimination and prejudice on nations, race, color, gender, and language.<\/p>\n<p>RIP. Katherine G. J.<\/p>", "zt": "有看過2016的奧斯卡最佳影片關鍵少數Hidden Fi…"}, {"id": "f1569283636", "file": "2019-09-24-f1569283636", "date": "2019-09-24", "title": "The Guardian's Real Reporting on Thomas Cook", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Travel Industry & Transport", "det": "Travel Agencies", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Links to The Guardian and Business Times coverage of Thomas Cook's collapse, and a note on what the reports do and do not show about its causes.", "len": 171, "body": "<p>The Guardian's real reporting<\/p>\n<p><a href=\"https://www.theguardian.com/business/2019/sep/22/thomas-cook-in-last-ditch-talks-to-avoid-collapse\">https://www.theguardian.com/business/2019/sep/22/thomas-cook-in-last-ditch-talks-to-avoid-collapse<\/a><\/p>\n<p>Reported by Singapore's Business Times<\/p>\n<p><a href=\"https://www.businesstimes.com.sg/consumer/top-shareholder-fosun-disappointed-over-thomas-cook-collapse\">https://www.businesstimes.com.sg/consumer/top-shareholder-fosun-disappointed-over-thomas-cook-collapse<\/a><\/p>\n<p>The main cause of Thomas Cook's (1841-2019) bankruptcy was debt, and the immediate cause was its rejection of an investment plan from the Chinese giant Fosun. But whether the rise of independent travel and online booking, Brexit, global warming and so on played a part is actually not something you can tell from these reports......<\/p>\n<p>---------I am a divider-------------<\/p>\n<p>Below is the text from the United Daily News<\/p>\n<p>According to The Guardian, Thomas Cook took on a large amount of debt when it acquired other travel operators in 2007. On top of that, the rise of independent travel and the popularity of booking tickets and reservations online in recent years have seriously tested the traditional travel agency business model. Heat waves in Europe over the past two years have affected the number of trips, and Brexit has weakened the pound's purchasing power and led Britons to travel abroad less, which are also among the reasons that crushed Thomas Cook.<\/p>\n<p><a href=\"https://udn.com/news/story/6811/4064529\">https://udn.com/news/story/6811/4064529<\/a><\/p>", "zt": "英國衛報真實報導"}, {"id": "f1560918895", "file": "2019-06-19-f1560918895", "date": "2019-06-19", "title": "@[100002736346111:2048:巫佩君] ...", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Overseas Study Tours", "det": "Cross-Strait & Southeast Asia", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A Department of Travel Management student who loves on-site guiding appeared on TV news while working at a local tourist factory in Linkou.", "len": 99, "body": "<p>@[100002736346111:2048:巫佩君] You're on the TV news!<\/p>\n<p>The lovely, confident guide in the picture is a third-year student in the Department of Travel Management at Hsing Wu University, @[100002736346111:2048:巫佩君]. She loves on-site service and guided tours. In 2018 she did a two-month summer placement at the Lingling Circus in Xiamen, and with her clear speaking voice she was even featured in a special report on Xiamen TV.<\/p>\n<p>This year she chose to work at a local tourist factory in Linkou, near Hsing Wu, hoping to share her passion with all the children.<\/p>\n<p>Students like this are truly wonderful!<\/p>\n<h1>HWUTravelManagement<\/h1>\n<p><a href=\"https://www.ettoday.net/news/20190618/1469962.htm?fbclid=IwAR3l3v6aGQ3xizEYxnDquUURBX17pk70wwR3cMXzHEa8p6OsawMu4kV5pow\">https://www.ettoday.net/news/20190618/1469962.htm?fbclid=IwAR3l3v6aGQ3xizEYxnDquUURBX17pk70wwR3cMXzHEa8p6OsawMu4kV5pow<\/a><\/p>", "zt": "@[100002736346111:2048:巫佩君] …"}, {"id": "f1558429210", "file": "2019-05-21-f1558429210", "date": "2019-05-21", "title": "10-Day Self-Drive Tour of Northern Xinjiang: China's Duku Highway (Last Round of Sign-ups Until 5/26)", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "China", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Details of a 10-day self-drive tour along China's Duku Highway in northern Xinjiang, May 30 to June 9, 2019, with prices, vehicles and contacts.", "len": 212, "body": "<p>10-Day Self-Drive Tour of Northern Xinjiang: China's Duku Highway (last round of sign-ups until 5/26)<\/p>\n<p>2019/5/30-6/9<\/p>\n<p>Suggested flights: China Southern Airlines, outbound CE640, return CE639<\/p>\n<p>Costs:<\/p>\n<p>➤Round-trip airfare to and from Urumqi is booked by yourself, about NT$30,038. You bear the cost of the main transport yourself; travel insurance for the flight is inconvenient to arrange.<\/p>\n<p>➤Tour fee: three guests per car (NT$58,400) per person (three guests plus one professional driver), tax included. (Children NT$36,466 per person, no extra bed, otherwise the same terms as adults. Hotel breakfast charges, if any, are at your own expense; children aged five by arrangement.)<\/p>\n<p>➤Four guests per car (NT$66,240) per person (four guests plus one professional driver), tax included. (Children NT$31,900 per person, no extra bed, otherwise the same terms as adults. Hotel breakfast charges, if any, are at your own expense; children aged five by arrangement.)<\/p>\n<p>➤Includes meals, accommodation, admission tickets and performance fees<\/p>\n<p>➤Overseas personal accident insurance plus vehicle passenger accident insurance (NT$500,000)<\/p>\n<p>★All amounts above are in New Taiwan dollars<\/p>\n<p>Vehicles: SUVs (Nissan X-Trail, Honda CR-V, Toyota RAV4), with rental fees of 600 and 650 per day respectively; Toyota Prado at 1,000 per day<\/p>\n<p>Organiser: Zouba.com (走吧网)<\/p>\n<p>Taiwan contact: Ku Shu-Jen, 092001072<\/p>\n<p>Commissioning company: Changling Co., Ltd., Hualien Branch<\/p>\n<p>Real-life footage:<\/p>\n<p><a href=\"https://www.youtube.com/watch?time_continue=18&amp;v=VeFQecz66ZI\">https://www.youtube.com/watch?time_continue=18&amp;v=VeFQecz66ZI<\/a><\/p>", "zt": "北疆風情自駕十日遊~中國獨庫公路（最後一波報名至5/26…"}, {"id": "f1558259954", "file": "2019-05-19-f1558259954", "date": "2019-05-19", "title": "[Junior High Comprehensive Assessment]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Looking at this year's Chinese exam for the junior high assessment, Ray doubts students can read and answer 48 long, complex questions in 70 minutes.", "len": 358, "body": "<p>[Junior High Comprehensive Assessment]<\/p>\n<p>With a junior high student at home, even weekends are spent looking at exam questions as a way to \"rest\".<\/p>\n<p>I wonder how many parents try to work through their children's questions themselves, then compare them with the reading and writing ability of the college students I meet in my own classes. I feel it keenly.<\/p>\n<p>Attached is the Chinese exam that just came out for the junior high comprehensive assessment. The single subject runs to 13 pages. Reading each question closely, and considering the length of the multi-part question sets, I really doubt how many students can finish 48 questions in 70 minutes. That is only about a minute and a half per question, including filling in the answer card. They must also fully read and think through such lengthy passages, and the answers are just as similar-looking and complicated, expecting students to pick out the intricate shades of meaning in Chinese.<\/p>\n<p>Take the first question. It is actually a combination of 4 small questions, as follows:<\/p>\n<p>\"'Taotie' is a monster of ancient times. You can't find it in a field guide or at the zoo. Like the dragon and the phoenix, it is an imaginary animal. □ it exists in the culture, □□ it is vivid and lifelike, □□ it has a distinct visual image, □ it breeds rich symbolic meanings.\" Based on the context, which of the following fills in the blanks, in order, most appropriately?<\/p>\n<p>(A) although / unexpectedly / apart from / yet (B) but / however / merely / also<\/p>\n<p>(C) is / still / actually / and (D) only / but yet / not only / also<\/p>\n<p>Can any mum or dad get this one right in the nervous minute and a half after receiving the paper?<\/p>\n<p>In a world where reading trends are TikTok's 15 seconds and Twitter's 140 characters, I feel the Chinese exam doesn't show a clear ability to discriminate Chinese skills. It seems more like a stage for the question-setter to show off their command of language, and it even feels as if they enjoy stumping 15-year-olds in Taiwan.<\/p>\n<h1>MyPostHasTooManyWordsStudentsWontReadIt<\/h1>\n<h1>TheBestWordCountForFacebookIsZero<\/h1>\n<h1>ImagesAndVideoRuleToday<\/h1>\n<p><a href=\"https://drive.google.com/file/d/1iBGKtW2dzfcTU-OuEWeIs5a_vbUW5Kqs/view\">https://drive.google.com/file/d/1iBGKtW2dzfcTU-OuEWeIs5a_vbUW5Kqs/view<\/a><\/p>", "zt": "【國中會考】"}, {"id": "f1550971720", "file": "2019-02-24-f1550971720", "date": "2019-02-24", "title": "Running with My Son in the Evening, and the Poem \"The Burden\" by Wu Sheng", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Running & Exercise", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A run with my son led me to Wu Sheng's poem about a father and his children, and a quiet winter-rain night of reading.", "len": 313, "body": "<p>While running together one evening, my dog-nickname son (阿狗) asked me about Wu Sheng, the modern poet in his seventh-grade Chinese class. He said the poem had really moved him, especially the line about the spinning top, which he felt described exactly how he sees me! I casually told him that Wu Sheng is a well-known Taiwanese native-soil writer from Changhua with many works, and suggested he look them up online.<\/p>\n<p>When I got home I was curious and looked it up. The truth is I don't read poetry, because I always feel that pinning your worries onto verse and forcing out sorrow doesn't suit the role I should be playing at this stage of life. But tonight, reading a poem on a quiet night of winter rain turns out to be a rather good choice...<\/p>\n<p>The Burden --- Wu Sheng<\/p>\n<p>After work, it is dusk.<\/p>\n<p>Now and then I glance at the brilliant sunset,<\/p>\n<p>but I no longer linger.<\/p>\n<p>Because your little faces, turned up toward Dad,<\/p>\n<p>reveal so much more expectation.<\/p>\n<p>After overtime, it is deep night.<\/p>\n<p>Now and then I glance at the starry sky,<\/p>\n<p>but I no longer lose myself in it.<\/p>\n<p>Because your little faces, fast asleep,<\/p>\n<p>are more enchanting than the stars.<\/p>\n<p>Day after day, Dad goes to work and comes home,<\/p>\n<p>like a spinning top you flung with all your strength,<\/p>\n<p>circling around you, round and round;<\/p>\n<p>turning Dad's stormy passion,<\/p>\n<p>one by one,<\/p>\n<p>into long, fine tenderness.<\/p>\n<p>Just like Grandpa and Grandma,<\/p>\n<p>who wove for Dad a lifetime<\/p>\n<p>of long and delicate care.<\/p>\n<p>Children! Dad has no complaints at all.<\/p>\n<p>Only because this is life's<\/p>\n<p>heaviest<\/p>\n<p>and also sweetest burden.<\/p>\n<p>------------ divider -------------<\/p>\n<p>I hear this text was already included in the Chinese textbook in my first year of junior high (1984), but I have no memory of it at all. Is that really true?<\/p>", "zt": "阿狗與我晚上一起跑步時問起了七年級國文課的新詩作者吳晟，…"}, {"id": "f1550843018", "file": "2019-02-22-f1550843018", "date": "2019-02-22", "title": "15 Days Left Before the Tour Guide and Tour Leader Exam", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Exam Info & Tips", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A tricky exam question on compensation when a travel agency abandons travellers abroad, explained with a worked example under the revised standard group tour contract.", "len": 232, "body": "<p>Only 15 days left before the tour guide and tour leader exam.<\/p>\n<p>In the LINE group of the Hsing Wu University (HWU) Department of Travel Management, someone asked about a question that even teachers can get wrong, because since 2016 (ROC year 105) the standard contract for domestic and outbound group tours has been revised quite a lot. Take question 31 in the picture as an example. It asks what happens if a travel agency abandons a traveller abroad (abandoning or stranding travellers). The compensation is the same amount as the total tour fee divided by the total number of tour days, multiplied by the number of days abandoned or stranded, and then multiplied by a penalty factor with three possibilities: intentional (5 times), gross negligence (3 times), negligence (1 time).<\/p>\n<p>In the exam, you just look for keywords. This question says gross negligence, so the compensation is 3 times the average daily tour fee.<\/p>\n<p>For a 5-day Japan tour costing NT$30,000, the average per day is 30000/5 = NT$6,000.<\/p>\n<p>If it is [intentional], the compensation is 5 times; for 2 days the calculation is<\/p>\n<p>6000<em>2<\/em>5=60000<\/p>\n<p>If it is [gross negligence], the compensation is 3 times; for 2 days again, the calculation is<\/p>\n<p>6000<em>2<\/em>3=36000<\/p>\n<p>If it is [negligence], the compensation is 1 time; for 2 days the calculation is<\/p>\n<p>6000*2=12000<\/p>\n<p>In the past it was always 5 times.<\/p>", "zt": "離導遊領隊考試剩下15天。"}, {"id": "f1550239654", "file": "2019-02-15-f1550239654", "date": "2019-02-15", "title": "Only 22 Days Until the Tour Leader and Tour Guide Exam, and the HWU Department of Travel Management Prep Class LINE Group Has a Great Past Question", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Exam Info & Tips", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A past exam question on travel contracts mixes three easily confused legal points; Ray breaks it down, including the Civil Code Article 249 rule on deposits.", "len": 267, "body": "<p>Only 22 days until the national tour leader and tour guide licensing exam. In the LINE group for the Hsing Wu University (HWU) Department of Travel Management prep class, a student asked a really good past exam question that contains three easily confused legal points. Please take a look.<\/p>\n<p>This question can be analysed in three parts:<\/p>\n<ol>\n<li>The traveller and the travel agency did not sign a contract<\/li>\n<\/ol>\n<p>This is a [violation] by the travel agency itself. The Tourism Administration can fine the agency NT$10,000 to NT$50,000, but the traveller receives no money from it.<\/p>\n<p>(So you can ignore this NT$10,000 in this question.)<\/p>\n<ol start=\"2\">\n<li>The travel agency cancelled the trip more than seven days before departure because the group was too small<\/li>\n<\/ol>\n<p>Because the agency cancelled on the grounds of insufficient group size, the 30% compensation to the traveller that applies when cancelling 2 to 20 days before departure (35000*0.35=10500) does not apply.<\/p>\n<p>(This is where students who overthink it go wrong.)<\/p>\n<ol start=\"3\">\n<li>The traveller had paid a NT$5,000 deposit<\/li>\n<\/ol>\n<p>This part tests the third clause of [Article 249 of the Civil Code on deposits]: if the contract cannot be performed for a reason attributable to the party who received the deposit, that party must return double the deposit received. This is what the question is really testing. I never mentioned it in class, so it is quite understandable if you got it wrong.<\/p>\n<p>(The NT$5,000 deposit is returned, and because the shortfall in group size is the reason of the party who received the deposit, the travel agency, a further NT$5,000 must be paid to the traveller.)<\/p>", "zt": "再22天就要考領隊導遊國家考試了，醒吾科大旅運系考前班L…"}, {"id": "f1545358642", "file": "2018-12-21-f1545358642", "date": "2018-12-21", "title": "The List of 30 Classic Small Towns", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Taiwan", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "The 30 towns selected as classic small towns across Taiwan, from the north, centre and south to the east coast and outlying islands.", "len": 281, "body": "<p>The list of 30 selected classic small towns:<\/p>\n<p>North:<\/p>\n<p>Zhongzheng District, Keelung City (Haijiao Paradise barrier-free quality itinerary)<\/p>\n<p>Yilan City (city of culture and education)<\/p>\n<p>Toucheng, Yilan (Taiwan's only sea-and-sky 3D travel town)<\/p>\n<p>Beitou, Taipei (enjoy hot spring baths)<\/p>\n<p>Dadaocheng, Taipei (an old street district like a city museum)<\/p>\n<p>Ruifang, New Taipei (the mountain mining secrets of Shuinandong, Jinguashi and Jiufen)<\/p>\n<p>Pinglin, New Taipei (a paradise for tea tasting)<\/p>\n<p>Daxi, Taoyuan (the presidential town's old street district)<\/p>\n<p>Guanxi, Hsinchu (Jiujiang winds and the scent of grass jelly)<\/p>\n<p>Old city district of Hsinchu City (the historic sites of Zhuqian)<\/p>\n<p>Central:<\/p>\n<p>Yuanli, Miaoli (rush weaving)<\/p>\n<p>Gongguan, Miaoli (the home of red jujubes, a golden small town)<\/p>\n<p>Jiji, Nantou (cycling along the railway and the green tunnel)<\/p>\n<p>Xinshe, Taichung (mushrooms, fruit, flowers and firefly watching)<\/p>\n<p>Tianwei, Changhua (the highway garden)<\/p>\n<p>Lukang, Changhua (witness the beauty of craftsmanship)<\/p>\n<p>Beigang, Yunlin (the home of the lantern festival, and a century-old arts town with deep history and culture)<\/p>\n<p>South:<\/p>\n<p>East District, Chiayi City (the Hinoki cultural and creative living area)<\/p>\n<p>Meishan, Chiayi (the beauty of tea plantations and tea fragrance)<\/p>\n<p>Yanshui, Tainan (the beehive fireworks festival)<\/p>\n<p>Houbi, Tainan (the home of rice)<\/p>\n<p>Donggang, Pingtung (the Welcoming the Royal Lords culture and food)<\/p>\n<p>Hengchun, Pingtung (the scenery of an old town at the southern cape)<\/p>\n<p>East Coast and Outlying Islands:<\/p>\n<p>Chenggong Township, Taitung County (unrivalled mountain and sea views and fishing village scenery)<\/p>\n<p>Ruisui Township, Hualien County (hot springs, rafting, and the aromas of tea, milk and coffee)<\/p>\n<p>Huxi Township, Penghu County (island holidays and relaxed fishing villages)<\/p>\n<p>Lieyu Township, Kinmen County (moving between past and present, reliving wartime days)<\/p>\n<p>Beigan Township, Lienchiang County (distinctive Eastern Fujian architecture)<\/p>", "zt": "30個經典小鎮入選名單："}, {"id": "f1542088700", "file": "2018-11-13-f1542088700", "date": "2018-11-13", "title": "Italy's Fincantieri Transfers Cruise Ship Technology to China", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Industry News", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Fincantieri is transferring cruise ship building technology to Chinese shipbuilders, much as Airbus did with aircraft factories in China.", "len": 118, "body": "<p>Italy's Fincantieri shipyard is transferring cruise ship technology to China's shipbuilders, and Chinese manufacturing has taken another step forward. The Majestic Princess, which uses Keelung as its summer home port, was a 2017 product of Fincantieri.<\/p>\n<p>In fact, since 1994 there have also been factories in China building Airbus A330 and A320 aircraft, and their market share has even reached 50%!<\/p>\n<p>Italian Fincantieri transferred cruise ship technology to China State Shipbuilding, and China manufacturing went further. The Majestic Princess, with Keelung as its home port in summer, is the product of Fincantieri in 2017.<\/p>\n<p>In fact, since 1994, China also has the factory of A330 and A320 aircraft, and the market share will be more than 50%!<\/p>\n<p><a href=\"https://news.sina.com.tw/article/20181107/28746412.html\">https://news.sina.com.tw/article/20181107/28746412.html<\/a><\/p>", "zt": "義大利Fincantieri造船廠將郵輪技術轉移給中國造…"}, {"id": "f1538215758", "file": "2018-09-29-f1538215758", "date": "2018-09-29", "title": "Yesterday, 28 September 2018, a major earthquake struck Sulawesi, the large island in eastern Indonesia...", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Teaching Career", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "After the Sulawesi earthquake and tsunami, Ray urges students to care about Indonesia's less-visited regions, since such disasters could one day strike Taiwan too.", "len": 268, "body": "<p>Yesterday, 28 September 2018, a major earthquake struck Sulawesi, the large island in eastern Indonesia, and the huge tsunami that followed caused damage that will be hard to recover from. Because this is neither Japan nor Korea, our Taiwanese news may report it once and then pay no more attention.<\/p>\n<p>Sulawesi covers 180,000 square kilometres, five times the size of Taiwan and only a little smaller than the island of Great Britain, and it is home to 17 million people, most of them Muslim. The earthquake and tsunami must have had an enormous impact on residents, who mostly live along the coast. The casualty figures now are only the official numbers; many places in this region are hard to contact from the outside, so news of the tragedy may not emerge for months. It is like how students all remember the great earthquake in northeastern Japan, but if I mention the South Asian earthquake or the Sichuan earthquake, which happened only a few years apart, far fewer students know about them.<\/p>\n<p>There are many Indonesian students on the Hsing Wu campus. Indonesia has many ethnic groups, with different languages and economic circumstances, and most of the students on campus now come from cities, whereas Sulawesi is a relatively less developed region. For Taiwanese people, the strongest impression of Indonesia may be the tourist hotspot of Bali. Sulawesi lies just north of Bali, and it is much, much bigger. Perhaps you did not know that before, but now you can take an interest, because who knows when a big earthquake or tsunami like this might strike Taiwan again.<\/p>\n<p><a href=\"https://global.udn.com/global_vision/story/8662/3393667\">https://global.udn.com/global_vision/story/8662/3393667<\/a><\/p>", "zt": "昨天2018.9.28，印尼的東方大島蘇拉威西島發生大地…"}, {"id": "f1538128369", "file": "2018-09-28-f1538128369", "date": "2018-09-28", "title": "Singapore's Ministry of Education will reduce mid-year exams from primary school through Secondary 2...", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Singapore will cut the number of mid-year exams for primary and lower secondary students, shifting focus to diligence, curiosity, collaboration and enthusiasm rather than grades.", "len": 142, "body": "<p>Singapore's Ministry of Education will reduce the number of mid-year examinations from primary school through to lower secondary (Grade 10 equivalent), in response to the sweeping changes of a new era.<\/p>\n<p>Going forward, the aim is to steer students towards active learning, with \"positive learning orientations\" (PLO) such as diligence, curiosity, collaboration and enthusiasm in everyday lessons and learning activities, rather than being driven by academic results.<\/p>\n<p>\"On the ground, teachers are on a high-speed train ... rushing, assessments, and preparing the students for exams,\" he said. \"I think it's time to take a pause.\"<\/p>\n<p>The selection of both awards at these levels will no longer be based on academic scores, said MOE. Instead, the eligibility criteria will be adjusted to recognize \"positive learning orientations\" such as diligence, curiosity, collaboration and enthusiasm in daily lessons and learning activities.<\/p>\n<p>Read more at <a href=\"https://www.channelnewsasia.com/news/singapore/exams-assessments-scrap-mid-year-primary-secondary-schools-10767370\">https://www.channelnewsasia.com/news/singapore/exams-assessments-scrap-mid-year-primary-secondary-schools-10767370<\/a><\/p>", "zt": "新加坡教育部將減少國小至國中10年級的期中考試次數，以因…"}, {"id": "f1532502316", "file": "2018-07-25-f1532502316", "date": "2018-07-25", "title": "Non-Stop at Narada Hotel Group", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Overseas Study Tours", "det": "Cross-Strait & Southeast Asia", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Visiting students on summer internships at Narada Hotel Group and three other companies in Hangzhou, and marvelling at the city's rapid development.", "len": 357, "body": "<p>7/24-25<\/p>\n<p>Non-Stop at Narada Hotel Group<\/p>\n<p>On the second and third days in Hangzhou, I visited students on internships at four companies, including Narada Hotel Group (NARADA HOTEL GROUP).<\/p>\n<p>Although Narada is not a listed company, its hotels are spread across 11 provinces and municipalities, including Zhejiang, Hainan, Yunnan, Shanghai, Chongqing, Jiangsu, Hubei, Jiangxi, Anhui, Fujian and Shanxi. It invests in and manages more than 50 hotels with over 15,000 rooms in total. Today the HR Director at headquarters, Director Xu, even mentioned that Narada is growing at an astonishing pace of 25 newly signed managed hotels a year, which creates a huge demand for hotel human resources.<\/p>\n<p>This July's interns come from the graduate schools of Chinese Culture University and Providence University, plus 15 students from National Chi Nan University, I-Shou University and Hsing Wu University. Their jobs include HR specialists, administrative product planners, and Chinese and Western restaurant service staff within the group. The students have adapted well and gained a great deal. One of them even took part in the HRD annual conference, attending with the director a grand gathering of HR managers from all over the country.<\/p>\n<p>The weather in Hangzhou is still scorching hot and humid, and the students who commute every day between their accommodation and workplaces have had a hard time. The one-month internship will end next Tuesday. Having the chance to live and work in Hangzhou, the capital of Zhejiang Province, should be the most unforgettable summer plan of 2018.<\/p>\n<p>Hangzhou looks like one big garden, green everywhere, with electric vehicles, buses and subways reaching every corner. You would never guess it is a big city with nearly ten million registered residents. Famous e-commerce companies such as Alibaba, Ant Financial and NetEase are all based in Hangzhou, and the working population is estimated at around twenty million, so in business, economy, work and tourism it is one of the most advanced cities south of the Yangtze. Beside the thousand-year-old West Lake, I think the students and I all felt that beneath the timeless beauty of Hangzhou lies leapfrog development, moving forward at a speed that is hard to comprehend.<\/p>", "zt": "馬不停蹄的君瀾酒店集團"}, {"id": "f1532358720", "file": "2018-07-23-f1532358720", "date": "2018-07-23", "title": "Dashu Day in Hangzhou: Scorching Summer Heat", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Overseas Study Tours", "det": "Cross-Strait & Southeast Asia", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Visiting Taiwanese students on internships at Songcheng Group in Hangzhou, and why I am proud of their warmth, manners and willingness to leave their comfort zone.", "len": 438, "body": "<p>7/23, Dashu (Major Heat) Day, and Hangzhou is scorching.<\/p>\n<p>Yesterday's typhoon seemed to have no effect on the sun at all. The morning news kept reminding everyone in Hangzhou to protect themselves from the sun and the intense heat!<\/p>\n<p>Today I was visiting Songcheng Group, a well-known local entertainment company in Hangzhou. Some of the students work outdoors, some wear ancient costumes to promote the park, some work at the hotel lobby, and of course some work in food and beverage service. In total, 14 students from 7 schools (Jinan, Penghu, Yilan, Providence, Hsing Wu, Chinese Culture and Jinwen) are doing their internships at the Songcheng Group's First World Hotel and the Songcheng theme park.<\/p>\n<p>Songcheng Group is listed on the Shenzhen Stock Exchange. Formerly Hangzhou Songcheng Tourism Development Co., Ltd., it was founded in September 1994 and renamed Songcheng Performance Development Co., Ltd. in March 2014. Its headquarters are in Hangzhou, Zhejiang, and its main business is investing in, developing and operating theme parks and cultural tourism performances. In 2017 the group's annual revenue was about NT$15 billion. Most of its customers are visitors from mainland China, so the design of the whole theme park follows the tastes of mainland tourists.<\/p>\n<p>Put simply, the students' internship here is a \"down to earth\" experience: getting to know the characteristics of 1.3 billion consumers, working alongside interns from every province, and facing a Hangzhou July heat that is nothing like Taiwan's maritime climate. Where they live and what they eat are different from home. Toward the end of the visit, two male students finished setting up the performance stage before they could join us for a photo and a chat. Look closely and you can see white salt stains on their black clothes! I really want to give these students a big thumbs-up for being willing to step out of their comfort zone.<\/p>\n<p>The managers and colleagues at both Songcheng units that offered internships did their best to look after the students. The Taiwanese students felt cared for by the HR staff and their colleagues, and they found the food in the Songcheng park canteen to their liking. On days off they took buses around town, and the farthest they went by train was Shanghai. People often say Taiwanese students lack a \"wolf spirit\". I feel that Taiwanese students have humanity and warmth. Our hospitality vocational education is reflected in every move these students make: being polite, generous and wise is something wolves cannot do. What these students have is wisdom and refinement in their every gesture. I am truly proud to be their teacher.<\/p>\n<p>Songcheng financial report: <a href=\"http://www.cninfo.com.cn/finalpage/2018-03-28/1204526200.PDF\">http://www.cninfo.com.cn/finalpage/2018-03-28/1204526200.PDF<\/a><\/p>", "zt": "大暑日，杭州酷暑"}, {"id": "f1531745372", "file": "2018-07-16-f1531745372", "date": "2018-07-16", "title": "The Mutianyu Great Wall in a Rainstorm ⛈️", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "China", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A booked day trip to the Great Wall turned into a drive through flooded Beijing streets, until the rain eased and we climbed to a misty, beautiful Mutianyu.", "len": 335, "body": "<p>The Mutianyu Great Wall in a Rainstorm ⛈️<\/p>\n<p>I booked this Great Wall day tour on KKday, and I only did so because the weather forecast promised good weather. Man proposes, heaven disposes!<\/p>\n<p>When we gathered at 6:50 in the morning the streets were already flooded, and the coach couldn't even pull in. It went around picking up drowned rats from all over the world! Along the way trees were down and roads were under water, and the expressway speed limit had been cut to 60 km/h. I comforted my family that at least we were sitting in the car, cruising the \"river\" and touring the capital! We could also practise our English listening comprehension with the guide's commentary!<\/p>\n<p>At 9:30 we reached the foot of the mountain in Huairou District, where the Wall is. The rain was still falling! The scenic area's management called to say there was thunder and the cable cars had stopped running. We all waited on the coach for the rain to ease while listening to the guide explain things, and eventually even the guide said that tickets could be refunded, and so could the cable car fares! (I have to praise this local operator, MUBUS, for their professional and thoughtful service. Not only was the young woman guide's English excellent, she thought of our safety at every turn and even arranged seats for guests to rest on.)<\/p>\n<p>A little after ten the rain suddenly eased and the sky gradually cleared. The guide let us get off and suggested we walk up. After a challenging climb of more than a thousand steps, we reached Beacon Tower No. 10 of the Great Wall dripping with sweat, and there to greet us was a beautiful Mutianyu Great Wall with the clouds parted and the mist gone!<\/p>\n<p>I won't say any more about what came after! When the tour ended, the heavy rain started again, the roads were all flooded and the traffic was gridlocked. It even made the news in Taiwan!<\/p>\n<p><a href=\"http://www.chinanews.com/m/gn/2016/07-21/7946445.shtml\">http://www.chinanews.com/m/gn/2016/07-21/7946445.shtml<\/a><\/p>", "zt": "暴雨⛈️中的慕田峪長城"}, {"id": "f1530249011", "file": "2018-06-29-f1530249011", "date": "2018-06-29", "title": "This is much the same as the Japan-travel blogger I heard on the radio yesterday boasting loudly during a holiday…", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Travel Industry & Transport", "det": "Travel Agencies", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray criticises travellers who dump their luggage and shopping on hotel front desks, urging tourism students never to behave this way.", "len": 82, "body": "<p>This is much the same as the Japan-travel blogger I heard on the radio yesterday, loudly boasting during a holiday that you can shop online like crazy in Japan, have the hotel front desk on your last day receive it all, and then pack everything up together to bring home to Taiwan. It's just upstream and downstream versions of the same behaviour.<\/p>\n<p>Students of tourism, please don't do this!<\/p>\n<p>I used to work near the Executive Yuan too!<\/p>\n<p><a href=\"https://today.line.me/tw/pc/article/%E8%A1%8C%E6%9D%8E%E8%B6%85%E9%87%8D%E9%A3%86%E7%BD%B5%E6%97%A5%E5%9C%B0%E5%8B%A4+%E5%8F%B0%E5%A5%B3%E8%BD%9F%EF%BC%9A%E6%88%91%E5%9C%A8%E8%A1%8C%E6%94%BF%E9%99%A2%E4%B8%8A%E7%8F%AD-zG9GM7\">https://today.line.me/tw/pc/article/%E8%A1%8C%E6%9D%8E%E8%B6%85%E9%87%8D%E9%A3%86%E7%BD%B5%E6%97%A5%E5%9C%B0%E5%8B%A4+%E5%8F%B0%E5%A5%B3%E8%BD%9F%EF%BC%9A%E6%88%91%E5%9C%A8%E8%A1%8C%E6%94%BF%E9%99%A2%E4%B8%8A%E7%8F%AD-zG9GM7<\/a><\/p>\n<h1>HotelFrontDeskIsNotABuildingCaretaker<\/h1>\n<h1>HotelsTakingInLoadsOfPackingBoxesAndRubbishIsNotTheirDuty<\/h1>\n<h1>DontLeaveYourOldSuitcaseAbroadBecauseThatKindOfRubbishIsHardToDisposeOf<\/h1>", "zt": "這和昨天在廣播聽到的某遊日部落客在節日中大聲地吹噓，可以…"}, {"id": "f1529292878", "file": "2018-06-18-f1529292878", "date": "2018-06-18", "title": "HWU President Tsan-Te Chou says students of the College of Tourism and Hospitality took the initiative in training...", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Exam Info & Tips", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Students in HWU's Department of Travel Management earned both Mandarin tour guide and tour leader licences after three to four months of dedicated preparation.", "len": 160, "body": "<p>Hsing Wu University (HWU) President Tsan-Te Chou said that the students of the College of Tourism and Hospitality took the initiative to join the training, spending a full three to four months preparing seriously. Their attitude is moving, and the care the teachers in charge showed in coaching them in their spare time is just as admirable.<\/p>\n<p>Szu-Jou Chen, a third-year student in the Department of Travel Management, said she is grateful for the university's abundant software and hardware support and the teachers' tireless, careful guidance in helping her earn both the Mandarin tour guide and tour leader licences. Her goal is to join the travel industry and realise a lifelong dream of exploring the world. Passing the national exams is only the first step. In the future she hopes to use the university's full-time fourth-year internship programme to choose a good partner company for her placement, and to keep moving steadily towards her plans.<\/p>\n<h1>ThisIsNotAnAd<\/h1>\n<h1>StudentSzuJouChenFromHsinchuSaid<\/h1>\n<h1>TheTourismAndHospitalityBuildingIsActuallyNotHere<\/h1>\n<h1>SwitzerlandDrawsWithBrazil<\/h1>\n<p>@[100000699948600:2048:陳思柔]、@[100001806441898:2048:曾子薰]<\/p>", "zt": "醒吾科大周燦德校長表示，觀餐學院學生主動積極參與培訓，足…"}, {"id": "f1522196692", "file": "2018-03-28-f1522196692", "date": "2018-03-28", "title": "International Cruise Council of Taiwan (ICCT)", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Industry News", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Enrolment is open for the 2018 Advanced Cruise Programme run by the International Cruise Council of Taiwan, for licensed guides, tour leaders, students and industry staff.", "len": 77, "body": "<p>International Cruise Council of Taiwan (ICCT)<\/p>\n<p>Enrolment now open for the 2018 Advanced Cruise Programme<\/p>\n<p>2018 Advanced Cruise Programme training website<\/p>\n<p><a href=\"http://www.go2free.com.tw/icct/index.html\">http://www.go2free.com.tw/icct/index.html<\/a><\/p>\n<p>How to register<\/p>\n<p><a href=\"http://www.go2free.com.tw/icct/2018rules.pdf\">http://www.go2free.com.tw/icct/2018rules.pdf<\/a><\/p>\n<p>Official website of the International Cruise Council of Taiwan<\/p>\n<p><a href=\"http://www.icctw.com.tw/\">http://www.icctw.com.tw/<\/a><\/p>\n<p>Courses and faculty<\/p>\n<p><a href=\"http://www.go2free.com.tw/icct/images/teachers.jpg\">http://www.go2free.com.tw/icct/images/teachers.jpg<\/a><\/p>\n<p>Who may apply<\/p>\n<p>Tour guides and tour leaders holding a practising licence<\/p>\n<p>Students and in-service teachers in tourism-related departments, including tourism, hospitality, leisure management and foreign languages<\/p>\n<p>Staff in the travel, cruise, hotel and leisure tourism industries<\/p>", "zt": "社團法人台灣國際郵輪協會ICCT"}, {"id": "f1521784970", "file": "2018-03-23-f1521784970", "date": "2018-03-23", "title": "The Courage to Refuse Needs to Be Cultivated", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "School & Military Service", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A memory from junior high: pressured into changing a bully's exam answers, Ray was caned in front of the whole faculty, yet still resents that teacher today.", "len": 586, "body": "<p>【The Courage to Refuse Needs to Be Cultivated】<\/p>\n<p>After reading Xiaoxiong Mama's post, I remembered something that happened to me in the second year of junior high.<\/p>\n<p>Years ago, junior highs were all boys' schools, and classes were divided into A+ classes, A-track classes and B-track classes (I have been in all three kinds, and may share more another time). In my second year I was in an A-track class, and my homeroom teacher at the time is now a retired, well-known high school principal.<\/p>\n<p>My grades were not bad, so I served as the teaching assistant for one of the homeroom teacher's subjects, recording scores and helping mark papers. Once the papers were marked and the scores recorded, it was the teacher's time to hit people: palm strikes, spankings, cheek pulling, half-squats, every kind of punishment. So everyone who took an exam was afraid, and so was whoever marked the papers and recorded the scores. If I got a score wrong, a classmate would be hit the wrong number of times, and I would be in trouble with everyone.<\/p>\n<p>Classmates often came to me asking me to fix small mistakes. Mostly it was a \"misreading\" that could always be corrected before the teacher struck. It was a hassle and a worry, but hard to refuse! Thinking about it now, why was this a student's job? It was really the teacher being lazy.<\/p>\n<p>One day, the big trouble was bound to come.<\/p>\n<p>A classmate who was a kind of \"big brother\" in the class had done terribly on the exam, and it was certain he would be beaten until his backside was black and blue. At noon break he came to me to \"discuss\" it, and asked for my answers so he could copy them! I did not want to, but I was also afraid he would come after me outside school. I had learned this in first year when I was messing around in the B-track class: you have to read the situation, and you have to bow your head.<\/p>\n<p>A few days passed, and I felt miserable and worried. I could not study and could not sleep well! Then the homeroom teacher appeared and called the two of us to the year-level teachers' office (a very large one, the kind where many teachers sit together).<\/p>\n<p>The teacher said he did not believe that classmate could have scored well, and asked me whether I had helped change his answers.<\/p>\n<p>I was terrified. I glanced at my classmate, he nodded, so I nodded and admitted it too!<\/p>\n<p>The teacher exploded. Right there, he had the classmate and me lean with our hands on the desk in front of all the teachers of the whole year, and with a cane half as long as a person he viciously gave the classmate 20 hard strokes on the backside first, then, just as furiously, gave me the same 20 strokes in front of
