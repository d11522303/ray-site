ader Exam Prep EP42<\/p>\n<h1>TourLeaderExam57DaysToGo<\/h1>\n<p>2 Tokyo, Japan is a metropolis that many Taiwanese visit. Which of the following has nothing to do with the history of Tokyo's urban development? (A) It was once the seat of the Tokugawa shogunate (B) Its former name was Edo (C) In the early Meiji period the Emperor moved here from Kyoto (D) It was the main battlefield of the Satsuma Rebellion<\/p>\n<p>Explanation: The Satsuma Rebellion (Seinan War) was a civil war that took place in the Kyushu region of Japan, led by Saigo Takamori's uprising, so it did not happen in Tokyo and has nothing to do with the city's development.<\/p>\n<p>Travel to Japan is still the main product of Taiwan's travel industry, so it makes perfect sense that the tour leader exam includes Japanese history and geography. Having some knowledge of Japan is a key point before the exam, and this question is a super basic freebie. Let's try a few more basic questions on Japan, focusing on everyone's favourite, the yen.<\/p>\n<h1>1 In July 2024 Japan officially issued new banknotes, with figures all closely tied to Japan's modern social progress. Which of the following descriptions of the people on the new banknotes is correct?<\/h1>\n<p>(A) 10,000-yen note: Shibusawa Eiichi, known as the \"father of Japanese capitalism\", founded Japan's first modern bank and contributed greatly to industrial modernisation.<\/p>\n<p>(B) 5,000-yen note: Tsuda Umeko. She founded Tsuda University and was a pioneer of higher education for women in Japan; her father was the last shogun of the Edo shogunate.<\/p>\n<p>(C) 1,000-yen note: Kitasato Shibasaburo. He discovered the plague bacillus and developed a serum therapy for tetanus, and his portrait replaced that of Higuchi Ichiyo.<\/p>\n<p>(D) 2,000-yen note: Murasaki Shikibu. Although this denomination is little circulated, its front-side figure, Murasaki Shikibu, author of The Tale of Genji, is still the only female portrait on Japanese banknotes today.<\/p>\n<h1>2 As a tour leader introducing Japanese banknotes to your group, being able to tell the stories of the buildings or sights on the back will greatly raise your professionalism. Which of the following descriptions of the designs on the back of the notes currently in circulation is incorrect?<\/h1>\n<p>(A) Old 10,000-yen note: the back is printed with the phoenix statue of the Phoenix Hall of Byodo-in in Uji, Kyoto, symbolising the cultural peak of the Heian period.<\/p>\n<p>(B) New 10,000-yen note: the back design is the Marunouchi side station building of Tokyo Station in Tokyo, a Baroque-style building whose restoration was completed in 2012.<\/p>\n<p>(C) New 1,000-yen note: the back design is \"The Great Wave off Kanagawa\" from \"Thirty-six Views of Mount Fuji\", the famous work of ukiyo-e artist Katsushika Hokusai.<\/p>\n<p>(D) Old 1,000-yen note: the back design is Shureimon Gate in Okinawa.<\/p>\n<h1>Welcome to share<\/h1>\n<p>Image source: Wikipedia<\/p>\n<h1>99DaysOfTourLeaderAndGuideExamPracticeQuestions👇<\/h1>", "zt": "導遊領隊考前EP42"}, {"id": "f1767878556", "file": "2026-01-08-f1767878556", "date": "2026-01-08", "title": "Tour Guide & Tour Leader Exam Prep EP34", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Daily Exam Practice", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Exam practice on Taiwan's winter northeast monsoon and landscapes, plus two scenario questions on climate and crops.", "len": 176, "body": "<p>Tour Guide &amp; Tour Leader Exam Prep EP34<\/p>\n<h1>TourLeaderExam65DaysToGo<\/h1>\n<p>32 Which of the following famous Taiwanese landscapes or phenomena are unrelated to the winter northeast monsoon?<\/p>\n<p>① Kenting's wind-blown sand landscape ② Taitung's foehn phenomenon<\/p>\n<p>③ The Taiwanese proverb \"Hsinchu wind, Ilan rain\" ④ The windkanter (wind-faceted stone) landscape of the north coast<\/p>\n<h1>1 A farmer plans to grow crops on the central-southern plains, hoping for \"plenty of winter sunshine and little rain, to reduce pests and disease and improve crop quality\". Which of the following crop arrangements best fits this climate?<\/h1>\n<p>A. Spring tender tea leaves<\/p>\n<p>B. Winter tomatoes and onions<\/p>\n<p>C. Summer first-crop rice<\/p>\n<p>D. Autumn high-mountain cabbage<\/p>\n<h1>2 A local government promotes an \"autumn persimmon-drying, wine-making and farm-product processing festival\", choosing October to November as the main event period. Which of the following climate factors was the main consideration in choosing this time?<\/h1>\n<p>A. Typhoons are most frequent<\/p>\n<p>B. The northeast monsoon is strongest<\/p>\n<p>C. Monsoon transition, with stable, crisp and dry weather<\/p>\n<p>D. Summer heat favours fermentation<\/p>\n<h1>FeelFreeToShare<\/h1>\n<p>Photo Credit: Gemini<\/p>\n<h1>99DaysTourLeaderGuideExamPrepCompanionQuestions👇<\/h1>", "zt": "導遊領隊考前EP34"}, {"id": "f1767016115", "file": "2025-12-29-f1767016115", "date": "2025-12-29", "title": "Tour Guide and Tour Leader Exam Prep EP24", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Daily Exam Practice", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Day 75 before the tour leader exam: a question on Tainan's Zuozhen Fossil Park, notes on Taiwan's earliest dog fossil, and two practice questions on national heritage sites.", "len": 450, "body": "<p>Tour Guide and Tour Leader Exam Prep EP24<\/p>\n<h1>TourLeaderExam75DaysToGo<\/h1>\n<p>37 Tainan's Zuozhen Fossil Park is famous for displaying fossils. Which of the following fossils has NOT been found in the Cailiao River basin of this area? (1) rhinoceros (2) elephant (3) water buffalo (4) dinosaur<\/p>\n<p>Explanation: The Tainan Zuozhen Fossil Park shares its site with Guangrong Elementary School in Zuozhen District, Tainan. The Fossil Museum exists because of the rich fossil deposits discovered in the nearby Cailiao River basin, and it systematically presents the ecology of this land of Taiwan tens of thousands of years ago, including fossils of many mammals such as the Taiwan Hayasaka rhinoceros, early elephants (such as the oriental elephant and Huai River elephant), deer and water buffalo, bearing witness to Taiwan's historical ties with the Eurasian continent. The fossil park also has in-depth introductions to the discovery and research history of Zuozhen Man, a human site from Taiwan's late Neolithic period.<\/p>\n<p>The earliest human remains now recognised by Taiwan's archaeological community have been replaced by Penghu Man and Matsu's Liangdao Man. But a more interesting discovery in archaeology is the dog fossil unearthed at the Dabenkeng culture site at the Southern Taiwan Science Park in Tainan (about 4,800 years old). Called \"Taiwan's First Dog\", it is the earliest domestic dog fossil found in Taiwan with a close symbiotic relationship with humans. The bones are completely preserved, in a sleeping posture, which amazed the archaeological experts. After years of investigation, it is inferred that this skeleton is probably the earliest domesticated dog found in the country, clearly showing the deep bond that humans and dogs established.<\/p>\n<p>Here are two archaeology questions related to national heritage sites:<\/p>\n<h1>1 Which of the following pairings of \"national heritage site, its representative culture and important finds\" is the most correct?<\/h1>\n<p>(1) Shihsanhang site, Palaeolithic culture, Taiwan's earliest human fossils<\/p>\n<p>(2) Peinan site, megalithic culture, large numbers of slate coffins and signs of a hierarchical society<\/p>\n<p>(3) Yuanshan site, Iron Age culture, Taiwan's earliest rice agriculture<\/p>\n<p>(4) Cailiao Zuozhen site, metal-tool culture, remains of Han Chinese settlers' lives<\/p>\n<h1>2 If you want to explain to tourists how Taiwan's prehistoric society developed from early hunting and gathering to one with division of labour, iron smelting and the ability to trade abroad, which of the following site comparisons has the most representative and chronological significance?<\/h1>\n<p>(1) Yuanshan site (agricultural settlement and pottery) → Shihsanhang site (iron production and maritime trade)<\/p>\n<p>(2) Changbin culture (Palaeolithic hunting and gathering) → Peinan site (megalithic architecture and burial system)<\/p>\n<p>(3) Peinan site (social hierarchy) → Yuanshan site (food culture)<\/p>\n<p>(4) Shihsanhang site (iron-smelting technology) → Changbin culture (chipped stone tools)<\/p>\n<h1>Welcome to share<\/h1>\n<p>Photo Credit: Gemini<\/p>\n<h1>99DaysOfTourLeaderAndGuideExamPracticeQuestions👇<\/h1>", "zt": "導遊領隊考前EP24"}, {"id": "f1766732262", "file": "2025-12-26-f1766732262", "date": "2025-12-26", "title": "An Example of AI Applied to Airline Reservation Systems", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Airline Internships", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Sabre has launched AI-driven airfare pricing that adjusts fares in real time, with airlines reporting revenue gains of 3% to 6%.", "len": 341, "body": "<p>An Example of AI Applied to Airline Reservation Systems<\/p>\n<p>The Department of Travel Management at Hsing Wu University has a professional travel information classroom equipped with Sabre, Amadeus, Travelport and Kewei. To train the ticketing skills of Travel Management students, we pay a considerable amount in royalties every year, but the students gain and improve even more.<\/p>\n<p>Sabre recently launched a new airfare technology that uses artificial intelligence (AI) to improve how airlines price tickets. The main goal of this technology is to let airlines offer more reasonable ticket prices based on real-time market conditions and passenger demand. This change is gradually turning the traditional fixed-fare approach into a more flexible and diverse pricing model.<\/p>\n<p>The system continuously observes how passengers search for tickets online and actually make bookings, and adjusts fares in real time based on this data. Unlike the past use of fixed fare classes or preset prices, the new pricing method can generate prices that better match market conditions according to changes in current demand. At the same time, the system also refers to other airlines' fares and travel demand in different seasons, bringing fares closer to reality.<\/p>\n<p>Sabre is not the only company developing this kind of technology. Now many airlines and airline technology companies are working to make fare pricing smarter and more flexible. Companies including Fetcherr, PROS, FLYR and Amadeus have all begun to apply AI to airline revenue management. According to Sabre, some airlines saw their overall revenue increase by about 3% to 6% after using this AI pricing system. This is because fares can match passenger demand more accurately, reducing cases of prices that are too high or too low, so that both airlines and passengers get better results.<\/p>\n<p>Overall, the way airfares are priced is changing rapidly. The fixed fare-class system used for a long time is slowly being replaced by new models based on customer feedback data and AI. This means ticket prices are no longer fixed but can be adjusted in real time as the market changes.<\/p>\n<p>Image source: Webintravel<\/p>", "zt": "AI應用在航空訂位系統的例子"}, {"id": "f1766670946", "file": "2025-12-25-f1766670946", "date": "2025-12-25", "title": "Tour Guide & Tour Leader Exam Prep EP20", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Daily Exam Practice", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Exam practice: when the north-south trunk railway on Taiwan's west coast was completed in 1908, its colonial significance, and two practice questions.", "len": 560, "body": "<p>Tour Guide &amp; Tour Leader Exam Prep EP20<\/p>\n<h1>TourLeaderExam79DaysToGo<\/h1>\n<p>20 When was the north-south trunk railway on Taiwan's west coast completed?<\/p>\n<p>① During Liu Ming-chuan's governance of Taiwan ② During the Japanese colonial period ③ During Shao Yu-lien's governance of Taiwan ④ After the government relocated to Taiwan<\/p>\n<h1>2025MandarinTourGuideExamPastQuestion<\/h1>\n<p>Explanation<\/p>\n<p>The completion of the west-coast north-south trunk railway took place mainly during the Japanese era. For military and economic governance, the rulers, led by Gotō Shinpei, civil administrator of the Taiwan Governor-General's Office, and chief engineer Hasegawa Kinsuke, greatly revised the old Qing-era line and extended it southward. Most unusually, construction started at the north and south ends simultaneously, and on 20 April 1908 the whole trunk line finally joined up in Taichung.<\/p>\n<p>To show how much importance was attached to running Taiwan, a \"Trunk Railway Completion Ceremony\" was held in Taichung Park. Why was Taichung chosen for the ceremony? It was highly symbolic. First, it is the midpoint where north and south meet on the trunk line. Also, to welcome Prince Kan'in Kotohito, the Governor-General's Office built the \"Lakeside Pavilion\" (then called the \"Twin Pavilions\") in the pond of Taichung Park as a resting place. That building is still the emblem of Taichung City today, a concrete witness to this railway history. The imperial family travelled by rail to inspect and preside over the ceremony, symbolising that the Empire of Japan's actual control over the island's territory had reached every corner through the rails.<\/p>\n<p>For Taiwan itself, the completion of the west-coast trunk railway also represented a social transformation brought by a \"spatial revolution\". Once the whole north-south line opened, travel time was cut to a dozen or so hours, and Taiwan for the first time had an \"island-wide\" sense of integrated time and space. At the same time, cities along the transport arteries (such as Taichung, Hsinchu and Chiayi) developed rapidly, while port cities that originally relied on water transport (such as Lukang and Yuejin) declined instead.<\/p>\n<p>In this way, once the trunk line was completed, sugar from southern Taiwan could quickly be shipped to northern ports for export, bringing the \"Sugar Gold era\". The railway became the blood vessel through which the colonial government extracted resources, transported troops and governed.<\/p>\n<p>After reading the above, try these two related questions:<\/p>\n<h1>1 Regarding the function of the west-coast trunk railway under Japanese colonial rule, which of the following statements best fits historical fact?<\/h1>\n<p>① It was mainly used to improve the quality of life of Taiwan's people and reduce regional development gaps<\/p>\n<p>② It served as a cultural exchange route promoting equal interaction between north and south<\/p>\n<p>③ It combined resource transport, military deployment and administrative management, and was the core infrastructure of colonial rule<\/p>\n<p>④ It aimed to serve local agricultural self-sufficiency and reduce dependence on foreign trade<\/p>\n<h1>2 When the whole west-coast trunk railway opened in 1908, in order to welcome Prince Kan'in Kotohito and demonstrate its symbolic management and rule of Taiwan, the Taiwan Governor-General's Office built a particular structure in Taichung Park as a ceremonial and resting space. Which of the following is that structure, which remains an important symbol of Taichung City today?<\/h1>\n<p>① Taichung Prefectural Office<\/p>\n<p>② Taichung Public Hall<\/p>\n<p>③ Lakeside Pavilion<\/p>\n<p>④ Broadcasting Station Memorial Tower<\/p>\n<h1>FeelFreeToShare<\/h1>\n<p>Photo Credit: Taichung City Cultural Heritage Department<\/p>\n<p>For more practice questions, go here:<\/p>\n<p><a href=\"https://www.facebook.com/share/p/17Py6KJFKx/\">https://www.facebook.com/share/p/17Py6KJFKx/<\/a><\/p>", "zt": "導遊領隊考前EP20"}, {"id": "f1765072039", "file": "2025-12-07-f1765072039", "date": "2025-12-07", "title": "Watch the Video First...", "cat": "Ageing Well", "cats": ["Ageing Well"], "sub": "Retirement & Career", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Using Midway Island as a metaphor for milestone ages, Ray reflects on turning 50, a classmate's 1,561 km walk around Taiwan, and stamping himself 'pass'.", "len": 349, "body": "<p>Watch the video first......<\/p>\n<p>Pass at 50? Or fail?<\/p>\n<p>There is an island in the Pacific called Midway. At certain ages and moments, we always define them as very important, because life is like a vast ocean: all around looks exactly the same, and without a direction to guide you, you really feel at a loss in the endless sea. With a Midway Island as a stepping stone, the voyage has a direction.<\/p>\n<p>So perhaps you, like me, at some important point in the sea of life, would look forward to a midway goal:<\/p>\n<p>At 20, I hoped to date,<\/p>\n<p>At 30, I hoped to have a stable family,<\/p>\n<p>At 40, to have reached a certain rank at work,<\/p>\n<p>At 50......<\/p>\n<p>Recently, my high school classmate sailed around the world on a cruise with his family, and then, with astonishing perseverance, walked all the way around Taiwan on foot. He wrote his reflections: \"From the scorching heat to late autumn, with a typhoon keeping us company at the end, 56 days, 1,561 kilometres, 2.12 million steps. Along the way there was inevitably pain, fatigue and danger, but these were all part of the journey and nourishment for growth......\" As classmates, we simply watched him move forward day by day on Facebook, supporting our hardworking classmate with likes, and using the same likes to encourage ourselves.<\/p>\n<p>In 2016, a Japanese stamp advertisement used a \"pass\" stamp to encourage a company as it headed towards its 50th year. In this last month of 2025, we should also stamp ourselves with a \"pass\", and pressing a \"like\" matters. As a teacher, stamping my students with a \"pass\" matters too, because we have all worked hard for ourselves, and a self who can give everything for something is truly great.<\/p>\n<p>Now I have set off from Midway Island, with my family, friends, students and many memories on board. Actually, I don't know where the next port is, and I still worry about the uncertainties and challenges on the voyage, but I look even more forward to the different scenery of each new age.<\/p>", "zt": "先看完影片喔......"}, {"id": "f1765074090", "file": "2025-12-07-f1765074090", "date": "2025-12-07", "title": "Director Huang's Verbal Briefing on Several Matters", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Teaching Career", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Notes on a briefing about the university's new board, plans to close several departments, and Director Huang's effort to save the Department of Travel Management.", "len": 360, "body": "<p>2025.12.9<\/p>\n<p>Director Huang's verbal briefing on several matters<\/p>\n<p>On the board of directors, Cathay Financial has only one seat. The Ku family will keep seats for the third generation. The main board composition will probably be people from the Wang family of EBC.<\/p>\n<p>The rest of the content is about the same as a few days ago. The only verbal note was that Chih-Chieh Hsu may not be able to stay on next year.<\/p>\n<p>2025.12.6<\/p>\n<p>The following was written by Director Huang in the LINE group after work. It feels like an important moment, so I'm recording it first and will check it against events later.<\/p>\n<hr />\n<p>I'll give everyone a quick report online.<\/p>\n<p>This evening the new board made contact with me.<\/p>\n<p>They want to close several departments in the school.<\/p>\n<p>For the College of Tourism and Hospitality, they are keeping only 2 departments:<\/p>\n<p>Hospitality and Travel Management.<\/p>\n<p>Because they think these 2 departments have recruited quite well in recent years.<\/p>\n<p>By contrast, the Department of Tourism has been terrible for several years in a row.<\/p>\n<p>(Please keep the above confidential.) (Wait a moment, I'll write down my thoughts.)<\/p>\n<p>I tentatively asked them to think more about it.<\/p>\n<p>The other side has a slight insistence on closing the Department of Tourism.<\/p>\n<p>The Department of Travel Management is something we built and invited people to build together.<\/p>\n<p>It was hard-won to reach today's results.<\/p>\n<p>I hope you will let me be stubborn once more.<\/p>\n<p>This year, everyone please work a bit harder.<\/p>\n<p>At the very least we must get the Department of Travel Management to break even.<\/p>\n<p>To save the Department of Travel Management.<\/p>\n<p>I really, really hope to save the Department of Travel Management.<\/p>\n<p>If the Department of Travel Management just breaks even this year, then what gets closed won't be the Department of Travel Management.<\/p>\n<p>The Department of Travel Management is like my own child. I so want it to stay.<\/p>\n<p>Disclosed: the current president has been courteously sent off from the school.<\/p>\n<p>In future the university will use a \"cabinet system\".<\/p>\n<p>Disclosed: several office directors will be replaced, but I will still be in charge of admissions.<\/p>\n<p>So~~~~~~<\/p>", "zt": "黃主任口頭說明幾件事"}, {"id": "f1765078373", "file": "2025-12-07-f1765078373", "date": "2025-12-07", "title": "Tour Guide and Tour Leader Exam Prep EP2", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Tour Guide & Tour Leader", "det": "Daily Exam Practice", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A 2025 tour leader exam question on Borobudur, plus two likely follow-up questions on Borobudur's location and the nearby Prambanan temple.", "len": 168, "body": "<p>Tour Guide and Tour Leader Exam Prep EP2<\/p>\n<h1>2025TourLeaderExamQuestion (Tourism Administration)<\/h1>\n<ol start=\"15\">\n<li>Borobudur in Indonesia has profound significance in its religious and cultural background. What kind of religious building is it? ① Buddhism ② Islam ③ Christianity ④ Hinduism<\/li>\n<\/ol>\n<p>You can find the correct answer by asking AI, as usual. This was one of the midterm exam questions in my World Travel Geography course for many years. Hsing Wu University students should get it right. If you got it wrong, you either skipped class or were playing on your phone 🤣.<\/p>\n<p>Here are some new questions that might be derived from this one:<\/p>\n<ol>\n<li>\n<p>In which city in Indonesia is the Borobudur World Heritage Site located? ① Surabaya ② Yogyakarta ③ Medan ④ Jakarta<\/p>\n<\/li>\n<li>\n<p>In the same Indonesian city there is another important World Heritage Site, Prambanan. What kind of religious building is it? ① Buddhism ② Islam ③ Christianity ④ Hinduism<\/p>\n<\/li>\n<\/ol>\n<h1>TourLeaderExamCountdown97Days<\/h1>\n<h1>FeelFreeToShare<\/h1>\n<p>For more practice questions, go here:<\/p>\n<p><a href=\"https://www.facebook.com/share/p/17Py6KJFKx/\">https://www.facebook.com/share/p/17Py6KJFKx/<\/a><\/p>\n<p>Image source: By Jakub Hałun, CC BY-SA 4.0, <a href=\"https://commons.wikimedia.org/w/index.php?curid=129351367\">https://commons.wikimedia.org/w/index.php?curid=129351367<\/a><\/p>", "zt": "導遊領隊考前EP2"}, {"id": "f1763863951", "file": "2025-11-23-f1763863951", "date": "2025-11-23", "title": "[Labor Thanksgiving Day]", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Everyday Notes", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "On Japan's Labor Thanksgiving Day, I reflect on honouring the people who provide services and necessities, rather than glorifying financial games and speculation.", "len": 307, "body": "<p>[Labor Thanksgiving Day]<\/p>\n<p>I feel strongly about this day every year, because the mainstream mood and media in Taiwanese society all take making money from money, property and financial management, the roiling stock market and extravagance as life goals, making people think that whoever can give money is the boss. In fact, those with the ability to provide services and daily necessities are the most worthy of respect, and only then is life most complete and society full of happiness.<\/p>\n<p>Japan's Labor Thanksgiving Day aims to \"respect labour, celebrate production, and express gratitude to one another\". In short, this day is for cherishing work, celebrating the creation of life's necessities, and expressing mutual appreciation. Food service, cleaning, shop employees, police, house construction, farmers, fishers, factory workers, electronics engineers, painters, writers and publishers, garbage truck crews, transport drivers, logistics drivers, office workers, hairdressers and beauticians, actors, flight attendants, pilots, doctors, teachers and the hundreds of other trades are all jobs that involve people serving people.<\/p>\n<p>But excessive obsession with financial management, speculating in stocks and crypto, property investors, and even online card games, get-rich schemes and scam rings, which involve no labour and spend all day fantasising about getting rich, retiring and travelling the world, and so on: I can understand that these money games and pleasure activities also require a high level of intelligence and judgement, but that is not a reasonable justification for a way of life!<\/p>\n<p>Work, properly speaking, must relate to other people's needs in life. Without the work of these people we could not live normally, because people working and supporting each other is what makes our smooth lives possible. So today, 11/23, is a day for hardworking people to give themselves a round of applause, and please also express your gratitude when you receive services out and about!<\/p>\n<p>Image source: @matsbox @good-luck-day.com<\/p>", "zt": "【勤勞感謝日】"}, {"id": "f1763651349", "file": "2025-11-20-f1763651349", "date": "2025-11-20", "title": "Middle-Aged Man Takes the PhD Exams: Update 2025.12.2", "cat": "Morning Reading", "cats": ["Morning Reading"], "sub": "Journal Papers", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "After 25 years since my master's, I tried PhD admissions for the first time. Results: one offer, three waitlists, and reflections on regret and taking action.", "len": 715, "body": "<p>Middle-Aged Man Takes the PhD Exams: Update 2025.12.2<\/p>\n<p>National Taiwan University of Science and Technology, Graduate Institute of Applied Science and Technology: admitted, 4th place<\/p>\n<p>National Taiwan University, Department of Library and Information Science, PhD programme selection: waitlist, 2nd place<\/p>\n<p>National Tsing Hua University, Department of Education and Learning Technology, PhD programme selection: waitlist, 5th place<\/p>\n<p>Fu Jen Catholic University, Graduate Institute of Business Administration, PhD programme: waitlist, 2nd place<\/p>\n<p>This is my first attempt at doctoral entrance exams in the twenty-five years since I finished my master's, and the results are as above. I plan to enrol at National Taiwan University of Science and Technology next September. I applied to four schools in total. The two I most hoped to attend, National Taiwan University and National Tsing Hua University, both put me on the waitlist, and with my alma mater Fu Jen's business PhD also a waitlist, I can't help feeling a sense of loss, feeling that my effort has still not been fully recognised. But perhaps in life you can't have everything, and I'm thinking about whether to fight another round next year.<\/p>\n<p>In this process I did the very best I could, and the whole experience was very informative and educational: the struggle of revising and re-revising my application documents, preparing for the interviews round by round, and then facing the professors' questions alone, session after session. I could feel the professors' expertise and expectations, and they scrutinised the materials I submitted in concrete detail. It was more nerve-racking and exciting than reading the written review comments of journal papers. The real lessons about organising and arranging my mindset only came after I took action, but all of it carried very high expectations and hopes for myself.<\/p>\n<p>At noon on 2025/11/20 I opened the registration system online and saw the National Taiwan University waitlist, and before bed I saw that Tsing Hua was also a waitlist, with an even lower ranking. The sense of loss is hard to describe in words. On 2025/11/26, after all the admitted candidates at NTU's library and information science programme had registered, it was confirmed that I could not be admitted. But on the same day NTUST also announced its results, with me admitted in 4th place. The tangled feelings of disappointment and anticipation were hard for me to digest, and as I probed around inside myself I could not find a happy feeling.<\/p>\n<p>I took some time to message and thank the teachers and classmates who had helped me greatly along the way of the exams. Although I have long held the Ministry's associate professor qualification, the state of mind I am in right now really lets me appreciate the true meaning of \"the sea of learning has no shore\". If you have expectations of yourself, you should discipline yourself to set some challenges, and prepare and face them well, so that you don't waste your time.<\/p>\n<p>Going back to study for a PhD only when life takes a turn backward? My feelings are very mixed, and rather childish. Earlier I only wanted to do a PhD abroad and did not want to study in Taiwan. Over the years I studied doctoral programmes in the US, UK, Australia, and even Japan and Singapore with English-taught programmes on their websites in detail, and I childishly imagined the day I would enrol, but that day never really appeared before me. Of course I could use the excuse that life's dreams are full but reality is lean, or family pressure, financial needs, and a malnourished mindset that topples in the wind, as countless reasons. But right now I truly feel that it was simply that I didn't prepare well and let time flow away like water, always rationalising the wishes I never fulfilled in order to forgive myself.<\/p>\n<p>Over the past two years, the passing of close family and a student, my beloved partner's illness, and my parents ageing ever faster, all the excuses I made up for myself would become real obstacles. I really don't want to resign myself to fate. If I want my life to be different, the only way is to act and put it into practice. You only know what the scenery along the road is like once you take a big step out.<\/p>", "zt": "大叔考博班 2025.12.2更新"}, {"id": "f1761524323", "file": "2025-10-27-f1761524323", "date": "2025-10-27", "title": "[Timor-Leste Joins ASEAN]", "cat": "Licensing Exams", "cats": ["Licensing Exams"], "sub": "Other Certificates", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Timor-Leste formally joined ASEAN on 26 October 2025. I recount its history and reflect on Taiwan's limited place in international organisations.", "len": 345, "body": "<p>[Timor-Leste Joins ASEAN]<\/p>\n<p>The part about Timor-Leste in the World Tourism Geography course I just finished teaching needs updating.<\/p>\n<p>Timor-Leste is a new country on the island of Timor, at the far east of Indonesia. Timor is a little smaller than Taiwan, about 30,000 square kilometres, and like Taiwan it is a mountainous island, with its highest peak reaching nearly 3,000 metres.<\/p>\n<p>Unlike Indonesia, which was colonised by the Dutch, it was colonised by Portugal, so Timor-Leste's official languages are Tetum and Portuguese. Most residents are Catholic, and the island also has descendants of Hakka people who migrated there a hundred years ago.<\/p>\n<p>At the end of the last century, Timor-Leste wanted independence from Indonesia, but was bloodily suppressed by the Indonesian authorities, and 300,000 people were forcibly driven to West Timor to become refugees. Through international mediation, Timor-Leste formally restored its independence at midnight on 20 May 2002, with the name Democratic Republic of Timor-Leste.<\/p>\n<p>On 26 October 2025 the 47th ASEAN Summit was held in Kuala Lumpur. At the opening ceremony, the ASEAN countries and the Prime Minister of Timor-Leste stamped and signed the declaration document, and it formally joined ASEAN. Timor-Leste's Prime Minister Xanana Gusmao signed last, smiling as he held the pen, unable to hide his emotion, his eyes glistening with tears.<\/p>\n<p>Taiwan belongs to few world organisations. Apart from the WTO and APEC, we have almost no place at international cooperation occasions. In the next few days the 2025 APEC Asia-Pacific Economic Cooperation meeting will be held in Busan, with big names such as Trump and Xi attending, but does anyone know whom Taiwan's president is sending to attend?<\/p>\n<p>In the technology industry we hold many world number-ones, and our exposure and influence in economic strength are astonishing. But businesspeople have no borders and people climb to higher places, and those we negotiate with politically are world powers. Taiwan is just paying money as a comprador, and there will always be a day when it is used up. Wanting a real voice in the international arena is truly not easy.<\/p>", "zt": "【東帝汶加入東協ASEAN】"}, {"id": "f1761272944", "file": "2025-10-24-f1761272944", "date": "2025-10-24", "title": "[How to Comfort Disappointed Students]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Airline Internships", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Only 2 of 11 students made it to interviews for an airline internship. Ray shares the six steps he used to steady his students and himself.", "len": 738, "body": "<p>[How to Comfort Disappointed Students]<\/p>\n<p>Yesterday the results of the second round for a well-known airline's internship that our students had applied for arrived. The department had put forward 11 students, with all the résumés still handwritten, and only 2 students got through to the interview stage. When the notification email came, besides being surprised, I thought for a moment about whether to notify students individually or make an announcement.<\/p>\n<p>In the end I decided to announce it directly, so all the students would see who made the list!<\/p>\n<p>As you would expect, the internship preparation group went silent. It wasn't that nobody responded; sadness, frustration, disappointment and other feelings filled the virtual space.<\/p>\n<p>We teachers were in the group too, and our feelings were also mixed. Their homeroom teacher even came to find me, hoping to say a few words and encourage everyone. At that moment I was troubled as well, wondering whether I should say something.<\/p>\n<p>It was noon, right after four classes. Their homeroom teacher had just finished four periods of volunteer teaching at a senior high school and had just driven back to campus, and would go on to four more periods of on-campus classes in the afternoon. Respect.<\/p>\n<p>I gulped down my rice. What I was really swallowing were my own feelings and disappointment, and the food filling my stomach was to get myself pumped up first, so I would have the spirit and strength to face this group of students who had worked hard for a good while.<\/p>\n<p>I decided to sort myself out first. After eating, I prepared four job-hunting preparation sheets, including a list of study certificates, a full-year internship intention form for parents and the student, and a personal information form, and I prepared a sample for writing a 104 résumé. With food in my stomach and some thoughts in my heart, I walked into a classroom full of low pressure.<\/p>\n<p>STEP 1. I carried a big pile of empty document folders, each with an individual student's name on it, showing that I had come prepared for every single student.<\/p>\n<p>STEP 2. I printed the forms above one by one on A4 paper and laid them out at the front of the classroom. Students whose names were called took their folders and counted the items one by one in their own hands, using action to sort out their feelings.<\/p>\n<p>STEP 3. I didn't say a word about this morning's announced results. I first told all the students how to use the order on the folder to prepare their materials: those with nice handwriting could fill in the forms by hand, and those with poor handwriting could type them in character by character. In writing, with order and words, they would come to understand themselves and think about their future direction.<\/p>\n<p>STEP 4. I gave support. If students had any questions, their homeroom teacher, I, or any teacher in the department could help, but when they came to ask, they had to have complete materials in hand and not come empty-handed.<\/p>\n<p>STEP 5. I told the students who were accepted to prepare their interviews and English interaction skills as soon as possible and to give the interview everything they had. If there was the slightest sign of giving up or an offhand attitude, the interviewers at a well-known company could see it at a glance.<\/p>\n<p>STEP 6. I set a deadline: after the holiday, students must hand in all the materials in full, in order, inside their folders, collectively to the class representative, who would organise them and give them to the teacher. I also asked everyone to pay attention at all times to the department website, email and announcements in the group, and to give feedback, building good habits for the community.<\/p>\n<p>How do you comfort disappointed students?<\/p>\n<p>Fortunately my students are all adults, though mostly 18 to 22 years old. At this point I personally feel that the teacher's role is to support and to practise alongside them. Every licensing exam, competition preparation, interview material preparation and internship job is an important learning opportunity for these young people, and also a good time to understand the realities of society.<\/p>\n<p>And I gain even more myself. It lets me look back at whether I am bravely facing the things I have been avoiding, because the two characters for \"teacher as role model\" (師範) are a verb, not a noun.<\/p>", "zt": "【如何安慰失望的學生】"}, {"id": "f1761126132", "file": "2025-10-22-f1761126132", "date": "2025-10-22", "title": "[HWU Travel Management USR Course x Lion Travel Young Lion Guide and Leader Programme]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Field Trips", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Lion Travel visited Hsing Wu University to promote its Young Lion Guide and Leader Programme, a training course combining classes, industry lecturers and field practice.", "len": 307, "body": "<p>[HWU Travel Management USR Course x Lion Travel Young Lion Guide and Leader Programme]<\/p>\n<p>Thank you to Vice President Lai and HR Director Lee of Lion Travel for visiting our campus today to promote Lion Travel's [Young Lion Guide and Leader Programme]. In the excellent practical presentation, Vice President Lai also mentioned the outstanding performance of alumnae of our Department of Travel Management within the company, and hopes to find travel elites through this programme.<\/p>\n<p>The Department of Travel Management at Hsing Wu University has always held that learning is not just studying marketing and management in the classroom, but taking students out of the classroom to see Taiwan, experience cruises and railways, and put talent cultivation and environmental sustainability into practice. Today Lion Travel has launched the \"Young Lion Guide and Leader Programme\", giving the school a chance to experience hands-on tour leading in Taiwan's green itineraries and sustainable railway tourism.<\/p>\n<p>The course held at Lion Travel's headquarters combines 👉 tour guide and tour leader training + lectures by industry instructors + on-site guiding practice, helping students go from \"loving travel\" to \"being able to lead groups\" and creating the most competitive new generation of travel professionals ✨<\/p>\n<p>✨Eligibility: students aged 18 or above who are interested in travel and tour leader work<\/p>\n<p>💡Registration period: from now until 2025.12.14<\/p>\n<p>📅Class time: 2026.01.10 to 2026.02.14 (one class per week)<\/p>\n<p>The registration method for the Lion Young Lion programme has been posted in the department's group chat. Students should put their passion into their résumés and personal statements. Travel Management students are encouraged to take part in the micro-credit courses and teacher consultations offered on campus. The teachers will teach you hand in hand how to write a résumé and personal statement. I look forward to seeing everyone enter the travel industry and head out into the world.<\/p>", "zt": "【醒吾旅運永續USR課程 X 雄獅旅遊幼獅導領計畫】"}, {"id": "f1759651894", "file": "2025-10-05-f1759651894", "date": "2025-10-05", "title": "Slowly the Sea Is Receding......", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "International Students", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A list of Taiwanese high schools and colleges that have stopped enrolling or closed, a sobering sign of the falling birth rate.", "len": 374, "body": "<p>Slowly the sea is receding......<\/p>\n<p>They say this is what happens before a tsunami......<\/p>\n<p>Some time ago I shared this thirty-year-old photo with my Vietnamese students, and a Vietnamese classmate in the class actually recognised family members in it.<\/p>\n<p>Many of the schools below have been visited for recruitment, and some of our students graduated from them. The impact of Taiwan's falling birth rate is enormous. Although Taiwan faces more problems than just this one, and neighbouring countries such as Japan and Korea are not much different, it looks as if the government has studied other countries' approaches and decided to let school corporations find their own way out within the scope of laws and regulations.<\/p>\n<p>Senior high schools across Taiwan that stopped enrolling in Academic Year 113:<\/p>\n<p>Private Kuanglung Vocational High School of Commerce and Home Economics, Keelung City<\/p>\n<p>Private Ching Chuan Vocational High School of Commerce, New Taipei City<\/p>\n<p>Private Nan Chiang Industrial and Commercial Vocational High School, New Taipei City<\/p>\n<p>Private Ta Ching Vocational High School of Commerce and Technology, Changhua County<\/p>\n<p>Private Tung Chi Senior High School, Chiayi County<\/p>\n<p>Private Jen Yi Senior High School, Chiayi City<\/p>\n<p>Private Yu Jen Senior High School, Taitung County<\/p>\n<p>Nanhai Yueguang Experimental School, Kaohsiung City<\/p>\n<p>Junior colleges, colleges and universities that stopped enrolling or closed in 2023-2025:<\/p>\n<p>Hwa Hsia University of Technology, New Taipei City<\/p>\n<p>Chung Hua University, Hsinchu County<\/p>\n<p>Chungchou University of Science and Technology, Changhua County<\/p>\n<p>Mingdao University, Changhua County<\/p>\n<p>Universal University of Technology, Yunlin County<\/p>\n<p>Ta Tung Institute of Technology, Chiayi City<\/p>\n<p>Taiwan Shoufu University, Tainan City<\/p>\n<p>Oriental Institute of Technology of Design, Kaohsiung City<\/p>\n<p>Ho Chun Institute of Technology, Kaohsiung City<\/p>\n<p>Yi-Kuan Tao Tienhuang College (formerly Kao Feng Institute of Technology), Kaohsiung City<\/p>\n<p>Tahan Institute of Technology, Hualien County<\/p>\n<p>Senior high schools confirmed to stop enrolling in Academic Year 114:<\/p>\n<p>Private Dacheng Senior High School, Miaoli County<\/p>\n<p>Private Yu Min Vocational Home Economics School, Miaoli County<\/p>\n<p>Private Hsien Te Vocational High School, Miaoli County<\/p>\n<p>Private Hsin Jung Senior High School, Tainan City<\/p>\n<p>Senior high schools that stopped enrolling long ago:<\/p>\n<p>Private Kai Ming Industrial and Commercial Vocational High School, New Taipei City<\/p>\n<p>Private Hsieh Chih Industrial and Commercial Vocational High School, Chiayi County<\/p>\n<p>Private Feng Ho High School, Tainan City<\/p>", "zt": "慢慢地海水退了......"}, {"id": "f1756391840", "file": "2025-08-28-f1756391840", "date": "2025-08-28", "title": "Amazing Thailand", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Bangkok, Thailand", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A Bangkok trip index of nine daily videos, opened with Yukio Mishima's description of Thailand from The Temple of Dawn.", "len": 256, "body": "<p>Amazing Thailand<\/p>\n<p>I once read a passage in which Yukio Mishima describes the Bangkok royal court: \"In a land where temples glitter and flowers and fruit cover the fields, people under the languid sun devote themselves wholeheartedly to worshipping the Buddha and firmly believe in reincarnation, yet they shun and evade any orderly system of theory, possessing an indolence as heavy as gold, and a spirit that sways unmoving in the breeze beneath the trees.\" - Yukio Mishima, <em>The Temple of Dawn<\/em><\/p>\n<p>As I sort through each day's itinerary and photos, I use words to savour the air of Siam once more, recalling the brilliant, scorching sun, Wat Arun (the Temple of Dawn) glowing like gold in the evening breeze along the Chao Phraya River, and people on a different wavelength from mine. Together with travellers from all over the world met along the way, I was a little amazed by Thailand.<\/p>\n<p>Day 1 Bangkok trip: rest and learning<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1G4z9v1puq/\">https://www.facebook.com/share/v/1G4z9v1puq/<\/a><\/p>\n<p>Day 2 Khlong Saen Saep canal boat experience<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1B1sad6Qix/\">https://www.facebook.com/share/v/1B1sad6Qix/<\/a><\/p>\n<p>Day 3 Klook group tour of the Maeklong Railway Market and floating market<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1DKsauQxae/\">https://www.facebook.com/share/v/1DKsauQxae/<\/a><\/p>\n<p>Day 4-1 Bangkok Central Station and Hong Sieng Kong coffee shop<\/p>\n<p><a href=\"https://www.facebook.com/share/v/19ejjkxzTK/\">https://www.facebook.com/share/v/19ejjkxzTK/<\/a><\/p>\n<p>Day 4-2 Going downstream on the Chao Phraya River<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1B3WMuHz6v/\">https://www.facebook.com/share/v/1B3WMuHz6v/<\/a><\/p>\n<p>Day 5 Chulalongkorn University campus and Banthat Thong Road night market<\/p>\n<p><a href=\"https://www.facebook.com/share/p/19VQVRcRUC/\">https://www.facebook.com/share/p/19VQVRcRUC/<\/a><\/p>\n<p>Day 6 Kanchanaburi's Death Railway, zoo and the dream-come-true trip to the Bridge on the River Kwai<\/p>\n<p><a href=\"https://www.facebook.com/share/v/19qStX56hP/\">https://www.facebook.com/share/v/19qStX56hP/<\/a><\/p>\n<p>Day 7 The unforgettable travel scare of the final day<\/p>\n<p><a href=\"https://www.facebook.com/share/p/19BaQSXvj7/\">https://www.facebook.com/share/p/19BaQSXvj7/<\/a><\/p>\n<p>Day 8 Some small takeaways from the Bangkok trip<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1MgFBs5by8/\">https://www.facebook.com/share/v/1MgFBs5by8/<\/a><\/p>", "zt": "Amazing Thailand"}, {"id": "f1756130533", "file": "2025-08-25-f1756130533", "date": "2025-08-25", "title": "Bangkok Trip Day 6: A Dream Come True at Kanchanaburi's Death Railway, Zoo and the Bridge on the River Kwai", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Bangkok, Thailand", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A day trip to Kanchanaburi, ticking off a bucket-list destination: the Death Railway, the River Kwai bridge, good travel companions and a chat with Thai students.", "len": 422, "body": "<p>2025.8.2<\/p>\n<p>Bangkok Trip Day 6: A dream-come-true trip to Kanchanaburi's Death Railway, the zoo and the Bridge on the River Kwai<\/p>\n<p>I remember that during the pandemic I listed several travel destinations I looked forward to in life, and today's Bridge on the River Kwai and Death Railway is one of them. When the car reached the broad River Kwai, I truly couldn't imagine how they could have built a bridge here back then! The river span crossed by the bridge in the film wasn't nearly as grand as what we saw today. I think the foreign friends there all felt the same about the gap between the film and the real location.<\/p>\n<p>In fact, when we first arrived in Bangkok, the driver who took us to the hotel asked where we wanted to go. When we mentioned the River Kwai, he said the expressway from Bangkok to Kanchanaburi had been completed, so the drive can be kept within two hours, more comfortable than before. Otherwise a one-day trip to the River Kwai bridge and Death Railway would be a rather hard journey.<\/p>\n<p>This itinerary was a Bangkok holiday tour we booked in Taiwan, where travel companions from different places ride together in a nine-seat minivan. Today's companions were all quiet fellow travellers, and the guide didn't chat nonstop and even took lots of lovely photos of our family. The two groups of young people in the same car were also punctual and quiet, and listened to the explanations very seriously and attentively. It really is nice to have good travel companions. By contrast, I often drifted off and then asked more questions, becoming the \"nagging adult\" in my children's words.<\/p>\n<p>The Death Railway trip was full of local culture and flavour. At the country station the number of mosquitoes was astonishing, so we tried to walk around along the tracks to avoid being attacked by unknown bugs. The train was also, as usual, late, and things only improved once the long, slow train finally pulled in.<\/p>\n<p>On the full carriage we met a group of Chinese-department students from Suan Sunandha Rajabhat University in Bangkok, who chatted with us about their motivation for learning Chinese, and we did a little citizen diplomacy. They also recommended the snacks sold by vendors on the train, and after getting off they shared the best viewing spot with our family, so we could record, from the best angle, the destination I had long held in my heart as a lifetime travel goal. I was very satisfied.<\/p>", "zt": "曼谷旅遊Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢…"}, {"id": "f1756049393", "file": "2025-08-24-f1756049393", "date": "2025-08-24", "title": "Bangkok Trip Day 5: Chulalongkorn University Campus and the Banthat Thong Road Night Market", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Bangkok, Thailand", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray and his family wander the open campus of Chulalongkorn University in central Bangkok, then eat along the lively Banthat Thong Road food street.", "len": 607, "body": "<p>2025.8.1<\/p>\n<p>Bangkok Trip Day 5: Chulalongkorn University Campus and the Banthat Thong Road Night Market<\/p>\n<p>It turns out Chulalongkorn University sits in the very heart of Bangkok. The whole campus is just south of BTS Siam Station, close to department stores and the shopping district. Thai university students also wear uniforms to school. Different schools' uniforms are naturally a little different, but we couldn't tell which school's students were wearing what.<\/p>\n<p>In the middle of the trip, we had long planned to visit Chulalongkorn University. I was a bit worried we would be kept outside iron gates, as at Tsinghua University in Beijing or the Southwest Associated University site in Kunming, and the many sources I looked up said little about how to visit a campus in downtown Bangkok. As it turned out, Chulalongkorn, Thailand's top-ranked university, is just like National Taiwan University: every part of the campus has an entrance, and even tuk-tuks can drive in, with no controls at all. Come to think of it, this is surely what a university is for. If a university has strict access control, then however high it ranks in the world, will the talent it trains have an open mind, a reverence for civilisation and truth, and self-reflection before learning and knowledge? All of these would raise a few more question marks because of the gate.<\/p>\n<p>The Chula campus is large, with a beautiful university history museum in royal-style architecture, and the faculties are spread across different areas. Along the way we strolled past the Faculty of Design and the Faculty of Engineering, and also went to the Faculty of Education and the Faculty of Law, where students were preparing summer camp activities and academic workshops. The campus is lush and green and well planned, students on the sports field were playing football, and the whole atmosphere was like visiting the University of Tokyo campus earlier this year: free, open and professional, which makes one long to be there. Later, when I looked up more information, I found that quite a few Taiwanese students study at this school, and the career prospects after graduating from Thailand's top institution are full of potential. I remember that in 2012, when I organised the Asia Tourism Forum, the professor from Chulalongkorn's Faculty of Architecture who visited Hualien presented research on tourism at Thailand's World Heritage sites. Thailand is a tourism powerhouse, and I truly envy its rich research resources in history and culture.<\/p>\n<p>Walking out of the campus, you reach Banthat Thong Rd., the Chulalongkorn University food street that tourists love. This stretch of Banthat Thong Road, with food shops clustered along more than a kilometre, starts to feel lively from around four or five in the afternoon, and is a food centre for tourists and locals alike. Along the road there are quite a few Michelin-listed or internet-famous shops, so you can stroll and consider what to eat. Most of the shops are proper storefronts, and the dining environment is much better than Bangkok's other night markets or street stalls.<\/p>\n<p>On the first day of August, we walked 18 kilometres and 25,376 steps in downtown Bangkok. Because Bangkok is hot, we ate as we went and enjoyed quite a few restaurants we stumbled upon, and the MyBeer we tried for the first time was delicious too, adding to the fun. For our dinner of grilled meats and hotpot we could pay only in Thai baht, but the prices were even more transparent and reasonable, and the toilets and dining environment were of a good standard. The night view and atmosphere of the food street were romantic and enjoyable. Highly recommended.<\/p>", "zt": "曼谷旅遊Day5 朱拉隆功大學校園及班塔通路夜市"}, {"id": "f1754820004", "file": "2025-08-10-f1754820004", "date": "2025-08-10", "title": "Bangkok Trip Day 4-2: Down the Chao Phraya River", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Bangkok, Thailand", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A river boat to the Asiatique night market, a Calypso cabaret show with Thai dinner, and tips on getting around the Chao Phraya at night.", "len": 458, "body": "<p>2025.7.31<\/p>\n<p>Bangkok Trip Day 4-2: Down the Chao Phraya River<\/p>\n<p>The Chao Phraya River (Menam River) is 1,352 kilometres long, with a drainage basin of 150,000 square kilometres, about one third of Thailand's land area. Many of Bangkok's representative tourist attractions stand beside the river. Years ago, when I came to Bangkok with students on their graduation trip, the water of the Chao Phraya was blue, but this time we saw a muddy yellow-brown, and the water was also much higher because of the rainy season.<\/p>\n<p>The next part of the itinerary was to take the cheap Chao Phraya river boat to the riverside night market, with a Ladyboy cabaret show in the evening. But we then found that the Marine Dept stop could only take us to the stop before Asiatique. I asked the lady at the Wat Rat Singkhon pier, and she said it was just a short walk next to it, and that the pier only runs until 18:00 and was about to close, with no more boats after that. So the three of us strolled towards the Ferris wheel. Primary school students next to the pier were just getting out of school, and we went with them to buy cheap ice cream and lemon tea, and sat down for a while to enjoy the air conditioning.<\/p>\n<p>On my last graduation trip with students on a package tour, we saw the Tiffany's Show (Jin Dongni cabaret), which I don't recommend much. This time my family said that coming to Thailand without seeing one felt like missing something, so we booked a dinner with the CALYPSO cabaret show and traditional Thai dance through Klook. There were not many people at dinner and the food was ordinary, but having traditional Thai dance with the meal was fun, and afterwards we could take photos before moving to the stage area to watch the show. The CALYPSO show was spectacular, with great lighting, sound and stage effects. I recorded a short clip for reference, and I really recommend seeing it live.<\/p>\n<p>The atmosphere at the riverside market at night is great, with quite a few restaurants where you can drink and listen to music. I would suggest just watching the show or Muay Thai and then moving to a riverside restaurant to eat and chat. The night view of the Chao Phraya is much better than by day, with a gentle cool breeze and drifting music. Many people take various kinds of cruise to tour the river, which also looks nice, and is worth trying if you get the chance. Later a student told me the night cruises come in different grades, and there are even adult versions. Please look them up online yourself. I don't know about that!<\/p>", "zt": "曼谷旅遊 Day4-2 湄南河順流而行"}, {"id": "f1754150242", "file": "2025-08-02-f1754150242", "date": "2025-08-02", "title": "Bangkok Trip Day 6: Kanchanaburi's Death Railway, Zoo and the Bridge on the River Kwai, a Dream Come True…", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Bangkok, Thailand", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray fulfils a long-held travel wish, visiting the Bridge on the River Kwai and riding the Death Railway on a day trip from Bangkok with his family.", "len": 418, "body": "<p>2025.8.2<\/p>\n<p>Bangkok Trip Day 6: Kanchanaburi's Death Railway, Zoo and the Bridge on the River Kwai, a Dream Come True…<\/p>\n<p>During the pandemic I made a list of several travel destinations I looked forward to in life, and today's Bridge on the River Kwai and Death Railway is one of them. When the car reached the broad River Kwai, I truly couldn't imagine how they managed to build a bridge back then! The river that the Bridge on the River Kwai spans in the film isn't as grand as what we see today. I think the foreign friends present must have felt the same about the gap between the film and the real place!<\/p>\n<p>In fact, when we first arrived in Bangkok, the driver who took us to the hotel asked where we wanted to go. When we mentioned the River Kwai, he said the expressway between Bangkok and Kanchanaburi has been built, so the drive can be kept within two hours and is more comfortable than before. Otherwise a day trip to the Bridge on the River Kwai and the Death Railway would be quite a gruelling journey.<\/p>\n<p>This tour was booked in Taiwan, a Bangkok holiday group tour, where travel companions from different places share a nine-seater minivan. Today's companions were all quiet travellers, and the guide didn't chat constantly, and also took lots of lovely photos of our family. The two groups of young people in the same van were punctual and quiet, and listened to the commentary attentively and seriously. I really felt that having good travel companions is wonderful. It was I who often drifted off and then asked more questions, becoming the \"nagging adult\" in my children's words.<\/p>\n<p>The Death Railway trip is full of local flavour. At the countryside station the number of mosquitoes was astonishing, so we walked around between the tracks as much as we could to avoid being attacked by unidentified insects, and the train was, as usual, late. Things only got better when the long, slow train rolled in.<\/p>\n<p>On the full carriage we met a group of Chinese Department students from Suan Sunandha Rajabhat University in Bangkok, who chatted with us about their motivation for learning Chinese, a bit of citizen diplomacy. They also recommended the snacks sold by vendors on the train, and after getting off they shared the best viewing spot with our family, so that we could record, from the best angle, this destination in my life's travel list. I was extremely satisfied.<\/p>", "zt": "曼谷旅遊Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢…"}, {"id": "f1753983024", "file": "2025-08-01-f1753983024", "date": "2025-08-01", "title": "Bangkok Trip Day 4: Drifting Down the Chao Phraya", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Bangkok, Thailand", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "On day four in Bangkok, Ray reflects on the Chao Phraya River and shares six candid conclusions from a family self-guided trip, from fashion to heat and ticket prices.", "len": 478, "body": "<p>2025.7.31<\/p>\n<p>Bangkok Trip Day 4: Drifting down the Chao Phraya (Mae Nam)<\/p>\n<p>The Chao Phraya River is 1,352 kilometres long, with a basin of 150,000 square kilometres, about one third of Thailand's land area. Many of Bangkok's representative tourist attractions stand along the river. When I came to Bangkok with students many years ago, the water of the Chao Phraya was blue, but this time we saw a muddy earth-yellow, and the water level was much higher because of the rainy season.<\/p>\n<p>The 2024 academic year (ROC year 113) ends today. In the blink of an eye, in a few more years I will have been a teacher for 20 years. My first business trip to Thailand was in 2006, and the Bangkok trip with the graduating class of the Hualien hospitality department is a cherished memory.<\/p>\n<p>On this family self-guided trip, both of my family members were in Thailand for the first time. Their reactions were that prices in Thailand are close to Taipei's, and food choices are fewer than imagined, especially with a family member who can't eat spicy food, when there are almost no choices.<\/p>\n<p>After walking around all day, I came to several conclusions:<\/p>\n<ol>\n<li>\n<p>Reasonably priced clothing isn't worth buying or browsing. The fashion isn't in sync with Taipei, so it's hard to find clothes that suit you.<\/p>\n<\/li>\n<li>\n<p>The connections between the metro and the major attractions are still insufficient, and the pedestrian and transport friendliness is similar to New Taipei and Taoyuan, with no sense of leisure.<\/p>\n<\/li>\n<li>\n<p>The service industry makes up too large a share in Thailand, and I didn't feel any striving or drive. Put another way, there is not enough learning in digital nomad or competitiveness terms. I can only say I envy the Thais, but we are not them and it's hard to appreciate.<\/p>\n<\/li>\n<li>\n<p>There isn't enough variety in restaurants. Most are local restaurants or street food where hygiene and safety can't be guaranteed. The water also doesn't taste good, so we could only drink bottled water.<\/p>\n<\/li>\n<li>\n<p>Hotel prices are lower than in Taiwan and service is more flexible, with enough staff to support service quality, but travel from point to point is still not up to standard.<\/p>\n<\/li>\n<li>\n<p>The tourist attractions near Bangkok have no huge highlights. The fees for historical sites are heavily commercial, and admission prices have reached the point of giving up. On top of that, the tropical climate all year round makes it feel like you can't go out in the daytime, and the humid heat makes you not want to go out.<\/p>\n<\/li>\n<\/ol>\n<p>Overall, it isn't easy to revisit Bangkok. After visiting Thailand three times, I still can't find a motive to travel there, and I especially don't recommend it for older people. But young people and first-time visitors can treat this deeply international city as a touchstone to add to their travel experience points.<\/p>", "zt": "曼谷旅遊Day4 湄南河順流而行"}, {"id": "f1753195194", "file": "2025-07-22-f1753195194", "date": "2025-07-22", "title": "Moving House Eighteen Times", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "Childhood", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Inspired by Jonathan Lee's wandering life, Ray lists the 18 homes he moved through in his first 40 years, born in Taichung.", "len": 180, "body": "<p>Jonathan Lee (Lo Ta-yu) wandered the world, romantically searching for himself. Unwilling to be labelled, he left his familiar hometown and drifted around New York, Hong Kong and Beijing, moving 19 times in all.<\/p>\n<p>I, a nobody, moved 18 times in the first part of my short 40 years of life. But I was forced to face reality, a life like a sesame seed (a \"daughter's fate\" like the oil-hemp seed, as the Taiwanese saying goes), hoping to live every moment as much like a human being as I could.<\/p>\n<p>0 Born in Taichung<\/p>\n<p>1-2 Rental in Yonghe<\/p>\n<p>2 Factory dormitory in Guandu<\/p>\n<p>2-4 Rental in Guandu<\/p>\n<p>5-12 Apartment in Banqiao<\/p>\n<p>12-21 Apartment in Zhonghe<\/p>\n<p>22 Rental on Lane 514 near Fu Jen University<\/p>\n<p>23 Training in Chiayi<\/p>\n<p>24 Army unit in Longgang, Taoyuan<\/p>\n<p>24-25 Rental on Tongshan Street, Taipei<\/p>\n<p>25-29 Mid-rise building in Sanchong<\/p>\n<p>29 Staying with others in Guting<\/p>\n<p>30-34 Apartment in Muzha<\/p>\n<p>34-35 Rental in a building in Qijiaochuan, Hualien<\/p>\n<p>35-40 Zhixue community, Shoufeng<\/p>\n<p>40-41 Building in Meilun, Hualien<\/p>\n<p>42 Rental in Linkou<\/p>\n<p>43~ Building in Linkou<\/p>", "zt": "羅大佑流浪世界浪漫地找尋自我；在不願被標籤化的情況下，羅…"}, {"id": "f1752924651", "file": "2025-07-19-f1752924651", "date": "2025-07-19", "title": "The Deadliest Human Wars in the World, Ranked by Death Toll", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Current Affairs", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A ranking of history's bloodiest wars by death toll, from World War II down to the Thirty Years' War, with a reminder to cherish peace.", "len": 162, "body": "<p>2025.7.19<\/p>\n<p>Among the deadliest human wars in the world, ranked by number of deaths, first place goes to the Second World War, followed by the Mongol invasions of Eurasia. Third is the war of the Three Kingdoms of Wei, Shu and Wu after the collapse of the Han Empire. The novel <em>Romance of the Three Kingdoms<\/em> is a tragedy written with 34 million lives. Given East Asia's population then, nearly everyone on the land lived in fear. If you list the later wars too, you will be even more surprised how many bloody wars there were in your own region's history!<\/p>\n<ol start=\"4\">\n<li>\n<p>Taiping Rebellion (30 million)<\/p>\n<\/li>\n<li>\n<p>Qing conquest of China (25 million)<\/p>\n<\/li>\n<li>\n<p>First World War (22 million)<\/p>\n<\/li>\n<li>\n<p>Timur's westward expansion (17 million)<\/p>\n<\/li>\n<li>\n<p>Tang An Lushan Rebellion (13 million)<\/p>\n<\/li>\n<li>\n<p>Russian Civil War (10 million)<\/p>\n<\/li>\n<li>\n<p>Chinese Civil War (9 million)<\/p>\n<\/li>\n<li>\n<p>The Crusades (9 million)<\/p>\n<\/li>\n<li>\n<p>Thirty Years' War of the Holy Roman Empire (8 million)<\/p>\n<\/li>\n<\/ol>\n<p>We who live in comfort should cherish peace!<\/p>\n<p>Image source: @civixplorer<\/p>", "zt": "世界上最慘烈的人類戰爭，以人數來統計，位居榜首的是第二次…"}, {"id": "f1752662603", "file": "2025-07-16-f1752662603", "date": "2025-07-16", "title": "Is It Wrong to Have No Great Ambitions and Just Be Yourself?", "cat": "Personal Finance", "cats": ["Personal Finance"], "sub": "Money Management", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Lying flat takes financial backing. Thoughts on electricity bills, a month of illness and pressure, and a difficult conversation with my father about work and effort.", "len": 415, "body": "<p>2025.7.16<\/p>\n<p>Is it wrong to have no great ambitions and just be yourself?<\/p>\n<p>To lie flat, you need something to fall back on! You open your eyes and see the air conditioner in the room blowing cool air evenly, with the bright sun blazing outside the shut window. What do you think of?<\/p>\n<p>I think of how the air blowing out is bought with money. Three summers ago, perhaps because of the pandemic, our household electricity bill came to more than NT$10,000. Thankfully it was just that once; the months before and after were still in the thousands, which is reasonable and manageable.<\/p>\n<p>Just that one time, it was out of control and there was nowhere to turn for help, so I obediently paid the power company. I truly felt that every resource around us can be quantified, and if you don't pay attention it can suddenly spiral out of control to an unacceptable level.<\/p>\n<p>This bout of illness is slowly ending. I sorted out the dates on my prescriptions and thought it over: this past month began with the pressure of taking over industry-academia cooperation and preparing for the TOEIC. My mouth said it was fine, but I spent the whole month trapped in a struggle between mind and body.<\/p>\n<p>The other day I talked with my father about the competition between myself and my child over studies, work and all kinds of values. His answer was simply that we should be spectators and not care too much. That irritated me a little. When I came of age, he was nearly fifty and spent all day wishing he could retire and not work. The whole family once asked whether he'd like to drive a taxi or learn a small skill like fixing appliances, so that he'd at least have something to do rather than watching TV at home all day. Later he even copied rich people and took up golf. After I had a child, I got so angry that I stopped his monthly filial allowance, and he was unhappy about it, even hiring a car to come to Hualien to scold me.<\/p>\n<p>Spending money is like breathing: no learning required. Lying flat is an even more innate ability. It saddens me that my own family has this mindset, and I don't know why, since childhood I have been rebellious and contemptuous of this pattern, insisting on fighting to the bitter end over everything, though I have stumbled along all the way to today.<\/p>", "zt": "胸無大志做自己不行嗎？"}, {"id": "f1751029015", "file": "2025-06-27-f1751029015", "date": "2025-06-27", "title": "Summer Vacation Has Really Started, and I Am Learning How to Relax", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "From childhood summers in Taichung to teenage summers of factory work, Ray is learning how to spend a real summer break at last.", "len": 440, "body": "<p>2025.6.27<\/p>\n<p>Summer vacation has really started, and I am going to learn how to spend it with a peaceful mind!<\/p>\n<p>Before elementary school, my summers were always spent in the Five Villages of National Chung Hsing University in Taichung. Every day passed gently and quietly, and at night I fell asleep to the sound of insects. When I got up in the morning, Grandpa and Grandma were actually already out, but they would leave a rich breakfast in the cupboard, and I could enjoy a delicious handmade Chinese breakfast all to myself.<\/p>\n<p>But after I returned to Taipei for junior high school, my summers changed. They were not about the study and cram schools that 13- and 14-year-olds care about. The summer between sixth grade and seventh grade I still spent in Taichung, and I innocently started junior high, only to find out at the start of term that there was an English subject you had to prepare for in advance, and I could not even recognise the 26 letters. What I remember is that the summer when I moved from the B-track class in seventh grade up to the A- class in eighth grade, I did odd jobs at an electronics factory. After eighth grade, because I had been promoted to the A+ class, there were full-day classes all week and no summer at all. The summer after I got into the Affiliated Senior High School of National Taiwan Normal University I also worked part-time. The proportion of earning money naturally grew with age, so naturally that I felt it was perfectly normal and just how things were. This is a lesson of life at the bottom, and only in recent years have I slowly come to understand that this mindset can keep you from ever turning things around.<\/p>\n<p>Now my child is at university, and the school has given us a full sixty days of summer break. After being busy for half my life, I am suddenly at a loss. It turns out that spending a summer vacation also has to be learned. These past few days I have first planned language exams and a self-study plan, plus an evening travel sketching and watercolour class. Of course my ongoing exercise will not stop, and I am even considering switching to morning workouts and study, so that while the daytime heat fills the air I have a regular routine of peaceful rest, swimming and fitness.<\/p>\n<p>At the same time I am still hoping that the industry college project is approved, and I want to use it to add more fuel to my doctoral studies and open up more opportunities.<\/p>", "zt": "真正開始放暑假了，我要學著如何安心地過暑假！"}, {"id": "f1750581489", "file": "2025-06-22-f1750581489", "date": "2025-06-22", "title": "Retirement Honours, and Taiwan's Five-Year Colleges in 1992", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "Admissions & Falling Birth Rate", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "At a retirement ceremony, colleagues counted 35 years in teaching. Ray looks back at the northern five-year college admission scores of 1992 and the schools that have since vanished.", "len": 213, "body": "<p>Not long ago the college office held a retirement recognition ceremony, giving professors a little time to share their thoughts. Several of them used staff numbers 079 or 078 to show they had devoted 35 or 36 years to education, and had finally reached mandatory retirement age, full of joy.<\/p>\n<p>The attached picture shows the 1992 (ROC year 81) admission scores for five-year junior colleges in northern Taiwan. Counting up, there were only a few such colleges back then, and our Hsing Wu had only five departments: Accounting, International Trade, Business Administration, Banking and Insurance, and Tourism. Look closely and you will see that Hsing Wu was the only five-year college in northern Taiwan with a Tourism department. The admission score then was not low, and it still often makes senior teachers proud.<\/p>\n<p>Among the schools on the list, Hwa Hsia, Fu Hsing and Ta Han have closed down. By contrast, the national Yilan Agricultural and Industrial college has been upgraded to National Ilan University, and quite a few other schools have been renamed so many times that nobody knows what they are called now!<\/p>\n<p>I took the northern five-year college joint entrance exam in 1987 (ROC year 76). I wonder whether I can find the newspaper from that year?<\/p>\n<p>Photo source @luke.lee.129<\/p>", "zt": "前陣子學院辦公室辦了退休表揚會，讓教授們有一點點的時間聊…"}, {"id": "f1749389471", "file": "2025-06-08-f1749389471", "date": "2025-06-08", "title": "Keelung Port Cruise Tour Leading Micro-Course", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Careers & Courses", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "HWU students boarded a Star Cruises ship at Keelung Port for a micro-course on leading cruise tours, leaving them excited about cruise careers.", "len": 165, "body": "<p>2025.6.8<\/p>\n<p>Keelung Port Cruise Tour Leading Micro-Course<\/p>\n<p>\"Travelling ten thousand miles beats reading ten thousand books\" is too old-fashioned, but today's micro-course gave me, as a teacher, a sense of novelty and focus that talking for a dozen hours in the classroom could not match compared with actually boarding the ship. The smiles in the students' photos say it all.<\/p>\n<p>Many thanks to Secretary-General You and Mr. Yi of the Taiwan International Cruise Association for their great support and help. The Hsing Wu University (HWU) teachers and students all felt they gained a great deal! My deepest thanks also go to Senior Manager Cassie Chou, official ambassador of Star Cruises, for her heartfelt sharing and introduction. The students now have a deeper level of expectation and understanding about cruise work!<\/p>\n<p>Everyone said they want to plan a Star Cruises trip with their families this summer!<\/p>\n<p>Quite a few students also said they look forward to a Star Cruises job for their senior-year internship!<\/p>\n<h1>WorldOceansDay<\/h1>\n<h1>NationalBestFriendsDay<\/h1>", "zt": "基隆港郵輪旅遊領團行動微課程"}, {"id": "f1747562108", "file": "2025-05-18-f1747562108", "date": "2025-05-18", "title": "How to Spot and Stay Away from Get-Rich-Quick Schemes", "cat": "Personal Finance", "cats": ["Personal Finance"], "sub": "Investing & Economy", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "From real estate seminars to online briefings, get-rich-quick pitches follow the same pattern. Ray shares six rules for staying away and the cycle to watch for.", "len": 281, "body": "<p>2025.5.18<\/p>\n<p>I often see posts in my feed about quick money-making and getting rich. The overall pattern looks unchanged after many years. More than thirty years ago I attended a real estate investment conference in Tianmu and a never-ending briefing on selling aloe vera, and wanting to earn a bit more, I also went to \"briefings\" for Amway, Nu Skin and Shaklee. But because I am suspicious and stingy by nature, the most I ever did afterwards was open a small account on Yahoo or eBay to sell old stuff, and I never dared to make any quick money at all.<\/p>\n<p>Such \"briefings\" have moved from in-person to online and are all around us, held everywhere for different groups and audiences. Up to now, none of the classmates or friends who got involved back then has stuck with it to this day, and I haven't seen anyone who became wealthy year after year through quick money.<\/p>\n<p>How do you tell them apart and stay away?<\/p>\n<ol>\n<li>\n<p>Don't attend any briefing.<\/p>\n<\/li>\n<li>\n<p>Don't try or taste any health product.<\/p>\n<\/li>\n<li>\n<p>Be suspicious of any sales job opportunity that comes looking for you.<\/p>\n<\/li>\n<li>\n<p>Put NT$10,000 of each month's salary into a fixed deposit first. If you have no spare money, you won't think wildly.<\/p>\n<\/li>\n<li>\n<p>Don't use brand-name goods or luxury cars to make friends.<\/p>\n<\/li>\n<li>\n<p>Watch whether family, friends or parents have unusual spending or a new circle of friends.<\/p>\n<\/li>\n<\/ol>\n<p>Online ad &gt; briefing &gt; feel the taste of money through an experience &gt; invest money &gt; get a little money &gt; invest more &gt; get money &gt; bring people to the briefing &gt; borrow money to invest &gt; briefing and results conference &gt; invest more<\/p>\n<p><a href=\"https://www.facebook.com/share/p/1C7QFP2Vcf/\">https://www.facebook.com/share/p/1C7QFP2Vcf/<\/a><\/p>", "zt": "常在動態中看到可以獲利致富的賺快錢訊息，整體看起來形態多…"}, {"id": "f1746979699", "file": "2025-05-12-f1746979699", "date": "2025-05-12", "title": "Life Is Bitter and Short", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Family & Pets", "src": "Facebook", "url": "https://www.facebook.
