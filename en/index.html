com/chenrayfong", "ex": "Hearing the closing words of a witch-shop owner's interview, I reflect on how the same four words mean something very different to me, shaped by my upbringing.", "len": 241, "body": "<p>2025.5.11<\/p>\n<p>Life Is Bitter and Short<\/p>\n<p>This was the final conclusion given by the owner of the Witch Shop in an interview I just listened to. The same four words mean something completely different to me, having grown up in a different family. Her interpretation is that because people are living very happily, they worry that life is too short; mine is that life is bitter and not long either, so why bother coming through it at all? Isn't that negative?<\/p>\n<p>The attached study, on how Japanese people's sense of time differs by age, surprised me a little. It turns out I really do have that feeling now that a whole year passes as if it were only a week, but looking back it is bitter and hard to recall.<\/p>\n<p>I really feel that happiness in this life depends on comparison with those around us. I was born into a very ordinary family, and as a child I even thought we were comfortably off, but compared with the families of my classmates from junior high school onward, my family background really could not have been more ordinary, and this made for a big gap in my later values and perceptions. Add to that a partner who is also very realistic and takes a sceptical stance toward everything in life that requires imagination, and life is truly bitterness on top of bitterness, and whether it is short or long matters even less.<\/p>", "zt": "人生苦短"}, {"id": "f1746709811", "file": "2025-05-08-f1746709811", "date": "2025-05-08", "title": "At Noon I Strolled Off Campus for Beef Soup Dumplings...", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Everyday Notes", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A simple lunch walk brings back Ray's sense of romance and dreaming, and he resolves to keep that imaginative side of himself alive.", "len": 212, "body": "<p>2025.5.8<\/p>\n<p>At noon I strolled off campus for beef soup dumplings. A kind of relaxed, romantic feeling I once longed for and experienced returned to my body, and I could feel happiness and dreams again.<\/p>\n<p>I have always loved fantasy and dreaming. I always hope that, beyond reality, life has a different outlook to answer this ruthless world. Take lunch, for example. Why should it only be about filling the stomach? In the past I would imagine, in a calm and cheerful mood, breathing the gentle air, looking at the flowers and grass beside the path, stepping towards the canteen one step at a time, and ordering a meal that satisfies my taste and all five senses, imagining everything beautiful and every day peaceful.<\/p>\n<p>True, the world isn't like that, but surely I have the right to fantasise. Why should this ability be taken from me, forcing me to face reality at every moment? I don't like it and I am unwilling, so I will practise. I will practise bringing this ability back to myself and keeping it firmly in my soul. Because of this, I can love myself, like the environment and people around me, fall in love with this world again, and walk happily towards the end of my life.<\/p>", "zt": "中午漫步去校園外吃牛肉湯餃，某種曾經期待且體驗的輕鬆浪漫…"}, {"id": "f1746626301", "file": "2025-05-07-f1746626301", "date": "2025-05-07", "title": "Designing Class Activities for Experiential Tour Guiding Games", "cat": "Game-Based Learning", "cats": ["Game-Based Learning"], "sub": "MEG Educational Games", "det": "Class & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Designing real-world games for tour guiding classes is exhausting, but a fair, app-based, shared-experience lesson plan keeps students engaged.", "len": 252, "body": "<p>2025.5.7<\/p>\n<p>In class I always have to design activities that let students experience the real-world games a tour guide has to lead. The process is actually very tiring. When I explain things in the classroom with text or video, few students are really focused on understanding. When I ask everyone to go out of the classroom and experience an activity, I have to urge them again and again, and some reactions make me feel that I am interrupting their mobile game time.<\/p>\n<p>So the lesson plan has to be carried out in order:<\/p>\n<ol>\n<li>\n<p>Take turns in groups, watching closely for fairness so that no one does nothing.<\/p>\n<\/li>\n<li>\n<p>Use a phone app so that activity photos are uploaded in sync, with instant scoring and bonus points for likes. Students who don't take part and don't upload photos get no points.<\/p>\n<\/li>\n<li>\n<p>Share and have fun afterwards to build a shared feeling.<\/p>\n<\/li>\n<\/ol>\n<p>So people who didn't come to class don't know what we did. Of course some students upload other people's photos. I don't catch them in the public domain, but I can send the student a private message to show I care.<\/p>\n<p>In class like this the students all find it very interesting. It is just that the teacher who designs the activity pays out of pocket for teaching aids and arranges a plan mixing the virtual and the real for just 2 periods, and after getting through the 2 periods, by the time I speak with students again I have no voice left.<\/p>", "zt": "在學校上課總要設計一些活動來體驗旅遊中需要指導的實境遊戲…"}, {"id": "f1744876446", "file": "2025-04-17-f1744876446", "date": "2025-04-17", "title": "Third Life: 836 Days to Go", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Everyday Notes", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Weighing a doctorate against a return to the travel industry, I decide to build my network and tour-leading experience before a possible forced retirement in three years.", "len": 387, "body": "<p>2025.4.17 Third Life: 836 days to go<\/p>\n<p>Some things, once done, you can brag about for a lifetime;<\/p>\n<p>Some things, if you only think about them, you will be nagged about for a lifetime.<\/p>\n<p>I am very grateful to my student for the introduction. Whatever happens in the future, I must remember the kindness shown today. Yesterday, while watching a drama, one line moved me, about \"making a decision\".<\/p>\n<p>A colleague asked the female lead: It's been hard lately, hasn't it?<\/p>\n<p>The female lead: Actually it's fine. The hardest thing is when you can't make a decision.<\/p>\n<p>I am long used to the life of teaching, and the regular income and rhythm make it hard to go back to a workplace in the service industry. But I know that from the moment I had this thought, it meant my life would end right here, and all its splendour and possibility would be zero. These past few days I thought it over and over, torn both ways, and in the end it was the line in the drama that turned my thinking into action.<\/p>\n<p>I have set aside the idea of a doctorate in cultural architecture and urban planning and deleted the time slots from my calendar. I also asked a student who works as a tour leader on European tours in the travel industry about the possibility of part-time work, and he quickly referred possible contacts to me. I was very moved, because this is not easy. I know quite a few people in the travel industry, and many are known for their connections and often mention their relationships, but even getting a chance to meet is not easy, and even when I told my own classmates I wanted to lead groups, they would say it was the arrangement of the tour operator. Hard indeed, hard indeed.<\/p>\n<p>For connecting with my future career, I need to start working from now, because in three years I might be forced into retiring from a private school. I don't want to be at a loss when that happens. Instead I hope to use this period to build my social media presence well and accumulate professional experience and contacts in tour groups, to be ready for the future.<\/p>\n<p>Lucky International Travel Service - Orange Travel<\/p>\n<p><a href=\"https://www.lucky-travel.com.tw/about.html\">https://www.lucky-travel.com.tw/about.html<\/a><\/p>\n<p>Kevin's International Travel Service<\/p>\n<p><a href=\"https://www.kevinstour.com/\">https://www.kevinstour.com/<\/a><\/p>", "zt": "第三人生倒數836天"}, {"id": "f1744040425", "file": "2025-04-07-f1744040425", "date": "2025-04-07", "title": "My Career Is Like This Week's Tariff War, Up and Down...", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "School & Military Service", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Amid campus rumours of pay cuts and colleagues leaving, Ray resolves to stop fearing career threats and to protect his precious time.", "len": 247, "body": "<p>2025.4.7<\/p>\n<p>My career is like this week's tariff war, surging up and washing down, with rumours all around. There is talk of pay cuts, and I see others thinking of leaving. I am also constantly preparing for the doctoral programme at Fu Jen Catholic University and for new plans and considerations.<\/p>\n<p>I record the whispers on campus these days in words, and in doing so let them go.<\/p>\n<p>I tell myself that a career is the ups and downs of life. Only with change is there scenery, and only by striving is there opportunity. I will work hard to train my body to keep up with every change, and strengthen my mental resilience through self-love to face challenges, working only for the happiness and joy of my body and mind.<\/p>\n<p>If I cannot control the quality of my life's time, then having all the money in the world is meaningless. From today, I will no longer be afraid of any threat to my career, because what is most precious is the little golden time I have left. Whether in teaching, research or industry-academia work, the quality of interaction comes first. My interaction with students should be deep and sincere, my research progress focused and professional, and ideally I will also improve my language skills at the same time. In industry-academia interaction, the starting point must be increasing income and results. I won't do free work for any company, and I will invest in my own earning power.<\/p>", "zt": "我的職涯就如同這幾天的關稅戰般地上沖下洗，四處都是風聲，…"}, {"id": "f1743915516", "file": "2025-04-06-f1743915516", "date": "2025-04-06", "title": "These Days I've Been Sorting Out My Doctoral Research Direction, and Only One Principle Is on My Mind…", "cat": "Morning Reading", "cats": ["Morning Reading"], "sub": "Journal Papers", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Planning a PhD alongside teaching and certificate classes, and weighing the choice of school, academic writing in English and making money from self-media.", "len": 351, "body": "<p>2025.4.6<\/p>\n<p>These past few days I have been sorting out my doctoral research direction, and the only principle in my mind is this: how to move the doctoral dissertation research forward within my existing profession and work, achieving a win-win life strategy for myself.<\/p>\n<p>My current income comes mainly from full-time teaching and after-class certificate classes. I also hope to increase my income in the field by winning project funding. In addition, internship mentoring is voluntary work, and by combining it with projects I have now made internship mentoring part of the projects' results.<\/p>\n<p>＃APhDIsAGoalNotADream<\/p>\n<p>So when I ask myself whether it matters which school I get a doctorate from, and why not a good top university, it is because Brother Liu, speaking as someone who has been through it, advised that the best doctoral programme is one where you don't have to take courses and mainly write research, so you don't waste extra time attending class and doing homework. I strongly agreed when I heard that, and that is why I later prepared with the Fu Jen psychology doctoral programme as my only direction.<\/p>\n<p>＃KeepUpAcademicEnglishWriting<\/p>\n<p>How can I persevere in academic writing in English? I still struggle with my limitations in this area. I truly wish I could express my thoughts and points of view fluently in English, and be able to discuss with colleagues at academic conferences. How can I maintain my passion? I wonder.<\/p>\n<p>Should the vehicle for writing a dissertation be Chinese or English? I am still agonising over this. I very much look forward to writing entirely in English in the future, using Chinese writing for relaxed everyday life, and doing all academic writing and publishing in English. I still want to stick with this.<\/p>\n<p>＃IncreasingIncomeIsTheOnlyPurpose<\/p>\n<p>How can I make money while doing a PhD? The way I thought of is self-media: an old guy taking the doctoral exam, an old guy doing a PhD. This is my own interest, so the most important thing is to start shooting and editing videos. The first video is \"Going Back to Fu Jen to Take the PhD Exam\".<\/p>", "zt": "這幾天在整理博士班的研究方向，腦中所思維的原則只有一個：…"}, {"id": "f1743646822", "file": "2025-04-03-f1743646822", "date": "2025-04-03", "title": "The News Is All About Trump, but I Don't Know Why I Should Spend Time Studying Tariffs", "cat": "Personal Finance", "cats": ["Personal Finance"], "sub": "Investing & Economy", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray asks why he should spend time on tariffs, and concludes his energy is better spent on his profession, health and steady finances.", "len": 325, "body": "<p>2025.4.3<\/p>\n<p>The news is all about Trump, but I don't know why I should spend time studying tariffs.<\/p>\n<p>Is it because they will affect my income? Actually, no. My main income is my salary from Hsing Wu University. The few hundred thousand NT dollars in the stock market is part of an investment game. My work income is what matters most, and over the years most of my earnings have gone into the home I live in. I hope not to touch my cash savings and retirement funds for over a decade, because I still hope to walk healthily into old age. So where should I spend my time?<\/p>\n<ol>\n<li>\n<p>Spend time adding value to my current profession. At noon I chatted with Yen-Ling about difficulties at work. The most important thing, I thought, is to use my own expertise to create new income. With nearly 20 years of teaching, there is no turning back. Adding value and depth to my research is the only direction.<\/p>\n<\/li>\n<li>\n<p>Right now, health and maintenance of my body come first. My writing and my image both depend on good looks and confidence. Daily running and a sense of satisfaction in body and mind are the top priority, and a healthy diet adds to that.<\/p>\n<\/li>\n<li>\n<p>Financial planning is hard to decide on a short-term basis. Cashing out investments would also be a wash because of inflation, and I have no spare money to invest anyway. On top of that, I am still considering a research plan for a doctoral programme, and between the two, the time cost allows only one.<\/p>\n<\/li>\n<\/ol>\n<p>Sorting out my mindset and current situation, I realise tariffs and the cross-strait political struggle don't have much to do with me. What matters is continuing my work at Hsing Wu University and adding value to myself. Putting all my energy there is the key work of my life, and it is also the guarantee for my family and my future.<\/p>", "zt": "新聞都是川普，但我也不知道為什麼我要花時間來研究關稅？"}, {"id": "f1742798053", "file": "2025-03-24-f1742798053", "date": "2025-03-24", "title": "Little Spring Weather", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Watching my son's heavy workload in electrical engineering at NTHU, I reflect on achievement, market-driven study strategies and what university years are really for.", "len": 582, "body": "<p>2025.3.24<\/p>\n<p>Little Spring Weather<\/p>\n<p>First thing this morning, my son at National Tsing Hua University took part in a general education course on the campus ecology. But because Monday's logic design course and exam content are huge, many students did not go home over the weekend and even studied all night, including him, and the 5 am campus excursion was merely a general education snack after their night of study.<\/p>\n<p>I have watched children of the same age around me study at Johns Hopkins in the US. The coursework she shows is also heavy, with a great deal of reading and homework, and the tuition and living costs her parents pay are even more staggering than in Taiwan, but after graduating from a famous school and department, the pay at work and so on offers another vision.<\/p>\n<p>Why is the coursework so heavy in the electrical engineering department of a top university?<\/p>\n<p>For this department, is such a huge workload a necessary condition for maintaining the quality of its electrical engineering students?<\/p>\n<p>Is learning in the electrical engineering departments at UCLA or MIT this intense too?<\/p>\n<p>If you hunger for success and want to be above others, you cannot dodge hard work during the learning stage.<\/p>\n<p>My post on Threads yesterday, a bit of fishing for reactions, worked very well, and I could see different responses and views, all very valuable. It seems MediaTek and Novatek are the same as Realtek in how they manage and develop their people: the engineers work very hard, and what they put in is worth the income. Those who see others doing well but cannot do it themselves are people envious of those who earn money, and my inference is that they may also be the sour-grapes type. Using quality of life and PUA as an excuse to avoid facing things is perfectly legitimate; but looking back, it is just not being able to compete or compare with others in economics and position, and ending up a keyboard warrior.<\/p>\n<p>My overall takeaway is that when students choose any industry or department to study in, if they base their decision only on grade rankings, career promotion or income, they put their sense of achievement in the wrong place. The most important thing during university is not competing for department or class rank or chasing the book prize, so I very much disagree with how the Realtek manager described and introduced this job. It is a pity that, from his position and height, his introduction to first-year freshmen did not consider what this job means for being a human being.<\/p>\n<p>My child chose electrical engineering at NTHU, and in terms of personality there is nothing wrong with that. The pity is that in how this department is run, apart from the professional content, teachers give students too little guidance, and the result is that market value is left to shape students' learning strategies. Ages 18 to 24 are the most beautiful time of life. Teachers should use their own experience to guide young and clever students to try and explore themselves and discover where they can gain lasting achievement, then refine themselves in the subjects, research or skills they love, pursue excellence in the fields of their strengths and passions, and set small goals for their subject or profession, continually gaining a sense of achievement in the process of learning and exploring, and so become Taiwan's most professional scientific talent.<\/p>\n<p>A lovely spring morning<\/p>\n<p>Youthful days without regret<\/p>", "zt": "小春日和"}, {"id": "f1740239002", "file": "2025-02-22-f1740239002", "date": "2025-02-22", "title": "Yesterday I Submitted the MOE Industry Academy Proposal, and in the Morning the Network Even Dropped...", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "After a draining start to the year, Ray submits his Industry Academy proposal and resolves to face every opportunity instead of quitting halfway.", "len": 257, "body": "<p>2025.2.22<\/p>\n<p>Yesterday I submitted the Ministry of Education Industry Academy proposal through the system. That morning the network even dropped, and the structure diagram and several carefully thought-out paragraphs vanished completely. Truly Murphy's Law: the busier you are, the more things go wrong.<\/p>\n<p>Lately everything takes double the time and energy to finish, with half the result. These words fully describe my situation since the start of the year. Whether it's waiting at a red light while driving, arranging courses, interacting with students, system databases or talking with companies, everything has a sense of endless spinning in circles and being busy for nothing.<\/p>\n<p>After finishing every chapter and the budget, I know there are many, many flaws that even I can't bear to look at. But every word was written by me, slowly thought through and accumulated by me. After submitting, I wanted to feel happy and encourage myself: at least I didn't run away at the last moment as I used to. Many half-written articles, half-finished registrations and half-thought dreams made me a jack of nothing, half-baked at everything.<\/p>\n<p>I want to truly face every opportunity. This proposal is a beginning. Next comes the plan for part-time work to earn money, because the prime of my professional life has begun its countdown of 12 zodiac years: snake, horse, goat, monkey, rooster, dog, pig, rat, ox, tiger, rabbit, dragon will come very soon. Work hard every day, make the most of every moment, stop chasing unrealistic dreams, do only practical things, and earn the money I deserve.<\/p>", "zt": "昨天將教育部產業學院計畫從系統中送出，而且在上午時還因為…"}, {"id": "f1739890630", "file": "2025-02-18-f1739890630", "date": "2025-02-18", "title": "Karma: Leave Everything to Fate?", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Family & Pets", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Exhausted by illness, work and family worries, Ray finds encouragement in the film The Extraordinary Journey of the Fakir and chooses not to give in to fate.", "len": 249, "body": "<p>2025.2.18<\/p>\n<p>Karma: Leave Everything to Fate?<\/p>\n<p>These past few days I've been so tired that I've almost lost the ability to look forward to anything! Endless illness in myself and my family, preparing for the new semester's courses, project deadlines, unexpected trips out, and above all my parents at home, who leave me helpless, have pushed me almost to my emotional lowest, and I have even booked an appointment at a psychosomatic clinic in Zhubei for March.<\/p>\n<p>But I still have so much attachment to and hope for this world. I hope to use a healthy body to see the world and experience cultures everywhere, and I am still full of curiosity about an unknown future. So I absolutely must not get stuck in fate, and I must not lose heart and give up everything because of it.<\/p>\n<p>On a day when I had taught seven classes, I found an interesting film, The Extraordinary Journey of the Fakir (in Chinese, \"Travelling with an IKEA Wardrobe\"). Adapted from a French novel, it is very dramatic, just like the French romanticism about the world. With its lovely Indian music and an interweaving of refugees, ethnic groups and the scenery of various European countries, it weaves a wonderful adventure comedy.<\/p>\n<p>Aja's mother says: don't let luck and fate toy with your life. Believe you can escape the poverty of your class through effort, and most importantly, be rich in your heart, because people who have love and trust are always rich.<\/p>\n<p><a href=\"https://www.youtube.com/watch?v=M5tPuKU0DYY&amp;t=0s\">https://www.youtube.com/watch?v=M5tPuKU0DYY&amp;t=0s<\/a><\/p>", "zt": "Karma 什麼都交給命運決定嗎？"}, {"id": "f1739615438", "file": "2025-02-15-f1739615438", "date": "2025-02-15", "title": "A BBC Report a Week Ago on China's Rise, and Some Anxiety While Writing Proposals", "cat": "Personal Finance", "cats": ["Personal Finance"], "sub": "Investing & Economy", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Reflections on a BBC report about China overtaking global industries, the growing share of Chinese scholars in tourism and AI research, and everyday digital life.", "len": 339, "body": "<p>A week ago the British Broadcasting Corporation, the BBC, published a report (in the comments) on the shifting global situation. In many respects China's progress has made it a leader across the world's industries, leaving every previously profitable industry feeling threatened. The European car industry is one example. With the Chinese government's support and heavy investment, BYD electric cars entered the world market with unbelievably low prices and quality, and the result is that the century-old foundations of the German and French car industries have been almost completely wrecked.<\/p>\n<p>The same situation will happen in every key industry of \"Made in China 2025\". Advanced countries will become very nervous and will want to use any legal or political means to slow down the timetable. China wants to be stronger, and the United States even more wants to keep its former glory. It seems President Trump has gone all-in at the table of competition, but has also cut off support from his former allies. In recent days India and Japan have followed, but it seems Britain and the European countries don't think so.<\/p>\n<p>The BBC seems to have honestly presented its observations. And while looking recently for journals and papers on AI and tourism, I also found that more and more cross-disciplinary studies are being published by Chinese scholars in major world-class SSCI journals, especially in fields like the service industry. Since the foundation of services is consumers, the Chinese market of 1.3 billion people is a giant greenhouse for all service start-ups.<\/p>\n<p>The above may just be anxiety from writing proposals. Although my phone has no Tmall, Douyin, DeepSeek or similar apps, I know that the young man who rode the elevator with me just now, from the 18th floor to the ground floor, kept his eyes glued to short videos produced in China until he got out. Throughout, he probably had no idea who was riding the elevator with him, or how many people there were. And the others in the elevator were chatting with each other.<\/p>\n<p><a href=\"https://www.youtube.com/watch?v=z7do1hhb6fE\">https://www.youtube.com/watch?v=z7do1hhb6fE<\/a><\/p>", "zt": "一週前英國國家廣播電視BBC的報導(放留言)，提到現在世…"}, {"id": "f1738825823", "file": "2025-02-06-f1738825823", "date": "2025-02-06", "title": "Riding Fatty Di from Linkou to Hsinchu", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Taiwan", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A winter-break scooter ride from Linkou to Hsinchu, a wrong turn to Qingpu, and a rushed lunch with my son near Tsing Hua University.", "len": 310, "body": "<p>2025.2.6<\/p>\n<p>First thing this morning I chatted with Ms. Li of Southeast Travel about the details of industry-academia cooperation, and only then could I relax and get ready to head out.<\/p>\n<p>Before the semester began I had planned to ride Fatty Di (my scooter) from Linkou to Hsinchu. Besides saving nearly a thousand dollars in shipping fees and the time cost, the truth is that I wanted a reason to ride and see the north-south trunk road I have long wanted to walk more of.<\/p>\n<p>As soon as I left Linkou I got lost by the mountainside, and the navigation led me wrong all the way to Qingpu. Thinking about it afterwards, the new route was a nice experience anyway. I looked at the map and replanned my direction, and along the way there was the Taoyuan Lantern Festival, ponds, and new roads by the High Speed Rail that I had never been on. It was a real pleasure to ride out alone during the winter break.<\/p>\n<p>I really feel I should find a little time outside work to wander out and feel the wind!<\/p>\n<p>The scooter ride from Linkou to Hsinchu takes only two hours. I had a meal with my son in front of Tsing Hua University. It was a bit rushed, but seeing him always puts my mind at ease. My child has grown up while I still feel like a kid myself, and there is a little ache and reluctance in that, but also a feeling of great happiness. Working to earn money and bring happiness to my family is the biggest source of my sense of achievement.<\/p>\n<p>I hopped on a Kuo-Kuang bus back to Linkou, and next I need to spend more time preparing for work. Remember to stay cheerful and walk step by step in a happy mood! Don't panic! Don't worry needlessly!<\/p>", "zt": "一早先跟東南旅遊李小姐聊了一下產學合作的細節，才放下心準…"}, {"id": "f1732630256", "file": "2024-11-26-f1732630256", "date": "2024-11-26", "title": "A Little Urban Railway Trip for Travel Management Teachers and Students, Following in the Footsteps of Governor Liu Ming-chuan…", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "Admissions & Falling Birth Rate", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Students and I walked the 1888 Daocheng railway site and the National Taiwan Museum Railway Department Park as the second stage of a guiding course.", "len": 290, "body": "<p>A little urban railway trip for the teachers and students of Travel Management. Following in the footsteps of Governor Liu Ming-chuan, we strolled along the site of the 1888 Dadaocheng railway, passing the 1909 Taipei Workshop, the 1919 Railway Department Office Building, the Octagonal Building and the Engineering Building, and walked into the National Taiwan Museum Railway Department Park, which was completed and opened in 2020.<\/p>\n<p>This was the second stage of a guiding course. After the students stepped out of campus to ride the railway from a different perspective and link their learning with local guiding, I took them into the museum to experience how history and the modern day interact. I had assumed that young students only love the glamour on their phone screens and forget that a corner of the city holds finer textures. In fact, seeing the students' perspectives and their guiding, and how these connected with the rail concepts we had covered in the classroom, I was delighted to have opened a window of curiosity for this group of students.<\/p>\n<p>Standing with the students in front of the North Gate, which has stood for 140 years, I had them pay the NT$50 Taiwan Museum admission fee themselves. Through this small requirement of a micro-credit, I hope this group of new Travel Management students can try to understand the relationships among the city, life, space, leisure and travel. I also hope this kind of practice gives them deeper foundations when they later have the chance to take foreign visitors around and promote Taiwan, so they can share the urban landscapes that sit right in the city and along the way, and introduce, as they walk, the Taiwanese tourism resources they identify with and are proud of.<\/p>", "zt": "旅運系師生的城市鐵道小旅行循著劉銘傳巡撫的腳步，沿著18…"}, {"id": "f1731934728", "file": "2024-11-18-f1731934728", "date": "2024-11-18", "title": "Autumn Rain and Strong Typhoons, Week After Week", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A rainy field trip by train to Ruifang, guided by Ray's graduate school classmate, Village Chief Chih-Chiang, and what it taught his students about guiding and mobile learning.", "len": 488, "body": "<p>2024.11.18<\/p>\n<h1>Autumn Rain and Strong Typhoons, Week After Week<\/h1>\n<p>This was a field trip that had been postponed for a long time. I had planned before the semester even began to take students on a train ride. The seniors who joined the last train activity with the same banner have already graduated or gone on internships, so I always want to give students more shared travel memories with me. The typhoons arriving one after another were extremely annoying. The last time I disliked typhoons lining up at my door this much was the summer of 2008. For anyone working in a travel-related industry, typhoons are never welcome.<\/p>\n<h1>Thoughtful Guiding Plans at Every Turn<\/h1>\n<p>What you fear most when organising an outdoor visit is rain. Early in the morning, before we had even gathered, Village Chief Chih-Chiang reported the local weather: \"It's raining.\" I hurriedly notified the students at 7 o'clock to bring rain gear, but in order to reach the meeting point on time, many had already left home and were on their way. At 9 o'clock, as we were about to board the train, he reported again that \"the rain is getting heavier,\" and my heart sank by half. When we stepped into Ruifang Station, what greeted us was a soggy platform.<\/p>\n<p>As soon as he arrived, Chief Chih-Chiang gathered the students and took out a box of lightweight ponchos, one clear, colourless poncho for each person, so that the nicely dressed students would not look unattractive in raincoats. Along the way, he spoke about Ruifang's local architecture, culture and history, the light railway and its former glory in witty language, which kept the students very attentive, and they took out their phones to record everything we passed. During the walk, Chief Chih-Chiang was constantly concerned about the group's safety, finding suitable stops and interpretation points, and using professional audio equipment so that everyone could hear clearly and learn in detail. In the drizzle, my own heart settled at the sight of the students' focused eyes. Over a route and tour of nearly 90 minutes, the students all wrote about their rich gains in their learning feedback.<\/p>\n<h1>Mobile Learning, Guided at Every Moment<\/h1>\n<p>This time I asked Chief Chih-Chiang, my graduate school classmate, to serve as guide and teacher, precisely so that his rich local connections and guiding experience could be lent to my own students. From planning to execution, and throughout the guiding activity, he thought of everything for us, and you could feel how different it is when an expert steps in. This is a micro-credit course in guiding and interpretation. Only through practical action can students realise that guiding is not just exam questions in a textbook, but a clever, integrated profession combining the interpreter and local resources. Of course, a group of students with a desire to learn, curiosity and consideration was also an important factor in the success of this course activity.<\/p>", "zt": "週週相伴的秋雨強颱"}, {"id": "f1731161761", "file": "2024-11-09-f1731161761", "date": "2024-11-09", "title": "Dr. Lu Chiang-Chuan, My Mentor in Cruising", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Cruises", "det": "Cruise Careers & Courses", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray recalls how Dr. Lu Chiang-Chuan guided his cruise career, from the 2001 Star Princess to 2024, when Dr. Lu spoke to 80 new students in HWU's cruise classroom.", "len": 299, "body": "<p>2024.11.9<\/p>\n<p>Dr. Lu Chiang-Chuan, my mentor in cruising.<\/p>\n<p>In 2001, when the Star Princess made her maiden call at Keelung, it was Teacher Lu who made it possible for me to board and take part in Chinese and English tour-guiding training and practice for prospective customers.<\/p>\n<p>In 2006, the Tourism Bureau carried out the first survey of the Asian cruise market as a special project. Teacher Lu sent me and three other surveyors aboard the Virgo Star to collect hundreds of paper questionnaires in English, completing the first official market analysis of international cruise passengers.<\/p>\n<p>From 2007 to 2009, at the Hualien College of Tourism, Teacher Lu co-supervised me as I organised integrated cruise routes to Penghu, Singapore, Japan and the United States. We also ran, for the first time as a teaching project, several study camps at sea aboard Star Cruises and Princess Cruises ships, with 300 student participations.<\/p>\n<p>In 2018, when the Hsing Wu University College of Hospitality and Tourism building was in its initial design, I sought Teacher Lu's views and consulted many cruise books, which became the Hsing Wu Department of Travel Management's own cruise simulation classroom.<\/p>\n<p>In the midterm exam week at the end of 2024, Teacher Lu came to campus, to the HWU cruise simulation classroom, to give a talk to 80 newly enrolled first-year students in the Department of Travel Management. The aim is more meaningful practical teaching: breaking through Taiwanese students' tendency to look only at what is in front of them, and analysing future cruise career internship options from an international, big-picture perspective. We hope that in this promising blue-ocean travel market, the teachers and students of HWU Travel Management will be among the leaders, seize the first-mover advantage in cruise tourism and sail toward a more forward-looking future.<\/p>\n<h1>EducationIsAHundredYearPlan<\/h1>", "zt": "我的郵輪啟蒙師呂江泉博士。"}, {"id": "f1730372507", "file": "2024-10-31-f1730372507", "date": "2024-10-31", "title": "In Fact, Strong Typhoons in Late October Are Nothing New, but Reporters and Editors Just Want Ratings...", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "Travel Industry & Transport", "det": "Airlines & Railways", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Recalling the 2000 Singapore Airlines SQ006 crash at Taoyuan on a typhoon day, Ray questions media hype over pilots landing in Typhoon Kong-rey.", "len": 209, "body": "<p>In fact, strong typhoons in late October are nothing new. It is just that reporters and editors want to boost ratings quickly, so they build programmes around high-traffic videos from the internet. On such a dangerous typhoon day, many pilots who risked their lives to fly home have become internet heroes.<\/p>\n<p>What the news and the high-traffic videos all show is footage of EVA, China Airlines and STARLUX pilots forced to land and take off in \"roller-coaster\" fashion against Typhoon Kong-rey.<\/p>\n<p>Does no one really remember that 24 years ago on the very same day, 31 October, Typhoon Xangsane struck Taiwan, and Singapore Airlines flight SQ006 suffered the worst air disaster in that company's history at Taoyuan Chiang Kai-shek Airport?<\/p>\n<p>Typhoon Xangsane was also a strong typhoon arriving on the last day of October. The main cause of the Taoyuan crash was human error, and the airport had little legal responsibility, but given the typhoon weather, the airport could have closed and halted takeoffs and landings, which is perhaps also the most fundamental and safest approach.<\/p>\n<p>Just like An-An yesterday, who made an emergency closure of the Taipei Arena. The Mrs. Lius can go see their husband again at the weekend!<\/p>\n<p>Image sources: Pastdaily, TTV News and Taiwan Apocalypse<\/p>", "zt": "其實10月底的強颱不是沒有，而是記者報導及編輯只想快點拉…"}, {"id": "f1728314212", "file": "2024-10-07-f1728314212", "date": "2024-10-07", "title": "When We Swallow Our Anger, We Give Up What Should Be Ours...", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "On workplace bullying and why new employees should speak up early when something feels unreasonable, prompted by handling an intern case and teacher counselling.", "len": 184, "body": "<p>When we swallow our anger, we hand over what should have been ours. It may look sensible and gracious, but it sacrifices all of our own rights and interests.<\/p>\n<p>At work, if it is openly said that you needn't attend events in other counties on holidays, but privately there is constant hidden pressure and whispering that the newcomer doesn't know how things work, that is not management but workplace bullying.<\/p>\n<p>At work, if a supervisor denies ever having made sexually harassing remarks, denies emotional outbursts that came from nowhere, and even openly lies, that is not education but leading newcomers astray, making new employees think such behaviour is acceptable out in society.<\/p>\n<p>So as soon as a new employee feels uncomfortable, that something is unreasonable or unpleasant, they should speak up right away. If possible, respond with wisdom and words, and above all remind colleagues or supervisors face to face that they have gone beyond what the job requires.<\/p>\n<p>The world is collapsing. Wronging yourself only shortens your happy time. These are my thoughts after handling a student internship incident and teacher counselling today.<\/p>", "zt": "當我們忍氣吞聲時，就是自己讓出了原本自己應該擁有的，好像…"}, {"id": "f1727946310", "file": "2024-10-03-f1727946310", "date": "2024-10-03", "title": "Just Walked 2K and Saw Many Dogs Out Walking Their Owners While the Weather Was Calm...", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Watching dogs out for a walk reminds me of Snoopy, our rescue dog who lived on our balconies for fifteen years, through our move to Hualien and its typhoons.", "len": 676, "body": "<p>2024.10.3<\/p>\n<p>I just walked 2K along the road and saw quite a few dogs taking their owners out for a stroll while there was no wind or rain. It made me think of Snoopy, who lived on our balcony all those years. Snoopy was a stray we took in near Guting. Compared with today's dogs, who have their own beds at home, strollers to ride in when they go out, and even owners who cook dog food for them every day like private chefs, our Snoopy was so pitiful.<\/p>\n<p>After she became part of our family, she lived on balconies: the balcony of an apartment near Sanhe Night Market in Sanchong, the balcony of the office building in Guting, the rooftop and balcony of the Muzha apartment, the balcony of the Lotus Building in Hualien, and the first-floor balcony in Wufenhu, Shoufeng. She drifted and wandered with us for fifteen years. Sometimes I think that if we hadn't adopted her back then, she might have lived out her days at the door of the little noodle shop in Guting.<\/p>\n<p>In our first year in Hualien, wanting the Pacific view, we chose a 15th-floor 2LDK apartment with a sea-facing balcony. Our child had just been born, so Snoopy naturally lived on the balcony. It was around the end of summer and the start of autumn. As I recall, I went to Hualien for the interview in July, and in August I was told I would be taken on for a one-year trial as a lowest-grade project lecturer. Our child was only six months old, and the little Muzha apartment had only just been settled, yet we were rushing off to work in Hualien, weary from travel. Our household went from two working salaries to a family with only a one-year lecturer's pay. Looking at it today, my decision as a young man was utterly outrageous, completely ignoring the family's financial and living difficulties at the time, going to work at a private school in a remote area, and moving to Hualien exhausted, with even the dog worn out, for no good reason.<\/p>\n<p>Right after arriving in Hualien we faced the test of typhoon season. I don't remember how many typhoons we met in the autumn of 2006, only that on typhoon nights we, a young couple, were in a high-rise facing the Pacific, so conspicuously exposed to the wind. In the strong gusts the building swayed along, and every spot in the rooms with a window air conditioner became a way for water to get in. Renting and living away from home, we had only bought mattresses and a plastic mat for the child and slept on the floor. We spent the whole night in terror in the wind and rain, and the poorest of all was Snoopy on the balcony. Looking after the child, blocking the water, and being rocked all night by the strong winds of the building, our family of four got through that typhoon season in a frightened, bedraggled state.<\/p>\n<p>The next year we moved again, to Wufenhu in Shoufeng, where we lived for five years. The environment and life there were far better than in the city. In the Huadong Valley, sheltered by the Coastal Mountain Range and the Central Mountain Range, the typhoon seasons were not so frightening. We also chose to live on a lower floor for something steadier and more practical, and both Snoopy and the child had better space to move around.<\/p>\n<p>I'm writing all this only because I'm afraid my impressions of life will slowly fade, like the Norfolk pines along the road after a Hualien typhoon, all stripped bare by the strong winds. The Lotus Building in Hualien where we lived is still a dangerous building because of earthquake damage. Every day we live through passes over a few months of waxing and waning moons, calm winds and gentle rain, the lush green of changing seasons, and we are so lost in it that we think the peace and beauty of the moment will last forever.<\/p>", "zt": "剛剛在路上走走2K，看到不少狗狗趁沒風雨帶主人出來遛遛，…"}, {"id": "f1725875400", "file": "2024-09-09-f1725875400", "date": "2024-09-09", "title": "From Munich Central Station to the Deutsches Museum", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "Europe", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "How planning a Munich museum trip went from a dozen minutes of manual checking in 2016 to a one-minute ChatGPT-and-Google-Maps routine today.", "len": 260, "body": "<p>From Munich Central Station to the Deutsches Museum<\/p>\n<p>With the development of AI, trip planning is quite different from the old way of looking up information. Take my 2016 independent-travel transport plan for Munich as an example. The main itinerary that day was to set out from a hotel near the central station and visit the Deutsches Museum. Because it was independent travel, every leg had to be checked. I remember first consulting the transport suggestions on the museum's website, then using Google Maps to plan travel times and walking routes. Confirming the whole route took at least ten-odd minutes.<\/p>\n<p>Now I just open the app and ask ChatGPT directly: \"Please help plan the public transport options from Munich Central Station to the Deutsches Museum, and present the travel time and cost in a table.\" The result comes back in milliseconds. I then ask it, \"Can you provide a map?\", and the result is as shown in the attached picture: rich, accurate and complete.<\/p>\n<p>So I use Google Maps with its suggestions, and within one minute I have a clear route map. Put it in my phone and just follow along. Six years ago the internet wasn't as well developed as today, and I wrote everything in an itinerary sheet and travelled by the sheet.<\/p>\n<p>The attached pictures are the 2016 illustrated record of the trip from Munich Central Station to the Deutsches Museum, for anyone interested in independent travel in Germany. Because we rode the underground and walked ourselves, we could better feel the summer city atmosphere of Munich.<\/p>", "zt": "慕尼黑中央車站至德意志博物館"}, {"id": "f1724063107", "file": "2024-08-19-f1724063107", "date": "2024-08-19", "title": "The College of Tourism and Hospitality Held Its Ghost Festival Offering Today", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Internship Mentoring", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "At the college's Ghost Festival ceremony, the department head prayed for the safety of all students, a reminder of what vocational educators care about most.", "len": 229, "body": "<p>2024.8.19<\/p>\n<p>The College of Tourism and Hospitality held its Ghost Festival offering today. When the time came, everyone lined up to pay respects. This year's offerings were chosen with some expert advice, and on this important annual folk festival, the teachers lit incense and prayed.<\/p>\n<p>The head of the Department of Hospitality, who led the ceremony, prayed: \"May all the students and colleagues of the College of Tourism and Hospitality come and go safely.\" I didn't hear anything like \"may enrollment be full\"! Instead, the prayer was all about blessings for the thousands of students in the whole college.<\/p>\n<p>During summer vacation, vocational students are mostly working hard in the service industry, part-time or on internships, leaving early and coming home late to strive for their studies and lives. When everyone else is out having fun in summer, it is the busiest time for our tourism and hospitality students.<\/p>\n<p>That one sentence, \"May the students come and go safely\", says it all about the days and nights, and the constant worry, of us as vocational educators. I was very moved, deeply touched, and jotted this down quickly. Otherwise it would all be forgotten once work gets busy.<\/p>\n<p>By the way, does anyone know why the basin at the very front holds water spinach?<\/p>\n<h1>3000m #3K<\/h1>\n<h1>run #running #runner #runforlife #runeveryday<\/h1>\n<h1>Run #Running #Runner #ZenRunner<\/h1>\n<h1>HappyRunning #RunHappy #RunHealthy<\/h1>\n<h1>RunningLife #RunningNotes<\/h1>", "zt": "觀餐學院今天辦中元普渡，大家時間點到了就來排排站準備拜拜…"}, {"id": "f1722157345", "file": "2024-07-28-f1722157345", "date": "2024-07-28", "title": "First, Ningbo Felt Wondrous to Us, Not Strange or Unlikeable!", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "China", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A transit stop in Ningbo: a friendly hotel staffer, a popular local restaurant with scan-to-order dining, transparent prices, and a Meituan-powered food trip.", "len": 579, "body": "<p>First, let me say that Ningbo felt wondrous to us, not strange or unlikeable!<\/p>\n<p>Let me talk about the popular local restaurant and our impressions. After we checked into the hotel on our transit afternoon, a super-friendly young lady kept visiting our room, asking us all sorts of questions and giving us little gifts: room slippers, new toothbrushes, and nonstop, outgoing chatter. I decided to turn the tables and ask her about local restaurants within walking distance and city sights. She recommended this famous place: Alar Famous Stove, the Taste of Ningbo People, and even named several must-eat dishes.<\/p>\n<p>After thanking her and catching our breath, we went out. Through the muggy heat we walked past the Moon Lake scenic area. The city is beautifully planned, the roads orderly, and apart from electric scooters darting out from the sidewalks now and then, the whole city is lush and green. On a holiday stroll, it was mainly local residents, with very few tourists.<\/p>\n<p>The Alar Famous Stove Moon Lake branch is right next to the park. It was scheduled to open at 17:00; we arrived at 17:10 and it was already 80% full. What the locals say you must eat is no exaggeration. Every dish is ordered by scanning a code (photo attached). After being seated upstairs, you can look at what you'd like and order whatever you want. The prices and flavours were both good, and the value for money is really high. Restaurants like this would be a good model for Taiwan's seafood restaurants at fishing ports. The prices are transparent too: live seafood has clearly marked prices, and you scan the code and decide for yourself whether to order the delicious food. It inspires real trust.<\/p>\n<p>The three of us ordered 7 dishes, with tableware, for a total of 202 RMB. We sincerely recommend the soul-stirring Dongpo pork, eggplant with rice cake, spicy stir-fried clams, the healthy stir-fry, and stir-fried crown daisy. The portions are bigger than in Taiwan, so if you visit, don't order too much. Those with small appetites really won't finish it all. Next time, I'll definitely go on an empty stomach and order live fish.<\/p>\n<p>Transparent pricing was the most reassuring thing on this trip. Just ask taxi drivers or friendly young men and women and you get plenty of recommendations in no time. We had also learned beforehand how to use the Meituan app, carefully read the transparent online reviews, and asked before entering a shop whether we could pay the group-buy price on Meituan. That kept good food and tasty spots with us all along the way. Between using technology and visiting shops in person to try new things, it was very happy and fulfilling.<\/p>\n<p>While eating, we kept observing the people of Ningbo. It felt that this place is mainly commercial; people speak less loudly and are more reserved. The grandfather and great-grandfather of Taipei's current mayor came from Fenghua District in Ningbo. Thinking about it, the Moon Lake we just walked past really is a bit like Cihu in Daxi, Taoyuan, no wonder it felt familiar all along, from the muggy weather to the green waterside scenery.<\/p>\n<p>After eating too much in the evening, we walked to nearby Tianyi Square for a stroll and some shopping. As we were nearly back at the hotel, heavy rain from a typhoon's outer circulation started again, so we hurried into the hotel and upstairs to pack for our flight back to Taipei.<\/p>", "zt": "先說寧波給我們的感覺是奇妙，不是奇怪或不喜歡喔！"}, {"id": "f1722076308", "file": "2024-07-27-f1722076308", "date": "2024-07-27", "title": "Have You Seen Black Mirror? If So, Then That Is...", "cat": "Travel & Cruises", "cats": ["Travel & Cruises"], "sub": "My Travels", "det": "China", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray's family spent a flash 18 hours in Ningbo after a typhoon extended their trip, and found a city and a hotel full of performative service.", "len": 395, "body": "<p>Have you seen the series Black Mirror? If so, then that is the strange feeling of our family's flash 18 hours in Ningbo.<\/p>\n<p>A typhoon turned our 10-day trip into 12 days, and the transit city changed from Fuzhou in Fujian to Ningbo in Zhejiang. Ningbo is a city we can't quite put into words. Perhaps we were tired from the journey, or perhaps the city's persona really can't find a place for itself, but it felt like a city without a soul.<\/p>\n<p>When we arrived, the taxi drivers queuing at the airport were reluctant to take fares, and not keen when they saw lots of luggage. If we hadn't been truly tired, with no other cars behind us and a crowd of customers queuing behind, I wouldn't have wanted to take that taxi. Sitting inside was even stranger (see the picture). The driver didn't answer questions and just drove to the hotel and dropped us off. In the end, the fare on the meter was 42 yuan, and the driver quickly pressed a button and called out 43.<\/p>\n<p>2024.7.30 Correction (it turned out there was a 1-yuan fee for printing the receipt. I only found this out while sorting my records, so I misjudged him. I apologise for the misunderstanding. The 1 yuan was mine to pay, though it would have been better if the driver had said so.)<\/p>\n<p>Checking into the hotel was also strange. Let me first say that the facilities and star rating were actually good, the handover when we left early in the morning was thorough, and I have no negative reviews. I even have to admit being satisfied.<\/p>\n<p>But the overall experience was just like the hotel's name, \"Ningbo Overseas Chinese Wyndham Grand Plaza Royal Hotel\": everything excessive. At every stage of service, the staff seemed to be acting. The front desk, the male butler, the female butler, the cleaning auntie, the auntie delivering snacks and the girl delivering pillows all loved to interact. They were enthusiastic and chatty, totally ignoring our family's tired faces, chatting about this and that, and in the end asking us to go online, write their names and give them a personal good review on a digital platform.<\/p>\n<p>It gave me a feeling of doom, of being caught in a spiral of digital ratings.<\/p>\n<p>And I feel sad for them, as fellow hospitality people.<\/p>", "zt": "有看過黒鏡Black Mirror影集嗎？如果有，那就是…"}, {"id": "f1720252321", "file": "2024-07-06-f1720252321", "date": "2024-07-06", "title": "Singapore's COMPASS Framework and Its Top Universities", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Singapore's immigration points list rates universities in tiers, with only three Taiwanese schools in the top class, and tourism programmes get special recognition.", "len": 224, "body": "<p>Singapore's COMPASS Framework and Its Top Universities<\/p>\n<p>Singapore has in recent years been the country most wealthy people want to move to, and its passport is the strongest in 2024. But I am very afraid of heat and would rather emigrate to a northern country than choose a place where you can't wear winter clothes. Anyway, I don't qualify as wealthy at all, so I'm overthinking this.<\/p>\n<p>While looking things up, I saw the points table published by Singapore's Ministry of Manpower. For education, the points fall into three tiers: 0 points for high school or below, 10 points for an ordinary university, and 20 points for a top university. I have heard from someone who once worked at a Singaporean agency in Taiwan that Singapore's immigration authorities even keep a list of Taiwanese universities that don't count for points at all. So there are schools that can't even be classed as ordinary universities. Other countries have their own views too.<\/p>\n<p>Only three Taiwanese schools are listed in category A as global \"top universities\", which seems rather different from what we ourselves assume. Also, Singapore, which focuses on the tourism industry, lists the tourism management and tourism studies students of one well-known university as a Category B designated subject, and I truly feel Singapore's respect for tourism expertise.<\/p>\n<p>Related reports are in the comments.<\/p>", "zt": "新加坡人力局Compass頂級學府"}, {"id": "f1719451904", "file": "2024-06-27-f1719451904", "date": "2024-06-27", "title": "[2023 Summer Extracurricular Reading List]", "cat": "Morning Reading", "cats": ["Morning Reading"], "sub": "PhD Diary", "det": "", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A summer reading list from my son's school for new first- and second-year senior high students, with a reminder that parents should read too.", "len": 388, "body": "<p>[2023 Summer Extracurricular Reading List]<\/p>\n<p>Next week kids everywhere will start their summer holidays. Our family likes to borrow books from the library or browse physical bookshops, looking for books that suit ourselves or the children. Adults should read along too: when you read, the kids will surely learn from you.<\/p>\n<p>Agou's school hasn't yet announced its recommended books for 2024, but I suspect most of the 2023 titles are unfamiliar to many of you. On these hot days, go borrow a book and read together.<\/p>\n<p>------ Grade 10 new students -----<\/p>\n<p>Wang Yi-chia, <em>The Book of Compassion, Wisdom, Life and Death<\/em>, Youlu Culture<\/p>\n<p>Wali, <em>That Night, Someone Knocked on Mozart's Door<\/em>, Pili Culture<\/p>\n<p>Shih Hsiao-feng, <em>Island-Hopping Practice<\/em>, Chiuko<\/p>\n<p>Lee Ping-bin, <em>Light Leads Me Far Away<\/em>, Ping An Culture<\/p>\n<p>Lin Ta-yang, <em>2021 Taiwan Poetry Selection<\/em>, Er Yu Culture<\/p>\n<p>Feng Kuo-hsuan, <em>Black Mist, Faint Light<\/em>, Crown<\/p>\n<p>Chang Wei-chung, <em>Tokyo Men's Room<\/em>, Yuan Dian<\/p>\n<p>Chang Jang, <em>The Weight of Light<\/em>, Ezpublish (Mu Ma)<\/p>\n<p>Chiang Hsun, <em>Longziwei, Cats<\/em>, Youlu Culture<\/p>\n<p>Hsia Hsia, <em>Sugar Cubes of Days to Come<\/em>, China Times Publishing<\/p>\n<p>Lai Hsiang-yin, <em>Island<\/em>, Unitas<\/p>\n<p>Chan Hung-chih, <em>The Old Kitchen<\/em>, New Classic<\/p>\n<p>Ma Hsin, <em>It Looks Beautiful, but It's Actually Broken<\/em>, Ezpublish (Mu Ma)<\/p>\n<p>Li Ching-chih, <em>Ojisan on the Road<\/em>, China Times Publishing<\/p>\n<p>------- Grade 11 extracurricular reading list ------<\/p>\n<p>Wang Hsuan-i, <em>State Banquets and Family Banquets<\/em>, New Classic<\/p>\n<p>Wen Kuo-shih, <em>Walking Through the Wilderness of Love<\/em>, Pili Culture<\/p>\n<p>Ho Wen-min, <em>The Day We Followed a Chicken's Backside to Find Our Way<\/em>, Chiuko<\/p>\n<p>Ho Chih-ho, <em>Subway Station<\/em>, Ezpublish (Mu Ma)<\/p>\n<p>Lin Ming-liang, <em>Tail People<\/em>, Chiuko<\/p>\n<p>Huang Ting-yu, <em>Invisibility<\/em>, Youlu Culture<\/p>\n<p>Chang Man-chuan, <em>A School of Her Own<\/em>, CommonWealth Publishing<\/p>\n<p>Chang Ching-hung, <em>If on a Winter's Night, a Mouse<\/em>, Chiuko<\/p>\n<p>Chiao Tung, <em>Slow Food Around the World<\/em>, Er Yu Culture<\/p>\n<p>Chen Hsueh, <em>A Girl's Prayer<\/em>, Yuan Chen<\/p>\n<p>Chen Lieh, <em>Book of Remains<\/em>, INK<\/p>\n<p>Chen Yu-hung, <em>Rays of Dawn and Others<\/em>, Hung Fan<\/p>\n<p>Yang Chih-chieh, <em>Stray Dogs and Blue Sky<\/em>, Shuang Xi<\/p>\n<p>Lai Yu-ting, <em>Dear Ones, Scattered Stars<\/em>, Youlu Culture<\/p>\n<p>Lo Yi-chun, <em>Elegy<\/em>, Rye Field<\/p>\n<p>Chung Yung-feng, <em>How Do Chrysanthemums March by Night<\/em>, Spring Hill<\/p>\n<h1>LittleKindergartenClassLittleGouzi<\/h1>\n<p>The 2022 list is in the comments.<\/p>", "zt": "【2023暑假課外閱讀書目】"}, {"id": "f1718340650", "file": "2024-06-14-f1718340650", "date": "2024-06-14", "title": "Electrical Engineering at NTU, NTHU, NYCU and NCKU", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray tallies the 659 admission places in electrical engineering at Taiwan's four top universities and reflects on why the field stays so popular, and his own college choice.", "len": 362, "body": "<p>Electrical Engineering at NTU, NTHU, NYCU and NCKU<\/p>\n<p>I compiled the total admissions for electrical engineering departments at NTU, NTHU, NYCU and NCKU for the 2024 academic year (ROC year 113): 659 places in all. After excluding some additional quota places, I made a small chart, with the following takeaways:<\/p>\n<ol>\n<li>\n<p>Ranking of top-university electrical engineering intake: NYCU (232) &gt; NTU (159) = NCKU (159) &gt; NTHU (109). AI and the semiconductor industry are hot, yet top-university electrical engineering has only 659 places, compared with 653 in 2023 (ROC year 112). There is no obvious increase, so it remains a scarce resource.<\/p>\n<\/li>\n<li>\n<p>Ranking of places by admission route: individual application (365) &gt; distribution admission (147) &gt; Star Plan recommendation (120). But the admission timeline runs over eight months: the General Scholastic Ability Test in January, Star Plan applications in February, Star Plan results in March, a free-for-all of first and second stage screening in May, individual application results in June, the Advanced Subjects Test in July and its results in August.<\/p>\n<\/li>\n<li>\n<p>NTU and NTHU hold their second-stage individual application exams on the same day. Applicants to top electrical engineering departments and to medical schools are mostly the same group of students, so apart from NTU electrical engineering, most departments end up filling their places from waitlists. Medical schools are the same.<\/p>\n<\/li>\n<\/ol>\n<p>The development of AI did not appear suddenly. I attach my own top-ten choices by group from when I took the college entrance exam in 1991 (ROC year 80). The ranking in Group 2 is not much different from today's. For over thirty years, Taiwanese people's expectations and choices have been the same: electrical engineering has always been what all candidates and parents hope for. The reason is simply economic. Choosing literature, history and philosophy should be interest-driven, and it is only right to choose them if your family is under no financial pressure.<\/p>\n<p>As for myself, I didn't think much back then. Not yet worldly-wise and not careful enough, I put down sociology without considering my own family situation. I didn't think it through, and I chose the school rather than the major, which is the most failed example of it.<\/p>", "zt": "台清交成電機系"}, {"id": "f1716353521", "file": "2024-05-22-f1716353521", "date": "2024-05-22", "title": "Heaven Rewards the Diligent, and the Trade Rewards the Skilled", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Industry Internships", "det": "Airline Internships", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Three years after a rainy Pingxi Line field trip, my class of 39 has earned 137 professional certificates and secured internships at leading travel and aviation firms.", "len": 234, "body": "<p>Heaven Rewards the Diligent, and the Trade Rewards the Skilled<\/p>\n<p>The green students in the Pingxi Line train carriage in the photo were the first-year class that, three years ago at the height of the pandemic, with global flights grounded and travel banned, chose to study in the Department of Travel Management at HWU. In heavy rain, wearing masks and thin clothes, after a sleepless night they still went with their teacher, full of enthusiasm, on a railway field trip.<\/p>\n<p>Over three years, we got to know each other on campus, learning, mentoring, exchanging and growing together. The students behind those masks have become mature adults and will one by one enter professional workplaces. The last table shows that a class of 39 students at a university of science and technology earned a huge total of 137 professional certificates during their time at school through the efforts of teachers and students (some were still taking Amadeus certification exams at noon on 0522), which is what allowed them to win enviable internship placements in fierce competition with other schools.<\/p>\n<p>As their teacher I am very proud, and I look forward to everyone showing confidence in their internships over the coming year. For the students still on campus, study actively, and, like the wishes written on the sky lanterns, I hope our whole class will ALL PASS.<\/p>\n<h1>ColaTour7Students<\/h1>\n<h1>SoutheastTravel1Student<\/h1>\n<h1>HangJiaTravel3Students<\/h1>\n<h1>HuangXiangInternational2Students<\/h1>\n<h1>TaoyuanAirGroundHandling4Students<\/h1>\n<h1>UniAir4Students<\/h1>\n<h1>EVAAir4Students<\/h1>\n<h1>StarLux2Students<\/h1>\n<h1>TaiwanHighSpeedRail2Students<\/h1>", "zt": "天道酬勤、業道酬精"}, {"id": "01fb66ce", "file": "2024-05-02-01fb66ce", "date": "2024-05-02", "title": "Moving to Hualien: Lotus Building", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Family & Pets", "src": "方格子", "url": "https://vocus.cc/article/6633117dfd89780001fb66ce", "ex": "Ray recalls renting a sea-and-mountain-view flat in Hualien, the realities of young family life there, and why moving to the countryside is harder than it looks.", "len": 633, "body": "<p>After living in Taipei for over thirty years, I suddenly decided, because of a job change, to move to Hualien, an island within the island. Naively, all I wanted was a home with a view of both mountains and sea. This was an apartment building on the border of Hualien City and Jian Township. From the windows you could see the Pacific Ocean, from the corridor you could see the Central Mountain Range, the nearby hill on the left was Liyu Mountain, and behind it was Liyu Lake, Hualien's largest inland lake. Two bedrooms, one living room and one bathroom for NT$10,000 a month felt reasonable to a Taipei person, and the sea and mountain views were truly priceless.<\/p><p>We lived in the Lotus Building beside the Qizichuan River for more than a year. Across the river in Jian, we found Baojuxiong Daycare Centre, which looked after our child during the day, giving both me and my family time of our own. Overall, the one who had the hardest time was our dog. She could only live on the balcony, because it was inconvenient with a baby in the house, and I would only take her downstairs for a walk when I had time.<\/p><p><b>I sincerely advise against keeping a dog while you are young and struggling. Without the time and space to love them properly, it is a pity for both person and dog.<\/b><\/p><p>This short-term rental in the Lotus Building was from 2006 to 2007, our temporary home in Hualien. Once we were settled, we thought about buying a place nearby. Wherever you live, if the rent and the mortgage payments work out to be about the same, you should make buying a home your top priority. Taking NT$10,000 a month for principal and interest as our budget, we tried searching in Hualien for homes with a total price of NT$2 million to NT$2.5 million. With the youth housing loan and our work income, if we lived frugally we could surely own a small place of our own. I will tell you about the one we eventually bought later. As for this rental, we actually offered NT$1.5 million to buy it, but the landlord was unwilling to sell, and the other units in the same building were too large and beyond our budget and ability. A young couple should do what they can within their means and treat family stability as the core of everything. Don't be too ambitious and make decisions you cannot afford.<\/p><p>The beauty of Hualien's sea and mountains honestly doesn't belong to young people struggling to get ahead. Busy every day with work, raising a child and the pressure of daily finances, the sea and mountains instead became a kind of separation from life. I also felt a haze of uncertainty about the future, because the mountains and sea are there every day, but so is the pressure of life that you have to face every day. It is a very contradictory feeling.<\/p><p>In recent years Taiwan has been promoting regional revitalisation as a policy. Honestly, it is far too romantic a plan. The two most important parts of revitalisation are the economy and the birth rate. In Hualien or other remote areas, unless your family has land, a house and a business, romantic ideas will only lead young people into a huge swamp where it is hard to grow and progress.<\/p><p>Only by moving to Hualien myself did I learn that reality is hard to beat imagination.<\/p><p>The great Hualien earthquake of 2024.4.3 caused losses that are hard to estimate. Thinking back to the Lotus Building, where we settled when we moved to Hualien 18 years ago, and comparing it with the building's terrible state right now, my regret and pain are still hard to calm.<\/p>", "zt": "移居花蓮：蓮花大樓"}, {"id": "f1714195429", "file": "2024-04-27-f1714195429", "date": "2024-04-27", "title": "Yesterday, Teaching World Tourism Geography in the Pouring Rain, I Told My Students About Record Heat in Southeast Asia", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "In the Classroom", "det": "Mentor & Students", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A short note on teaching about extreme heat in Thailand and South Asia, and hoping students will turn their attention from TV dramas back to the real world.", "len": 139, "body": "<p>Yesterday, while teaching my World Tourism Geography class in the pouring rain, I shared with my students that Thailand and other South and Southeast Asian countries are facing unprecedented heat in mid to late April.<\/p>\n<p>I know I can only explain to a few dozen people the impact of climate change on tourism and many industries. I also reminded the students sitting in air-conditioned comfort that in many parts of Southeast Asia, schools have no air conditioning at all, and governments and schools have done little to prepare for how to keep students learning in such hot conditions.<\/p>\n<p>I hoped that the students, heads down watching the handsome winter outfits of Kim Soo-hyun in \"Queen of Tears\", could bring their concern for the world around them back from the plot to reality. But I know that is hard.<\/p>\n<p><a href=\"https://www.channelnewsasia.com/asia/extreme-heat-southeast-asia-thailand-philippines-bangladesh-4288991\">https://www.channelnewsasia.com/asia/extreme-heat-southeast-asia-thailand-philippines-bangladesh-4288991<\/a><\/p>", "zt": "昨天在大雨中上世界觀光地理課程時，向學生分享泰國等南亞各…"}, {"id": "f1713759926", "file": "2024-04-22-f1713759926", "date": "2024-04-22", "title": "[Admission Routes for Universities of Technology and Technical Colleges, Academic Year 113]", "cat": "Vocational Education", "cats": ["Vocational Education"], "sub": "Admissions", "det": "University Entrance", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A look at the 2024 technical-college entrance exam: fewer candidates each year, 55,886 places, and why HWU's Department of Travel Management offers practice-oriented training.", "len": 267, "body": "<p>[Admission Routes for Universities of Technology and Technical Colleges, Academic Year 113]<\/p>\n<p>This morning I received the PDF from the Strategy Committee for Universities of Technology, more than fifty pages, posted publicly on FB for reference.<\/p>\n<p>The Academic Year 113 Unified Entrance Exam for Technological and Vocational Colleges (a bit like the five-year junior college joint entrance exam we had in the past) takes place next weekend. Many students around us will be sitting the exam for two days, so please cheer them on.<\/p>\n<p>According to the Technological and Vocational Education Entrance Examination Center Foundation:<\/p>\n<p>This year, 2024 (Academic Year 113), 69,361 vocational high school students registered for the exam, 4,620 fewer than in Academic Year 112.<\/p>\n<p>There are fewer candidates every year. The four-year universities of technology offer 55,886 places in total, of which national universities of technology account for 13,983. That means about 20% of these candidates will end up at national schools. For group 17, Hospitality and Tourism, which is relevant to HWU's Department of Travel Management, there are 9,127 candidates this year (10,411 last year), a one-tenth drop year on year.<\/p>\n<p>If you've read this far, please also cheer on the admissions teachers at our private universities of technology.<\/p>\n<p>Sources (download from the comments):<\/p>\n<p>Strategy Committee for Technological and Vocational Institutions<\/p>\n<p>Total Quantity Control Group for Technological and Vocational Institutions<\/p>\n<p>Technological and Vocational Education Entrance Examination Center Foundation<\/p>\n<h1>NoWantToTalkAboutLearningPortfolios<\/h1>\n<h1>NoWantToTalkAboutPaperExamsMotivationForVocationalStudents<\/h1>\n<h1>VocationalStudentsLostInMultipleAdmissionRoutes<\/h1>\n<h1>VocationalStudentsJustWantToLearnSkillsAndWork<\/h1>\n<h1>VocationalStudentsOftenWorkPartTimeBetweenClasses<\/h1>\n<h1>VocationalStudentsHaveHighStudentLoanRates<\/h1>\n<h1>NT$183HourlyWageCantGoInLearningPortfolio<\/h1>\n<h1>WorkHoursCantGoInMultipleAchievements<\/h1>\n<p>If you have any of the above troubles, please message me privately, for the following reasons:<\/p>\n<h1>HWUTravelManagement<\/h1>\n<h1>PracticeOfCabinCrewAndTravelInternshipEmploymentOrientation<\/h1>\n<h1>HsingWuUniversityDepartmentOfTravelManagement<\/h1>\n<h1>TravelManagementTourismPracticeTrack<\/h1>\n<h1>TravelManagementAirlineServiceManagementTrack<\/h1>\n<h1>TourismAndHospitalityProfessionalCertificationCoaching<\/h1>\n<h1>ReservationSystemCertification<\/h1>\n<h1>TOEICCoaching<\/h1>\n<h1>TravelAgencyInternship<\/h1>\n<h1>GroundHandlingInternship<\/h1>\n<h1>OverseasServiceIndustryInternship<\/h1>", "zt": "【113學年度 科技大學及技術學院入學方式】"}, {"id": "f1712796598", "file": "2024-04-11-f1712796598", "date": "2024-04-11", "title": "In Remembrance of My Good Friend, Professor Chen-Hsiung Tsui", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Growing Up", "det": "Work & Moving", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "A tribute to Professor Chen-Hsiung Tsui, whose thoughtfulness during our 2007 Macau visit showed me what a true hospitality professional is.", "len": 343, "body": "<p>In Remembrance of My Good Friend, Professor Chen-Hsiung Tsui<\/p>\n<p>If you ask me what a true hospitality professional is, it is someone who thinks of others in everything.<\/p>\n<p>In 2007 I was the liaison and organiser of the Hong Kong and Macau study visit for Taiwan Hospitality &amp; Tourism College in Hualien, and that is how I came to know Teacher Tsui, who was then doing his doctorate in Macau. When I arrived in Macau with the group led by President Lee, Teacher Tsui, the contact I had been in touch with all along, was already waiting to meet us in the lobby of the newly opened Venetian.<\/p>\n<p>As soon as he saw me, Teacher Tsui pulled me aside and handed me a mobile phone with a Macau number, saying: if you need to get in touch these few days, use this phone and call him directly. I did not need to worry about the activities ahead, because he had already coordinated and arranged with all the units.<\/p>\n<p>After that we visited the newly opened Venetian Macao, the Macau University of Science and Technology, the Institute for Tourism Studies, the World Heritage areas and more, and the whole itinerary went smoothly and happily. Of course I never made a call on that phone, but it is hard to put into words how much pressure that little connection took off me as the organiser.<\/p>\n<p>Later, we were fortunate to become colleagues in the Department of Hospitality Management at Hualien's Taiwan Hospitality &amp; Tourism College. He even took over the students of the homeroom class I had led, after I moved to HWU, and with even more love and patience trained a new generation of professionals for the tourism and hospitality industry. Because of this fate, and because we shared the same ideals and outlook as hospitality people, we often kept in touch online to send each other peace and blessings.<\/p>\n<p>At this moment, I remember Teacher Tsui with gratitude. May his merits be complete, may he be free from suffering and attain happiness. Amitabha!<\/p>", "zt": "感念好友-崔震雄教授"}, {"id": "f1712197631", "file": "2024-04-04-f1712197631", "date": "2024-04-04", "title": "20240403 Hualien Earthquake", "cat": "Life & Memories", "cats": ["Life & Memories"], "sub": "Family", "det": "Kids", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Ray reflects on the eight years his family spent in Hualien and the people who cared for them, and prays for the earthquake-hit city to recover.", "len": 249, "body": "<p>20240403 Hualien Earthquake<\/p>\n<p>Friends often ask about our family's eight years of life in Hualien. I usually answer: it was a blessing from heaven to our family, giving us work in Hualien and a home in which to raise our children.<\/p>\n<p>For all this I have to thank my dear classmate Alumi Lu, who recommended me for a teaching post in Hualien back then. Afterwards we met so many colleagues, teachers, good friends and students who looked after our family. Because of these connections, our lives were enriched and our days were full and good.<\/p>\n<p>Because of these connections, the wounds on this land are tied to us. Especially since we came back to work in Taipei in recent years, I often think of our life in Hualien. On sleepless nights I still faintly imagine the calm, comfortable air of the rift valley, pretending that outside the window there is still a sky full of stars and the occasional chirp of insects. Those mountains, that water and those people are what I lean on to calm my body and mind.<\/p>\n<p>I dare not watch the videos of falling rocks on the Suhua Highway. I dare not look squarely at each damaged house and the people in them. I cannot bear to look at the fire at National Dong Hwa University, alma mater of our dog's mum and dog. I feel deeply uneasy for not being there with them.<\/p>\n
