, to put out (a fire or light)<\/p>\n<p>ceramic, (adj/n), 陶瓷的；陶瓷製品, made of clay or a clay object<\/p>"}, {"id": "f1762437660", "date": "2025-11-06", "title": "【每日英領50字】Day3 2025.11.6", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【每日英領50字】Day3 2025.11.6 delight, (n/v), 高興；使高興, great pleasure or to please unwilling, (ad", "len": 1361, "body": "<p>【每日英領50字】Day3 2025.11.6<\/p>\n<p>delight, (n/v), 高興；使高興, great pleasure or to please<\/p>\n<p>unwilling, (adj), 不願意的, not ready or eager to do something<\/p>\n<p>compete against, (v), 與...競爭, to try to win against someone<\/p>\n<p>hostile, (adj), 敵意的, unfriendly or antagonistic<\/p>\n<p>competence, (n), 能力, the ability to do something successfully<\/p>\n<p>mastery, (n), 精通, expert skill or knowledge<\/p>\n<p>hesitation, (n), 猶豫, pause due to uncertainty or doubt<\/p>\n<p>embrace, (v/n), 擁抱；接受, to hug or accept willingly<\/p>\n<p>particle, (n), 微粒, a very small piece or part<\/p>\n<p>looking back on, (phr), 回顧, reflecting on the past<\/p>\n<p>inappropriate, (adj), 不適當的, not suitable or proper<\/p>\n<p>pollutant, (n), 污染物, something that contaminates<\/p>\n<p>contamination, (n), 污染, the act of making something impure<\/p>\n<p>unruly, (adj), 難以管教的, disorderly or hard to control<\/p>\n<p>elsewhere, (adv), 在別處, in or to another place<\/p>\n<p>tragic, (adj), 悲劇的, causing great sadness<\/p>\n<p>exaggeration, (n), 誇張, making something seem larger or more extreme<\/p>\n<p>accurately, (adv), 精確地, in a correct or exact way<\/p>\n<p>ranging, (v), 範圍從...到..., varying between limits<\/p>\n<p>on behalf of, (phr), 代表..., as a representative of<\/p>\n<p>durable, (adj), 耐用的, able to last a long time<\/p>\n<p>highlight, (v/n), 強調；亮點, to emphasize or the best part<\/p>\n<p>tangible, (adj), 有形的；可感知的, perceptible by touch or clearly real<\/p>\n<p>generic, (adj), 一般的；無特定的, not specific or branded<\/p>\n<p>authentic, (adj), 真實的, genuine or real<\/p>\n<p>resemble, (v), 像, to look or be like<\/p>\n<p>identity, (n), 身份, who someone is<\/p>\n<p>identical, (adj), 完全相同的, exactly the same<\/p>\n<p>identikit, (n), 模擬畫像, a facial composite used to identify suspects<\/p>\n<p>identify, (v), 辨認, to recognize or name someone or something<\/p>\n<p>put up, (phr), 張貼；搭建, to display or build something<\/p>"}, {"id": "f1762351911", "date": "2025-11-05", "title": "【每日英領50字】Day2 2025.11.5", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【每日英領50字】Day2 2025.11.5 multiple, (adj), 多個的, more than one lengthy, (adj), 冗長的, long and ", "len": 2021, "body": "<p>【每日英領50字】Day2 2025.11.5<\/p>\n<p>multiple, (adj), 多個的, more than one<\/p>\n<p>lengthy, (adj), 冗長的, long and often tedious<\/p>\n<p>abducted, (v), 被綁架的, taken away illegally<\/p>\n<p>suspended, (v/adj), 暫停的；被停職的, temporarily stopped or removed<\/p>\n<p>conceal, (v), 隱藏, to hide<\/p>\n<p>dignify, (v), 使有尊嚴, to give distinction or honor<\/p>\n<p>glimmer, (n/v), 微光；閃爍, faint light or to shine faintly<\/p>\n<p>intrude, (v), 闖入, to enter without permission<\/p>\n<p>furry, (adj), 毛茸茸的, covered with fur<\/p>\n<p>pest, (n), 害蟲；討厭的人, harmful insect or annoying person<\/p>\n<p>wells, (n), 水井, deep holes for water<\/p>\n<p>validity, (n), 有效性, the state of being legally or logically sound<\/p>\n<p>designated, (adj/v), 指定的, officially assigned<\/p>\n<p>bargain, (n/v), 便宜貨；討價還價, good deal or to negotiate<\/p>\n<p>conveyor, (n), 傳送帶, a mechanical device for moving items<\/p>\n<p>flourish, (v), 繁榮, to grow or develop well<\/p>\n<p>pleasant, (adj), 愉快的, enjoyable or agreeable<\/p>\n<p>flammable, (adj), 易燃的, easily set on fire<\/p>\n<p>crunchy, (adj), 鬆脆的, making a crisp sound when chewed<\/p>\n<p>crusty, (adj), 有硬皮的, having a hard outer layer<\/p>\n<p>permissible, (adj), 可允許的, allowed by rules or laws<\/p>\n<p>perishable, (adj), 易腐壞的, likely to decay or spoil<\/p>\n<p>allergies, (n), 過敏, adverse immune reactions<\/p>\n<p>dilemmas, (n), 兩難困境, difficult choices between options<\/p>\n<p>fallacies, (n), 謬誤, mistaken beliefs or errors in reasoning<\/p>\n<p>twisters, (n), 龍捲風, tornadoes<\/p>\n<p>excursion, (n), 短途旅行, a short journey or trip<\/p>\n<p>speculation, (n), 推測；投機, forming a theory or risky investment<\/p>\n<p>empathetic, (adj), 有同理心的, showing understanding of others' feelings<\/p>\n<p>epidemic, (n/adj), 傳染病；流行的, widespread disease or trend<\/p>\n<p>intensive, (adj), 密集的, concentrated and thorough<\/p>\n<p>regain, (v), 恢復, to get back something lost<\/p>\n<p>assimilation, (n), 同化, absorption into a culture or system<\/p>\n<p>dissemination, (n), 傳播, spreading of information or ideas<\/p>\n<p>rehabilitation, (n), 復健；復原, process of recovery or restoration<\/p>\n<p>solicitation, (n), 懇求；招攬, asking for or trying to obtain something<\/p>\n<p>extravagant, (adj), 奢侈的, spending excessively<\/p>\n<p>intrinsic, (adj), 本質的, inherent or natural<\/p>\n<p>applause, (n), 鼓掌, clapping to show approval<\/p>\n<p>improvise, (v), 即興創作, to create without preparation<\/p>\n<p>sacrifice, (v/n), 犧牲, to give up something for a greater cause<\/p>\n<p>testify, (v), 作證, to give evidence in court<\/p>\n<p>spontaneity, (n), 自發性, impulsive or unplanned behavior<\/p>\n<p>rucksack, (n), 背包, a backpack<\/p>\n<p>dimensions, (n), 尺寸；範圍, measurements or aspects<\/p>\n<p>regulations, (n), 規定, official rules<\/p>\n<p>confiscate, (v), 沒收, to seize by authority<\/p>\n<p>disclose, (v), 揭露, to reveal or make known<\/p>"}, {"id": "f1762245897", "date": "2025-11-04", "title": "【每日英領50字】Day1 2025.11.4", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【每日英領50字】Day1 2025.11.4 be engaged in,(phr),從事,take part in be afflicted by,(phr),受…所苦；遭受,", "len": 1365, "body": "<p>【每日英領50字】Day1 2025.11.4<\/p>\n<p>be engaged in,(phr),從事,take part in<\/p>\n<p>be afflicted by,(phr),受…所苦；遭受,suffer from<\/p>\n<p>draw from,(phr),汲取；提取,get<\/p>\n<p>cater to,(phr),迎合；提供服務,serve<\/p>\n<p>abuse,(v),濫用；虐待,hurt<\/p>\n<p>chant,(v),唱誦；反覆說,sing<\/p>\n<p>mourn,(v),哀悼；悲傷,feel sad<\/p>\n<p>arrogant,(adj),傲慢的；自大的,proud<\/p>\n<p>eventual,(adj),最終的；最後的,final<\/p>\n<p>mystical,(adj),神秘的；宗教的,magic<\/p>\n<p>compostable,(adj),可堆肥的；可分解的,natural<\/p>\n<p>disposable,(adj),一次性的；可丟棄的,throwaway<\/p>\n<p>dissectible,(adj),可解剖的；可分析的,cuttable<\/p>\n<p>elevate,(v),提升；抬高,raise<\/p>\n<p>plank,(n),木板；板條,board<\/p>\n<p>pedestrian,(n),行人；步行者,walker<\/p>\n<p>blizzard,(n),暴風雪；大風雪,snowstorm<\/p>\n<p>expand,(v),擴展；膨脹,grow<\/p>\n<p>assess,(v),評估；估價,check<\/p>\n<p>oppose,(v),反對；對抗,not agree<\/p>\n<p>opt for,(phr),選擇；決定,choose<\/p>\n<p>ashore,(adv),上岸；在岸上,on land<\/p>\n<p>equipped,(adj),配備齊全的；準備好的,ready<\/p>\n<p>geyser erupts,(phr),間歇泉噴發；水柱爆發,water shoots<\/p>\n<p>spectacular,(adj),壯觀的；精彩的,amazing<\/p>\n<p>pessimistic,(adj),悲觀的；消極的,sad<\/p>\n<p>insights,(n),洞察力；見解,ideas<\/p>\n<p>touted,(v),被吹捧；宣傳,sold<\/p>\n<p>roamed,(v),漫遊；閒逛,walked<\/p>\n<p>munched,(v),咀嚼；吃,ate<\/p>\n<p>buckle,(v),扣住；彎曲,close<\/p>\n<p>fort,(n),堡壘；要塞,strong building<\/p>\n<p>lard,(n),豬油；動物脂肪,fat<\/p>\n<p>clan,(n),宗族；家族,family<\/p>\n<p>apprehend,(v),逮捕；理解,take<\/p>\n<p>appraise,(v),評價；估價,check<\/p>\n<p>capability,(n),能力；才能,skill<\/p>\n<p>captivity,(n),囚禁；束縛,prison<\/p>\n<p>compliment,(n),讚美；恭維,nice words<\/p>\n<p>complement,(n),補充物；配件,extra part<\/p>\n<p>compensation,(n),補償；報酬,money<\/p>\n<p>complimentary,(adj),免費的；讚美的,free<\/p>\n<p>carousel,(n),旋轉木馬；行李轉盤,ride<\/p>\n<p>declaration,(n),宣言；聲明,saying<\/p>\n<p>declare,(v),宣布；聲明,say<\/p>\n<p>dormant,(adj),休眠的；暫停活動的,not active<\/p>\n<p>erupted,(v),爆發；噴出,exploded<\/p>\n<p>aligned,(v),對齊；一致,lined up<\/p>\n<p>drafted,(v),起草；徵召,wrote<\/p>\n<p>feasted,(v),盛宴；大吃大喝,ate a lot<\/p>"}, {"id": "f1762133609", "date": "2025-11-03", "title": "【拿筷子vs拿筆】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【拿筷子vs拿筆】 圖上方的拿筷子的方式是小時候家人教的。主要的運用就是下方的筷子是不動的，只用三隻手指來控制上方的筷子。 因為人都是先會吃才會寫字的，所以當寫字時沒人教時，我寫字", "len": 448, "body": "<p>【拿筷子vs拿筆】<\/p>\n<p>圖上方的拿筷子的方式是小時候家人教的。主要的運用就是下方的筷子是不動的，只用三隻手指來控制上方的筷子。<\/p>\n<p>因為人都是先會吃才會寫字的，所以當寫字時沒人教時，我寫字時的拿法就錯了，將筆靠在無名指上寫字，這樣拿筆方式的缺點就是不平衡會造成運字時用太多的力，此外寫字的活動半徑也不足，所以要移動手腕甚至是手臂來寫字，速度快不起來。<\/p>\n<p>但我在25歲左右利用機會修正了握筆的方式，因為那半年間我在南陽街與國家圖書館準備研究所考試，每天都要大量地寫字記筆記，我決定就利用機會來改自己的握筆姿勢。從寫得很醜一直寫到自己可以看得下去。<\/p>\n<p>因為我的課堂中學生都需要寫筆記，我也要看他們寫的字，我知道AI及電腦時代來臨了，寫字將成為遠古的能力，但當系上學生在傳寫航空公司的履歷時，幾乎都是要求要手寫，如果大家有機會看到手寫與電腦打的履歷表時，會有很深的感覺：看到手寫字時就會想像那個人的樣子，甚至是個性；但是電腦印表機印出來的文字冷冰冰的，一點感覺也沒有。<\/p>\n<p>如果凱莉今日才成為我的學生，祢的履歷將是最美的那一張。<\/p>"}, {"id": "f1761963244", "date": "2025-11-01", "title": "【最不滿意的航空公司！？】", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【最不滿意的航空公司！？】 英國一家數據調查公司 Click Intelligence 利用網路及AI分析的報導在引導視聽，這家公司表示它透過分析全球主要航空公司的四項關鍵品質指標", "len": 1906, "body": "<p>【最不滿意的航空公司！？】<\/p>\n<p>英國一家數據調查公司 Click Intelligence 利用網路及AI分析的報導在引導視聽，這家公司表示它透過分析全球主要航空公司的四項關鍵品質指標，開發了一項航空公司不滿意度指數。研究人員檢視了乘客體驗評分（1 至 10 分）、航空公司評級機構 Skytrax 的星級評定（1 至 5 星）、標準化投訴搜尋量以及記錄重大事故和營運故障的安全記錄。航空公司得分範圍為 0 至 100 分，分數越高表示乘客滿意度越低。分析數據包括每家航空公司的年客運量、航線目的地以及與客戶投訴和安全事件相關的具體指標。<\/p>\n<p>但是這家Click Intelligence卻在文後提出了免責聲明，表示乘客的個人體驗可能有所不同。航空公司及其服務隨時可能發生變化，讀者在做出旅行決定時就參考就好，他們不負責相關的權利與義務，這樣的聲明很有趣，而且原文留言中也指出了一家在歐洲的航空公司有藉由調查買反向文的可能，所以我在轉貼報導也同樣聲明一下喔。<\/p>\n<p>因為學生對英美的航空公司比較不熟，用AI做了圖表(參考就好，文字我有整理過，但圖片部分都是ChatGPT搞的，總是會出錯。<\/p>\n<p>看看大家有沒有搭乘過以下的航空公司，以下最不滿意第一名至第十名，我也找了一些近期航空公司發生過的報導，排序我覺得並不合理，多數是英美為主的航空公司，有搭乘者是否也有同感呢？<\/p>\n<h1>1美國航空 (American Airlines)<\/h1>\n<p>根據 Associated Press、《Washington Post》及 ABC News 等報導指出，2025 年 1 月 29 日，美國航空 5342 航班與一架黑鷹直升機在華盛頓特區波托馬克河上空發生空中相撞事故，造成 67 人罹難，為美國 16 年來首起重大商業航班事故。<\/p>\n<h1>2邊疆航空 (Frontier Airlines)<\/h1>\n<p>根據《Newsweek》及《Times of India》 等報導指出，2024-2025 年間邊疆航空連續在美國取得最多客訴，主因包括航班取消、行李遺失及退款延遲，且 2025 年因機場員工與旅客衝突影片在社群媒體爆紅而被解雇。<\/p>\n<h1>3聯合航空 (United Airlines)<\/h1>\n<p>根據 Reuters 及 AP News 等報導指出，2024 年至 2025 年間，聯合航空發生多起包括引擎火災與艙內面板脫落事件，導致美國聯邦航空局（FAA）加強監管，CEO 亦公開致信乘客承諾改善安全。<\/p>\n<h1>4法國航空 (Air France)<\/h1>\n<p>根據 SecurityWeek、《Bleeping Computer》及 Forbes 等報導指出，2025 年 8 月，法國航空與其集團旗下 KLM 遭遇第三方系統駭客入侵，部分客戶資料（如姓名、聯絡資訊、忠誠計劃會員號碼）外洩，雖未涉及信用卡或護照資料，但引發乘客對隱私的疑慮。<\/p>\n<h1>5瑞安航空 (Ryanair)<\/h1>\n<p>根據該公司官方新聞稿及《The Guardian》報導指出，2025 年 6 月 12 日起，瑞安航空實施：對造成飛機中斷或卸機的乘客處以最低 500歐元罰款，以遏止機上不當乘客行為。<\/p>\n<h1>6亞洲航空 (AirAsia)<\/h1>\n<p>根據 AirAsia 官方新聞及 Malay Mail 報導指出，2024 年 7 月，亞洲航空在全球航空系統大規模 IT 故障期間，透過約 3,000 班次接載超過 500,000 名旅客，航班運營率超過 99%，顯示其營運連續能力。<\/p>\n<h1>7墨西哥航空 (Aeroméxico)<\/h1>\n<p>根據 Mexico Business News 報導指出，2025 年 7 月 28 日，墨西哥航空機型 AM190 回航原因為客艙壓力系統故障，機上氧氣面罩彈出，旅客安全降落，且為近期該公司第三起重大安全事件，墨西哥民航局（AFAC）已展開調查。<\/p>\n<h1>8北歐航空 (Scandinavian Airlines, SAS)<\/h1>\n<p>我覺得斯堪地那維亞航空(北歐航空)被排進來有點不太合理，因為經查詢後發現，近期公開報導中並無明確指出 2024-2025 年間北歐航空有重大顧客受損或營運中斷事件。<\/p>\n<h1>9威茲航空 (Wizz Air)<\/h1>\n<p>沒聽說這家地區性的航空公司，根據《The Independent》調查報導指出，2024 年 7 月 31 日，威茲航空在英國被評為客戶服務最差的航空公司，其乘客抱怨客服回應慢、態度不佳，57% 的受訪者表示遭遇不滿意客服經驗。<\/p>\n<h1>10英國航空 (British Airways)<\/h1>\n<p>根據《The Guardian》、《Financial Times》及 AirwaysMag 報導指出，2024-2025 年期間，英國航空因系統技術故障多次在希斯羅機場導致航班延誤與取消，主因包括機組排班複雜／機隊維護需求增加／預算壓力，而在安全事故雖較少但顧客體驗並不好而受到了影響。<\/p>\n<p>再說一次，這個排名是 Click Intelligence 報導的看法，與整理內容者無關。以上內容及圖片均由AI協作，主要文章出處放在留言區。<\/p>"}, {"id": "f1761524323", "date": "2025-10-27", "title": "【東帝汶加入東協ASEAN】", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【東帝汶加入東協ASEAN】 剛上完的世界旅遊地理課程有關東帝汶的部分要更新了。 東帝汶是在印尼最東部帝汶島上的新興國家，帝汶島比台灣島小一點，約有3萬平方公里，也與台灣相同是個高", "len": 564, "body": "<p>【東帝汶加入東協ASEAN】<\/p>\n<p>剛上完的世界旅遊地理課程有關東帝汶的部分要更新了。<\/p>\n<p>東帝汶是在印尼最東部帝汶島上的新興國家，帝汶島比台灣島小一點，約有3萬平方公里，也與台灣相同是個高山島，最高峰可達近3千公尺。<\/p>\n<p>不同於印尼被荷蘭殖民，它曾被葡萄牙殖民，所以東帝汶的官方語言是德頓語和葡萄牙語；多數居民信奉天主教，而且島上也有百年前移民居住的客家人後裔。<\/p>\n<p>上世紀末東帝汶想從印尼獨立，結果被印尼當局血腥鎮壓，並強行驅離了30萬人到西帝汶成為難民。在國際的調停下，東帝汶於2002年5月20日零時正式恢復獨立，國名為東帝汶民主共和國。<\/p>\n<p>2025年10月26日第47屆東協高峰會在吉隆坡舉辦。在高峰會開幕式上，東協各國與東帝汶總理在宣言文件上蓋章簽署，正式加入東協。東帝汶總理古斯芒最後簽字，握筆時面帶微笑，難掩激動，眼裡泛著淚光。<\/p>\n<p>台灣加入的世界組織並不多，除WTO、APEC之外，幾乎在國際的合作場合上都沒有我們的位置，這幾天將要在釜山辦2025APEC亞太經濟合作會議，川寶、習大大等巨頭都會參加，但大家知道台灣總統派誰去參加與會嗎？<\/p>\n<p>在科技產業我們擁有很多的世界第一，在經濟能力上的曝光度及影響力驚人，但商人無國界、人往高處爬，與我們在政治談判的是世界強權，台灣只是拿錢在當買辦，總會有用完的一天，在國際環境中想要有真正話語權，真的很不容易。<\/p>"}, {"id": "f1761364733", "date": "2025-10-25", "title": "【美業】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【美業】 多年來，都會有從高職美容科建教班來念科大的學生，我聊天時就會問問她們手還好嗎？還會不會癢或疼，她們常常都是將做得美美指甲的手給我看，她說：老師，建教班結束後沒洗頭之後就好", "len": 664, "body": "<p>【美業】<\/p>\n<p>多年來，都會有從高職美容科建教班來念科大的學生，我聊天時就會問問她們手還好嗎？還會不會癢或疼，她們常常都是將做得美美指甲的手給我看，她說：老師，建教班結束後沒洗頭之後就好多了；但我看著她們年輕的裝容下卻有著比一般女孩粗的骨節，非常心疼。<\/p>\n<p>在y17台北市青少年育樂中心工作時，也常接美髮集團的員工訓練集氣會議，來了好多家，每次都是年會月會的，我們當場租業務最喜歡，因為他們很阿殺力，不像很多單位要折要扣地，認識這個熟那個的，就是要省一點場地費。集團在辦活動時，就如同直銷及保險業一樣，發獎金給榮譽，人人都背上著彩帶，情緒價值給到滿，讓每位在線上的從業人員有成就感，為生活堅持下去，行行出狀元。<\/p>\n<p>多年前在新北勞工會議中心受旅行業經理人訓練時，我旁邊坐是小林的老闆娘，但不太清楚是小林眼鏡？小林美髮？還是小林煎餅？她每天都貴氣十足地來上課，因為是同學就會聊一下，我問她為何要來受訓，她說她們公司常辦旅遊，每次都找外面的旅行社辦，她想自己受個訓來開一間自己賺。<\/p>\n<p>以往台灣人常說誰誰家的誰是「做頭毛的」，或是不讀書就去做「洗頭仔」，於是曼都、小林等到處都是，不出就是台灣人的打拼精神，當老闆的為了錢想盡辦法增加店面，降低成本，增加會員數量與預收費用；而其中的人力就來自於過往源源不絕的建教生，出奇低的實習津貼，每個月幾千元，卻賠上了健康與年輕的時間。<\/p>\n<p>這篇用台式洗髮的文章寫得很棒，就期待有一天，那一位我的學生有技能、有資金、有管理能力，可以像八方雲集、鼎泰豐這樣用台式服務到世界打天下，服務費收得高高的，讓做「美業」成為另一項台灣之光。<\/p>"}, {"id": "f1761272944", "date": "2025-10-24", "title": "【如何安慰失望的學生】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【如何安慰失望的學生】 昨天學生爭取一家知名航空公司實習的第二試結果通知來了，系上投了11位學生，所有履歷表還是手寫的，結果只有2位同學進入面試關，接到通知信時除了驚訝之外，當下思", "len": 1078, "body": "<p>【如何安慰失望的學生】<\/p>\n<p>昨天學生爭取一家知名航空公司實習的第二試結果通知來了，系上投了11位學生，所有履歷表還是手寫的，結果只有2位同學進入面試關，接到通知信時除了驚訝之外，當下思考了一下是要個別通知？還是公告？<\/p>\n<p>後來我決定直接公告，所有同學都會看到誰上榜了！<\/p>\n<p>想當然爾，實習準備群中是一片靜默，不是沒人回應，而且難過、受挫、失望等等情緒充滿在虛擬的空間之中。<\/p>\n<p>其實身為教師的我們也在群中，心中也是複雜的；他們班導師更是特地來找我希望為大家說說話打打氣。其實當下我也苦惱，覺得是不是該說些什麼好。<\/p>\n<p>當時正是中午上完四節課，他們導師也在高中剛上完四節義務教學，才剛開車回學校，等等下午接著四節校內課程。Respect.<\/p>\n<p>我大口吞飯，其實吞下去的是自己的情緒與失望，填入肚子中的食物是為了讓自己先打完氣，才有精神與力氣面對這群努力好一陣子的學生們。<\/p>\n<p>我決定先整理自己，吃飽後準備四份求職準備單，包含了學習證照列表、家長與個人全年實習意願表、個人資料表，並準備好104履歷之撰寫範本，在我肚子有底，心中有想法時走入低壓滿滿的課堂。<\/p>\n<p>STEP1. 抱著一大堆的空資料袋的我，上面有著學生個別的姓名，表示我是為每一位學生準備好而來的。<\/p>\n<p>STEP2. 以上的表單，用A4紙一張張列印好，排在課室前排，念到姓名的學生取走資料袋，再一張張地清點拿在自己的手上，用行為來整理自己的心情。<\/p>\n<p>STEP3. 絕口不提今早公告結果，先告知所有學生如何利用資料袋上的順序準備資料，字好看的用手寫上資料表，字難看的用電腦一字字的鍵入，在有順序及文字的撰寫中去理解自己，用寫作思考未來方向。<\/p>\n<p>STEP4. 給予支持，學生有任何的問題，導師、我及任何一位系上的教師都可以提供支援詢問，但來詢問時手上要有完整的資料，不可以空手而來。<\/p>\n<p>STEP5. 告知獲得錄取的學生盡快地準備面試、英文互動技巧，用盡自己最大的能力去面試；如果有一絲絲放棄、隨意面對的心態，知名企業的面試官一眼就可以看出來。<\/p>\n<p>STEP6. 我給個Deadline，要求學生在連假之後，完整地交付所有的資料依順序放入資料袋中，集體交給班代，班長整理之後再交給老師，並請大家隨時注意系網、Email及群內的公告，並給予反饋，養成社群好習慣。<\/p>\n<p>如何安慰失望的學生？<\/p>\n<p>很幸運地我的學生都已經成年，但多半就是18-22歲，此時個人覺得教師的角色是支持與陪練，每一次的證照考試、競賽準備、面試資料準備、實習工作面對，對年輕的他們都是很重要的學習機會，更是理解社會現實的好時機。<\/p>\n<p>而我自己收獲更多，藉此更可以反觀自己有沒有勇敢地面對自己一直在逃避的事，因為【師範】二字是動詞不是名詞。<\/p>"}, {"id": "f1761126132", "date": "2025-10-22", "title": "【醒吾旅運永續USR課程 X 雄獅旅遊幼獅導領計畫】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【醒吾旅運永續USR課程 X 雄獅旅遊幼獅導領計畫】 感謝今日雄獅旅遊賴副總與人資部李主任蒞校宣導雄獅旅遊之【幼獅導領培育計畫】，在精采的實務說明之中，賴副總也提到了旅運系學姊在部", "len": 469, "body": "<p>【醒吾旅運永續USR課程 X 雄獅旅遊幼獅導領計畫】<\/p>\n<p>感謝今日雄獅旅遊賴副總與人資部李主任蒞校宣導雄獅旅遊之【幼獅導領培育計畫】，在精采的實務說明之中，賴副總也提到了旅運系學姊在部門內的優異表現，更期望在這次的計畫活動中找到旅遊菁英。<\/p>\n<p>醒吾旅運系一直本著學習不只是在教室中學行銷、學管理，而是帶學生走出教室看台灣，體驗郵輪、鐵道，實踐人才培育與環境永續的實務發展，而今日雄獅旅遊更推出「幼獅導領計畫」讓學校有機會實戰體驗台灣綠色行程及鐵道永續觀光的實務領團工作。<\/p>\n<p>在雄獅總部辦理的課程結合👉 導遊領隊培訓＋業界講師授課＋實地導覽實作，幫助學生從「愛旅行」到「能帶團」，打造未來最有競爭力的旅遊新世代✨<\/p>\n<p>✨報名資格：年滿18歲且對旅遊、領隊工作有興趣的同學<\/p>\n<p>💡報名時間：即日起~2025.12.14<\/p>\n<p>📅上課時間：2026.01.10~2026.02.14(每周一堂課)<\/p>\n<p>雄獅幼獅計畫的報名方式已傳入旅運系群中，同學們要將熱情寫入自傳簡歷，請旅運系的學生多多參與校內開設的微學分及師資諮詢，老師們會手把手地教大家履歷自傳如何撰寫，期待大家走入旅遊業，前進全世界。<\/p>"}, {"id": "f1761016549", "date": "2025-10-21", "title": "【外籍生 1+4國際專班】EP3", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【外籍生 1+4國際專班】EP3 附圖是我們一年級的越南同學在上觀光基礎課程時的筆記，大家可以回想一下自己在剛學方塊字時的小學時期，是如何在格子內想盡辦法地用正確的筆畫將所有的線條", "len": 1135, "body": "<p>【外籍生 1+4國際專班】EP3<\/p>\n<p>附圖是我們一年級的越南同學在上觀光基礎課程時的筆記，大家可以回想一下自己在剛學方塊字時的小學時期，是如何在格子內想盡辦法地用正確的筆畫將所有的線條寫進去，再看看這幾張只學了幾個月華文的學生，如何地在每節課都要交出這樣的學習單，我時常看著學生的筆記發呆，在這個手機數位的時代中，有學習力與進取心是如何珍貴。<\/p>\n<p>再來介紹一下什麼是【1+4國際專班】，簡言之就是來台灣念5年書，第1年學華語，後4年念專業系所，成績優秀者有機會留台任職，今年醒吾旅運系就有一班同學已經開始上課，現正在一年的華語訓練中，期待進入正式系統之後對中文語言的聽說讀寫都更好。<\/p>\n<p>如果我是優秀又有經濟壓力的外國學生，對台灣的半導體設計與製造非常有興趣，可以申請嗎？當然有機會。<\/p>\n<p>2025年台灣共63所大專院校申請【1+4國際專班】，計畫名稱「重點產業領域擴大招收僑生港澳學生及外國學生實施計畫」，以台灣六大重點產業：電子商務(含資訊處理)、服務類科、製造業、營造業、農業及長照等為主要招生系所，而且可規劃開設校外實習課程，所以學生要學習+工作在法規上是可行的。<\/p>\n<p>有那些學校有參加呢？附圖中有列示網址，可自行查詢申請方式，因為多半是由個別學校專班招生，不一定會與台灣學生同班學習，這個前題可能要先讓外籍同學了解。<\/p>\n<p>以下列出台灣學校2025年有招1+4國際專修班的校名(依筆畫排序)<\/p>\n<p>大同大學<\/p>\n<p>大葉大學<\/p>\n<p>中國文化大學<\/p>\n<p>中國科技大學<\/p>\n<p>中國醫藥大學<\/p>\n<p>中華大學<\/p>\n<p>中臺科技大學<\/p>\n<p>元智大學<\/p>\n<p>台南應用科技大學<\/p>\n<p>弘光科技大學<\/p>\n<p>正修科技大學<\/p>\n<p>玄奘大學<\/p>\n<p>元培醫事科技大學<\/p>\n<p>佛光大學<\/p>\n<p>吳鳳科技大學<\/p>\n<p>宏國德霖科技大學<\/p>\n<p>亞洲大學<\/p>\n<p>明新科技大學<\/p>\n<p>東南科技大學<\/p>\n<p>南臺科技大學<\/p>\n<p>建國科技大學<\/p>\n<p>修平科技大學<\/p>\n<p>真理大學<\/p>\n<p>健行科技大學<\/p>\n<p>國立東華大學<\/p>\n<p>國立高雄大學<\/p>\n<p>國立勤益科技大學<\/p>\n<p>國立彰化師範大學<\/p>\n<p>國立暨南國際大學<\/p>\n<p>國立臺北護理健康大學<\/p>\n<p>崑山科技大學<\/p>\n<p>敏實科技大學<\/p>\n<p>淡江大學<\/p>\n<p>逢甲大學<\/p>\n<p>景文科技大學<\/p>\n<p>朝陽科技大學<\/p>\n<p>開南大學<\/p>\n<p>義守大學<\/p>\n<p>萬能科技大學<\/p>\n<p>嘉南藥理大學<\/p>\n<p>實踐大學<\/p>\n<p>臺北市立大學<\/p>\n<p>臺北城市科技大學<\/p>\n<p>輔英科技大學<\/p>\n<p>銘傳大學<\/p>\n<p>育達科技大學<\/p>\n<p>德育護理健康學院<\/p>\n<p>德明財經科技大學<\/p>\n<p>黎明技術學院<\/p>\n<p>樹德科技大學<\/p>\n<p>醒吾科技大學<\/p>\n<p>靜宜大學<\/p>\n<p>龍華科技大學<\/p>\n<p>以上所有的學校應該都是獨立招生，前天還聽聞一位同業教師要用三天二夜去越南口試跑5所學校，至為辛苦。台灣政府沒安排什麼入學聯招考試之類的內容，就看每個學校可以提出多少的師資及設施來向教育部專案申請，想了解更多學校的資訊，就只得到各校網站去詢問承辦單位。以醒吾來說，我們設有國際處及語言中心在進行專案申請與學生管理，而課程就交由各系科進行設計安排。<\/p>\n<p>看看上課學生的筆記，想想他們練習口說與認讀中文時的上課情形，我反而覺得身為教師的自己應該要去修外語，來多多了解這些異鄉的學子，還有他們美麗的家鄉。<\/p>"}, {"id": "f1760945406", "date": "2025-10-20", "title": "【外籍生】EP2", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【外籍生】EP2 雖然大家生活上一直看到外籍服務人員或學生，我們系上也是越來越多，附圖的照片中就是上個月剛到台灣的大一新生，我好奇的是真正明確的數字？ 台灣教育部統計：113學年度", "len": 458, "body": "<p>【外籍生】EP2<\/p>\n<p>雖然大家生活上一直看到外籍服務人員或學生，我們系上也是越來越多，附圖的照片中就是上個月剛到台灣的大一新生，我好奇的是真正明確的數字？<\/p>\n<p>台灣教育部統計：113學年度全體大專校院學生數1,074,365 人，113學年度大專境外生總人數123,188人，佔11.47%的學生數；過往境外生人數最高時期的107學年，大專境外生總人數129,207人，當年的大學學生總數是1,244,822人，境外生佔全體學生數的10.37%，且107學年排名第1名的是來自中國大陸的學生，有將近3萬人(附圖)，例如明道大學畢業的趙露思就是那時來台灣念書的，其次是馬來西亞16640人，而且這些同學多數是華人。<\/p>\n<p>以下以113學年度境外生來源國來排名：<\/p>\n<p>第1名：越南 39695人<\/p>\n<p>第2名：印尼 16212人<\/p>\n<p>第3名：馬來西亞 9686人<\/p>\n<p>第4名：日本 8779人<\/p>\n<p>第5名：香港 6874人<\/p>\n<p>第6名：泰國 4765人<\/p>\n<p>第7名：菲律賓 4458人<\/p>\n<p>第8名：中國 3489人<\/p>\n<p>第9名：美國 3985人<\/p>\n<p>第10名：緬甸 2973人<\/p>\n<p>第11名：印度 2547人<\/p>\n<p>第12名：韓國 2418人<\/p>"}, {"id": "f1760862771", "date": "2025-10-19", "title": "【外籍生】EP1", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【外籍生】EP1 昨天在龜山吃晚餐時，被笑咪咪的越南學生認出來叫了聲老師！而且結帳時還加了一句：「老師你的老婆好漂亮喔！」。 當老師的我沒很在意教的學生國籍，常與他們聊天，一位位的", "len": 891, "body": "<p>【外籍生】EP1<\/p>\n<p>昨天在龜山吃晚餐時，被笑咪咪的越南學生認出來叫了聲老師！而且結帳時還加了一句：「老師你的老婆好漂亮喔！」。<\/p>\n<p>當老師的我沒很在意教的學生國籍，常與他們聊天，一位位的外地學生都是遠離家鄉在異國求生存，無論是為了學位或經濟，每一位有著自己期待的未來，有時看他們分享的FB中，也看得出每個出門的孩子都有很愛他們的家人，常常開直播聊天、分享照片，也與台灣年青人一樣喜歡看手機、打電動、聽音樂、愛漂亮、重穿著，與你與我年青時一模一樣。<\/p>\n<p>其實，我觀察外籍學生多數是真的珍惜來台灣念書的機會，大一時學生會住在校園宿舍中，大二之後就像台灣學生一樣搬到校外租屋，但與台灣學生不太一樣的是，外籍生同學有嚴格的請假規定，所以即使是早八全班仍是100%的出席率，有好好認真學習華文的學生，大三時還可以自由地選修課程。<\/p>\n<p>台灣在疫情快結束時，突然政策性地新設了好幾種針對外籍生的專班，與過往熟悉的僑大海外聯招再考試分發各大學的方式很不一樣，很多外籍生都是一班班用申請專案的方式來台灣就學，而且畢業前一定要過華語能力。<\/p>\n<p>台灣政府從技專院校先開放專班申請南向產學班，至今是全部的大學都開放申請，主辦單位則是從教育部，擴大到僑委會。以下是整理常見名稱與正式名稱的對照，看起來一樣，但魔鬼藏在細節中，簡單歸納個圖表對照。<\/p>\n<p>一、南向產學專班=(新南向產學合作國際專班)<\/p>\n<p>二、1+4國際專班=(重點產業領域之國際專修部／重點產業領域之重點產業系所/)<\/p>\n<p>三、新型專班=(國際產業人才教育專班)<\/p>\n<p>四、僑生產攜專班=(四年制產學合作學士班／二年制副學士班/)<\/p>\n<p>五、3+4僑生產攜專班=(產學攜手合作僑生專班)<\/p>\n<p>以上大家分得出來有何不同嗎？其實我也搞不清楚，所以利用假日整理了表格，還聽說其中部分的招生名額可納入大學註冊率(仍有待確認！)，但光人數的增加及學費的收入，就已是現在各級私立大專院校的續命丸，更是各地基層服務維持品質沒說出口的事實。<\/p>\n<p>如果只用一句話去說他們是來賺錢的不是來學習的，從我的角度來看，對這群半工半讀努力生活的外籍生是不公平的，我念大學時也是到處去半工半讀，而且上課出席率更差，回頭想想大學時也沒學到什麼。<\/p>\n<p>文/陳瑞峰<\/p>"}, {"id": "f1760485888", "date": "2025-10-15", "title": "【支持免師培制度的適度開放】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【支持免師培制度的適度開放】 教師的工作尊嚴與保障性早在法制上逐漸地被破壞，建議乾脆一鼓作氣地將教師法也廢除，教師這工作沒什麼需要用個專法來規範，就用就業服務法來規範教師就好，做多", "len": 767, "body": "<p>【支持免師培制度的適度開放】<\/p>\n<p>教師的工作尊嚴與保障性早在法制上逐漸地被破壞，建議乾脆一鼓作氣地將教師法也廢除，教師這工作沒什麼需要用個專法來規範，就用就業服務法來規範教師就好，做多少給多少，做不好就依法資遣解職；如果公私立學校老師都轉為勞工身份更好，勞保公保年資合併我舉雙手贊成，這樣工作年資才能累積，未來的保障大家都更為一致，省得社會中的職業對立與退俸不公平無法改進，被不合宜的法規卡得死死的。<\/p>\n<p>我原本是個白天上班族，因緣際會地被同學帶進了某所五專當個每週兼課的夜間部老師，偶而也去不同學校當個業師分享觀光休閒產業的經驗。一兩堂課的時間，光聊聊當天上班的甘苦及工作上的經驗就足以吸引學生當下的專注度，我還以為我很適合當老師。<\/p>\n<p>等真正到了學校當全職教師之後，第一學期我仍用類似的方式在上課，但不到一個月我就沒材料了，更感受到學生沒興趣；為此我向不少師長請教如何教學？如何安排課程？師長們給了很多積極的建議與方案，才發現僅以業界的故事與管理經驗僅能視為教學的點綴，只有工作經歷的交流與互動長期會造成新鮮感不足，沒有結構性的教學進度，學生與教師之間的角色不夠明確；因此，在課堂講桌前更不是只要講課就可以，還有課室管理、課程安排、階段性的進度、學習作業與成效考核，最後還要在一堂課18週結束之後接受學生的考評，來看看你上的課他們滿意與否。<\/p>\n<p>短短的說明，無法將長期面對學生的教師能力與專業說清楚，但因為我也沒有經過師培而成為大學教師（這也是制度，大學教師不用經歷師培）。但是我仍肯定教育部開放業師不用師培就可以進入校園的政策，因為報載也有太多曾被師培制度延聘進校園的老師表現地並不適任。所以只要有心在教育工作的人，有能力有經驗的專業職人、經理人，都建議進來校園內嘗試教學工作，一起來看看這個低薪多工但有點成就感，學生們荒誕又可愛的工作環境。<\/p>\n<p>文/陳瑞峰<\/p>"}, {"id": "f1760327252", "date": "2025-10-13", "title": "醒吾科技大學旅運管理系", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "醒吾科技大學旅運管理系 郵輪旅遊實務體驗活動 日期：11月28至30日(週五傍晚至週日) 集合地點：高雄旅運中心(自行安排交通) 地點航程：麗星郵輪探索星號／高雄-菲律賓佬沃-高雄", "len": 394, "body": "<p>醒吾科技大學旅運管理系<\/p>\n<p>郵輪旅遊實務體驗活動<\/p>\n<p>日期：11月28至30日(週五傍晚至週日)<\/p>\n<p>集合地點：高雄旅運中心(自行安排交通)<\/p>\n<p>地點航程：麗星郵輪探索星號／高雄-菲律賓佬沃-高雄<\/p>\n<p>費用可依個人選擇如下：<\/p>\n<p>(內側客房)<\/p>\n<p>二人一室: 每位10,000<\/p>\n<p>三人一室: 每位 8,670<\/p>\n<p>四人一室: 每位 8,000<\/p>\n<p>(海景客房)<\/p>\n<p>二人一室: 每位12,000<\/p>\n<p>三人一室: 每位10,350<\/p>\n<p>四人一室: 每位 9,500<\/p>\n<p>以上為新台幣報價<\/p>\n<p>報價包含港務費用，不包含：船公司服務小費1200及菲律賓佬沃一日岸上觀光費用(如附件PDF可自選或不參加)。<\/p>\n<p>繳費期間：114年10月31日前<\/p>\n<p>訂金：每位NT$ 5,000元<\/p>\n<p>報名需要資料：回程六個月以上效期之護照影本。<\/p>\n<p>註：若無護照請先提交基本資料以利訂位：中英文名字/出生年月日/身份證字號，護照影本請於11月12日前繳交。<\/p>\n<p>意者請填報名表：<\/p>\n<p><a href=\"https://forms.gle/XNr4wzVL5jFeq5Wr8\">https://forms.gle/XNr4wzVL5jFeq5Wr8<\/a><\/p>"}, {"id": "f1760330342", "date": "2025-10-13", "title": "醒吾科技大學旅運管理系", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "醒吾科技大學旅運管理系 郵輪旅遊實務體驗活動 日期：11月28至30日(週五傍晚至週日) 集合地點：高雄旅運中心(自行安排交通) 地點航程：麗星郵輪探索星號／高雄-菲律賓佬沃-高雄", "len": 394, "body": "<p>醒吾科技大學旅運管理系<\/p>\n<p>郵輪旅遊實務體驗活動<\/p>\n<p>日期：11月28至30日(週五傍晚至週日)<\/p>\n<p>集合地點：高雄旅運中心(自行安排交通)<\/p>\n<p>地點航程：麗星郵輪探索星號／高雄-菲律賓佬沃-高雄<\/p>\n<p>費用可依個人選擇如下：<\/p>\n<p>(內側客房)<\/p>\n<p>二人一室: 每位10,000<\/p>\n<p>三人一室: 每位 8,670<\/p>\n<p>四人一室: 每位 8,000<\/p>\n<p>(海景客房)<\/p>\n<p>二人一室: 每位12,000<\/p>\n<p>三人一室: 每位10,350<\/p>\n<p>四人一室: 每位 9,500<\/p>\n<p>以上為新台幣報價<\/p>\n<p>報價包含港務費用，不包含：船公司服務小費1200及菲律賓佬沃一日岸上觀光費用(如附件PDF可自選或不參加)。<\/p>\n<p>繳費期間：114年10月31日前<\/p>\n<p>訂金：每位NT$ 5,000元<\/p>\n<p>報名需要資料：回程六個月以上效期之護照影本。<\/p>\n<p>註：若無護照請先提交基本資料以利訂位：中英文名字/出生年月日/身份證字號，護照影本請於11月12日前繳交。<\/p>\n<p>意者請填報名表：<\/p>\n<p><a href=\"https://forms.gle/XNr4wzVL5jFeq5Wr8\">https://forms.gle/XNr4wzVL5jFeq5Wr8<\/a><\/p>"}, {"id": "f1759968363", "date": "2025-10-09", "title": "醒吾旅運炭場踏查，永續減碳教育起點", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.9.29 醒吾旅運炭場踏查，永續減碳教育起點 本次校外教學以「菁桐地區歷史與礦業文化導覽永續旅遊」為主題，旨在引導學生了解地方產業發展脈絡，並透過實地參訪，體驗鐵道與礦業", "len": 816, "body": "<p>2025.9.29<\/p>\n<p>醒吾旅運炭場踏查，永續減碳教育起點<\/p>\n<p>本次校外教學以「菁桐地區歷史與礦業文化導覽永續旅遊」為主題，旨在引導學生了解地方產業發展脈絡，並透過實地參訪，體驗鐵道與礦業對平溪地區人文景觀的影響。活動過程中，學生在導覽人員及教師的帶領下，採行綠色運具所有同學都是搭乘鐵路，從桃園、台北、瑞芳等地，一起從瑞芳車站出發，一路搭著台灣最浪漫的平溪線來到了秘境菁桐車站，依序參觀老街區、舊礦坑遺址及礦業生活館等，透過觀察、聆聽與討論，深入認識日治時期菁桐因煤礦而興盛的歷史背景，理解平溪線鐵道設立的原因與其對地方經濟的推動作用。<\/p>\n<p>醒吾旅運的學生們普遍表示，印象最深刻的景點是菁桐車站與礦坑遺跡。木造百年的舊車站保存良好，充滿濃厚懷舊氛圍，讓學生感受到早期運煤鐵道的特色與當時居民的生活情景。沿途的礦坑區則讓學生體會到礦工在狹窄空間中工作的艱辛，也學習到煤礦產業對台灣早期工業發展的重要性。此外，學生對菁桐老街的文化保存也深感興趣，街上許願竹筒、地方特產及煤礦文創商品，充分展現社區居民對歷史傳承與永續觀光結合的努力。<\/p>\n<p>整體而言，此次活動不僅增進學生對地方文化與產業歷史的理解，也培養了他們觀察環境永續與反思社會變遷的能力。學生透過實地走訪與親身體驗，從課本知識延伸到真實場域，對歷史、環境教育產生更深層的連結。同時，活動亦促進同儕間的合作與交流，提升彼此相互討論學習的互動成效，這樣的跨領域課程相信能更全面地達成體驗式學習與永續環境教育的目標。<\/p>\n<p>更重要的是，利用一整天的戶外教學活動，讓新世代的學生放下手機螢幕的光影，用五感體驗台灣周遭的旅遊美景與深度環境景點，藉由分組活動與團隊協調增進實際的言語交流，走在菁桐坐在車廂都是不同於課堂的實際體會，讓我們可以更認識彼此，在此非常謝謝醒吾旅運系長官的支持，隨隊卜遠程老師的大力支援，旅運系學會及航鐵社的重要幹部的相挺才能有這個快快樂樂出門，豐富有趣學習，平平安安回家的鐵道小旅行。<\/p>\n<p>文/陳瑞峰整理<\/p>"}, {"id": "f1759752258", "date": "2025-10-06", "title": "1030 days left", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.10.6 1030 days left 佳節愉快😄闔家平安🌝 中秋🌕月圓夜分享一篇科普文，月亮剛剛從地平線升起來的時候看起來比較大，這是真的嗎？有興趣的就把文章看完喔😐 ", "len": 1069, "body": "<p>2025.10.6<\/p>\n<p>1030 days left<\/p>\n<p>佳節愉快😄闔家平安🌝<\/p>\n<p>中秋🌕月圓夜分享一篇科普文，月亮剛剛從地平線升起來的時候看起來比較大，這是真的嗎？有興趣的就把文章看完喔😐<\/p>\n<h1>當代認知神經科學_腦與心智上課心得<\/h1>\n<p>作者：小狗子<\/p>\n<p>第一堂課的重點是物體與人臉的「辨識」，辨識和看不看得到沒有關係，而是腦內的特定神經細胞經過精細分析視神經傳遞過來影響資訊的形狀、外觀與角度後得出的結果，因此有臉盲與物盲的患者眼睛功能其實是正常的，有缺陷的部分是負責處理分析物體或人臉的腦區。<\/p>\n<p>此外，我們常自嘲自己是「臉盲」，但其實臉盲專指老師上課所述的特定腦區受損所致的症狀。我們的狀況充其量僅是「臉型辨識的能力」較差，屬於正常的個體差異範疇，主要原因和神經的可塑性有關，臉部辨識在腦內主要依賴「梭狀回」結構，擅長認臉的人此區域活動更強烈，因此有更強的神經連結。還有關於我們華人比較會認華人而較不會分辨歐美人之類的情況，也和此部分腦區的神經對我們不熟悉人種的連結較弱有關。<\/p>\n<p>第二堂課介紹了紅綠色盲（弱），老師說這是發生在X染色體上的性聯遺傳疾病，因此男性得病率較女性高出許多，我思考一下也發現自己曾遇到過的紅綠色盲（弱）的同學朋友們都是男性，竟然沒想過是這個原因所致！而老師課堂上主要介紹色盲，因此課後我查找了有關色弱的補充資料，色弱和色盲最主要的差別就是錐狀細胞功能異常（感光能力不足），細緻分類如下：最為常見的紅綠色弱可分為原紅色弱與原綠色弱，原紅色弱為負責紅光感受的L型（長波）錐狀細胞功能異常，因此紅色行為變得黯淡，容易和綠色混淆；而原綠色弱則是負責綠光感受的M型（中波）錐狀細胞異常，因此紅綠區域顏色容易混淆。而較少見的黃藍色弱則是負責藍光感受的S型（短波）錐狀細胞異常，因此藍色容易和綠色、黃色、粉色混淆。<\/p>\n<p>最後一個讓我覺得很酷的知識點是：我們會認為近地的月亮比較大顆的原因，竟然是因為我們的大腦認定「地平面附近的天空比頭頂的天空來得更遠」，雖然這樣的認知很違反直覺，但從老師上課介紹的軌道錯覺就能驗證這在我們的認知中是真實存在且正確的。而大腦會認定頭頂的天空比較近的原因，經過我額外查找資料後得知：其實是因為大腦在感知天空時，會將其想像成一個類似於碗公倒扣的半球形穹頂，因此會覺得天空是與我們距離有限且摸得著的圓頂；而在我們的視覺透視經驗中越靠近地平線附近的東西代表著越遠，因此產生地平線附近的天空較頭頂的天空遠的錯覺。此外，我還知道因為近地平有較多參考物（如建築物、樹、山等等），這些參考物會讓大腦認定月亮在它們後面很遠的地方，因此也是影響月亮大小錯覺的重要因素。<\/p>"}, {"id": "f1759651894", "date": "2025-10-05", "title": "慢慢地海水退了......", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "慢慢地海水退了...... 海嘯來之前聽說會這樣...... 前一陣子與越南學生分享這張三十年前的照片，竟然有班上越南同學認出了家人。 以下有不少學校曾去招生過，也有學生畢業於此，", "len": 473, "body": "<p>慢慢地海水退了......<\/p>\n<p>海嘯來之前聽說會這樣......<\/p>\n<p>前一陣子與越南學生分享這張三十年前的照片，竟然有班上越南同學認出了家人。<\/p>\n<p>以下有不少學校曾去招生過，也有學生畢業於此，台灣少子化的影響非常巨大，雖然台灣要面對的問題不只這些，而且鄰近各國如日本韓國也差不了多少，所以看起來政府應該是已參考過其他國家的做法，決定在法律與法令規定的範圍內讓學校法人自尋生路。<\/p>\n<p>113學年全台灣高中停招：<\/p>\n<p>基隆市私立光隆家商<\/p>\n<p>新北市私立清傳高商<\/p>\n<p>新北市私立南強工商<\/p>\n<p>彰化縣私立大慶商工<\/p>\n<p>嘉義縣私立同濟高中<\/p>\n<p>嘉義市私立仁義高中<\/p>\n<p>台東縣私立育仁高中<\/p>\n<p>高雄市南海月光實驗學校<\/p>\n<p>112-114年已停招或停辦大專學院：<\/p>\n<p>新北市華夏科技大學<\/p>\n<p>新竹縣中華大學<\/p>\n<p>彰化縣中州科技大學<\/p>\n<p>彰化縣明道大學<\/p>\n<p>雲林縣環球科技大學<\/p>\n<p>嘉義市大同技術學院<\/p>\n<p>台南市台灣首府大學<\/p>\n<p>高雄市東方設計大學<\/p>\n<p>高雄市和春技術學院<\/p>\n<p>高雄市一貫道天皇學院(原高鳳技術學院)<\/p>\n<p>花蓮縣大漢技術學院<\/p>\n<p>114學年已確定停招高中：<\/p>\n<p>苗栗縣私立大成高中<\/p>\n<p>苗栗縣私立育民工家<\/p>\n<p>苗栗縣私立賢德高工<\/p>\n<p>台南市私立新榮高中<\/p>\n<p>早已停招高中：<\/p>\n<p>新北市私立開明工商<\/p>\n<p>嘉義縣私立協志工商<\/p>\n<p>台南市私立鳳和中學<\/p>"}, {"id": "f1756980616", "date": "2025-09-04", "title": "ESG永續相關證照與測驗值得去考嗎？", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "ESG永續相關證照與測驗值得去考嗎？ 不久前好奇去報考了由證基會主辦的永續發展基礎能力測驗，考試當天在台北科技大學，報考人數非常多，整棟大樓都是考生，大家人手一本書都在抱佛腳，當下", "len": 754, "body": "<p>ESG永續相關證照與測驗值得去考嗎？<\/p>\n<p>不久前好奇去報考了由證基會主辦的永續發展基礎能力測驗，考試當天在台北科技大學，報考人數非常多，整棟大樓都是考生，大家人手一本書都在抱佛腳，當下印證了「永續是門好生意」這句話，我很好奇到底是那些人在參加考試呢？<\/p>\n<p>這張證照要去研習上課嗎？考試內容難嗎？需要多少時間準備？費用分別是多少呢？以上的問題我先放著，我在IG上詢問千人追蹤的超齡考生beingbanker，結果他的回答與我的動機是相同的，就是為了銀行部門考核加分。<\/p>\n<p>先從疫情期間曾參加的一門ISO 14064-1溫室氣體－第1部：組織層級溫室氣體排放與移除之量化及報告規範說起，當時一起上課的全都是觀光餐旅背景教師，利用寒假參加研習，上三天課24小時線上課程及考試認證，什麼是ISO 14064-1「溫室氣體－第1部：組織層級溫室氣體排放與移除之量化及報告規範」故名思義，就是一套「企業如何進行碳盤查」的標準，對溫室氣體量化與報告提供規範，以組織作為基本要求架構，進行溫室氣體盤查的設計、發展、管理及報告原則與要求，才可以標準化每家企業的碳盤查資料與報告，協助盤查人員執行。<\/p>\n<p>當時我們的碳盤查考試作業就以國內的飯店業及旅行社為目標作為案例，將各項標準導入企業各面向內容，才完成研習與考試。三天的課程每天都讓我在深思學習技能與工作應用之間的關係，當然也讓我後來爭取計畫有所助益！<\/p>\n<p>但在私校招生與教學的重擔之中，為了考核加分仍是最主要目的，所以我在今年初去北車前的書店去買了本題庫用書：113年永續發展基礎能力測驗學習指南與題庫-證基會出版 495元，決定就用練習考古題的土方法，硬是在二週內將所有題目都做完，看不懂的就將答案背起來，撐到考試那天都在背答案，結果就是如圖所示低空飛過。<\/p>\n<p>所以這張2025的證照在今年的年度考核中可以加１分！<\/p>"}, {"id": "f1756568473", "date": "2025-08-30", "title": "用學生幫我拍的解說照片當例子，這幾天流行的雙子AI可以在…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "用學生幫我拍的解說照片當例子，這幾天流行的雙子AI可以在轉瞬間將所有你不想看到的物品消失。但想當然而，任何你想得到的人事物都可以作假加上去，或是消除，沒仔細看真的很接近。 所以近期", "len": 317, "body": "<p>用學生幫我拍的解說照片當例子，這幾天流行的雙子AI可以在轉瞬間將所有你不想看到的物品消失。但想當然而，任何你想得到的人事物都可以作假加上去，或是消除，沒仔細看真的很接近。<\/p>\n<p>所以近期我開始要求與費用有關的文件都改郵寄紙本給我，各家公司都很抗拒；最近更剪了不少張信用卡，除了剪之外還要打電話去取消會員，否則到期後又寄來一張全新的，甚至會幫你加碼直接多送你一張，說是優質會員；還有剛保好的機車強制險才剛繳完費，不到一個月又收到更貴的機車保險繳費單，打電話去問才知道是鼓勵車主增額保險，只是\"鼓勵\"不是強制的。<\/p>\n<p>所以，最近與同事朋友連繫，都會盡量約面對面討論或聊天，否則成天只是看照片結果到了現場根本認不得。<\/p>\n<p>拍攝者：謝冠晨 修改者：Gemini AI<\/p>"}, {"id": "f1756391840", "date": "2025-08-28", "title": "Amazing Thailand", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Amazing Thailand 曾讀過一段三島由紀夫描述曼谷王室的文字，「那是個在寺院燦爛發亮，花果遍野的國度裡，人們在慵懶的陽光下，專心一致崇拜佛、堅信輪迴，卻忌諱逃避井然有序", "len": 780, "body": "<p>Amazing Thailand<\/p>\n<p>曾讀過一段三島由紀夫描述曼谷王室的文字，「那是個在寺院燦爛發亮，花果遍野的國度裡，人們在慵懶的陽光下，專心一致崇拜佛、堅信輪迴，卻忌諱逃避井然有序的理論體系，擁有著黃金般沉重的懶散，以及樹下微風搖晃未動的精神。」- 三島由紀夫【曉寺】<\/p>\n<p>整理每日的行程與照片時，利用文字再次回味暹邏的空氣，憶起燦爛炙熱的陽光，昭披耶河晚風中如黃金般的鄭王廟(曉寺)與對不上頻率的人們，加上旅程中來自世界各國的旅客，是有點驚豔泰國的感覺。<\/p>\n<p>Day1 曼谷旅遊休息兼學習<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1G4z9v1puq/\">https://www.facebook.com/share/v/1G4z9v1puq/<\/a><\/p>\n<p>Day2 空盛桑運河髒船體驗<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1B1sad6Qix/\">https://www.facebook.com/share/v/1B1sad6Qix/<\/a><\/p>\n<p>Day3 Klook美功鐵道及水上市場湊團遊體驗<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1DKsauQxae/\">https://www.facebook.com/share/v/1DKsauQxae/<\/a><\/p>\n<p>Day4-1 曼谷中央車站及Hong Sieng Kong咖啡店<\/p>\n<p><a href=\"https://www.facebook.com/share/v/19ejjkxzTK/\">https://www.facebook.com/share/v/19ejjkxzTK/<\/a><\/p>\n<p>Day4-2 湄南河順流而行<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1B3WMuHz6v/\">https://www.facebook.com/share/v/1B3WMuHz6v/<\/a><\/p>\n<p>Day5 朱拉隆功大學校園及班塔通路夜市<\/p>\n<p><a href=\"https://www.facebook.com/share/p/19VQVRcRUC/\">https://www.facebook.com/share/p/19VQVRcRUC/<\/a><\/p>\n<p>Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢之旅<\/p>\n<p><a href=\"https://www.facebook.com/share/v/19qStX56hP/\">https://www.facebook.com/share/v/19qStX56hP/<\/a><\/p>\n<p>Day7 最終日之難忘的旅遊驚嚇<\/p>\n<p><a href=\"https://www.facebook.com/share/p/19BaQSXvj7/\">https://www.facebook.com/share/p/19BaQSXvj7/<\/a><\/p>\n<p>Day8 曼谷旅遊小小心得<\/p>\n<p><a href=\"https://www.facebook.com/share/v/1MgFBs5by8/\">https://www.facebook.com/share/v/1MgFBs5by8/<\/a><\/p>"}, {"id": "f1756299802", "date": "2025-08-27", "title": "一家之主的樣態", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.27 一家之主的樣態 今天聽聞黃明一主任的上週四校門前騎摩托車出車禍，結果他不上救護車也沒告訴家人，就是擔心父母親與妻小知道了之後會太在意，就這樣將所有的事自己承擔下", "len": 405, "body": "<p>2025.8.27<\/p>\n<p>一家之主的樣態<\/p>\n<p>今天聽聞黃明一主任的上週四校門前騎摩托車出車禍，結果他不上救護車也沒告訴家人，就是擔心父母親與妻小知道了之後會太在意，就這樣將所有的事自己承擔下來，突然間我真的很佩服且尊敬他，這要有多強大的心態呀！<\/p>\n<p>下班後在停車場碰到黃教務長，拉拉雜雜地說了一大堆，只有一件事令我非常驚訝，他竟然介紹曉華老師去萬能航空系，而且已經在進行應徵流程了，看起來他是說漏了嘴，才發現不應該讓我知道，我也在同時表達實在不宜，這樣對醒吾自己學校是很不利的。<\/p>\n<p>二件事都是發生在身邊的關係人，我覺得自己要擺正心態，一步步地將工作與計畫執行，從中好好地去擴展自己的人脈，期待未來能有更開擴的機會或是在醒吾有個正當又努力的工作空間，反而人生就來一回，這所學校已經提供了我們一家穩定又平靜的十年，再來十年的快樂與幸福就看自己處於環境與工作的心態，入世定心安穩努力讓自己與家人擁有有意義的人生，這真的才是一家之主的好樣態。<\/p>"}, {"id": "f1756214759", "date": "2025-08-26", "title": "曼谷旅遊 Day7 最終日之難忘的旅遊驚嚇", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.3 曼谷旅遊 Day7 最終日之難忘的旅遊驚嚇 旅程的最後一天就是主打一個在附近坐BTS散步的頻率，好好地在飯店早餐吃成早午餐，隨便去拿鄰近試洗的衣物，以便回家時可以", "len": 955, "body": "<p>2025.8.3<\/p>\n<p>曼谷旅遊 Day7 最終日之難忘的旅遊驚嚇<\/p>\n<p>旅程的最後一天就是主打一個在附近坐BTS散步的頻率，好好地在飯店早餐吃成早午餐，隨便去拿鄰近試洗的衣物，以便回家時可以減少收拾的時間，一整天就是閒散觀光的步調，回想著一週來的旅遊內容與準備將手邊的泰銖花光，準備回家。<\/p>\n<p>就在晚上九點整我放下家人花300泰銖安排按摩時，此次旅遊最大的驚嚇出現了，孩子準備上飯店健身房運動時才發現AirPods不在身邊，低頭看了手機才發現早有訊息通知耳機離開身邊，但卻當成巨量的訊息之一沒發現，算一算已經是六個小時之前的事，最後的訊號來自於BTS E4與E5之間，根本想不起來AirPods那兒了。<\/p>\n<p>還好，我們家最冷靜的人就在孩子身旁，媽媽提醒可能是中午吃飯時掉在漢堡店，在晚上九點半時，兩位家人快走加跑步地在百貨公司關店前一刻衝進櫃台，並嚴正地詢問耳機的下落，耳機不只是掉了，而且還被ShackShake員工改帳號侵佔；我覺得家人陪同且用英文很明確地描述失物，聽起來現場員工多也知情，員工們還回到內場去討論了一番才決定還回耳機，所以在百貨公司關門前，AirPods算是被我們要回來了，但在重新連線時才發現已被改為泰文內容，再加上個Sandy的名子。<\/p>\n<p>以上所有內容都是家人轉述，因為按摩完後輕鬆回到飯店的自己完全不知道那一小時中經歷了那麼多過程。經過此事，我們一致認知到無論一路上有多麼地小心，都仍會有意外發生，只要是旅行在外永遠都要有容錯及風險的觀念，要留點錢或是分擔物品在身邊，都是很重要的事，只能多做功德多付出多準備，讓平安永遠在一家人身旁。<\/p>\n<hr />\n<p>另外記錄一個我有參與到的驚嚇，就是今天晚餐後吃點心時，在有2千萬居民百萬觀光客的巨大曼谷城中，我與孔哥竟然可以在同攤冰品店前不期而遇；地點是曼谷最芭樂的Termail21美食廣場，有到過的人就知道，在廣場中可能連一起出遊的家人都會迷路失聯。而且其實我們已經在船麵餐廳吃飽，只是想另外點個冰來消暑，就碰到了也到泰國旅行訪問親人的同事孔哥及同行家人。<\/p>\n<p>人與人之間的緣份真的太奇特了，後來家人也在返程時提及，在曼谷可以遇見形形色色往來交流的各國旅客，本來就已經很具虛幻感了，還能在百萬遊客之中碰見同系辦公室中的同事，或許我們在上輩子時就已經在某個商道或旅程中碰頭，都是喜歡旅行熱愛自由的時空旅人。<\/p>"}, {"id": "f1756130533", "date": "2025-08-25", "title": "曼谷旅遊Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.2 曼谷旅遊Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢之旅 記得在疫情時列了幾個人生期待的旅遊目的地，今天的桂河大橋及死亡鐵道就是其一。車行到了寬廣的桂河旁時，", "len": 654, "body": "<p>2025.8.2<\/p>\n<p>曼谷旅遊Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢之旅<\/p>\n<p>記得在疫情時列了幾個人生期待的旅遊目的地，今天的桂河大橋及死亡鐵道就是其一。車行到了寬廣的桂河旁時，真的難以想像當年是要如何架橋呀？電影中的桂河大橋跨越的河距並沒有今天看到的那麼壯觀，電影與實際地點之間的差距我想在場的外國朋友應該也都有同感！<\/p>\n<p>其實剛到曼谷時接送我們到酒店的司機問起了我們想去那兒玩時，我們提到桂河，他就提到了從曼谷往來北碧府的高速公路已經建好，所以車程時程可以控在二小時以內，舒適度優於以往，否則一日遊往桂河大橋及死亡鐵路會是個蠻硬的旅程。<\/p>\n<p>這個行程是在台灣就訂好的走跳曼谷假日團，會有來自不同地方的旅伴一起坐九人座保姆車，而且今天一同的旅伴都是安靜的同行者，導遊也不會一直聊天，還幫我們一家拍了好多美照；加上同車二組年輕人一同出行都準時且沈默，且聽導覽時也都很認真且專注，真的覺得有優質的旅伴真的不錯，反而是我常常失神再多問問題，成了孩子口中的囉嗦大人。<\/p>\n<p>死亡鐵道旅行人文風味十足，在鄉野中的車站時蚊蟲量驚人，我們盡量在鐵道間四處走動，以免被不名蚊蠅攻擊，再加上火車很正常地誤點，直到又長又慢的火車駛入才好一點。<\/p>\n<p>我們在滿座的車廂上遇見了一團曼谷宣素那他皇家大學Suan Sunandha Rajabhat University的中文系學生與我們攀談，聊聊他們學習中文動機且做一點點的國民外交，加上他們推薦我們買車上的小販點心，並在下車後將最棒的觀景位子分享給我們一家，讓我們可以用最好的角度記錄我心中人生旅遊目的地，非常滿足。<\/p>"}, {"id": "f1756004888", "date": "2025-08-24", "title": "自己做事不也是如此？常會沒來由地擔心，最後反而不盡人意。", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.24 自己做事不也是如此？常會沒來由地擔心，最後反而不盡人意。 陳泰廷教授教我們如何由運動心理學來學習如何鼓勵並說服自己。 把焦點放在「過程」，而不是「結果」 (1)", "len": 372, "body": "<p>2025.8.24<\/p>\n<p>自己做事不也是如此？常會沒來由地擔心，最後反而不盡人意。<\/p>\n<p>陳泰廷教授教我們如何由運動心理學來學習如何鼓勵並說服自己。<\/p>\n<ol>\n<li>把焦點放在「過程」，而不是「結果」<\/li>\n<\/ol>\n<p>(1)專案計畫中你最想挑戰的是什麼？<\/p>\n<p>(2)你希望在計畫中控制好哪個細節？<\/p>\n<p>(3)你想嘗試什麼新的策略？<\/p>\n<ol start=\"2\">\n<li>重新定義「成功」的意義<\/li>\n<\/ol>\n<p>(1)這次專案簡報比上次更冷靜了！<\/p>\n<p>(2)這次自己嘗試了新的做法，很有創意。<\/p>\n<p>(3)這次專案管理與分工模式更為成熟！<\/p>\n<ol start=\"3\">\n<li>累積「可控的小成功」<\/li>\n<\/ol>\n<p>(1)每天針對專案計畫的分項進行一節課的撰寫，並且將心得發表。<\/p>\n<p>(2)每天完成工作之後去跑步3公里，累積體能且釋放壓力。<\/p>\n<p>(3)每完成一次小進度就鼓勵自己為自己好好吃個飯，告訴自己很厲害！<\/p>\n<p>最後，我要用老師寫的這句話鼓勵自己：「我不只是練習型選手，我也能在比賽裡放手一搏，享受當下，打出最好的自己！」為自己努力，為自己享受成就感。<\/p>"}, {"id": "f1756049393", "date": "2025-08-24", "title": "曼谷旅遊Day5 朱拉隆功大學校園及班塔通路夜市", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.1 曼谷旅遊Day5 朱拉隆功大學校園及班塔通路夜市 原來朱拉隆功大學就位在曼谷最市中心區，整個校園就位於BTS Siam站以南，臨近也是百貸公司及商圏所在地；而且泰", "len": 940, "body": "<p>2025.8.1<\/p>\n<p>曼谷旅遊Day5 朱拉隆功大學校園及班塔通路夜市<\/p>\n<p>原來朱拉隆功大學就位在曼谷最市中心區，整個校園就位於BTS Siam站以南，臨近也是百貸公司及商圏所在地；而且泰國的大學生是要穿制服上學的，不同的學校制服當然有些不同，只是我們看不出來那個學校的學生穿什麼衣服。<\/p>\n<p>旅程的中段，我們早就排定了要去參觀朱拉隆功大學，原本有些擔心會像去北京清華大學或昆明西南聯大一樣被鐵門管制在門外，而且找了不少資料都很少人提到曼谷市區的校園要如何參觀，結果是泰國排名第一的朱拉隆功大學，就像台灣大學一樣，校園各區都有入口可以進去，連嘟嘟車都可以開進去，完全沒有管制；想一想這才是大學存在的意義吧，如果大學門禁嚴格，那學校的世界排名再前面，所培育出來的人才是否有開放的胸襟，是否與對文明與真理的敬畏，在學問與知識之前的自省等等，都會因為門禁而讓人多一些問號？<\/p>\n<p>朱拉校園很大，有皇室建築的美麗校史館，各個學院也佈於各區，沿途我們漫步經過了設計學院、工程學院，也到教育學院及法學院看學生在準備夏令營的活動及學術研習，校園綠意盎然規劃完善，運動場上的學生踢著足球，整個氣氛就如年初參觀日本東京大學校園般，自由、開放、專業令人心生嚮往，後來再找資料時才發現台灣有不少學生留學此校，從泰國第一學府畢業後工作的發展也是潛力無限；記得在2012年辦理Asia Tourim Forum時，來訪的朱拉大學建築學院的教授來花蓮發表的研究內容就是泰國世界遺產的觀光內容，泰國是觀光大國，歷史與文化的豐厚研究資源真的好生羨慕。<\/p>\n<p>出了校園步行就會到觀光客很愛去的Banthat Thong Rd.朱拉隆功大學美食一條街，這條美食店家群聚超過一公里的班塔通路，約從下午四五點開始就可以感受到熱鬧的氣氛，更是觀光客及當地人的美食中心，沿路有不少米其林或網紅名店，大家可以邊逛街邊考量要去吃什麼，而且店家多以店面為主，用餐環境比起曼谷其他夜市或街邊攤位好上許多。<\/p>\n<p>在八月的第一天，我們在曼谷市區就走了18公里及25376步，因為曼谷天熱，所以我們邊行邊食也享受了不少意外尋得的餐廳，還有初嘗的MyBeer啤酒也是美味加分，我們晚餐的燒烤火鍋只能付泰銖，但費用更是透明合理，廁所及用餐環境都具水準，美食街的夜景與風情更是浪漫又愉快，非常推薦。<\/p>"}, {"id": "f1755403696", "date": "2025-08-17", "title": "12生肖與12時辰", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.17 12生肖與12時辰 每天都有12時辰，但有生產力的時辰可能不到4個時辰也就是8小時，一直以來的價值觀就是要好好地生活，不是追求生產力。但多年過去慢慢體會到在華人", "len": 754, "body": "<p>2025.8.17<\/p>\n<p>12生肖與12時辰<\/p>\n<p>每天都有12時辰，但有生產力的時辰可能不到4個時辰也就是8小時，一直以來的價值觀就是要好好地生活，不是追求生產力。但多年過去慢慢體會到在華人的社會之中因為人與人的接觸太多太頻繁，如果沒有利用時間與習慣積累能力，只是靠著慾望與直覺在過日子，那後來就會停滯不前。<\/p>\n<p>嚴長壽先生【你就是改變的起點】一書中寫道：你希望簡單的日子安穩過下去就好了，但當你選擇停在原處，其他人卻拼命向前，你的競爭力就相對下降了。即使你安於「平淡」與「平凡」，在變化如此迅速的時代，不奮力，將難以抵抗所有將你往下拉的力量。這不是願不願意或有沒有企圖心的問題，而是，你得很努力、很有夢想，才可能在全球化競爭中，找到立足之地，如果一開始就選擇平穩，選擇留在溫室，未來的選擇也許就不是你能選擇的了。<\/p>\n<p>你感受到那個將你往下拉的力量了嗎？<\/p>\n<p>還是你發現了你現在的選擇不是你能選擇的了嗎？<\/p>\n<p>從國中開始，我就感受到了那個無盡的往下拉的力量，學不會！跟不上！被處罰的恐懼！被落後的不安感！時時刻刻永無寧日，怎麼辦呢？當你的生存資源不足時，你只有努力面對而且不放棄夢想，否則當年歲逼近時，你的選擇就不是你能選擇的了。<\/p>\n<p>民114(2025)年是蛇年，下個生肖蛇年是民126(2037)年，就是我必須從現職的工作離退的那一年，如果不幸現職私校撐不下去，那我更有可能要提前面對離退的那一天，年復一年日復一日，每天的12時辰從這個角度來看就非常可貴，從一早七點醒來的辰(龍)時，到下班回家已疲累的酉(雞)時，自己能掌握的時間不多，多數都是被生理現象左右，會倦會累會煩會不安，會懶會忘會饞會躺平。<\/p>\n<p>所以將生活的頻道調回給自己，重新記錄每日的運動與跑步，用點讚與點點愛心來連接關係，寫下在教學與社區投入中的努力點滴，才是未來這十二年每日的生活重心。<\/p>"}, {"id": "f1754820004", "date": "2025-08-10", "title": "曼谷旅遊 Day4-2 湄南河順流而行", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.31 曼谷旅遊 Day4-2 湄南河順流而行 昭披耶河(湄南河)全長1352公里，流域面積為150,000平方公里，約占泰國國土面積的三分之一。在曼谷很多具代表性的觀", "len": 659, "body": "<p>2025.7.31<\/p>\n<p>曼谷旅遊 Day4-2 湄南河順流而行<\/p>\n<p>昭披耶河(湄南河)全長1352公里，流域面積為150,000平方公里，約占泰國國土面積的三分之一。在曼谷很多具代表性的觀光景點都是臨河而立，在多年前與學生一同來曼谷畢旅時昭披耶河的水是藍色的，但這次我們看到的是混濁的土黃色，水量也因為雨季高漲許多。<\/p>\n<p>再來的行程就是坐便宜昭披耶河交通船至河濱夜市，晚上安排看Ladyboy人妖秀，但後來才發現海洋學院Marine Dept這站的船只能到Asiatique前一站，問了Wat Rat Singkhon碼頭上的阿姨她說就在一旁走一下就到了，而且碼頭只開到18點馬上就要關了，再來不會有船，我們三人就悠悠地向著摩天輪的方向前進，碼頭旁的小學生正在下課中，我們隨他們一起去買便宜的冰淇淋及檸檬茶，順便坐下來吹冷氣。<\/p>\n<p>上回與學生畢旅參團旅行社時看得是金東尼人妖秀，不太推。這次家人提到都來泰國沒看好像少了什麼，我們就由Klook中訂了CALYPSO 人妖秀及傳統泰舞的晚餐，晚餐人不多菜色也普通，但有泰國傳統舞蹈伴食也很有趣，吃完後還可以拍照，再轉至舞台區去看秀，CALYPSO 人妖秀內容很精彩，燈光音響及舞台效果都很棒，小錄了一段供參，現場看真的推薦。<\/p>\n<p>夜間的河濱市場氣氛很棒，有不少可以喝酒聽歌的餐廳，比較建議可以只看秀或泰拳之後轉至河邊餐廳用餐聊天，昭披耶河的夜景比起白天加分太多，涼風徐徐樂音裊裊，很多人會在這兒搭各色郵輪遊河，看起來也很不錯，有機會可以嘗試；後來學生告訴我夜間郵輪有分不同等級，更有成人版本就請自行上網找，我不懂喔！<\/p>"}, {"id": "f1754729631", "date": "2025-08-09", "title": "曼谷旅遊 Day4-1 曼谷中央車站及Hong Sien…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.31 曼谷旅遊 Day4-1 曼谷中央車站及Hong Sieng Kong咖啡店 旅程中安排冷門行程是我個人的喜好，一早改搭MRT地鐵到華藍篷站，一個差點被當局拆掉的", "len": 902, "body": "<p>2025.7.31<\/p>\n<p>曼谷旅遊 Day4-1 曼谷中央車站及Hong Sieng Kong咖啡店<\/p>\n<p>旅程中安排冷門行程是我個人的喜好，一早改搭MRT地鐵到華藍篷站，一個差點被當局拆掉的曼谷中央車站。之後再用步行探訪位於中國城區附近的文青咖啡店及文創街區，當成是半日的文史之旅。<\/p>\n<p>曼谷中央車站是泰國鐵道的起點，由朱拉隆功拉瑪五世皇帝親自監督進度，是泰國鐵道的濫觴；東方快車Eastern and Oriental Express在疫情前也以此站為起點設計往寮國或往馬來西亞新加坡的奢華旅程，完工於1916年的車站建築是由兩位義大利建築師設計的，仿照法蘭克福中央火車站，是終端型的車站，有7個月台和14條軌道，現在雖然已經半廢站而少有班車，仍由側門走入大廳仍可以感受到過往的繁華。主樓月台區域連接著巨大鋼構拱形屋頂，仍開著幾個票口售票，但入場沒有檢票口，可以自由進出月台，上廁所要付2泰銖給門口的管理員。出入口旁有個小小的博物館兼販售鐵道記念品的小店，有興趣的人可以逛逛，錯過也無妨。<\/p>\n<p>離開華藍蓬車站之後，我們散步去找一個知名的文青咖啡廳，在中國城附近走動景物很像台北中山區赤峰街區，有傳統的機械及器材店面，也有完全廢棄的19世紀建築，當然也有被有心人名改建後成為文創小店，整個街區走走看看，我們覺得台北中山區一帶的文創及設計更勝一籌，更可能完全比不上大稻埕區深刻，不過，如果你們和我們一樣發現曼谷物價高漲到比台北更貴，除了按摩沒什麼便宜的東西可以買時，飛到三千里之外，來泰國體驗一下同為福建潮汕移民的環境中，在經歷數百年後仍有如此相似之感。<\/p>\n<p>Hong Sieng Kong 咖啡廳一定要步行才能找得到，沿路也沒看到什麼都都車進來小巷之中，所以地點就放在留言之中；聽說原是一座經營木炭生意的百年老宅，會先看到清水祖師廟才會發現一旁有家藍色的小店，但，他只是門小但入門後非常不同，而且會有人擋在櫃台不讓你進去看，一定要你點完餐付完錢才能進去。我們一家人各點一份餐點後，在唯一有冷氣的小屋中找到了個位子用餐，其他的美景就請大家看照片了，餐點不差及整體氛圍及環境經營都屬一流，連廁所都有冷氣，推薦給大家有去曼谷可以去探訪。<\/p>\n<p>午餐後行程另外再寫，再續～<\/p>"}, {"id": "f1754566844", "date": "2025-08-07", "title": "曼谷旅遊Day3 Klook美功鐵道及水上市場湊團遊體驗", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.30 曼谷旅遊Day3 Klook美功鐵道及水上市場湊團遊體驗 自助行參加當地旅行社辦的一日遊，費用合理水準夠，遊覽車上各國人士都有，導遊阿木先用英文再用中文解說，行", "len": 480, "body": "<p>2025.7.30<\/p>\n<p>曼谷旅遊Day3 Klook美功鐵道及水上市場湊團遊體驗<\/p>\n<p>自助行參加當地旅行社辦的一日遊，費用合理水準夠，遊覽車上各國人士都有，導遊阿木先用英文再用中文解說，行程簡單且豐富，時間掌握都是經驗與技巧，這樣的行程換成自助行也很難達成，唯一難以適應之處就是要早起趕集合，這是出門旅遊最困擾的事之一。<\/p>\n<p>行程從美功鐵道火車市場開始，從曼谷Central One的集合點出發，因為擔心暈車所以在旅程選擇上仍喜歡大型遊覽車，坐起來沒有壓迫感，導遊也沒在車上長言或推銷，非常舒適快意。美功車站及市場火車景觀曾帶學生畢業旅行時來過，十幾年前的市場比起現在樸實許多，主要都是當地的生鮮魚貨及蔬菜水果；但今日很多都改為賣千篇一律的紀念品及休憩咖啡館，行程安排就是可以看火車進場與返回各一次，火車一走我們就上車離開。<\/p>\n<p>第二段搭上半小時車程就會到達丹嫩沙多水上市場的搭船處，一台有驚人馬達的長尾船可以坐6位，過程很剌激看影片比較能身歷其境地感受，個人覺得也是失去了過往手搖船的悠悠盪盪，而且機動長尾船吵雜了些，但卻又剌激有趣的一段航程，一樣很推薦，但年長者或不便者就建議別參加。<\/p>"}, {"id": "f1754237535", "date": "2025-08-04", "title": "曼谷旅遊 Day7 最後一刻我沒參與到的驚嚇", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.3 曼谷旅遊 Day7 最後一刻我沒參與到的驚嚇 最後一天就是主打一個在附近坐BTS散步的頻率，而且在吃晚餐時都是開心如常，回想著一週來的旅遊內容與準備將走邊的泰銖用", "len": 693, "body": "<p>2025.8.3<\/p>\n<p>曼谷旅遊 Day7 最後一刻我沒參與到的驚嚇<\/p>\n<p>最後一天就是主打一個在附近坐BTS散步的頻率，而且在吃晚餐時都是開心如常，回想著一週來的旅遊內容與準備將走邊的泰銖用光，準備回家。<\/p>\n<p>就在我放下家人花三百元去泰式按摩時，家人與孩子卻因為AirPods不見而造就了本次旅遊的最高潮，耳機不只是掉了而且還被ShackShake員工改帳號侵佔，因為家人與孩子快走加跑步地在百貨公司關店前一刻進到櫃台，並嚴正地詢問耳機的下落；我覺得是家人有陪同，聽起來員工也決定還回，所以後來AirPods算是取回了，但在重新連線時才發現已被改為泰文內容，再加上個Sandy的名子。<\/p>\n<p>孩子也才認知到無論一路上有多麼地小心都仍會有意外發生，只要是旅行在外永遠都要有容錯及風險的觀念，要留點錢或是分擔物品在身邊，都是很重要的事，這也是這幾年想太多，就越來越不太想出門旅行的主因，總覺得自己已沒有太多承擔的能力與心力。<\/p>\n<p>明天就要回家了，體驗到無論在那風險總是都在身旁，只能多做功德多付出，讓平安永遠在一家人身旁。<\/p>\n<hr />\n<p>另外記錄一個我有參與到的驚嚇，我與家人竟然會在巨大的曼谷城中與孔哥不期而遇；地點是很芭樂的Termail21美食廣場，有到過的人就知道，在廣場中可能連一起出遊的家人都會迷路失聯。而且其實我們已經在船麵餐廳吃飽，只是想另外點個冰來消暑，就碰到了也到泰國旅行訪問親人的孔哥及他的表妹。<\/p>\n<p>人與人之間的緣份真的太奇特了，後來家人也在返程時提及，在這樣形形色色的各國人種之中，本來就已經很具虛幻感了，還能在百萬遊客之中碰見同辦公室中只有五人的同事，也許我們在上輩子時就已經在旅程中碰頭，都是喜歡旅行熱愛自由的時空旅人。<\/p>"}, {"id": "f1754319759", "date": "2025-08-04", "title": "曼谷旅遊Day8", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.4 曼谷旅遊Day8 曼谷的人行道並不好走，高高低低的，城市中大樓與低矮樓房交錯，路上沒冷氣的公車、摩托車仍是居民依賴的重心。BTS捷運的費用比台北貴上不少，免子卡加", "len": 914, "body": "<p>2025.8.4<\/p>\n<p>曼谷旅遊Day8<\/p>\n<p>曼谷的人行道並不好走，高高低低的，城市中大樓與低矮樓房交錯，路上沒冷氣的公車、摩托車仍是居民依賴的重心。BTS捷運的費用比台北貴上不少，免子卡加值幾百元一下子就見底，計程車及都都車都要喊價，對於交通這件事並不想花心思的我們，捷運沿線的百貨與景點仍是首選。<\/p>\n<p>曼谷天熱是常態，其實天熱不可怕，可怕的是百貨公司內冷氣要加薄外套，一走到高架的Skywalk時卻是熱氣蒸騰，裡外交換之間要注意身體的不適應，所以喜愛冬天的自己從沒將熱帶曼谷列為喜愛城市，就像新加坡，除非必要很少去旅行。<\/p>\n<p>素坤逸路上的巷內有著只吹電風扇的米其林小食店，食物與人的氣味混雜，我們看了看之後還是轉進各家百貨中的美食街，雖不如攤販庶民美食便宜美味，但總是不希望動用行李箱中的腸胃藥，所以有什麼推薦的嗎？原則上我們攤子只敢吃現烤現炸的，而且都是外帶不敢坐下來吃。<\/p>\n<p>但整體而言是很羨慕這個全球知名的旅遊都市，文化底蘊豐富，宗教皇室及歷史城蹟四處林立，而且在全球旅客市場中已經做出口碑，是很多外國人士的旅遊首選城市，統計資料顯示2024年泰國的國際遊客達3,532萬人次，創造了1.66兆泰銖的觀光外匯收入。<\/p>\n<p>2024年來臺旅客統計只有787萬人次，交通部觀光署統計國際收入估算約有新臺幣3,220億元外匯收入，論觀光經濟規模台灣只是泰國的1/5，實際在曼谷遊覽之後，並不覺得曼谷比台北好玩，論文化歷史的底蘊更是多上許多，就看我們自己是否在意，整體而言台北的博物館、劇場、美食等在品質與價格上都更具競爭力；氣候、交通及城市便捷等基礎建設更是進步曼谷數十年以上，觀光沒有吸引力也許有其他我看不到的原因。<\/p>\n<p>我們一家就住在曼谷市中心ASOK的四星級彌泰雅18巷酒店七晚含餐不到二萬，房間乾淨整潔，空間夠大而且有簡單廚房，有很方便的備食及運用空間，且服務人員英文流利、用心且熱情。住宿地點在BTS淺綠線Asok(E4)站走路5分鐘可到，很合適家庭旅遊，HOTEL費用我就貼在留言處可參考。每日早餐與各國國籍旅客用餐，沒什麼爭食行為，早餐菜色雖然不多，但每天都有一些變化，不會天天相同；鄰近地區觀光客多治安良好也是每日旅遊返回酒店就可以安心休息的最重要因素。<\/p>"}, {"id": "f1754150242", "date": "2025-08-02", "title": "曼谷旅遊Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.8.2 曼谷旅遊Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢之旅 記得在疫情時列了幾個人生期待的旅遊目的地，今天的桂河大橋及死亡鐵道就是其一，車行到了寬廣的桂河旁時，", "len": 654, "body": "<p>2025.8.2<\/p>\n<p>曼谷旅遊Day6 北碧府死亡鐵道、動物園及桂河大橋的圓夢之旅<\/p>\n<p>記得在疫情時列了幾個人生期待的旅遊目的地，今天的桂河大橋及死亡鐵道就是其一，車行到了寬廣的桂河旁時，真的難以想像當年是要如何架橋呀？電影中的桂河大橋跨越的河距並沒有今天看到的那麼壯觀，電影與實際地點之間的差距我想在場的外國朋友應該也都有同感！<\/p>\n<p>其實剛到曼谷時接送我們到酒店的司機問起了我們想去那兒玩時，我們提到桂河，他就提到了從曼谷往來北碧府的高速公路已經建好，所以車程時程可以控在二小時以內，舒適度優於以往，否則一日遊往桂河大橋及死亡鐵路會是個蠻硬的旅程。<\/p>\n<p>這個行程是在台灣就訂好的走跳曼谷假日團，會有來自不同地方的旅伴一起坐九人座保姆車，而且今天一同的旅伴都是安靜的同行者，導遊也不會一直聊天，還幫我們一家拍了好多美照；加上同車二組年輕人一同出行都準時且沈默，且聽導覽時也都很認真且專注，真的覺得有優質的旅伴真的不錯，反而是我常常失神再多問問題，成了孩子口中的囉嗦大人。<\/p>\n<p>死亡鐵道旅行人文風味十足，在鄉野中的車站時蚊蟲量驚人，我們盡量在鐵道間四處走動，以免被不名蚊蠅攻擊，再加上火車很正常地誤點，直到又長又慢的火車駛入才好一點。<\/p>\n<p>我們在滿座的車廂上遇見了一團曼谷宣素那他皇家大學Suan Sunandha Rajabhat University的中文系學生與我們攀談，聊聊他們學習中文動機且做一點點的國民外交，加上他們推薦我們買車上的小販點心，並在下車後將最棒的觀景位子分享給我們一家，讓我們可以用最好的角度記錄我心中人生旅遊目的地，非常滿足。<\/p>"}, {"id": "f1753983024", "date": "2025-08-01", "title": "曼谷旅遊Day4 湄南河順流而行", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.31 曼谷旅遊Day4 湄南河順流而行 昭披耶河(湄南河)全長1352公里，流域面積為150,000平方公里，約占泰國國土面積的三分之一。在曼谷很多具代表性的觀光景點", "len": 700, "body": "<p>2025.7.31<\/p>\n<p>曼谷旅遊Day4 湄南河順流而行<\/p>\n<p>昭披耶河(湄南河)全長1352公里，流域面積為150,000平方公里，約占泰國國土面積的三分之一。在曼谷很多具代表性的觀光景點都是臨河而立，在多年前與學生一同來曼谷時昭披耶河的水是藍色的，但這次我們看到的是混濁的土黃色，水量也因為雨季高漲許多。<\/p>\n<p>113學年度從今天結束，轉眼間再幾年就要當滿20年的老師，2006年第一次因公出差泰國，花蓮餐旅系畢業班的曼谷之旅都是回憶。<\/p>\n<p>而這次家庭自助旅行兩位家人都是第一次來泰國，他們的反應都是泰國物價與台北接近，食物選擇也沒想象中的地多，尤其是有不能吃辣的家人時會趨近於沒有選擇。<\/p>\n<p>一整天到處走走下來，有幾個結論：<\/p>\n<p>一、合理價格的服飾不值得買與逛，理由是流行感與台北不同步，難以找到合穿的服飾。<\/p>\n<p>二、交通捷運與重要景點間串連性仍不足，而且行走交通友善度和新北桃園接近，沒有悠閒感。<\/p>\n<p>三、泰國服務業比重太高，沒讓人感受到努力與積極；換個方式來說數位遊牧或需競爭力的學習性不足，只能說羨慕泰國人，但我們不是他們，很難體會。<\/p>\n<p>四、餐廳選擇多樣式不足，多是在地餐廳或小吃難以保證衛生安全；而且水不好喝，只能一直喝瓶裝水。<\/p>\n<p>五、飯店金額是比台灣低，服務彈性也高，從業人員足夠支撐服務品值，但點與點的交通旅行仍未具水平。<\/p>\n<p>六、臨近曼谷的觀光景點沒有巨大亮點，歷史古蹟的費用與商業性重，門票費用已達放棄點，再加上全年的氣溫都是熱帶氣候，呈現出一種白天出不了門，溼熱不想出門的感覺。<\/p>\n<p>整體而言，要再訪曼谷不容易，來訪三次泰國仍讓我找不到想旅遊的動機，尤其是年長者更不建議，倒是年輕人與初訪者可以將這個國際化很深的城市視為試金石，增加自己的旅遊經驗值。<\/p>"}, {"id": "f1753721012", "date": "2025-07-29", "title": "曼谷旅遊Day1", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.28 曼谷旅遊Day1 在學期的交界旅行似乎是常態，找尋一點點休息感。 選擇泰國曼谷旅遊是因為家人都沒有去過，加上台灣媒體的地震、犯罪等新聞讓曼谷機票變得很便宜，搭星", "len": 767, "body": "<p>2025.7.28<\/p>\n<p>曼谷旅遊Day1<\/p>\n<p>在學期的交界旅行似乎是常態，找尋一點點休息感。<\/p>\n<p>選擇泰國曼谷旅遊是因為家人都沒有去過，加上台灣媒體的地震、犯罪等新聞讓曼谷機票變得很便宜，搭星宇航空來回價每人也只要八千元左右，還有合理的住宿費用，我們決定到世界國際旅客人數排名第一的天使之城看看。七晚的旅店決定住在Asok及素坤逸交叉口的Maitria Hotel， Maitria是梵語，酒店網站寫代表慈愛、友誼的意思，在Booking.com上的訂房加送機場接機，出航廈之後多數的接機公司會將你的名字列在A4紙，到點後就告知再等個5-10分鐘就會有司機及車號提供，不用去轉乘機場捷運，對於不用再推三件行李，隨車直達Maitria Hotel大門口，一路上包含接機的司機及櫃台都是非常和善的介紹他們的家鄉曼谷給我們一家認識，而且今天正巧是泰皇的生日，所以也是國定假日，又在雨季中是個沒下雨的日子，非常舒適快意。<\/p>\n<p>我們順利地在機場B1及2F換了泰銖及BTS免子卡，明天要去看看曼谷這個巨大的觀光城市；晚餐我們就散步至鄰近的Terminal 21 Kub kao Kub pla Thai Cursine (下飯配菜在地的意思) 餐廳用餐，當下忘了要求要減辣或不辣，就被泰國的一般辣給嚇到了，這家菜很好吃四道菜千銖剛好，推薦給敢吃辣的人，後來我們就到Terminal 21的美食街加點，銅板美食一樣美味。<\/p>\n<p>席間家人問起泰國經濟以什麼為主，查了資料了解泰國以服務業為大宗，觀光、金融及運輸等服務業佔了近六成的GDP，其次佔了三成以上是的是汽車、零組件等工業輸出，我以為重要的農業出口不到一成。但這是經濟表象，沒做出口生意的泰國民眾可能更在意的是每日的溫飽，文明古國的韌性來自於千年的文化累積與自尊，我是很羨慕泰國人對自己出生的民族與國家認同，這幾天有機會再城市中多走走了解，休息兼學習。<\/p>"}, {"id": "f1753801342", "date": "2025-07-29", "title": "曼谷旅遊Day2 空盛桑運河髒船體驗", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.29 曼谷旅遊Day2 空盛桑運河髒船體驗 不習慣旅行的節奏一夜睡睡醒醒，一早就決定出門去跑步流汗換精神，但吃完早午餐之後頭疼再度襲來，但排好的行程就出門去走走，我們", "len": 863, "body": "<p>2025.7.29<\/p>\n<p>曼谷旅遊Day2 空盛桑運河髒船體驗<\/p>\n<p>不習慣旅行的節奏一夜睡睡醒醒，一早就決定出門去跑步流汗換精神，但吃完早午餐之後頭疼再度襲來，但排好的行程就出門去走走，我們先坐BTS去Siam站步行估計明日的集合時間才發現曼谷的捷運運費非常貴，才5站就要價32泰銖，返程提前步行去席隆站是28泰銖，而且非常擁擠，泰國捷運CP值不高。<\/p>\n<p>中午依網路旅遊推薦吃紅大哥海南雞飯(3屆米其林)，曼谷的米其林評審可能是不知道什麼是好吃的雞肉，反正就是過譽了，嘗過就好沒什麼值得一提的味道。<\/p>\n<p>飯後我們鼓起勇氣去坐髒船(Khlong Saen Saep Express Boat空盛桑運河)，記得有意搭乘髒船上下船一定要小心，更不建議有小孩老人的家族旅行安排。運河中的水真的又髒又臭，很在意衛生又希望旅遊具水準的不建議嘗試，但當船在運河中快速航行，一路通達老城區時真的有種時光感，家人覺得很有曼谷風情，而且單趟費用14泰銖便宜實惠，不用買一日券，就大方等船看好要去的站名，上船後就會有人來詢問並向你收費，我們從Pratunam Pier水門市場搭乘向西老城區的航線，坐到最後一站Panfa Leelard，就可以走上平地接續行程。<\/p>\n<p>下午來了一場雨季中應有的大雨，正好下在老城區Boriphat舊街中，一旁就是供有佛陀舍利的金山寺，意者就購票參拜；大雨中我們沿著19世紀的排屋街廊散步，喜歡木刻的可以花個時間找家小店殺價買紀念，雨中無處可去決定就在運河旁的JEDI Café 喝咖啡，大學生說要點喝卡布其諾，是因為AI Cappuccino assassino，我們不理解內容，還覺得他在亂說，結果後來坐在一旁穿超人披風的外國小朋友看到我們在聊卡布奇諾刺客，還特地來向我們表示他也很喜歡Cappuccino Assassino，他鄉遇網路同好，後來我們還一起在運河旁看巨大的蜥蜴游泳及散步，很開心又驚喜，溼氣中的野性與童心讓人覺得非常有趣。<\/p>\n<p>傍晚返程再花14泰銖搭髒船返回到Pratunam Pier的橋旁泰式按摩，家人去BigC銷磨時間，我適時休息回血，也是旅行樂事之一。<\/p>"}, {"id": "f1753414804", "date": "2025-07-25", "title": "因為南方寂寞鐵道的觀影感動及聽了多次蕭導演的Podcas…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "造山者 因為南方寂寞鐵道的觀影感動及聽了多次蕭導演的Podcast訪問，我對記錄片總有一種喜愛，因為其中總是有真實的部分，即便是片面的說法也是一種看法。 我們在西門町的今日影城購票", "len": 1159, "body": "<p>造山者<\/p>\n<p>因為南方寂寞鐵道的觀影感動及聽了多次蕭導演的Podcast訪問，我對記錄片總有一種喜愛，因為其中總是有真實的部分，即便是片面的說法也是一種看法。<\/p>\n<p>我們在西門町的今日影城購票入場觀影，其實兩個月前有校園免費首映，但放映的時間正是一家人最忙的時刻，決定再用新台幣來支持好的台灣電影製片內容，以下是我們三人的最主觀的觀影心得。<\/p>\n<p>我：<\/p>\n<p>首先，雖然有人說都是找老人來說法，但我覺得如果現在不留下影像與文字那之後就隨媒體或文字去解說，很不客觀，所以這部分我是非常認同與支持的。更佩服此影片中部分重要的關鍵人物並未有現身記錄，我想導演一定邀訪了多次，但每個人都有自己的堅持，這也是種說法不也是。<\/p>\n<p>其次，用半導體產業的關鍵地位來說明現今台灣的處境，這是一種角度也是被多數人接受的；但我不接受這種倖免者或是成功者的單一論述，台灣此時的難處與地位的確令住在島嶼上的我們感到無奈，但各行各業的努力者都有，至少我覺得台灣觀光官方多年來在世界各地的努力曝光也是一種軟性的外交，讓外人對我們有認知，讓旅外者對台灣多點認同，對這個島嶼的存續都是很重要的。<\/p>\n<p>大學生：<\/p>\n<p>他覺得當年去RCA學習半導體設計、製程及管理的前輩超猛，尤其是在短短的期間就想盡辦法東抄西寫地將所有的資料學習(COPY)回來，而且那個年代並沒有手機，只有紙可以記錄，那種放下個人面子與尊嚴只為達成國家期待目的手法令他敬佩。<\/p>\n<p>他說現在學的IC設計都是用軟體在寫，而是現在大一只學到了1980年代的課程都已經忙到快瘋了，他覺得用刻的IC電路投影真的強，RCA團隊的前輩都是神。同時他這次才知道原來他們學校的系館會有各家知名廠商的掛名是有原因的，產業與學術知識在新竹這個區域是完全結合的，沒有學用落差。<\/p>\n<p>大學生的媽：<\/p>\n<p>起心動念想看電影的主導者在此，要不是她的堅持，我覺得等MOD出來再看個幾次都可以；媽媽有一定的觀影心得，我無法代她表達，僅在此記錄她提到的幾個心得：<\/p>\n<p>一、學習是要有典範與領導的，台灣半導體萌芽是從RCA廠開始，但重要的是有典範的領導者在帶領著，有具智慧與能力的前贍者才能將人才聚集、將目標落實，進而決定方向與步驟讓學習成為成果。<\/p>\n<p>二、做任何事都是要堅持與持續的，這群聰明有智慧的工程師前輩，當年也多是聯考的頂尖人物，都有一種對專業的堅持與恆毅，才有成功的機會。<\/p>\n<p>三、提出來討論也是一種重要的心得與分享，一家人對影片的看法都有所不同，如果個別用電視、手機或螢幕分別看完，那就只是個別的心得，並無法成為家人的回憶…<\/p>\n<p>的確，我們一家在看完造山者之後去吃了美觀園，而且最近都是請大學生開車，今天特地導航載我們開進具中階難度的峨嵋停車場，他覺得這個在西門町的停車場很有趣，雖然之前高中時常常來這附近吃東西逛街，但以上二者都是爸媽大學時做過的事，這次請大學生一同體驗，創造出不同於以往的記憶，也很好。<\/p>"}, {"id": "f1753368817", "date": "2025-07-24", "title": "第三週的課程終於進入水彩的調色與運用，這盒12色水彩是2…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.24 第三週的課程終於進入水彩的調色與運用，這盒12色水彩是2016年一家人去德國旅行時的紀念品，我很堅持期待可以將自己的旅遊速寫可以用上這盒只需要加水就可以上色的水", "len": 348, "body": "<p>2025.7.24<\/p>\n<p>第三週的課程終於進入水彩的調色與運用，這盒12色水彩是2016年一家人去德國旅行時的紀念品，我很堅持期待可以將自己的旅遊速寫可以用上這盒只需要加水就可以上色的水彩，一開始真的連天空的藍色都調不出來，總覺得是左下角的藍色是合適的，等到加了水試了色之後就是不對頻。<\/p>\n<p>水彩重要的部分就是色彩與水量的控制，如果色調不準就會跑了風味，水量不足就沒有飽和及協調，最後就很難將動態的雲呈現在天空之中，更不用座落於重心的富士山。<\/p>\n<p>後來對了原文之後才知這是CyanBlue，不是Blue，青藍色與天藍色不同的，青色帶著綠的基底，可以用在湖水或景色之中，但不合適於這張富士山的藍天，後來才在十二色中看到了右上的深藍色在加水之後就呈現出天藍色，這個嘗試至少花了30分鐘，但，在顏色中流動與考量非常地療癒。<\/p>"}, {"id": "f1753279844", "date": "2025-07-23", "title": "新北旅遊服務中心暑期OJT課程@醒吾旅運", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "新北旅遊服務中心暑期OJT課程@醒吾旅運 短短二小時不在行的課讓我備了十幾個小時的課，但也強迫自己看了不少有趣的期刊，也盡量在其中找出樂趣，再將有趣的學術發現分解為課程案例，在課程", "len": 552, "body": "<p>新北旅遊服務中心暑期OJT課程@醒吾旅運<\/p>\n<p>短短二小時不在行的課讓我備了十幾個小時的課，但也強迫自己看了不少有趣的期刊，也盡量在其中找出樂趣，再將有趣的學術發現分解為課程案例，在課程中分享好像大家都算有回應，也是個有趣的教學經驗。<\/p>\n<p>先分享二張課程簡報，這是一篇發表在歐洲工作與組織心理學的文章，由三位德國學者合作研究有關工作後運動影響情緒的論文，也與自己長年來的運動習慣相符合，可以提供工作忙碌者一個運動解方與說法。<\/p>\n<p>研究中蒐集了126名參與者，在五個連續工作日內，有一半的日子進行工作後的運動，平均每天運動37.28分鐘，每天分兩次完成運動日記。運動內容較為彈性，可以是耐力訓練、力量訓練、團體運動及其他休閒運動，並未強制性要做什麼運動，但時間要足夠有運動效果。<\/p>\n<p>研究結果是：<\/p>\n<ol>\n<li>\n<p>下班後的運動活動與傍晚的積極情緒 (正面感受) 呈現顯著的正向關聯。表示人們運動後的晚上會感到更多的正面情緒。<\/p>\n<\/li>\n<li>\n<p>運動活動與消極情緒 (負面感受) 則沒有顯著關聯；可能是因為參與者下班後的消極情緒本身就已經很低，或負面情緒會獨立不受運動活動而有所變化。<\/p>\n<\/li>\n<li>\n<p>對自身滿意度提高，感覺體格更具吸引力和運動能力更好。<\/p>\n<\/li>\n<\/ol>\n<p>優質的服務多數都是由被服務者來評斷，其實那個提供服務的角色才是重要，藉由面對教學壓力，練習如何面對再轉化為有意義的內容，這也是對自己的優質服務！<\/p>"}, {"id": "f1753195194", "date": "2025-07-22", "title": "羅大佑流浪世界浪漫地找尋自我；在不願被標籤化的情況下，羅…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "羅大佑流浪世界浪漫地找尋自我；在不願被標籤化的情況下，羅大佑離開熟悉的家鄉，到紐約、香港、北京四處漂泊，一共搬了19次家。 小人物我，短短40年人生前段搬了18次家，但我是不得已面", "len": 267, "body": "<p>羅大佑流浪世界浪漫地找尋自我；在不願被標籤化的情況下，羅大佑離開熟悉的家鄉，到紐約、香港、北京四處漂泊，一共搬了19次家。<\/p>\n<p>小人物我，短短40年人生前段搬了18次家，但我是不得已面對現實，油麻菜籽命，期望自己每一刻都盡量活得像個人。<\/p>\n<p>0 台中出生<\/p>\n<p>1-2 永和租處<\/p>\n<p>2 關渡工廠宿舍<\/p>\n<p>2-4 關渡租處<\/p>\n<p>5-12 板橋公寓<\/p>\n<p>12-21 中和公寓<\/p>\n<p>22 輔大514巷租處<\/p>\n<p>23 嘉義受訓<\/p>\n<p>24 桃園龍岡部隊<\/p>\n<p>24-25 台北銅山街租屋<\/p>\n<p>25-29 三重華廈<\/p>\n<p>29 古亭借住<\/p>\n<p>30-34 木柵公寓<\/p>\n<p>34- 35 花蓮七腳川大樓租屋<\/p>\n<p>35-40 壽豐志學社區<\/p>\n<p>40-41 花蓮美崙大樓<\/p>\n<p>42 林口租屋<\/p>\n<p>43~ 林口大樓<\/p>"}, {"id": "f1753102743", "date": "2025-07-21", "title": "兩位醒吾高中及五專一路念到四技畢業的學生回來拿畢業證書，…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.21 兩位醒吾高中及五專一路念到四技畢業的學生回來拿畢業證書，下班後一起在林口吃晚餐，她們倆從立榮馬祖南竿實習結束之後，畢業前找到了桃園第一航廈的天際代理勤務公司上班", "len": 364, "body": "<p>2025.7.21<\/p>\n<p>兩位醒吾高中及五專一路念到四技畢業的學生回來拿畢業證書，下班後一起在林口吃晚餐，她們倆從立榮馬祖南竿實習結束之後，畢業前找到了桃園第一航廈的天際代理勤務公司上班，延續了自己在航空上的夢，期待他們越走越踏實，可以越飛越高。<\/p>\n<p>與學生聊起家中父親與母親分別於近日再婚及離婚，巧的是前者第二次結婚，後者第二次離婚，都在關係中逐漸地型塑出自己幸福的樣態，反而覺得這也不算是件不好的事，每個世代都在用自己的方式為自己好一些，而不是委曲一輩子抱怨一世紀，對一家人都好，而且反而擴大了幸福的樣子。<\/p>\n<p>最近有感五倫五常加諸在生命中的壓力，從家人與自己的生命中都看到了優點與缺點，身為老師這份職業更是能在其中真實地體會矛盾之處，當然生命不能重來只是向前，我可以確定的是想好好地走完人生路，就是要接受現在的自己與處境，在其中找出平衡之處。<\/p>"}, {"id": "f1752902609", "date": "2025-07-19", "title": "暑假小資韓國快閃旅程規劃", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "暑假小資韓國快閃旅程規劃 機加酒每人不到六千元 昨天殺了豬公之後才發現竟然有韓幣，上次去韓國已經是2012年花蓮台觀學生的畢業旅行，很想念相伴去旅行的學生，現在大家都當爸爸媽媽了。", "len": 666, "body": "<p>暑假小資韓國快閃旅程規劃<\/p>\n<h1>機加酒每人不到六千元<\/h1>\n<p>昨天殺了豬公之後才發現竟然有韓幣，上次去韓國已經是2012年花蓮台觀學生的畢業旅行，很想念相伴去旅行的學生，現在大家都當爸爸媽媽了。興起了找資料去玩的念頭，週末中午小小規劃了一下，飯店也選有星級的，原來暑假的韓國清州機加酒三人總費用約一萬六千元有剩。<\/p>\n<p>機票連結(點進去看看比高鐵票台北左營更便宜)<\/p>\n<p><a href=\"https://www.trip.com/t/NH7tblG7hQ2\">https://www.trip.com/t/NH7tblG7hQ2<\/a><\/p>\n<p>飯店連結 (J-ONE Hotel 三人房)<\/p>\n<p><a href=\"https://www.trip.com/t/19vgO9c7hQ2\">https://www.trip.com/t/19vgO9c7hQ2<\/a><\/p>\n<p>--------3天2夜行程-------<\/p>\n<p>以2025/8/13-8/15為例<\/p>\n<p>8/13(第一天)<\/p>\n<p>紅眼航班到達後可以直接去汗蒸幕休息，睡飽吃飽後建議再去J-ONE飯店CHECKIN，再去逛逛第一次來的清州小城市。<\/p>\n<p>8/12(第二天)<\/p>\n<p>可以搭計程車至各景點旅遊，或是坐火車去首爾一日遊。<\/p>\n<p>8/13(第三天)<\/p>\n<p>睡到飽後在市區旅遊購物，如果和我一樣是世界遺產收集狂熱者，安東河回村、陶山書院、法住寺都是值得造訪，當然等到10月底11月初秋天楓紅銀杏金黃遍地時更是值得再訪。<\/p>\n<p>以上都是網路規劃旅行，意者可以自行上網訂，暑假自助行一人6000元不到就可以快閃韓國旅行，連假都不用請。<\/p>\n<p>以下是Trip.com工商連結，先謝謝大家。<\/p>\n<p>機票連結 (點進去看看比高鐵票台北左營更便宜)<\/p>\n<p><a href=\"https://www.trip.com/t/NH7tblG7hQ2\">https://www.trip.com/t/NH7tblG7hQ2<\/a><\/p>\n<p>飯店連結 (J-ONE Hotel 三人房)<\/p>\n<p><a href=\"https://www.trip.com/t/19vgO9c7hQ2\">https://www.trip.com/t/19vgO9c7hQ2<\/a><\/p>"}, {"id": "f1752924651", "date": "2025-07-19", "title": "世界上最慘烈的人類戰爭，以人數來統計，位居榜首的是第二次…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.19 世界上最慘烈的人類戰爭，以人數來統計，位居榜首的是第二次世界大戰，其次是蒙古入侵歐亞大陸；第三名是漢帝國瓦解之後的魏蜀吳三國大戰，三國演義小說是3400萬條人命", "len": 322, "body": "<p>2025.7.19<\/p>\n<p>世界上最慘烈的人類戰爭，以人數來統計，位居榜首的是第二次世界大戰，其次是蒙古入侵歐亞大陸；第三名是漢帝國瓦解之後的魏蜀吳三國大戰，三國演義小說是3400萬條人命寫成的悲劇，以當時東亞人口來說，差不多土地上的人都活在恐懼之中了，再將後面的戰爭排出來，你會更驚訝與自身區域歷史中相關的血腥戰爭竟有那麼多場！<\/p>\n<p>4.太平天國 (3000萬人)<\/p>\n<p>5.清軍入關 (2500萬人)<\/p>\n<p>6.第一次世界大戰 (2200萬人)<\/p>\n<p>7.帖木兒西擴 (1700萬人)<\/p>\n<p>8.唐安史之亂 (1300萬人)<\/p>\n<p>9.俄國內戰 (1000萬人)<\/p>\n<ol start=\"10\">\n<li>\n<p>國共內戰 (900萬人)<\/p>\n<\/li>\n<li>\n<p>十字軍東征 (900萬人)<\/p>\n<\/li>\n<li>\n<p>神聖羅馬帝國三十年戰爭 (800萬人)<\/p>\n<\/li>\n<\/ol>\n<p>生活在安樂的我們，要珍惜和平！<\/p>\n<p>圖片來源：@civixplorer<\/p>"}, {"id": "f1752841889", "date": "2025-07-18", "title": "為什麼要好好讀書好好努力", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.18 為什麼要好好讀書好好努力 陪孩子來上托福課程，上課前他有我面對不確定事物的不安感，他有說出來，我也感受地到。他說，國高中時來北車補習都有這樣的感覺，因為他是放棄", "len": 416, "body": "<p>2025.7.18<\/p>\n<p>為什麼要好好讀書好好努力<\/p>\n<p>陪孩子來上托福課程，上課前他有我面對不確定事物的不安感，他有說出來，我也感受地到。他說，國高中時來北車補習都有這樣的感覺，因為他是放棄了一些什麼之後才決定要好好讀書的。<\/p>\n<p>我與他分享，我念師大附中時從來沒有上過劉毅英文的榜單，而他在念建中時卻總是一直在飛哥英文的前一百名榜單之中。那是因為我沒真的認同為自己讀書與努力在當時的我是件重要的事，反而覺得那時的自己不想做那件事，<\/p>\n<p>這是青少年的困境，因為不成熟的大腦在情緒上就是反抗，學習因為困難所以反抗，練習是要下苦功的所以反抗，有些人是真的在行動上反抗，就不念書上課用混的；有些人是在思想上反抗，做起事來不甘不願的。<\/p>\n<p>結果就是換來三四十年的遺憾，除了師大附中之外，後來沒什麼學歷可以說嘴的；即使三十年的工作力爭上游，職位也爬升漸高，但年少時的遺憾總是覺得補不回來。<\/p>\n<p>也許多數人就是喜歡夕陽或彩虹那種光彩炫爛的一時，對於需要深刻打造的樸實的追求總是少數人。<\/p>"}, {"id": "f1752765755", "date": "2025-07-17", "title": "旅行速寫", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.17 旅行速寫 終於來到了參加社區大學夜間課程的時候，為自己找回一點點的時間。 剛開始學，老師第一節課及第二節課除了賣材料之外，就是毫無章法地聊天上課，有點不習慣這種", "len": 349, "body": "<p>2025.7.17<\/p>\n<p>旅行速寫<\/p>\n<p>終於來到了參加社區大學夜間課程的時候，為自己找回一點點的時間。<\/p>\n<p>剛開始學，老師第一節課及第二節課除了賣材料之外，就是毫無章法地聊天上課，有點不習慣這種水水的上課方式，至少我自己對於3小時的課程的準備不是用這樣的方式。<\/p>\n<p>但，我還是很認真地學習，因為老師總是有好幾把刷子的，隨便現場畫個幾筆，找幾位有底子的新生或徒弟來比畫一下就可以讓我們這些新手完全無輒，我後來都是用放在網路與LINE群的中的錄影回家再臨摹，對這種硬功夫來說，動手一定比動口學得多。<\/p>\n<p>參加社大的課程可以認識很多與自己三觀不同的人，沒時間感的、沒學習進程與階段的、需要情緒支持的的人等都很合適報名，而且費用不高，時間彈性又可以加入一些比同溫層老人團等更有意義的群，感覺上每天都很充實不浪費，很推薦退休族及寂寞族參加！<\/p>"}, {"id": "f1752662603", "date": "2025-07-16", "title": "胸無大志做自己不行嗎？", "cat": "理財情報", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.16 胸無大志做自己不行嗎？ 想躺平是要有底氣的！張眼時見著房內的冷氣勻勻地吹著涼風，緊閉的窗外豔陽高照，你想到了什麼？ 我想到的是吹出來的風是用錢換來的，三年前的夏", "len": 560, "body": "<p>2025.7.16<\/p>\n<p>胸無大志做自己不行嗎？<\/p>\n<p>想躺平是要有底氣的！張眼時見著房內的冷氣勻勻地吹著涼風，緊閉的窗外豔陽高照，你想到了什麼？<\/p>\n<p>我想到的是吹出來的風是用錢換來的，三年前的夏天可能是因為疫情因素，我們的家庭電費竟然付出一萬多元，好家在就那麼一次，往前與往後的月份都是仍是數千元等級，在費用是合理且可控。<\/p>\n<p>就那麼一次的不可控又求助無門，只好乖乖地上繳費用給電力公司，真的覺得身旁的資源每一件都可以量化，而且如果沒注意就會突然失控到難以接受。<\/p>\n<p>這次的病程慢慢結束了，我整理了一下藥單上的時間，想一想這一個月來就是從接手產學及準備多益的壓力開始，嘴上覺得沒事，卻將這個月都困在心理與身體的抗爭之中。<\/p>\n<p>那天與爸爸聊起自己與孩子在學業、工作與各類價值上的競爭，他一句要我們當個旁觀者別太在意不就好了，在心中有點惱怒我，從我成年時，他正好也快五十歲就成天希望可以退休不要工作，曾經一家人都問過他要不要去開個計程車或學個小專長修家電什麼的，至少有事做不要成天在家看電視，後來甚至還學有錢人去打高爾夫，後來生了孩子之後我都氣到斷了他每個月的孝親費，結果他還不高興，專車到花蓮來罵人。<\/p>\n<p>花錢這件事跟呼吸一樣不用學，躺平更是與生俱來的能力，很難過自己的家人是這樣的心態，也不知為何從小我就背骨不齒這樣的模式，什麼事都要爭個頭尾，但也一路跌撞到今日。<\/p>"}, {"id": "f1752590419", "date": "2025-07-15", "title": "一早帶著不適起床，這幾天的腸胃鬧得兇讓我吃盡苦頭，隨手看…", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.15 一早帶著不適起床，這幾天的腸胃鬧得兇讓我吃盡苦頭，隨手看了滿桌的藥單，從六月中到今天，吃的藥越來越多，但身體卻越來越不是自己的，對自己難以面對壓力而身體給出來的", "len": 416, "body": "<p>2025.7.15<\/p>\n<p>一早帶著不適起床，這幾天的腸胃鬧得兇讓我吃盡苦頭，隨手看了滿桌的藥單，從六月中到今天，吃的藥越來越多，但身體卻越來越不是自己的，對自己難以面對壓力而身體給出來的反應非常難以接受，在這個年紀，沒人會對一個沒能力賺錢的父親或丈夫有什麼好期待的。<\/p>\n<p>孩子完成了二週的山地服務隊回家，昨夜就已經向家人提出要自己騎車的期待，一早更是親自來電與我討論如何平安返家的路程規劃，並與家人好好通個話讓她安心，一路上更是照著路程行進並適時拍照回報進度，返回林口台地後，就馬上先問要不要幫忙帶午餐回家，真是個貼心的孩子。<\/p>\n<p>這樣身體的反應讓我真的有力不從心之感，健康真的是萬善之源，也更羨慕我爸一輩子不曾頭痛、便秘及失眠的體質，可惜他沒有善用在努力學習或工作上，就依他的性子與期待安安穩穩地過了大半輩子，那天老弟在車上也說，老爸這輩子沒做對什麼事，也沒做錯什麼事，也許老天爺真的已經設計好一生的劇本，我們是凡人是否也什麼可以與上天硬碰硬的道理。<\/p>"}, {"id": "f1752380821", "date": "2025-07-13", "title": "被抽光的精神", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.13 被抽光的精神 不知道發生了什麼事，昨日傍晚回家看爸媽，好像被媽媽傳染了不適，整晚的睡眠都很淺，而且消化不良一直排氣，在昏昏沉沉中醒來，趕緊買了早餐進食後至家樂福", "len": 913, "body": "<p>2025.7.13<\/p>\n<p>被抽光的精神<\/p>\n<p>不知道發生了什麼事，昨日傍晚回家看爸媽，好像被媽媽傳染了不適，整晚的睡眠都很淺，而且消化不良一直排氣，在昏昏沉沉中醒來，趕緊買了早餐進食後至家樂福上廁所。<\/p>\n<p>對的，我沒辦法在家中如廁，因為坐式的馬桶總是上不乾淨，因此都四處在找和式廁所，前幾天環境部為了代表邁向先進國，甚至決定要將蹲式的公共廁所漸次汰換為坐式，這對我而言是天大的壞消息，我只能期待公共建設的速度慢一點，否則老後我可能就是那個在樹下大便的可怕老頭。<\/p>\n<p>在大雨中，我坐著機捷轉南環回到景安站，花了近一小時的時間，我沿途看風景、閱讀，其實時間在不知不覺中也過去，回到景安迎接我的是午後的大雨，也只好在騎樓下等雨停，後來老弟來接我，非常感激。<\/p>\n<p>與老弟聊天時才知道當年結婚時恩綺位居桃園市政府高位的表哥剛出獄，看了報導之後更是感觸良多，要如何在生命中積極努力並且學習最好的方式前進，真是門學問。<\/p>\n<p><a href=\"https://www.cy.gov.tw/News_Content.aspx?n=124&amp;sms=8912&amp;s=8127\">https://www.cy.gov.tw/News_Content.aspx?n=124&amp;sms=8912&amp;s=8127<\/a><\/p>\n<p>家中因為這二年來的詐騙影響及兩老孤居，可以感覺到整個家沒什麼生氣，但因為兩老的生活好習慣，其實家中仍維持地非常乾淨整潔，而且家中的經濟也在止血中平衡；倒是一路上我一直在思考著如何增加自己的財務能力與經濟能力，在現在的情形下要賺更多的錢要如何行動？<\/p>\n<p>多數的書及網評都提到了投資的重要性，但收入與支出難以有盈餘的我，除了每月強迫扣下生活費為儲蓄之外，根本都找不到方法增加收入，這二年我一直都在思考與擔憂這件事，多兼點課這沒問題，但收入總是固定每個月多個數千至萬元，根本只是支撐生活，而難以改善經濟情形。<\/p>\n<p>以下是沿路的雜想，也是昨夜難眠的思緒，在喝完一杯咖啡之後，先寫下來：<\/p>\n<p>１我覺得研究投資好像是一條路，但是自學與考證照一直都難以突破如何轉變為金錢，就只是嘴上財富；<\/p>\n<p>２用計畫費用來培養人脈與機會，善用這少少的十來萬，轉化為增加收入的方式，腦中現在思考到的有規劃未來有機會收費的研習課程與遊程，吸引具潛力的消費者成為團體；訓練未來可以合作的講師與夥伴，讓一個人成為團隊，來爭取更多未來的機會。<\/p>\n<p>３寫網誌或做Podcast將文字與思考累積為一個網站。<\/p>"}, {"id": "f1752052357", "date": "2025-07-09", "title": "今天鐵了心就做自己喜歡的事，規劃旅程。", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.9 靜心 今天鐵了心就做自己喜歡的事，規劃旅程。 將前陣子在網路上看到的影片整理成自己習慣的紙本，就是有一種安心感，可以對即將而來的旅遊有一種期待感，而不是一種不得已", "len": 364, "body": "<p>2025.7.9<\/p>\n<p>靜心<\/p>\n<p>今天鐵了心就做自己喜歡的事，規劃旅程。<\/p>\n<p>將前陣子在網路上看到的影片整理成自己習慣的紙本，就是有一種安心感，可以對即將而來的旅遊有一種期待感，而不是一種不得已逃離生活的感受。<\/p>\n<p>在盛夏的七月因為颱風的原因，安靜的校園伴著雨聲及涼風，暑氣全消，有幾個小時在紙上靜靜地寫下站名，在Google地圖上標記景點與餐廳，真是快意。<\/p>\n<p>規劃了曼谷市內髒船、曼谷即將退役成為鐵道博物館的華藍蓬火車站的旅行計畫，很期待旅行的體驗。<a href=\"https://www.youtube.com/watch?v=94yJ9NrbAgw\">https://www.youtube.com/watch?v=94yJ9NrbAgw<\/a><\/p>\n<p>也想去嘗嘗沿河米其林必比登推薦曼谷美食的Thipsamai Pad Thai鬼門炒河粉及紅大哥水門雞飯。<\/p>\n<p><a href=\"https://bobotravel.tw/blog/post/go-ang-pratunam-chicken-rice\">https://bobotravel.tw/blog/post/go-ang-pratunam-chicken-rice<\/a><\/p>"}, {"id": "f1751947763", "date": "2025-07-08", "title": "醒吾暑假聽聞人事一覽", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.8 醒吾暑假聽聞人事一覽 院校評會議上被提及的人名很多，但都多數都觀餐學院無關，林添勝、郭石城、郭盈芝、康柏凱等等，有幾位同仁與自己在職業認同上相似，有比較多的意見交", "len": 408, "body": "<p>2025.7.8<\/p>\n<p>醒吾暑假聽聞人事一覽<\/p>\n<p>院校評會議上被提及的人名很多，但都多數都觀餐學院無關，林添勝、郭石城、郭盈芝、康柏凱等等，有幾位同仁與自己在職業認同上相似，有比較多的意見交換，但在此時此刻，也可感覺到這些人都想辦法離開醒吾或是被學校清算，讓我自己覺得是不是我與他人互動與交往的方式要多思考，同溫層的同事朋友都離開學校了。<\/p>\n<p>成功轉換到更好學校的教師都是對外有人脈經營，而且仍在剛取得博士及助理教授的階段，勇於發表文章與爭取各類計畫，用實力證明有轉換工作的能力。<\/p>\n<p>在系上被清算或轉換單位的教師，真的有在座主管所言那麼難相處嗎？反而我覺得是因為主管覺得難以掌握或有太多的意見，再加上對制度的不熟悉，被系上清算解職改聘為行政人員；亦或是自請退休離開這個環境。<\/p>\n<p>記錄下幾位將離職的同事：吳怡芳、蕭真真、楊文仁、梅蘭姊，慧齡姊都未屆齡提前退休。總之在此時此刻低調地過日子，想辦法留在學校，積極爭取計畫，努力對外增加人脈是很重要的。<\/p>"}, {"id": "f1751689265", "date": "2025-07-05", "title": "黃金詐騙", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "黃金詐騙 新聞中黃金詐騙好可怕，讓我想起了一個小時候有讀過的格林童話「幸運的漢斯」，你有讀過嗎？ ----------格林兄弟----------- 從前從前，有一位名叫漢斯的男子", "len": 675, "body": "<p>黃金詐騙<\/p>\n<p>新聞中黃金詐騙好可怕，讓我想起了一個小時候有讀過的格林童話「幸運的漢斯」，你有讀過嗎？<\/p>\n<p>----------格林兄弟-----------<\/p>\n<p>從前從前，有一位名叫漢斯的男子。<\/p>\n<p>漢斯為主人服務了七年，他決定要離職了：主人，我的期限到了。現在我想回家，請給我工錢。<\/p>\n<p>主人回答說：你忠心耿耿地服侍我，我決定好好地對待你。<\/p>\n<p>說完，他給了他一塊和漢斯頭一樣大的金塊。<\/p>\n<p>漢斯有金塊了，當下覺得好開心，他一直想著要換什麼呢？<\/p>\n<p>但實際上，金塊並不能讓漢斯感到快樂，在回家的路上，他一直被提醒他一路上會缺少一些東西，於是被好多人說服了進行幾次以物易物：<\/p>\n<p>他用金塊換了一匹馬，<\/p>\n<p>馬換了一頭牛，<\/p>\n<p>牛換了一頭豬，<\/p>\n<p>豬換了一隻鵝，<\/p>\n<p>鵝又換了一塊磨石和一塊普通的田間石。<\/p>\n<p>他感覺自己每一次的交易，願望都成真了，當下他感覺自己像個每天都在過星期天的孩子，受到了幸運之神的眷顧。<\/p>\n<p>漢斯告訴自己：我好幸運呀！<\/p>\n<p>有一天，當他正要喝水時，兩塊沉重的石頭掉進了井裡。<\/p>\n<p>突然間，他終於慶幸自己不用再背著沉重的石頭了。<\/p>\n<p>他才感嘆道：天底下沒有人比我更幸運。<\/p>\n<p>他心情輕鬆，卸下所有負擔，往回家的路上而去。<\/p>\n<p>----------童話結束-----------<\/p>\n<p>你一定覺得漢斯很呆，如果是你會先將金塊拿去估價，找個人換成等值的錢，這樣手上有錢什麼東西都買得到！什麼願望都有機會實現！<\/p>\n<p>沒錯，當你手上有錢又被人知道時，一路上都是詐騙，先要了你的金塊，要你的馬，要你的牛，要你的豬，要你的鵝，用你的無盡欲望一步步地引導你入坑！最後你只拿到了兩塊無用的石頭，你還覺得自己很開心！<\/p>\n<p>圖片來源：Illustration von Paul Hey, 1939<\/p>"}, {"id": "f1751623497", "date": "2025-07-04", "title": "在世界末日前一天，參加了個收穫滿滿的研習及考試！", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.4 在世界末日前一天，參加了個收穫滿滿的研習及考試！ 因為教學與課程訓練的需求，前半年帶著學生對外參加不少遊程競賽，看著學生的優秀表現與積極努力，自己常覺得會的太少理", "len": 343, "body": "<p>2025.7.4<\/p>\n<p>在世界末日前一天，參加了個收穫滿滿的研習及考試！<\/p>\n<p>因為教學與課程訓練的需求，前半年帶著學生對外參加不少遊程競賽，看著學生的優秀表現與積極努力，自己常覺得會的太少理解的太淺！真的要親身體驗過緊張的現場實作考試，才能體會學生參加現場遊程競賽時有多麼緊張，更能夠換位去思考未來如何在教學輔導中有更為適切有效率的方式！<\/p>\n<p>兩天遊程研習鍾理事長（阿諾老師）整整上了2天的豐富課程，藉由系統性的串接全台景點，加上極具創意的遊程設計思維，真是坐在台下的自己需要學習的典範，也更能思考未來在教學設計上要如何精進與發展，落實在地實踐研究的空間。<\/p>\n<p>龍華科大校園設計與Logo呈現的方式完美結合，精緻而簡約！沿著山坡地建設出來的校園建築及階梯，往上爬時是沒什麼問題的，但向下走時，膝蓋真有點吃不消了。<\/p>"}, {"id": "f1751500797", "date": "2025-07-03", "title": "【記者吳嘉榮報導】為因應馬祖地區旅遊人口成長，增加地區導…", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【記者吳嘉榮報導】為因應馬祖地區旅遊人口成長，增加地區導遊人員，提升遊客接待人力能量與服務品質。縣府觀光局11至13日辦理106年導遊人員國家考試輔導班，邀請台灣專家學者進行講解分", "len": 642, "body": "<p>【記者吳嘉榮報導】為因應馬祖地區旅遊人口成長，增加地區導遊人員，提升遊客接待人力能量與服務品質。縣府觀光局11至13日辦理106年導遊人員國家考試輔導班，邀請台灣專家學者進行講解分析，並安排3堂模擬考與題型重點提示，協助學員熟悉考試題型與應考技巧，有效提升馬祖地區導遊人員國家考試錄取率。<\/p>\n<p>導遊人員國家考試輔導班共招收30名學員，報名已額滿，主要招收對象以持有馬祖觀光導覽解說證者及設籍連江縣有志參加導遊人員考試者為優先，上課地點縣府觀光局4樓會議室，課程共計24小時。<\/p>\n<p>授課師資包括台南應用科技大學旅館管理系教授兼董事翁廷碩、台南應用科技大學養生休閒管理學位學程講師王淮真、醒吾科技大學旅運管理系助理教授陳瑞峰、雄獅旅行社總監朱賓剛。<\/p>\n<p>11日課程，觀光資源概要台灣篇（歷史、地理、觀光資源維護）、世界篇（歷史、地理、觀光資源維護），模擬考與題型重點提示。12日課程，實務（二）觀光行政與法規、台灣地區與大陸地區人民兩岸關係條例與兩岸現況認識、香港澳門關係條例、入出境相關法規、外匯常識、民法債編旅遊專節與國外定型化旅遊契約，模擬考與題型重點提示。<\/p>\n<p>13日課程，實務（一）導覽解說及實務、航空票務、急救常識、旅遊安全與緊急事件處理、觀光心理與行為、國際禮儀，模擬考與題型重點提示。學員缺課時數達三分之一（含）以上，恕不核發研習證明書，該課程班，無法適用申請保留資格，亦不得辦理休學。<\/p>\n<p><a href=\"https://www.nankan.gov.tw/chhtml/Detail/2221?mcid=38467\">https://www.nankan.gov.tw/chhtml/Detail/2221?mcid=38467<\/a><\/p>"}, {"id": "f1751418233", "date": "2025-07-02", "title": "孩子參加清大原民文化社的新光部落暑期活動，看著像自己的年…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.7.1(補記) 孩子參加清大原民文化社的新光部落暑期活動，看著像自己的年輕臉龐在體驗全新的人生，覺得非常滿足。 建中的寶妮老師說其實7/1的晚上12點之後才算是過完今年的", "len": 512, "body": "<p>2025.7.1(補記)<\/p>\n<p>孩子參加清大原民文化社的新光部落暑期活動，看著像自己的年輕臉龐在體驗全新的人生，覺得非常滿足。<\/p>\n<p>建中的寶妮老師說其實7/1的晚上12點之後才算是過完今年的一半，我想那是對時間感有期待的人，相信許多年遘的長者對於時間的感受與中年時不同，總覺得一天沒做什麼事一下子就天黑了。日復一日地會覺得人生在流逝。<\/p>\n<p>其實也不只銀髮長者，也許不少人在一天結束之後，完全想不起來今天怎麼就過完了，甚至連三餐吃了什麼都想不起來。<\/p>\n<p>所以我有個方法可以將被上帝收走的時間要回來。<\/p>\n<p>方式很簡單：<\/p>\n<p>1.每日都有儀式感：為自己設計當日的造形，為自己設定＊＊日。<\/p>\n<p>像7/2就是我與康老師的午餐日，要一起回顧過去八九年的合作與努力，在學校的秘密基地一起吃個中餐。<\/p>\n<p>2.安排每日重要處理事項，時間訂好在10-11點就準時十點開始進行，專心處理這事兒，過程中事情在做，完成後成就感會湧出，在休息喝茶吃點心時，回想剛剛完成的活動或事件，加深此時此刻的意義，一天過去總會完成幾件事，整體的時間感卻會放緩，成為充滿記憶點的一日。<\/p>\n<p>3.反覆地練習每日的安排，不用先做年度或是月計畫，而是每日每日地安排活動，將長期任務練習轉化為一日一日的小活動，成為一種生活的節奏。<\/p>"}, {"id": "f1751300843", "date": "2025-07-01", "title": "六月對老師這份職業是很特別的，從大一帶起的導師班一一領走…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.30 六月對老師這份職業是很特別的，從大一帶起的導師班一一領走畢業證書了，長期一起做專案的老師突然間通知順利轉職了，年初時花時間寫的計畫也都趕在今天公告摃龜了。累積全", "len": 317, "body": "<p>2025.6.30<\/p>\n<p>六月對老師這份職業是很特別的，從大一帶起的導師班一一領走畢業證書了，長期一起做專案的老師突然間通知順利轉職了，年初時花時間寫的計畫也都趕在今天公告摃龜了。累積全學年長期失聲的課程教學、證照輔導、社團活動；打仗般的實習媒合；還有打鴨子上架的競賽訓練等等好像忙不完的事，轉瞬間劃下休止符。<\/p>\n<p>教室裡外學生散去，校園中只留下陣陣蟬鳴知了知了地叫著，像看完一場精彩的電影，再美好的結局也得落幕。<\/p>\n<p>七月起(就是明天)實習生將陸陸續續開始到各單位報到，期待又緊張；即將入學新生導師班也慢慢地成型中，又是個充滿希望新學年。<\/p>\n<p>不變的是，自己仍堅持在跑道上，用了四年的蘋果手錶已陪我跑跑走走4040公里，家中陽台望出去的台北夏夜依舊繁華美麗。<\/p>"}, {"id": "f1751193298", "date": "2025-06-29", "title": "錢不夠用叫窮在台灣社會是保護色，查了資料後證明自己真的錢…", "cat": "理財情報", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.29 錢不夠用叫窮在台灣社會是保護色，查了資料後證明自己真的錢不夠用，就覺得很悲哀。 英國獨立報寫到(註1)，美國的X世代是財務保障最差的一代，多數美國人認為每年需要", "len": 504, "body": "<p>2025.6.29<\/p>\n<p>錢不夠用叫窮在台灣社會是保護色，查了資料後證明自己真的錢不夠用，就覺得很悲哀。<\/p>\n<p>英國獨立報寫到(註1)，美國的X世代是財務保障最差的一代，多數美國人認為每年需要10萬美元以上的收入才能過上舒適的生活；換算為台灣就是每年要有三百萬台幣。<\/p>\n<p>X世代是指出生在民國54年至69年之間的台灣人，依據內政部的統計(註2)全台有547萬，是六個世代中人口數最多的群體，但與前後代人數不相上下。<\/p>\n<p>Jean M. Twenge(註3)曾寫到X世代於1990年代初期開始進入社會，特色是穿黑色衣服，犬儒主義盛行擁抱個人主義，且X世代較晚結婚，並且開始在未婚狀態下生育子；X世代對權威更加懷疑，明顯較不信任他人。<\/p>\n<p>註1 <a href=\"https://www.independent.co.uk/news/world/americas/gen-x-salary-wealth-financial-security-b2776268.html\">https://www.independent.co.uk/news/world/americas/gen-x-salary-wealth-financial-security-b2776268.html<\/a><\/p>\n<p>註2 <a href=\"https://www.ris.gov.tw/app/portal/346\">https://www.ris.gov.tw/app/portal/346<\/a><\/p>\n<p>註3 <a href=\"https://link.springer.com/article/10.1007/s40596-023-01921-3\">https://link.springer.com/article/10.1007/s40596-023-01921-3<\/a><\/p>"}, {"id": "f1751029015", "date": "2025-06-27", "title": "真正開始放暑假了，我要學著如何安心地過暑假！", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.27 真正開始放暑假了，我要學著如何安心地過暑假！ 國小以前我的暑假總是在台中興大五村渡過，每天就是過得悠悠靜靜的，晚上伴著蟲鳴入睡，早上起床時其實阿公阿嬤早就不在家", "len": 546, "body": "<p>2025.6.27<\/p>\n<p>真正開始放暑假了，我要學著如何安心地過暑假！<\/p>\n<p>國小以前我的暑假總是在台中興大五村渡過，每天就是過得悠悠靜靜的，晚上伴著蟲鳴入睡，早上起床時其實阿公阿嬤早就不在家了，但會留著豐富的早餐在菜櫃中，我可以獨享美味的手做中式早餐。<\/p>\n<p>但是這一切在升上國中回到台北之後，我的暑假就變質了，不是13-4歲青少年在意的學習補習，小六升國一暑假仍回台中過，傻傻地就國中開學，結果一開學才知道原來國中有一科英文要先修，而我連26個字母都認不得；記得的是國一B段班升國二A-班的暑假在電子工廠做零工，國二升國三因為升到A+班後就全週全天課，暑假都沒了，考上師大附中後的暑假也是打工；賺錢這兒事的比例很自然地在隨著年齡增加而增多，自然到我完全覺得這是理所當然，混然天成的，這是底層人生的課題，直到這幾年，我才慢慢地理解這樣的心態有可能會讓自己翻不了身。<\/p>\n<p>因為孩子上大學了，學校也給了完整六十天暑假，忙了半輩子的自己突然間反而不知所措，原來過暑假也是要學習的，這幾天先規劃語言考試及自學計畫及晚上的旅行速寫水彩畫課程，當然一直在持續的運動不會斷，更在考量改為早起晨運及學習，讓白天的熱氣充斥之時，有個安心休養游泳健身的規律。<\/p>\n<p>同時仍期待著產業學院的計畫獲准，更想藉此為自己的博士班多加點柴火，開拓更多的機會。<\/p>"}, {"id": "f1750924907", "date": "2025-06-26", "title": "暑假前的研習週有感", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.26 暑假前的研習週有感 學生已經放暑假了，今天主任找我討論曉華老師想離職，這已經是她第二次提離職了，我一直想起過往工作有好夥伴離職的不捨與無奈，依著教職期間的觀光學", "len": 987, "body": "<p>2025.6.26<\/p>\n<p>暑假前的研習週有感<\/p>\n<p>學生已經放暑假了，今天主任找我討論曉華老師想離職，這已經是她第二次提離職了，我一直想起過往工作有好夥伴離職的不捨與無奈，依著教職期間的觀光學院的呂江泉老師、吳繼文老師，醒吾的胡晴愉老師、康柏凱老師等，都對留在現職的自己有不少的震撼。<\/p>\n<p>有三個思考點：<\/p>\n<p>首先是與當事人聊聊天，工作那麼久一定有很多默契，很多話與事因為總想著明天或下週仍會碰面，有機會再說；但當同事離職確認之時，很多事沒有聊一聊，後來也會變得很不合適，千萬要在這個關鍵時刻一起吃個飯，如果有想到就送個小禮物，期待從同事轉化成為一輩子的好友，讓這條友誼線在放長之前，彼此都有機會將線頭綁緊一點。<\/p>\n<p>其次是換位與溝通的心態，在大學校園之中發生類似的事件是年年有，時時來，有人說校園比社會單純，其實各有千秋，學校中的教師自尊心高，自我期待也高，在人際的處理上更是需要細心與考量，當很多的溝通無以為繼之時，凡事為人留路，路自然就通了。在自己擔任系主任時，我很少會想與同事討論這類的事，總覺得這事自己處理就好。但是我自始至終都沒有處理好過，因為我一點也不善長管理，很難洞察人心的需求，那時的我自以為是很會溝通的，以為自己聊一聊或用個方法就沒事，其實那三年來的經驗就是，自己有溝沒通，很不懂人心，更不會做人。<\/p>\n<p>第三點我學到的是團隊營造。這幾天的研習有幾場發表會，主講者都提到了團隊。公立學校重視教授的研發、產學及專業性，基本上團隊仍是任務型的；私立學校招生與教學並行，少子化已經很不易招生，每位學生幾乎都是親迎入學，在校四年學習更是要期待他們不休、不退、不轉的關鍵就是團隊營造。校園團隊如何營造？師生關係彼此之間不離不棄，讓學生對校園與老師都要有歸屬感、榮譽心、認同感就要從教師團隊做起，事情來了無私地溝通，從爭論中找到合宜的出口，從教學及活動的相互支援與支持，甚至是各種補助及獎勵利益的訊息交換等，沒一處能忽略；而且當學生獲得成就與教師獲獎之時，將榮耀歸於團隊，每個人的重要性都應該被細數與珍惜，有機會一起上班下班就是緣份。<\/p>\n<p>我自知是私校老師，不是我們不在乎發表與研究能力，而且當每月飯碗都不保時，總有些事是要取捨的，下週起我將開始迎接二個月帶薪的暑假，期待明年FB回顧時，亦或是九月開學之時，曉華老師、范老師、黃主任等等，我們都仍是個團隊，穩穩地在大浪潮中招生教學，在學生的成長與成就中為自己添彩。<\/p>"}, {"id": "f1750581489", "date": "2025-06-22", "title": "前陣子學院辦公室辦了退休表揚會，讓教授們有一點點的時間聊…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "前陣子學院辦公室辦了退休表揚會，讓教授們有一點點的時間聊聊感言。好幾位都用職代號碼079或078來表達已經投身教育到了35年或36年，終於等到屆齡退休這一天，滿心歡喜。 附圖是民國", "len": 316, "body": "<p>前陣子學院辦公室辦了退休表揚會，讓教授們有一點點的時間聊聊感言。好幾位都用職代號碼079或078來表達已經投身教育到了35年或36年，終於等到屆齡退休這一天，滿心歡喜。<\/p>\n<p>附圖是民國81年的北區五專錄取分數，算算當年的五專也只有這幾所，而我們醒吾也只有五個科：會計科、國貿科、企管科、銀保科及觀光科，而且仔細看全國北區五專只有醒吾商專設有觀光科，當年不算低的錄取分數仍常讓資深老師引以為豪。<\/p>\n<p>名單中的華夏工專、復興工專、大漢工專已經退場，對比國立的宜蘭農工專校已經升格為宜蘭大學，而且更有不少學校已經更名到大家都不知道現在的學校名稱是什麼了！<\/p>\n<p>自己是民國76年考北區五專聯招的，不知道是否找得到當年的報紙？<\/p>\n<p>照片來源@luke.lee.129<\/p>"}, {"id": "f1750167842", "date": "2025-06-17", "title": "菁桐產學踏查", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.17 菁桐產學踏查 接到這個案子是因為康老師好意在轉職至龍華科大前留給我的；而一回到學校也聽聞了郭老師也將在這個學期轉職至淡江大學。 過往曾經一起專案工作的同事，在期", "len": 328, "body": "<p>2025.6.17<\/p>\n<p>菁桐產學踏查<\/p>\n<p>接到這個案子是因為康老師好意在轉職至龍華科大前留給我的；而一回到學校也聽聞了郭老師也將在這個學期轉職至淡江大學。<\/p>\n<p>過往曾經一起專案工作的同事，在期間內為自己提升至博士學位，轉到更好的學校是自然而然，只是自己仍在原地踏步，至今都仍為了多益成績不夠高分而卡住。<\/p>\n<p>沒能有更上一層的發展，學校更是每況愈下，整個校園冷清全都是充數的越南學生，工作環境各系人情淡薄內鬥常聞。在這個時刻要如何靜心來面對自己的職涯，非常不易。<\/p>\n<p>菁桐車站前的鐵道專賣店買了一本台灣鐵道旅行護照，在這個毫無頭緒的日子中，先為自己的生活定錨，現在有收入最重要，生活與健康要緊緊跟著，今天認識了數位設計系的黃老師，有了一點不一樣的收獲，期待未來的每一步都不要走得孤孤單單。<\/p>"}, {"id": "f1750053994", "date": "2025-06-16", "title": "前幾天學院辦公室辦了退休表揚會，讓教授們有一點點的時間聊…", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.16 前幾天學院辦公室辦了退休表揚會，讓教授們有一點點的時間聊聊感言。好幾位都用職代號碼來說自己已經工作了35年或36年，終於等到屆齡退休這一天。學校的教授們多半是碩", "len": 394, "body": "<p>2025.6.16<\/p>\n<p>前幾天學院辦公室辦了退休表揚會，讓教授們有一點點的時間聊聊感言。好幾位都用職代號碼來說自己已經工作了35年或36年，終於等到屆齡退休這一天。學校的教授們多半是碩士或博士畢業時開始當老師，所以初任職時很多都快30歲，所以一份工作做到底就退休，真的很幸福又圓滿，真心祝福！<\/p>\n<p>只是從國中就開始工廠打零工，20歲時才掛上第一份勞保的自己，加減也工作了33年，但換了N個工作之後，我知道可能完全沒有機會上台聊退休感言，原因顯而易見，私校少子化沒學生，如果退場也得轉行，所以最重要的就是要喜愛現在的每一刻，珍惜有收入的每一天，重視每一位來就讀的學生，工作就是人生的實踐，直到最後一刻。<\/p>\n<p>最大的心得就是沒在職場起步時找含金量高的工作，只想著找份自己喜歡的工作，而且將專業做好，但如果你的人生只能靠自己，那熱愛專業與興趣就可能是錯的。<\/p>\n<p>在大學選科系的此時，真心覺得念的系所要有未來前(錢)景。<\/p>"}, {"id": "f1749484073", "date": "2025-06-09", "title": "今天學生問我，我家住在那兒呢？想了好久，我只能回答我現在…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.9 今天學生問我，我家住在那兒呢？想了好久，我只能回答我現在住在林口，卻完全說不出來自己的家在那兒，因為從小到大搬了無數次的家。 0 我在台中出生，當兵前與爸媽一同住", "len": 374, "body": "<p>2025.6.9<\/p>\n<p>今天學生問我，我家住在那兒呢？想了好久，我只能回答我現在住在林口，卻完全說不出來自己的家在那兒，因為從小到大搬了無數次的家。<\/p>\n<p>0 我在台中出生，當兵前與爸媽一同住過搬過以下地區：<\/p>\n<p>1-2 永和租屋<\/p>\n<p>2 關渡工廠宿舍<\/p>\n<p>2-4 關渡租屋<\/p>\n<p>5-12 板橋公寓<\/p>\n<p>12-22 中和公寓、輔大514巷租屋<\/p>\n<p>23-24 從軍期間在嘉義受訓、分發至桃園龍岡六軍團直到退伍後，旋即成婚，小夫妻更是到處流浪到處找地方住：<\/p>\n<p>24-25 台北銅山街租屋<\/p>\n<p>25-29 三重借住<\/p>\n<p>29 古亭岳母家借住<\/p>\n<p>30-34 木柵公寓自購<\/p>\n<p>34- 35 花蓮蓮花大樓租屋<\/p>\n<p>35-40 壽豐志學社區自購<\/p>\n<p>40-41 花蓮美崙大樓自購<\/p>\n<p>42 林口租屋<\/p>\n<p>43-53 林口大樓自購<\/p>\n<p>換了16次的家，但無論如何我都是與家人住在一起，之前與爸爸媽媽，後來自己成家從二人到三人，我仍不知道還會不會再搬家？但可以很確定的是，家人一起在哪兒，我的家就在那兒。<\/p>"}, {"id": "f1749389471", "date": "2025-06-08", "title": "基隆港郵輪旅遊領團行動微課程", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.8 基隆港郵輪旅遊領團行動微課程 用【行萬里路勝讀萬卷書」太過老套，但今天的微課程真讓老師有種在課堂上講十幾個小時都比不上實際登輪的新奇感與專注度，學生照片中的笑容說", "len": 300, "body": "<p>2025.6.8<\/p>\n<p>基隆港郵輪旅遊領團行動微課程<\/p>\n<p>用【行萬里路勝讀萬卷書」太過老套，但今天的微課程真讓老師有種在課堂上講十幾個小時都比不上實際登輪的新奇感與專注度，學生照片中的笑容說明一切。<\/p>\n<p>感謝台灣國際郵輪協會的游秘書長及易總的大力支持與協助，醒吾師生都覺得收獲滿滿！同時更向麗星郵輪官方大使Cassie Chou資深經理的真情分享與介紹，致上最深的感謝，學生們都對郵輪的工作有了更深一層的期待與認知！<\/p>\n<p>大家都表示這個暑假要規劃與家人一同的麗星郵輪旅遊！<\/p>\n<p>也有不少同學說到未來大四實習也很期待麗星郵輪的工作呢！<\/p>\n<h1>世界海洋日(World Oceans Day）<\/h1>\n<h1>國際友誼日(National Best-Friends Day)<\/h1>"}, {"id": "f1749277691", "date": "2025-06-07", "title": "台灣警察專科學校-地政士考試", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.7 台灣警察專科學校-地政士考試 值得記念的考試日，雖然應考的只有一人，但卻是帶著一家人的祝福進考場；很久以來因為我們這一家總是只能在各次的挑戰中且戰且走，尤其是我們", "len": 409, "body": "<p>2025.6.7<\/p>\n<p>台灣警察專科學校-地政士考試<\/p>\n<p>值得記念的考試日，雖然應考的只有一人，但卻是帶著一家人的祝福進考場；很久以來因為我們這一家總是只能在各次的挑戰中且戰且走，尤其是我們兩個很少在走入考場時是有人陪伴的。<\/p>\n<p>但是這幾年變得很不一樣，我們改變了心態與戰略，面對考試努力地準備，謹慎地選擇領域與考場，將每一次的挑戰都當成是一家人的幸福旅程，雖然兒子在新竹期末考，但仍不忘在群中為媽媽打氣，我可以感覺到彥伶因為我們的支持變得不一樣。<\/p>\n<p>更希望這次的地政士考試能首戰告捷，一舉中的。<\/p>\n<p>警專考場就在萬芳醫院旁，二十幾年前的SARS住院及兒子出生都在這個區域，木柵是我們一家的轉彎點，買的第一間房子，從業界轉職為教職，孩子生養都是在這個區域，二十幾年過去了，回到以前最常下班的捷運站路口，實在是又熟悉又陌生。<\/p>\n<p>坐在台北市文山運動中心的公共區域，準備明天帶學生去基隆的課程資料，同步陪著家人考試，外面仍是熟悉的初夏午后大雨，很平靜很幸福。<\/p>"}, {"id": "f1749046648", "date": "2025-06-04", "title": "畢業典禮結束後才能好好整理照片，細細地看，慢慢地回憶。", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.6.4 畢業典禮結束後才能好好整理照片，細細地看，慢慢地回憶。 原本以為： 來來去去的學生就是當教師生涯的日常， 定在講堂前的老師是學生人生中的過客。 這是原本是我接這份", "len": 430, "body": "<p>2025.6.4<\/p>\n<p>畢業典禮結束後才能好好整理照片，細細地看，慢慢地回憶。<\/p>\n<p>原本以為：<\/p>\n<p>來來去去的學生就是當教師生涯的日常，<\/p>\n<p>定在講堂前的老師是學生人生中的過客。<\/p>\n<p>這是原本是我接這份工作最初的認知，直到當了快廿年的教師，才慢慢體認到，老師不是一份職業，而是在學生與教師彼此人生的舞台上一個關鍵的角色。<\/p>\n<p>輕與重取決於自己對角色的認同與投入，當全心全意地扮演之後，不知不覺地寫進了生命之中，成為一個又一個的印記，成就了學生更形塑了自己。<\/p>\n<p>很感激有機會成為教師，感謝引我入行的前輩長官，更感謝建構教學舞台的台灣觀光學院及醒吾科大，沒有舞台的演員就是無根的浮萍，讓我一個不是很合適當教師的人，有機會在教育領域中有可以磨練人生精進體會的機會，更讓我有這樣的機會，可以認識數以千計的學子，一學年、一學期、一門課、一堂課、一份報告、一場競賽、一次過場的練習都是我們師生結緣的良機。<\/p>\n<p>其實這樣複雜的感受會因為時間慢慢變淡，我想用文字記錄下此時此刻豐富的感動，因為這個時刻我是用盡全心全力的教師。<\/p>"}, {"id": "f1748394414", "date": "2025-05-28", "title": "清晨家人提起方才孩子打電話告知，昨天的普通物理考試發生了…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.5.28 清晨家人提起方才孩子打電話告知，昨天的普通物理考試發生了一些事情。 上百人的考場教室中，不知為何物理教授特別針對孩子，可能是因為上週他當面為了期中考卷改錯向教授", "len": 561, "body": "<p>2025.5.28<\/p>\n<p>清晨家人提起方才孩子打電話告知，昨天的普通物理考試發生了一些事情。<\/p>\n<p>上百人的考場教室中，不知為何物理教授特別針對孩子，可能是因為上週他當面為了期中考卷改錯向教授要求加分，教授當時臉色就顯得不耐煩，而且還推說是助理的問題，要求他自行向助理用書面申請加分，後來他也進行了，這是另一件事。也許是這樣，這週教授就在期末考試時來他身邊看他考試，後來看著他表示他打開iPad是作弊，所以要求他將包包提到前面去，但事實上教授在上週上課時有表示今天的隨堂複習考是可以OPENBOOK，可是教授當場不認。<\/p>\n<p>想像一個年輕的學子在百人大教室中，當場有教授的壓力及全班同學都在注視的情形下，他是非常窘迫的。<\/p>\n<p>後來他如何處理呢？<\/p>\n<p>在位子上的他，想了一想決定拿著考試卷走向教授，他說：謝謝教授，既然你都這樣說，我決定這考試我不考了！之後就離開了教室。<\/p>\n<p>我覺得他很帥，雖然心中仍擔心著教授會當掉他，前面的三次期中考試的成績也就白白浪費了，但是，更佩服他，在巨大的壓力與成績期待下，仍懂得如何在無理的權威之前說不。<\/p>\n<p>這是我們這一輩奴性很重的人做不到的，我只有告訴他，無論發生什麼事，爸爸媽媽都站在你這邊。我沒說的是，真的謝謝他告訴我們他發生的事，我們非常心疼，卻也可以感覺到他正在探尋在複雜的社會與組織中互動的方式，這次我們覺得他做得比我們更成熟。<\/p>"}, {"id": "f1748265832", "date": "2025-05-26", "title": "給最可愛的班導生：", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "給最可愛的班導生： 有緣同班師生四年，真的無比美好。 因為大家的貼心，讓老師時時暖心。 因為你們的積極，讓系上充滿底氣。 因為你們的努力，讓職涯增值向上。 恭喜大學畢業， 祝福每一", "len": 327, "body": "<p>給最可愛的班導生：<\/p>\n<p>有緣同班師生四年，真的無比美好。<\/p>\n<p>因為大家的貼心，讓老師時時暖心。<\/p>\n<p>因為你們的積極，讓系上充滿底氣。<\/p>\n<p>因為你們的努力，讓職涯增值向上。<\/p>\n<p>恭喜大學畢業，<\/p>\n<p>祝福每一位同學事事順心、好運連連。<\/p>\n<p>未來的一切充實、豐足又幸福。<\/p>\n<p>畢業快樂！<\/p>\n<p>學生快畢業了，當老師的心很亂，總是擔心著未來的導師班會像你們一樣貼心嗎？會不會永遠再也遇不到這麼好的班級？<\/p>\n<p>你們看！對於未知的未來，我們都好擔心，都希望當下的美好與習慣可以留存。但是，事與願違，從畢業證書拿到的那一刻開始，我們所有人都要在人生的十字路口中選擇一個方向，大步向前；更不能躊躇原地，依戀過往。<\/p>\n<p>老師也要整理心情，重新認識另一群學生，鍊結彼此間的各種緣份；讓一層又一層地關係豐富我們的生命，也成為我們彼此之間的貴人。<\/p>"}, {"id": "f1747562108", "date": "2025-05-18", "title": "常在動態中看到可以獲利致富的賺快錢訊息，整體看起來形態多…", "cat": "理財情報", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.5.18 常在動態中看到可以獲利致富的賺快錢訊息，整體看起來形態多年未變，三十幾年前參加過在天母的房地產投資大會，賣蘆薈的永久說明會，也因為想多賺點錢去參加過安麗、優莎那", "len": 438, "body": "<p>2025.5.18<\/p>\n<p>常在動態中看到可以獲利致富的賺快錢訊息，整體看起來形態多年未變，三十幾年前參加過在天母的房地產投資大會，賣蘆薈的永久說明會，也因為想多賺點錢去參加過安麗、優莎那、美樂家的「說明會」，但因為個性好疑又小氣，所以後來最多就是在奇摩或eBay上開個小帳賣舊貨之後，根本什麼快錢也不敢賺。<\/p>\n<p>這樣的「說明會」已經從實體轉至網路遍布周遭，分群分眾四處舉辦，走到此時真的沒有任何當年投入的同學或朋友做到今天，也沒有見到任何因為賺快錢而至今富貴連年。<\/p>\n<p>要如何分辨且遠離呢？<\/p>\n<p>１不要參加任何說明會<\/p>\n<p>２別試用試食任何養生產品<\/p>\n<p>３自己找上門的業務工作機會都先存疑<\/p>\n<p>４每月賺到的月薪先存一萬元進定存，沒錢就不會亂想<\/p>\n<p>５別用名牌、豪車來認識朋友<\/p>\n<p>６注意親友父母親有沒有異常的消費或朋友群<\/p>\n<p>網路廣告＞說明會＞體驗感受錢的味道＞投錢＞拿到一點錢＞投更多錢＞拿到錢＞找人來參加說明會＞借錢來投錢＞說明會及成果大會＞再投錢<\/p>\n<p><a href=\"https://www.facebook.com/share/p/1C7QFP2Vcf/\">https://www.facebook.com/share/p/1C7QFP2Vcf/<\/a><\/p>"}, {"id": "f1747356892", "date": "2025-05-16", "title": "常有人說，你真好，工作與年輕人在一起，我也覺得這是這份工…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.5.16 常有人說，你真好，工作與年輕人在一起，我也覺得這是這份工作很有趣的面向，對我也好，至少載著學生去外縣市招生或比賽時，我都開放他們點我的Spotiy，這樣我才會聽", "len": 391, "body": "<p>2025.5.16<\/p>\n<p>常有人說，你真好，工作與年輕人在一起，我也覺得這是這份工作很有趣的面向，對我也好，至少載著學生去外縣市招生或比賽時，我都開放他們點我的Spotiy，這樣我才會聽到玖壹壹、Fujii Kaze這樣的好歌。<\/p>\n<p>但事實上，我們要面對的仍是日日年年的時間流逝，更要接下家人與周遭好友的各類與年齡相關的議題與體認。因此，每日堅持的三千公尺跑步是提醒身體條件與心理認同的最好方式，時快時慢都是體能的反應，適時地調整五感與心靈的距離是走入中年最重要的課題。<\/p>\n<p>附圖中日本秋田縣是東亞地區老年人口比例最高的地區（37.6%）。香港、韓國和台灣也擁有相當規模的老年人口。台灣是世界上老化速度最快的國家之一，再加上極低的生育率，台灣老年人口最多的地區是嘉義(20%)，國家整體排名在亞洲地區排名第四，在日港韓之後，但這是2022的資料表，2025年應該更為嚴重，因為三年過去了我也成了五十世代。<\/p>"}, {"id": "f1747236766", "date": "2025-05-14", "title": "賀 醒吾旅運系二年級朱紫瑜獲全國觀光菁英盃現場創作組第二…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.5.14 賀 醒吾旅運系二年級朱紫瑜獲全國觀光菁英盃現場創作組第二名。 觀光菁英盃的總決賽今年辦在台中修平科大，其實身兼學生會會長的學生忙校內三合一選舉已經焦頭爛額，前一", "len": 948, "body": "<p>2025.5.14<\/p>\n<p>賀 醒吾旅運系二年級朱紫瑜獲全國觀光菁英盃現場創作組第二名。<\/p>\n<p>觀光菁英盃的總決賽今年辦在台中修平科大，其實身兼學生會會長的學生忙校內三合一選舉已經焦頭爛額，前一天晚上11點在LINE群通知學生要隔日清晨出發時，她也才剛剛打完工下班準備回學校宿舍。像超人一樣的學生，仍在晨光中精神奕奕地準時在6:28出現在約好的集合地點，在林口瘋狂上班潮仍未開始前，我們師生四人迎著朝陽一路向南，路上的她與同學與我，仍找時間口頭複習著台灣觀光100亮點的各個景點位置、內容、特色及可及性，帶著愉快且謹慎的心情來到了溫暖的台中修平科技大學，這次的全國總決賽舉辦學校。<\/p>\n<p>觀光菁英盃是觀光署指導，全台灣每年最重要的遊程設計競賽，來自於各校的初賽的優勝隊伍與師生甚至是前一天就到達會場，現場還有學校是包遊覽車團體一同參與；而我們旅運師生四人就是單刀赴會，在廣場上拉起布條有著違合的可愛感覺，老師我就是司機兼地陪，辦好保險請好學生公假，出發前的心理建設就是讓學生覺得挑戰競賽就是件有趣且發覺自我能力的好機會，勇於參賽就是值得肯定的事，先幫學生在心中加分加血，為他們加油鼓勵。<\/p>\n<p>在正中午比完現場競賽後，台中的氣溫已高達36度，我們希望可以在各地下班車潮前回到學校，決定立馬從大里開車去臨近霧峰朝陽科大吃午餐，並拜訪老師小時候最愛的草湖美芳芋仔冰，鼓勵那麼努力的我們，順便消暑降溫。<\/p>\n<p>通知紫瑜得獎的消息來自於孔令揚老師在台中修平現場的文字直播，孔老師除了課餘協助指導紫瑜之外，更獲得觀光署遊程規劃優良教師，我們大家都超級開心，更是感謝一直在關心路程平安的黃明一主任，還有曉華老師課程要求與支援、導師范老師的無形鼓勵。在高速公路上時，學生們仍在趕著完成小杰老師的Abacus線上訂位作業，甚至是接近校園時學生們還在車上想要用雷達點名最後一堂課，真是非常充實的一日。<\/p>\n<p>我們四位師生以賽代訓獲取寶貴的學習、訓練、競賽及觀賽經驗，期待小小的經驗與鼓勵成為成長的養分。<\/p>\n<p>在現場看到忙碌不已的鍾任榮理事長、審判長黃永全副教授、暨南大學曾喜鵬副教授、真理大學余曉玲主任、黎明學院郭仲凌主任、觀光領隊協會杜鴻安秘書長等重量級教師及業界專家的付出與支持，才累積出最具公信力的全國遊程競賽的專業舞台，謝謝主辦單位中華民國遊程規劃協會，明年再見。<\/p>"}, {"id": "f1746979699", "date": "2025-05-12", "title": "人生苦短", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.5.11 人生苦短 這是剛才聽女巫店老板訪問時她給的最後結論，同樣的四個字在不同家庭成長的我卻有著完全不同的解釋。她的解釋是因為人都過得很快樂，所以會煩惱人生太短的問題；", "len": 352, "body": "<p>2025.5.11<\/p>\n<p>人生苦短<\/p>\n<p>這是剛才聽女巫店老板訪問時她給的最後結論，同樣的四個字在不同家庭成長的我卻有著完全不同的解釋。她的解釋是因為人都過得很快樂，所以會煩惱人生太短的問題；而我的解釋卻是人生很苦而且又不長，何必走這一遭呢？是不是很負面。<\/p>\n<p>附圖的研究針對日本人對時間感在不同年齡的差異，有點令自己驚訝，原來此時的自己真的有那種一年過完好像只過了一週的感覺，但回想起來卻是苦澀不堪、難以回首。<\/p>\n<p>我真的覺得現世的生活幸福感會取決於周遭的比較，生於一個很普通的家庭，小時候還自以為是小康之家，其實從國中之後的求學階段的同學家庭相較，我的家庭背景真的再普通也不過，在後來的價值觀與認知上有很大的差距。再加上另一半也很現實，對於生命中所有需要想象的事務都一律採懷疑論，那真的人生就是苦上加苦了，至於短或長更不重要了。<\/p>"}, {"id": "f1747032607", "date": "2025-05-12", "title": "🎉 #榮耀時刻 #醒吾旅運國考及格 🎉", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "🎉 #榮耀時刻 #醒吾旅運國考及格 🎉 👏👏👏 🌟 賀 旅運系二年級 蕭筠芝 2025年 英語領隊 🌟 賀 旅運系二年級 薛宇棠 2025年 華語導遊 🌟 賀 旅運系二年級 邱建盛", "len": 285, "body": "<p>🎉 #榮耀時刻 #醒吾旅運國考及格 🎉<\/p>\n<p>👏👏👏<\/p>\n<p>🌟 賀 旅運系二年級 蕭筠芝 2025年 英語領隊<\/p>\n<p>🌟 賀 旅運系二年級 薛宇棠 2025年 華語導遊<\/p>\n<p>🌟 賀 旅運系二年級 邱建盛 2025年 華語領隊<\/p>\n<p>醒吾旅運系師生保持初衷，持續努力達成學習目標！<\/p>\n<p>恭喜旅運二年級同學通過交通部觀光署辦理的導遊領隊評量。<\/p>\n<p>👏👏👏<\/p>\n<p>有志於旅行世界投身觀光服務的學生們，打好基礎我們明年再戰！<\/p>\n<p>✈️🚄🚞🚢🚌✈️<\/p>\n<h1>空服旅遊實習就業導向的實踐者<\/h1>\n<h1>醒吾科技大學旅運管理系<\/h1>\n<h1>旅運管理系旅遊觀光實務組<\/h1>\n<h1>旅運管理系航空服務管理組<\/h1>\n<h1>醒吾科大旅運系<\/h1>\n<h1>醒吾科技大學旅運系<\/h1>\n<h1>醒吾科技大學<\/h1>\n<h1>醒吾旅運<\/h1>\n<h1>四技日間部職場保證班<\/h1>\n<h1>四技進修部<\/h1>\n<h1>導遊領隊免費輔導課程<\/h1>\n<h1>國家考試<\/h1>\n<h1>英語領隊<\/h1>\n<h1>華語領隊<\/h1>\n<h1>華語導遊<\/h1>"}, {"id": "f1747064296", "date": "2025-05-12", "title": "2025.0512", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.0512 海岸村的日出日落 一直以來都覺得自己會是一個在鄉下生活的人，兒時的記憶與學習時的喜好科目，都指向這樣的生命模式，連國中畢業考上師大附中時也是希望自己未來可以考進", "len": 491, "body": "<p>2025.0512<\/p>\n<p>海岸村的日出日落<\/p>\n<p>一直以來都覺得自己會是一個在鄉下生活的人，兒時的記憶與學習時的喜好科目，都指向這樣的生命模式，連國中畢業考上師大附中時也是希望自己未來可以考進森林或動物系之類的科系，但不知道為什麼選組也錯失了，考試也放掉了，在很多的選擇下會不自主地走到一個連自己都難以想象的境地，回想起來，這真的是在選擇的當下沒有好好地檢視自己，並謹慎考量的結果。<\/p>\n<p>當然，在鄉下的社會中是永遠不會碰見像井上真央那樣如女神般的存在，影片有她才呈現地出美好，別被浪漫給沖昏以為現實也這般。影片很唯美，但現實的自己慢慢地也能分辨出事實與演戲的距離，但有些不錯的場景與對白可以讓自己多想點事。<\/p>\n<p>如「芋煮會」一幕有些過頭了，但用城市與鄉村、主角與配角、現實與期待的差距感來表達；再加上用食物與分享將人與人之間的關係拉起來，導引出人與人的溝通與告白，期待不是用想象的，也不是用推斷的，而是將自己的心與話語說出來，很誠實地面對自己與別人之間的關係。<\/p>\n<p>最後仍想提醒自己，人就來這麼一回，選擇自己喜歡的環境與人來相處才是最重要的，當然好好地品嘗環境中的空氣、食物、陽光帶來的五感才是身而為人最重要的使命。<\/p>"}, {"id": "f1746709811", "date": "2025-05-08", "title": "中午漫步去校園外吃牛肉湯餃，某種曾經期待且體驗的輕鬆浪漫…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.5.8 中午漫步去校園外吃牛肉湯餃，某種曾經期待且體驗的輕鬆浪漫感動回到了身體之中，我又可以感覺到快樂與夢想了。 本來就很喜歡幻想與作夢的我，總是期待著生命中除了現實之外", "len": 342, "body": "<p>2025.5.8<\/p>\n<p>中午漫步去校園外吃牛肉湯餃，某種曾經期待且體驗的輕鬆浪漫感動回到了身體之中，我又可以感覺到快樂與夢想了。<\/p>\n<p>本來就很喜歡幻想與作夢的我，總是期待著生命中除了現實之外，要有不同的觀感來對應這個無情的世界；例如只是個午餐的活動，為何就是填飽肚子而己，以前的我會想像著在平靜愉快的心情中，呼吸著和煦的空氣，看著步道旁的花草一步一步地踏向食堂，點一份能讓自己味覺與五感都滿足的美食，想像著事事美好，日日平靜。<\/p>\n<p>的確，世界不是這個樣子的，但我總有幻想的權利吧，為什麼要將這樣的能力從我身上奪走，強迫我要時刻面對現實，我不喜更不願，所以我要練習，練習將這樣的能力再度回到自己身上，堅固地留在靈魂之中；因為這樣，我也能愛自己、喜歡周遭的環境與人、重新地愛戀這個世界，快樂地走向人生的終點。<\/p>"}, {"id": "f1746626301", "date": "2025-05-07", "title": "在學校上課總要設計一些活動來體驗旅遊中需要指導的實境遊戲…", "cat": "遊戲學習", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.5.7 在學校上課總要設計一些活動來體驗旅遊中需要指導的實境遊戲，其實過程很累人，因為在教室中以書面或影片解說時，學生們真正專心在了解的不多，將大家請出教室門，要求體驗活", "len": 336, "body": "<p>2025.5.7<\/p>\n<p>在學校上課總要設計一些活動來體驗旅遊中需要指導的實境遊戲，其實過程很累人，因為在教室中以書面或影片解說時，學生們
