翻，但是想想自己曾經歷的算命經驗，我真心覺得如果你現在對未來很迷惑，不太了解自己的長處或短處，不太知道要努力什麼，也許先為自己在網站上排個命盤，先用一個下午看看這本由一位台大數學系轉行命理資訊界的成功自傳，或許你會對自己有所發現。<\/p>"}, {"id": "01e21eba", "date": "2024-04-30", "title": "駱老闆的005旅行社", "cat": "旅行郵輪", "src": "方格子", "url": "https://vocus.cc/article/66310331fd89780001e21eba", "ex": "母校輔仁大學是台北縣新莊市中正路510號，是台1線南北向的縱貫路，所以從門牌來看，學校是位於台1線的東面，以此類推。 1992年，大一升大二的那一年暑假，我投入人生第一份有勞保的正", "len": 1271, "body": "<p>母校輔仁大學是台北縣新莊市中正路510號，是台1線南北向的縱貫路，所以從門牌來看，學校是位於台1線的東面，以此類推。<\/p><p>1992年，大一升大二的那一年暑假，我投入人生第一份有勞保的正式工作-大亞旅行社；從現在當技職學生的角度來看，算是暑期實習可以有3學分，但是我那時只是打工賺錢，這份工作並沒有在暑假結束後停止，輔大社會的功課學習我不是很認真面對，加上工作性質主要是四處騎車送件，總可以兼一點外快。<\/p><p>大亞旅行社那是一家位於民生東路與中山北路交界間許多12樓同高的華廈大樓之中的其中一家老舊旅行社，登記字號005，走進公司一進門就是沙發接待區，一眼望去有四五張桌子，除了駱老闆有一間小隔間之外，就只有會計另外有房間，其他的同業同事就坐在面對面的桌子前工作連繫著好像是各地的出團事宜，公司內是可以抽煙的，駱老闆及幾位同事會抽煙，所以印象中公司總是煙霧迷漫味道不佳，再加上頭上幾盞光線不足積滿塵垢的日光燈，整個公司就像底片一樣有著泛黃過時的氣息。<\/p><p>我是公司新來的外務小弟，也是公司中唯一的大學生，主要工作內容不外乎收件、送件，一早進公司就是了解要去那收件，以客戶的簽證所需資料為主，中午前將所有客戶資料及費用收進公司交給OP姊姊，就可以去休息準備下午將整理好的資料送件至各簽證處。下午的安排流程比較固定，最大宗的簽證資料先送濟南路的日本交流協會，可能其中再收幾個客戶件，再騎往敦化北路的泰國航空辦理泰簽，還有現在想不太起來地點的馬來西亞簽證，這樣我肩包中的資料就會少許多。之後回到公司之後就可以聊天整理安排明天的路程，工作內容很輕鬆，而且多數時間我都在路上，在沒有手機的時代中，這是個自在自在的工作。<\/p><p>若有在台北都會區內送過快遞的朋友，應該就會知道「東南雙號、西北單號」的口訣是什麼。世界通行的城市門牌號碼安排，會將單雙數分列於街道兩旁，所以街道同側的樓房建築物都是用單號或雙號來做為跳號的順序，這樣我們這些外務送件的小弟就可以用號碼的多寡來粗略地了解目的地的距離，不用太辛苦地在騎車時除了注意可怕的台北交通之外，還要注意收送件地點的門牌號碼。<\/p><p>現在的台北市很多的大馬路都有公車專用道及捷運，整體的交通與市容都整齊許多。過往我最不喜歡騎車送件就是南京東路一至五段，從衣蝶百貨、永琦百貨、先施百貨到環亞百貨之間，幾乎所有的合作公司都選在南京東路沿線，路邊暫停的公車、貨車、小客車及機車更是無章法的競道與爭停。我可憐豪邁小白125就陪著我渡過近二年的外送生涯，伴著我走過台北縣市的大街小巷，後來就常常噴白煙吃機油。<\/p><p>現在想想當時用自己的摩托車來當公務送件，奔波台北縣市各地只賺那每月一萬多的收入，加上身處車陣的風險與疲累；三十年前的大學並不好考，考取後卻未花下時間確認職涯、取得證照、專業學習或公職或研究所升學考試，反而為了當下的微薄薪水虛擲了年輕的腦力與體力非常不值。從社會學的階級流動的觀點來看，其實這就是階級上的固著性，當下以為安穩平凡，其實卻身處風險之中不自知。因為這樣的無知，發生過幾件有趣的事，現在反思想來，當時的我放在現在還真的可能成了社會新聞。<\/p><p>待續…<\/p>"}, {"id": "f1714195429", "date": "2024-04-27", "title": "昨天在大雨中上世界觀光地理課程時，向學生分享泰國等南亞各…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "昨天在大雨中上世界觀光地理課程時，向學生分享泰國等南亞各國在四月中下旬正面臨著前所未有的高溫。 我知道我只能向數十人盡量地說明氣候變遷對觀光活動及各種產業的影響，也提醒在吹著冷氣的", "len": 296, "body": "<p>昨天在大雨中上世界觀光地理課程時，向學生分享泰國等南亞各國在四月中下旬正面臨著前所未有的高溫。<\/p>\n<p>我知道我只能向數十人盡量地說明氣候變遷對觀光活動及各種產業的影響，也提醒在吹著冷氣的同學們，在南亞很多地區的學校是沒有任何空調，政府及學校單位也是沒什麼準備要如何對應高溫環境的學習。<\/p>\n<p>我期待低著頭正在看著「淚之女王」金秀賢帥氣冬裝的學生們，可以將他們對周邊的關心從劇情回到現實。但我知道很難。<\/p>\n<p><a href=\"https://www.channelnewsasia.com/asia/extreme-heat-southeast-asia-thailand-philippines-bangladesh-4288991\">https://www.channelnewsasia.com/asia/extreme-heat-southeast-asia-thailand-philippines-bangladesh-4288991<\/a><\/p>"}, {"id": "f1713759926", "date": "2024-04-22", "title": "【113學年度 科技大學及技術學院入學方式】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【113學年度 科技大學及技術學院入學方式】 一早收到科技大學招策會的PDF共五十幾頁，公開放在FB中供參。 113學年技專校院統一入學測驗(有點像我們以前的五專聯招)將於下週六日", "len": 573, "body": "<p>【113學年度 科技大學及技術學院入學方式】<\/p>\n<p>一早收到科技大學招策會的PDF共五十幾頁，公開放在FB中供參。<\/p>\n<p>113學年技專校院統一入學測驗(有點像我們以前的五專聯招)將於下週六日登場，周邊很多學生要考試二天，請大家為他們加油。<\/p>\n<p>根據財團法人技專校院入學測驗中心基金會資料顯示：<\/p>\n<p>今年113年報考統測技高生有 69,361人報名，比112學年少4620人，<\/p>\n<p>考生一年比一年少，四技科大一共提供了55,886的入學名額，而且國立科大有13,983位名額，也就是說上述考生將有二成的比例會上國立學校，其中與醒吾旅運有關的17餐旅群，今年的考生人數是9127人(去年是10411人)，年減一成的學生數。<\/p>\n<p>如果你有看到這兒，也請為我們私立科技大學招生老師加油。<\/p>\n<p>資料來源：(放留言區可下載)<\/p>\n<p>技專校院招生策略委員會(招策會)<\/p>\n<p>技專校院總量管制小組<\/p>\n<p>財團法人技專校院入學測驗中心基金會<\/p>\n<h1>學習歷程不想提<\/h1>\n<h1>技高生用紙筆考試學習動機不想提<\/h1>\n<h1>技高生面對多元入學無所適從不想提<\/h1>\n<h1>技高生只想好好學技能工作<\/h1>\n<h1>技高生下課時間常去打工<\/h1>\n<h1>技高生學貸比例很高<\/h1>\n<h1>時薪183寫不進學習歷程<\/h1>\n<h1>工作時間寫不進多元表現<\/h1>\n<p>有以上困擾者，請私訊，理由如下<\/p>\n<h1>醒吾旅運<\/h1>\n<h1>空服旅遊實習就業導向的實踐者<\/h1>\n<h1>醒吾科技大學旅運管理系<\/h1>\n<h1>旅運管理系旅遊觀光實務組<\/h1>\n<h1>旅運管理系航空服務管理組<\/h1>\n<h1>觀光餐旅專業證照輔導<\/h1>\n<h1>訂位系統證照<\/h1>\n<h1>多益輔導<\/h1>\n<h1>旅行業實習<\/h1>\n<h1>航勤業實習<\/h1>\n<h1>海外服務業實習<\/h1>"}, {"id": "f1713018582", "date": "2024-04-13", "title": "大甲媽朝聖之路-文筆手篇", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "大甲媽朝聖之路-文筆手篇 剛開學時曾在研究室聽到鄰座老師提起，暑假與家人體驗西班牙朝聖之路，心中好生羨慕。當天在日記上寫下：今年一定要再跟著大甲媽去徒步，但忙碌又快轉的日子之中那可", "len": 783, "body": "<p>大甲媽朝聖之路-文筆手篇<\/p>\n<p>剛開學時曾在研究室聽到鄰座老師提起，暑假與家人體驗西班牙朝聖之路，心中好生羨慕。當天在日記上寫下：今年一定要再跟著大甲媽去徒步，但忙碌又快轉的日子之中那可能再排出時間呢？<\/p>\n<p>人有心媽祖就有保庇。<\/p>\n<p>前幾天突然接到週末一早要去台中靜宜大學開中華觀光管理學會會員大會的通知，立馬安排時間，其實週五晚上快23點才回到家，一早就開車回台中。中午會議結束後聽聞與會教授聊起：大甲媽＂今天＂就要從海線回鑾，可以就近去看看喔。<\/p>\n<p>一聽大喜，再查大甲媽定位，鑾尊正由龍井北上將經過沙鹿到清水。用餐完後立馬安排前往迎駕，因為五年前曾見過那驚人的信眾人潮，所以先找了沙鹿車站附近的沙田停車場停好車，決定先機行事；在開心之餘，靜宜的教授又再度傳授，要我一定要去找３６執士，還問我有沒有帶筆，孩子不是正好在考大學。大甲媽祖儀杖隊三十六執士由12面彩牌與24支兵器組成，而文筆手就是24支兵器之一。據說觸碰文筆手可以庇佑金榜題名學業進步。<\/p>\n<p>當然有，今天是來開會的那會不帶筆，我還帶了筆袋呢。<\/p>\n<p>我開著車首次駛入沙鹿小鎮，心中非常感動，五年前走過彰化段後因為疫情，更因為家事很難排出時間，年初時有看到系上實習合作的旅行社有安排單日的專車接送行腳，心中也曾動念安排，但總是動念沒動靜，日子也就一天一天地沒意識地過著。<\/p>\n<p>沿著海線縱貫路，隨著不絕的人龍，我靜靜地獨自反向往南走，看著排隊要鑽轎底的每位信眾，想起阿嬤曾說過她也有陪大甲媽走過這段路，不知道當年的她有沒有去鑽轎底呢？如果有，她一定也是在祀求家人平安健康吧。<\/p>\n<p>我的筆袋在文筆手的加持後，隨著３６執士走了好長一段路。我曬著不太熱的台中陽光，感受著從山海間吹拂過的涼風，想著我的任務、我的祀求及上天給我的福份，那麼多的巧合讓我又回到了朝拜的路上，不同的時間、同樣的空間之中我和阿嬤都曾親身體驗媽祖繞境神蹟，感受慈愛護佑眾生的朝聖路帶來的感動。<\/p>"}, {"id": "f1712796598", "date": "2024-04-11", "title": "感念好友-崔震雄教授", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "感念好友-崔震雄教授 如果問我什麼是道地的餐旅人？就是凡事為他人著想的人。 擔任2007年花蓮台灣觀光學院港澳參訪團的連繫與承辦，讓我有緣認識了當年在澳門念博士班的崔震雄老師；我隨", "len": 445, "body": "<p>感念好友-崔震雄教授<\/p>\n<p>如果問我什麼是道地的餐旅人？就是凡事為他人著想的人。<\/p>\n<p>擔任2007年花蓮台灣觀光學院港澳參訪團的連繫與承辦，讓我有緣認識了當年在澳門念博士班的崔震雄老師；我隨著李校長領團的參訪團一到澳門，我一直連繫的窗口崔老師就已到剛開幕的威尼斯人大廳與大家碰面。<\/p>\n<p>崔老師一遇見我就先將我叫到一旁，拿了一支澳門門號的手機給我說：這幾天有需要連繫就用這隻手機，可以直接連繫他，不用擔心後續活動，他已經協調安排各單位。<\/p>\n<p>後續我們一路參訪了澳門剛開幕的威尼斯人酒店、澳門科技大學、澳門旅遊學院、世界遺產區域等等，都在平順且開心的過程中走完參訪流程。當然手機我沒打出去過，但那小小的連繫為我這個承辦人解除了多少的壓力是很難用言語來說明的。<\/p>\n<p>後來，我們有幸在花蓮觀光學院餐旅管理系成為同事，他甚至接手了我轉職至醒吾後的導師班學生，用更多的愛心與耐心在培育觀光餐旅產業的新一代職人，也因為這些緣份及有著同樣理念與觀點的餐旅人格，常常在網路上連繫道安祝福。<\/p>\n<p>此時此刻，感念崔老師，功德圓滿，離苦得樂，阿彌陀佛！<\/p>"}, {"id": "f1712197631", "date": "2024-04-04", "title": "20240403花蓮地震", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "20240403花蓮地震 常有朋友問起我們一家在花蓮八年生活的日子，我常回：那是上天對我們一家的祝福，讓我們在花蓮有工作、有個養育孩子的家。 這一切要謝謝當年引薦我到花蓮擔任教師的", "len": 355, "body": "<p>20240403花蓮地震<\/p>\n<p>常有朋友問起我們一家在花蓮八年生活的日子，我常回：那是上天對我們一家的祝福，讓我們在花蓮有工作、有個養育孩子的家。<\/p>\n<p>這一切要謝謝當年引薦我到花蓮擔任教師的同窗至友 Alumi Lu，而後來更是認識了非常多照顧我們一家的同事、老師、好友、學生，因此這樣的緣份讓我們豐厚人生，生命豐足美好。<\/p>\n<p>也因為這樣的緣份，這塊土地上的傷，就與我們相連，尤其是這幾年回到了台北工作，時不時地總是想起花蓮的生活，每每夜深難眠之時，我仍會隱約地想像那縱谷中平靜恬適的空氣感，假裝窗外仍是滿天的星空與間歇的蟲鳴，那山那水那些人是我平靜身心的依靠。<\/p>\n<p>我不敢看蘇花公路上的落石影片，也不敢正視每一間受傷的房屋與人們，更不忍直視小狗子與狗子媽媽的母校東華的火災；因為沒能同在深感不安。<\/p>\n<p>我深深地祈禱祝念，祈盼受傷的花蓮慢慢復原。<\/p>"}, {"id": "f1711120327", "date": "2024-03-22", "title": "你有郵輪工作的夢想嗎？", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "你有郵輪工作的夢想嗎？ 許多人好奇的郵輪服務人員面試終於要來了，由吳繼文教授努力爭取的郵輪實習工作機會。名勝世界郵輪公司將在2024/3/29下周五先做工作的介紹，大家有一個QA時", "len": 292, "body": "<p>你有郵輪工作的夢想嗎？<\/p>\n<p>許多人好奇的郵輪服務人員面試終於要來了，由吳繼文教授努力爭取的郵輪實習工作機會。名勝世界郵輪公司將在2024/3/29下周五先做工作的介紹，大家有一個QA時間，然後安排三月及四月的線上面試。<\/p>\n<p>面試時間：登入連結有詳細資訊(留言區)<\/p>\n<p>面試方式：線上面試<\/p>\n<p>面試對象：畢業校友、應屆畢業生&amp;即將實習者。<\/p>\n<p>注意：即使是還沒有受訓或拿到船員手冊，但有意今年前往郵輪工作者仍可報名，面試後將通知下期訓練開課資訊。<\/p>\n<p>正職招募就是徵求大四生以及各位畢業生的意願如果你已畢業已在就業中，倘若仍想上郵輪工作，或是有朋友有意願，機會難得，擴大參與，歡迎參加給自己一個圓夢的機會。<\/p>\n<h1>歡迎分享<\/h1>\n<h1>留言報名<\/h1>"}, {"id": "f1710683116", "date": "2024-03-17", "title": "有聽過科技校院繁星計畫嗎？", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "有聽過科技校院繁星計畫嗎？ 晚餐時突然在桌邊站了三位在地的高中生，二位技術型高中，一位普通高中，都是小狗子國小或國中同學，很有禮貌地打了招呼之後，感覺上欲言又止，師母貼心地問了一下", "len": 1090, "body": "<p>有聽過科技校院繁星計畫嗎？<\/p>\n<p>晚餐時突然在桌邊站了三位在地的高中生，二位技術型高中，一位普通高中，都是小狗子國小或國中同學，很有禮貌地打了招呼之後，感覺上欲言又止，師母貼心地問了一下有什麼事嗎？學生才支吾地道出想聽聽我們對他們升學的建議與看法。<\/p>\n<p>聊了快一個小時的晚餐時間，從他們的口中深刻地感受到現行考招制度對在學學生的困擾。此時此刻他們的任何決定，都將決定未來四年專業學習的走向，他們的心中考量著每一所學校對外對他們自己的觀點，也考量著世俗及家人的期待，更考慮著畢業後就業的前景與錢景。<\/p>\n<p>其中一位技高生校排前三，所以將採科技繁星方式推甄學校，入學管道的多元讓每位技術型高中生非常困擾，複雜的考試與管道幾乎讓老師與學生都快放棄各類的學習準備，問起學校老師是否有輔導時，回答是有，但是聽不太懂，就由老師協助安排走程序，的確，學生在近年適性揚材的職能輔導之中，技術型高中的老師肩付起不少學生在專業與職涯選擇上的責任，但如果教師對業界發展與趨勢不熟悉，也沒有實務工作經驗，就很難準確地為學生提供建議，僅以個人認知的角度及教育研習來進行輔導。<\/p>\n<p>所以在聊天中就發現學生從教師口中聽到做民意調查可以賺大錢？二日班做五休二取得文憑也是個選項？等等似是而非的觀點。<\/p>\n<p>很多學者或教育界都認為現在考招制度是一種對學生發展不得不的設計！如果老師只要求學生以學科成績為主，重學測、統測或分科考試成績就是高中老師不用心，那我覺得真的期待這些設計制度的學者來高中或高職端好好地實習一整年再回去當教授。<\/p>\n<p>以現行制度來看，無論考招制度如何變化！四十年來的大學聯考仍以變型的學測與分科存在著，如果老師與學生的前提是不想想太多，那以不變應萬變幾乎成為硬道理；但如果是想比較多的學生再搭上想幫忙的老師，那幾近於瘋狂的衍生性制度設計真的就成了一種困擾。<\/p>\n<p>如果家長與學生對於複雜的制度實在難以駕馭，學生又不太能由學校老師的身上獲得明確的回答，建議可以從三個角度來簡單看待制度。<\/p>\n<ol>\n<li>\n<p>學科能力是硬實力，大學學測及技高統測都要好好念，成績就像錢一樣，永遠不嫌多；分數比別人多，選擇就比他人多。<\/p>\n<\/li>\n<li>\n<p>學習歷程要走興趣，找出自己特質與興趣才能發展出好的學習過程，別相信坊間要花錢的解決方案。<\/p>\n<\/li>\n<li>\n<p>學系選擇要很務實，大學是否有對接知名實習企業，或職涯輔導非常完善等都是重要的選擇關鍵；名校迷戀者請確認家中什麼都不缺，就缺學歷證書。<\/p>\n<\/li>\n<\/ol>\n<h1>工商時間<\/h1>\n<p>所以，如果你是技高餐旅群可以走繁星的同學，你一定是很有想法，在校表現又非常好的同學；可以好好來看一下醒吾旅運系所提供的限量5位繁星名額，優秀如你，一定可以順利通過旅運系未來在校三年的觀光餐旅業證照規劃及明星級實習企業的招募挑戰。<\/p>"}, {"id": "f1710050936", "date": "2024-03-10", "title": "招生博覽會", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "招生博覽會 去看台大杜鵑花節系所博覽會的人是我自己，小狗子與同學們去找自己有興趣的系科來探索，未來要念那所學校或科系都仍未確定，我們也都尊重與支持。 現在的大學招生就如同旅展一樣，", "len": 1219, "body": "<p>招生博覽會<\/p>\n<p>去看台大杜鵑花節系所博覽會的人是我自己，小狗子與同學們去找自己有興趣的系科來探索，未來要念那所學校或科系都仍未確定，我們也都尊重與支持。<\/p>\n<p>現在的大學招生就如同旅展一樣，很熱鬧很多元，在台大體育館看了快二小時，非常羨慕現場來自各地的高中學生可以先在入學之前，先來看看校園與環境，而且課程都全部公開上網，系所教授的專業與教學方式也都盡量地呈現，讓有志於各項志趣的學生可以好好地思考自己的學習方向。<\/p>\n<p>走了二個小時，為了拿小禮品也問了不少問題，有一點小小感想。<\/p>\n<h1>電機醫學人潮最多<\/h1>\n<p>在週日下午時間，只看到電機系有教授蒞臨現場說明系科特色，其他的攤位有些有公告教師說明時間，大多的系所都是以學生為主要的介紹者；也許是這樣，電機系的人潮非常多，我想抽獎要回答完全看不懂方程式內容(電機系學生一直強調很基本)；但打卡也可以。<\/p>\n<p>醫學系及牙醫系因為要考二階筆試及術科實驗，我偷聽很多學生都是來問學長姐術科考試的方式(坊間補習班已經有相關課程，十堂模擬課程八萬八)，長長的人龍，一對一的詢問，看起來真的非常認真想好好了解。<\/p>\n<h1>二階準備<\/h1>\n<p>問了好幾個系的學生二階口試如何安排，不少系表示沒有口試只有筆試，工學院統一出題數學、物理、化學，內容比學測深且難，屆時通過一階三倍率的所有學生就再考一場，直接用學科成績排名。<\/p>\n<p>商學院就很重試口試內容，以資管系為例，將安排三個口試教室，有三組老師，第一關是面試英文自我介紹看口條與氣質；第二關是朗讀一份英文文獻，教授會用英文問你內容，要用英文回答；第三關是考幾題數學。<\/p>\n<h1>學習歷程<\/h1>\n<p>現在的高中生很可憐要做學習歷程，我們大家都是苦主，所以也問了在場的大學生入學是否有特別要求學習歷程內容，多數的學生也回答不出來到底重不重要。<\/p>\n<p>熱門系所如電資醫牙以學測成績進入一階，到了二階之後另有考試與術科佔重要比例，學習歷程除非很\"電\"的內容才能吸引教授的注意，否則仍是成績最重要。<\/p>\n<p>整體而言，我覺得台灣大學理工學院因為未來學習的內容仍須有高強度的數理能力，所以測相關能力來決定入學無可厚非；但人文、社會、商管、生物、地學等等就很側重學生的學習興趣與志向，學習歷程的比例應該在申請入學時會被看重內容，寫得太\"水\"或找人代打的，教授應該可以一眼看出直接踢掉。<\/p>\n<h1>課程安排<\/h1>\n<p>因為想念博士班，所以去看了幾所自己能考且有興趣的系找學生聊聊，其中某系的攤位門可羅雀，只剩學生在顧攤位；某系學生很熱情，還拿很多老師用書及教材在現場展示，<\/p>\n<p>我問：知不知道系上博班學長姐的情形。<\/p>\n<p>他很開心地說：他們有一門課都是學長姐來上課帶討論，整個學期都是學長姐來。<\/p>\n<p>我回問：那老師呢？<\/p>\n<p>學生就開心地說：老師偶爾會來看看，了解他們的學習狀況。<\/p>\n<p>我：哇，謝謝你喔，那我可以拿你們的小禮物嗎？<\/p>\n<p>學生：當然可以。<\/p>\n<p>我：）<\/p>\n<h1>小結<\/h1>\n<p>建議各位家長或學生想念什麼系科，一定要去看看那所學校與系所，與學長姐聊聊看看他們自己喜不喜歡自己所學，也可以找老師問問，看看你找不找得到老師；千萬別用坊間的系統成績與排名來決定你的未來，真的。<\/p>"}, {"id": "f1709346161", "date": "2024-03-02", "title": "2024大學學測落點分析工具懶人包", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024大學學測落點分析工具懶人包 🎯億全企業社 https://www.com.tw/p.html 🎯得勝者文教落點系統 https://www.xn--kbry83cgjudu", "len": 510, "body": "<p>2024大學學測落點分析工具懶人包<\/p>\n<p>🎯億全企業社 <a href=\"https://www.com.tw/p.html\">https://www.com.tw/p.html<\/a><\/p>\n<p>🎯得勝者文教落點系統 <a href=\"https://www.xn--kbry83cgjudux.tw/\">https://www.xn--kbry83cgjudux.tw/<\/a><\/p>\n<p>🎯104銀行 <a href=\"https://student.104.com.tw/hs/\">https://student.104.com.tw/hs/<\/a><\/p>\n<p>🎯1111人力銀行落點分析 <a href=\"https://hs.1111.com.tw/\">https://hs.1111.com.tw/<\/a><\/p>\n<p>🎯甄戰Ai落點 <a href=\"https://www.reallygood.com.tw/forecast/index\">https://www.reallygood.com.tw/forecast/index<\/a><\/p>\n<p>🎯樂學網 <a href=\"https://exam.347.com.tw/apply/#use-area\">https://exam.347.com.tw/apply/#use-area<\/a><\/p>\n<p>🎯大學生甘單app <a href=\"https://apps.apple.com/us/app/id786897895\">https://apps.apple.com/us/app/id786897895<\/a><\/p>\n<p>📌大學甄選入學委員會(官方版) <a href=\"https://www.cac.edu.tw/apply113/system/ColQry_vforStu113apply_GF84ad9zx/QrybyStuTGrd3.htm\">https://www.cac.edu.tw/apply113/system/ColQry_vforStu113apply_GF84ad9zx/QrybyStuTGrd3.htm<\/a><\/p>\n<p>📌四技日間部申請入學聯合招生(官方版招收高中生)<\/p>\n<p><a href=\"https://techexpo.moe.edu.tw/search/profile_classes.php?comid=comc04&amp;cid=216\">https://techexpo.moe.edu.tw/search/profile_classes.php?comid=comc04&amp;cid=216<\/a><\/p>"}, {"id": "f1708953593", "date": "2024-02-26", "title": "旅行業實習生", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "旅行業實習生 附圖是在旅行業實習已經進入第八個月的學生群像及一個旅行業作業失誤的輔導歷程。 在112學年度期間醒吾旅運有十二位學生分別在可樂、五福及行家等三家台灣知名綜合旅行社實習", "len": 788, "body": "<p>旅行業實習生<\/p>\n<p>附圖是在旅行業實習已經進入第八個月的學生群像及一個旅行業作業失誤的輔導歷程。<\/p>\n<p>在112學年度期間醒吾旅運有十二位學生分別在可樂、五福及行家等三家台灣知名綜合旅行社實習；工作內容依學生個人特質與興趣，分別在郵輪、國旅、企旅、日本、海島等線擔任業務、行政及產品OP助理等工作。<\/p>\n<p>從去年的七月至今，照片裡學生看起來更沉穩及成熟，照片之後的心中我與學生之間回想這過程更是百感交集，這八個月並不是個平靜無波的過程，所有學生經歷了新進訓練、業務推廣、績效考核、人員更迭、職務代理、專案任務等工作；體會了職場中的公平與不公平，人與人互動的合宜與不合宜；當然更少不了面對各類的失誤、顧客要求、服務互動等大大小小的風險。<\/p>\n<p>附件的LINE例子就是我們在進行旅行業實習時，學生於年前真實發生的業務小失誤，對於剛入行的他們來說，旅行業主管的輔導與支持，以及學校與單位的互信與互動過程，都是達成實習學生這一年能否蛻變的關鍵。<\/p>\n<p>我也是在輔導當下才發現我對旅行責任保險的認知沒有UPDATE，大家有看出來留言內容的錯誤之處嗎？而且今天看到在奈良的日本團事件更讓我想起此事，除了開心學生已經比我更熟悉現行規定，我想學生自己看到新聞事件一定與我一樣覺得這個團為客人保得太少，雖然沒有違規，但在行規上有點說不過去喔。<\/p>\n<p>實習制度的建立是三方共同的付出與努力才能成就的。有系教師共同付出耐心細心的合作輔導；有提供實習機會的可樂、五福及行家旅行社主管幹部；更有願意接受選修挑戰面對成長的可愛可敬學生。<\/p>\n<p>今日我從實習生的自信臉龐，與偷聽到他們彼意討論考量留任的細語中，聽出你們的行業專業與個人成長。在此向諸位實習生老鳥們大聲拜託，下屆菜鳥將要到任，請多多照顧喔。<\/p>\n<h1>實習就業導向的實踐者<\/h1>\n<p>🚄🚞🚢🚌✈️<\/p>\n<h1>醒吾科技大學旅運管理系<\/h1>\n<h1>旅運管理系旅遊觀光實務組<\/h1>\n<h1>旅運管理系航空服務管理組<\/h1>\n<h1>醒吾科大旅運系<\/h1>\n<h1>醒吾科技大學旅運系<\/h1>\n<h1>醒吾科技大學<\/h1>\n<h1>醒吾旅運<\/h1>\n<h1>醒吾<\/h1>"}, {"id": "f1708504174", "date": "2024-02-21", "title": "好山好水好無聊", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好山好水好無聊 花蓮只剩下二所大學，其一是國立東華大學，而且學生數只有10350人(112學年)，這包括了多年前被合併的國立花蓮教育大學。其二是慈濟大學，因為慈濟科技大學也將從11", "len": 461, "body": "<p>好山好水好無聊<\/p>\n<p>花蓮只剩下二所大學，其一是國立東華大學，而且學生數只有10350人(112學年)，這包括了多年前被合併的國立花蓮教育大學。其二是慈濟大學，因為慈濟科技大學也將從113學年度起與慈大合併。<\/p>\n<p>其實以台灣東部地區的人口與規模，一公一私大學存留在花蓮是合理的，留存的大學有研究型也有實務型的，這是個良性的結果。<\/p>\n<p>在花蓮住過八年，其實偏鄉有自己的生活步調，換言之也有自己的特殊性，大學的存在就要與當地環境與住民相關，大學城也好，地方大學也好；再加上現代學習網路課程根本沒有區域性，若頂大或頂科大開放線上學位及課程，供有志學生學習修課獲得同等學位，其實連校園都不一定是必要的。<\/p>\n<p>當年去花蓮是為了育兒，很開心在小孩0-8歲的成長過程中，沒有被強迫學寫字、算數、學才藝，在東華大學附設實驗幼稚園中的老師，就是用各種有趣又生活的方式帶著孩子成長，從玩樂中學習，成天就是在草地與原野中遊戲，在同學的互動中學習社群生活。<\/p>\n<p>那真是一段如此美好的過程與經驗，擁有回憶非常幸福。雖然我們不是信徒，但真心感覺神與我們同在。<\/p>\n<h1>以馬內利Emmanuel<\/h1>"}, {"id": "f1707806464", "date": "2024-02-13", "title": "113大學申請入學遊憩運動學群落點", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "113大學申請入學遊憩運動學群落點 近期寄來家中的信函，上面寫著極珍貴資訊請小心拆閱。打開一看原來是台北儒林的大學申請落點分析，截圖附上遊憩運動學群相關大學科系的學測錄取標準，不知", "len": 873, "body": "<p>113大學申請入學遊憩運動學群落點<\/p>\n<p>近期寄來家中的信函，上面寫著極珍貴資訊請小心拆閱。打開一看原來是台北儒林的大學申請落點分析，截圖附上遊憩運動學群相關大學科系的學測錄取標準，不知道大家看不看得明白呢？<\/p>\n<p>１要看得懂【頂】【前】【均】【後】【底】是什麼意思<\/p>\n<p>２篩選倍率如何算<\/p>\n<p>３學測考國文、英文、數A、數B、自然(物理化學生物地科)、社會(公民歷史地理)六科，但是那是假的，其實是考整整十一科<\/p>\n<p>４英聽是雞肋不用管<\/p>\n<p>————以下請對著圖表來看—————<\/p>\n<p>找一所想念的科系，例如台大國際運動學士學程，高中申請名額是５名，是本學群取檢定科目最多的系，分別是國英數B及社會四科；所以想申請台大運動學士的學生國文要考進52.3分、英文43分、社會62.3分及數B均標，先用國文倍率篩選8倍人數，也就是40位同學，這40位同學之中，再用英文的5倍找出英文前25名的同學，就有機會進入學測二階書審面試。<\/p>\n<p>但大多數的群內系科都只取一科，只有台大比較在意，不用擔心。<\/p>\n<p>補充介紹一下高中學測對應大學申請入學是【頂】【前】【均】【後】【底】，此五級是以12.5%為分級，分別為頂標是前12.5%的考生，均標是分數落在50%的考生，而底標是後12.5%的考生。<\/p>\n<p>在此換算為分數說明各檢定級在112年學測分數代表是多少：<\/p>\n<p>國文滿分100分 (常識50分、作文50分)<\/p>\n<p>【頂62.7分】【前57.5分】【均52.3分】【後41.8分】【底36.6分】<\/p>\n<p>英文滿分100分 (選擇填充72分、翻譯作文28分)<\/p>\n<p>【頂73.5分】【前61.5分】【均43分】【後25分】【底18.5分】<\/p>\n<p>社會滿分144分 (公民、地理、歷史)<\/p>\n<p>【頂86.3分】【前78.5分】【均62.3分】【後54.9分】【底39.3分】<\/p>\n<p>好了，寫到這兒我也昏了，反正結論如下：<\/p>\n<p>１想考運動遊憩學群的考生壓力不大只要有一科底標就有大學念<\/p>\n<p>２英文底標18.5分，全猜ＣＤ應該就達標。<\/p>\n<p>３高中學測考那麼多科其實只有頂大系所在乎<\/p>\n<p>４高中期間做要快死的多元選修與學習歷程在那裡呢<\/p>\n<p>以上是高中生拔拔在碎念......<\/p>\n<p>圖片資料來源：節錄台北儒林落點分析關鍵數據(遊憩運動學群)<\/p>"}, {"id": "f1707647211", "date": "2024-02-11", "title": "連續跑步152週表示這隻Apple Watch (AW)…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "連續跑步152週表示這隻Apple Watch (AW)快3年，去年曾經整理心得，一年過去有不少新的體會： 1.這三年之中對於AW是否可以戴來跑全馬一直是一個疑問，去年參加長榮馬之", "len": 460, "body": "<p>連續跑步152週表示這隻Apple Watch (AW)快3年，去年曾經整理心得，一年過去有不少新的體會：<\/p>\n<p>1.這三年之中對於AW是否可以戴來跑全馬一直是一個疑問，去年參加長榮馬之後真的覺得以我的速度來說，AW跑馬是不行的。因為到最後除了擔心自己沒體力跑完之外，長時間的GPS計時同步讓載AW的自己出現電力焦慮，更不用說沿路被回收的擔心與補給站缺東缺西，後來連水都沒有的多重焦慮之下，如果今年要再挑戰要另覓方案。<\/p>\n<p>2.過往常在意AW可否同步Podcast及藍牙耳機的問題，現在反而跑步時什麼東西都不想聽，所以我的骨傳耳機及同步的問題全都沒了。<\/p>\n<p>3.AW是可以當Apple Pay離線信用卡付費很方便，但是換手機之後一直無法同步不能離線付款，至今仍是個困擾。<\/p>\n<p>4.AW可以隨時看心率及健康指標。這部分仍非常推薦。<\/p>\n<p>5.電池只能用一天就要充電，出遠門很麻煩要帶充電線，疫情後的第一次出國後來是戴最原始的精工機械表出門；更不用說參加多益及重要考試時更是不能戴電子用品，考試時手腕空空的會很沒有安全感。<\/p>\n<p>6.最大缺點仍是AW錶太貴，時間是無價的。<\/p>"}, {"id": "f1707278038", "date": "2024-02-07", "title": "人呀。要在50歲之後，慢慢培養不用找人聊天，不用一直煩人…", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "人呀。要在50歲之後，慢慢培養不用找人聊天，不用一直煩人連繫，又可以自得其樂的好習慣，我已經開始了喔！ 第一個習慣是：自言自語 感謝疫情線上教學訓練，只要整理好教案多看點資料，就可", "len": 439, "body": "<p>人呀。要在50歲之後，慢慢培養不用找人聊天，不用一直煩人連繫，又可以自得其樂的好習慣，我已經開始了喔！<\/p>\n<p>第一個習慣是：自言自語<\/p>\n<p>感謝疫情線上教學訓練，只要整理好教案多看點資料，就可以自言自語說上2節課，還能自得其樂地說故事與講笑話給自己聽。其實疫情後的教室也差不多情形，很有趣。<\/p>\n<p>第二個習慣是：看圖書館免費的書<\/p>\n<p>書中有好多故事都是工作忙碌時沒機會看的，看到眼睛都酸了，手也拿書拿到酸了。<\/p>\n<p>第三個習慣是：每天去跑三公里。<\/p>\n<p>前幾天一位喜好馬拉松的教授在跑馬時因為突發事件登出了，我也希望有一天是這樣走的，不用躺在家中，不讓家人看到醜狀，更因為常跑，人會一直看起來很有精神，不會生病。<\/p>\n<p>直到登出。<\/p>\n<p>第四個習慣是：學新的語言。<\/p>\n<p>我開始學印尼語了，因為我發現有太多老人被印尼妹妹推著走，妹妹一直在用網路聊天，老人都聽不懂越來越癡呆，我一定要快點學起來，這樣才能偷聽他們在聊什麼。<\/p>\n<p>第五個習慣是：手寫日記<\/p>\n<p>如果每天都是最後一天，日記就是遺書，我就是用這樣的心情在記錄每天的。<\/p>\n<p>未來想養成的習慣<\/p>\n<p>架網站、學水電、寫旅誌<\/p>"}, {"id": "f1704516904", "date": "2024-01-06", "title": "高中學測人數<大學招生人數", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "高中學測人數<大學招生人數 民國113年學科能力測驗將於1月20日至22日舉行，估計約只有12萬名考生報名，而109年的台灣各級大學(不含技職科大)開出的大學生名額是17.4萬人，", "len": 666, "body": "<p>高中學測人數&lt;大學招生人數<\/p>\n<p>民國113年學科能力測驗將於1月20日至22日舉行，估計約只有12萬名考生報名，而109年的台灣各級大學(不含技職科大)開出的大學生名額是17.4萬人，教育部統計資料(如附圖)公布較慢，但應該是差不了多少。<\/p>\n<p>以下為考生家長碎碎念，不喜勿入。<\/p>\n<h1>考科時間比例與比重不合理<\/h1>\n<p>高中學測考試科目包括國文(180分鐘)、英文(100分鐘)、數學A(100分鐘)、數學B(100分鐘)、社會(110分鐘)、自然(110分鐘)共6科。在考試時間上國文佔比二節課，甚者，高中學測國文考試還分２科考，【國語文綜合能力】及【國語文寫作能力】各考90分鐘。<\/p>\n<p>國語文綜合能力測驗出題量驚人，可達14頁滿滿題目，其中單選題每題2分共25題，多選題每題4分共7題，混合題中有單選題2分計2題，短文每題4分寫4篇，題目變化多端且與課綱內容幾乎沒有重覆。<\/p>\n<p>國語文寫作能力測驗共有兩大題，每題25分。第一大題分為2小題，以論說文為主；第二大題則在測驗考生情意感受抒發能力，要考生在90分鐘內寫出3篇文章。<\/p>\n<h1>國文老師對不起<\/h1>\n<p>請高中國文老師別再要求什麼重要文章要加入課程，因為對未來國力、對教育沒有任何意義。反而我覺得非常重要的STEM的自然科110分鐘內考物理、化學、生物與地球科學四科至關重要的基礎能力試題，在考試時間比例上非常不合理。對一個科技發展如此重要的台灣，國文考試被頂大優質學系放棄採分，就表示國文科在高中教學供給端與社會專業需求端完全失衡。<\/p>\n<p>我非常喜歡閱讀與寫作，但我幾乎不記得國高中時讀了什麼國文考了什麼，也忘了作文在短短幾十分鐘內陳述了什麼。<\/p>"}, {"id": "f1704297365", "date": "2024-01-03", "title": "往事悠悠物換星移", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "往事悠悠物換星移 開年後越南外籍班同學的課程也近尾聲，用了一年的課程與互動慢慢地認識了全班41位來自越南各地的學生。因為曾在1995年到胡志明市農林大學進行短期學生交流參訪，所以當", "len": 734, "body": "<p>往事悠悠物換星移<\/p>\n<p>開年後越南外籍班同學的課程也近尾聲，用了一年的課程與互動慢慢地認識了全班41位來自越南各地的學生。因為曾在1995年到胡志明市農林大學進行短期學生交流參訪，所以當年我的同學應該已經是現在這群學生的父母，他們的孩子來台灣求學與他們在教室相遇非常有親切感。<\/p>\n<p>攝於胡志明農林大學的照片中是當年的越南同學，現在課堂上也有我的越南學生，出國前輔大社會系主任老闆耳提面命不要太張狂地購物顯富，因為30年前越南的生活水平與台灣有段距離；但今日越南學生付起台灣學費覺得合理，住在新北租房交通覺得可以接受。今日開會還聽聞不少私立高職已經大量引入外籍生來補充生源，學生數甚至達到近五成，成為私校老師們的衣食父母。<\/p>\n<p>醒吾越南專班同學是春季班，雖不是很清楚他們來台灣留學的管道，想必是本校國際處駐地專案招生來校，聽學生說第一個學期學費是台灣政府支助，後面的七個學期就要自費，曾經好奇地問學生在越南的大學學費，學生說與在台灣學費差不多，一學期也要4-5萬台幣，所以來台灣留學是個經濟又CP值高的選擇。<\/p>\n<p>這班學生整整四年與台灣大學生一樣，上課時參加校內課程活動，下課後也與台灣同學一樣去打工；放假時可以自在地在台灣旅行，沒有全員管理，更沒有工廠集體工作，透過學生們的IG或FB更可以看到他們在台灣各地旅遊美食的記錄，好生羨慕。學生談不上都很用功，也是手機不離手，一身行頭都是網購來的，流行的鞋衣更不缺，聽說他們有自己的管道，會比台灣通路便宜不少。<\/p>\n<p>現在每週上課所有同學到課率很高，這幾週更是全員到齊沒有缺席，交作業考試無役不與；老師發回改好的講義時，學生是兩手接卷、眼神交接、口說感謝，甚是有禮。<\/p>\n<p>成為他們的老師是一種緣份，前幾天我在上課時問了學生想學越南語，不知道他們一小時家教收多少錢？<\/p>"}, {"id": "f1703866171", "date": "2023-12-30", "title": "荷蘭巨型自行車停車場", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "荷蘭巨型自行車停車場 昨天的世界旅遊地理課程一直想找到這個影片在課堂上說明，為何北歐的社會在人類發展指標HDI上會領先。一個社會如果是以自行車為主的交通規劃，可以設計出何種令人驚訝", "len": 669, "body": "<p>荷蘭巨型自行車停車場<\/p>\n<p>昨天的世界旅遊地理課程一直想找到這個影片在課堂上說明，為何北歐的社會在人類發展指標HDI上會領先。一個社會如果是以自行車為主的交通規劃，可以設計出何種令人驚訝讚嘆的自行車停車場。<\/p>\n<p>希望學生可以有不同的觀點，如果要移動時，我們的身體是有一雙腿的，可以走路，可以踏板上路；可以有一種移動的選擇，不要連坐電梯下樓至轉角便利店或早餐店買咖啡三明治都要騎摩托車，甚至開車併停不下車的。<\/p>\n<p>很可惜，學生的眼光沒有多少人離開他們螢幕中的小紅書、抖音或IG、FB，對他們而言，荷蘭西歐的社會與他們所擁有的追蹤虛擬社會，兩者相較，我的憂心可能多慮了。<\/p>\n<p>人類發展指數HDI是用人均所得、教育程度及平均年齡來計算，但是一個社會要如何在擁有一定的經濟能力之後，會從事與享有的工作與決定，不是以賺錢、年終獎金或採購可辨別階級的標籤消費財為目標，可能不是指數可以衡量的。<\/p>\n<p>現在的網路對價值觀的影響更為驚人，當社會中多數的成員分享的價值不是健康、教育與群我的觀點，而是享樂、財富自由與自我成長時，社會的發展早已定向。每天在北車麥O勞、全O的座位間聽了太多有關財富、人脈開發、新科技投資的耳語，再對照身旁的血淋淋例子，這真的是一種輪迴。<\/p>\n<p>多年前我也有多次被好友邀請去聽直銷或投資的說明會，聽的當時對未來迷惑與財富的迷幻感是很強烈的，在那場天母的房產說明會上，看到好多人投入了單位與金錢，整場瘋狂的金錢遊戲場域讓所有人都難以自己；後來的結果千篇一律，所有投機者血本無歸，吸金主謀走投無路，在加拿大殺了全家再自殺。<\/p>\n<p>一場遊戲一場夢。還是走路騎UBIKE去買早餐實際點…<\/p>"}, {"id": "f1703735112", "date": "2023-12-28", "title": "貼一個近期優質實習單位的要求內容：", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "貼一個近期優質實習單位的要求內容： 申請資格：請參閱附件。 另說明如下： (一) 在校期間各學業成績平均 70分(含)以上、操行成績平均 80分(含)以上，無記過紀錄。 (二) 熟", "len": 290, "body": "<p>貼一個近期優質實習單位的要求內容：<\/p>\n<p>申請資格：請參閱附件。<\/p>\n<p>另說明如下：<\/p>\n<p>(一) 在校期間各學業成績平均 70分(含)以上、操行成績平均 80分(含)以上，無記過紀錄。<\/p>\n<p>(二) 熟悉基本電腦文書系統操作，正向積極、熱忱負責，耐心細心，樂於嘗試社團活動、各類工讀或校外服務；樂於學習多元化事物及接受挑戰。<\/p>\n<p>(三) 非相關科系報名ＯＯ職類者，應修習過ＯＯ相關基礎課程，並提供書面紀錄(成績單..等)。<\/p>\n<p>翻為學生校園語就是：<\/p>\n<p>(一)好好來上課；不要睡白天的，不要欺負同學罵老師。<\/p>\n<p>(二)多用電腦文書寫報告，少用手機念字，打工社團或志工都重要，參加競賽報告要當組長或負責人。<\/p>\n<p>(三)證照考試很重要，修的課程不能太水。<\/p>"}, {"id": "f1703669769", "date": "2023-12-27", "title": "【永中後段班】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【永中後段班】 國中一年級念永和後段班時，打架是一種日常，弱小的我很怕打架，雖然天天看班上同學幹架，不是自己班互毆，不然就是隔壁班打群架，因為體弱的我練就了能躲就躲能閃就閃的能力；", "len": 1352, "body": "<p>【永中後段班】<\/p>\n<p>國中一年級念永和後段班時，打架是一種日常，弱小的我很怕打架，雖然天天看班上同學幹架，不是自己班互毆，不然就是隔壁班打群架，因為體弱的我練就了能躲就躲能閃就閃的能力；而且班上我也有好朋友，其中最好的同學就是余教練。國中時的他體格好又是校隊，在課後學習時也一起在導師辦公室上補救班，所以我盡量在可怕的學習環境中總是找他一起行動，一起上課、上廁所、下課聊天也一起去打桌球。其實我根本體能超爛的，跑不動也跑不快，手也施不了什麼力氣，在男校中如果沒個像樣的社群好友，我可能就是那個被脫褲子霸凌的瘦弱男孩。<\/p>\n<p>這幾天新北發生了驚人的國中生兇案，看到新聞我突然間又被拉回了12-13歲那個瘦弱沒自信又害怕的國中生，40年前的國中老師都是帶著藤條來上課的，當年長不高的自己時至今日仍非常不諒解老師對我們的體罰，但是這次在校園事件恐懼中，我突然也就認同了或許老師有個傢伙在身上，除了權威之外也可以防身，或許當時的校園真的很不安全。<\/p>\n<p>余教練是我國中期間安全感的來源，當年的入學班級是照階級分類的，全年級好像有三十幾班，1-16前段班中，雙數是A+班，單號是A-班，17班之後全是B段班，我們倆被分在26班，其實班上的同學素質並沒有分類中那麼地不堪，只是當班號標籤在校園被分類之後，很自然地就會有差別對待，後來學生的發展就可能因為大人們的分類也就在小型社會中被分了級。<\/p>\n<p>國一時的我被分到這班是非常害怕的，而且更是覺得訝異，因為真不知我做錯了什麼要被分類。而我的同學余教練與我一年級同班，一起留校念書，同學打架時我就不自主地找他，盡量離班級風暴遠一點，也小心自己被波及；當然也有實在是被欺負到抓狂時也會打起來，離校門最近的我們班，同學常靠在女兒牆邊看著校門旁生輔組長拿藤條在打學生，但同時就會有那種很煩又很鬧的同學會故意抓著欄杆將弱小的我包住，用力地從後面頂人，我有一次被頂到氣反過身就扭打在一起，後來也是余教練來拉開停止了我與同學之間難以回應的霸凌。<\/p>\n<p>當然後來我也變得不念書很愛玩，我有印象我有幾次溜出校外去打撞球司諾克，不知道他有沒有一同我就不太記得了，直到好像被導師發現要求開始課後留校後，才有轉機。<\/p>\n<p>我們的導師是師範大學剛分發的第一年實習生，她對我們充滿熱情與教學熱忱。不知從何時開始，我們有幾位同學被要求下課後要去辦公室留下來讀書寫作業，從那時開始我又慢慢回到學習的正軌，從迷失又害怕的校園中找回了學習的路，一本一本的課本慢慢地讀通讀懂，開始一級一級地往上轉班。二年級先轉到13班A-班離開了B段班群；在A-班上學年成績前2名後，三年級可再轉至A+班，國中三年轉了三個班，三個不同的世界觀，三個完全不一樣的同學特質。<\/p>\n<p>長大後才知道，不是我做錯了什麼，是我們沒有選擇入學A+班級的權力。<\/p>\n<p>十年前左右，余教練鼓勵我在教師節時回永和國中去找國一導師，我才敢走進那個只回憶到藤條聲與幹架氣氛的校園，其實現在的各級校園都比以從前平和與快樂，這是時代與親子教育的改善，更是公民社會的進步，很可惜在新聞中又看到了新北的校園發生令人難過的事件，我想起了40年前的不安，更擔心未來教育現場的發展。<\/p>\n<p>我與余教練現在都留在校園中，很盡力地用小小的力量在堅持著，我想他應該與我一樣，不想讓學生沒來由地因為被分錯了環境，而差點失去了找回自己的機會。<\/p>"}, {"id": "f1703486649", "date": "2023-12-25", "title": "旅遊酒莊第一堂：Johnnie Walker向錢行", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "旅遊酒莊第一堂：Johnnie Walker向錢行 下學期要教酒莊，此時先來聊一下一家200年威士忌品牌Johnnie Walker，創辦人約翰沃克 (John Walker)先生", "len": 603, "body": "<p>旅遊酒莊第一堂：Johnnie Walker向錢行<\/p>\n<p>下學期要教酒莊，此時先來聊一下一家200年威士忌品牌Johnnie Walker，創辦人約翰沃克 (John Walker)先生其實是一位滴酒不沾的貿易小商人，就像賣煙的不抽煙，殺豬的不吃豬；沃克家族依著法令的修改開始賺大錢，酒稅大減開始做賣酒的生意，開放混酒就開始做調和威士忌，藉由向各家酒廠買來的原酒調出最讓人喜愛的比例。<\/p>\n<p>而且他們家是以租售出口倉庫起家，所以每箱酒可以裝的空間越滿越多越賺錢，所以就設計了一種新型的方瓶，可以讓出口的瓶數及裝箱達到最佳化，意味著相同空間內可以容納更多的瓶子，同時減少瓶子破損，這就是約翰走路方瓶的由來，真是聰明的商人。<\/p>\n<p>另外，沃克家族還對酒標做了分級，因為酒標印刷就好，經濟又節省成本，且用顏色分級後更可以將目標客群及價格進行分眾銷售，所以在坊間就可以看到從低價至高價的紅、黑、綠、金、藍等等不同的Johnnie Walker。<\/p>\n<p>所以當你拿這款酒去送朋友時，一定要很注意上面的酒標顏色，因為一看就知道你提了多少錢來拜訪。<\/p>\n<p>如果你去宴會吃飯時，如果大家真的都用約翰走路當餐酒，那可以看看是不是依著桌次及排位，從藍標一路向外放到紅標，就可以知道你在主人心中的地位了。<\/p>\n<p>酒莊旅遊第一堂先上到這，我先去櫃子內找看看上次人家送我的Johnnie Walker是什麼顏色的。<\/p>\n<h1>圖為醒吾觀休系調酒教室<\/h1>\n<h1>飲酒過量有害健康<\/h1>\n<h1>酒後不開車安全有保障<\/h1>\n<h1>未滿十八歲禁止飲酒。<\/h1>"}, {"id": "01fc9958", "date": "2023-12-23", "title": "客廳裡的縫紉圓盤機", "cat": "生活記憶", "src": "方格子", "url": "https://vocus.cc/article/6586dc74fd89780001fc9958", "ex": "我媽只大我19歲，她因為家境貧困且人口繁眾，我最小的阿姨幾乎與我同年屬豬，阿姨們多到是以二、三、四、五、六數字來分，而不是叫名字加稱呼，在苗栗海線崎頂的老厝中生養著一大家子的人，後", "len": 1165, "body": "<p>我媽只大我19歲，她因為家境貧困且人口繁眾，我最小的阿姨幾乎與我同年屬豬，阿姨們多到是以二、三、四、五、六數字來分，而不是叫名字加稱呼，在苗栗海線崎頂的老厝中生養著一大家子的人，後來也才知道連家中傳世的姓氏也是過繼而來，如此食指浩繁崎頂漁工及流動廚工家庭，讓幾乎所有的舅姨們都沒什麼就學機會，我的母親在苗栗照南初中畢業之後就北上到關渡工作，成年不到的她就是當年出口導向經濟成長中的大量女工之一。<\/p><p>民國65年，都在台塑關渡紡織廠當作業員的爸媽終於買下了第一間預售的公寓四樓，那是我們第一個家，也是我媽離開台塑轉做圓盤家庭代工的場域。不知道從什麼時候開始，我們家就是滿滿的衣料布片，年復一年地，衣料會隨著季節而變化，冬天時家中堆著涼薄的各式衣料，天熱時反而全家都是毛衣的片材，一綑一綑五顏六色地將我們四樓家從陽台堆得滿滿的，家裡永遠都是毛料與布料的味道，我們當小孩的倒也是習慣家中如同倉庫一樣的環境，因為排得比人還高直達牆頂的方型衣料，也是我們的下課遊樂場。<\/p><p>而年輕只有二十幾歲的媽媽就一直坐在圓盤前車縫著永無止境的代工衣服。<\/p><p>圓盤機對我們孩子而言在家中客廳是一個突兀但必需的存在，它是一個外圈都是縫衣針排列而成的機器，用電動馬達驅動縫紉器及圓盤轉動，媽媽必須依著衣料的組成，將兩片衣材順時針地用手上的齒狀夾將邊緣推入圓盤排齒之中，這是個重覆的工作，一綑衣材整合另一綑衣材就會成為衣服的一部分，完成後半完成的衣料會落到地上，我們要將完成的半成品再堆疊打綑用塑膠繩緊縛成另外一綑綑衣料，沒多久就會有廠商開車來到樓下，我們會將一綑一包的衣料從四樓丟進停在一樓前的貨車中，由廠商整理載走，應該是轉手至下一個家庭代工或工廠。<\/p><p>這樣能賺多少錢呢？印象中是車縫一件衣材1-2元，要看難度而定，所以一綑綑完工的衣材在從陽台飛降至貨車上時，我總是會想著那是10元、20元、30元地飛出來，我的家庭更因為母親日以繼夜的車縫與時光付出可以增加一千多元的家庭收入。媽媽是很大方又信任我們孩子的，圓盤的中間有個平平的圓臺，在網路上找到有在賣舊機器的圖，就如截圖所示。母親總會放圓盤的平臺中放一些硬幣在上面，有大頭五元，也有鎳幣一元，也有黃銅五角，當樓下響起買山東饅頭的老伯伯或賣著草莓及青蔥麵包車來到樓下的叫賣聲時，我們小朋友就可以拿了零錢去買來充饑，很滿足很幸福。<\/p><p>另外，我的眼眶及眉緣之間有個短短的痕，就是我當頑皮小孩在家追逐時撞上了圓盤留下的傷，我仍記得那天是與鄰居或弟妹在家中玩，因為地上有衣材腳一滑頭就往機器撞去，好險當時圓盤上的針用專用鐵框罩著，所以我只撞上了框流了血，沒縫也沒看醫生日子久了就成了疤長了痕，留在我的眼框上。<\/p><p>這樣的家庭代工到底持續了多久我並不記得，只記得在板橋遠東紡織廠高牆邊的四樓公寓中堆著隨著季節轉換著代工紡織衣料、顏色及氣味的輪替感。<\/p>"}, {"id": "01859888", "date": "2023-12-13", "title": "台灣高鐵實習第一關書審過關技巧TIPS", "cat": "技職教育", "src": "方格子", "url": "https://vocus.cc/article/657a2a65fd89780001859888", "ex": "------------🥰學姊的鼓勵🥰------------- 給在校的學弟妹： 當初選實習場所時只是想著有機會就多嘗試，也試著打聽跟系所相關的實習場所，真的覺得當你努力爭取時機", "len": 1197, "body": "<p>------------🥰學姊的鼓勵🥰-------------<\/p><p>給在校的學弟妹：<\/p><p>當初選實習場所時只是想著有機會就多嘗試，也試著打聽跟系所相關的實習場所，真的覺得當你努力爭取時機會就會來找你，對於有興趣了解的事情就多聽多問，總是會得到讓你意想不到的驚喜，就這樣我得到了超難得開外招的高鐵開放大學生實習的資訊，最後也順利成為高鐵實習生，那段過程現在依然回味無窮！！<\/p><p>希望各位年輕有為的學弟妹們也能在熱血的大學生活中為自己爭取創造更多可能，未來的你絕對會一直為自己感到驕傲的，加油加油～～<\/p><p>醒吾旅運 103級 吳佳恩❤<\/p><figure class=\"ph\">照片<\/figure><p>-----------老師的叮嚀---------------<\/p><p>台灣高鐵的人資來電，千交萬代期待醒吾旅運同學今年一定也要爭取113學年度的高鐵服勤實習機會，在這長長的實習準備與履歷撰寫過程中，只要你想要這份工作時，就一定有辦法找出準備的時間與方法。<\/p><p>醒吾旅運系在台灣高鐵實習除了佳恩學姊之外，同級生中也有多位在畢業後考取站務員，除了去竹林山觀音寺拜拜之外，其實是有準備的心法，老師整理如下：<\/p><p>一、履歷細填不麻煩<\/p><p>很多同學都卡在要準備那麼多的文字資料覺得卻步，其實在看完此文之後就開電腦馬上開始寫，你就會知道沒那麼難；難就難在你一直想找東西抄找資料學，其實高鐵的資料中都用Excel將你要準備的內容都設計好，總第一行開始寫，一字字的累積你就會感覺到老師在交待什麼。<\/p><p>二、中文自傳寫重點<\/p><p>無論是高鐵或長榮的自傳都大約只能寫十來行字，建議以二段或三段來寫，第一段寫自己的個人特色，要寫實際的情形，如果字彙能力不足就舉例說明；第二段寫自己對現在找的工作的實際期望，希望可以學到什麼？獲得什麼經驗？為什麼你/妳是最合適的人選；第三段寫一下對入職後的想象，或是你自己對未來職涯的期待。<\/p><p>三、重要能力與專業寫前面<\/p><p>多數履歷資料表中都有表列區，要將最難考或最符合期待的證照放最前面，別用時序考取的順序來寫，不然大家第一張考的都是國際禮儀證照。英文或外國語能力都可以列，平時就要找時機去考，這部分沒有任何臨時的佛腳可以抱。<\/p><p>四、減少缺課重視成績<\/p><p>企業都非常重視個人特質，但是這從你去韓式照相館的美照看不出來，從制式的教師推薦函更難掌握，所以人資就會向實習生要過往的學習記錄，一張在學無紅字的成績單可以證明你很在乎每件事；一份完全的缺曠單更是敬業精神的預選單。有點單位更會要求有社團經驗或競賽證明，在學期待為自己打拼最實在。<\/p><p>五、找到老師趕快問<\/p><p>旅運系的老師都有數十年的業界經驗，我們都找過工作帶過人吃過虧，更在職場上努力多年轉戰技職，期待可以為同學們先備裝甲，所以只要同學好好地完成以上的資料準備，虛心進取地找任何一位老師，大家都會在此時為你/妳打氣，修改內容，鼓勵大家走向一條比我們更為璀燦職場大道。<\/p><p>最後，行筆到此，再來換大家打開電腦開始打履歷，再多的想象與考慮都是浪費時間，沒掌握應徵機會，東想西選結果就是看別人穿高鐵制服。<\/p>"}, {"id": "f1702435340", "date": "2023-12-13", "title": "2024觀光署導遊領隊評量考試報名中", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024觀光署導遊領隊評量考試報名中 2024 Cơ quan Du lịch và Hướng dẫn viên đang tiến hành đăng ký kỳ thi đá", "len": 820, "body": "<p>2024觀光署導遊領隊評量考試報名中<\/p>\n<p>2024 Cơ quan Du lịch và Hướng dẫn viên đang tiến hành đăng ký kỳ thi đánh giá hướng dẫn viên lãnh đạo<\/p>\n<p>報名日僅至12月21日止，報名網址在留言區。<\/p>\n<p>因為醒吾旅運系有不少外籍學生，用護照號碼學生無法註冊評量系統。越南同學只能報名外語導遊。記得四科考試專業科目三科仍以中文出題，建議中文閱讀能力高的同學再報名，沒準備念書者不要報名，否則是浪費報名費1000元。<\/p>\n<p>Ngày đăng ký chỉ đến ngày 21 tháng 12, địa chỉ đăng ký nằm trong phần bình luận.<\/p>\n<p>Vì Trường du lịch Xích Thông có nhiều sinh viên nước ngoài, sinh viên không thể đăng ký hệ thống đánh giá bằng số hộ chiếu. Sinh viên Việt Nam chỉ có thể đăng ký hướng dẫn viên nước ngoài. Hãy nhớ rằng ba môn thi chuyên ngành vẫn được đặt bằng tiếng Trung, nên sinh viên có khả năng đọc tiếng Trung cao mới nên đăng ký, những người không chuẩn bị học sách không nên đăng ký, nếu không sẽ là một sự lãng phí phí đăng ký là NTD1000.<\/p>\n<h1>外籍生應可用居留證號碼註冊<\/h1>\n<h1>外語導遊才有越南文<\/h1>\n<h1>外語領隊只有五種語言沒有越南文<\/h1>\n<p>Sinh viên nước ngoài nên có thể sử dụng số chứng minh thường trú để đăng ký<\/p>\n<p>Hướng dẫn viên nước ngoài mới có tiếng Việt<\/p>\n<p>Người hướng dẫn nước ngoài chỉ có năm ngôn ngữ mà không có tiếng Việt<\/p>\n<p>以上越文用AI翻譯<\/p>"}, {"id": "f1702446976", "date": "2023-12-13", "title": "醒吾旅運系", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "醒吾旅運系 旅遊資訊科技應用AR短影網路競賽開跑 請大家幫忙你喜愛的影片衝人氣(留言處有連結) 比賽時程：112/12/08起至112/12/20(三) 評審結果公佈 : 112/", "len": 423, "body": "<p>醒吾旅運系<\/p>\n<p>旅遊資訊科技應用AR短影網路競賽開跑<\/p>\n<p>請大家幫忙你喜愛的影片衝人氣(留言處有連結)<\/p>\n<p>比賽時程：112/12/08起至112/12/20(三)<\/p>\n<p>評審結果公佈 : 112/12/20(三) 於上課期間公告得獎名單<\/p>\n<p>領獎日 : 112/12/20(三)下午15時至16時<\/p>\n<p>競賽內容 :<\/p>\n<p>旅遊資訊應用AR影片競賽以網路競賽為主，參賽同學用手機等設備錄製1分鐘旅運管理系所屬特色導覽解說主題之影片，內文範例如附件，評分將請業師評審依拍攝影片內容進行評分，並輔以網路按讚數進行人氣評分，最後依專業評審評選出前三名，並另設人氣獎項二名。<\/p>\n<p>評選標準 :<\/p>\n<p>1.影片內容(70%)<\/p>\n<p>2.網路按讚數人氣(30%)<\/p>\n<p>獎勵方式 :<\/p>\n<p>獎項 名額 獎項內容<\/p>\n<p>第一名 1名 統一集團現金券 1000元<\/p>\n<p>第二名 1名 統一集團現金券 800元<\/p>\n<p>第三名 1名 統一集團現金券 500元<\/p>\n<p>人氣獎 1-3名 統一集團現金券 300元<\/p>\n<p>備註：另外將選出六位同學訪談，訪談費用為現金券100元。人氣獎超過300讚以上依數字給予增額鼓勵金，1個讚新台幣1元。<\/p>"}, {"id": "f1702025388", "date": "2023-12-08", "title": "【渾沌開竅】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【渾沌開竅】 南海之帝為儵，北海之帝為忽，中央之帝為渾沌。儵與忽時相與遇於渾沌之地，渾沌待之甚善。儵與忽謀報渾沌之德，曰：「人皆有七竅，以視聽食息，此獨無有，嘗試鑿之。」日鑿一竅，", "len": 741, "body": "<p>【渾沌開竅】<\/p>\n<p>南海之帝為儵，北海之帝為忽，中央之帝為渾沌。儵與忽時相與遇於渾沌之地，渾沌待之甚善。儵與忽謀報渾沌之德，曰：「人皆有七竅，以視聽食息，此獨無有，嘗試鑿之。」日鑿一竅，七日而渾沌死。〔莊子．應帝王篇〕<\/p>\n<p>每晚補習結束回程車上，我多半是聽著Podcast開著車，讓每天來回盆地與台地的接送車程成為一段自我學習的時間，多半是訪談與思維的內容，我非常喜歡而且珍惜這段時光，就像每日跑步30分鐘一樣，讓身體與心靈重新設定。<\/p>\n<p>某天後座平時安靜休息的孩子打破沈默提起了方才聽的一段內容，他說同學也有在討論人的靈魂應該是反物質，是現在的科學無法證實而已，並不代表不存在；而且他很喜歡莊子對宇宙的看法，是一種很科學的哲學思考。<\/p>\n<p>我驚訝在他每夜補習的數學、物理、化學及英文之外，與我討論起了莊子，當下我與他討論起莊子的哲學思維，從魚與人的本位到夢與現實，也與他討論到自己的宇宙觀與價值觀。我能與他討論的內容不多，因為我沒有PhD，更不是科學家，只是一個盡量找時間陪伴孩子與他一起看書聽書的家人。<\/p>\n<p>莊子在【渾沌開竅】寓言中所提的，儵與忽自作聰明為渾沌「開竅」，結果渾沌反被搞死。孩子與我的學生年紀相近，我不算是個緊張的爸爸，也不是個強迫學生的老師，學習上我很認同莊周之道，課堂上每位學生需要的內容不同，學生誠如海中渾沌一樣，在智識與專業的大海中接觸各類的想法與規範，因此渾沌不必有竅，便可以以自然天生的感受去體會去思考去形塑；在學的學生來到校園，老師就是盡量給予學習資源，讓學生找得到老師聊聊，讓學生了解困擾時有個安心場域供他們靠著，很自然地一年一年地過去，學生也許就會自生七竅開啟智端。<\/p>\n<p>若老師認為少念一篇顧炎武的廉恥有必要如此著墨，就有如儵忽鑿竅般地自以為是，日鑿一竅，慢慢地扼殺了學生發展的可能性。<\/p>"}, {"id": "f1700921523", "date": "2023-11-25", "title": "車到山前必有路 Simply Providence", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "車到山前必有路 Simply Providence 天剛亮就出門，參加一場期待好久的2023中華觀光管理學會研討會，不是因為主辦單位是TSSCI觀光休閒學報，其實是去找回些什麼的。", "len": 926, "body": "<p>車到山前必有路 Simply Providence<\/p>\n<p>天剛亮就出門，參加一場期待好久的2023中華觀光管理學會研討會，不是因為主辦單位是TSSCI觀光休閒學報，其實是去找回些什麼的。<\/p>\n<p>中華觀光管理學會研討會是國內觀光餐旅學術工作者在研究類型的最重要盛會之一，31年前創辦時由國內少數擁有觀光相關學系及研究所的文化、世新、靜宜、醒吾、銘傳等資深教授共組，我是在1999年念觀光所時被要求以學生身份入會，真正有參與論文發表已是2000年的高雄餐旅專校研討會。<\/p>\n<p>因緣際會到花蓮觀光學院工作後又開始了承辦學術會議活動的緣份，以上有那些活動是好友們參加過的呢？<\/p>\n<p>2010 Asia Tourism Forum@花蓮理想大地<\/p>\n<p>2011 World Culinary Forum@台北圓山救國團<\/p>\n<p>2012 APTA Asia Pacific Tourism Association國際研討會 @台北圓山<\/p>\n<p>2014 海峽兩岸觀光旅遊研討會 @中國福州<\/p>\n<p>2016 觀光產業創新優質服務研習營 @林口醒吾<\/p>\n<p>2018 全球華人觀光餐旅高峰論壇 @林口醒吾<\/p>\n<p>整理上述活動時想起很多好友同儕都被我瘋狂的電子郵件連繫煩過，更想起自己在壽豐校園中走路超快，回應馬上的奇怪行為，那時的自己真的很難與漫活花蓮及恬靜校園連上關係；印象中有好幾次忙到開車開到沒有油停在省道旁，打電話請同事來載，再去接小孩回租屋處的困窘；更有一次出門直接將小狗子載到學校，是我要停車關門時才發現他在後座睡覺，我再載他回吉安托嬰。<\/p>\n<p>以下省略一萬字......<\/p>\n<p>回到台中曬起暖烘烘的太陽，想起在中興大學宿舍中與阿公阿嬤童年生活的平靜時光，上回來靜宜大學的研習活動是在1992年的資訊網路html校園營，仍記得當時資訊系老師教的是改碼做網頁單純課程；車行至大門看到靜宜大學的英文Providence University，What a simply providence，真是上天的旨意，要我用單純的心與角色，來研討會找老師、學長姊們聊天，發表一篇校務研究的文章，陪陪現在讀輔大餐旅所的可愛醒吾導生發表她的碩士論文，同時也當一場發表場主持人評論六篇超級有趣的研究。謝謝靜宜大學觀光系承辦團隊，謝謝學會團隊。<\/p>\n<p>美好的一天。<\/p>\n<p>想起老師的提點，想起承辦活動的細節，想起花蓮的空氣，想起當學生的自己。<\/p>"}, {"id": "f1700382103", "date": "2023-11-19", "title": "【時事】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【時事】 時事已成往事，有願就會成真。 一位至交寄來了統計文本截圖，令人又驚又喜，開心到說不出話。 立馬分享給第一作者 Alumi Lu 呂老師。 -----2023.11.26更", "len": 1541, "body": "<p>【時事】<\/p>\n<p>時事已成往事，有願就會成真。<\/p>\n<p>一位至交寄來了統計文本截圖，令人又驚又喜，開心到說不出話。<\/p>\n<p>立馬分享給第一作者 Alumi Lu 呂老師。<\/p>\n<p>-----2023.11.26更新-----<\/p>\n<p>統計不好學，學了不知道要用在哪兒。<\/p>\n<p>研究所畢業後，發現學術論文的統計方法五花八門，難上加難莫測高深。統計這個學科是專業，更是很多人的門檻，結果這幾天大家全卡在3%~6%之間，各有解釋真的無奈。<\/p>\n<p>此刻在大家如此愛好統計之時，想藉此文找一本原文書：<\/p>\n<p>Wiley出版的商業統計第八版，<\/p>\n<p>Business Statistics: For Contemporary Decision Making, 8th Edition<\/p>\n<p>作者：Ken Black<\/p>\n<p>找了好多台灣的圖書館都沒有這本書，現今此書已出到第11版。非常地想看到列出來的紙本，不知道何處可以找到文本。<\/p>\n<p>附頁這是2011年我與呂老師共同發表的兩岸三地港口城市意向的郵輪研究，被商業統計大師Ken Black博士收錄在他的傳世巨作「商業統計學」的企業案例之中。<\/p>\n<p>對統計仍有興趣的學生及研究生可以細讀當年Wiley編輯寄來的校稿圖，Ken Black博士用我們的郵輪調查案例來說明卡方檢定在商業決策上的運用，更要學生讀書深思統計數字背後的原因，並且給予研究者建議去對照他所提到的統計方法與其目的。<\/p>\n<p>當下想起當時在麗星郵輪處女星號上一位位努力做出數百份遊客調查數據，我們的研究只用了最基礎的卡方檢定來驗證假設，藉由當年還沒還給老師的統計方法，來思考當時針對目標郵輪旅客的根本問題與研究目標，用合適的研究方法來檢定是否合適原先想了解的事實形態。<\/p>\n<p>對得起自己，心中很舒坦。<\/p>\n<hr />\n<p>2025.11.19<\/p>\n<p>以下為中文AI翻譯全文：<\/p>\n<h1>今日商業統計的批判性思考<\/h1>\n<h1>台灣海峽郵輪目的地的城市意象<\/h1>\n<p>研究者呂江泉 Alumi Lu（Chiang-Chuan Lu）與 陳瑞峰（Ruey-Feng Chen）進行了一項研究，部分目的在於了解：郵輪旅客對台灣海峽三個港口城市──香港、上海與臺北──的城市意象是否存在差異。研究者在四年間對郵輪旅客施測問卷以蒐集資料。受訪旅客約一半為男性、一半為女性，且超過 50% 為大學學歷。略多於一半的受訪者來自研究中三個港口之一，且有 72% 來自馬來西亞、新加坡、中國或臺灣。<\/p>\n<p>其中一項研究假設為：居住於三個城市（香港、上海、臺北）的旅客與居住於其他地區的旅客之間，在對三個城市的城市意象是否存在差異上是否不同。為了檢定此假設，研究者進行了一個卡方獨立性檢定。下方是用於此檢定的 2×2 列聯表及原始數據：<\/p>\n<p>有差異 無差異<\/p>\n<p>三港城市的居民 58 5<\/p>\n<p>非三港城市居民 37 25<\/p>\n<p>此檢定的虛無假設為：對三個港口城市意象是否有差異的看法，與受訪者居住地無關（彼此獨立）。依據資料計算出的卡方值為 17.97。在顯著水準 α = 0.05、自 由度 df = 1 下，其臨界值為 3.8415。由於 17.97 大於 3.8415，因此決策為 拒絕虛無假設。也就是說，對三港城市是否有差異的感受與旅客居住地並非獨立。<\/p>\n<p>實際上，超過 90% 居住於三港城市的旅客認為三城市存在差異，但居住於其他地區的旅客中，只有略低於 60% 認為存在差異。<\/p>\n<h1>思考問題（Things to Ponder）<\/h1>\n<p>你認為為什麼三港城市的居民有如此高的比例認為三個城市之間存在差異，但外地旅客的比例卻明顯較低？<\/p>\n<p>此問題如何運用本書第 10.4 節的方法來分析？請比較使用該節的技術與本例的卡方獨立性檢定的結果有何異同。<\/p>\n<p>來源： Chiang-Chuan Lu and Ruey-Feng Chen, “Differences in Tourism Image Among Cruise Passengers across the Taiwan Straits,” Global Journal of Business Research, Vol. 5 (2011), 95–108.<\/p>"}, {"id": "f1699761340", "date": "2023-11-12", "title": "【考導遊好？考領隊好？還是那個好考？】", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【考導遊好？考領隊好？還是那個好考？】 先說結論： 「以終為始」從現在開始準備，這考試不難。2000元的報名費仍擔負得起，建議二個考試都報名；唯有一點要考量，就是外語與華語的選擇，", "len": 1514, "body": "<p>【考導遊好？考領隊好？還是那個好考？】<\/p>\n<p>先說結論：<\/p>\n<p>「以終為始」從現在開始準備，這考試不難。2000元的報名費仍擔負得起，建議二個考試都報名；唯有一點要考量，就是外語與華語的選擇，如果同學的外語能力不錯，就直接報名外語導遊或外語領隊吧，再一陣子就會公告外語免測標準！不要等到明年考一次。<\/p>\n<p>如果你仍在考慮，那就繼續看下去。<\/p>\n<p>＃考領隊證照有什麼好處<\/p>\n<p>每年年底很多系上學生都在詢問一年一度的導遊領隊考試(明年起改名為評量)的選擇，尤其是現在技職院校證照領導教學的氣氛之下，此時此刻多半是修習旅運、旅遊、觀光休閒、等科系的同學做決定的時刻。在疫後旅遊大爆發，加上技職院校的觀光休閒相關科系學生準備此一評量是年度盛事，某些知名國立大學還將考試通過設為畢業門檻，考上的同學貼紅榜成為個人及學校的榮譽更是處處可見。<\/p>\n<p>＃我們不談志趣只談薪水<\/p>\n<p>最早以前，學生詢問此問題時，我的回答總是如此：「要看你的志趣呀！如果未來不想進旅行業，害羞不敢帶團的人都不用考」；以我個人來說，因為喜歡國外旅遊，加上對國內旅遊只有墾丁、花蓮、台東這種傳統景點認知之下，導遊這份工作想都沒有想過，所以也只有針對英語領隊去準備考試。<\/p>\n<p>附上104人力銀行2023年對領隊與導遊的薪資數據供有志於投入此行業的學生與朋友參考，薪資數字看起來導遊的平均月收入可達近五萬元比領隊多一萬元，或許是我個人離開業界太久，或許是調查方式導致，好像與我的認知不太相近，此部分有賴業界現場指正。<\/p>\n<p>＃考試要準備多久<\/p>\n<p>除了英日外國語言考試需要長時間的累積沒有速成之外，很多的國內資格考試都可以短時間獲得效果，只要你掌握好了答題的技巧，一冊可以熟讀的考前準備用書也是很重要的。所以我們以每年12月報名，次年3月考試的時間來看，大約準備考試的時間是3個月，如果天天都念上個10頁，扣除過年、寒假、跨年、聖誕等玩樂時間，大約剩下70天你的考用書最好是在700頁以內。<\/p>\n<p>＃我今年沒有準備好明年再考<\/p>\n<p>這是個有點吊詭的問題，因為考試的範圍很大，又是以實務性質為基礎的考試，只要你符合考試資格（高中職畢業）之時就是你可以開始準備考試的Moment啦！<\/p>\n<p>由歷年考題錄取率也可以推論，這幾年的華語領隊導遊考試通過率已漸漸向20%至30%集中。但是仍是時高時低，難以預測，加上2024年更是改制第一年，至少這次的出題方式與過往變化不大較好掌握。如果每延一年再考也許你碰上的又是題目較難，錄取率更低的一年，那不就是白白浪費了一次好好抱佛腳準備的機會...<\/p>\n<p>再者，同學都希望在課堂中藉由老師的上課內容來補足自己對相關考試的熟悉度，但是依個人在科大教學的考取的經驗來看，並沒有因為學生年級愈高，考試通過率就愈高。我們常開玩笑地說：考試通過率與年級應該是負相關，也就是愈年輕考試通過率就愈高。<\/p>\n<p>為什麼呢？那是另一個議題了😅<\/p>\n<p>＃我只想考好考的那一科<\/p>\n<p>華語導遊考試，在這些年來時難時易，反而是華語領隊錄取率較為平均，記得十年前因為開放兩岸觀光，為限制考取人數，考題出題模式及難度大增，當年度錄取率就極低，沒有領隊或導遊那個好考的問題，加上近年各大學都將此設為畢業門檻，所以當很多準備不足只付費的同學都報名加入考試時，整體的錄取率就很明顯地下降。<\/p>\n<p>最後仍要提醒各位看倌同學，2024年3月16, 17日的 導遊領隊考試 ，報名時間應會在今年12月初開放，這麼一大堆字看了很累吧，700頁的課本讀起來是什麼感覺呢？同學們好好想一想2000元報名費及課本費用是否要花下去？還是去五星飯店Buffet大吃一頓爽快許多？<\/p>\n<p>祝大家考運亨通！金榜題名！<\/p>\n<p>歡迎轉發🥰<\/p>\n<p>✈️✈️🚄🚞🚢🚌✈️<\/p>\n<h1>醒吾科技大學旅運管理系<\/h1>\n<h1>旅運管理系旅遊觀光實務組<\/h1>\n<h1>旅運管理系航空服務管理組<\/h1>\n<h1>空服旅遊實習就業導向的實踐者<\/h1>\n<h1>醒吾旅運<\/h1>"}, {"id": "f1698815592", "date": "2023-11-01", "title": "醒吾旅運T303機艙教室維修日常分享❤️", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "醒吾旅運T303機艙教室維修日常分享❤️ 這是醒吾旅運的第三代航空情境教室 週週上課、參訪、假日營隊使用率超高 ⬆️⬆️⬆️⬆️重點在這⬆️⬆️⬆️⬆️ 學校花了三億建了觀餐大樓供", "len": 354, "body": "<p>醒吾旅運T303機艙教室維修日常分享❤️<\/p>\n<p>這是醒吾旅運的第三代航空情境教室<\/p>\n<p>週週上課、參訪、假日營隊使用率超高<\/p>\n<p>⬆️⬆️⬆️⬆️重點在這⬆️⬆️⬆️⬆️<\/p>\n<p>學校花了三億建了觀餐大樓供三千學子教學訓練之用<\/p>\n<p>總不能平時就鎖起來不用不上課<\/p>\n<p>相信每位👩‍🎓同學都有在舒服教室上課上到＿＿＿（自行填空）<\/p>\n<p>那種不良的坐姿更讓老師們更時時擔心座椅及設施壞掉<\/p>\n<p>⬇️⬇️⬇️⬇️重點在這⬇️⬇️⬇️⬇️<\/p>\n<p>醒吾旅運系都是特別請<\/p>\n<p>航空專業維修大師幫忙🧰<\/p>\n<p>機艙座椅💺航空餐車<\/p>\n<p>這樣專業用品不是每位維修師都會處理的<\/p>\n<p>系上兩位航空老師🧑‍🏫<\/p>\n<p>曉華老師、令怡老師<\/p>\n<p>都一起趴在地上幫忙<\/p>\n<p>還要常請同學們打掃整理🧹<\/p>\n<p>所以，每次在使用時<\/p>\n<p>同學們請要愛護💕<\/p>\n<p>舒適良好的學習環境<\/p>\n<p>我們一起來維護👏<\/p>\n<p>✈️🚄🚞🚢🚌 ✈️<\/p>\n<h1>陳瑞峰老師<\/h1>\n<h1>醒吾科技大學旅運管理系<\/h1>\n<h1>旅運管理系旅遊觀光實務組<\/h1>\n<h1>旅運管理系航空服務管理組<\/h1>"}, {"id": "f1698464499", "date": "2023-10-28", "title": "有什麼生涯上的投資與付出是可以提升工資的？", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "有什麼生涯上的投資與付出是可以提升工資的？ 人力市場的供需是答案。 對一個技職學校的學生要在四年的期間做些什麼事呢？ 這篇文章點出了問題，但仍未給出解方。 社會是現實的，美、帥、聰", "len": 324, "body": "<p>有什麼生涯上的投資與付出是可以提升工資的？<\/p>\n<p>人力市場的供需是答案。<\/p>\n<p>對一個技職學校的學生要在四年的期間做些什麼事呢？<\/p>\n<p>這篇文章點出了問題，但仍未給出解方。<\/p>\n<p>社會是現實的，美、帥、聰明、專業、細心、負責、貼心...<\/p>\n<p>很自然就能在社會階層中上移。<\/p>\n<p>如果很宿命地用一命二運三風水四積德五讀書六名七相八敬神九交貴人十養生十一擇偶來看，上述其中與可以在學校學習技能有關的，很遺憾地也只有讀書或專業各一項。<\/p>\n<p>生錯家庭選錯學校，或許真的影響不少。<\/p>\n<p><a href=\"https://mapleduh.pixnet.net/blog/post/50685088?fbclid=IwAR1ieXQxo_tZFLmph6NcTFWBhUH5EWSbTna633QD66er07pd06Z9zIau4aU\">https://mapleduh.pixnet.net/blog/post/50685088?fbclid=IwAR1ieXQxo_tZFLmph6NcTFWBhUH5EWSbTna633QD66er07pd06Z9zIau4aU<\/a><\/p>"}, {"id": "f1698104510", "date": "2023-10-24", "title": "老師，您為什麼不還手！", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "老師，您為什麼不還手！ 昨天深夜網路上突然發出了這段影片，我看得觸目驚心晚上惡夢連連。是因為害怕嗎？或許是，所以我惡夢初醒，難以入眠。 我夢見我也在處理學生的衝突事件，夢中清楚地看", "len": 1129, "body": "<p>老師，您為什麼不還手！<\/p>\n<p>昨天深夜網路上突然發出了這段影片，我看得觸目驚心晚上惡夢連連。是因為害怕嗎？或許是，所以我惡夢初醒，難以入眠。<\/p>\n<p>我夢見我也在處理學生的衝突事件，夢中清楚地看見學生之間惡狠的眼光，我從兩位衝突的男生中間介入，一位同學握著拳頭嘴裡罵著難以入耳的髒話，要另一個人來釘輸贏，我看到學生不友善的眼光，也感受到年青氣盛的獸性，更覺得或許得挨著幾拳學生才會停下來。後來我在驚嚇中醒了過來。<\/p>\n<p>同為私立教職，我真的要向這位老師致上敬意，因為如果是我早就回手了，而她仍用盡了耐心對著盛怒的學生說明系上與教學的立場，維護那所剩無幾的教師尊嚴。烘焙教室中，老師應該是善用各類器具在演示各項專業技能，手把手地帶學生學習如何做出營養美味的蛋糕麵包，如同在知名各家文青雜誌中提及的技職教育的專業美好與社會責任。是的，多數國內的校園是如此，我所工作的觀光餐旅學院學生更是積極有禮敬業樂群，有機會來校現場參訪就可以深刻體會。<\/p>\n<p>但，影片中這位老師卻得勇敢地站在學生前面，整理倒在一地的椅子、處理自己情緒與教室經營的為難、忍受著學生失控的回應，同時積極面對學生的挑釁與漫罵。老師一直用著身教與言教在導引學生不要做錯事，說錯話；甚至是要求她先離開教室減少做錯事說錯話的機會，直到她走出她的教室，她的講堂，她的廚房，留下一群自以為是沒有家教的學生。<\/p>\n<p>我想她也一定會害怕，尤其是學生的椅子都直接往頭上飛了過來，她也一直在維護她的教學場域，教室有學習的神聖性，我們老師都是平凡人，會累會懶會不爽，但是只要站上講台，角色就是傳道、授業、解惑，因才施教。<\/p>\n<p>選擇做一位教學教師，或許會一點輔導，有一點良知，多一點善良。<\/p>\n<p>但是教師不是想來校園解決學生的社會事、家庭困境、情緒困擾、肢體衝突，甚至是危及個人安全。在校園內，有老師積極為了學生的學習在精進教學技巧，也有老師長期關心與照顧學生建立起如同家人的情誼，也有老師擔心升學高壓讓學生與教師共同過勞，想盡辦法在繁忙行政抽出時間再輔導學生，這都是老師們的日常。<\/p>\n<p>同為技職老師，再次向基隆這位大學老師致上最高的敬意與關心，<\/p>\n<p>現在「拎老師」取代國罵三字經在很多場合背地裡被開玩笑，校園內老師偶要面對早已失去學習興趣的學生、沉默的教室，甚者是影中呈現的具惡意的言語恐嚇與失控的肢體衝突，同樣身為技職教師看了影片徹夜難眠。<\/p>\n<p>這份職業要成為志業，在現在的社會氣氛比起過去是難上許多，更何況這是私立教職，沒有完整的教師保障，期待校方提供法律協助，別讓教師在校園內成為受害者。因為那個罵人的不只是學生，也是一位要為自己行為言語失當負責的18歲以上成年人，更別讓加害者用受教權為名在校園內被莫名地被保護著。<\/p>\n<p>別讓老師無奈失望離開，如同影片最後的喧嘩聲一樣，教室被學生攻佔了…….<\/p>"}, {"id": "f1697946177", "date": "2023-10-22", "title": "2023長榮航空城市觀光馬拉松", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2023長榮航空城市觀光馬拉松 寫不出什麼完賽或PB厲害的心得，因為我在38 K被回收了！但是從開跑之後一路上有很多開心有趣的事，記錄在文字中，以免明年同一時間忘得一乾二淨。 原來", "len": 1047, "body": "<p>2023長榮航空城市觀光馬拉松<\/p>\n<p>寫不出什麼完賽或PB厲害的心得，因為我在38 K被回收了！但是從開跑之後一路上有很多開心有趣的事，記錄在文字中，以免明年同一時間忘得一乾二淨。<\/p>\n<h1>原來會那麼想尿尿<\/h1>\n<p>平常也不是滴滴答答的人，不知道是因為身體對長時間運動的反應，還是突然病變，整場快40公里的路程至少去尿尿了五次，平均7-8公里一次；所以下次再參加一定要注意上廁所的時間安排，至少不要因為排隊而慢了8分鐘出發，因為流動廁所離起點好遠呀，其間好幾次都想在草叢解決。早知道就先出發再去中正紀念堂上就好。<\/p>\n<h1>馬拉松運動員身材及跑鞋都超好<\/h1>\n<p>因為是參加專業的馬拉松賽，大家都有備而來，貼身專業服裝及鞋款，沿路只要超車時都可以看到一雙雙知名又貴森森的跑鞋，還有健美的身材，如果志在參加，這是個不錯的福利喔。<\/p>\n<p>我已經每日跑3K快5年了，鞋子也才換了3-5雙，而且清一色是美津濃特價品。這次之後，我也想來試試賽道上好多帥氣的愛牌、耐牌、HOKA牌，是不是成績會比較進步呢？<\/p>\n<h1>很多情侶一起跑<\/h1>\n<p>基本上我很不建議情侶一起去跑馬，除非你們是跑步團認識或一起長年一起訓練；今天看到很多半路被放生的另外一位，眼睜睜地看著伴侶帥氣地邁開大步揚長而去，而且還落下一句：「我在終點等妳／你．．．」<\/p>\n<p>其實我覺得你是等不到的人的啦！<\/p>\n<h1>原來回收車不是跟著跑最後的人開<\/h1>\n<p>我一直以為回收車會開在最後，要跑不動的人上車。事實上專業的馬拉松在很多的Check Point都在裁判在計算時間，像我與兩位剛超我車的妹妹互道加油之後，就是眼看前面幾位跑友通過點之後，裁判就吹哨表示我們已過最後時間，強制被剪下晶片，之後就排隊登上停在一旁的回收車。因為被回收的點是38公里，其實我們還有時間，所以二位妹妹一直求裁判放我們續跑，我心中覺得她們很勇敢，因為阿伯會不好意思。<\/p>\n<h1>長跑完後會有點燒燒的感覺<\/h1>\n<p>這部分是我沒預料到的，而且腿很酸走不太動，回家沿路體驗台北行人空間時，才知道手腳不方便的人多需要平坦寬敞的人行道，過中山北路紅綠燈50秒根本時間太短走不完。<\/p>\n<p>這就是我初次跑全程馬拉松的心得，雖然只差一點就完賽有些遺憾，但因為體驗到太多用想象難以感受到的事，仍覺得過程有趣又開心。就如李忠憲老師在隱性反骨一書中提到的：每個人都應該找一件自己不是那麼擅長的事情好好努力專心地去做，這樣才知道人生不是你想像的那樣。<\/p>\n<p>另外建議明年長榮航空可以將【城市觀光】四個字拿掉，因為跑程一直重複地沿著內湖南港高架車道及基隆河腳踏車道上上下下的，看不到美麗的城市，更沒有觀光。<\/p>\n<h1>健康平靜<\/h1>\n<h1>保持自己的頻率<\/h1>\n<h1>人生不是得到就是學到<\/h1>"}, {"id": "f1697776599", "date": "2023-10-20", "title": "如果學測與統測再將學生依成績分校分層，那我們未來收到的學…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "如果學測與統測再將學生依成績分校分層，那我們未來收到的學生就是短文型的學生，但是否為情緒不穩定的學生仍真的要研究論證。 未來將會有越來越多的學生或許長文及長影沒有耐性閱讀與觀賞，但", "len": 291, "body": "<p>如果學測與統測再將學生依成績分校分層，那我們未來收到的學生就是短文型的學生，但是否為情緒不穩定的學生仍真的要研究論證。<\/p>\n<p>未來將會有越來越多的學生或許長文及長影沒有耐性閱讀與觀賞，但反觀是否也有愈來愈多的成人與年長者也有同樣的行為，主因就是手機媒體的流行與依賴。<\/p>\n<p>試問，大家有見到大人在公車上拿紙本或電子書閱讀小說的嗎？<\/p>\n<p>成人與年長者在高齡化的社會中才是中堅，如果他們因為看太多短影而情緒不穩（如內文所引），對社會的影響遠超過學生與未成年者。<\/p>\n<p>但是若能培養他們口說及實作的能力，甚至是創作短文及短影的能力，在多元的社會中或許才是影響力最鉅的一群人。<\/p>\n<h1>世界在變媒介在變<\/h1>\n<h1>我仍是小說及電影的極度愛好者<\/h1>"}, {"id": "f1697339435", "date": "2023-10-15", "title": "安樂死有那二種？", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "安樂死有那二種？ 終點旅程要花多少錢？ 有那些國家提供安樂之旅？ 每個人關心的議題很不同，如果你不想續看此篇文就到此停文。 有研究顯示看太多臉書同溫層中滿滿地美食、旅遊及限動分享，", "len": 721, "body": "<p>安樂死有那二種？<\/p>\n<p>終點旅程要花多少錢？<\/p>\n<p>有那些國家提供安樂之旅？<\/p>\n<p>每個人關心的議題很不同，如果你不想續看此篇文就到此停文。<\/p>\n<p>有研究顯示看太多臉書同溫層中滿滿地美食、旅遊及限動分享，會讓你看了心情一直沉下去，甚至厭世。東吳大學心理所的論文研究就曾針對大學生進行訪談調查發現，若大學生被動使用臉書時，會透過與他人的社會比較而出現憂鬱症狀，也就是當大學生被動使用臉書時，會愈常跟他人進行社會比較，進而出現愈多憂鬱症狀；但臉書主動使用者則無憂鬱症狀(留言1)。<\/p>\n<p>換言之，臉書不發文只刷文會不開心喔！<\/p>\n<p>終點旅程要花多少錢？<\/p>\n<p>另外查資料才知道坊間已有一些協助有意願的朋友旅行至以下國家的終點旅程，整體的費用從數十萬至百萬以上，手續因不同國家也有所不同，瑞士因為有合法化的機構及知名度高，成為許多知名人士選擇人生最後一趟旅程(留言2)。<\/p>\n<p>有那些國家提供安樂之旅？<\/p>\n<p>其實從附圖中就可以看出近年通過安樂死的國家越來越多，主要是以歐美先進國家在法令上合法化後可以更為審慎地評估人與生命之間的關係。在亞洲各國沒有任何國家安樂死合法，地圖上一片空白，個人認為應與文化及宗教上的長久影響有關，要在這個土地上走到這一步有賴整個社會的討論與接受。<\/p>\n<p>到底安樂死有那二種？<\/p>\n<p>簡單來說就是【自殺死】自願積極安樂死及【加工死】醫助自殺兩類，從文字上就可以發現死亡的議題雖然是我們每個人的必然終點，但是有太多的權利與義務連帶其中，就需要成熟社會共識與立法規範的程序。近年台灣因為高齡化及年老臥床照護的人口越來越多，造成了家庭及社會的巨大成本，2019年台灣的健康平均餘命為72.4歲，不健康之存活年數平均為8.5年。因此安樂死或許是很多家庭想說又不敢說的期待與選項。<\/p>\n<p>圖片來源：底圖取自中央社繪+狗子媽媽編<\/p>"}, {"id": "f1697080432", "date": "2023-10-12", "title": "一支草一點露", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "一支草一點露 前幾天在鄰近的家用百貨退貨，因為是用蘋果手錶付費，所以店員要在退貨單上寫下退款方式，結果年輕店員在填寫資料時停了筆，轉頭向其他人求援，因為看起來18歲的他拚不出APP", "len": 569, "body": "<p>一支草一點露<\/p>\n<p>前幾天在鄰近的家用百貨退貨，因為是用蘋果手錶付費，所以店員要在退貨單上寫下退款方式，結果年輕店員在填寫資料時停了筆，轉頭向其他人求援，因為看起來18歲的他拚不出APPLE這個字。<\/p>\n<p>今年2023年的新生兒可能不到13萬，比去年更低，從學校教育體制、社會氣氛及整體環境的不友善，有什麼理由要求年輕人生孩子。<\/p>\n<p>一個國家未來如果一年入學新生只有13萬人，我覺得更應該討論的不是學校收不到學生少子化私校海嘯的問題，更重要的是針對每年只有13萬新生兒的養成育成教育，過往考試競爭分層制度是因為人口眾多，僧多粥少。現在只剩下13萬個寶貝，每位年輕人都是國力，為每位個體尋找潛能，思考學習模式，加強培養能力成為專業或長材，是整個社會想進步時社會中所有人的課題。<\/p>\n<h1>楊陽英文 在分享文中提到：榜單看不到每年可能數萬個高中生放棄英文學習。近看表示現在的學校英文教學讓太多學生落後放棄，老師要檢討；將這數萬位失去學習興趣的學生，免除各校必修的英文課，再合宜地將其導入其他有發展性及潛力的訓練或學習中，才可能是解方。遠慮是要如何將雙語能力規劃入教學之中，讓學生不害怕英文，不要用分數來定義學生成果，才能教育者要思考的方向。<\/h1>\n<p>另話，私立學校沒學生本來就應該收掉，由教育部負責安置處理校產反而錯置專業人力，浪費國家教育資源，當學校收不到學生，校地就只是一塊空地而已。<\/p>"}, {"id": "f1696731834", "date": "2023-10-08", "title": "盤點身邊的朋友群深感幸運，從國小、國中、高中前期、高中後…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "盤點身邊的朋友群深感幸運，從國小、國中、高中前期、高中後期、大學、軍中同袍、同事、研究所同學、學界夥件等等，可以認識那麼多的人真的好感激。 很可惜，我的腦袋雖然對於周遭景物過目不忘", "len": 299, "body": "<p>盤點身邊的朋友群深感幸運，從國小、國中、高中前期、高中後期、大學、軍中同袍、同事、研究所同學、學界夥件等等，可以認識那麼多的人真的好感激。<\/p>\n<p>很可惜，我的腦袋雖然對於周遭景物過目不忘，但對於人與人的對話與互動，卻很模糊。因為這樣的行徑，另一半是很不諒解的。因為她在乎的，我沒記得；她不介意的，我卻深刻感受，也因此造成婚姻生活中很多很多的不愉快。<\/p>\n<p>直到兒子來到這個世界。<\/p>\n<p>因為他，我才感受到這世界除了我自己之外，還有一個我非常在乎的人，不是因為愛情、也不是因為愛自己；真的就是單單純純地愛一個人，一個獨一無二的個體。<\/p>\n<p>我想另一半和我一樣，沒有他，我們倆個如此自我的個體，很難有共同的交集，更找不到一生的相似點。<\/p>"}, {"id": "f1696042002", "date": "2023-09-30", "title": "https://www.books.com.tw/pro…", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "https://www.books.com.tw/products/0010780469 你有沒有過這樣的經驗？ 在短短的幾個月之內。 早已經因為同事、朋友或下屬當面與你爭吵鬧氣，", "len": 499, "body": "<p><a href=\"https://www.books.com.tw/products/0010780469\">https://www.books.com.tw/products/0010780469<\/a><\/p>\n<p>你有沒有過這樣的經驗？<\/p>\n<p>在短短的幾個月之內。<\/p>\n<p>早已經因為同事、朋友或下屬當面與你爭吵鬧氣，讓你氣得發抖，語無倫次，滿腦想著要如何反應或駁倒時，讓你一整天的工作或學習魂不守舍，心不在焉，進而成夜難眠，求助心理醫師及中醫師，乞求安心平順；<\/p>\n<p>但是回頭看手機時，突然間家人的群組之中來個更嚴重的通知，告知你的母親被人提告重罪，到了警察局接受偵訊，整個家庭不知所措沒有頭緒，只好先放下眼前的不快，緊急連繫處理安慰家人，整理各項資料，陪伴渡日。<\/p>\n<p>但沒幾天，最愛你的阿嬤在全家慌亂之中也許因為擔心辭世，離苦得樂撒手歸西，讓你在遺憾中對你自己的人生感到深深的絕望。<\/p>\n<p>再回頭面對自己的工作、生活與家庭，都在這一片混亂之中失序，你已無力在工作專案中爭取表現，積極任事；更對原生家庭的無盡義務與責任感到無奈；戶頭內的薪水更是不足支應生活所需，更對不起身邊靜默陪伴的妻子小孩忍受一個不快樂的爸爸。<\/p>\n<p>此時此刻，我甚至覺得如果自己的身體突然警示你病痛將來，來生時間不多，人生已經將入終站，我也覺得不無可能。<\/p>\n<p>你要如何面對你的人生？<\/p>\n<p>你要如何衡量你的人生？<\/p>"}, {"id": "f1695956826", "date": "2023-09-29", "title": "【拿到成績單你會注意什麼？】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【拿到成績單你會注意什麼？】 各科成績？班級排名？校內排名？全國總排名？ 辛苦的高中生剛考完全國模擬考，系統信箱就寄來了帳密可供家長登入查詢。打開系統給的成績單，從截圖附表可以看到", "len": 520, "body": "<p>【拿到成績單你會注意什麼？】<\/p>\n<p>各科成績？班級排名？校內排名？全國總排名？<\/p>\n<p>辛苦的高中生剛考完全國模擬考，系統信箱就寄來了帳密可供家長登入查詢。打開系統給的成績單，從截圖附表可以看到在此刻考國英數A自的全國考生有64573人，同校同學有804人，班上有38人。前面都登錄了這次考試的個人排名。<\/p>\n<p>以前我念高中時的成績單早已不知去向，但我至今仍記得當拿到成績單的那一刻時，我會看的不是我各科考幾分，而是趕緊看自己的名次，在班上排在第幾名，所以當我進入系統時，第一步我也是注意到了最下方的排名。<\/p>\n<p>問：假設看到成績單的是念高中時的自己，我心中第一個印進去的數字是什麼？<\/p>\n<p>問：年輕的我會鼓勵自己，考的分數排名意義不大，不是一種比較，我們要看自己的長處，聽聽自己心底的聲音嗎？<\/p>\n<p>問：我有辦法不去想其他同學的排名如何？還是去滑IG看看有沒有同學貼文？<\/p>\n<p>另話，前天晚上為了108課綱的多元學習微學分課程，媽媽與高中生討論專題內容到半夜，才訂出了一個彼此都滿意又願意投入的題目，因為在現在的考制之中，國英數自的考試是基礎學習重點，但是教育部課程系統中更有一大堆的學習歷程與多元學習的上傳資料在等著高中生填空上傳。<\/p>\n<h1>你是不是放大圖片去看看塗掉的數字是多少<\/h1>\n<h1>比較是人性<\/h1>\n<h1>學習不能拿來比<\/h1>"}, {"id": "f1694306336", "date": "2023-09-10", "title": "如果教師的工作薪水都相同，那當然是去找時間最能自己掌握的…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "如果教師的工作薪水都相同，那當然是去找時間最能自己掌握的學校待著，用多出來的時間做第二職涯，努力去獲利。文化大學的問題在多年前我就學時就有了，老師很混，學生不努力，學校環境設備都不", "len": 306, "body": "<p>如果教師的工作薪水都相同，那當然是去找時間最能自己掌握的學校待著，用多出來的時間做第二職涯，努力去獲利。文化大學的問題在多年前我就學時就有了，老師很混，學生不努力，學校環境設備都不投資，收學費賺資本是校方一直以來的經營方式。<\/p>\n<p>今天走到這一步，我覺得就是因果。<a href=\"https://tw.news.yahoo.com/%E5%85%BC%E8%A1%8C%E6%94%BF%E8%81%B7%E6%8A%B5%E9%90%98%E9%BB%9E-%E5%A4%A7%E5%AD%B8%E5%B8%AB%E6%80%92-%E6%89%93%E9%9B%B6%E5%B7%A5%E5%97%8E-224532250.html\">https://tw.news.yahoo.com/%E5%85%BC%E8%A1%8C%E6%94%BF%E8%81%B7%E6%8A%B5%E9%90%98%E9%BB%9E-%E5%A4%A7%E5%AD%B8%E5%B8%AB%E6%80%92-%E6%89%93%E9%9B%B6%E5%B7%A5%E5%97%8E-224532250.html<\/a><\/p>"}, {"id": "f1694130289", "date": "2023-09-08", "title": "台灣很重視有沒有錢，很多事做不到就推給錢不夠，不夠有錢。", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "台灣很重視有沒有錢，很多事做不到就推給錢不夠，不夠有錢。 結果就是那兒有錢也不管那是什麼工作或目的，就是追。 我看到很多學生與朋友，從事的工作對社會與大眾沒有任何的幫助，就是賺錢而", "len": 367, "body": "<p>台灣很重視有沒有錢，很多事做不到就推給錢不夠，不夠有錢。<\/p>\n<p>結果就是那兒有錢也不管那是什麼工作或目的，就是追。<\/p>\n<p>我看到很多學生與朋友，從事的工作對社會與大眾沒有任何的幫助，就是賺錢而已。<\/p>\n<p>為了錢，專賣一些高利潤高獲益的產品，但不是生活必需的，更不是提昇質感或美感的。<\/p>\n<p>為了錢，用追求進步與人生退休願景來當藉口，但仔細看都只是當文字與觀念轉來轉去在賣，藉此找到追逐者。<\/p>\n<p>生命在世上，真正要追求的，是身心健康、自我能力、幸福感。這三項與錢無關，與他人比較無關，只要以自己為基底，一日日的進步就可以達成。在追求的同時若再加上為社會與他人付出，增進群我關係，關心社會環境，從家人彼此做起，擴增至朋友鄰人，甚至成為企業與經營的內容就更達佳境。<\/p>\n<p>那要如何開始呢？<\/p>\n<p>就是百工百業專注專業，學生做好學習，教師教學認真，餐飲重視營養與安全，士農工商人人參與，禮運大同。<\/p>"}, {"id": "f1693054169", "date": "2023-08-26", "title": "記憶裡中興大學的教職員宿舍是我幼時漫漫夏日的遊戲場，從南…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "記憶裡中興大學的教職員宿舍是我幼時漫漫夏日的遊戲場，從南門橋的忠明南路轉進來後，大路就停在明德家商之前，延伸進來的就是一條繞圈的小路，住宿區的入口好像有座用標楷體黑字寫好的興大五村", "len": 1165, "body": "<p>記憶裡中興大學的教職員宿舍是我幼時漫漫夏日的遊戲場，從南門橋的忠明南路轉進來後，大路就停在明德家商之前，延伸進來的就是一條繞圈的小路，住宿區的入口好像有座用標楷體黑字寫好的興大五村看板，無論是順時鐘或逆時針都可以走完所有的學人宿舍。而台中阿公阿嬤的家就在順時鐘走的第二間，在灰色混凝土柱子之間有著紅色大門。<\/p>\n<p>大門走進去之後會先有一條廊道，二側泥土地上阿嬤種著常會雨後盛開白花的綠色蔥蘭，一叢叢排排站地一進引進二層樓高簡單學人宿舍的家門；從家門前看出來，右邊有棵與樓房同高的玉蘭樹，大樹上的樹梢總是四處散著玉蘭花苞，低的就常在一早清晨時被折下供在家中佛堂前，高處的花就自由地開到最大最張狂的時刻，就會化為一片片的白玉蘭掉在廊道之中。<\/p>\n<p>這個廊道有很多的功能，平時傍晚就是小孫子我騎三輪車的遊戲場，小腳腳踩著前輪踏板要踩上個好多圈才能繞完一圈；也是阿嬤耐心餵著我吃飯時的開放式餐桌，我要繞一圈才吃一口，但不愛吃飯的我就是很慢很慢地繞，往往一碗飯要吃上個半小時以上，我的嘴中仍是含著滿滿的飯菜。<\/p>\n<p>印象中的夏日，這個廊道上會鋪著很多長長的瓜在曬著台中永遠不缺的陽光。那是大黃瓜盛產的季節，阿嬤與小孫子我會一起將很多買來的大黃瓜去皮，剖半，在清爽的黃瓜氣味中將黃瓜排排放在竹篩中，就放著讓中台灣夏日的大太陽曬著，一天又一天，黃瓜會慢慢變皺縮水，顏色也會由清綠轉黃，最後成為土黃色的前一階色彩，當然形狀也成了扁扁橢圓樣，這個時候就是收進玻璃罐中醃漬，放進鹽與糖後鎖緊，幾個月之後就會是每天三餐常見的瓜瓜邊菜，沒有瓜瓜的白飯對我而言太過清淡。<\/p>\n<p>記憶中的冬日，這個廊道會轉變成白色米漿的壓製區，浸飽水的糯米送去市場讓人打成白漿之後就會用桶子放在白棉布袋中裝回來，阿嬤會用長條木椅及大石塊加壓，白棉布的外層就會慢慢地透出水來；此時阿嬤也就在一旁將冬天的白蘿蔔切細絲，再炒一點油蔥之後，再將不知道是壓了多久的濃米漿混入，再將家中所有的容器都找出來裝，有圓的、方的、長條狀的，在置入白紗布後一一倒入米漿，放入大蒸籠加水開大火蒸。而我呢，除了看著阿嬤做菜頭粿之外，早就失去耐性在一旁獨自玩，祖孫倆印象中很少說話，但是卻相互陪伴，我知道阿嬤在忙，阿嬤也知道我乖乖地在玩。<\/p>\n<p>興大宿舍的照片拍攝於七零年代，模糊不清的記憶片片斷斷地，但是我仍記著無論我有多麼不想吃飯，阿嬤都是耐著性子在餵，沒大聲罵過更沒說過重話，她是一位走過大正、昭和、民國年代的台灣傳統女性，戰亂的年代時她沒有讀過書，當時的女性不多言，但在她的長期陪伴中我更熟悉了靜觀處世與實事少言的人生典範，我的人格養成受阿嬤最深，從襁褓至幼稚園，我的幼時與童年都是在她的呵護中渡過。<\/p>\n<p>若我的人生能如同阿嬤一般，堅毅、樂觀、溫暖、樸實、健康地走過百年，那真是我此生受她永遠的影響與福報。<\/p>\n<p>謝謝阿嬤，我愛妳，來世再當祖孫喔。<\/p>"}, {"id": "01fca453", "date": "2023-08-05", "title": "指定保險受益人很重要", "cat": "理財情報", "src": "方格子", "url": "https://vocus.cc/article/64cde52ffd89780001fca453", "ex": "重要觀念：受益人一定要指定，不要只寫法定繼承人 當你自己為小資的你買保險時，在 要保人 與 被保險人 之外，有個欄位就是 受益人 。這個受益人的角色在你生命的歷程之中會時常改變，年", "len": 819, "body": "<p><b>重要觀念：受益人一定要指定，不要只寫法定繼承人<\/b><\/p><p>當你自己為小資的你買保險時，在<b>要保人<\/b>與<b>被保險人<\/b>之外，有個欄位就是<b>受益人<\/b>。這個受益人的角色在你生命的歷程之中會時常改變，年青時可能是爸爸媽媽或照顧你的至親，結婚之後可能是你的另一半，有了孩子之後你的最愛就是兒女，到年老之時你卻可能什麼錢都不想給下一代，甚至是最感謝身旁一直在照料你的阿蒂。<\/p><p>首先，我們先來聊一下什麼是法定繼承人，因為用得到保險理賠金的那一刻時，你就不在人世了，所以保險的受益人，如果只寫法定繼承人，那就是遺產的繼承。所以根據民法第一千一百三十八條規定，遺產繼承人，除<b>配偶<\/b>外，依順序定之： 一、直系血親卑親屬。（子女 / 養子女 / 孫子女） 二、父母。 三、兄弟姊妹。 四、祖父母。<\/p><p>上面的遺產分配方式依民法規定，配偶的權利最大，如果有小孩的話，才能與配偶均分遺產；否則其他人都是要等配偶取得50%遺產之後，才能分配剩餘金額。而且要注意這部分很重視法定配偶的身份，前任或離婚者都不算，而且在多元成家之後，角色與傳統觀點不同。所以如果你是某人的配偶，就要在法定上確認已經擁有，戶政機關的登記至關重要。<\/p><p><b>那為什麼要指定受益人呢？<\/b><\/p><p><b>一、因為你的最愛一直在變<\/b><\/p><p>在離世後你最在乎的人事物都可以成為你的受益人，所以除了自然人之外，也可以指定單位或法人。現在很多保單只要是要保人與被保險人都是自己，就可以很輕易地在網路或手機APP上更改受益人。<\/p><p><b>二、指定受益人就是身故保險金，不列入遺產<\/b><\/p><p>如果你的最愛就是另一半，那如果你不指定受益人，他／她在你離開之後，這筆保險金就會成為遺產，可能會被扣10-20％的遺產稅。(詳細規定可以看財政部的<a target=\"_blank\" rel=\"noopener\" href=\"https://www.etax.nat.gov.tw/etwmain/tax-info/understanding/tax-saving-manual/national/estate-and-gift-tax/QbA7Lqp\">遺產稅簡介<\/a>)<\/p><p><b>三、可以時常回來思考自己的保險規劃<\/b><\/p><p>很多時候我們買保險時沒什麼思考，當下被介紹之後就買下去，幾年或十幾年過去之後完全不記得為何一直在繳保費，所以可以設定年中或年末檢討自己財務之時，打開網站登入後，看看自己的保單內容及受益人規劃，想想自己與家人之間的關係，更有助於生而為人的價值。<\/p>"}, {"id": "01e1ab56", "date": "2023-08-04", "title": "台灣保險企業2022排名", "cat": "理財情報", "src": "方格子", "url": "https://vocus.cc/article/64cc8f35fd89780001e1ab56", "ex": "老東家中華徵信所年年都會公佈最新台灣大型企業5000大調查報告。大家知道在疫情後的2022年，台灣的保險業營收前五強是那幾家企業嗎？未來將如何發展呢？ 照片 以營收淨額來看排在全台", "len": 662, "body": "<p>老東家中華徵信所年年都會公佈最新台灣大型企業5000大調查報告。大家知道在疫情後的2022年，台灣的保險業營收前五強是那幾家企業嗎？未來將如何發展呢？<\/p><figure class=\"ph\">照片<\/figure><p>以營收淨額來看排在全台灣前50名以內的大型企業中(<a target=\"_blank\" rel=\"noopener\" href=\"https://www.credit.com.tw/CreditOnline/sample/2023Top5000_06.pdf\">2022中華徵信所報告<\/a>)，竟然有七家人壽保險業，可以想見壽險的營收佔比台灣總體經濟有多大。排名如上表所示，以國泰、富邦、南山排名前三大；從員工數來看，國泰、富邦員工人數均達2-3萬人。2022年的營收因為疫情影響算是人壽保險業的冬天，在基期低的情形下，2023年國泰及富邦的成長率及財報都可以期待。<\/p><p>上世紀時我仍是中華徵信所市場部的助理研究員，每年也要負責排名報告撰寫，同時也要利用這些具市場價值的資料重新整理協助各家企業進行市場分析，或是協助撰寫上市計畫書，曾經手的公司有櫻花建設、青雲電子、鑽全企業；協助增資的有台鳳、東帝士及長生企業(當時的機場捷運營運商)；當時的野村證券也委託中華徵信撰寫台灣加入GATT(現在的WTO)的產業影響報告書，這本報告我在世貿圖書館至少花了3個月日以繼夜才寫完中文版，再由野村總合社與日本交流協會轉譯為日文發行至日本供產業參考。<\/p><p>在中華徵信所上班時，家住三重租屋處，每天與數以萬計的機車族騎車下台北橋至台北市松山區上班，每天9點到班9點下班，當時並沒有週末二日，所以一週至少工作6天，與中國現行盛行的996工作制新興說法相同，根本就是台灣社會新鮮人賣肝的寫實經驗。在低薪與長工時之下，我沒記得賺了多少錢！更沒留下什麼回憶，最現實的就是那二年我開始掉髮，慢慢地失去了年少時的髮量，得不償失。<\/p>"}, {"id": "0185c3ed", "date": "2023-08-02", "title": "原來幫你保險的意思是這樣", "cat": "理財情報", "src": "方格子", "url": "https://vocus.cc/article/64ca030efd8978000185c3ed", "ex": "有聽過這樣一段對話嗎？ 「媽幫你保了一筆人壽保險，二十年後可以領回七十五萬元滿期金，而且終身都有醫療的保障喔，身故還有一百萬元給受益人喔！」；「再來每月你要準備５千元交保費喔，就當", "len": 765, "body": "<p>有聽過這樣一段對話嗎？<\/p><p>「媽幫你保了一筆人壽保險，二十年後可以領回七十五萬元滿期金，而且終身都有醫療的保障喔，身故還有一百萬元給受益人喔！」；「再來每月你要準備５千元交保費喔，就當做存款，以後你會感謝媽的啦！」<\/p><p>不清不楚的你，從來沒有簽過保險單的你，就在家人的【好意】之下簽了一張保單，等到二十年過後，你回頭去問家人，保費繳完了錢可以領了嗎？那時的你可能是剛要買房子、養新生兒或是交孩子的學費，結果後來發現那筆錢被家人領走了，而且都沒有通知過你，回家去問時只有淡淡的回應。<\/p><p>「喔！對呀，這筆錢媽先拿了，以後我老了你們就可以不用養我了」<\/p><p>你啞口無言，又因為是家人至親，說也說不清楚，轉頭如果另一半知道了，更是可能氣到不說話。<\/p><p>你如果有以上的情形，其實是你對保單的內容不熟悉，被保單上的幾個重要的關係人搞混了。<\/p><p><b>要保人<\/b>：媽<br/><b>被保險人<\/b>：兒子<br/><b>受益人<\/b>：媳婦<br/><b>繳款帳號<\/b>：兒子的帳號<\/p><p>保險契約是一種金融商品，因為與人關係共同交錯，所以上述的四個重要關係人一定要非常清楚。<\/p><p>一、被保險人放在契約第一項，表示保單因此人而起；但整份<b>契約中權力最大的人<\/b>卻是<b>要保人<\/b>。<\/p><p>二、看起來為自己繳月費天經地義，但是<b>滿期年金由要保人領<\/b>，<b>身故給付由受益人領<\/b>。保險中的保險額度是被保險人出事生病了才能運用，所以看起來你就是冤大頭。<\/p><p>三、而且<b>要保人擁有更改受益人的變更權<\/b>，被保險人兒子只有同意權，所以那天婆婆不開心，隨時都可以將受益人改回媽自己。<\/p><p>為了避免家庭失和，付錢的你人財兩失，建議你回頭檢視自己的保險契約。首先，只要是你在付款的保單，要保人一定要是自己，如果不是，就找一天說好一起去保險公司當面修改。其次，如果是你在付款的內容，被保險人不是你，受益人也不是你想的那些人，那就好好一起聊一聊之後，一樣到現場去修改。<\/p><p>再重覆一次，保單契約之中<b>要保人<\/b>最重要，付錢的你趕緊上網查一下自己的保單內容吧。<\/p>"}, {"id": "01324f91", "date": "2023-08-01", "title": "突然發現自己的保單有貸款！？", "cat": "理財情報", "src": "方格子", "url": "https://vocus.cc/article/64c8c024fd89780001324f91", "ex": "如果你從來沒有用過保單貸款，自信地覺得此事與我無關，仍建議你要用3分鐘看完本文，因為也許那一天你會和我一樣無奈地被逼著處理保單貸款。 發生事情的那一天，是我弟用手機截圖傳來群組的。", "len": 863, "body": "<p>如果你從來沒有用過保單貸款，自信地覺得此事與我無關，仍建議你要用3分鐘看完本文，因為也許那一天你會和我一樣無奈地被逼著處理保單貸款。<\/p><p>發生事情的那一天，是我弟用手機截圖傳來群組的。<br/>「哥，媽的保單竟然有二百多萬的保單貸款！怎麼辦呀？」<\/p><p>已經處理無數家中問題的我雖然心頭一緊，但並不驚訝，風來就擋，水來就淹，還能怎麼辦。<br/>「你先將媽的APP帳密傳給我，我來想想處理方式」<br/>登入網路APP之後才發現，家人在近期半年利用網路的方式按了幾下貸款申請，就將過往數十年累存的多筆保單直接借了錢，而且幾乎都是以最高額的方式借出，再詢問早已認知不清東忘西忘的高齡家人，回答幾乎都是：「我有借嗎？我不知道?」<\/p><p>這是近年來最常發生在剛退休的親人身上，原因多半是他們有接受到理財的資訊或是投資的方案，可能在他人的鼓勵之下用了網路保單借款，再詳細追問借款後的資金去向，卻是模糊不清丟三落四，大筆養老保障金及保障條件岌岌可危。<\/p><p><b>看到這裡，如果你也有類似的問題，請私訊我們一起來想辦法。<\/b><\/p><p><u><b>保單貸款很嚴重嗎？<\/b><\/u><\/p><p>其實還好，很多人都以為保單貸款與個人信用貸款一樣，如果借了沒還會被追債，會有被查封車子房子的問題。其實<b>保單貸款不會被追債，而且保單貸款不想還也可以<\/b>。<\/p><p><u><b>為什麼可以從保單借到錢？<\/b><\/u><\/p><p>因為那是投保的要保人(專有名詞)長年以來繳交的保費總額，所以<b>保單貸款可以借到的錢其實都是自己的錢<\/b>，只是因為你的保單仍未到期，聰明的保險公司就設計了一套金錢遊戲，讓你可以從自己的戶頭內借自己的保費，保險公司還會收你2%~7%的利息。<\/p><p><u><b>保單貸款要如何還？<\/b><\/u><\/p><p>還款方式很多，最重要的是，因為要算利息所以<b>還款金額每日都不同<\/b>，如果你熟悉網路科技，可以直接上保險公司官網或是下載手機APP都可以直接取得當天的還款帳號，還款金額可以從交利息至全額自訂，如果身上有活錢當然是全部還清，才能回歸保險應有的儲蓄性與保障性。<\/p><p>最後仍建議保單不要拿來貸款，除非不得已也要在借款的同時要有計畫何時會還款，因為這是現在的你向未來的你借的錢，如果還不出來，除了錢不見了之外，原先在保險時所規劃的醫療善終等良善美意都會成為過眼雲煙。<\/p>"}, {"id": "01921ca2", "date": "2023-07-25", "title": "沿街找工作的年少記憶", "cat": "生活記憶", "src": "方格子", "url": "https://vocus.cc/article/64bf1297fd89780001921ca2", "ex": "八十年代中和廟口前的大馬路，是台北客運10路公車往返木柵與板橋之間的重要道路，有著四線道的寬度，廟口更是熱鬧，小時候根本不知道廟裡供奉著什麼神明，但因為常因下課經過兩側的攤販與商家", "len": 919, "body": "<p>八十年代中和廟口前的大馬路，是台北客運10路公車往返木柵與板橋之間的重要道路，有著四線道的寬度，廟口更是熱鬧，小時候根本不知道廟裡供奉著什麼神明，但因為常因下課經過兩側的攤販與商家，再加上廟口後面有個夜市，所以數十年以來中和路兩旁店鋪生意都不錯，晚上都是燈火通明。長大後才知道這座於十八世紀就有的寺廟叫廣濟宮，供奉著開漳聖王陳元光，是我們福佬人的先祖，後方還有另一座供奉神農大帝的福和宮。因為香火鼎盛及交通要道成為中和人最多商業活動的發源地。<\/p><p>記得有一回傍晚下課後差不多十來歲的我，也是心裡擔心錢的事，我走路去廟口前的長排商家，先經過了南山路上的玩具模型店，在外面張望了一下多合金組合，因為店阿姨認得我們兄弟，所以我看一下就離開了。然後就沿著廟口龍邊的長街一家一家地去問有沒有可以打工的機會。現在想想，當然沒人會請一個小學生或國中生工作，我自小就瘦弱不愛吃東西沒胃口，應該就是常在擔心這兒掛心那兒造成的。很自然地就長不高，四肢也都細細沒力，相對起來清瘦的臉看起來就沒什麼精神。<\/p><p>記得我推開了一家藥房的門，先詢問是否有可以讓青少年的工作；事隔至少快40年，記憶中有位阿姨回應我，你的爸爸媽媽呢？我們沒有工作可以給你。後來我又去找了一家沒有門的店，不太有印象是做什麼生意的，他們正在看電視，對著我搖搖手連看我一眼都沒有。我心底有點難過，自以為當年拿林豐正縣長獎畢業，老師心目中的好學生，可以靠自以為是的聰明找一份可以賺錢的工作，但是後來發現好像沒用，應該是我還太小，會的還不夠。<\/p><p>後來我真的找到工作了，記得是不久之後藉由媽媽的介紹到一間位於仍未通車的永福橋結構下的電子工廠對電路板。小工廠就位在現在永福橋往公館去的橋墩下的一樓，抬頭就可以看到一直是沒通車的永福橋頭，真的是只有橋頭，就結結實實地指向新店溪，但是沒有後續的橋體。<\/p><p>在電子工廠一直工作到永和國中開學，現在回想那時應該是升國二暑假，工作內容很枯燥就是一直拿著板子在找有沒有沒接好會短路的線，一天要看很多很多電路膠片；想想當時為什麼沒有在讀書，這已經不可考了。至少我念附中的同學在當時應該都是在補習超前學習進度或學才藝過著舒適的暑假生活。<\/p><p>二個月後我沒拿到薪水，可能是媽媽領走了，這事我仍記得。<\/p>"}, {"id": "f1688861516", "date": "2023-07-09", "title": "昨天在大戶屋用餐時是下午5點多，北車地下街因為地面高溫反…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "昨天在大戶屋用餐時是下午5點多，北車地下街因為地面高溫反而用餐的人不少。看到餐廳為了服務生中間休息時間有個用簾子圍起來的隱私區，讓他們可以好好休息。非常羨慕。 因為平時工作都坐在連", "len": 378, "body": "<p>昨天在大戶屋用餐時是下午5點多，北車地下街因為地面高溫反而用餐的人不少。看到餐廳為了服務生中間休息時間有個用簾子圍起來的隱私區，讓他們可以好好休息。非常羨慕。<\/p>\n<p>因為平時工作都坐在連隔板都沒有的大辦公室中，名為教師研究室，但卻是用16張電腦桌排排坐的空間，老師們只能用電腦螢幕及書來隔出工作空間；下課時間想小寐一下也因為不好意思趴著，就忍著去洗洗臉，再回來看作業或備課，數十分鐘的空堂也就過去了。<\/p>\n<p>常常要等到學生下課回家了，同事也都走了，趴在桌前瞇一下才不會被突然進來的學生嚇一跳。<\/p>\n<p>台灣國中小很多導師的座位都在教室的最後面，沒有自己的辦公室。老師與小朋友一起上學上課改作業，從一早八點前就到校，盯打掃看秩序管理小朋友的互動，甚至是一起上著科任老師的課，五點學生下課之後，也常看到老師一人留在教室中工作。<\/p>\n<p>但我或許了解，那時才是老師自己一個人的時間與空間。<\/p>\n<h1>陳瑞峰老師<\/h1>"}, {"id": "f1688605914", "date": "2023-07-06", "title": "【中年轉職橘齡專業再造-技專校院水電學位學程專班】", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【中年轉職橘齡專業再造-技專校院水電學位學程專班】 我覺得水電工系對現今的年輕學生沒有什麼吸引力，但是對於五六年級中年有失業危機又有體力的我們，或是早早退休領月退的大哥大姊來說，如", "len": 582, "body": "<p>【中年轉職橘齡專業再造-技專校院水電學位學程專班】<\/p>\n<p>我覺得水電工系對現今的年輕學生沒有什麼吸引力，但是對於五六年級中年有失業危機又有體力的我們，或是早早退休領月退的大哥大姊來說，如果有這樣的學程開在假日或進修，而且課程都是具專業技術教師來上課，再加上輔考勞動部或官方公會等證照，我會想用四年來學技術。<\/p>\n<p>@[100003046621143:2048:李忠憲]老師提出的德國學制與方式，很合適於科技大學專業化轉型方向，很多科技大學都獲得了高額的高教深耕計畫，例如剛剛有許多教職員大量失業的遠O科大，112年仍獲得每年6千多萬的補助，或許計畫指標都是找不到落點的ESGs，如果這每年50幾億的計畫能放掉美麗的地方創生活動及研究數量指標，以延長社會中年級生的職業證照數量、50歲至70歲的勞動就業能力與參與率，反而可能是科技大學回到技職專業，擺脫論文指標華而不實之名的好機會。<\/p>\n<p>台灣退休族一直吃吃喝喝四處旅行，雖然對我們觀光旅遊業的平日團體成長有幫助，但是在個人成長與社會貢獻上真的少了點。尤其是那些月領退休金比年輕人27K更高的族群，如果可以用制度要求領月退時，用累點制要同步回校園上課學技術考證照，上課時可以認識更多好朋友，學到的專業平時可以整修家裡維護社區，在生活專業、群我尊重與個人健康三方均得那有多好。<\/p>\n<h1>技術是AI無法取代的<\/h1>\n<h1>動手做動腦學不會老<\/h1>\n<h1>科大與職訓共辦證照<\/h1>\n<h1>陳瑞峰老師<\/h1>"}, {"id": "f1688176347", "date": "2023-07-01", "title": "2023半年報", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2023半年報 一、1000KM2023仍在進行中，半年跑了467.2公里，很慢但有進度，發現自己有數字焦慮，想做的事用數字來累積就會不得不去做。所以就改用每日跑量的累積值來激勵自", "len": 484, "body": "<p>2023半年報<\/p>\n<p>一、1000KM2023仍在進行中，半年跑了467.2公里，很慢但有進度，發現自己有數字焦慮，想做的事用數字來累積就會不得不去做。所以就改用每日跑量的累積值來激勵自己往前，也藉此習慣加入原子習慣，有成果再報告。<\/p>\n<p>二、111學年第2學期結束，這學期很感激投入的都是自己喜愛的學科，六門課不算輕鬆，但準備課程與教學之間都很開心，學知回饋昨夜進了系統，謝謝學生正面反饋。<\/p>\n<p>三、上半年因為辦理系上實習行政，在長官同事大力支持中，讓實習合作的廠商聚焦；更在貼心學生的協助下，完成了教育部實習專案評鑑及實習企業媒合等大量細節工作。成果就是學生們下週起就要到各家知名企業實習工作當新鮮人，大家加油。<\/p>\n<p>四、等了三年終於Covid-19染疫了，身體很痛苦還害家人生病，先抱歉；但總覺得本來就應該走這個過程，人的數量太多了，這是上天的安排，物競天擇是道。<\/p>\n<p>下半年有二場10K及42K的馬拉松，有老友同跑照應安心許多，但決定仍要去保個旅平險，對家人負責🥰。<\/p>\n<p>另外今年發現自己沒那麼怕熱或怕冷了，應該是天天流汗代謝的結果，如果可以再少點頭痛，會更好喔😘<\/p>\n<p>Running Ray 2023.7.1<\/p>"}, {"id": "f1688226914", "date": "2023-07-01", "title": "【2023高教深耕計畫第二期：技職科大篇】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【2023高教深耕計畫第二期：技職科大篇】 續前篇，這篇要來聊聊媒體無知，家長不解，偶而被拿【台灣之光】來說嘴的台灣技專校院。 先問大家以下學校在台灣那個縣市呢？正修（）、南臺（）", "len": 900, "body": "<p>【2023高教深耕計畫第二期：技職科大篇】<\/p>\n<p>續前篇，這篇要來聊聊媒體無知，家長不解，偶而被拿【台灣之光】來說嘴的台灣技專校院。<\/p>\n<p>先問大家以下學校在台灣那個縣市呢？正修（）、南臺（）、崑山（）、龍華（）、弘光（）、明志（）、嘉藥（）、朝陽（）、樹德（）、致理（）、醒吾（）以上11所大學是列名在最新一期【高教深耕計畫】中的前二十強私立科技大學。公立學校部分大家就朗朗上口，因為幾乎都是國立地名科大。<\/p>\n<p>【前二十強私立比公立多】<\/p>\n<p>技職科大獲得補助的前二十強中，私立有11校，公立有9校；因為媒體很少報導私立技職科大的重要性及努力之處，這次技職高教深耕計畫在評估學校教學及產業合作等面向下，才讓這些努力訓練產業人力的學校浮出抬面。<\/p>\n<p>【重頂大輕技職】<\/p>\n<p>全國技職科大79校一共只獲得56億元補助，比台成清交4所頂尖大學總和64億元還少。2021年統計全國大專校院學生數為118萬人，一般大學有64萬人，技職科大有54萬人，一般大學獲得126億的補助，比技職多二倍的經費。<\/p>\n<p>【強者多拿弱者少取 科大生態物競天擇】<\/p>\n<p>高教深耕計畫是屬於競爭型計畫，所以有強者多拿，弱者少取的特性，從經費分布圖就可以看得出來，計畫競爭排名後段的大學在經費補助金額只能意思意思，在此少子化的時代，大學之間已有弱肉強食之勢。<\/p>\n<p>【技職師生 隱形冠軍】<\/p>\n<p>或許我們的學生在國英數理文史公民手寫科目的競爭之下，分數曾將這群技職學生定義求學前段；但在技職院校與老師們努力地設計課程，重視職場對接，積極接觸企業需求，讓學生超越自我設限，利用訓練強化學生實作能力，用技能再造自信重新定義後段。<\/p>\n<p>在此真的為每位在校為學生訓練技能、輔導語言及專技證照的技職老師大大鼓勵，在這個時代仍在要求學生要重視職場倫理與應對進退，要懂得服務時要彎腰微笑眼明手快。或許有人會說我們在訓練不合宜的勞動力，但是如果你與我們一起在技職教育環境中投入教學訓練與關心學生學習發展，你就會知道為什麼我們會非常自豪地為自己與我們所訓練出來的學生大力地拍拍手，希望社會看到這群認真努力的社會中堅。<\/p>\n<p>上面的題目知道答案嗎？<\/p>\n<p>附圖三有解答，有機會四處走走時可以去看看這些訓練台灣之光的隱形冠軍科大。<\/p>\n<h1>歡迎分享<\/h1>\n<h1>瑞峰老師課後補充<\/h1>"}, {"id": "f1688089223", "date": "2023-06-30", "title": "【2023高教深耕計畫第二期：一般大學篇】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【2023高教深耕計畫第二期：一般大學篇】 台灣高等教育界最重視的五年期競爭型計畫【高教深耕計畫】已經悄悄地公告在教育部的網站上，幾家歡樂多數愁。 112年高教深耕計畫補助在這72", "len": 382, "body": "<p>【2023高教深耕計畫第二期：一般大學篇】<\/p>\n<p>台灣高等教育界最重視的五年期競爭型計畫【高教深耕計畫】已經悄悄地公告在教育部的網站上，幾家歡樂多數愁。<\/p>\n<p>112年高教深耕計畫補助在這72所一般大學(見附表)的總經費為126億新台幣，其中只有台成交清4所大學超過10億補助，有22所大學超過一年1億以上的補助。<\/p>\n<p>其實高教深耕計畫都算是小條的，真正大筆的是教育部的年度預算，112年編了近3千億元來投資台灣的教育環境。高教就拿了上千億，相對於最重要的基礎12年國民教育，台灣的高等教育的經費合不合理，我已難判斷(報導在留言處)！但112年台灣國小入學的新生人數約為20萬人，但是列在名單上的大學新生只剩下10萬人不到，如果加上技專校院科大新生也沒20萬人。<\/p>\n<p>最近大家只重視私立大學補助3.5萬學費的事，身為私校老師真的為學生開心，但身為公民，我卻高興不起來。<\/p>\n<h1>歡迎分享<\/h1>\n<h1>瑞峰老師課後補充<\/h1>"}, {"id": "f1687619755", "date": "2023-06-24", "title": "【2023泰晤士亞洲區大學排名-台灣】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【2023泰晤士亞洲區大學排名-台灣】 有人知道National Formosa University是那一所大學嗎？有列入排名中喔，我是真的第一次知道台灣有一所＂國立福爾摩沙大學", "len": 956, "body": "<p>【2023泰晤士亞洲區大學排名-台灣】<\/p>\n<p>有人知道National Formosa University是那一所大學嗎？有列入排名中喔，我是真的第一次知道台灣有一所＂國立福爾摩沙大學＂呢。<\/p>\n<p>排名報告摘要：<\/p>\n<p>1.公立表現不佳，台成清交四頂大並未排名前４<\/p>\n<p>2.排名主要為該校教師及博士學生學術期刊發表質與量<\/p>\n<p>3.有醫學院的大學很吃香<\/p>\n<p>4.STEM科學、技術、工程及數學相關系所是未來的趨勢<\/p>\n<p>5.大學在全球定義的教學是以研究為導向<\/p>\n<p>台灣排到亞洲區名次的大學只有46所，其中公立學校22所，佔比列名其中不到一半，台灣的國立大學在經費充裕國家補助的前提下，並未特別傑出。會有人說這是買榜，但是這仍是公開資訊，在不平等的競爭之中，任何大學都有權利用合理合法的方式為學校爭取學生，因為這本來就是競爭型的奢侈財。<\/p>\n<p>2023年泰晤士高等教育世界大學THE排名以全球104個國家和地區的1,799所大學為樣本。衡量機構在四個領域的績效：教學、研究、知識轉移和國際視野。排名分析超過 1550 萬份研究出版物的超過 1.21 億次引用，另有來自全球 40,000 名學者的調查回復。所以可以斷言THE排名重視學術性，研究與學術發表就佔比60%。發表期刊數量應是排名重點，教學部分的數字來自於聲譽調查15%；師生比例4.5%；博士與學士比例2.25%；博士學位授予者與學術人員比例6%；機構收入2.25%。<\/p>\n<p>個人感想與心得：<\/p>\n<p>1.泰晤士報排名是在評筆在校教師的優劣良窳，而且國際上對大學教師的定義是以研究為主，教學為次。大學教師是沒有在一步步教學生什麼要會什麼不用會的。<\/p>\n<p>2.台灣傳統大學如果想打國際賽，要有全球競爭力就要以STEM科學研究為主，其他研究很難在量與質拉出不同之處。<\/p>\n<p>3.台灣大學生如果決定要念研究型大學，相關基礎先備知能不足，再去念傳統研究型大學就是浪費四年學費及時間。<\/p>\n<p>4.台灣技職科大要以就業為導向進行教學，很少著重在研究論文發表，很難在評筆中有好成績。教師的角色重在輔導、教學及就業導引，與這種排名沒什麼關係。<\/p>\n<p>5.台灣用公立私立學校排名是老師及家長用過往的經驗指引出來的，家長在送學生進入研究型大學時，真的也要看看學生潛質是否合適。<\/p>\n<p>最後附上排名表，有興趣的人再點進去看看台灣的46所列名的大學在亞洲整體排名或是其他國家的大學競爭力如何？<\/p>\n<h1>歡迎分享<\/h1>\n<h1>瑞峰老師課後補充<\/h1>"}, {"id": "f1687488810", "date": "2023-06-23", "title": "蘇老師指的是國立科大的教學現場及學生畢業後的困境。", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "蘇老師指的是國立科大的教學現場及學生畢業後的困境。 身為科大教師，有什麼能做的呢？我覺得專業課程、證照考試與全年實習的三明治教學法(2+1+1)一定要落實。 舉個例子： 前幾天與學", "len": 422, "body": "<p>蘇老師指的是國立科大的教學現場及學生畢業後的困境。<\/p>\n<p>身為科大教師，有什麼能做的呢？我覺得專業課程、證照考試與全年實習的三明治教學法(2+1+1)一定要落實。<\/p>\n<p>舉個例子：<\/p>\n<p>前幾天與學生在期末課後聊全年實習將在這個暑假將要開始。<\/p>\n<p>師：會不會緊張。<\/p>\n<p>生：當然會。<\/p>\n<p>師：那你準備好了嗎？<\/p>\n<p>生：還沒。<\/p>\n<p>師：其實老師要到新工作前也很緊張，上課前面對不熟的學生也很緊張，這表示我們很在乎。<\/p>\n<p>生：咦，老師也會緊張呀！<\/p>\n<p>師：當然，只要事情在乎就會緊張，但是我就是好好備課好好安排工作進度。而且老師覺得你們也準備地差不多了。<\/p>\n<p>生：真的嗎？我什麼都不會。<\/p>\n<p>師：其實不然，你有打工的經驗，有考證照的努力，有數十年業界經歷的老師群在學校當你工作上的導師，其實你準備地差不多了。<\/p>\n<p>生：（傻笑不語，我知道他在思考與檢討過往三年）<\/p>\n<p>師：好好加油，有事回報，老師們會接住你的。<\/p>\n<p>生：好喔，謝謝老師。<\/p>\n<h1>令人緊張的全時實習將要開始<\/h1>\n<h1>醒吾旅運<\/h1>\n<h1>長榮航空<\/h1>\n<h1>立榮航空<\/h1>\n<h1>星宇航空<\/h1>\n<h1>桃園航勤<\/h1>\n<h1>可樂旅遊<\/h1>\n<h1>五福旅遊<\/h1>\n<h1>行家旅遊<\/h1>\n<h1>宏碁渴望<\/h1>\n<h1>飛買家<\/h1>\n<h1>美麗信<\/h1>"}, {"id": "f1687420636", "date": "2023-06-22", "title": "【每年七月的大學聯考其實並未消失】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【每年七月的大學聯考其實並未消失】 2023年大學聯考回來了？此時仍有五成高中應屆畢業生在準備分科測驗！？ 端午棕香，2023年夏至的台灣，辛苦的112學年應高三學生，他們是108", "len": 1106, "body": "<p>【每年七月的大學聯考其實並未消失】<\/p>\n<p>2023年大學聯考回來了？此時仍有五成高中應屆畢業生在準備分科測驗！？<\/p>\n<p>端午棕香，2023年夏至的台灣，辛苦的112學年應高三學生，他們是108課綱第二屆，當中有一半的男生更是兵役從4個月改回一年役期的倒楣鬼，雖然媒體及名校已經在慶祝OOO考取O大醫學院O位時，多數的考生在大家放長假休息的期間，此時仍留在學校、圖書館或補習班，這一切都是因為他們都仍在準備7月12-13日的分科測驗。<\/p>\n<p>在少子化及大學員額不減的前提下，考上大學不重要，考上頂大才是學子與家長的重點，今年11.8萬的高中考生中，有多少人參加7月12-13日的偽大學聯考呢？個人估計可能會有五萬人左右，在這熱得要死的暑假期間，其實仍有莘莘學子被我們這群大人設計的制度強迫流著汗上考場，再考一次在半年前已經準備過的考科；想想真的很奇怪，那為何不如就直接用學測成績來填志願分發就好了嗎？再考一次的意義是為了什麼呢？<\/p>\n<p>多元入學制度中是期待考試分發入學(如聯考)的比例要逐年下降，如表中可以看出制度設計上希望是只有四分之一的學生進行此管道，要慢慢提高繁星及申請入學的比例。但是考生與老師們在少子化及大學員額不減的市場機制中，112年放棄前面繁星及申請入學的學生反而創新高，從今年最後可能的錄取生比例來看，甚至可能超過五成。<\/p>\n<p>在教育改革多年之後，大學聯考仍借屍還魂般地存在，而且一分為二，二中有三，加上高中期間的學習歷程與多元學習設計，讓台灣少子化下年輕學子仍在中學階段強迫接受制度的安排之後，還要考學測及分科二次大考。讓我們來看看台灣大學聯考的演進，大學聯考名稱由大專聯招(43-60)、大學暨獨立學院入學考試(大學聯考61-90)、大學入學指定科目考試(指考91-110)、學科能力測驗(學測111~)、大學入學分科測驗(分科)，從111學年開始將「指考」改為「分科測驗」，從原本「10科」改為「7科」，少考國文、英文、數乙，而這三科將參採學測成績，分科測驗能選考的科目為數學甲、歷史、地理、公民與社會、物理、化學、生物等七考科。從考科來其實根本什麼都沒換，過去的形成仍在，而且為了要配合社會期待，東改西改變得更為複雜。<\/p>\n<p>尤其是在112年，許多的考生與家長在參考去年考分科時有許多「低分高就」例子之後，學測成績不如預期的學生不參加個人申請入學，來拚分科測驗。報導中也指出南部地區各指標學校報考分科測驗人數都超過半數，周邊北部指標學校認識的學生也都仍在與考科拚鬥中，端午佳節祝福他們在如蒸籠般的暑氣中高”棕”心目中理想科系。<\/p>\n<h1>歡迎分享<\/h1>\n<h1>瑞峰老師課後補充<\/h1>\n<h1>其實來念技職科大也不錯<\/h1>\n<h1>普通大學很少有全時企業實習<\/h1>\n<h1>考得死去活來一樣30K<\/h1>\n<h1>一技之長才是王道<\/h1>"}, {"id": "f1687068576", "date": "2023-06-18", "title": "【到底要讀多少年的書】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【到底要讀多少年的書】 以我自己來說，如果由國民義務教育開始到碩士畢業，一生在學校念書時間是整整19年，其中並未加上幼稚園的階段，如果再加上去真的時間真的很長很久，怎麼走過卻非常模", "len": 1163, "body": "<p>【到底要讀多少年的書】<\/p>\n<p>以我自己來說，如果由國民義務教育開始到碩士畢業，一生在學校念書時間是整整19年，其中並未加上幼稚園的階段，如果再加上去真的時間真的很長很久，怎麼走過卻非常模糊，怎麼回想學校中發生過的事，想得起來的卻非常少。<\/p>\n<p>【台灣多數人希望有大學以上學歷】<\/p>\n<p>landgeist地圖所指的是預期受教育年數圖，亞洲四小龍佔據前五。圖中台灣的平均是16.5年，列為紫色≥16，期待擁有大學以上的畢業學歷與韓國、香港、新加坡的國民一樣。事實上2019年台灣25歲以上國民的平均教育年數是12.3年，國民多有高中畢業學歷。亞洲各國中的巴基斯坦 (8.7/5.2)、葉門 (9.1/3.2) 和敘利亞 (9.2/5.1) 的人民預期受教育年限低於十年，就是說這幾個國家只希望他們的孩子可以念到國中畢業就好，再對照真實的教育年數，其實這幾個國家的人民教育機會對他們來說根本是人生難求的機會，真的非常令人心疼。<\/p>\n<p>【夢想很偉大、現實很骨感】<\/p>\n<p>最近剛改名的土耳其是唯一列入歐亞二區地圖的特殊國家，也是在教育指標中期待與現實差距最大的國家。土耳其預期受教育年限在亞洲最高18.3年，土耳其的父母期待子弟有碩士畢業，但是事實上土耳其的平均教育年數資料中卻在歐洲地區排後段班，平均教育年數只有8.1年也就是國中畢業。這就是期待太高，但是社會國家提供的支持不足，是人民的問題嗎？我覺得是國家治理與社會文化的問題。<\/p>\n<p>【讀書很重要，但要其他因素配合】<\/p>\n<p>從聯合國的人類發展指數HDI前幾名都是歐洲各國，所以要學習先進國家應該是正確的方向，由圖中歐洲2019年平均教育年數地圖就可以發現多數歐洲國家都是念完高中之後就離開學校生活，投入職場與專業領域，以25歲為基準來看藍色≥13，前三名是德國、瑞士及英國。這是個整合性的面向，歐洲各國的健康長壽、生活品質應該是他們勝出的重要指標，當然多學點知識是會增進人類發展，但是如果品質與健康沒有跟上都是枉然。<\/p>\n<p>以上地圖的數據來自聯合國開發計劃署UNDP的人類發展指數HDI。如下圖所示人類發展指數HDI來自於健康長壽年限、知識及生活品質三大面向；而知識面向再分為預期受教育年限及平均教育年數二個分項指標。附上連結大家可以點進去找原始資料，我找不到在UNDP公開資訊中有將【台灣】列入任何的評比，所以landgeist地圖網站如何取得台灣的資料仍有待查證。<\/p>\n<p>總而言之，此時正是大學申請剛放榜，七月分科考試仍在凌遲莘莘學子的階段。讀書是否真的那麼重要，身為老師主觀認同教育很重要，考個好學校一定是正確的，但是如果進了學校之後忘了獲取知識與專業，對個人健康與習慣沒有好好養成，對社會群體沒有認同與關心，那再長的學習階段不一定會讓社會往上發展。<\/p>\n<p>想問問大家，未來你的孩子從小到大要讀幾年書呢？<\/p>\n<h1>資料來源 landgeist / UNDP<\/h1>\n<h1>歡迎分享<\/h1>\n<h1>瑞峰老師課後補充<\/h1>"}, {"id": "f1686748647", "date": "2023-06-14", "title": "【大學申請入學分發公布，數字如何看？】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【大學申請入學分發公布，數字如何看？】 這是108課綱的第二屆，從111年至112年的公布的各校錄取成長率來看，幾乎全面下滑，只有台、成、清、交、台北醫大及少數專業學校是正成長的，", "len": 636, "body": "<p>【大學申請入學分發公布，數字如何看？】<\/p>\n<p>這是108課綱的第二屆，從111年至112年的公布的各校錄取成長率來看，幾乎全面下滑，只有台、成、清、交、台北醫大及少數專業學校是正成長的，分發率不到六成的學校，在考生人數不足又重覆報考的情形下，即使名額流用至分科分發也不會好到那裡去。但是等到全部招生結果結束之後，反而是分部在中段的學校少了最多的學生，後半段的學校卻不一定會招得比中段的差。<\/p>\n<p>為什麼呢？原因在現在的考招制度是一個協調後的結果。推論如下：<\/p>\n<p>一、前段大學仍維持過去的優勢，而且越來越難考，註冊率幾乎100%。<\/p>\n<p>二、中段大學不分公私立，只要是科系與前段大學相似者，收到的都是推甄備取生，這些都是尊重體制與考招設計的學生，但因為少子化人數變少，在排序後的學校可收的學生數漸次變少，所以註冊率會在50%-80%之間。<\/p>\n<p>三、後段學校在此時的考招制度只能收到少數搞不清楚狀況的學生(例如停辦的明道大學那4位)，無論是個人申請或分科測驗分發都已經沒剩多少新生，到此推論註冊率應該都不到五成。<\/p>\n<p>但最後到十月公告大學註冊率結果卻不太一樣！因為有個特別的制度【獨立招生】，讓少數原先不足額的部分學校可以選擇獨立招生名額，學校可以用免考試、免備審、快樂學習就畢業來吸引最後一批不想準備申請資料、不想考試，只想要有大學畢業學歷的學生，結果最後的註冊率也會落在50%-80%之間。<\/p>\n<p>所以教育部所公開的大學註冊率是落後指標，反而現在個人申請的階段可能可以看出學生心中真正的選擇與想法。<\/p>\n<h1>歡迎分享<\/h1>\n<h1>瑞峰老師課後補充<\/h1>"}, {"id": "f1686531141", "date": "2023-06-12", "title": "【跑步與氣候變遷】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【跑步與氣候變遷】 因為跑步對環境更有感，每天都深刻體會溫度與身體之間的關係，入夏以來只要是在台北市區跑街道，多數都是覺得跑在飽滿水氣的溼氣中；如果在台地上跑步會好一點，250公尺", "len": 360, "body": "<p>【跑步與氣候變遷】<\/p>\n<p>因為跑步對環境更有感，每天都深刻體會溫度與身體之間的關係，入夏以來只要是在台北市區跑街道，多數都是覺得跑在飽滿水氣的溼氣中；如果在台地上跑步會好一點，250公尺海拔會少個1.5度C，現在的林口沒有霧氣，反而因為有海風在吹森林環繞，比起盆地中舒適不少。<\/p>\n<p>附圖是NCEP Climate Forecast System (CFS)資料截出的6/10全球氣溫圖，紅到發灰的都是超過40度C的地方，亞洲看起來只有青藏高原是涼的；整個歐洲至西伯利亞都暖烘烘的。<\/p>\n<p>從黑色的溫度爬升趨勢來看，或許我們將迎來歷史上最熱的夏天，就是七八月交界時，全球2023氣溫(黑線)的平均值不斷地超越氣候變遷預測的+2度C。<\/p>\n<p>從6/10開始，已經將跑步的時間改為清晨，運動後因為身體對室溫調節性變好，也沒那麼依賴冷氣空調，一台DC風扇省電又環保。<\/p>"}, {"id": "f1686377345", "date": "2023-06-10", "title": "【Graduation & Commencement】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【Graduation & Commencement】 學校的畢業典禮其實是在五月底舉行，很偏執的我一直認為這個儀式應該是在六月，所以決定六月再來寫感言。 兩班學生們幾乎在疫情之中", "len": 348, "body": "<p>【Graduation &amp; Commencement】<\/p>\n<p>學校的畢業典禮其實是在五月底舉行，很偏執的我一直認為這個儀式應該是在六月，所以決定六月再來寫感言。<\/p>\n<p>兩班學生們幾乎在疫情之中渡過了大學生活，至少有一半是戴口罩過日子，看到照片也才回憶起大家剛由高中入學時的青澀臉龐與純真笑容，很難忘記的美好，老師就放在心裡了。<\/p>\n<p>謝謝同學們在實習一年的努力認真，讓老師們面對所有合作廠商時自信又大聲，因為你們的傑出與卓越，更讓企業主管一直拜託指名醒吾旅運畢業生，老師知道這一切的成果都是你們的淚水汗水編織交錯而成的，老師只是拾穗的人。<\/p>\n<p>在此祝福醒吾旅運108級畢業生的所有同學鵬程萬里，優秀如你們已獨立架起強力的專業翅膀，自信地向美好的未來高飛而去。<\/p>\n<h1>醒吾科大旅運系<\/h1>\n<h1>醒吾科技大學旅運管理系<\/h1>\n<h1>醒吾科技大學<\/h1>\n<h1>醒吾旅運<\/h1>\n<p>✈️🚄🚞🚢🚌✈️<\/p>"}, {"id": "0180cdd9", "date": "2023-05-20", "title": "郵輪甲板Shuffleboard沙狐球如何玩？", "cat": "旅行郵輪", "src": "方格子", "url": "https://vocus.cc/article/64682d5dfd8978000180cdd9", "ex": "照片 郵輪的甲板常畫著不同的圖案，但在亞洲航程中很少看到有任何遊客在玩，多數的郵輪領隊、Youtuber也不知道如何玩，上了郵輪只會叫客人去餐廳吃到飽或四處亂逛，看多了只是讓郵輪旅", "len": 832, "body": "<figure class=\"ph\">照片<\/figure><p>郵輪的甲板常畫著不同的圖案，但在亞洲航程中很少看到有任何遊客在玩，多數的郵輪領隊、Youtuber也不知道如何玩，上了郵輪只會叫客人去餐廳吃到飽或四處亂逛，看多了只是讓郵輪旅遊變LO了。<\/p><p>Shuffleboard沙狐球要如何玩呢？好不好玩？今天就利用 <a target=\"_blank\" rel=\"noopener\" href=\"https://www.facebook.com/hashtag/%E9%86%92%E5%90%BE%E6%97%85%E9%81%8B%E7%B3%BB\">#醒吾旅運系<\/a> 的郵輪專業教室的教材教具來說明一下如何玩Shuffleboard沙狐球。<\/p><p>沙狐球有很多種形式，在此先以在甲板上常見的二邊有數字的為例。<\/p><p>首先，甲板上的沙狐球道約有4.75公尺，在兩端有三角得分區的的長方形場地。每個玩家或隊伍都會分到4個扁扁的圓盤球和一根球桿。圓盤球有兩種顏色，通常是黃色和黑色，直徑15厘米，厚度1.4到2.5厘米。球桿是一根不長於2米的杆子，在推的一段有U型分叉。<\/p><p>二組玩家分別輪流滑所屬顏色的球，直到所有球都滑完。從玩【黃色球】的玩家開始，在他們的回合，玩家把他們的球放在他們一側距離得分區的「十分外」區域內，然後將球射向另一端的得分三角。<\/p><p>黃色球玩家的球從場地左側發出，黑色球玩家從右側。玩家的杆在發射球時不能推過得分區域。球必須越過「中線」，它在距離另一端的得分區前0.9米的地方，但不能到場地邊緣；沒有越過線的球或觸到邊緣的球都會被從場地移走。<\/p><p>玩家試圖把他們的球打入高分區並把他們對手的球打到低分區或完全打出場外。沙狐球的三角得分區域被分為6個區域；球必須完全進入這之間的一個區域才能得分。擊入三角的頂點區域的球得10分，擊入頂點下兩個區域之一得8分，擊入8分區下兩個區域之一得7分。停在「十分外10 OFF」區域的球會減掉它所屬的玩家或隊伍10分。<\/p><p>註：比較嚴格的規定<\/p><p>● 發球時超過發球區，扣5分。<br/>● 發球時身體不能越過邊界線，扣5分。<br/>● 因犯規被打落的沙狐球會還給對手重玩。<\/p><p>獲勝方式有二種<\/p><p>● 從場地的一端滑沙狐球，直接依分數判定獲勝。<br/>● 由兩端輪流滑沙狐球累積獲得75分以上者獲勝。<\/p><figure class=\"ph\">照片<\/figure><p>好啦！下週上課時我們就要分組練習看看，讓大家未來有機會帶團上郵輪時，記得要很熟悉地教你們的客人如何玩喔。<\/p>"}, {"id": "f1684455418", "date": "2023-05-19", "title": "【張忠謀先生對大學生的真切提醒】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【張忠謀先生對大學生的真切提醒】 字字到位，句句真誠。 引用與大學生有關內容供在學學生細讀；尤其是最後一句總結：如果你在大學時不好好準備一個謀生的技能，你後來會發現這社會並沒有很歡", "len": 659, "body": "<p>【張忠謀先生對大學生的真切提醒】<\/p>\n<p>字字到位，句句真誠。<\/p>\n<p>引用與大學生有關內容供在學學生細讀；尤其是最後一句總結：如果你在大學時不好好準備一個謀生的技能，你後來會發現這社會並沒有很歡迎你。<\/p>\n<p>常想起當年考大學沒有好好選擇科系，沒有好好在學習中對準自己的天賦與熱情，實實在在地浪費了最有活力與企圖心的年少歲月。<\/p>\n<p>------------以下是陳和謙醫生節錄張忠謀部分演講內容---------------<\/p>\n<p>問：大學生涯對未來職場發展，即人格特質和能力有何影響？<\/p>\n<p>答：我想這個問題要分兩部分來回答。<\/p>\n<p>第一部分就是大學生涯對人格有什麼影響，<\/p>\n<p>第二部分就是對能力有什麼影響。<\/p>\n<p>對人格，大學對人格的影響，我認為比較少，因為進大學的時候通常都已經蠻成熟了。而且影響人格有許多因素，家庭教育、從小交的朋友，而一個人進大學已經 18 歲了。<\/p>\n<p>對能力的影響，大學我覺得很大。我一直認為，進大學你第一要學會的，就是將來謀生的能力，我這個話有人不歡迎我講，可是我覺得他們的想像其實已經過時了，他們的想像是認為，他們到大學來是要享受知識、享受得到智慧，我想在古希臘的確是有這個想法，一直到 19 世紀，恐怕都還有這個想法。可能到 20 世紀，變化就很大了，上大學的人多了，職場上的競爭加劇了。<\/p>\n<p>你在大學假如沒有好好的學到一門謀生的本領，一出去，你馬上就會面臨你認為是很醜惡的世界 ── 其實這個世界本來就在，只是你要準備它，你準備它的話，這就不是醜惡的世界了。可是你不準備的話，你在大學不準備，一個謀生的本領的話，你會發現這個世界，並不很歡迎你。<\/p>\n<p>Ｑuote: 陳和謙醫師臉書專文在留言處<\/p>"}, {"id": "f1684196229", "date": "2023-05-16", "title": "【大港的女兒】", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【大港的女兒】 快選舉了，台灣整個社會又熱了起來，無論那種顏色我都曾用選票支持過，有時對有時錯，沒關係，這就是真正的民主。 我自己可以決定我想支持誰，而且投錯了可以下次再投，說錯了", "len": 734, "body": "<p>【大港的女兒】<\/p>\n<p>快選舉了，台灣整個社會又熱了起來，無論那種顏色我都曾用選票支持過，有時對有時錯，沒關係，這就是真正的民主。<\/p>\n<p>我自己可以決定我想支持誰，而且投錯了可以下次再投，說錯了不用被清算逃亡一生，當老師的可以在課堂上東說西談，不會突然消失。<\/p>\n<p>-------以下是讀書心得----------<\/p>\n<p>是因為作者陳柔縉才將此書從圖書館架上借出，因為多年前讀過【總統的親戚】深深感受到文字可以陳述如此多關係，再對照在中華徵信所工作時曾經與前輩同事共同編寫過【Top500台灣企業排名】時，好像重新看透了社會中人與人之間的關係。<\/p>\n<p>可惜作者在2021年因為交通事故突然離世，這本著作應該是她用筆觸及細膩的女性角度來書寫台灣故事的代表作。故事從我很不熟悉的高雄港出發，用台灣近代被殖民被統治的大環境為舞台，以一位成功的女性企業家-愛雪的一生努力、溫柔的堅持、勤奮地打拼直到今日的向上歷程，來鼓舞每一位生於這島上，拚命靈活又恆毅堅持的台灣人，描寫出每一個致力於在多元文化中理出未來的台灣人，陳述一條屬於台灣人的路。<\/p>\n<p>上郵輪課程時常告訴學生，大船在命名時常以女性來稱呼，所以鮮少聽到什麼郵輪名叫亞歷山大號或威廉號，都是公主、女王、美麗芬芳之詞命名。因為船就像女性乘載著所有乘員，包容保護著大家平安地將所有人事物帶往心之所向；而在作者的文字中同時也深刻地感受到她所描繪的台灣島、女兒、妻子、母親，都像大船一樣堅實平穩地載著所有很容納的人事物駛往目的地。<\/p>\n<p>這幾年國際社會很不看好台灣的情勢，可以讀一讀此書就會發現身為台灣人，動盪與不安是我們的常態，堅持與樂觀是台灣人的靈魂，我們無法要求鄰近的大國成天說三道四，但是可以自我建構出屬於台灣的人設，我們是太平洋中巨大母艦中的船員，島在人在家鄉在。<\/p>\n<h1>每週推薦書單<\/h1>"}, {"id": "f1683426598", "date": "2023-05-07", "title": "🆖【社交負面人格測試】🆗", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "🆖【社交負面人格測試】🆗 有點準的測驗，你願意看看自己有多暗黑嗎？一年過去，你的社交負面人格測試結果有改變嗎？去年有做的朋友可以對照看看喔！ 🈸想做測試的就點留言處喔🃏 以六大指標", "len": 321, "body": "<p>🆖【社交負面人格測試】🆗<\/p>\n<p>有點準的測驗，你願意看看自己有多暗黑嗎？一年過去，你的社交負面人格測試結果有改變嗎？去年有做的朋友可以對照看看喔！<\/p>\n<p>🈸想做測試的就點留言處喔🃏<\/p>\n<p>以六大指標的中位數300來看，少於300分的者就是社交人格正面大於負面的人。<\/p>\n<p>我的社交負面人格測試結果是 偏執: 64, 支配: 46, 多疑: 33, 算計: 33, 冷漠: 23, 誇張: 21 ，總分 220 ，每個指標應該都是0-100的相對性問題，簡單說以【偏執】來看，如果這世上只有100個人，我就是排名第36名的偏執者；所以如果我是100分，那我就是偏執第1名。<\/p>\n<p>沒有好壞之分，就是可以多多認識自己與他人的認知。<\/p>\n<p>有六大指標，#udnstyle 解析放在連結處⬇️很有參考性。<\/p>\n<p>祝大家假日平安，身體健康。<\/p>"}, {"id": "015d3ea0", "date": "2023-04-29", "title": "如何申請外勞協助家中的高齡照護？", "cat": "老後提案", "src": "方格子", "url": "https://vocus.cc/article/644cae70fd897800015d3ea0", "ex": "如果突然間你的家人生病倒下了，你在上班工作忙得焦頭爛額，忙碌的你要如何面對？請假放下工作回家照顧？請沒有工作的家人照顧？ 巴氏量表 第一步 帶家人申請巴氏量表 第二步 透過合法人力", "len": 521, "body": "<p>如果突然間你的家人生病倒下了，你在上班工作忙得焦頭爛額，忙碌的你要如何面對？請假放下工作回家照顧？請沒有工作的家人照顧？<\/p><p><b>巴氏量表<\/b><\/p><p>第一步 帶家人申請巴氏量表<br/>第二步 透過合法人力仲介申請外籍看護<br/>第三步 合宜的外籍看護到家<\/p><p>以上的三步驟是詢問後簡化的處理流程，先單就費用成本列示，以便了解自己是否有能力申請全職外籍的居家照護。<\/p><p><b>印尼人力仲介代辦費用如何算<\/b><\/p><p>國內仲介費：28000元(這是電洽獲得的資訊，實際支出再更新)<br/>國外文件費：2萬出頭(這是電洽獲得的資訊，實際支出再更新)<br/>服務範圍：外籍勞工之招募面試，雙方需求溝通及來台流程，到宅後的適應溝通等等。以上為一次性費用，由仲介業者收取。<\/p><p>再者為外籍勞工月薪：家戶支出26400元(最低薪資)內含健保、就業安定金等，外勞實拿約台幣21K。因此以一個家庭來說，在平均情形之下，每位外勞在家中要額外支付仲介５萬元的申請費用及每年給外勞個人32萬台幣的薪資費用。<\/p><figure class=\"ph\">照片<\/figure><p><b>從申請開始要等三至四個月外勞才會到家<\/b><\/p><p>依電洽得知印尼籍外勞從申請到順利來台需要三至四個月，每個有需要的家庭要預留這樣的行政及照護時間，以防家中緊急需求突然而來。這都只是開端，所以我開始記錄我所經歷的事，將原本擔心的事轉成處理的過程，一步步地與家人共同老去。<\/p>"}, {"id": "f1682741944", "date": "2023-04-29", "title": "【台灣專業最強高工將被退場⁉️ 】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【台灣專業最強高工將被退場⁉️ 】 新聞：台東東公高工列入專輔 喜歡動手做是人類的天性，因為工作因素全臺到處招生，過去在花蓮時東公高工去過二次參加招生博覽會，學生的作品及專業很佩服", "len": 593, "body": "<p>【台灣專業最強高工將被退場⁉️ 】<\/p>\n<p>新聞：台東東公高工列入專輔<\/p>\n<p>喜歡動手做是人類的天性，因為工作因素全臺到處招生，過去在花蓮時東公高工去過二次參加招生博覽會，學生的作品及專業很佩服老師的傳承與教學，結果十多年過去，因為少子化東公高工仍被大部列入專案輔導學校，正式進入私校安寧病房。<\/p>\n<p>而在北部桃園大溪其實也有一所私立至善高中有專業的木工科，很怕大家不知道，其實這些學校會招不到學生不是因為教學不力，老師不優；而是反問自己身為家長你會送孩子去學木工科嗎？<\/p>\n<p>多年來教育體制的評量方式就只是拿著筆在寫答案，要記要背要填字答題。所以動手做的技職教育每個社會上的人都說很重要，但是學校附近安親補習都是做評量卷，跑馬燈上流動著【段考數學100陳OO 100林OO 99王OO】；有錢人讓孩子學小提琴、鋼琴音樂班，海報上貼著【張ＯＯ、邱OＯ音樂檢定合格】。所以原因除了少子化之外，這個社會的氛圍及教學主管機關的視野影響著學習的選擇。<\/p>\n<p>感念觀光餐旅行業因為曾出過吳寶春、阿基師、嚴總裁等等職人典範，又被社會媒體讚揚推廣，也才讓家長送孩子學習觀餐學群不會感到失望與憂慮；但是教育部以每年5%的名額減少技職觀旅群的名額，從根慢慢地將觀光餐旅業人才培育減少養份，很可惜！未能利用學習熱潮與趨勢由基礎改善整個社會的質感，反而短線地搖擺學習的走向，這十年來什麼元宇宙、NFT、地元、創生、甚至是AI等等，不也都潮起潮落隨浪淘盡嗎？<\/p>"}, {"id": "01c86910", "date": "2023-04-19", "title": "台灣高鐵實習第三關面試過關技巧TIPS", "cat": "技職教育", "src": "方格子", "url": "https://vocus.cc/article/644006d9fd89780001c86910", "ex": "照片 面授過關心法，我們的學生在眾多競爭者中進入了第三關-面試。(開心)到了這關最重要的事就是要為自己拍拍手，在眾多的人選之中終於進到了最後的人緣關。 高鐵實習第三關面試 1.廣播", "len": 1150, "body": "<figure class=\"ph\">照片<\/figure><p>面授過關心法，我們的學生在眾多競爭者中進入了第三關-面試。(開心)到了這關最重要的事就是要為自己拍拍手，在眾多的人選之中終於進到了最後的人緣關。<\/p><p><br/>高鐵實習第三關面試<br/><b>1.廣播詞<\/b><br/>桌上會有張幾句中英文短句的稿子，就有自信地用你的聲音念出來，這是最基本的流程。會要求用台語，這需要練習，請找幾個例句來練習。<br/><b>2.中英文自介準備<\/b>（聽說可能不會有，但是建議準備一下）<br/>這部分一定要先準備好約2分鐘的內容，中文的內容起手式就是學經歷，用最真誠熟悉的自我介紹來開場是最能讓自己進入心流的方式，一下子緊張感就會消失；在英文自我介紹的方式就相同，如果英文不好建議同學可以利用ChatGPT的AI智能當你的小幫手，請它就你的中文自介給你一個符合你實力的1-2分鐘英文介紹，再努力背起來，好好朗讀個十次，找老師或英文好的同學協助你正音，也可以錄起來，聽聽自己的發音與語調，都是幫助你完成英文自介的好工具與方法。<br/><b>3.問與答<\/b><br/>高鐵是服務業，實習生是學生，所以口試官多半會以此為切入點去問問題，就當聊天但要切題回答。<br/>(1)有做過服務業有發生過什麼印象深刻的顧客服務過程，你如何處理?<br/>(2)你覺得自己有什麼優點？ 在校表現如何？<br/>(3)你覺得暑期實習生可以學到什麼呢？<\/p><p>-----------我是分隔線--------------<br/><br/>在這兒離題一下談一談自己曾經在復興航空地勤的面試經驗，我記得那是一個快退伍的日子，我用面試通知向部隊請了假出門面試，很容易緊張的我當然是睡不好又鬧肚子，所以沒什麼輕鬆愉快的經驗可以分享，只是想告訴每位將要面試的同學，只要妳/你在乎就會很難受，就會有得失心，甚至會想放棄不出現。<\/p><p>復興航空在台北車站中興保全總公司大樓，我從桃園龍岡直接出發坐火車去面試，當天的人不多，可能是因為前面的筆試已經過濾了不少人，更可能的是當年復興航空就是個國內線的小公司，也不流行走服務業，所以應徵的人不太多。<\/p><p>當天流程如下：<br/>1.中英文自我介紹：<br/>約1-3分鐘，會分別有口試官先問制式問題，引導你開始進行中英文自我介紹。<br/>2.現場問與答：<br/>當年的問題回想如下，<br/>(1)你是男生為什麼要應徵中正機場的地勤櫃台？<br/>(2)如果現場開櫃要清晨三點你有交通工具嗎？<br/>(3)說明一下你想象的櫃台工作會有那些內容？<br/>(4)如果這個工作沒有錄取你，你會如何進行下一步安排？<br/>(5)從之前做的測驗來看，我們知道你的性向，現在你可以說明一下你覺得自己有什麼樣的特質是合適於這份工作？<\/p><p>後來過了幾天我收到了錄取通知，但是我沒有去報到，因為他們的問題也讓我想了一下自己的職涯規劃，放棄了在中正機場復航地勤的機會。後來常換工作，漸漸發現面試時也是認識這家公司的好機會，看看什麼樣的人在面試你，公司氣氛如何？你會慢慢發現自己的選擇與喜好。<\/p><p>祝福我的學生努力有好的結果，機會是留給準備好的人。<br/><br/><\/p>"}, {"id": "f1681522822", "date": "2023-04-15", "title": "【念高職？念高中？】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【念高職？念高中？】 引文：「陳安儀提到：以我女兒來說，她在泰北高職的三年過得非常紮實。雖然她不擅長學科，當年學測成績除了國文能到均標之外，其他科成績都遠遠墊後，但最終卻以優異的統", "len": 344, "body": "<p>【念高職？念高中？】<\/p>\n<p>引文：「陳安儀提到：以我女兒來說，她在泰北高職的三年過得非常紮實。雖然她不擅長學科，當年學測成績除了國文能到均標之外，其他科成績都遠遠墊後，但最終卻以優異的統測成績進入世新大學。<\/p>\n<p>反觀我親戚的女兒功課還不錯，就讀普通高中，但學測時卻因為一科英文未到均標，結果她連我女兒就讀的科系都填不了！」<\/p>\n<p>-------簡化一下------<\/p>\n<p>泰北高職考學測(難) 沒錄取<\/p>\n<p>泰北高職考統測(易) 錄取(世新)<\/p>\n<p>普通高中考學測(難) 沒錄取(世新)<\/p>\n<p>普通高中考統測(Ｘ) 不能考<\/p>\n<h1>學測統測分不清<\/h1>\n<h1>學測是高中生在考<\/h1>\n<h1>統測是高職生在考<\/h1>\n<h1>高中生不能報考統測​<\/h1>\n<h1>高職生可以報考學測<\/h1>\n<h1>世新大學可以同時錄取學測及統測的考生<\/h1>\n<h1>科技大學只能錄取統測的考生<\/h1>\n<p>看到這兒如果你的孩子要上高中或高職，你會如何考量？<\/p>\n<p>想看親子教育專家文章請看留言連結<\/p>"}, {"id": "010cb82e", "date": "2023-04-12", "title": "台灣高鐵實習第二關筆試過關技巧TIPS", "cat": "技職教育", "src": "方格子", "url": "https://vocus.cc/article/64368a13fd897800010cb82e", "ex": "照片 數週前在台灣高鐵工作的旅運系學姊私訊一則暑期實習機會，當下趕緊轉給班上升大三的導師班，鼓勵有心同學可以投遞看看。先恭喜剛剛才收到書審第一試過關通知的幾位同學。在此，提供202", "len": 743, "body": "<figure class=\"ph\">照片<\/figure><p>數週前在台灣高鐵工作的旅運系學姊私訊一則暑期實習機會，當下趕緊轉給班上升大三的導師班，鼓勵有心同學可以投遞看看。先恭喜剛剛才收到書審第一試過關通知的幾位同學。在此，提供2023年最新的高鐵實習面試內容，希望老師幫大家抱來的佛腳，大家好好抱緊處理。<br/><br/>以下的內容整理自所有實習學生筆試經驗總和，在此一併感謝常常提供實習機會的旅運系學姊，以及不斷在面試中學習的歷代實習生。<br/>------------我是分隔線----------------<\/p><p>第二關：筆試(2023.4.16)<br/>地點：桃園高鐵運務大樓 高鐵桃園站5號出口<\/p><p><b>英文：<\/b>克漏字、文法、閱讀測驗<br/>50題 30分鐘<br/>TIPS：英文要看實力，沒實力就用語感去猜或填C。<\/p><p><b>邏輯：<\/b>類似性向測驗、空間圖形推論<br/>50題 22分鐘<br/>TIPS：前面會有四個圖形，你要選第五個圖形，這可以練習<\/p><p><b>數學分析：<\/b>數學應用題 (有三角形角度/長寬/圓等等)<br/>35題 10分鐘<br/>TIPS：先將會寫的寫完，不會寫的空著，不要卡在難題，10分鐘內去找有機會對的題目來寫。<\/p><p><b>作文題目：<\/b>兩題 200字以上 15分鐘<br/>參考例題：如何成為一個優秀的高鐵人員<br/>參考例題：高速鐵路對台灣的價值<br/>參考例題：我所認知的高鐵服務<br/>參考例題：高鐵所擔負的責任<br/><b>情境題：<\/b><br/>如果連假位子都滿了，現在旅客該怎麼安撫<br/>如果團體有人趕不上車，要如何排解旅客的抱怨<br/>TIPS：建議同學先依高鐵<a target=\"_blank\" rel=\"noopener\" href=\"https://www.thsrc.com.tw/corp\">公司網站<\/a>上的企業介紹，先寫一個２００字的稿子，背下來去再用抄背改寫的方式，寫起來會很順。<br/><br/>其實這陣子以來我們這些當老師的只能在高鐵企業書審前，耳提面命繳件時效將至，協助修改支離破碎的履歷及家有老小民主自由的自傳，整理出一個樣子之後寄出，在考前鼓勵說聲大家好棒棒，結束後說沒關係下次再來等等。<br/>除此之外，老師其實是很廢的，還是這些勇敢嘗試的同學令人佩服。<\/p><p>祝大家筆試過關。<\/p>"}, {"id": "015adfdd", "date": "2023-04-11", "title": "15K的困境", "cat": "技職教育", "src": "方格子", "url": "https://vocus.cc/article/6434a462fd897800015adfdd", "ex": "班上大多數的學生都有打工，原因無他，經濟因素。 照片 這是身為技職老師在經營班級時要先有的認知，這樣的情形在私立比公立多，科大比大學多。我常看到學生白天上課，晚上打工，平日上學，假", "len": 583, "body": "<p>班上大多數的學生都有打工，原因無他，經濟因素。<\/p><figure class=\"ph\">照片<\/figure><p>這是身為技職老師在經營班級時要先有的認知，這樣的情形在私立比公立多，科大比大學多。我常看到學生白天上課，晚上打工，平日上學，假日打工。那麼多的時間去打工了，用時薪180元每月可以賺多少錢呢？我問了幾位學生都說扣除上課之外，差不多一個月平均可以賺15000元。這15K代表著每位打工學生一個月中有20天以上每天要到班4小時。<\/p><p>所以對技職科大打工的學生來說，為了增加15K的月收入=沒有作業討論的時間=沒有深度學習的時間=沒有發展自我的時間=沒有同儕社團的時間=沒有發展親情友情甚至是愛情的時間。<\/p><p>技職科大與一般大學最大的不同在於有一年18學分的校外實習，會安排學生在畢業之前就自身所學的專業，與相關企業進行一整年的工作安排，這是多半社會都知道的。但大學法規定學生畢業要修完128學分以上，當有一整年無法在校修課卻只能修得20學分，其他的108學分就得在學期間努力修完，平均一年修36學分。所以社會上不知道的是，技職學生在校期間修課的時數較一般大學較為緊迫，也就壓迫了學生課餘打工的時間，讓他們獲得15K的空間與時間更為壓縮。<\/p><p>這是學生的困境，老師的難題，更是社會的實境秀；當我們常常在下班後看到店頭裡服務著大家的年輕面孔時，也許她／他就是為了月入15K放棄了去學語文、考證照、玩社團、交朋友的學生。給她／他一個微笑與謝謝吧！<\/p>"}, {"id": "f1680920314", "date": "2023-04-08", "title": "整理一下最近協助同學進行企業實習面試時常出現的問題，不用…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "整理一下最近協助同學進行企業實習面試時常出現的問題，不用對號入座玻璃心，只要一一檢視改進。 連繫時： 1.求職EMAIL沒有主旨或是只寫姓名 2.Email的本文中沒有受文者及屬名", "len": 363, "body": "<p>整理一下最近協助同學進行企業實習面試時常出現的問題，不用對號入座玻璃心，只要一一檢視改進。<\/p>\n<p>連繫時：<\/p>\n<p>1.求職EMAIL沒有主旨或是只寫姓名<\/p>\n<p>2.Email的本文中沒有受文者及屬名<\/p>\n<p>3.附件CV資料未整合為一份PDF，讓面試者自己去找附件<\/p>\n<p>4.履歷CV沒有照片，或是隨意放一張不合宜的照片<\/p>\n<p>面試時：<\/p>\n<p>1.遲到甚至No Show<\/p>\n<p>2.面試衣服沒有燙<\/p>\n<p>3.頭髮要整理，勿染<\/p>\n<p>4.隨身要再帶一份CV資料及自用筆<\/p>\n<p>5.隨時要有英文或外文自我介紹的準備<\/p>\n<p>先這樣，多數同學因為今年航空旅遊實習機會大出，已找到自己心儀的單位，但是老師提醒在入職後的1-3個月才是重點，請在入職前依舊要有以上嚴肅心態，時時提醒自己。特別是在有用英文環境的實習生，請在入職前時常練習語言聽說讀寫能力，善用最後在校期間達到自己的語言目標。<\/p>\n<h1>醒吾旅運系<\/h1>\n<h1>醒吾旅運<\/h1>\n<h1>瑞峰老師課程設計<\/h1>\n<h1>瑞峰老師實習輔導<\/h1>"}, {"id": "f1679958347", "date": "2023-03-28", "title": "有讀過夏綠蒂的網嗎？", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "有讀過夏綠蒂的網嗎？ 小豬韋伯與蜘蛛夏綠蒂是農場中的好朋友，農場中的豬養來就是要被殺來吃的，但是韋伯不認命，因為有好朋友的幫忙與照顧，韋伯展開了一連串與生死攸關的絕地努力。 而蜘蛛", "len": 722, "body": "<p>有讀過夏綠蒂的網嗎？<\/p>\n<p>小豬韋伯與蜘蛛夏綠蒂是農場中的好朋友，農場中的豬養來就是要被殺來吃的，但是韋伯不認命，因為有好朋友的幫忙與照顧，韋伯展開了一連串與生死攸關的絕地努力。<\/p>\n<p>而蜘蛛夏綠蒂用盡一切力量與智慧幫助小豬韋伯贏得大賽後，幫助小豬找到生存下來的理由與價值；夏綠蒂形容他們倆未來最最期待的日子是：<\/p>\n<p>「這秋天的日子會漸漸變短、變冷，樹上的葉子會搖晃著脫落。聖誕節會到來，然後是冬天的雪。——冬天過去後，日子會漸漸變長，牧場池塘的冰會融化。歌雀會回來唱歌，青蛙會醒來，溫
