真正專心在了解的不多，將大家請出教室門，要求體驗活動時大家都三催四請，有些反應更是感覺到老師打擾到他們的手遊時間。<\/p>\n<p>所以教案的設計就要依次進行：<\/p>\n<p>1.分組輪流，緊盯公平性，以免有同學不作為。<\/p>\n<p>2.配合手機APP作業同步上傳活動照片，並且即時計分與按讚加分，沒參與沒上傳照片的同學就是沒分數。<\/p>\n<p>3.事後分享同樂形成共感。<\/p>\n<p>所以沒來上課的人不知道我們在做什麼，當然也有同學拿別人照片上傳，沒在公開網域捉包，但是可以私訊學生表示關心。<\/p>\n<p>這樣上課學生都覺得很有趣，只是設計活動的教師為了2節課，自費準備教具安排虛實教案，撐完2節下課之後，再與學生說話時都沒聲音了。<\/p>"}, {"id": "f1746538864", "date": "2025-05-06", "title": "三年多前導師新生訓練時所有學生都是載著口罩來報到的，隨著…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.5.6 三年多前導師新生訓練時所有學生都是載著口罩來報到的，隨著疫情的起起落落，時而線上時而見面，但也都只看到眼睛，整個臉都包在口罩裡。也記得特別為新生班招開的家長說明會", "len": 556, "body": "<p>2025.5.6<\/p>\n<p>三年多前導師新生訓練時所有學生都是載著口罩來報到的，隨著疫情的起起落落，時而線上時而見面，但也都只看到眼睛，整個臉都包在口罩裡。也記得特別為新生班招開的家長說明會，當日只接待了一組爸爸媽媽，女兒沒出現，但家長帶著期待與關心坐在我身旁聊了又聊。<\/p>\n<p>也許是因為載著口罩，看著父母的眼神，聽著他們的期待，可以感受到更多更深的期待。<\/p>\n<p>常在社群上看到有人在批評大學還要開家長會！<\/p>\n<p>是的，我們很堅持！<\/p>\n<p>教學與教育是需要溝通的，旅運系的老師們沒忘記投入教育的初衷，來自業界的我們更盡力地去嘗試找尋合適於技職學生的培育與訓練的方式，上課中難以補齊的，我們下課後免費再教；學生間的個別差異與個性，我們也一對一地聊天談心，鼓勵他們一試再試，勇敢向前。<\/p>\n<p>證照、競賽、專題、作業、社團、學生會等等活動，我們都依學生特質進行訓練，讓每位學生爭取自己的成就感，成為自己最想要的那個樣子。<\/p>\n<p>影片中的女孩就是三年多前家長會當天沒出席的學生，現任星宇航空實習生，五月初公司通知系上，學生實習表現優秀將於畢業後轉為正職，我們為學生開心，更為自己達到當時家長期待而感到得意。<\/p>\n<p>幾天後，女孩貼心地為招生到快瘋掉的老師做了段小影片，LINE裡留了一段話：謝謝老師的指導與照顧，能幫上老師的忙很開心！<\/p>\n<p>我們教專業、教學養、教禮貌、教出我們自己都覺得驕傲學生。<\/p>"}, {"id": "f1745819399", "date": "2025-04-28", "title": "開聲音聽配樂喔！", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "開聲音聽配樂喔！ 有沒有很熟悉？當你聽到這曲子時，你會想起什麼？ 常旅行的人，總會想起搭乘長榮航空時回到台灣時機艙中靜靜響起的配樂；對影片中的女孩而言，這是伴著她在松山機場運務工作", "len": 344, "body": "<p>開聲音聽配樂喔！<\/p>\n<p>有沒有很熟悉？當你聽到這曲子時，你會想起什麼？<\/p>\n<p>常旅行的人，總會想起搭乘長榮航空時回到台灣時機艙中靜靜響起的配樂；對影片中的女孩而言，這是伴著她在松山機場運務工作的每日氛圍，實習工作中的各種點點滴滴，酸甜苦辣的學習經歷都是學生成長的養份。<\/p>\n<p>醒吾旅運與長榮立榮合作實習多年，系上的航空教師都來自於這家深根台灣航向全球的偉大企業，當然現在就讀醒吾旅運的同學也早已將空服老師當成成長典範，期待有那麼一天可以穿上綠袍服務。<\/p>\n<p>蕙欣做到了，因為她在校學習時科科名列前矛，總是班上前三名，而且積極參與系上活動，擔任導師班班長、系學會會長、畢聯會代表，是老師們的最佳助手、得意門生，祝福成熟又貼心的她在畢業後前程似錦，事事順利，鵬程萬里。<\/p>\n<p>110畢業壢商外語<\/p>\n<p>111系學會班代<\/p>\n<p>113長榮松機地勤實習<\/p>"}, {"id": "f1745765753", "date": "2025-04-27", "title": "一早在惡夢中驚醒，內容是一家三口在旅行中走散，我也忘了訂…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.27 一早在惡夢中驚醒，內容是一家三口在旅行中走散，我也忘了訂晚上的飯店，又沒有提到要如何碰面，非常擔心家人無法團聚。 我最近心中掛心的事情太多，雖然都是微不足道的事", "len": 300, "body": "<p>2025.4.27<\/p>\n<p>一早在惡夢中驚醒，內容是一家三口在旅行中走散，我也忘了訂晚上的飯店，又沒有提到要如何碰面，非常擔心家人無法團聚。<\/p>\n<p>我最近心中掛心的事情太多，雖然都是微不足道的事，但卻層層交疊地將我困住，職涯、孩子、家人、經濟、健康等都是自尋煩惱，但卻無法放下。<\/p>\n<p>附圖是我拿二張統計表請AI做的，指標中的民國95(2006)年是我進入技職教育環境的第一年，當年統測全國考生還有25萬7千多人，而今年114 (2025)年統測考生只剩下7萬2601人😱。而且數字上沒有呈現的是，統測考生中可能有數千位考生跨考學測，未來將從一般大學與科大之間擇優入學；這就是我動盪不已的職涯與經濟來源，如果是你不會覺得擔心嗎？<\/p>"}, {"id": "f1745157855", "date": "2025-04-20", "title": "第三人生倒數833天", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.20 第三人生倒數833天 陪在清華念書的兒子吃頓美食，選了一家南大路上的泰式料理，氣氛及食物都有水準。放上IG之後才知道這是家排隊店，我們在週日的晚上只等了半小時就", "len": 434, "body": "<p>2025.4.20 第三人生倒數833天<\/p>\n<p>陪在清華念書的兒子吃頓美食，選了一家南大路上的泰式料理，氣氛及食物都有水準。放上IG之後才知道這是家排隊店，我們在週日的晚上只等了半小時就有個好位子用餐，而且廁所非常乾淨，可以看到店家的用心。<\/p>\n<p>兒子念書念得累，幾乎天天都睡不飽，送他回學校時也只是送到了24小時的圖書館讀書區，看著他的背影真的很不捨，就像他自己在吃飯時說的，人生不用那麼累，有很多可以追求的事，不必將所有的時間與精力都放在學習上，我也表達支持與認同，至少對我來說，有他當兒子與家人，可以一起享受世界的美好就很棒了，什麼成功與成就就隨緣，不是一種必要的執著執念。<\/p>\n<p>家人一直拿資源與未來當成不能放棄的想法，觀點與觀念不同很難認同，她不能用自己的期待來套在我們身上，我們也有自己的人生觀，想多一點對世界的好奇與快樂追求才是我的真理。<\/p>\n<p>最近工作很心累，又因為收入可能不穩定讓自己緊張不已，想休息的念頭從來沒有停過，我期待的也不多，就是希望可以排個獨自旅行的休假，好好地面對自己。<\/p>"}, {"id": "f1745036533", "date": "2025-04-19", "title": "第三人生倒數834天", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.19 第三人生倒數834天 每年的春天很容易讓人心煩，想考博班太晚，想規劃旅行活動又發現機票太貴，荷包空空，天氣忽冷忽熱的讓家中的衣櫃和心情一樣亂，再回頭看看自己的年", "len": 652, "body": "<p>2025.4.19 第三人生倒數834天<\/p>\n<p>每年的春天很容易讓人心煩，想考博班太晚，想規劃旅行活動又發現機票太貴，荷包空空，天氣忽冷忽熱的讓家中的衣櫃和心情一樣亂，再回頭看看自己的年歲與期待，意亂不已。<\/p>\n<p>一早讀到這段文字，出自德川家康的遺訓，在靜岡的久能山東照宮可以看到全文，日文我看不太懂，所以請AI幫忙翻為文言文，藉由文字的反覆理解，稍稍有點緩解自己心底的急燥。<\/p>\n<p>人生如負重而行遠道，不可疾行。<\/p>\n<p>以不自由為常，則無所不足。<\/p>\n<p>若心生所望，當思困窮之時。<\/p>\n<p>堪忍者，無事長久之本。<\/p>\n<p>怒者，視為仇讎。<\/p>\n<p>唯知勝而不知敗，禍將及身。<\/p>\n<p>責己勿責人。<\/p>\n<p>不及勝於過之。<\/p>\n<p>再翻為白話文好像少了點思量，我自己是比較喜歡文言文，可以對照自己的心境來解釋家康當年的想法。<\/p>\n<p>人の一生は重荷を負ひて遠き道をゆくが如し。｜人的一生就像背著重擔走一條遙遠的路。<\/p>\n<p>いそぐべからず。｜不能急躁，要慢慢前進。<\/p>\n<p>不自由を常と思へば不足なし。｜如果把不自由當作理所當然，就不會覺得匱乏。<\/p>\n<p>こころに望おこらば困窮したる時を思ひ出すべし。｜一旦心生慾望，就要想起曾經困苦的日子。<\/p>\n<p>堪忍は無事長久の基。｜忍耐是平安長久生活的根本。<\/p>\n<p>いかりは敵と思へ。｜憤怒要視為自己的敵人。<\/p>\n<p>勝事ばかり知りて、まくる事を知らざれば害其の身に至る。｜只知道追求勝利，而不懂得接受失敗，禍害就會降臨到自己身上。<\/p>\n<p>おのれを責めて人を責むるな。｜應當自我反省，而不是責怪別人。<\/p>\n<p>及ばざるは過ぎたるに勝れり。｜做不到的，比做得太過還好。<\/p>\n<p><a href=\"https://www.toshogu.or.jp/about/goikun.php\">https://www.toshogu.or.jp/about/goikun.php<\/a><\/p>"}, {"id": "f1744876446", "date": "2025-04-17", "title": "第三人生倒數836天", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.17 第三人生倒數836天 有些事做了，可以說嘴一輩子； 有些事只是想，會被嘴一輩子。 很感謝學生的引薦，無論未來如何，今日的恩情一定要記得。昨天看劇時有一句話很打動", "len": 595, "body": "<p>2025.4.17 第三人生倒數836天<\/p>\n<p>有些事做了，可以說嘴一輩子；<\/p>\n<p>有些事只是想，會被嘴一輩子。<\/p>\n<p>很感謝學生的引薦，無論未來如何，今日的恩情一定要記得。昨天看劇時有一句話很打動我，提到了「做決定」一事。<\/p>\n<p>同事問女主角：這陣子很難吧？<\/p>\n<p>女主角：其實還好，最難的事是做不了決定的時候。<\/p>\n<p>早已對教學的生活感到習慣，正常的收入及頻率讓自己難以回到服務業的職場之中，但自己深知從有此想法以來就表示，我的人生就到此為止，所有的精采與可能性都將為零。這陣子思考再三，左右為難，結果是劇中的台詞將我的思考化為行動。<\/p>\n<p>我先停下了文化建築都計博班的考量，並刪除了行事曆上的時間；並向在旅行業跑歐洲團的領隊學生請益兼職的可能性，他也很快地將可能的人脈轉介給我，非常感動，這是很不容易的事，因為旅行業我認識不少人，而且有很多人更以人脈見長，時常將關係掛在嘴上，但要有個碰面的機會都不容易，連向自己同學表達帶團爭取時，都會提起那是出團社的安排，不易呀不易。<\/p>\n<p>在未來職涯的對接上，我有必要從現在開始努力，因為也許在三年之後，我就會被迫辦理私校退休，我一點也不想在發生的當下不知所措，而是期待在這期間好好經營自己的社群，累積旅行團的專業與人脈，為未來做好準備。<\/p>\n<p>吉德國際旅行社-桔旅遊<\/p>\n<p><a href=\"https://www.lucky-travel.com.tw/about.html\">https://www.lucky-travel.com.tw/about.html<\/a><\/p>\n<p>緒煇國際旅行社<\/p>\n<p><a href=\"https://www.kevinstour.com/\">https://www.kevinstour.com/<\/a><\/p>"}, {"id": "f1744775364", "date": "2025-04-16", "title": "清大四系聯合宿營招工說明會", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.16 清大四系聯合宿營招工說明會 每個人都有自己想追求的目標，慢慢地可以感覺到孩子利用課業的努力與活動的參與在尋找自己的定位。 同時更讓我回想自己在年少時那種想做又不", "len": 456, "body": "<p>2025.4.16<\/p>\n<p>清大四系聯合宿營招工說明會<\/p>\n<p>每個人都有自己想追求的目標，慢慢地可以感覺到孩子利用課業的努力與活動的參與在尋找自己的定位。<\/p>\n<p>同時更讓我回想自己在年少時那種想做又不敢做，後來徒增遺憾的後悔心態。現在的老師工作好像是比較合適自己？有學生可以互動，也有自己學習成長的空間，更有固定的收入來讓家人依靠，其實真的沒什麼不好。<\/p>\n<p>昨天學校開了全校教師座談會，提出了每系招生的最低員額，日間部未達四十位學生註冊就退場；而且也在境外生與國內生中做了定義。在討論分享中，我確認了以下的結論，首先是在短期六至十年之間，我仍可以在醒吾旅運系工作，無需擔心太早退休的問題；其次是外籍生源有太多的變動性，不能做為系科可持續發展的要求，只能當成是額外的紅利；<\/p>\n<p>最後，我想為自己定位工作與經濟收入增加的方向，堅守教學生涯道路，增值教學內容與意義。<\/p>\n<p>(曾在年度計畫中寫下要增加家庭現金水位，2023年-2025年的目標以上述所提每月要多3萬元的收入，所以每年要多36萬的收入，努力在產學合作計畫長期撰寫，用計畫、授課、兼差等等來增加收入。)<\/p>"}, {"id": "f1744531757", "date": "2025-04-13", "title": "春日的台北科大考試很舒服，坐定在第一排位置上考試很心安。", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.13 春日的台北科大考試很舒服，坐定在第一排位置上考試很心安。 整張考試唯一改過的答案就是從對的45%改為錯的答案，更是昨晚準備時與孩子一同討論的那一題，水稻的種植佔", "len": 362, "body": "<p>2025.4.13<\/p>\n<p>春日的台北科大考試很舒服，坐定在第一排位置上考試很心安。<\/p>\n<p>整張考試唯一改過的答案就是從對的45%改為錯的答案，更是昨晚準備時與孩子一同討論的那一題，水稻的種植佔全球CH4甲烷溫室氣體排放量的12%，另外個畜牧業是33%，筆記上我還記著要了解為何水稻會有甲烷的排放。<\/p>\n<p>回家後看了資料後才了解原來是水稻的植物特性，不論來自土壤或是肥料的碳，於植物呼吸作用時，透過孔隙的開闔將其從土壤中吸收然後釋放至大氣中，產生由植物本身CH4的排放而非來自土壤的排放(2012柯佳吟)。<\/p>\n<p><a href=\"https://www.delta-foundation.org.tw/blogdetail/2301\">https://www.delta-foundation.org.tw/blogdetail/2301<\/a><\/p>\n<p>當然期待證照可以及格，讓投入的時間與精力都有個成果，但結果仍需要期待。下一步就是在年中時再努力多益考試，希望2025年可以達到800分的關卡。<\/p>"}, {"id": "f1744082991", "date": "2025-04-08", "title": "川普關稅衝擊各國經濟，台灣旅遊產業怎麼辦？", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "川普關稅衝擊各國經濟，台灣旅遊產業怎麼辦？ 儘管川普關稅戰已巨大地影響了台灣整體出口與經濟氣氛，因為人總是喜歡旅遊活動，只會轉向合理且合宜的地區，不會像疫情期間全面性的消退。 尤其", "len": 1534, "body": "<p>川普關稅衝擊各國經濟，台灣旅遊產業怎麼辦？<\/p>\n<p>儘管川普關稅戰已巨大地影響了台灣整體出口與經濟氣氛，因為人總是喜歡旅遊活動，只會轉向合理且合宜的地區，不會像疫情期間全面性的消退。<\/p>\n<p>尤其是台灣作為亞洲區域短程旅遊樞紐，仍具備潛力迎接轉單與轉向的區域旅客。特別是中國、日本、東南亞等鄰近市場若持續偏好短途旅遊，台灣可透過強化與東亞、東南亞各國之間的旅遊合作、簽證便利與航班增加，爭取更多亞洲區域旅遊紅利。<\/p>\n<p>但台灣旅遊內容的本質強化更為重要，對外不能再以便宜或親和等低附加價值為行銷重點，應著重在地特色文化體驗與永續觀光等重點，並鼓勵國家政策著重國內旅遊硬體及軟體的投資與獎勵，還有國際觀光客重視的人本交通、永續生態旅遊等配套規劃。<\/p>\n<p>鼓勵地方政府及中央各級單位加大觀光服務業的內部投資與觀點行銷著重來改善現狀，並且穩定從業者及消費者對經濟與政治安定的期待，才是全體台灣人共同面對重大國際不確定因素的重要關鍵。<\/p>\n<hr />\n<p>以下資料節錄並改編於04/04/2025 Wit記者Yeoh Siew Hoon報導<\/p>\n<p><a href=\"https://www.webintravel.com/trump-tariffs-and-travel-how-will-the-turbulence-play-out-in-asia/\">https://www.webintravel.com/trump-tariffs-and-travel-how-will-the-turbulence-play-out-in-asia/<\/a><\/p>\n<p>美國前總統川普於昨日宣布對多國祭出歷史性高額關稅，重創全球貿易，也讓亞洲旅遊業高度警戒。根據BBC報導，這波關稅被形容為「真正驚人的舉措」，可能導致「數千家公司、工廠甚至整個國家商業模式的崩潰」。<\/p>\n<p>除新加坡僅被課以10%基本稅率外，其餘亞洲國家如台灣與印尼（32%）、泰國（36%）、越南（46%）、柬埔寨與中國（49%、54%）皆面臨高額稅負，對區域經濟與旅遊產業造成嚴重衝擊。<\/p>\n<p>Thayer Ventures總經理Chris Hemmeter認為，全球互依性不容忽視，雖然短期內不確定性升高，但長期來看，旅遊業仍具韌性與恢復力。他補充，亞太地區（APAC）或能在這波動盪中保持相對穩定，因為中國旅客可能減少赴美轉而選擇區域旅遊。<\/p>\n<p><a href=\"https://www.thayerventures.com/\">https://www.thayerventures.com/<\/a><\/p>\n<p>在新加坡，旅遊專注投資基金Velocity Ventures合夥人Nicholas Cocks則擔憂，東南亞國家若無法以關稅反制，可能改以簽證限制或入境稅作為報復，進一步打擊觀光。且若市場不確定性持續蔓延，可能導致全球性經濟衰退，進而削減企業與個人旅遊預算。<\/p>\n<p><a href=\"https://www.velocityventures.vc/\">https://www.velocityventures.vc/<\/a><\/p>\n<p>然而，區域內旅遊或成為亞洲旅遊業的「避風港」。根據萬豪國際統計，其在亞洲區域內的旅客佔比已從疫情前的約38%上升至近60%。PATA與ForwardKeys則指出，截至2023年，亞洲旅客的國際旅遊中有80%選擇區域內目的地，高於疫情前的70%-75%。<\/p>\n<p>此外，世界銀行預估，至2030年東南亞中產階級人口將從1.35億增至3.34億，搭配低成本航空快速恢復，為區域短程旅遊帶來強勁動能。2024年OAG數據顯示，短程航班運能已恢復至疫情前的95%-100%，而長程仍明顯滯後。<\/p>\n<p><a href=\"https://www.oag.com/\">https://www.oag.com/<\/a><\/p>\n<p>中國旅客出境也呈現明顯內移趨勢。自2023年底起，超過六成的中國出境旅遊選擇亞洲目的地，反映經濟壓力與不確定性的現實考量。<\/p>\n<p>馬來西亞旅遊研究機構Pear Anderson總監Hannah Pearson回顧2008-2009年全球金融危機指出，亞洲旅遊業因依賴自身市場，在當時相對受創較小。她預測，即使高關稅影響中國、韓國、日本等主要客源市場，亞洲旅客仍將轉向短中程旅行。<\/p>\n<p><a href=\"https://www.pearanderson.com/\">https://www.pearanderson.com/<\/a><\/p>\n<p>文章樂觀地認為：亞洲旅客可能不再飛太遠、花太多錢，但他們還是會旅行。<\/p>\n<hr />"}, {"id": "f1744040425", "date": "2025-04-07", "title": "我的職涯就如同這幾天的關稅戰般地上沖下洗，四處都是風聲，…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.7 我的職涯就如同這幾天的關稅戰般地上沖下洗，四處都是風聲，有要減薪，有看別人想離職的，自己也一直在準備輔大博士班及新的計畫與考量。 用文字記錄下這陣子校園中的耳語，", "len": 367, "body": "<p>2025.4.7<\/p>\n<p>我的職涯就如同這幾天的關稅戰般地上沖下洗，四處都是風聲，有要減薪，有看別人想離職的，自己也一直在準備輔大博士班及新的計畫與考量。<\/p>\n<p>用文字記錄下這陣子校園中的耳語，同時也就放下了。<\/p>\n<p>告訴自己職涯就是人生的起伏，有轉變才有風景，有爭取才有機會。努力訓練自己的身體可以跟上每一次改變，用愛自己來強化心理強度來面對挑戰，只為自己身體與心理的開心與快樂而努力。<\/p>\n<p>如果無法掌握自己生命時間的品質，那擁有再多的金錢都是沒有意義的，從今天起，我將不再為任何職涯上的威脅而感到恐懼，因為最珍貴的是我所存不多的黃金時間，無論是教學、研究或產學的工動都要以互動品質為最優先，與學生的互動要深刻用心，研究上的推進要專注且專業，最好能同時優化自我的語言能力，產學上的互動更是要以增加收益及成績為出發點，不要為任何公司做白工，更是要為自己投資獲利能力。<\/p>"}, {"id": "f1743915516", "date": "2025-04-06", "title": "這幾天在整理博士班的研究方向，腦中所思維的原則只有一個：…", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.6 這幾天在整理博士班的研究方向，腦中所思維的原則只有一個：如何在現有的專業與工作之中，完成博士論文研究的進程，達成自我雙贏的人生策略。 現有的工作收入主要為正職教學", "len": 687, "body": "<p>2025.4.6<\/p>\n<p>這幾天在整理博士班的研究方向，腦中所思維的原則只有一個：如何在現有的專業與工作之中，完成博士論文研究的進程，達成自我雙贏的人生策略。<\/p>\n<p>現有的工作收入主要為正職教學工作及課後證照班，另外希望可以利用計畫爭取來增加業內收入；此外實習輔導工作是義務，現在已經利用計畫的結合讓實習輔導成為計畫成效的一部分。<\/p>\n<p>＃博士是目標不是夢想<\/p>\n<p>所以當心中在自問念那個學校的博士學位是否重要？為何不是頂大好學校？因為劉哥以過來人的身份建議博士班最好是不用修課以寫作研究為主，才不會浪費額外的時間上課寫作業，這點當時聽到時就非常認同，後來才會以輔大心理學博士班為唯一方向在準備。<\/p>\n<p>＃學術英文寫作要堅持<\/p>\n<p>How can I persevere in academic writing in English? I still struggle with my limitations in this area. I truly wish I could express my thoughts and points of view fluently in English, and be able to discuss with colleagues at academic conferences. How can I maintain my passion? I wonder.<\/p>\n<p>論文寫作的載體是中文還是英文？這件事我仍非常煎熬，很期待自己未來全面的寫作以英文為載體，中文書寫為生活自在所用，學術書寫及發表全以英文來進行，這件事我仍想堅持。<\/p>\n<p>＃收入增加是唯一目的<\/p>\n<p>如何念博士班賺錢？我想到方式是自媒體，阿伯考博班，阿伯念博班，這是自己的興趣，所以開始拍片剪片最重要，第一支影片就是【回輔大考博士班】。<\/p>"}, {"id": "f1743646822", "date": "2025-04-03", "title": "新聞都是川普，但我也不知道為什麼我要花時間來研究關稅？", "cat": "理財情報", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.4.3 新聞都是川普，但我也不知道為什麼我要花時間來研究關稅？ 是因為會影響我的收入嗎？其實不會，我的主要收入是醒吾給的薪水，而股市中的五十幾萬是部分的投資遊戲，反而是我", "len": 489, "body": "<p>2025.4.3<\/p>\n<p>新聞都是川普，但我也不知道為什麼我要花時間來研究關稅？<\/p>\n<p>是因為會影響我的收入嗎？其實不會，我的主要收入是醒吾給的薪水，而股市中的五十幾萬是部分的投資遊戲，反而是我的工作所得才是最重要的，長年來的收入多半都投入在現居的房產之中，而現金存款及退休金在十幾年內都期待不要有任何動用，因為我仍期待可以健康地走向老年，那我要花時間在那兒呢？<\/p>\n<p>1.花時間為現職的專業更為加值，中午與彥伶聊了聊工作上的困境，想想最重要的事就是以自身的專業來新增收入，快20年的教學生涯已無回頭路，只有加值加深研究才是唯一方向。<\/p>\n<p>2.現在的身體首重健康與維持，文字與形象的輸出都有賴於良好的外表與自信，每日的跑步與自我身心滿足是第一要務，再加上健康的飲食才能為自己更為加分。<\/p>\n<p>3.理財方式很難用短線來決定，將投資轉現也會因為通膨而此消彼長白做工，身上也沒什麼餘錢可以投資，再上仍在考量博士班的研究計畫，二者之間的時間成本只能擇一。<\/p>\n<p>整理一下心態與現狀就知道關稅及台海政爭與自己沒有很大的關係，反而是現在醒吾工作的延續性與自身的增值加值才是重要，將所以心力轉於此處才是人生的重點工作，更是家人與未來的保障。<\/p>"}, {"id": "f1742798053", "date": "2025-03-24", "title": "小春日和", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.24 小春日和 一早在清大的兒子參加了解校園生態的通識課程，但因為週一邏輯設計的課程與考試內容巨量，很多學生假日沒返家，甚至整夜在念書，包括他自己，而清晨五點的校園小", "len": 851, "body": "<p>2025.3.24<\/p>\n<p>小春日和<\/p>\n<p>一早在清大的兒子參加了解校園生態的通識課程，但因為週一邏輯設計的課程與考試內容巨量，很多學生假日沒返家，甚至整夜在念書，包括他自己，而清晨五點的校園小旅行僅是他們夜讀結束之後通識小菜。<\/p>\n<p>看過身邊同齡孩子念美國 John Hopskin，看她呈現出來的課業量也不少，念完的書及作業也非常多，而且父母親付出去的學費或生活費都比在台灣更驚人，但名校名系畢業之後在工作薪資等更是另一種視野。<\/p>\n<p>為什麼在頂大電機系階段課業為那麼重？<\/p>\n<p>對於這個系所而言，如此巨量的課業負荷是維持電機學生品質的必要條件嗎？<\/p>\n<p>在美國的UCLA或MIT的電機系也是如此張力的學習嗎？<\/p>\n<p>對成功有渴望，想要當人上人，學習階段的努力就不能逃避。<\/p>\n<p>昨天在Threads上的發文釣魚很成功，可以看到不同的回應與看法，都非常珍貴，看起來聯發科及聯詠在人力管理及發展上與瑞昱相同，工程師們很辛苦，他們的付出值得那一份收入，看到別人好卻做不到的人，就是羨慕別人賺錢的人，推論也可能是酸人的那一類。用生活品質、PUA當成不面對的藉口很正當；但反觀就是在經濟及職位上無法與人競爭比較，最後成為鍵盤俠。<\/p>\n<p>整體心得為，當學生選擇任何產業或系所求學，如果僅以成績排名、職涯晉升或金錢收入來做決策時，會將自己的成就感放錯位置。大學期間最重要的事不是捲系排或班排，追求書卷獎，所以我非常不認同瑞昱主管對這份工作的說明與介紹，可惜他的位子與高度對大一新鮮人的介紹沒考量到這份工作對身而為人的意義。<\/p>\n<p>孩子選擇了清大電機從個性方向上沒什麼錯誤，可惜的是在這個系所經營中除了專業之外，教師對學生的引導不足，結果就是放任市場價值來影響學生的學習策略。18-24歲是人生最美好的時光，老師們要用自己的經驗來導引年輕又聰明的學子嘗試與探索自己，發現自己可以從什麼方面獲得持續性的成就，進而精進自己在喜愛的學科、研究或技術等，在自己專長與喜愛的領域中追求卓越，為學科或專業設定小目標，在學習探索的過程中不斷地獲得成就感，進而成為台灣最專業的科學人才。<\/p>\n<p>美好的春日早晨<\/p>\n<p>無悔的青春時光<\/p>"}, {"id": "f1742697619", "date": "2025-03-23", "title": "從清大回到家已經是隔日凌晨。", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.23 從清大回到家已經是隔日凌晨。 帶著一些食物及補給品去新竹找兒子，昨天是清大的春季就業博覽會，留校念書的他與班上卷哥卷姊一起去看看攤位，原想聽聽聯發科及聯詠，聽說", "len": 1447, "body": "<p>2025.3.23<\/p>\n<p>從清大回到家已經是隔日凌晨。<\/p>\n<p>帶著一些食物及補給品去新竹找兒子，昨天是清大的春季就業博覽會，留校念書的他與班上卷哥卷姊一起去看看攤位，原想聽聽聯發科及聯詠，聽說攤位前太多人，正巧一旁的瑞昱沒人三位大一新鮮人就去問問題。<\/p>\n<p>聊天的是瑞昱的人資主管，台大電機書卷學霸，兒子說差不多與我同齡，用很詳盡很現實的角度與三位大一電機系學生談IC設計的職涯與發展，直到晚餐時兒子與我們聊了聊瑞昱的工作內容，也表示有點不太開心，因為那種工作氣氛並非他的期待，最近的他一直在想是不是選錯了科系與方向，好像電機系的終極目標在台灣是如此，是不是要考量去國外念書等等。<\/p>\n<p>我們晚上選了一家在新竹南大路上的韓國烤肉，人不少，食物及環境也不錯，但只能現金付款或轉帳，結帳時我用APP從只剩3K的帳戶中轉出了快2K，心中仍想著是否是我的問題，讓孩子這麼擔心未來與經濟，沒能好好地在大學中享受人生。<\/p>\n<p>那瑞昱的主管與他們三位聊了什麼呢？<\/p>\n<p>首先，他先提到要請他們在學業上努力，書卷獎要爭取，因為他們入職時不是只看畢業系所，而且還看在校成績是否名列前茅，原因無他，因為這是個非常競爭的環境，他了個APPLE下一代手機晶片設計的例子，蘋果公司對自身的產品發展會對全球重要IC設計公司發出英雄帖，將規格需求開出來之後，就由全世界知名的IC設計團隊來比賽，看看那家的團隊可以依規格在最快最短的時間完成設計，就可以取得此一專案；所以在腦力與速度的全球競爭之中，只有最強最優秀的人力資源才有機會勝出。<\/p>\n<p>其次，他提到了工作責任制，主管說這是一種心態，就是要將公司的事當成是自己的事，被指定的設計工作不能用工時(如一天工作8小時)來思維，三位學生有問那一天工時為何？主管說至少14小時以上，且再次強調責任制的重要性，要將公司及台灣晶片產業的發展放在人生觀之中，這樣才有在公司中做下去的好心態；但主管也提到因為近年薪水收入節節高昇，現在很多來到公司的年輕工作者不是很認同責任制，所以未來公司也會朝向工時制進行，多出來的工時會算加班費。<\/p>\n<p>以上這段文字，我不太敢放在網路上，因為前幾天系上的學生去東南旅遊面試業務時，台大生科碩畢的業務主管也差不多向學生陳述了類似觀念，我可以感受到不同學習歷程的年輕人，對於責任制與工時制在工作發展及人生觀中的巨大差異，這部分不能放上網去公審，我曾向學生說過，若公司薪水給得夠沒什麼事我不能做，結果學生的眼神看起來不置可否。<\/p>\n<p>最後，主管也提到了電機系IC設計的發展是不確定的，此時此刻的好並不代表未來前景，建議三位學生還要去雙主修相關的專業，例如資工軟體設計、材料工程等等；兒子有再問題那在大學之中參與社團服務性活動，增加跨域體驗與領導職能等是否對入職有幫助；這位人資的回答很無情：並沒有，因為他們最重要的事就是維持台灣IC設計的全球前端競爭力，這些事情聽起來並不能讓公司在競爭中獲勝，所以他們沒有很在意。<\/p>\n<p>我有點怪我自己沒那個人脈在孩子高中選擇時有多一點的機會讓高中生知道，資電工程在選擇之後就會在人生的路上定型，做再多的學習歷程與全人發展，在這些高薪高壓的工作環境中，都比不上超能的智商與競爭心態。<\/p>\n<p>我的收入僅能讓家人溫飽，在週末清大滿滿是留校念書學生的時刻，找家好吃的餐廳與太太兒子，一起聊一聊學習與生活上的大小事，是我人生中最大的幸福，我非常感恩，也鼓勵兒子仍要保有對社會與世界的好奇心，別讓經濟收入或成績決定了人的樣態，我與媽媽會一直支持他。<\/p>\n<p>我手機轉帳時，看了看自己空空如也的電子錢包，我想我比兒子更覺得難過與迷茫。<\/p>"}, {"id": "f1742398085", "date": "2025-03-19", "title": "下課後被學生留了下來，聊了不少事，回頭想想自己好像說太多…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.19 下課後被學生留了下來，聊了不少事，回頭想想自己好像說太多了，太多別人的事與自己的事都不太應該說出口，但總是放在心中就很難受，對生活與現狀又不滿意，只是用運動或放", "len": 335, "body": "<p>2025.3.19<\/p>\n<p>下課後被學生留了下來，聊了不少事，回頭想想自己好像說太多了，太多別人的事與自己的事都不太應該說出口，但總是放在心中就很難受，對生活與現狀又不滿意，只是用運動或放空來舒好像有用，又好像沒有用。<\/p>\n<p>學生說現在學校滿滿的都是外籍生，感覺上校名都可以改為OO國際科技大學了，說完後大家都笑了。<\/p>\n<p>學生也說去東南面試時，同學的表現讓他有點傻眼，一小時的團體面試有人表現地如同局外人，好似這樣面試與他無關一樣，搞得面試官都覺得那你何必來這趟。<\/p>\n<p>學生也提到聽說某個老師最近爭議很多，我只能說這位老師是個傳奇，來校25年年年有事，老師自身就是個傳奇。<\/p>\n<p>我與學生分享，你們四年後就離開了，這是老師們的委生之處，在現在的高教風暴中，別小看了老師的求生意志，你們乖乖畢業去開擴人生就好。<\/p>"}, {"id": "f1742091031", "date": "2025-03-16", "title": "睡前將失樂園文本看完，原來結局是這樣收尾，我有看電影版本…", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.16 睡前將失樂園文本看完，原來結局是這樣收尾，我有看電影版本，電影的部分含蓄多了，主要只針對心理及周邊人際的影響在討論，而不是以兩個追逐快樂的人在書寫；來自北海道大", "len": 438, "body": "<p>2025.3.16<\/p>\n<p>睡前將失樂園文本看完，原來結局是這樣收尾，我有看電影版本，電影的部分含蓄多了，主要只針對心理及周邊人際的影響在討論，而不是以兩個追逐快樂的人在書寫；來自北海道大學的渡邊醫生用很入骨的書寫將男女在中年之後藉由沈溺於情慾，無視於生命與人際關係直到極至的境地；原來這篇小說是由1995年9月1日開始在日本經濟新聞發表的長篇連載小說，真不知每日在看報紙的日本人，在辦公室或任何公開地點閱讀時是一種什麼心境！<\/p>\n<p>我也發現自己在書寫時，在生命中呈現不快樂的事時，引來的都是同為抱怨的人；但如果表達快樂時，卻時常會有一群正向的人與你同樂。這不好嗎？為何我那麼地悲情總是要一直提起心中不滿的部分，而忘了人的一生時間是有限的，如果現在不去尋找未來並不可得，因為你少掉的就是最珍貴的光陰。<\/p>\n<p>寫博士班研究計畫書已經多少年，卻沒有一次真正去考試，這幾天看著過往寫的內容，真心對自己搖頭，若我是教授對這樣的計畫書的寫作者也會考慮再三，因為內容中實在是放入了太多自我的陳述，畫蛇添足適得其反。<\/p>"}, {"id": "f1742118915", "date": "2025-03-16", "title": "差點就成了私校學生", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.16 差點就成了私校學生 很久以前高中時的我不認真念書，成天就是社團與打工，很多課業幾乎都放推，說是看不懂，現在想想事實是太不認真念書，結果就是三科被當，英文44、物", "len": 428, "body": "<p>2025.3.16<\/p>\n<p>差點就成了私校學生<\/p>\n<p>很久以前高中時的我不認真念書，成天就是社團與打工，很多課業幾乎都放推，說是看不懂，現在想想事實是太不認真念書，結果就是三科被當，英文44、物理57、化學58直接成為留級生。當時二類組班，全班有16個同學一起被當，我記得回家時被父母罵了好幾頓，他們真心沒想到一個從小讀書都沒讓他們掛過心的孩子，在高二升高三的那一年成了留級生。<\/p>\n<p>當時媽媽請了鄰門念大學的哥哥來與我聊，內容我忘記了，只記得他建議我去直接轉學去師大附中旁邊的延平中學，他就當時只是要附中的留級生，延平全收，這樣就不用再多讀一年而且可以考上好大學。<\/p>\n<p>我有沒有這樣選擇呢？<\/p>\n<p>一日附中人，一生附中魂，年少輕狂的附中人那有可能做這樣的決定，所以爸媽拿固執的我沒辦法，仍讓我留在附中，沒用的我還從理工轉文法商至第一類組念書，結果大學聯考還是只考到了輔大，而且還是一輩子後悔的社會系。<\/p>\n<p>有時仍會想起那個好幾個被一直說服的暑假夜晚，如果當下聽了建議去了延平，我的人生會是怎麼樣的呢？<\/p>"}, {"id": "f1741964786", "date": "2025-03-14", "title": "距離上一次為自己家安裝冷氣應該是1997年住在三重長安街…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.14 距離上一次為自己家安裝冷氣應該是1997年住在三重長安街，而且當時仍是窗型冷氣，後來我們在2001年被迫搬家時記得仍將冷氣搬走，後來還裝在木柵公寓外推的鐵窗陽台", "len": 300, "body": "<p>2025.3.14<\/p>\n<p>距離上一次為自己家安裝冷氣應該是1997年住在三重長安街，而且當時仍是窗型冷氣，後來我們在2001年被迫搬家時記得仍將冷氣搬走，後來還裝在木柵公寓外推的鐵窗陽台上，記憶很模糊，只記得剛成家的小夫妻努力在現實中改善生活的心情。<\/p>\n<p>今天我們倆再為自己家買了一台分離式冷氣，費用是我們擔負地起的，但我們長年來累積出來的謹慎心態一樣，明明是有能力一次全換新機，卻仍嘗試性地請了別人介紹的師父來裝機，機體規格對了又對，更期待那台已經運轉了17年的一對三冷氣有可以修理的一天。<\/p>\n<p>裝好機之後，在與LINE中與孩子分享，期待他明天返家時看到；而我自己在坐在客廳看著全新的冷氣，想著其實簡單生活並不簡單呀。<\/p>"}, {"id": "f1741703223", "date": "2025-03-11", "title": "14年前仍在花蓮工作，在學校工作到下午時突然通知全縣停班…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.11 14年前仍在花蓮工作，在學校工作到下午時突然通知全縣停班停課，因為日本發生大地震且發出海嘯警報。 我放下學校的工作，開了車就往東華附幼去接小狗子，接了他之後再回", "len": 360, "body": "<p>2025.3.11<\/p>\n<p>14年前仍在花蓮工作，在學校工作到下午時突然通知全縣停班停課，因為日本發生大地震且發出海嘯警報。<\/p>\n<p>我放下學校的工作，開了車就往東華附幼去接小狗子，接了他之後再回到志學五百戶的家中。那是個我們一家三口在花蓮相依為命的時光，一份私校教師的工作讓我們可以在鄰著農地過著幾乎與世隔絕的簡單生活，日出日落之間孩子也慢慢長大，而我們倆也在不經意之間過完了三十至四十幾歲間的黃金人生。<\/p>\n<p>八年的花蓮鄉下教師及離世而居讓我們感受到人生中少有的平靜，當然經濟非常不好過，但總是在掌握之中一步步地育兒成長，也許當年沒有急著在花蓮念博士班是件可惜的事，但專心地與家人生活不也是一種人生的投入與用心。<\/p>\n<p>14年轉眼即過，原來人生那麼短暫，如果真想念博士班，真要念個自己合意喜愛的，即便是遇到的難處也當成挑戰來面對，而不是難以回絕的無奈。<\/p>"}, {"id": "f1741135157", "date": "2025-03-05", "title": "台積電去美國設廠，媒體各說各話，因為我沒有綠卡又不是工程…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "台積電去美國設廠，媒體各說各話，因為我沒有綠卡又不是工程師，這幾年的經濟與資本市場的變化根本與我無關。 與我有關的是台灣的觀光與技職學習環境一直在走下坡，三十年的職涯投入與選擇現在", "len": 492, "body": "<p>台積電去美國設廠，媒體各說各話，因為我沒有綠卡又不是工程師，這幾年的經濟與資本市場的變化根本與我無關。<\/p>\n<p>與我有關的是台灣的觀光與技職學習環境一直在走下坡，三十年的職涯投入與選擇現在看起來是個笑話。<\/p>\n<p>昨天上課時，我一邊用中文在說明觀光旅遊的服務內容，一邊與越南學生在學越南景點發音，期待這群遠地而來的學生，為我及未來帶來一些機會與期待，我是很正向看待工作環境中這群專心且認真的越南學生，他們與台灣大學生一樣也要從早八上到快五點下課，自由來去校園與市區，就像我們台灣人去歐美留學一樣；而身為教師的我，也一直在補足自己對外國學生的認識，因為在每個清澈的年輕眼神的後面，都有一個期待自己成長的靈魂。<\/p>\n<p>我從越南同學認真學中文，學觀光旅遊的專業心態獲得教學的尊嚴，且越南有１億年輕人口，去年的經濟成長率將近9%，政府也宣示2035年長達1500公里的縱貫高鐵將通車，2045年邁入高所得國家，這讓我覺得有期待。<\/p>\n<p>所以，天下雜誌寫這篇文章，我覺得很無奈，的確問題是存在的，但這種只點出問題沒有提出想法的文章，用一種只會批評自以為是的觀點在影響大眾，從台灣社會來說有幫助嗎？私校收外籍生真的只是開移工後門嗎？<\/p>"}, {"id": "f1741171167", "date": "2025-03-05", "title": "東南旅遊vs醒吾旅運", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.5 東南旅遊vs醒吾旅運 日本的求職季就是春天，醒吾旅運系超前佈署為學生找未來，在林口櫻花滿開的季節，我們的學生已經開始為大四的實習準備拉滿弓，而今天我們請來了國內最", "len": 518, "body": "<p>2025.3.5<\/p>\n<p>東南旅遊vs醒吾旅運<\/p>\n<p>日本的求職季就是春天，醒吾旅運系超前佈署為學生找未來，在林口櫻花滿開的季節，我們的學生已經開始為大四的實習準備拉滿弓，而今天我們請來了國內最專精於日本入境與出境團體的東南旅遊高協理及李副理為學生介紹什麼是專業又豐厚的旅遊職人。<\/p>\n<p>Q：同學們覺得從學校畢業後一年，你期待在旅行業一個月可以賺多少錢？<\/p>\n<p>A：PPT上呈現了畢業於旅運系的林芳秀學姊，她在東南旅行社工作剛滿一年多，剛獲東南業務部2024年最佳新人，最高曾拿到69K的月薪+獎金，在收入+成就感+氣氛共感的旅遊業職場中，讓她非常滿意自己的科系與職涯選擇。<\/p>\n<p>在霧氣茫茫的林口教室中，醒吾旅運的郵輪教室擠滿了近百位全系對旅遊業充滿熱情的學生，而東南旅遊帥氣的北區業務本部長高協理帶來一場鼓勵人心的旅行業職涯發展機會，讓全場的學生都對畢業後的未來有了不同的期待。<\/p>\n<p>醒吾旅運系與東南旅遊已有十數年的實習合作關係，長期依業界需求訓練產業界合用且具敬業精神的旅遊人，更感謝企業為投身努力的員工提供一個永續發展的工作環境，資深的人資李副理常為了每位同學在實習單位的合適性，一位位地與輔導老師進行溝通與安排，如此細膩的流程方能達到學生、企業、學校三方共榮共贏的教育鍊結。<\/p>"}, {"id": "f1741081330", "date": "2025-03-04", "title": "週二一整天有七節課，上到天昏地暗，就像今天的百變天氣一樣…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.3.4 週二一整天有七節課，上到天昏地暗，就像今天的百變天氣一樣。 但有好幾件事想記錄下來。 一早收了一位烏茲別克的研究生，她想要做IG社群的負面評論的相關研究，我覺得很", "len": 549, "body": "<p>2025.3.4<\/p>\n<p>週二一整天有七節課，上到天昏地暗，就像今天的百變天氣一樣。<\/p>\n<p>但有好幾件事想記錄下來。<\/p>\n<p>一早收了一位烏茲別克的研究生，她想要做IG社群的負面評論的相關研究，我覺得很有趣認為可以來進行，只是未來研究要用英文撰寫，對她對我都是挑戰；中午開始上的證照課有108年畢業的在職校友返校上課，他說這樣的課程在外面很貴，他回來上課學習覺得賺到；後來再晚一點我五點下課後，有發現認識的應英系學生來旁聽系上的證照課程，她說旅運系的學生很幸福，有很多很好的課程可以學習。證照課學校有給我時薪800元，好好上課是我應該的，更期待這樣的回應可以成為未來學校永續的基礎之一。<\/p>\n<p>同時，我昨天決定開始將越南班的課程加深加重，今日上課反應及效果都不錯，因為在整理觀光概論資料時發現，越南可以念大學的學生比例並不高，若不將課程內容加重，他們回國後一定會說在台灣根本什麼都沒學到，這樣曾經當過他們老師的我在多年後一定會非常後悔。<\/p>\n<p>回家後在與彥伶討論冷氣時，突然水電打電話來想幫忙換抽風機，換好之後風聲仍非常大，彥伶很不滿意，我有感覺卻不想再麻煩別人，正好水電的工具遺漏在家中，在返程時再請他調整了一會兒，就換來了非常安靜的浴室。<\/p>\n<p>所以我的個性問題真是個大問題，而且後來整晚又睡睡醒醒，為了隔天的小活動難以完整休息，這也是個大問題。<\/p>"}, {"id": "f1740584227", "date": "2025-02-26", "title": "The Bucket Lists", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.26 The Bucket Lists 如果生命剩下半年，有什麼事是真的值得珍惜的呢？ 影片主角一直提醒著，身為人，有愛你的且你愛的人應該是最重要的事。 這幾年才發現", "len": 305, "body": "<p>2025.2.26<\/p>\n<p>The Bucket Lists<\/p>\n<p>如果生命剩下半年，有什麼事是真的值得珍惜的呢？<\/p>\n<p>影片主角一直提醒著，身為人，有愛你的且你愛的人應該是最重要的事。<\/p>\n<p>這幾年才發現，旅行是一種我對人生不快樂的逃避，當然想看看世界是原生的慾望，但想與人分享看到不同世界的快樂，更是生命深層的期待，無論有什麼地方沒去旅行過，都比不上孤單沒人在乎的孤獨。<\/p>\n<p>獲得別人的認同，再轉化為自我認同，我好像也是如此，只是我不想承認，因為總覺得自己有太多的遺憾，有太多的犧牲，讓自己過得太沒有自我。<\/p>\n<p>所以我仍很羨慕有錢有閒可以在世界各地旅行的人，可以將網路上看到的影象真實地呈現在自己面前，聞到聽到感受到那個當下的五感是多麼令人期待的人生體驗。<\/p>"}, {"id": "f1740495041", "date": "2025-02-25", "title": "競賽指導首次獲獎記錄", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.25 競賽指導首次獲獎記錄 當自己沒學生可以指導時就會說競賽沒有用，只是拔尖不代表什麼；在今天的心境好像卻不是如此，教學是一種雙向的進步，學生好像被你教到有成果，其實", "len": 669, "body": "<p>2025.2.25<\/p>\n<p>競賽指導首次獲獎記錄<\/p>\n<p>當自己沒學生可以指導時就會說競賽沒有用，只是拔尖不代表什麼；在今天的心境好像卻不是如此，教學是一種雙向的進步，學生好像被你教到有成果，其實老師的收獲更多，如何引導學生去面對挑戰，有計畫與步驟地去面對競賽的規定與內容，完整地執行完成都是教師在指導競賽時的重要收獲，如果沒有專案性的競賽活動，凡事就成為上課下課的例行公事，學生用最為簡單的成績來決定學習成就。<\/p>\n<p>但成績能夠代表他們有所收獲或學習到進步的方法嗎？其實好像不然，只是課堂上的教學是最省心省事的方式，老師就好好備課，無需管理每位學生的差異性，就用考試或報告來當成教學的主要成效，這次的成果與過程，讓我有所反思。<\/p>\n<p>很明確地，競賽與學生本身的能力及企圖心有關，所以在組成競賽團隊時，教師更是要有贏的企圖，而不是志在參加，凡事完整規劃，照著計畫進行討論修正，直到完成投稿或競賽的那一天結束，都是個非常完整的學習體驗，這是我近期學到的第二個收獲，感受非常強烈，幾乎完全推翻過去我在教學工作上的理念。<\/p>\n<p>仍非常謝謝兩位大園的可愛學生，沒有你們的認真付出與執行，還有努力地將影片剪輯到自己都覺得滿意的境地，也不會有機會獲得全國賽的佳作。<\/p>\n<p>狂賀🎉🎉🎉<\/p>\n<p>＃風起西門沙舞草漯<\/p>\n<p>＃少女漫遊城市與荒野的邊界<\/p>\n<h1>交通部觀光署<\/h1>\n<p>台灣觀光100亮點遊程影片創作競賽<\/p>\n<p>🎊🎊🎊✨️佳作✨️   🎊🎊🎊<\/p>\n<p>參賽者：陳俞瑄 陳敏慈<\/p>\n<p>指導老師：陳瑞峰 老師<\/p>\n<p>影片：<a href=\"https://www.youtube.com/watch?v=YIxQC25bpng\">https://www.youtube.com/watch?v=YIxQC25bpng<\/a><\/p>\n<p>獲獎公告：<a href=\"http://www.tpdtw.org/web/?p=6717\">http://www.tpdtw.org/web/?p=6717<\/a><\/p>"}, {"id": "f1740239002", "date": "2025-02-22", "title": "昨天將教育部產業學院計畫從系統中送出，而且在上午時還因為…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.22 昨天將教育部產業學院計畫從系統中送出，而且在上午時還因為網路斷訊，讓架構圖及好幾段深思的文字完全消失，真的是莫非定律越忙越會出包。 這陣子無論任何事都要花下倍數", "len": 413, "body": "<p>2025.2.22<\/p>\n<p>昨天將教育部產業學院計畫從系統中送出，而且在上午時還因為網路斷訊，讓架構圖及好幾段深思的文字完全消失，真的是莫非定律越忙越會出包。<\/p>\n<p>這陣子無論任何事都要花下倍數的時間與精力才能完成，事倍功半，四個字完全解釋開年後的處境，連開車等紅燈、課程安排、學生互動，系統資料庫、企業洽談互動等等任何事，都有一種一直在轉圈圈窮忙的無盡感。<\/p>\n<p>在完成各章節及預算編列後，我也知道整體來說有好多好多自己都看不下去的缺失，但總是每個字都是自己寫的，自己慢慢思考累積的，在送出之後，想為自己開心與鼓勵，至少我沒有像以前一樣臨陣脫逃，很多寫了一半的文章，報了一半的名，想了一半的夢，成了什麼都半吊子的我。<\/p>\n<p>我想真真切切地去面對每一個機會，這個計畫是一個開始，再來還有打工賺錢的規畫，因為精華的壯年職業人生已經開始倒數12年生肖年，蛇馬羊猴雞狗豬鼠牛虎兔龍很快就會到來，努力每一天，充實每一刻，不要再做不切實際的夢，只做實在的事，賺應得的錢。<\/p>"}, {"id": "f1739890630", "date": "2025-02-18", "title": "Karma 什麼都交給命運決定嗎？", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.18 Karma 什麼都交給命運決定嗎？ 這幾天累到都快沒期待了！病不完的自己與家人、剛開學的課程準備、計畫的期限、無預期的外出再加上家中最無奈的父母親，幾乎完全將我", "len": 457, "body": "<p>2025.2.18<\/p>\n<p>Karma 什麼都交給命運決定嗎？<\/p>\n<p>這幾天累到都快沒期待了！病不完的自己與家人、剛開學的課程準備、計畫的期限、無預期的外出再加上家中最無奈的父母親，幾乎完全將我打入情緒的最低點，甚至已經掛好三月份竹北身心科的門診。<\/p>\n<p>但是，我仍有好多好多對這個世界的依戀與期待，希望用健康的身體去看世界體驗各地的文化，仍對了解未知的未來充滿好奇，那我絕對不能卡在命運，更不能因此而喪志而放棄一切。<\/p>\n<p>在上完七節課的這一天，找了一部有趣的電影【跟著IKEA衣櫥去旅行】 The Extraordinary Journey of the Fakir，這是由法國小說改編的電影，內容很戲劇化，就像法國人對世界的浪漫一樣，加上非常動聽的印度音樂及混合難民、族群及歐洲各國風景的交錯中，編織出一段美好的冒險喜劇。<\/p>\n<p>阿賈的媽媽說：別讓運氣與命運操弄人生，要相信自己可以靠努力逃脫階級的貧窮，最重要的是，在心底要很富足，因為擁有愛與信賴的人永遠都是豐足的。<\/p>\n<p><a href=\"https://www.youtube.com/watch?v=M5tPuKU0DYY&amp;t=0s\">https://www.youtube.com/watch?v=M5tPuKU0DYY&amp;t=0s<\/a><\/p>"}, {"id": "f1739615438", "date": "2025-02-15", "title": "一週前英國國家廣播電視BBC的報導(放留言)，提到現在世…", "cat": "理財情報", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "一週前英國國家廣播電視BBC的報導(放留言)，提到現在世界局勢的轉變，中國在很多層面上的進步已經成為全球各行業的領先者，讓所有原先獲利的產業倍感威脅，歐陸的汽車工業就是一例，在中國", "len": 612, "body": "<p>一週前英國國家廣播電視BBC的報導(放留言)，提到現在世界局勢的轉變，中國在很多層面上的進步已經成為全球各行業的領先者，讓所有原先獲利的產業倍感威脅，歐陸的汽車工業就是一例，在中國政府的支持與大量投資之下，比亞迪電動車用難以至信的低價與品質進入世界市場，結果就是幾乎完全將德國法國的百年汽車工業基礎毀於一旦。<\/p>\n<p>這樣的情勢在任何2025中國製造的重點行業中都將會發生，先進發展國會非常緊張，會想用任何的合法或政治手段來減緩發生的時程。中國想要更為強大，美國更想維持曾有的榮光，看起來川普總統已經在競爭的牌桌上梭哈了，但也斷了與原來盟友的支持，這幾天印度、日本已經跟了，看起來英國及歐洲國家好像不這樣想。<\/p>\n<p>英國BBC看起來很誠實地提出了他們的觀察，而我最近在找尋AI與觀光旅遊業的論文期刊時也發現，有越來越多的跨領域研究的發表都是中國學者發表在世界級的重要SSCI期刊之中，特別是像服務業領域的研究，因為服務業的基礎就是消費者，擁有13億人口的中國市場就是所有服務新創產業的巨大溫室。<\/p>\n<p>以上也許是寫計畫時的焦慮，雖然我的手機中沒有天猫、抖音、深度求索等應用程式，但我知道剛才一起坐進電梯的弟弟，從十八樓坐到一樓出去之前都目不轉睛地在看著中國製播的短影音，從頭到尾他可能都不知道與他一同坐進電梯的人是誰？有幾個人？而且同電梯的人們都有在聊天談著事呢。<\/p>\n<p><a href=\"https://www.youtube.com/watch?v=z7do1hhb6fE\">https://www.youtube.com/watch?v=z7do1hhb6fE<\/a><\/p>"}, {"id": "f1739624874", "date": "2025-02-15", "title": "這幾天一直將要去東南旅遊談計畫的事放在心上，終於在整理幾…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.15 這幾天一直將要去東南旅遊談計畫的事放在心上，終於在整理幾天之後有了結論。最重要的就是，每一次的專業付出都要有對價。首先要先知道對方是否真有完成ESG專案的期待與", "len": 566, "body": "<p>2025.2.15<\/p>\n<p>這幾天一直將要去東南旅遊談計畫的事放在心上，終於在整理幾天之後有了結論。最重要的就是，每一次的專業付出都要有對價。首先要先知道對方是否真有完成ESG專案的期待與公司重視度，願意投入多少的資源來這樣的計畫之中，不是由我來開價，因為我並不是顧問公司，而是一位擁有規劃與管理專業的大學研究者。<\/p>\n<p>教育部的ESG計畫是以產業與學習實習課程的雙贏為出發點，所以在每一次的會議或活動中，旅行社的參與主管均有出席費用的經費，但教師顧問諮詢的部分就期待旅行業者可以對等提供相近的報酬，具體而言相關內容如下：<\/p>\n<p>醒吾師生團隊：<\/p>\n<p>1.在暑假或寒假期間獲得東南帶團領隊的機會<\/p>\n<p>2.學生可以擔任有薪給的國內旅行團的隨團助理<\/p>\n<p>3.在參與企業ESG計畫撰寫討論會議時，可依出席討論次數給予合理的顧問費用。<\/p>\n<p>4.ESG報告的撰寫及主筆應由公司專任人員擔任，亦或另請顧問公司代撰之。<\/p>\n<p>5.並積極協助尋找各類相關資源與人脈並導入公司進行ESG內容的優化。<\/p>\n<p>東南旅遊<\/p>\n<p>1.辦理與相關計畫專案人員ESG課程訓練，由教育部專案計畫支付講師出席費<\/p>\n<p>2.其他相關需求可依討論內容再行設定。<\/p>\n<p>以上的內容都是自己的想法，最後視下週一的會議面談討論內容，當下千萬不可答應任何需要免費付出的工作內容，主導內容以諮詢顧問為主，可以協助文案修改與建議，但千萬別做白工，如果都沒有任何結論也就算了。<\/p>"}, {"id": "f1739428400", "date": "2025-02-13", "title": "陰雨 14度", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.13 陰雨 14度 一家人不容易，孩子要與同學去台南旅遊，一早抱著酸痛的肚子，開車載著孩子前往長庚轉運站搭國光客運，腦中想起的是19年前在耕莘產房一家人的情境；從那一", "len": 331, "body": "<p>2025.2.13 陰雨 14度<\/p>\n<p>一家人不容易，孩子要與同學去台南旅遊，一早抱著酸痛的肚子，開車載著孩子前往長庚轉運站搭國光客運，腦中想起的是19年前在耕莘產房一家人的情境；從那一年開始，我們夫妻就從相依為命轉變成一家三口，這十幾年來有太多的接送都是這樣，我專心握方向盤往目的地，而後座的家人安心享受接送情。<\/p>\n<p>看著昨天的照片，雖然我與彥伶可能是吃太多，也可能是病毒感染整夜上吐下瀉，但看到照片想這近廿年的變化就好感動，謝謝你來當我們的孩子，現在的你已經長大了，都在準備要飛得更高更遠，有自己的朋友與生活，更有自己的目標與期待，但對我而言，只要一家三口平安健康就好。<\/p>\n<p>錢真的不好賺，但是沒有好的身體擁有再多都是空。<\/p>\n<p>祝我自己生日快樂。<\/p>\n<h1>一家人身體健康<\/h1>\n<h1>一家人心想事成<\/h1>\n<h1>一家人賺到大錢<\/h1>"}, {"id": "f1739065074", "date": "2025-02-09", "title": "失根的人？", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.9 失根的人？ 你住在這個現在的家有多久了？ 我住在這個自己買的房子已經快滿十年，這是一間在11年前我們從花蓮搬來工作附近就近買的中古屋，這間房子有家人的贊助及我們自", "len": 723, "body": "<p>2025.2.9<\/p>\n<p>失根的人？<\/p>\n<p>你住在這個現在的家有多久了？<\/p>\n<p>我住在這個自己買的房子已經快滿十年，這是一間在11年前我們從花蓮搬來工作附近就近買的中古屋，這間房子有家人的贊助及我們自己的努力，將房價分為十等份來看，有三成是長輩出的；另外的七成是我們負擔的，住得很愉快且平靜。<\/p>\n<p>從出生到現在，因為自己或家人工作我搬過好多次家，半世紀以來因為各種理由搬了十幾次的房子。<\/p>\n<p>因為無法在同一地點長住安養身心，連帶地總是覺得不安，會覺得那一天又要舉家整理包裹，四處尋找落腳之處。對於工作也是一樣，那兒有錢就往那兒去工作，工作環境有危機就早一步轉換下一個工作，結果就是徒增年歲專長與能力難以積累。<\/p>\n<p>真是滾石不生苔。<\/p>\n<p>——————<\/p>\n<p>1972(0-3m) 在台中出生-父母租屋在永和<\/p>\n<p>1972(1) 父母關渡台塑宿舍<\/p>\n<p>1974(3) 父母租屋在關渡<\/p>\n<p>1975(5) 父母購屋板橋四川路4樓公寓<\/p>\n<p>1982(10) 父母購屋中和景安1樓公寓<\/p>\n<p>1995(23) 義務役桃園龍岡營區<\/p>\n<p>1997(25) 退伍後住彥伶台北齊東街租房<\/p>\n<p>1997(25) 三重長安街(訂婚、結婚)<\/p>\n<p>2001(29) 台北古亭岳母家短暫借住<\/p>\n<p>2002(30) 木柵公寓-人生第一房<\/p>\n<p>2006(34) 花蓮蓮花大樓租屋<\/p>\n<p>2007(35) 花蓮志學-人生第二房<\/p>\n<p>2012(40) 花蓮美崙-人生第三房<\/p>\n<p>2014(42) 林口未來城租屋<\/p>\n<p>2015(43) 林口未來市-人生第四房<\/p>\n<p>——————<\/p>\n<p>而今，人生已在回程路上，午夜夢迴回首來時總覺不甘，是家境也是情勢所然，反思當下，穩定職業發展積累現有財富與房產，方是為家人與下一代發展最關鍵的事。<\/p>\n<p>行文至此，剛才提筆的緣由與不滿竟逐漸消失，反之認清個性中不切實際太過浪漫之處，踏實過日、努力札根、累積能量，身上有什麼資源做什麼事才是最重要的。<\/p>"}, {"id": "f1739107712", "date": "2025-02-09", "title": "狂賀🎉❤️🤩👍🏻", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "狂賀🎉❤️🤩👍🏻 ＃風起西門沙舞草漯 ＃少女漫遊城市與荒野的邊界 榮獲 #交通部觀光署 台灣觀光100亮點遊程影片創作競賽 ✨️佳作✨️ 🎊🎊🎊 參賽者：陳俞瑄 陳敏慈 指導老師：", "len": 473, "body": "<p>狂賀🎉❤️🤩👍🏻<\/p>\n<p>＃風起西門沙舞草漯<\/p>\n<p>＃少女漫遊城市與荒野的邊界<\/p>\n<p>榮獲 #交通部觀光署 台灣觀光100亮點遊程影片創作競賽   ✨️佳作✨️   🎊🎊🎊<\/p>\n<p>參賽者：陳俞瑄 陳敏慈<\/p>\n<p>指導老師：陳瑞峰 老師<\/p>\n<p>台灣觀光100亮點-遊程影片暨旅遊圖文創作競賽】<\/p>\n<p>台灣觀光100亮點-環島樂遊Trip參賽<\/p>\n<h1>醒吾旅運系<\/h1>\n<h1>謝謝品格子黃總<\/h1>\n<h1>大園NO1南門炒飯館<\/h1>\n<h1>在寒冬中完成的遊程規劃<\/h1>\n<p>影片：<a href=\"https://www.youtube.com/watch?v=YIxQC25bpng\">https://www.youtube.com/watch?v=YIxQC25bpng<\/a><\/p>\n<p>西門天后宮/西門町深度體驗/忠貞文化園區/龍岡清真寺/台版撒哈拉沙漠的草漯沙丘/CP值很高的品格子旅店/很有氛圍感的餐酒館/超好吃的南門炒飯館！！！<\/p>\n<p>跟著我們台北桃園二日遊！<\/p>\n<p>1.西門町<\/p>\n<p>2.彩虹大道<\/p>\n<p>3.天后宮<\/p>\n<p>4.午餐：詹記麻辣火鍋<\/p>\n<p>5.美國街<\/p>\n<p>6.萬年商業大樓<\/p>\n<p>7.西門紅樓<\/p>\n<p>8.晚餐：Piu!Piu!Pizza<\/p>\n<p>9.住宿：品格子旅店<\/p>\n<p>10.忠貞新村文化園區<\/p>\n<p>11.國旗屋<\/p>\n<p>12.午餐：阿含Thai<\/p>\n<p>13.清真寺<\/p>\n<p>14.忠貞市場<\/p>\n<p>15.白沙岬燈塔<\/p>\n<p>16.草漯沙丘<\/p>\n<p>17.晚餐：南門炒飯館<\/p>\n<p>參賽網站：<a href=\"http://www.tpdtw.org/web/?p=6646\">http://www.tpdtw.org/web/?p=6646<\/a><\/p>"}, {"id": "f1738978804", "date": "2025-02-08", "title": "昨天在校園中趕計畫，多年前研究所被我搞到沒畢業的阿佑突然…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.8 昨天在校園中趕計畫，多年前研究所被我搞到沒畢業的阿佑突然推了研究室的門進來，他說他來看看老師我，與我聊完天之後他說也要去找心輔室的雅玲老師聊聊，真有心。 變冷的寒", "len": 526, "body": "<p>2025.2.8<\/p>\n<p>昨天在校園中趕計畫，多年前研究所被我搞到沒畢業的阿佑突然推了研究室的門進來，他說他來看看老師我，與我聊完天之後他說也要去找心輔室的雅玲老師聊聊，真有心。<\/p>\n<p>變冷的寒假最後幾天，我坐在空無一人的研究室中想著，這份職業帶給了我什麼？這十幾年的角色轉換，我仍非常困擾，到底自己合不合適教師一職，至今仍沒有答案。大學學生已經成年，他們來此就學的原因多元且複雜，有些人上完課當付完學費就走，那個距離比講台到座位間更遠，老師若放入太多責任時，會自覺對不起這份薄薄的薪水；但也有些學生總是會當老師是他的朋友，他們不在時，我也會想念他們，畢業後時不時地來問一下好，彼此露個臉聊聊天，更是用錢也換不到的溫曖。<\/p>\n<p>阿佑現在是一位在海底撈努力工作的廚師，這份工作的辛苦與繁複人事也讓他吃盡苦頭，好多次他想離職時會用LINE與我聊聊分享，我的回覆總是要他轉個念換個方向思考。真的戲棚下站久了也會唱喝，慢慢地他在海底撈也有個小管理職，也有人教有人帶了，薪水當然也有回報，可以讓愛他的爸爸媽媽慢慢放心，是一個可以支撐家庭共享親情人倫的好孩子。<\/p>\n<p>他說，他下個月要帶家人去大阪玩，這輩子沒去過日本，這次一家人出門，他很期待。老師也很期待，期待阿佑一家會遇上今年日本最美的櫻花季。<\/p>"}, {"id": "f1738908822", "date": "2025-02-07", "title": "昨晚難睡，聽彥伶說孩子在山上宿營也難睡，所以一家人都難睡…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.7 昨晚難睡，聽彥伶說孩子在山上宿營也難睡，所以一家人都難睡。 頭昏昏的一直到下午2點才好一點，做法是提前去吃中飯，上廁所安自己的身體與心。 最近要寫出文字有點難，所", "len": 335, "body": "<p>2025.2.7<\/p>\n<p>昨晚難睡，聽彥伶說孩子在山上宿營也難睡，所以一家人都難睡。<\/p>\n<p>頭昏昏的一直到下午2點才好一點，做法是提前去吃中飯，上廁所安自己的身體與心。<\/p>\n<p>最近要寫出文字有點難，所以在FB上先記錄生活，將腦中的想法落在文字來暫停無盡的思索與困擾，好似真的有效，慢慢地打字的手溫暖了起來。<\/p>\n<p>昨晚，彥伶表示要送我生日禮物，我很感激，也謝謝她贊助日本家庭旅遊，所以這筆錢就由我自己來付；在50歲之後再度買一台新的機車-山葉JOG125給自己，用自己帳戶轉帳付款，前一台是媽媽在退伍之際買給我的鈴木125，用沒幾年在y17台北市青少年育樂中心工作時期便宜轉給了同事，想想竟然過了快30年了。<\/p>\n<p>板橋監理處通知的牌照號碼PAZ8136很合適自己。希望自己與孩子在騎這台車時都是平安充實的旅程。<\/p>"}, {"id": "f1738825823", "date": "2025-02-06", "title": "一早先跟東南旅遊李小姐聊了一下產學合作的細節，才放下心準…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.2.6 一早先跟東南旅遊李小姐聊了一下產學合作的細節，才放下心準備出門。 在開學前就規劃要將胖迪從林口騎到新竹，除了省了近千元的運費及時間成本之外，可以找個理由騎車來看看", "len": 377, "body": "<p>2025.2.6<\/p>\n<p>一早先跟東南旅遊李小姐聊了一下產學合作的細節，才放下心準備出門。<\/p>\n<p>在開學前就規劃要將胖迪從林口騎到新竹，除了省了近千元的運費及時間成本之外，可以找個理由騎車來看看自己一直想再多走動的縱貫路才是事實。<\/p>\n<p>結果一出林口就在山邊迷路，被導航一路走錯路到青埔，後來想想新的路程體驗也不錯，看著地圖重新規劃方向，一路上有桃園燈會、水塘及從未到過的高鐵新路，可以用寒假出來獨自騎車，真是愉快。<\/p>\n<p>真覺得自己要在工作之餘，找一點點時間出來晃一晃吹風！<\/p>\n<p>林口到新竹的摩托車程只要二小時，在清華大學前與兒子吃個飯，雖然有點趕，但是見到他總是心安不少，孩子長大了我自己卻像個小孩，都會有一點心酸與不捨，也覺得很幸福，賺錢工作為家人帶來幸福是最大的成就感來源。<\/p>\n<p>跳上了國光客運回林口，再來要多花點時間來準備工作上的事。記得保持愉快，快樂心情一步一步地走！別慌別亂！別亂擔心！<\/p>"}, {"id": "f1738197274", "date": "2025-01-30", "title": "嘗試著在年節期間將所有LINE等社群互動全都無視，將所有…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.1.30 年初二 嘗試著在年節期間將所有LINE等社群互動全都無視，將所有的觀照都放在與家人孩子的互動之中；陪著新手駕駛的孩子專心地環島，高速公路從家中開到西螺，在滿滿的", "len": 319, "body": "<p>2025.1.30 年初二<\/p>\n<p>嘗試著在年節期間將所有LINE等社群互動全都無視，將所有的觀照都放在與家人孩子的互動之中；陪著新手駕駛的孩子專心地環島，高速公路從家中開到西螺，在滿滿的國道服務區中，完成完美的路邊停車；也在高雄的鹽埕老街區中一路堵車到了屏東潮州；在夜色中才路經屏鵝公路，轉入南迴時已是黑暗一片，只剩下來車快速的車燈。<\/p>\n<p>從南迴公路106公里的夜駕之中，我們平安地來到台東，夜色與靜寂讓從城市歸來花東的我們都有點不適應，孩子在開完數百公里之後，仍可以陪伴母親在飯店宵夜場中聊聊天，難怪他在EE理工宅男的系科中總是覺得孤單。<\/p>\n<p>如此珍貴的家人互動，實現在放下無意義的網路社群互動之中，先放自己一個年假，讓過載又沒意義的網路關係先留在虛無之中！<\/p>"}, {"id": "f1738230215", "date": "2025-01-30", "title": "北返路程點點滴滴，一家人在一起行動真的很開心！", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.1.30 北返路程點點滴滴，一家人在一起行動真的很開心！ 途經台11路邊停車排隊嘗花蓮055鹽寮龍蝦，與春節旅客一起等了一小時，海鮮除了龍蝦算新鮮，現炒山蘇及曼波魚不錯吃", "len": 298, "body": "<p>2025.1.30<\/p>\n<p>北返路程點點滴滴，一家人在一起行動真的很開心！<\/p>\n<p>途經台11路邊停車排隊嘗花蓮055鹽寮龍蝦，與春節旅客一起等了一小時，海鮮除了龍蝦算新鮮，現炒山蘇及曼波魚不錯吃之外，其他的都不行，而且只能吃一小時，流程又被店家搞得很複雜，用線上點餐應該可以完全改善，只是現場那些臉色很差的阿姨們應該會失業。<\/p>\n<p>相較於海外旅遊甚至是中國旅遊經驗，花蓮這家餐飲店完全不行，已經完全不想比較，而且吃飯的環境及衛生間更是很難令人接受，我知道太平洋沒有蓋子，但是這是我的家鄉，真心希望各行各業都可以在賺錢之餘好好提升品質，別只是為了錢在生活。<\/p>\n<p>在台灣與家人到處旅遊，不用大包小包坐飛機出國是非常的快樂與幸福的事。<\/p>"}, {"id": "f1736427408", "date": "2025-01-09", "title": "洗碗的故事", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "洗碗的故事 從小我就有個專長，就是很會洗碗。 我可以將超過洗碗糟高度的碗盤山非常有層次地分門別類，並且用合理的用水及洗碗精在很有效率的洗滌中，從大到小從多到少，一層層地將非常多的髒", "len": 656, "body": "<h1>洗碗的故事<\/h1>\n<p>從小我就有個專長，就是很會洗碗。<\/p>\n<p>我可以將超過洗碗糟高度的碗盤山非常有層次地分門別類，並且用合理的用水及洗碗精在很有效率的洗滌中，從大到小從多到少，一層層地將非常多的髒碗盤從油膩與菜湯之中沖洗、在泡沬中找到不同型式的碗盤鍋具，並漸次地放置到瀝水區，再整合有序地排進烘碗機，按下30分熱風後關上門，擦乾手後，就可以倒杯溫水，坐在餐桌前等待乾淨潔白溫熱的碗盤們出櫃。<\/p>\n<p>一整桌吃喝所留下的碗盤山，我從國小低年級開始，就可以在十幾分鐘內完成洗碗任務，而這一切都是因為我們家常有客人來喝酒吃飯。其實，對一個小朋友來說，在滿桌酒客的下酒菜中，真正我用的碗盤大概至多一至三個物件吧，我沒喝酒也沒喝飲料，小朋友能吃的東西也就那幾種，等大家酒足飯飽，酒客飯飽轉台去電視機前喝茶醒酒之時，我的母親早已在煮食多樣餐食準備累到不行，最後收拾的角色，當然就是家中年紀最大的小孩來包辦滿桌的收拾。<\/p>\n<p>我從來沒想過這是什麼不公平的事，除了很習慣之外，更覺得自己很擅長，而且我一生都仍覺得我的父母親是愛我的，因為分擔家務本來就是共處於同一空間的每一個人都應該的事。<\/p>\n<p>甚者，2003年生大病出院時，曾看過一篇莊淑旂博士在談生病的人在復原期要在家煮食，吃完飯後要將洗碗當成復健，巧妙地將碗盤拿起拿落，用溫水沖流的對雙手按摩中，對身體健康有著極大的好處。對於洗碗如此純熟的自己更是熱愛在一家用完餐之後自動地去碗糟前報到。<\/p>\n<p>這應該也算是對家庭親密關係的一種實踐吧，至少我是這樣自覺的。<\/p>\n<p>不知優秀的心理諮商師是否會有另外一層的解釋，就像留言區那位一樣地有趣。<\/p>"}, {"id": "f1735743403", "date": "2025-01-01", "title": "一早攸攸醒來非常厭世，在開年的第一天，寫下了以下的文字：", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025.1.1 一早攸攸醒來非常厭世，在開年的第一天，寫下了以下的文字： 2025年希望生活別再有突發事件，每天可以感受到自己的呼吸 會想吃東西、會想睡覺、會覺得有一點點的快樂就", "len": 418, "body": "<p>2025.1.1<\/p>\n<p>一早攸攸醒來非常厭世，在開年的第一天，寫下了以下的文字：<\/p>\n<p>2025年希望生活別再有突發事件，每天可以感受到自己的呼吸<\/p>\n<p>會想吃東西、會想睡覺、會覺得有一點點的快樂就好！<\/p>\n<p>但後來吃完早餐後看到了家人將日曆與月曆都更新了，覺得有種希望感，決定要做一點改變。決定去整理亂成一堆的櫃子，將夏衣冬衣交換位置，今年可以不用再買冬衣。電風扇洗淨整理成群，不會在家中擋路。每間房間及角落灰塵全清，突然間家中清新起來。<\/p>\n<p>為自己掃除心塵從身邊開始！<\/p>\n<p>掛在新的日曆前的幸運鈴是在麗江古城小學旁買的，有家小食店，掌店的阿姨都用這句話：【一生好運】祝福著所有遠道而來的客人。我們嘗了美食餵飽了胃，接了連句的好運與歡欣，成了一段美好的旅程回憶，原先更買了幾個與平安有關的幸運鈴要送給學生，結果永遠送不出去了。<\/p>\n<p>所以一定要對自己與家人祝福，我們要歲歲年年一生好運。<\/p>\n<p>2025仍保希望，祝自己新年快樂，努力完成以下期待：<\/p>\n<h1>年跑1000公里<\/h1>\n<h1>多益金證<\/h1>\n<h1>博士班入學<\/h1>\n<h1>還房貸100萬<\/h1>"}, {"id": "f1735438087", "date": "2024-12-29", "title": "113 國立大學註冊率全都沒有80%以下的。", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "113 國立大學註冊率全都沒有80%以下的。 百分之百招生的是以資電理工見長的清成交央。 台灣服務業的整體比率今年明顯下降，就是產業天平向科技業偏移。 台科北科招生百分百不用說，但", "len": 569, "body": "<p>113 國立大學註冊率全都沒有80%以下的。<\/p>\n<p>百分之百招生的是以資電理工見長的清成交央。<\/p>\n<p>台灣服務業的整體比率今年明顯下降，就是產業天平向科技業偏移。<\/p>\n<p>台科北科招生百分百不用說，但屏科及高餐都在八成上下就要小心，領國家薪俸的技職老師雖不用擔心，但也表示這二所在114年轉學很方便，大家可以參考。<\/p>\n<p>國立高雄餐旅大學原本以技職觀光龍頭為傲，但113年註冊率連80%都不到。表示家長及學生對於觀光餐旅服務業念書賺不到錢用最直觀的方式來表達，而且現代學生求學區域性質及自由期待越來越強，要學生到高雄小港成天穿制服上學，去個一年也許轉學的也不少。<\/p>\n<p>屏科大的獸醫系一定滿招，但其他科系應該更慘，至於偏鄉不分公私立都招得不好，可以想見當地學生只想來大都市求學，城市學生更不可能去鄉下讀書，在鄉下設大學未來就只好招外籍生來補充生源了。<\/p>\n<p>私立大學招生率建議參考就好，因為數字可調可控，只要注意極端值不要去念不到六成的學校以免後來要轉學，非常麻煩。<\/p>\n<p>像今年有調控招生名額被教育部警告的幾所大學，後來數字也不難看，是那幾所Google一下就有，校長全都被換了一波了。高教資訊平台「大學問」執行長魏佳卉分析，今年大專校院整體註冊率比去年好一些的主因為：<\/p>\n<p>1.各校寄存名額增加<\/p>\n<p>2.外籍生人數納入註冊率<\/p>\n<p>3.教育部補助私校學生學雜費<\/p>\n<p>所以也就代表註冊率已不足以作為學生選擇學校優劣的依據。<\/p>"}, {"id": "f1734959598", "date": "2024-12-23", "title": "年末，我剛剛算了一下評鑑點數，113學年可能會拿個乙等。", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.12.23 年末，我剛剛算了一下評鑑點數，113學年可能會拿個乙等。 好難過，這一年的課程教學與實習輔導我覺得付出超多心力，系上的行政與招生也很努力參考。但看了教師評鑑表", "len": 381, "body": "<p>2024.12.23<\/p>\n<p>年末，我剛剛算了一下評鑑點數，113學年可能會拿個乙等。<\/p>\n<p>好難過，這一年的課程教學與實習輔導我覺得付出超多心力，系上的行政與招生也很努力參考。但看了教師評鑑表冊中，準備教案努力教學(+0)，課餘輔導學生證照(+3)，用課餘擔任實習秘書積極安排學生實習(+1~3)及拜訪產業就業輔導(+0)，以上前述用去我大多數的時間心力，結果根本只加了4分。<\/p>\n<p>114年要回到甲等，除了以上內容之外，我還要做好以下事項:<\/p>\n<p>教學類<\/p>\n<p>(1)指導學生參加全國性競賽得前三名+3~6<\/p>\n<p>(2)出版ISBN+2<\/p>\n<p>(3)數位教材+6<\/p>\n<p>(4)取得多益金證+8<\/p>\n<p>(5)取得第2級證照+5<\/p>\n<p>(6)通過教學實踐研究計畫+10<\/p>\n<p>(7)完成以上事項就可以爭取教學優良教師+10<\/p>\n<p>研究類<\/p>\n<p>(1)投稿 I 級期刊+10<\/p>\n<p>(2)投稿好期刊+6<\/p>\n<p>(3)出版ISBN+5<\/p>\n<p>(4)通過國科會計畫10萬元以上+2<\/p>\n<p>(5)通過新型專利+5<\/p>"}, {"id": "f1734588066", "date": "2024-12-19", "title": "剛坐在我身邊的老師與我聊天：他最近在課堂中試了一對一的教…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "剛坐在我身邊的老師與我聊天：他最近在課堂中試了一對一的教學方式發現學生開始動起來，動手寫作業，動腦想內容，動口來討論；他覺得用以前在課堂前一直說的方式，系上多數的學生很難確定有沒有", "len": 478, "body": "<p>剛坐在我身邊的老師與我聊天：他最近在課堂中試了一對一的教學方式發現學生開始動起來，動手寫作業，動腦想內容，動口來討論；他覺得用以前在課堂前一直說的方式，系上多數的學生很難確定有沒有了解，需要更多的工具與方法來嘗試。<\/p>\n<p>在技職教育現場我也看到很多老師非常努力地找方法，重拾學生的學習動機，不能用社會事件及考試排名來定義學生，每個學生都是個案，這是108課綱的功勞嗎？<\/p>\n<p>我覺得作者與天下這樣寫不太對，我覺得這是台灣公民社會進步，教育投資努力的結果，與什麼政府與課綱無關，在上位者別自以為是，在數十年前，黨國課綱下我也有碰到努力改善教學內容與技巧的老師；當然也有非常不適任的教師，現在的教育管理機制比以前好太多，社會也多元化，所以教師不適任很容易被放大，學生偏差行為很容易被媒介唱ㄙㄨㄟ，整體而言，學校教師與學生素質都在前進，甚至可以在人類社會中排在先進國度之中，這也不是什麼政府的原因，而且數十年來我們慢慢地尊重每個人，每一個角色，不是用年資或職位來當教條，不是用領導人的理念在定義方向與對錯。<\/p>\n<p>丘美珍老師寫的內容非常好，只可惜將一篇好文掛上108課綱當標題，浪費了。<\/p>"}, {"id": "f1734494414", "date": "2024-12-18", "title": "2025台灣郵輪儲備人才報名表填寫：  https://…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2025台灣郵輪儲備人才報名表填寫： https://forms.gle/d23YHi86wpSgxxTL6 ＃應屆畢業生 ＃給自己一個全新體驗世界的機會 台灣郵輪協會已受全球前五", "len": 931, "body": "<p>2025台灣郵輪儲備人才報名表填寫：  <a href=\"https://forms.gle/d23YHi86wpSgxxTL6\">https://forms.gle/d23YHi86wpSgxxTL6<\/a><\/p>\n<p>＃應屆畢業生<\/p>\n<p>＃給自己一個全新體驗世界的機會<\/p>\n<p>台灣郵輪協會已受全球前五大郵輪公司委託，徵詢對郵輪服務工作有意願的服務人才先行建立資料庫，即日起開始募集有意願的同學的個人資訊，協會設計了下面這個表單，請同學們踴躍填寫，建立人才資料庫。<\/p>\n<p>將另外邀約進行實體或(與)線上面試，除可為滿足未來5年該船隊拓展的人力需求外，更可為台灣青年創造一個參與國際郵輪產業服務工作的通道。<\/p>\n<p>＃勾選你有意願經驗及證照的工作選項 (可多選)。<\/p>\n<p>此次工作機會著重在前台的工作: 如餐飲F&amp;B, 餐廳與酒吧服務the Restaurant- Bar, 房務部Housekeeping以及客服部Guest service dept.。<\/p>\n<p>郵輪儲備人才資料表《其他(請自填並註記經驗程度)》欄位。<\/p>\n<p>請有打工實習經驗的同學，填表時務必簡要條列《自填工作經驗並註記經驗程度》，這對最終獲得錄取的機會有莫大的幫助。<\/p>\n<p>＃預計郵輪工作開始日期2025年7月<\/p>\n<p>該公司未來五年計畫以每年一艘75,000噸到100,000噸級郵輪投入日本韓國大陸台灣區域營運，故必須現在就開始儲備人力。若順利，明年4月5月就來台灣面試，預計7月可登輪，(倘若雙方配合得上，登輪日可以提前)。<\/p>\n<p>＃郵輪證書說明<\/p>\n<p>郵輪工作必須具備聯合國國際海事組織認可，符合「海事人員訓練、認證、守值規章」標準International Convention on Standards of Training, Certification and Watchkeeping for Seafarers (STCW)的結訓證書，方可完成雙方的僱傭關係，倘若現時你尚未持有證書，仍然可以登記參加面試遴選，然請標明，並於日後參與協會輔導的認證課程及訓練，以取得中華民國政府核發證書以及新加坡海事與港務局核發之國際證書，為日後投入郵輪產業備妥第一步的敲門磚。<\/p>\n<p>此資料僅用於協會以及郵輪公司為未來可能的面試使用，不得轉為其他用途。<\/p>\n<p>台灣國際郵輪協會 敬遨<\/p>\n<p>🚢✈️🚄🚞🚌✈️🚢<\/p>\n<h1>空服旅遊實習就業導向的實踐者<\/h1>\n<h1>醒吾科技大學旅運管理系<\/h1>\n<h1>旅運管理系旅遊觀光實務組<\/h1>\n<h1>旅運管理系航空服務管理組<\/h1>\n<h1>醒吾科大旅運系<\/h1>\n<h1>醒吾科技大學旅運系<\/h1>\n<h1>醒吾科技大學<\/h1>\n<h1>醒吾旅運<\/h1>"}, {"id": "f1732630256", "date": "2024-11-26", "title": "旅運系師生的城市鐵道小旅行循著劉銘傳巡撫的腳步，沿著18…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "旅運系師生的城市鐵道小旅行循著劉銘傳巡撫的腳步，沿著1888年大稻埕鐵道遺址一路散步，途經1909年臺北工場、1919年鐵道部廳舍、八角樓及工程樓等，並走入了2020年完工成立的國", "len": 428, "body": "<p>旅運系師生的城市鐵道小旅行循著劉銘傳巡撫的腳步，沿著1888年大稻埕鐵道遺址一路散步，途經1909年臺北工場、1919年鐵道部廳舍、八角樓及工程樓等，並走入了2020年完工成立的國立臺灣博物館鐵道部園區之中。<\/p>\n<p>這是一場導覽課程的第二階段，在學生踏出校園用不同的視角搭乘鐵道與地方導覽連結學習之後，再帶著他們走進博物館體驗歷史與現代的交流模式，本來以為年輕學子只愛手機螢幕中的光鮮忘卻了城市中的一角存在著更精緻的紋理。實際上從學生的眼光及導覽中對應課堂教室曾帶過軌道概念的整合認同之間，很開心為這群學生開了一扇好奇心的窗。<\/p>\n<p>我們師生面對著已矗立140年的北門前，讓同學自付50元的臺灣博物館入場費，希望這群新生的旅運人，可以藉由微學分的小小要求，嘗試了解城市、生活、空間、休閒、旅遊之間的關係，更期待這樣的練習可以讓未來有機會帶著來訪外國友人推廣台灣時，有更為深入的底蘊來分享就座落於城市中、路途中的城市景觀，而且能邊走邊介紹著自我認同、引以為豪的台灣旅遊資源。<\/p>"}, {"id": "f1732162455", "date": "2024-11-21", "title": "哇哇哇😱", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "哇哇哇😱 網路因為太多人想看棒球幾乎都塞車，找了些與委內瑞拉觀光地理相關的資料。 委內瑞拉Venezuela世界之最 😱1.天使瀑布是世界上最高的瀑布，落差807公尺，動畫天外奇蹟", "len": 361, "body": "<p>哇哇哇😱<\/p>\n<p>網路因為太多人想看棒球幾乎都塞車，找了些與委內瑞拉觀光地理相關的資料。<\/p>\n<p>委內瑞拉Venezuela世界之最<\/p>\n<p>😱1.天使瀑布是世界上最高的瀑布，落差807公尺，動畫天外奇蹟就取材於此。<\/p>\n<p>😱2.馬拉開波湖（西班牙語：Lago de Maracaibo），是委內瑞拉西北部的潟湖，為南美洲最大的湖泊，有豐富的油氣資源，南北長210公里，岸長約1000公里，湖區為地球上閃電最頻繁的地方，著名的卡塔通博閃電每年約有140-160天出現，在9月達到峰值時湖區每小時可發生多達280次閃電，持續時間長達9小時，能夠為夜間航行照明。<\/p>\n<p>😱3.委內瑞位是位於北半球南美洲的國家，鄰近赤道全境屬熱帶氣候，首都卡拉卡斯，據報道，委內瑞拉及其首都卡拉卡斯都是世界上人均謀殺率最高的國家之一。<\/p>\n<p>好吧，午休時間，大家一起來為中華隊加油吧！<\/p>\n<p>圖片截自：天外奇蹟<\/p>"}, {"id": "f1731934728", "date": "2024-11-18", "title": "週週相伴的秋雨強颱", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.11.18 週週相伴的秋雨強颱 這是一場延了多時校外教學，在這學期開始之前就規劃了要帶學生去坐火車，上回用同一張布條搭火車活動學長姊都已經畢業及實習，總想讓學生與自己多點", "len": 711, "body": "<p>2024.11.18<\/p>\n<h1>週週相伴的秋雨強颱<\/h1>\n<p>這是一場延了多時校外教學，在這學期開始之前就規劃了要帶學生去坐火車，上回用同一張布條搭火車活動學長姊都已經畢業及實習，總想讓學生與自己多點共同的旅行回憶。連著來的颱風非常令人厭惡，上回有這麼不喜歡颱風排隊上門已經是2008年暑假了，只要是從事旅遊相關行業者，颱風總是不討喜。<\/p>\n<h1>處處體貼的導覽規劃<\/h1>\n<p>辦戶外參訪最怕下雨，一早仍未集合志強里長就回報當地天候，「下雨了」，我趕緊在7點就通知學生要帶雨具，但是學生們為了準時到達集合點，很多人早已出門在路途；9點我們將上電車又回報「雨變大了」，其實我心都涼了一半，直到我們踏進瑞芳站時，迎接我們的就是溼漉漉的月台。<\/p>\n<p>志強里長一到就先集合學生，拿出一箱輕便雨衣，每人一件無色透明的雨衣，讓穿得美美的學生不會因為穿雨衣變醜。沿途對於瑞芳當地建築、人文歷史、輕便鐵道及過往風華用風趣言語讓學生非常專心，拿起手機也是在記錄途經的一切。踏查中，志強里長一直在顧慮著隊伍的安全，找合適的站點與解說點，用專業音響設備讓所有人都可以聽得明白學得仔細；細雨中，我的心也在學生專注學習的眼神中穩定下來，近90分鐘的路程與導覽，學生們在學習心得回饋中都書寫了他們的豐富收獲。<\/p>\n<h1>時時引導的行動學習<\/h1>\n<p>這次委請研究所同班同學志強里長來擔任導覽老師，就是要請他在地豐富的人脈與導覽經驗可以加持在自己的學生身上，從規劃到執行進而在導覽活動中處處為我們設想，就可以感覺到專家出手的不一樣。這是一門導覽解說的微學分，只有用實踐行動的方式才能讓學生體會到導覽不只是書本上的考題，而是結合解說人員與在地資源的巧妙整合專業；當然有一群具學習心、好奇心又貼心的學生，也是這次課程活動圓滿的重要因素。<\/p>"}, {"id": "f1731746605", "date": "2024-11-16", "title": "果陀X醒吾X教學X展演", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "果陀X醒吾X教學X展演 我超喜歡看小說讀故事，每天晚上睡前伴我入眠的都是東野圭吾、宮本輝或宮部美幸的小說，讓紙本中的情節與角色讓自己跟著作者成為一個旁觀者或參與者，一起入夢成為精采", "len": 660, "body": "<p>果陀X醒吾X教學X展演<\/p>\n<p>我超喜歡看小說讀故事，每天晚上睡前伴我入眠的都是東野圭吾、宮本輝或宮部美幸的小說，讓紙本中的情節與角色讓自己跟著作者成為一個旁觀者或參與者，一起入夢成為精采的一場劇。某日系上學生來找我贊助學校安心助學活動，說捐款可以獲得音樂劇的入場券，我立馬捐款，也因緣際會地觀賞到醒吾與果陀劇場訓練的音樂劇學程成果劇。<\/p>\n<p>昨晚，在週五全天授課精疲力盡之後，帶著一身疲倦前往華亞園區廣達電腦總部的廣藝廳，沒想到讓我參與了一場精采至極，穿越時空的音樂劇，一整天的疲憊一掃而空。表演中全員均為醒吾表演藝術系的學生，一流的對白與走位、一流的音樂與燈光、一流的舞蹈與場景，完全是場劇場的盛宴，可以推斷後端師生花了多少的時間學習、練習，用盡所有的精神與氣力編曲、編舞、編劇寫詞的準備。<\/p>\n<p>100分鐘流暢的音樂劇中，被好幾首自創的歌曲及主唱學生圈粉，好多幕精彩的舞蹈表演，劇與舞的合頌將一段段穿梭時空的場景，在專業劇場設計中，串連起生命中最美好最無憾的音樂劇結局，看完之後真的覺得學生太專業，老師們太用心，時間花得太值得，家人還一直問有沒有公開演出，可以購票入場再看一次(哇！身為醒吾人真的有點驕傲)。<\/p>\n<p>這幾年因為技職學生來源更為競爭，教學與實務的整合及教師教學設計至關重要，課程不能沒有料，更不能太水與實務落差太大，整合業界資源導入教學已經是醒吾所有科系在教學上的基本功。我一邊看劇也一邊檢討著自己在訓練與教學上的盲點，思考著更多在旅運服務實務教學上的可能性，這應該是我最大的收獲。<\/p>\n<p>再次謝謝醒吾表藝系師生，給了我生命中最美好的🎶分鐘。<\/p>"}, {"id": "f1731161761", "date": "2024-11-09", "title": "我的郵輪啟蒙師呂江泉博士。", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.11.9 我的郵輪啟蒙師呂江泉博士。 2001年星辰公主號首航基隆是呂老師牽成我上船參加潛在客戶的中英文導覽訓練及實作； 2006年觀光局專案進行首次亞洲郵輪市場調查，是", "len": 434, "body": "<p>2024.11.9<\/p>\n<p>我的郵輪啟蒙師呂江泉博士。<\/p>\n<p>2001年星辰公主號首航基隆是呂老師牽成我上船參加潛在客戶的中英文導覽訓練及實作；<\/p>\n<p>2006年觀光局專案進行首次亞洲郵輪市場調查，是呂老師派我及另外三位調查員登上處女星號完成數百份英文紙本問卷，並完成首份官方的國際郵輪旅客市場分析；<\/p>\n<p>2007-2009年呂老師在花蓮觀光學院共同指導我辦理了澎湖、新加坡、日本及美國郵輪航線整合，並首次以教學計畫辦理了多趟麗星及公主郵輪的海上研學營隊，參與學生達300人次。<\/p>\n<p>在2018年醒吾觀餐大棲在初建設計當下，我更請教呂老師的觀點及參考多本郵輪著作成了醒吾旅運系專有的郵輪實境教室。<\/p>\n<p>2024年末期中考週，呂老師蒞校來到醒吾郵輪實境教室向剛升上大學進入旅運系的80位新生演講分享，為了是更深切的實習教學實踐，突破台灣學生只看眼下的觀點，以國際宏觀的角度分析未來郵輪職涯實習的方案，期待這個充滿期待的藍海旅遊市場中，醒吾旅運的師生成為領先群，佔得郵輪旅遊先機，航向更具前瞻性的未來。<\/p>\n<h1>教育是百年大計<\/h1>"}, {"id": "f1730372507", "date": "2024-10-31", "title": "其實10月底的強颱不是沒有，而是記者報導及編輯只想快點拉…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "其實10月底的強颱不是沒有，而是記者報導及編輯只想快點拉收視率，就拿網路上的高流量影片做節目，所以在颱風如此危險的日子中，很多冒著生命回國的機師就成了網路英雄。 做新聞的、網路流量", "len": 322, "body": "<p>其實10月底的強颱不是沒有，而是記者報導及編輯只想快點拉收視率，就拿網路上的高流量影片做節目，所以在颱風如此危險的日子中，很多冒著生命回國的機師就成了網路英雄。<\/p>\n<p>做新聞的、網路流量高的，全都是長榮、華航、星宇航空機師對決康芮颱風的大怒神強迫起降畫面。<\/p>\n<p>真的沒有人記得24年前10/31同一天，當天是象神颱風侵台，新加坡航空SQ006班機在桃園中正機場發生該公司有史以來最嚴重的空難事件嗎？<\/p>\n<p>象神颱風也是10月最後一天來的強颱，桃園空難主因是人為因素，桃園機場在法律上沒什麼責任，但考量颱風天候因素，機場可以關場不起降，或許也是最根本最安全的做法。<\/p>\n<p>就像安安昨天緊急關了小巨蛋，劉太太們週末再去看老公吧！<\/p>\n<p>圖片來源：Pastdaily、台視新聞及台灣啟示錄<\/p>"}, {"id": "f1729752193", "date": "2024-10-24", "title": "為什麼只有兆豐保險承接郵輪旅遊保險", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "為什麼只有兆豐保險承接郵輪旅遊保險 兆豐銀行是由ICBC中國國際商銀及交通銀行合併而來的，所以算是泛公股銀行，由政府直接或間接持有多數股份，同樣的銀行應該有合作金庫、第一銀行、華南", "len": 464, "body": "<p>為什麼只有兆豐保險承接郵輪旅遊保險<\/p>\n<p>兆豐銀行是由ICBC中國國際商銀及交通銀行合併而來的，所以算是泛公股銀行，由政府直接或間接持有多數股份，同樣的銀行應該有合作金庫、第一銀行、華南銀行、彰化銀行及台灣企銀等，再加上100%由政府經營的國營銀行：台灣銀行、土地銀行、中國輸出入銀行等，共八間銀行算是台灣的官股銀行。<\/p>\n<p>所以對保險業來說風險不低的郵輪旅遊，就不太有民營金控保險公司願意設計保險產品，因此兆豐的「郵輪旅遊綜合保險」，是國內唯一專為郵輪旅遊設計的旅遊保單，但只承保以台灣為母港之國際郵輪旅遊。其他出國搭郵輪的旅遊都不受理，其保險內容為整合性保單，針對各種郵輪旅遊可能發生的特殊狀況設計，例如陸上觀光期間發生意外事故或護照遺失恐錯過登船時間，或是突發醫療危機須使用高昂衛星電話等等。<\/p>\n<p>近期已有更新版的\"新郵輪旅遊綜合保險\"保單，將產品細節放在留言處，當未來有機會參加從基隆或高雄出發返回的Roundtrip Cruise郵輪旅遊時，就可以投保保障自己的權益，而不是事情發生之後就變身成為鯛民在外國船上抗議甚至霸船，成為國內外的笑柄。<\/p>"}, {"id": "f1729150827", "date": "2024-10-17", "title": "在鐵道上發現知識與風景同行", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "在鐵道上發現知識與風景同行 醒吾旅運系微學分公告 終於師生可以出門去參訪了，期待當日有個如照片中的大晴天。 因為已報名專人導覽40位，如果有同學想參加，也請在留言處加LINE報名才", "len": 380, "body": "<h1>在鐵道上發現知識與風景同行<\/h1>\n<h1>醒吾旅運系微學分公告<\/h1>\n<p>終於師生可以出門去參訪了，期待當日有個如照片中的大晴天。<\/p>\n<p>因為已報名專人導覽40位，如果有同學想參加，也請在留言處加LINE報名才能進行保險及購票得團體行動。<\/p>\n<p>時間：2024/10/31 星期四(約3小時)<\/p>\n<p>地點：國立臺灣博物館鐵道部參訪活動<\/p>\n<p>費用：交通及午餐自理；只需繳交100元，內含團體門票及旅遊平安保險費<\/p>\n<p>活動時間規劃：請依公共交通進行鐵道活動<\/p>\n<p>10:10-10:30 捷運北門站B1劉銘傳像前(如附圖)集合。<\/p>\n<p>10:40-10:55 國立臺灣博物館鐵道部門口集合<\/p>\n<p>11:00-12:00 國立臺灣博物館鐵道部專人導覽活動(名額40人)<\/p>\n<p>12:00-12:30 團體照及自由活動參觀，撰寫心得報告<\/p>\n<p>13:00 活動結束<\/p>\n<h1>不可自行騎車或開車請以公共運輸為主。<\/h1>\n<h1>附件為期中報告格式完成後請上傳TRONCLASS作業區<\/h1>\n<h1>海報是學生設計文案也是學生寫的<\/h1>"}, {"id": "f1728314212", "date": "2024-10-07", "title": "當我們忍氣吞聲時，就是自己讓出了原本自己應該擁有的，好像…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "當我們忍氣吞聲時，就是自己讓出了原本自己應該擁有的，好像很懂事很理讓，但是卻是犧牲了自己所有的權益。 在工作時，如果明著說可以不用在假日到外縣市去參加活動，但私底下卻一直暗給壓力與", "len": 312, "body": "<p>當我們忍氣吞聲時，就是自己讓出了原本自己應該擁有的，好像很懂事很理讓，但是卻是犧牲了自己所有的權益。<\/p>\n<p>在工作時，如果明著說可以不用在假日到外縣市去參加活動，但私底下卻一直暗給壓力與耳語來說新人不上道，那就不是管理，而是職場霸凌。<\/p>\n<p>在工作時，如果主管對於自己曾說過性騷擾話語一概不認，對於自己曾莫名發過的情緒也否認，甚至明著欺瞞，那就不是教育，而是帶頭教壞新人，讓新進員工以為這樣的行為在社會行走是可以被接受的。<\/p>\n<p>所以新進員工只要覺得不舒服，不合理，不愉快，在第一時間就要反應，如果可以就用智慧與口語反擊，更是要當面提醒同事或主管已經超過了工作的要求。<\/p>\n<p>世界在崩潰中，委曲自己只是減少你快樂的時間，今日處理學生實習事件與教師輔導有感。<\/p>"}, {"id": "f1728208258", "date": "2024-10-06", "title": "今天有道奇Dodgers的比賽，英文超級爛的我，這個字是…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.10.6 今天有道奇Dodgers的比賽，英文超級爛的我，這個字是去上多益補習班時才有點印象，原來這是由dodge閃躲動詞而來的，也就是逃避者或閃避者的意思，躲避球就是d", "len": 316, "body": "<p>2024.10.6<\/p>\n<p>今天有道奇Dodgers的比賽，英文超級爛的我，這個字是去上多益補習班時才有點印象，原來這是由dodge閃躲動詞而來的，也就是逃避者或閃避者的意思，躲避球就是dodgeball, 那時聽了真的很好奇為什麼用一個奇怪行為的詞來當隊名。<\/p>\n<p>查百科才知道原來道奇不是原生於洛杉磯的，它是來自於紐約布魯克林的悠久歷史球隊，因為當時當地人要來球場看球時，都要在路上閃避往來的走在街道上的Trolley(一種有軌電車)，所以球隊又被暱稱為Trolley Dodgers(電車閃避者)電車，所以球隊才依當地球迷的特色取名\"閃避者Dodgers\"。<\/p>\n<p>豆知識小問題：這種人、路面電車甚至是車輛共用路權在現今軌道運輸ABC路權分類中屬於那一種？<\/p>"}, {"id": "f1727946310", "date": "2024-10-03", "title": "剛剛在路上走走2K，看到不少狗狗趁沒風雨帶主人出來遛遛，…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.10.3 剛剛在路上走走2K，看到不少狗狗趁沒風雨帶主人出來遛遛，就會想起曾經一直住在家中陽台的史努比，史努比是我們在古亭附近收容的浪浪，比起現在的狗狗住在家中有專屬床位", "len": 918, "body": "<p>2024.10.3<\/p>\n<p>剛剛在路上走走2K，看到不少狗狗趁沒風雨帶主人出來遛遛，就會想起曾經一直住在家中陽台的史努比，史努比是我們在古亭附近收容的浪浪，比起現在的狗狗住在家中有專屬床位，出門有推車可坐，甚至每日有廚工主人煮狗食；相較而言，我們家史努比就好可憐喔。<\/p>\n<p>她成為我們家人之後，就一直住在陽台，三重三和夜市附近公寓的陽台、古亭大樓辦公室的陽台、木柵公寓的頂樓及陽台、花蓮蓮花大樓的陽台，到壽豐五百戶的一樓的陽台。她跟著我們漂盪流浪了十五年，有時想想當年如果沒有認養她，也許他就一直住在古亭小麵店的門口安養終身呢。<\/p>\n<p>剛到花蓮的第一年，我們圖太平洋美景選了個有面海陽台的15樓2LDK公寓入住，當時家中小孩剛出生，所以史努比就更理所當然地住在陽台。差不多就是夏休秋初，印象中是七月去花蓮面試，八月才被通知以最低階的專案講師先試用一年，孩子才六個月，木柵小公寓也才剛安頓好，我們又風塵僕僕地要去花蓮工作。整個家庭從雙薪上班族，突然只剩下一年聘講師的缺薪家庭，換位今日，對於年輕時自己的決定根本是離譜到了極點，完全無視當年家中經濟與生活困境，還去偏鄉私校工作，人疲狗困地、莫名奇妙地移居花蓮。<\/p>\n<p>剛到花蓮，我們就面臨了颱風季的考驗。已經不記得2006年秋天遇到幾次颱風了，只記得年輕小夫妻在颱風來臨的夜晚，18層樓面對太平洋的高樓成了顯明的迎風標，強陣風中大樓也是跟著搖，而且房間只要有窗型冷氣的位置都成了入水口，外宿又賃居的我們只買了床墊及小朋友的塑膠墊睡地上，在風雨中驚恐地渡過整晚，更可憐的是在陽台的史努比，在顧小孩、堵進水及整晚的大樓強風搖晃中，我們一家四口狼狽驚恐地渡過當年的颱風季。<\/p>\n<p>隔年再度搬家去壽豐五百戶住了五年，那兒的環境與生活就比市區好上太多，在花東縱谷中，有海岸山脈及中央山脈的護持中，幾次的颱風季就沒那麼可怕，我們也改住低樓層圖個平穩務實，史努比與小孩都有更好的空間可以活動。<\/p>\n<p>寫這些只是擔心自己生活印象慢慢的淡忘，有如花蓮颱風過後路邊當下所有的南洋杉都被強風吹得光禿禿的，住過的花蓮蓮花大樓至今仍因地震受損已成危樓，每每經歷過的日子就在過個幾個月圓月缺的風清雨順、季節更迭的綠意盎然之間，醉迷忘我地以為當下的平靜美好是恆常不變的。<\/p>"}, {"id": "f1725875400", "date": "2024-09-09", "title": "慕尼黑中央車站至德意志博物館", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "慕尼黑中央車站至德意志博物館 遊程規劃在AI的發展中與過往找資料的方式不太相同，利用2016年的慕尼黑自由行交通規劃為例，當日主要行程是從鄰近中央車站的飯店出發，去參訪德意志博物館", "len": 435, "body": "<p>慕尼黑中央車站至德意志博物館<\/p>\n<p>遊程規劃在AI的發展中與過往找資料的方式不太相同，利用2016年的慕尼黑自由行交通規劃為例，當日主要行程是從鄰近中央車站的飯店出發，去參訪德意志博物館；因為是自由行，所以過程中的每一段都要確認，記得是先參考博物館的網站交通建議資料，再用Goolge Map規劃交通時間及步行路徑，整個路程的確認至少花了十幾分鐘。<\/p>\n<p>而今我只要打開App直接向ChatGPT提問：「請協助規劃由慕尼黑中央車站至德意志博物館之大眾運輸交通方式，並以表格方式呈現去所需時間及費用。」毫秒間就有結果，我再問它：「可以提供地圖嗎」，結果就如附圖所示豐富、確實且完整多元。<\/p>\n<p>所以我再利用GoogleMap依它的建議就可以在1分鐘之內獲得明確的路線圖，放入手機之中跟著走就可以，在六年前網路也沒今日完善，我是寫在行程表中照表旅行。<\/p>\n<p>附圖就是2016年就是從慕尼黑中央車站至德意志博物館旅行圖文，提供給有興趣德國自助行者參考，因為自行搭乘地鐵及步行，更可以感受到慕尼黑的夏日城市風情。<\/p>"}, {"id": "f1725497956", "date": "2024-09-05", "title": "技職教師不合適再去考大學？", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "技職教師不合適再去考大學？ 少子化將到，私校教師沒有勞退，工作快三十年退休後月退不到二萬，如果為自己打算而且有能力考試，我也想考醫牙中獸學位！只是現在大學學測的題目並不簡單，大家有", "len": 699, "body": "<p>技職教師不合適再去考大學？<\/p>\n<p>少子化將到，私校教師沒有勞退，工作快三十年退休後月退不到二萬，如果為自己打算而且有能力考試，我也想考醫牙中獸學位！只是現在大學學測的題目並不簡單，大家有機會可以去寫看看，現在的高中生考的內容已比過往難上許多，加深加廣並且更有素養。<\/p>\n<p>所以我們教師會去考證照或學技能，像我們學院的院長，從水電到職業駕駛各種證照都有，甚至親身從事，更已取得國內名校博士學位，是技職達人級的典範。而我就差了些，也在職考各類領隊導遊、語言證照，也嘗試學習房務工作，還想學長照，考量那天海嘯來時，至少要有份工作謀生。<\/p>\n<p>但你做過房務嗎？多年前在台觀餐旅系時有請學生教我做床，翻沒幾床就腰痛，洗個幾房浴室及清理房間後手酸腳麻、肩關節酸痛到舉不起來。而且實務上房務工作還有時間壓力，工作時間6-7小時內要完成十幾間的房間，從換床、地毯、窗戶，當然還有最需要打理的浴廁及垃圾，重複的工作一直做，其間還有時會有客人或同事的壓力。2024年此時星級旅館人資表示：他們的房務員薪水是三萬多新台幣起跳，但如果你失業了，你會考慮嗎？<\/p>\n<p>身為餐旅業的技職教師，我也許會，但是我的體力最初只能做一半的量，差不多每小時１間多，或許會進步，但更可能會累出傷來報病號，甚至職業傷害被迫離職。<\/p>\n<p>反問旅館業者，請問你們會想用重新入職的中高齡員工嗎？<\/p>\n<p>在商言商，為達到原本一位房務員12-14間房的KPI，用新進中高齡員工會多了一倍的人力管理需求，KPI換算為薪資反而要6-7萬元，難怪我們想做，業者也會多所考量。<\/p>\n<p>所以高職教師考取有用學位，並保留學籍我覺得值得鼓勵，如果是我也會以此為典範，努力看看；至於學校上綱媒體將學位名額成為議題有點不合適。<\/p>"}, {"id": "f1725548568", "date": "2024-09-05", "title": "今天是新生訓練，新生們知道醒吾科技大學為什麼叫醒吾嗎？校…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.9.5 今天是新生訓練，新生們知道醒吾科技大學為什麼叫醒吾嗎？校門口的大石頭上有寫，上下學時可以停下腳步看一下。 先來個小豆知識。 其實很多大學都改過名，原因很多，有那些", "len": 405, "body": "<p>2024.9.5<\/p>\n<p>今天是新生訓練，新生們知道醒吾科技大學為什麼叫醒吾嗎？校門口的大石頭上有寫，上下學時可以停下腳步看一下。<\/p>\n<p>先來個小豆知識。<\/p>\n<p>其實很多大學都改過名，原因很多，有那些是你不知道的呢？<\/p>\n<p>1.光武工專&gt;北台科學技術學院&gt;北台灣科學技術學院&gt;台北城市科技大學<\/p>\n<p>2.新埔工專&gt;聖約翰科技大學<\/p>\n<p>3.中國海專&gt;台北海院&gt;台北海洋科技大學<\/p>\n<p>4.高雄工學院&gt;義守大學<\/p>\n<p>5.德育護專&gt;經國管理暨健康學院&gt;德育護理健康學院<\/p>\n<p>6.淡水工商專校&gt;真理大學<\/p>\n<p>7.臺中健康暨管理學院&gt;亞洲大學<\/p>\n<p>8.興國管理學院&gt;中信金融管理學院<\/p>\n<p>9.台南家專&gt;台南女子技術學院&gt;台南科技大學&gt;台南應用科技大學<\/p>\n<p>10.雲林工專&gt;虎尾技術學院&gt;虎尾科技大學<\/p>\n<p>11.四海工專&gt;德霖技術學院&gt;宏國德霖科技大學<\/p>\n<p>12.精鐘商專&gt;臺灣觀光專校&gt;臺灣觀光學院(已退場)<\/p>\n<p>13.致遠管理學院&gt;台灣首府大學(已退場)<\/p>\n<p>醒吾創校五十幾年來都叫醒吾，先有高中之後才設五專，升格改制都沒有改過名字。<\/p>"}, {"id": "f1725284791", "date": "2024-09-02", "title": "最近很多約，要講的話更多，要確定的事情也不少，對一個內向…", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.9.2 最近很多約，要講的話更多，要確定的事情也不少，對一個內向者來說真的過載了！ 這本書寫在第一頁的小測驗，你符合幾個？除了2之外我中了11項，但我想若是獨旅，就不會有", "len": 540, "body": "<p>2024.9.2<\/p>\n<p>最近很多約，要講的話更多，要確定的事情也不少，對一個內向者來說真的過載了！<\/p>\n<p>這本書寫在第一頁的小測驗，你符合幾個？除了2之外我中了11項，但我想若是獨旅，就不會有壓力了。<\/p>\n<p>很好奇真有人會低於3項嗎？<\/p>\n<p>✅1.可以自己一個人面對最開心或最幸福的時刻。<\/p>\n<p>✅2.決定好旅行行程會很開心，但一方面也會有壓力。<\/p>\n<p>✅3.就算一個禮拜不出門、不跟人見面，也相信自己不會覺得無聊。<\/p>\n<p>✅4.外務結束後如果有剩餘時間，比起去找附近的朋友，更喜歡自己在咖啡廳休息。<\/p>\n<p>✅5.失戀或是遇到被背叛之類的事情時，大大傷心完後會想自己一個人待著。<\/p>\n<p>✅6.太多人的聚會會覺得很累，喜歡一對一的見面。<\/p>\n<p>✅7.聊天的時候如果對方說的話很有趣，那靜靜聆聽也沒關係，不覺得自己一定要說話。<\/p>\n<p>✅8.經常會後悔自己說的話，而且會記得很久。<\/p>\n<p>✅9.自己一個人待在房間裡的時間最幸福。<\/p>\n<p>✅10.如果對方因為不得已的原因而取消約會，不僅不會不開心，甚至會覺得很高興。但也不是討厭這次的聚會，如果真的赴約了還是會很開心。<\/p>\n<p>✅11.經常會受緊張性頭痛所苦。<\/p>\n<p>✅12.不喜歡惹事，但如果不把已經發生的事情好好結束，就會自己給自己壓力。<\/p>\n<p>符合10項以上，就是典型的內向者。<\/p>\n<p>符合7-9項則是有內向者的傾向。<\/p>\n<p>符合4-6項則是介於內外向之間。<\/p>\n<p>低於3項則是外向者。<\/p>"}, {"id": "f1725071150", "date": "2024-08-31", "title": "開發案有感", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "開發案有感 問起昨夜剛回家的大學生，知不知道柯文哲等等的事件很大條。 大學生表示：沒很關心，因為都在新生營活動，很好玩。 的確，回想自己大學時期，還為了擔心入伍後被修理而被不明人士", "len": 669, "body": "<p>開發案有感<\/p>\n<p>問起昨夜剛回家的大學生，知不知道柯文哲等等的事件很大條。<\/p>\n<p>大學生表示：沒很關心，因為都在新生營活動，很好玩。<\/p>\n<p>的確，回想自己大學時期，還為了擔心入伍後被修理而被不明人士加入國民黨，當年聽說不入黨二年日子不好過，那關心那麼多事。<\/p>\n<p>退伍後在中華徵信所工作才慢慢地接觸到各類的開發案，發生好多令人印象深刻的事。<\/p>\n<ol>\n<li>\n<p>1997年剛進公司時，公司正在做大案子，菜鳥我分派去看台灣的海水浴場，先找找觀光局的資料也要將各地的人潮量寫出來；那陣子公司主管還飛去沖繩看鳳梨主題樂園及仙人掌公園，好不羨慕；後來這個大案子的台鳳公司也成了股市焦點，增資成功股價狂飆。後來的事我就不說了，直到十年前我離開花蓮，這個案子的關係人也才剛被關，現在已經關完又出來了。<\/p>\n<\/li>\n<li>\n<p>1997年在世貿開會時，與會人士都在談one o one，用這個一直當例子在討論，我以為那是什麼代號而已，當年又沒有網路，直到好幾個月後才知道那天是台北101的重要規劃會議。<\/p>\n<\/li>\n<li>\n<p>1998年接了一個長生集團的X專案，規劃從台北至機場的廣告板收益量，年輕的自己騎著摩托車到好幾個荒涼的地點去用底片機拍照，現在才知道，當年的路口就是現在的林口A9機捷站。<\/p>\n<\/li>\n<\/ol>\n<p>先寫這樣，其實還有被火燒光的東帝士、代銷裕隆的國產汽車、南崁的理成營造、北捷大安站的聯合開發等等，都是剛入社會才25歲的我最好的觀景窗，藉由企業資料的收集或重要經理人的訪談，除了超量的文字報告及十幾場專案簡報之外，也是社會菜鳥的我初探土地開發案時，觀察職場百象的萬花筒。<\/p>\n<p>好在我是小職員，碰不到什麼好事，但案子參與多了也有所體會，不知道現在被捉的那些人，在想什麼呢？<\/p>"}, {"id": "f1724855652", "date": "2024-08-28", "title": "現在應該很少人在看報紙了吧！", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.8.28 現在應該很少人在看報紙了吧！ 尤其是工商時報，還好住家大樓的書報夾中除了三大報之外，還有工商時報。記得在中華徵信所工作時，資深前輩耳提面命要將企業市場報告寫得好", "len": 364, "body": "<p>2024.8.28<\/p>\n<p>現在應該很少人在看報紙了吧！<\/p>\n<p>尤其是工商時報，還好住家大樓的書報夾中除了三大報之外，還有工商時報。記得在中華徵信所工作時，資深前輩耳提面命要將企業市場報告寫得好，就要每天看經濟日報、工商時報；每週看商業周刊，寫出來的文案才會有商業的蘊底。<\/p>\n<p>所以每次走過大樓交誼廳時，都會不自主地翻一翻工商時報及商業周刊。<\/p>\n<p>應該更少人知道中華徵信所與工商時報同源。中華徵信所創辦人張秘和中國時報創辦人余紀忠，曾是事業夥伴，1950年徵信新聞創立，1960徵信新聞改名為徵信新聞報；1961年張秘離開「徵信新聞報」後成立工商徵信通訊社，1966年改組更名為中華徵信所，1968年徵信新聞報更名為中國時報。<\/p>\n<p>但無論如何，時至今日，中國時報集團已成旺旺蔡家所屬單位，中華徵信所也被義大利CRIF信評公司收購成為外商，各自所有的輝煌都成為歷史。<\/p>"}, {"id": "f1724686847", "date": "2024-08-26", "title": "國光客運，在中壢龍岡當大頭兵時它叫做台汽客運；每當收假時…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.8.26 國光客運，在中壢龍岡當大頭兵時它叫做台汽客運；每當收假時總是會去老舊又擁擠的台汽北站坐客運回部隊，與火車比較起來，客運可以休息睡一下，總是舒服一點！ 可惜後來台", "len": 306, "body": "<p>2024.8.26<\/p>\n<p>國光客運，在中壢龍岡當大頭兵時它叫做台汽客運；每當收假時總是會去老舊又擁擠的台汽北站坐客運回部隊，與火車比較起來，客運可以休息睡一下，總是舒服一點！<\/p>\n<p>可惜後來台汽北站無法以古蹟的方式留下(留言專文)，但原本的天橋仍在，常常走過天橋時都會想起當時的複雜心情。<\/p>\n<p>今天起，角色易位，國光客運成了家中大學生回新竹的交通工具，買票、候位、上下車都是相似的場景，不變的，是來來往往的遊子們遠行歸鄉的身影。<\/p>\n<p>新建的長庚轉運站環境在財團有心規劃下非常完善，複合式的建築，平面交通層有待位區、數十家美食小吃及容納數家國道交通客運往來的月台，藉由國道往各地而去，四通八達；上下各層是滿足長庚就醫人潮的近千個車位的停車場。<\/p>"}, {"id": "f1724063107", "date": "2024-08-19", "title": "觀餐學院今天辦中元普渡，大家時間點到了就來排排站準備拜拜…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.8.19 觀餐學院今天辦中元普渡，大家時間點到了就來排排站準備拜拜，今年的貢品有高人指點，在年度例行的重要民俗節日中，老師們舉香祈念。 主祀的餐旅系主任祈願：「所有觀餐學", "len": 357, "body": "<p>2024.8.19<\/p>\n<p>觀餐學院今天辦中元普渡，大家時間點到了就來排排站準備拜拜，今年的貢品有高人指點，在年度例行的重要民俗節日中，老師們舉香祈念。<\/p>\n<p>主祀的餐旅系主任祈願：「所有觀餐學院的學生與同仁出入平安」，沒聽到什麼招生滿滿等等之類！反而是念茲在茲地為全院數千位學生祈福。<\/p>\n<p>技職學生在暑假期間多半都在服務業努力打工、實習、早出晚歸地為自己的學習生活打拚，暑假大家在玩樂之時，就是觀餐學生最忙碌之時。<\/p>\n<p>一句：「學生們出入平安」道盡了我們身為技職業師的日日夜夜思思念念。很感動，很動容，草草記錄下來！否則工作一忙就全忘了。<\/p>\n<p>對了，有人知道為什麼最前面的水盆放空心菜呢？<\/p>\n<h1>3000m #3K<\/h1>\n<h1>run #running #runner #runforlife #runeveryday<\/h1>\n<h1>跑 #跑步 #跑者 #禪跑者<\/h1>\n<h1>快樂跑 #跑開心 #跑健康<\/h1>\n<h1>跑步人生 #跑步筆記<\/h1>"}, {"id": "f1723807744", "date": "2024-08-16", "title": "大學入學各階段入學(特殊選才、繁星推薦、學測個申、分科考…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024.8.16 大學入學各階段入學(特殊選才、繁星推薦、學測個申、分科考試)終於在昨天分科放榜後結束了，身為家長陪著走過108課綱三年後有點小心得，純個人想法，只是記錄。 學習", "len": 561, "body": "<p>2024.8.16<\/p>\n<p>大學入學各階段入學(特殊選才、繁星推薦、學測個申、分科考試)終於在昨天分科放榜後結束了，身為家長陪著走過108課綱三年後有點小心得，純個人想法，只是記錄。<\/p>\n<ol>\n<li>\n<p>學習歷程大體上是個JOKE：高一高二以家長身份參加多場學習歷程與選才說明會，如果家中高中生沒什麼特殊學習方向，其實教育部一直在推廣的學習歷程就只是個表象，有填就好。<\/p>\n<\/li>\n<li>\n<p>在校成績排序在繁星推薦及學測個申都很重要。但在特殊選才及分科考試卻沒什麼影響，所以高中生要找出對自己有利的方式，策略性地利用制度入學理想系所。<\/p>\n<\/li>\n<li>\n<p>學測成績很重要，特別是國文、英文及數B三科只考一次，如果沒時間念完，就先衝這三科考到最好，以免後面分科考試沒有翻身的機會。<\/p>\n<\/li>\n<li>\n<p>高中生要排出自己最有興趣的系所著重的科目，就拚那幾科，這樣在學測個申、分科考試二階段時會站在有利的位置。<\/p>\n<\/li>\n<li>\n<p>最後，高中生是人格養成的重要階段，有好的學習及生活習慣可能都比考得好更重要，但我個人覺得這部分老師的角色不多，家庭、同學及學校風氣的影響是關鍵。<\/p>\n<\/li>\n<\/ol>\n<p>陪孩子走完三年學習階段，好像讓自己重新再過了一次高中生活，尤其是我的高中生活非常苦澀，感謝孩子給了我有重生的感覺。<\/p>\n<h1>3000m #3K<\/h1>\n<h1>run #running #runner #runforlife #runeveryday<\/h1>\n<h1>跑 #跑步 #跑者 #禪跑者<\/h1>\n<h1>快樂跑 #跑開心 #跑健康<\/h1>\n<h1>跑步人生 #跑步筆記<\/h1>"}, {"id": "f1722157345", "date": "2024-07-28", "title": "先說寧波給我們的感覺是奇妙，不是奇怪或不喜歡喔！", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "先說寧波給我們的感覺是奇妙，不是奇怪或不喜歡喔！ 來聊聊當地的火熱名店及感受，過境下午入住酒店之後有位超級熱心的小姊姊一直來造訪房間，問東問西也送我們小禮物，室內拖鞋、新牙刷及社牛", "len": 846, "body": "<p>先說寧波給我們的感覺是奇妙，不是奇怪或不喜歡喔！<\/p>\n<p>來聊聊當地的火熱名店及感受，過境下午入住酒店之後有位超級熱心的小姊姊一直來造訪房間，問東問西也送我們小禮物，室內拖鞋、新牙刷及社牛般停不下的互動，我決定反問她在地走路可達的在地美食餐廳及市區景點，於是小姊姊推薦了這家名店：阿拉名灶·阿拉寧波人的味道，連必吃美點都說上了幾道。<\/p>\n<p>我們謝過後透口氣之後就出門拜訪，在溼熱中步行經月湖景區，城區的規劃非常美，道路井然有序，除了人行道上時不時衝出的電動車之外，整體城市綠意盎然，假日期間散步以當地居民為主，很少遊客。<\/p>\n<p>阿拉名灶月湖店就在公園旁，表定17點開賣，我們17:10到已經八分滿座，當地人必吃名不虛傳。各個餐點都用紅外線刷碼點單（如圖附影)，分到二樓位子後就可以開始去看自己想吃什麼，想吃什麼點什麼，費用及口味都好，整體真的CP值很高，這樣的店很適合台灣漁港的海產店來參考，價格更是透明，活海產都明訂價格，自行刷碼決定要不要下單美味，非常令人信賴。<\/p>\n<p>我們三人點了7道菜加餐具共202人民幣，真心推薦勾魂東坡肉、茄子年糕、辣炒大花蛤、養生小炒及清炒茼蒿這幾道，菜的份量都比台灣多，若有到訪別點太多，食量小的人真的吃不完，未來有機會再訪一定空著肚子去點活魚來吃。<\/p>\n<p>價格透明是我們這次旅程中最安心之處，只要多問問打車司機或熱心小哥哥小姊姊，其實一下子就會獲得很多推薦；再加上先學會了如何使用【美團】APP的使用，詳讀透明網評，入店前先問可否用美團上的團購價格付費，讓我們一路上不斷地有美食、美點相伴，在科技使用及現店探訪嘗鮮之間，也是非常快樂且有成就感的。<\/p>\n<p>路程中用餐間，我們一直在觀察寧波人，感覺上這兒主要是商業為主，說起話來沒那麼大聲，也比較內斂，現任台北市長的阿公及阿祖就是來自寧波市奉化區的人，想想剛才路經的月湖也真有點像桃園大溪慈湖，難怪一路上就覺得熟悉，無論是溼熱的天氣及水綠的景色。<\/p>\n<p>晚上吃太飽再走去附近的天一廣場散步購物，步行至快回到飯店時又下起了颱風環流的大雨，趕緊進入酒店上樓打包準備飛回台北。<\/p>"}, {"id": "f1722076308", "date": "2024-07-27", "title": "有看過黒鏡Black Mirror影集嗎？如果有，那就是…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "有看過黒鏡Black Mirror影集嗎？如果有，那就是我們一家快閃寧波18小時的奇妙感覺。 因為颱風讓10天旅程變成12天，途經中轉的城市從福建福州變成浙江寧波。寧波是個讓我們說", "len": 569, "body": "<p>有看過黒鏡Black Mirror影集嗎？如果有，那就是我們一家快閃寧波18小時的奇妙感覺。<\/p>\n<p>因為颱風讓10天旅程變成12天，途經中轉的城市從福建福州變成浙江寧波。寧波是個讓我們說不上來的城市，或許是我們旅途累了，也或許是城市的人設真的找不到定位，好似一個沒有靈魂的城市。<\/p>\n<p>入城時的機場排班計程車司機愛接不接，看行李多就不太想接，要不是我們真的累了後面又沒車可等，背後又一大堆在排隊的客人，我才不想打這台車，坐進去的感覺更是奇特(如圖)，問問題也不回，就自顧自地開到酒店放我們下；最後，更是照表42元，司機自己趕緊按掉後報43元。<\/p>\n<p>2024.7.30更正(原來是多了張發票1元的工本費，整理資料時才發現誤會人家了，在此更正誤會道歉，1元是我該付的，但身為司機說一聲更好)<\/p>\n<p>入住飯店時也很奇特，先說其實整體設施、星級都不錯，而且清晨離開時交接都非常完整，沒有任何的負評，甚至不得不地要覺得滿意。<\/p>\n<p>但，整體的體驗內容就像酒店名「寧波華僑溫德姆至尊豪廷大飯店」一樣，事事多餘。每個服務階段，人員都好像在演戲，從前臺、男管家、女管家、打掃阿姨、送點心阿姨及送枕頭小妹等都超愛互動，非常熱心且多言，完全無視我們一家疲倦的表情，東聊西談的，帶到最後就是要我們上網寫他們的名字，給個數位平臺上的個人好評。<\/p>\n<p>有種陷入數位評價迴旋的末日感。<\/p>\n<p>更為同為餐旅人的他們感到悲傷。<\/p>"}, {"id": "f1720252321", "date": "2024-07-06", "title": "新加坡人力局Compass頂級學府", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "新加坡人力局Compass頂級學府 新加坡這幾年是最多富豪想移居的國家，新加坡的護照也是2024年最強護照，但非常怕熱的我寧可移民去北國絕對不會選擇一個不能穿冬衣的國度，但其實自己", "len": 344, "body": "<p>新加坡人力局Compass頂級學府<\/p>\n<p>新加坡這幾年是最多富豪想移居的國家，新加坡的護照也是2024年最強護照，但非常怕熱的我寧可移民去北國絕對不會選擇一個不能穿冬衣的國度，但其實自己根本沒資格被當富豪，想太多。<\/p>\n<p>查資料時有看到新加坡人力局公告移民加分一覽表，在學歷的部分的加分分為三類，高中以下0分，一般大學10分，頂級學府20分。其實聽曾在駐臺新加坡移民單位工作的人說過，其實新加坡移民單位還有列出根本不算分的台灣大學列表，所以有那些學校不能被歸類為一般大學，別國人也是有想法的。<\/p>\n<p>台灣被列入的A類全球\"頂級學府\"只有三校，好像也與我們自己的認知不太相同喔。而且以觀光旅遊業為重點的新加坡也有列了一所知名大學的旅遊管理、旅遊學的學生為B類指定科系，真心覺得星國對旅遊專業的尊重。<\/p>\n<p>相關報導放留言。<\/p>"}, {"id": "f1719808275", "date": "2024-07-01", "title": "2024半年報", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2024半年報 本來超不想寫的，結果臉書跳出提示，我也就看了一下手機累積的數字，從去年的記錄心得發現都差不多，但是也有點不一樣，其實這就是原子習慣的力量。 一、1000KM2024", "len": 686, "body": "<p>2024半年報<\/p>\n<p>本來超不想寫的，結果臉書跳出提示，我也就看了一下手機累積的數字，從去年的記錄心得發現都差不多，但是也有點不一樣，其實這就是原子習慣的力量。<\/p>\n<p>一、1000KM2024仍在進行中，半年跑了464.9公里，比去年少了2.3公里，而且速度變慢了，可能是因為今年比去年同期更忙，有很多時候都是利用零碎的時間找個距離，跑跑走走；希望下半年可以好好地為自己持續跑步。<\/p>\n<p>二、112學年第2學期結束，成績也在上週交了，除此之外這學期有努力爭取了一下校內教學績優教師，但是在整理自己教學表現，發現輔導學生比賽不足，教學成果也沒有好好呈現，當然不會獲選；所以最近要好好整理新創教學結果與記錄準備投稿，並規劃九月參與新創教學競賽。我覺得沒有整理教學記錄，就不知道盲點何在，只是靠經驗與口條上課，會讓課程流於表象。教學核心重在學習歷程的記錄與學生的成長，我們收到的學生並非績優學生，更需要教學設計讓他們在不自覺中打底，在激勵中向上。<\/p>\n<p>三、今天是自己導師班學生開始實習的第一天，其實我比他們更緊張，昨天就在群中三聲五令，希望實習就職第一天與未來每一天都平平順順，每位都通過新人考核。<\/p>\n<p>四、同一期間週末，我好像又中獎染疫了，哈哈，喉嚨隱隱地痛了3-4天，呼吸道也是腫脹難受，整晚為了關節酸痛、背痛、頭痛等等多重不適，斷斷續續地睡了10個小時。<\/p>\n<p>下半年我仍報名了二場12K及21K的馬拉松，全馬就先跳過，今年改跑華航半馬，長榮馬不會再參加。好家在有長期運動，讓我仍有體力工作、說話上課、準備考試、研習交作業等等。但我需要先休息幾天，閱讀、寫作、思考讓靈魂跟上我😘。<\/p>\n<p>Running Ray 2024.7.1<\/p>"}, {"id": "f1719451904", "date": "2024-06-27", "title": "【2023暑假課外閱讀書目】", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【2023暑假課外閱讀書目】 下週各家的小孩就要放暑假了，我們一家喜歡去圖書館借書，或是到實體書店去找書看，從中找合適自己或孩子的書來閱讀，大人也要一起讀書喔，你在看書，孩子一定也", "len": 678, "body": "<p>【2023暑假課外閱讀書目】<\/p>\n<p>下週各家的小孩就要放暑假了，我們一家喜歡去圖書館借書，或是到實體書店去找書看，從中找合適自己或孩子的書來閱讀，大人也要一起讀書喔，你在看書，孩子一定也會學。<\/p>\n<p>2024年阿狗學校的推薦用書仍未公告，但我想2023年的書單多半大家也都很陌生，炎熱的日子裡去借本書一起來閱讀吧。<\/p>\n<p>------高一新生-----<\/p>\n<p>王溢嘉，《悲．慧．生死書》，有鹿文化<\/p>\n<p>瓦力，《那一夜，莫札特的門有人在敲》，寶瓶文化<\/p>\n<p>石曉楓，《跳島練習》，九歌<\/p>\n<p>李屏賓，《光，帶我走向遠方》，平安文化<\/p>\n<p>林達陽，《2021臺灣詩選》，二魚文化<\/p>\n<p>馮國瑄，《黑霧微光》，皇冠<\/p>\n<p>張維中，《東京男子部屋》，原點<\/p>\n<p>張讓，《光的重量》，木馬文化<\/p>\n<p>蔣勳，《龍仔尾‧貓》，有鹿文化<\/p>\n<p>夏夏，《來日方糖》，時報出版<\/p>\n<p>賴香吟，《島》，聯合文學<\/p>\n<p>詹宏志，《舊日廚房》，新經典<\/p>\n<p>馬欣，《看似很美，其實是壞掉的》，木馬文化<\/p>\n<p>李清志，，《大叔Ojisan on the Road》，時報出版<\/p>\n<p>-------高二課外閱讀書目------<\/p>\n<p>王宣一，《國宴與家宴》，新經典<\/p>\n<p>文國士，《走過愛的蠻荒》，寶瓶文化<\/p>\n<p>何玟珒，《那一天我們跟在雞屁股後面尋路》，九歌<\/p>\n<p>何致和，《地鐵站》，木馬文化<\/p>\n<p>林銘亮，《尾巴人》，九歌<\/p>\n<p>黃庭鈺，《隱身術》，有鹿文化<\/p>\n<p>張曼娟，《自成一派》，天下文化<\/p>\n<p>張經宏，《如果在冬夜，一隻老鼠》，九歌<\/p>\n<p>焦桐，《慢食天下》，二魚文化<\/p>\n<p>陳雪，《少女的祈禱》圓神<\/p>\n<p>陳列，《殘骸書》，印刻<\/p>\n<p>陳育虹，《霞光及其它》，洪範<\/p>\n<p>楊智傑，《野狗與青空》，雙囍<\/p>\n<p>賴鈺婷，《親愛與星散》，有鹿文化<\/p>\n<p>駱以軍，《遺悲懷》，麥田<\/p>\n<p>鍾永豐，《菊花如何夜行軍》，春山<\/p>\n<h1>小班小狗子<\/h1>\n<p>2022的書單在留言區<\/p>"}, {"id": "f1718295408", "date": "2024-06-14", "title": "大學放榜？其實還沒完！", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "大學放榜？其實還沒完！ 大學申請放榜，貼上民國八十年大學聯考錄取分數，仔細看看經過了那麼多年，在理工類群組的熱門科系與現在仍舊差不多；類組也是換湯沒換藥！但是33年前的我們7月初考", "len": 342, "body": "<p>大學放榜？其實還沒完！<\/p>\n<p>大學申請放榜，貼上民國八十年大學聯考錄取分數，仔細看看經過了那麼多年，在理工類群組的熱門科系與現在仍舊差不多；類組也是換湯沒換藥！但是33年前的我們7月初考完後一個月內，成績及落點就出來了，多數的同學也就依志願確定系科。<\/p>\n<p>今日的高中學子不一樣，他們從過年前考完學測之後，經過了5個月，歷經一階填報、二階分校多場需付費的筆試面試、志願申請，到今天的分發放榜，一再地考量與準備各項試練後，仍只有部分學生確定大學系科。<\/p>\n<p>以家中孩子班上38位高中生來說，至今日也只有6位學生確定上岸。扣除要去對岸或海外讀書之外，仍有近三十位同學要參加七月中的分科考試，對這群充滿活力的大男孩而言真是一場試練。<\/p>\n<p>在人人都有大學念的台灣，設計這種整死學生的制度真的好嗎？<\/p>\n<p>至少，身為家長，我很不爽。<\/p>"}, {"id": "f1718340650", "date": "2024-06-14", "title": "台清交成電機系", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "台清交成電機系 整理了一下113學年度台清交成電機系的總招生人數為659人，扣除了部分的外加名額做了個小圖，有以下心得： 1.頂大電機系招生人數排序：交大(232)>台大(159)", "len": 528, "body": "<p>台清交成電機系<\/p>\n<p>整理了一下113學年度台清交成電機系的總招生人數為659人，扣除了部分的外加名額做了個小圖，有以下心得：<\/p>\n<p>1.頂大電機系招生人數排序：交大(232)&gt;台大(159)=成大(159)&gt;清大(109)，AI及半導體產業熱門，頂大電機系名額只有659人，112學年是653人，沒有明顯增額，仍為稀少資源。<\/p>\n<p>2.入學管道學生名額排序：申請入學(365)&gt;分發入學(147)&gt;繁星推薦(120)，但入學時程長達八個月以上，1月學測、2月繁星申請、3月繁星放榜、5月一階二階大亂鬥、6月個人申請放榜、7月分科測驗至8月分科放榜<\/p>\n<p>3.台大與清大個申二階考試同一天，頂大電機系與醫學院申請多為同一群學生，所以除了台大電機之外，多數都以備取作收；其實醫學院也一樣。<\/p>\n<p>AI人工智慧的發展不是突然間出現的，附上自己考大學民80年的各類組志願前十名，在第二類組中排名序與今日並沒有差距多少，三十幾年來台灣人的期待與志願都相同，電機工程學系一直都是所有考生與家長的期待，原因無它就是經濟因素；文史哲相關系科的選擇本來就興趣導向，如果家中無經濟壓力來選擇才是對的。<\/p>\n<p>像我自己當時沒想太多，民智未開考量不周填了社會系就是未考量自身家庭情形，沒有好好思量，只選校不選系的最失敗的例子。<\/p>"}, {"id": "f1717820639", "date": "2024-06-08", "title": "【個人無限公司】讀書心得", "cat": "理財情報", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【個人無限公司】讀書心得 自己有多本一人創業的書，而這本沒買，但內容不錯，有幾個觀念可以參考。 作者建議合適上班族進行的四種副業，用投入金錢與勞動量來分析如附頁圖。以個人心得是在台", "len": 349, "body": "<p>【個人無限公司】讀書心得<\/p>\n<p>自己有多本一人創業的書，而這本沒買，但內容不錯，有幾個觀念可以參考。<\/p>\n<ol>\n<li>\n<p>作者建議合適上班族進行的四種副業，用投入金錢與勞動量來分析如附頁圖。以個人心得是在台灣文章發表要看內容才能變現，如果真的要有流量又可以獲利，撰寫投資心得的文章比其他主題更有CP值。<\/p>\n<\/li>\n<li>\n<p>時間就是金錢<\/p>\n<\/li>\n<\/ol>\n<p>時間拿來浪費不如去賺錢，作者除了本業工作時間外，強調將一日剩餘時間再利用，計算方式可以用最基礎的基本工資來計算。例如：以個人上週看了手機27小時X183元=4941元(如圖，但我的LINE主要是用來工作)。一般人瀏覽手機多半不是為了工作，所以將一週看手機的時間累積下來，再乘以基本工資，就可以算出你白白花掉了你最基礎的時間與金錢有多少。<\/p>\n<p>經過強迫練習我已經減少至5千元以內。<\/p>\n<p>你願意與我分享你上週在手機上花了多少錢嗎？<\/p>"}, {"id": "f1716353521", "date": "2024-05-22", "title": "天道酬勤、業道酬精", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "天道酬勤、業道酬精 照片中平溪線車廂裡青澀的學生是三年前疫情正熱時，在全球航空停飛旅遊禁令中，選擇醒吾旅運系就讀的一年級新生班；大雨中，這群學生們載著口罩穿著薄衣，在一夜未眠之後仍", "len": 380, "body": "<p>天道酬勤、業道酬精<\/p>\n<p>照片中平溪線車廂裡青澀的學生是三年前疫情正熱時，在全球航空停飛旅遊禁令中，選擇醒吾旅運系就讀的一年級新生班；大雨中，這群學生們載著口罩穿著薄衣，在一夜未眠之後仍熱情地與老師去鐵道旅行校外教學。<\/p>\n<p>三年間，我們在校園中認識了彼此，學習、輔導、交流與成長，口罩下的學生都已轉變為成熟的大人，將一一地投入專業的職場工作。最後一張表，呈現出一個39人的科大班級學生，在校期間在師生努力教學與進取中，取得巨量的137張專業證照(直至0522中午都仍在考Amadeus證照)，才能在與各校激烈的實習競爭中爭取到了令人羨慕的實習單位。<\/p>\n<p>為師非常驕傲，更期待大家在未來一年的實習中自信展現，在校同學積極學習，就如天燈上的祈願，希望我們全班都ALLPASS。<\/p>\n<h1>可樂旅遊7人<\/h1>\n<h1>東南旅遊1人<\/h1>\n<h1>行家旅遊3人<\/h1>\n<h1>皇翔國際2人<\/h1>\n<h1>桃園航勤4人<\/h1>\n<h1>立榮航空4人<\/h1>\n<h1>長榮航空4人<\/h1>\n<h1>星宇航空2人<\/h1>\n<h1>台灣高鐵2人<\/h1>"}, {"id": "f1716178253", "date": "2024-05-20", "title": "高中學測剛結束，大學二階、分科進行中......", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "考季 高中學測剛結束，大學二階、分科進行中...... 給考生也給家長，祝福大家心想事成。 五文昌 文昌帝君：雙連文昌宮、新莊文昌祠、艋舺龍山寺、竹林山觀音寺 關聖帝君：台北行天宮", "len": 326, "body": "<p>考季<\/p>\n<p>高中學測剛結束，大學二階、分科進行中......<\/p>\n<p>給考生也給家長，祝福大家心想事成。<\/p>\n<h1>五文昌<\/h1>\n<p>文昌帝君：雙連文昌宮、新莊文昌祠、艋舺龍山寺、竹林山觀音寺<\/p>\n<p>關聖帝君：台北行天宮、艋舺龍山寺、竹林山觀音寺<\/p>\n<p>文魁夫子：雙連文昌宮、艋舺龍山寺、竹林山觀音寺<\/p>\n<p>朱衣神君：雙連文昌宮、台南祀典大天后宮<\/p>\n<p>孔老夫子：台南孔廟、台北孔廟、台中孔廟、新竹孔廟、彰化孔廟<\/p>\n<h1>考場土地公<\/h1>\n<p>北一女228公園福德宮：台北市中正區懷寧街107號<\/p>\n<p>建中龍光土地公：台北市中正區和平西路二段36巷8弄9號<\/p>\n<p>師大附中仁慈宮：台北市大安區大安路一段224巷<\/p>\n<p>中山女高福德正神：台北市中山區松江路78巷10號<\/p>\n<p>台大伯公亭：台北市大安區羅斯福路四段85號<\/p>\n<p>交大光明福德公：新竹市東區大學路50號<\/p>\n<p>清大土地公：校園後山弈園內<\/p>"}, {"id": "010489f7", "date": "2024-05-08", "title": "海水退了才知道誰沒穿褲子", "cat": "生活記憶", "src": "方格子", "url": "https://vocus.cc/article/663b8f5afd897800010489f7", "ex": "記憶像是綻口的毛線，一旦找到了頭便能一扯再扯、沒完沒了。(摘自向田邦子父親的道歉信-學生的冰淇淋) 海水退了才知道誰沒穿褲子。 小時候常去海邊玩，為了怕衣服溼掉，所以我就是那個沒穿", "len": 1221, "body": "<p>記憶像是綻口的毛線，一旦找到了頭便能一扯再扯、沒完沒了。(摘自向田邦子父親的道歉信-學生的冰淇淋)<\/p><p>海水退了才知道誰沒穿褲子。<\/p><p>小時候常去海邊玩，為了怕衣服溼掉，所以我就是那個沒穿褲子的小孩，褲子是我自己脫掉的，我把褲子放在岸上，用黑色的大輪胎泳圈圍住小屁屁，這樣就沒人看得到我沒穿褲子。 每年的暑假在回台中前幾天，有幾年我會回苗栗崎頂的外婆家等阿公從台中來接我，也有幾年我是整個暑假都在崎頂。說是外婆家有點怪，我喜歡說外公外婆家，可能是角色的印象中這個家人口眾多，有永遠坐在門前眼睛看不見的查埔祖，門側有好幾座磨刀石，阿公及阿舅時常坐在凳子上磨著工作用的菜刀，有大把的剁刀，有殺魚的長刀，也有可以將蔬果刻花的精巧小刀。還有常常坐在房間中唉聲嘆氣的外婆，最常聽到的就是她頭昏不舒服；後面有著兩口燒材大灶旁就時常看到家人的身影，這個窮困的家送養了四阿姨，我媽至三阿姨也都早婚，另外年紀與我接近的阿姨就是玩伴，所以會看到的反而是阿舅在生火煮食。<\/p><p>上桌的菜沒什麼美食，最常有的都是靠海捕來的煎雜魚、滿園隨處蔓長的炒地瓜葉，前院母雞母鴨生的蛋炒蘿蔔，還有加了好多地瓜都看不見米飯的地瓜飯，煮好了就用鋁鍋子裝著，餓了就打開蓋子來吃，多半都放到冷了，也沒什麼一起坐著吃的記憶。等長大後才發現要全家坐在一起吃飯是那麼難以獲得的幸福。<\/p><p>因為小時候常去海邊、溪邊玩水，玩伴都是與我年齡相近的小孩，那時的苗栗崎頂海邊是有公共造產的海水浴場，有收門票但入口之後就沒有任何管制，印象中還會放置黑色的橡膠內胎供想使用的遊客隨取。我們當地人那可能付費去泡海水，反正海岸防風林本來就是我們的冒險地與遊樂場，隨便找個木麻黃林的缺口走出去就是大海；但是海水很黏上岸之後總要找清水洗澡穿回乾淨的衣褲才能回家，當小孩最好，跟著大人走進中間有個大水槽的洗澡區不會有任何人注意，沖完清水後就可以大搖大擺地從正門走路回外公外婆家。<\/p><p>印象中的崎頂海水浴場很寬廣，鐵灰色的沙灘上打著一波波不是很清澈的海浪，混沌的海水讓我們小孩沒穿褲子也不太會被發現，只是空著下半身涼涼的總是玩得不太愉快，所以多半仍是有件小內褲在身上比較有安全感。四五十年前的暑假期間海水浴場是人山人海，當時的台灣人可以休閒娛樂的樣態不多，便宜不花錢的海邊總是一個闔家歡樂的好選擇，只是印象中我從未與父母一同，就是海邊幾個野小孩招了就一起去玩水、找貝殼、堆沙一直玩到太陽西落肚子餓了就沿著小徑回家。<\/p><p>特別的是，我們沿著路走時會特別注意一種很類似A菜的野菜，一叢一叢地長在路邊，小孩們都是隨手一直拔一直拔，直到滿手都是為止，回家後用柴刀剁碎再來餵雞鴨，那是外婆家鴨子喜歡的鴨仔菜。<\/p><p>向田邦子的【父親的道歉信】是一篇篇書寫的回憶，用一串串的文字將與家人生活的小事與觀察連結起來。日文翻譯很貼近母語，推薦大家可以借來閱讀，應該會和我一樣有種慢慢地、恬靜地回憶感。如果你有想起什麼小時候的往事，或是與我一樣曾經光屁股玩水，按個笑臉或愛心讓我知道喔。<\/p>"}, {"id": "f1715008946", "date": "2024-05-06", "title": "FIT是旅行業對散客票常用的縮寫，但是全文到底是什麼呢？", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "FIT是旅行業對散客票常用的縮寫，但是全文到底是什麼呢？ 今天我上課時是寫 Free Individual Ticket 下課後深覺不對，上網查了之後更是昏頭，以下是各類說法： F", "len": 284, "body": "<p>FIT是旅行業對散客票常用的縮寫，但是全文到底是什麼呢？<\/p>\n<p>今天我上課時是寫 Free Individual Ticket<\/p>\n<p>下課後深覺不對，上網查了之後更是昏頭，以下是各類說法：<\/p>\n<p>Free Individual Tourist<\/p>\n<p>Flight Individual Travel<\/p>\n<p>Foreign Independent Tour<\/p>\n<p>Foreign Individual Tourist<\/p>\n<p>Full Independent Tour<\/p>\n<p>Frequent Individual Tourist<\/p>\n<p>Flexible Independent Tour<\/p>\n<p>Free Independent Traveller<\/p>\n<p>好啦，反正散客就是FIT，想太多反而麻煩。<\/p>"}, {"id": "014585cd", "date": "2024-05-05", "title": "大專學生獎學金列表", "cat": "技職教育", "src": "方格子", "url": "https://vocus.cc/article/66378ecbfd897800014585cd", "ex": "需要的同學家長隨時拿去用(歡迎分享)，記得每個獎學金都有規定，要點入各單位連結說明詳細閱讀，內容依時序排列，過期但常態性會排序後面供大家參考。 隨時徵件獎學金 #中華開發文教基金會", "len": 1315, "body": "<p>需要的同學家長隨時拿去用(歡迎分享)，記得每個獎學金都有規定，要點入各單位連結說明詳細閱讀，內容依時序排列，過期但常態性會排序後面供大家參考。<\/p><p><b>隨時徵件獎學金<\/b><\/p><p>#中華開發文教基金會 <b>技藝職能獎學金<\/b><\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://\" rel=\"noreferrer\">https://www.cdffoundation.org/zh-tw/scholarships/vocational-education-scholarship<\/a><\/p><p><b>​各年度獎學金 (下學期)<\/b><\/p><p>每年 2月至3月間 #竹林山寺<a target=\"_blank\" rel=\"noopener\" href=\"https://bonus.zlskyt.com.tw/\" rel=\"noreferrer noopener\">獎學金<\/a><\/p><p>每年 2月至3月間 #關渡宮<a target=\"_blank\" rel=\"noopener\" href=\"http://www.kuantu.org.tw\" rel=\"noreferrer noopener\">獎學金<\/a><\/p><p>每年二次 3月及9月 #宜蘭縣政府中等以上學校優秀學生獎學金<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://rff.ilc.edu.tw/prise/\">https://rff.ilc.edu.tw/prise/<\/a><\/p><p>每年二次 3月及9月開學時 #行天宮助學金<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.ht.org.tw/religion154.htm\">https://www.ht.org.tw/religion154.htm<\/a><\/p><p>每年二次 3月及9月開學時 #松山慈祐宮獎學金(松山、信義、內湖、南港、中山、大安及汐止區)<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.ssjyg.org.tw/groupView.aspx?View=50\">https://www.ssjyg.org.tw/groupView.aspx?View=50<\/a><\/p><p>每年二次 #平安菁英獎學金申請(有學校及資格限制)<\/p><p>https://www.elite-well.org.tw/scholarship.php<\/p><p><b>各年度獎學金 (上學期)<\/b><\/p><p>每年二次由學校申請 #桃園市原住民族學生獎助清寒獎助金及優秀獎學金(2024.5.5更新)<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://\" rel=\"noreferrer\">https://ipb.tycg.gov.tw/News_Content.aspx?n=11010&amp;s=1077352<\/a><\/p><p>每年 8.1-9.30 #群園助學金<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://chionyuan.sino1.com.tw/\">https://chionyuan.sino1.com.tw/<\/a><\/p><p>每年 8.15-9.30 #華嚴蓮社大專學生佛學慈孝獎學金<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://\" rel=\"noreferrer\">https://www.huayencollege.org/index.php/scholarship/newest<\/a><\/p><p>每年10初完成申請 #國泰卓越獎助計畫(2023更新)<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://patron.cathaylife.com.tw/ODAY/F1/ODAYF100\">https://patron.cathaylife.com.tw/ODAY/F1/ODAYF100<\/a><\/p><p>每年 9.1-10中旬 #鴻海獎學金(2023更新)<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.foxconnfoundation.org/plan/scholar/university/questions/class_0\">https://www.foxconnfoundation.org/plan/scholar/university/questions/class_0<\/a><\/p><p>每年二次由學校申請 #原住民族委員會大專院校原住民學生獎助學金<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://cipgrant.fju.edu.tw/\">https://cipgrant.fju.edu.tw/<\/a><\/p><p>每年 9月至10月間 #中華電信方賢齊先生獎學金<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://\" rel=\"noreferrer\">https://www.chtf.org.tw/project/693<\/a><\/p><p>每年年底開放申請 #九如禪林基金會第二屆優秀學生獎助學金<\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://ennead-tw.org/projectb/\">https://ennead-tw.org/projectb/<\/a><\/p><p><b>醒吾科大學務處獎學金專區<\/b><\/p><p>校內獎學金 <a target=\"_blank\" rel=\"noopener\" href=\"https://b002.hwu.edu.tw/Category?CId=648\">https://b002.hwu.edu.tw/Category?CId=648<\/a><\/p><p>校外政府機關 <a target=\"_blank\" rel=\"noopener\" href=\"https://b002.hwu.edu.tw/Category?CId=708\">https://b002.hwu.edu.tw/Category?CId=708<\/a><\/p><p>校外民間 <a target=\"_blank\" rel=\"noopener\" href=\"https://b002.hwu.edu.tw/Category?CId=709\">https://b002.hwu.edu.tw/Category?CId=709<\/a><\/p><p><b>新北市教育局獎學金專網<\/b><\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://award.ntpc.edu.tw/\">https://award.ntpc.edu.tw/<\/a><\/p><p><b>桃園市獎學金專區<\/b><\/p><p><a target=\"_blank\" rel=\"noopener\" href=\"https://dept.pjhs.tyc.edu.tw/DEPT/SCH/\">https://dept.pjhs.tyc.edu.tw/DEPT/SCH/<\/a><\/p>"}, {"id": "01355ba7", "date": "2024-05-04", "title": "1980年時的獨自旅行回憶", "cat": "旅行郵輪", "src": "方格子", "url": "https://vocus.cc/article/6635f3f9fd89780001355ba7", "ex": "你喜歡獨自旅行嗎？我非常喜歡，我深愛沿途中獨享發現的觀察，也期待未知的景物帶給我的感動。這樣的獨行從我很小就開始，準備旅行、起身出發、倦鳥歸巢都是如此地自由自在。 大家十歲前有自己", "len": 1300, "body": "<p>你喜歡獨自旅行嗎？我非常喜歡，我深愛沿途中獨享發現的觀察，也期待未知的景物帶給我的感動。這樣的獨行從我很小就開始，準備旅行、起身出發、倦鳥歸巢都是如此地自由自在。<\/p><p>大家十歲前有自己出遠門嗎？<\/p><h2 id=\"heading-6147425\">單車旅行<\/h2><p>1980年，差不多是國小二三年級左右，我媽會給我差不多每天１元的零用錢，來源多半是幫忙做家事，例如洗碗、拖地或是幫忙去巷口、菜市場買雜貨或生鮮。小朋友有了一點點錢之後就會有些規劃，我的規劃多半是騎腳踏車去旅行；但最特別之處是，我常常騎車去旅行我的家人並不知道，因為我都是半夜３點出門去，差不多在天亮前回到家。<\/p><p>我會先用累積的零錢，在幫忙去雜貨店買蛋、鹽、豆油等家用品時，為自己買一點零嘴，多半是紅紅的鱈魚片、黑人涼糖、像檳榔的紅色土芒果片等等，如果是很期待的日子會加個牙膏巧克力來獎賞自己；之後就放在自己的床邊裝成一小包，早早先去睡覺等待一早的到來。<\/p><p>我有一台前面有籃子的腳踏車放在公寓的樓梯間，天氣不錯的清晨三點我就會帶著點心騎向黑暗的街道出門去旅行，騎過遠東紡織廠的圍牆邊的大排水溝橋，在戲院門口右轉上四川路後就右轉往亞東醫院及亞東工專的方向騎去，四十幾年前夜裡的道路是很安靜的，可以迎著涼風邊吃沒營養的小零食，同步觀察著沿路平時車水馬龍街道旁完全不同的風景；以前亞東醫院附近有個游泳池及運動區，我會在那附近做為折返點休息區，差不多4點多時已經開始有晨運的少數人出現，我一個小朋友騎著車倒是沒有人多問，非常自在；之後再依著同方向東轉西繞地回家，靜悄悄地開門上樓回床上睡覺。<\/p><p>這個小旅行至少持續了好一陣子，次數我都數不清了，但都沒有家人發現喔。<\/p><h2 id=\"heading-6147435\">鐵道旅行<\/h2><p>小時候因為每年暑假我都要回台中過暑假，但年輕又忙碌的爸媽根本要找到空間帶我回去，當年的火車是要坐很久很久的，無論是車資光費與來回時間，都不是當年的他們可以承受的。<\/p><p>所以記得國小三年級時，我就與媽媽一同去板橋火車站，她買月台票，我買半票，自己一個人搭著莒光號回台中，沿路我找車掌阿姨告訴她我一個人坐車，她好心地讓我坐在她的小位子上，因為她要去推餐車賣商品，我一路觀察著每一停站的車牌，默念著板橋到台中的每一站名，因為那個小位子沒有窗戶，擔心過站未下。<\/p><p>到了台中站，我會自己下車從後站出門，我的阿公一定會在後站剪票前依車班時刻等我，再騎著摩托車載我回興大五村的宿舍；用一段獨自的鐵道旅行開始我最喜歡又閒散的悠長暑假。<\/p><h2 id=\"heading-6147443\">巴士旅行<\/h2><p>我也深刻記得國小五年級時，我上完後埔國小自然資優班課程下課，走回板橋四川路韾華戲院大明街的四樓公寓家時，家門深鎖無人應門；那時我才想起當天是搬家日，我們的新家在中和景平及景安路附近，我用對環境的熟悉度及對交通工具的認知，搭上了人生第一次的10路台北客運，從四川路出發經過板橋車站、中山路、積穗轉連城路，一路上一直找熟悉的景色與關鍵地點，直到看到中和廟口站，我知道新家就在附近。那時天已黑，我在大約現在南山路轉景安站的地點下車，用我唯一一次來看新家的沿路記憶找到了在中和的新家，進門時，媽媽正在準備拜地基主，看了我一眼，只說：喔，你回來了。<\/p><p>你知道嗎？其實動物都有本能，在沒有任何學習幫助下回到自己的家。<\/p><p>鮭魚如此、大象如此、候鳥如此，我也如此。<\/p>"}, {"id": "0135779d", "date": "2024-05-04", "title": "駱老闆和他的朋友們－西門町舞廳老大", "cat": "旅行郵輪", "src": "方格子", "url": "https://vocus.cc/article/6635f6b0fd8978000135779d", "ex": "上文全篇只提到一個人，駱老闆，的確他就是這家旅行社的靈魂。駱老闆長得高高瘦瘦的，有著很深的臉部輪廓及法令文，頭髮會用髮油向上向後做成一個很有個性的造型。這是一家旅行社，但是我總沒有", "len": 1537, "body": "<p>上文全篇只提到一個人，駱老闆，的確他就是這家旅行社的靈魂。駱老闆長得高高瘦瘦的，有著很深的臉部輪廓及法令文，頭髮會用髮油向上向後做成一個很有個性的造型。這是一家旅行社，但是我總沒有看過他帶過團，也沒聽過他會帶什麼團去那裡。他最常做的事，就是坐在辦公室內抽煙，會客和打電話，常常有人來訪進進出出地，進門後就關了起來，也不知道他們在聊什麼。<\/p><p>唯一一次聽他提起出團的事，是有一群要去新加坡的客人，要我去桃園中正機場送機，我一早就騎車去松山機場附近停車轉搭國光號去桃園中正機場，背著書包裝滿了整團的護照資料提前去機場櫃台地勤，幫所有客人集體先辦好登機證，在機場等團體到達將資料交給領隊，我再坐國光號回到台北松山機場附近去騎我的摩托車，記得那天我還順路去了敦化北路的前雄獅旅行社去找業務取件。<\/p><p>雄獅旅行社的辦公室大樓非常摩登，就在民生東路及敦化北路口三角窗，在大熱天走進大樓時迎面而來的是室內的瀑布，又涼快又高級，很羨慕在雄獅那棟大樓上班的上班族。而我只是個來納涼的送件兼送機小弟。<\/p><p>後來我回到民生東路公司時，駱老闆走到我的小桌子前，坐在前面位子轉了回來面對我說：「大學生，你的英文應該不錯厚，下次新加坡團給你帶出去」。我好開心，因為我從來沒想過可以出國去，平日下課及寒暑假都在打工的我，幻想起了可以出國的機會。但結果是在大亞旅行社打工快二年，我依然就是收帳送件，的確，我後來知道我可能是公司英文最好的人，但新加坡出團一事仍與我無關。<\/p><p>有天快中午，我接到公司會計通知要我去西門町收件，要記得帶一個比較大的背包，所以那天我背著高中書包，將機車停好之後依著地址來到了一棟複合式大樓前，看了樓層指示才知道我要去的地方是紅包場，大樓外有著幾位老人身旁都是塑膠袋一包包地，在吃著便當；坐上電梯門一打開就來到舞廳，一位身材丰姿綽約的歌手在閃閃爍爍的燈光唱著韻味老歌，手上有個幾個紅包，下方沙發坐著幾位上了年紀但穿著整齊的阿伯陶醉在其中。<\/p><p>我向舞廳服務員表達來意之後，她走進酒吧撥了內線之後，就示意我隨她腳步走進酒吧後台一個暗門。暗門打開之後是一個小小的辦公室，沒人，遶過辦公區之後在櫃後再推開另一個暗門，竟然是一間套房一張床，我眼光不敢亂看亂飄地隨著服務生再打開一道門。眼前突然一亮才想起當時是正中午，窗外陽光大好映入眼簾的是一間有著巨大紅木董事長桌的辦公室，椅子上坐著駱老闆要我來找的朋友，他穿著深色襯衫坐在一個鑲有象牙還是山豬牙的椅子上，就像電影中的黑社會老大一模一樣。<\/p><p>老大要我坐在窗下的沙發上，請服務生倒了杯水給我，我竟然也就喝了。老大說：駱總請你來拿錢，有帶包包嗎？我回有，就指了指上面有師大附中四個字的綠書包，老大笑了，就到櫃子中拿了一疊又一壘的綠色鈔票堆在茶几上，要我放入書包之中，我算了算錢應該有近百萬新台幣，將高中書包整個裝滿變成方方正正的書包。<\/p><p>隨即舞廳老大就打了個電話給駱老闆，表示我要準備回民生東路公司，我背起沉甸甸的書包又隨著服務員走出如迷宮的房間，再看了一眼舞台上的歌手，她仍拿著紅包袋賣力忘情地唱著。回程中，我心中只想著好多錢呀，我從來沒看過那麼多錢，而且現在就放在我的書包內，用這樣的心情返回老舊的旅行社。<\/p><p>回想至此，我是現代傳聞中是車手嗎？如果我回程中被警察臨檢會不會像報導中一樣，被帶回派出所詢問，那一整包的錢我要如何解釋，我要怎麼辦呢？<\/p><p>最近各級校園正在反詐騙，我的身邊更不缺被騙失財的例子，錢這個東西當你親身見到時真的就會被迷幻，藏在每個人心中的貪念與慾望就會蠢動，現在每天面對的學生就與我當年一樣年紀，他們或許也會和我一樣碰見類似的打工經驗與不得不的行為。當沒有過往歷練與法律觀念做為前提時，傻傻的大學生還會以為這就是社會，這就是經歷，這就是學習。<\/p><p>但其實不是，這就是無知。<\/p>"}, {"id": "01358b5b", "date": "2024-05-04", "title": "駱老闆和他的朋友們－二樓陳小姐", "cat": "旅行郵輪", "src": "方格子", "url": "https://vocus.cc/article/6635f873fd89780001358b5b", "ex": "出國換匯大家都去那一家銀行？ 如果出國前有時間，我會為了省100元手續費去台灣銀行排隊；但如果沒有時間，其實在機場的台灣銀行或兆豐商銀換匯就好，省時又安全。 但是三十年前好像不是這", "len": 1115, "body": "<p>出國換匯大家都去那一家銀行？<\/p><p>如果出國前有時間，我會為了省100元手續費去台灣銀行排隊；但如果沒有時間，其實在機場的台灣銀行或兆豐商銀換匯就好，省時又安全。<\/p><p>但是三十年前好像不是這麼一回事，因為我們旅行社就老是有人來換外幣，一進門有人問想換錢嗎？我們都會回答：找會計陳小姐！陳小姐是老舊旅行社中感覺起來比較不老的一位姊姊，其實她的工作除了是駱老闆公司會計之外，也兼任OP，常常掛在嘴上的就是：呀，工作就是這樣啦，忙著忙著一天就過完了。<\/p><p>什麼是OP，換成中文就是旅行業產品操作人員，對客人整理證件辦理資料、收款，向航空公司訂票、飯店訂房，對當地旅行社(簡稱LOCAL)的連繫，這樣的工作多半稱為OP，日本線另有個名詞：手配。其實就差不多是一樣的作業內容。所以這工作是旅行社中最少出門的職位，多半的時間就是在公司內接打電話連繫客人，整理收件小弟(我)收回來的資料。<\/p><p>但是我們公司很奇怪，陳小姐常叫我去換錢，但不是去台灣銀行或ICBC中國國際商銀換，而是萬華的巷子內一間四層鄰街店面的二樓換，記憶中我都是從民生西路直騎到延平北路，過了北門之後就再沿著中華商場邊騎邊逛地將忠孝仁愛信義和平八排都騎完，突然間中華路二段之後，市容就冷清了下來就右轉往廣州街直行過了龍山寺，過了西園路再往前幾個巷子就轉進路邊找個一樓隨便將我的小白停下來，走到一棟轉角的店面旁，有個長長的樓梯，可以直通二樓、三樓和似有似無的四樓，二樓會有個木門在右側，門後人聲鼎沸非常熱鬧，我也熟門熟路地轉了把手就進門去。<\/p><p>會計陳小姐常要我去找另一位陳小姐，二樓陳小姐，她很年輕，至少比我們家會計陳小姐年輕；二樓的門一打開後，可以看到一整個長方型的房間，房間佈著五六個桌子，每個桌子前坐著一位小姐，各桌以匯兌的外幣來區分，不同的桌子就不同的外幣兌換區，有美金、日元、韓圓、泰幣、馬幣及歐洲各國的法朗、英鎊等等。陳小姐是換美金的，我最常去找她，她看到我都會泛著笑意，問東問西的：什麼學校？念什麼系呀？不用上課呀？有沒有女朋友？因為我就是個很沉默的大學生，就隨便回應幾句當認識。<\/p><p>那段日子我總是用高中書包背著著駱老闆收來的台幣去二樓換美元，沉甸的書包在換完美金後就輕了許多，有幾次我還會到臨近的大理街黑幫街口去收件；學期間還要再騎過華江橋及新海橋回新莊輔大去上課，書包內除了美元之外，還有我的課本與筆記一同，所以我常在趕時間，因為老師會點名，如果是小組討論課程更麻煩根本逃不開。時常那一包又一包的美金、護照、證件等就跟著我上課、下課、系學會活動，也許隔天才會回到民生東路的老舊旅行社交給我們家會計陳小姐。<\/p><p>現在回想，這是洗錢嗎？<\/p><p>那間在萬華龍山去不遠的二樓外幣匯兌所，我怎麼想都想不起來確切位置了。<\/p>"}, {"id": "01fb66ce", "date": "2024-05-02", "title": "移居花蓮：蓮花大樓", "cat": "生活記憶", "src": "方格子", "url": "https://vocus.cc/article/6633117dfd89780001fb66ce", "ex": "在台北住了三十幾年突然間因為工作轉換，決定要搬到花蓮島內移居，天真的自己只想要找一間可以看山看海的房子來住，這是間在花蓮市與吉安鄉交界的大樓，窗景可以看到太平洋，廊廳可以見到中央山", "len": 857, "body": "<p>在台北住了三十幾年突然間因為工作轉換，決定要搬到花蓮島內移居，天真的自己只想要找一間可以看山看海的房子來住，這是間在花蓮市與吉安鄉交界的大樓，窗景可以看到太平洋，廊廳可以見到中央山脈，左方近山就是鯉魚山，後面就是花蓮最大的內陸湖鯉魚潭。兩房一廳一衛每個月10000元的租金台北人感覺算合理，海景山景真的就是無價。<\/p><p>在七腳川溪旁的蓮花大樓住了一年多，在隔岸的吉安的寶具熊托嬰中心找到了日間可以照顧小孩，讓自己與家人都有日間自己的時間，整體而言，最辛苦的是我們家的狗狗，她只能住在陽台上，因為家中有嬰兒也不太方便，有時間再帶他下樓走走。<\/p><p><b>真心奉勸別在年輕打拚時養狗，沒時間與空間好好愛他，對人與狗雙方都是遺憾。<\/b><\/p><p>這間在蓮花大樓的短期租房在2006至2007年間，當我們在花蓮暫時住處，住慣之後就考量就近購屋，因為在任何地方生活，如果經濟算一算租屋與貸款的金額相近，一定要將買房子當成最重要的事，我們以每月一萬元的本利計算，嘗試地在花蓮以總價200萬至250萬為目標找房，加上青貸及工作所得，只要省吃簡用一定可以擁有自己的小屋。後來我們有買到之後再介紹；而這間租房其實我們也有出價150萬元想買下來，可是房東不願賣，同大樓其他的坪數又太大超過我們的預算與能力。青年夫妻凡事盡力量力，以家庭穩定為最重要核心，別心太大做了自己無法負擔的決定。<\/p><p>花蓮的海與山的美好，說實在不屬於年少打拚的年輕人，每天忙於工作、育兒與日常經濟壓力，海與山反而成了一種生活的隔離，對於未來更感覺到一股茫然，因為山海天天都在，但是生活的壓力卻得日日面對，是一種非常矛盾的感覺。<\/p><p>近年台灣政策上在推動地方創生的這件事，說實在是個太過浪漫的政策規劃，創生最重要的二大內容就是經濟與生育人口，在花蓮或偏鄉，除非是家中有地有房有業，否則浪漫的想法只會讓年青人走入難以成長進步的巨大泥沼。<\/p><p>親身移居花蓮才知現實難敵想象。<\/p><p>2024.4.3的花蓮大地震造成難以估算的損失，回想起18年前我們移居花蓮時的落腳處-蓮花大樓，對比起此時此刻大樓的慘狀，心中的遺憾與傷痛仍難以平復。<\/p>"}, {"id": "01ecefbf", "date": "2024-05-01", "title": "別讓算命毀了你", "cat": "生活記憶", "src": "方格子", "url": "https://vocus.cc/article/6631d9ebfd89780001ecefbf", "ex": "你有去算過命改過名字嗎？ 記得有一年我開了車依著家人給的命相館地址，在桃園的一處民房前依約去算命；待全家剛搬去花蓮工作時，也藉由當時初認識的朋友推薦去花蓮大同街算命。 那時的我主要", "len": 1187, "body": "<p>你有去算過命改過名字嗎？<\/p><p>記得有一年我開了車依著家人給的命相館地址，在桃園的一處民房前依約去算命；待全家剛搬去花蓮工作時，也藉由當時初認識的朋友推薦去花蓮大同街算命。<\/p><p>那時的我主要關心自己的學業與心願，所以問了二個問題，一個是我會出國念書嗎？一個是我會念博士嗎？先不告訴大家當年算命仙的論命，但從結果論來看，我對自己的期待都沒有實現。如果現在的你有機會可以問關心的問題，你會問什麼呢？你會期待什麼樣的回答？會不會影響你的一生呢？<\/p><figure class=\"ph\">照片<\/figure><p>這本【別讓算命毀了你】是從新北市圖書館流通系統借到的書，不是算命書，反而有點像是張盛舒的自傳，書中開宗明義要讀書不要迷信，要用科學的觀點來看紫微斗數命盤對身而為人的參考性。<\/p><p>那要如何開始了解自己呢？<\/p><p>用紫微斗數。<\/p><p>紫微斗數是利用每個人的生辰時間來計算，多年前我去算命時，二位命相師都是先拿出一張紅紙，上面有空白的表格，先很慎重的寫上姓名年齡生肖之後，就直接用紙筆一一寫出整張命盤的星宿名稱與位置，光這一點，第一次算命的人看到這樣的過程真的會覺得很神奇、很佩服，可能在心態上也就尊敬不少。後來我也找了不少書來閱讀與了解，發現這些計算的流程是固定有算式的，星宿及各宮如何安排早已有公式，再依每個人的生日來對應去１２宮與十四主星及各個輔星的位置，千百年來早已有規則，不是算命仙神奇，那是他們一定要學會的技能。<\/p><p>因此，現在的我們只要上網鍵入自己的生日，轉瞬間就可以排出一張完全屬於自己的紫微斗數命盤，看到這裡大家可以先試試留言區的網址，先將自己的命盤列出來，找出自己在１２宮位中的命宮主星。<\/p><p>張盛舒在文中寫道，紫微命盤裡佈滿著命與運的脈絡，牽引著人生的方向與生而為人的性格，他將人的個性依<b>命宮十四主星<\/b>分為【開創型】【領導型】【支援型】及【合作型】。<\/p><p>【開創型】七殺、廉貞、破軍、貪狼 四星<\/p><p>【領導型】紫微、天府、武曲、天相 四星<\/p><p>【支援型】太陽、天機、巨門 三星<\/p><p>【合作型】太陰、天梁、天同 三星<\/p><p>以上各個主星代表著你或我與生俱來的個性，先暫時到此先回想一下自己有沒有很像。如果有也別斷言就是如此，如果不像那就更別相信算命仙的隨口之言。因為命盤是永遠固定任何人算都一樣，但是算命仙的行為是變動的，我們不能用他的言語或文字來決定未來的發展與走向，否則就會毀了你。<\/p><p>紫微斗數命盤應該是了解自己生命樣態的一種參考，再將參考內容回饋到個人特質、家庭關係、親族長幼及最重要的持續努力，這樣才不會被命盤或算命仙給斷了命，反而是要將自己對未來的主導權取回，命盤是人生的地圖只用來指引你目的地的方向，而不是你的生死簿。<\/p><p>雖然這本書初次由圖書館系統拿到時，我是真的連翻都不想
