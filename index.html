ttp://goo.gl/forms/gahK0RIyXYPNcac93<\/a><\/p>\n<p>「藍帶頂級廚師證書課程」分為法式料理與法式糕點課程，全期總共15個月，每班16位，包含廚藝實作與餐飲管理課程，由法籍藍帶主廚親自駐點授課，不用飛去國外省機票又省住宿費!<\/p>\n<p>2016/11/30前報名2016-17課程可享免審查費優惠<\/p>\n<p>中文翻譯班開課日程<\/p>\n<p>2016：秋季班 09/23<\/p>\n<p>2017：冬季班 01/06、春季班 04/07、夏季班 07/14、秋季班 09/29<\/p>\n<p>「藍帶頂級廚師證書課程」中文翻譯班課程簡章：<a href=\"https://goo.gl/kyh8v1\">https://goo.gl/kyh8v1<\/a><\/p>\n<p>可先預約看環境!<\/p>\n<p>☎ 07-8010909<\/p>\n<p>✉ Taiwan-NKUHT@cordonbleu.edu<\/p>"}, {"id": "f1469507757", "date": "2016-07-26", "title": "【暑期日本渡假打工好機會】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【暑期日本渡假打工好機會】 日期：2016/8/21 – 9/3 名額：五位 條件： 目前在台灣各公私立大學的在籍學生具備簡單的日語能力 工作地點： 阿蘇市役所（市政府）觀光課 阿", "len": 364, "body": "<p>【暑期日本渡假打工好機會】<\/p>\n<p>日期：2016/8/21 – 9/3<\/p>\n<p>名額：五位<\/p>\n<p>條件：<\/p>\n<p>目前在台灣各公私立大學的在籍學生具備簡單的日語能力<\/p>\n<p>工作地點：<\/p>\n<p>阿蘇市役所（市政府）觀光課<\/p>\n<p>阿蘇道の駅的遊客中心<\/p>\n<p>阿蘇市內知名的旅館、飯店以及觀光設施<\/p>\n<p>工作時間：<\/p>\n<p>每日08:00~17:00 （隨各單位的工作性質會有些許變動，但一定維持在一天8小時的標準工時）<\/p>\n<p>食宿與酬勞：<\/p>\n<p>日方免費提供住宿（學生宿舍等級）以及三餐（日常餐點）<\/p>\n<p>兩個星期結束，由日方另外支付三萬日圓的謝禮<\/p>\n<p>報名方式：<\/p>\n<p>請於2016/8/5之前，將個人履歷以及師長推薦函以電子郵件附件（限TXT、RTF、DOC、PDF格式）形式傳至Nippon Café編輯部（tencho@nippon.cafe）<\/p>\n<p>編輯部將從應徵履歷中篩選五名同學，於2016/8/12公布入選名單<\/p>\n<p>敬請注意<\/p>\n<p>往返日本當地的交通費用需由參與者自行負擔<\/p>"}, {"id": "f1466497834", "date": "2016-06-21", "title": "那麼好康的事，連老師都想參加了。", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "那麼好康的事，連老師都想參加了。 很可惜我已經不是35歲以下的青年！ 6/29-30舉辦2天1夜的「青年客家產業夏令營」，内含衣、食、育、樂相關產業論壇及產業參訪，可増廣見聞為就業", "len": 302, "body": "<p>那麼好康的事，連老師都想參加了。<\/p>\n<p>很可惜我已經不是35歲以下的青年！<\/p>\n<p>6/29-30舉辦2天1夜的「青年客家產業夏令營」，内含衣、食、育、樂相關產業論壇及產業參訪，可増廣見聞為就業提前準備，且入住三峽福容飯店的四人套房(完全免費)。<\/p>\n<p>報名資格:17~35歲的青年，招募200名，額滿爲止，請上新北市政府客家事務局官網報名(如海報、報名簡章)。(儘量四人一組)，感謝您!，相關問題可電洽29603456-6021陳先生。<\/p>\n<p>報名表<\/p>\n<p><a href=\"https://docs.google.com/forms/d/1s8Ys_fxOds4gB-nCzlPFGiNuQ_W9MuraknpeB0cb_sM/viewform?c=0&amp;w=1\">https://docs.google.com/forms/d/1s8Ys_fxOds4gB-nCzlPFGiNuQ_W9MuraknpeB0cb_sM/viewform?c=0&amp;w=1<\/a><\/p>"}, {"id": "f1463286046", "date": "2016-05-15", "title": "這幾天好熱，也都開始規劃暑假的活動；如果大家有看國際新聞…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "這幾天好熱，也都開始規劃暑假的活動；如果大家有看國際新聞，最近最熱門也最令人害怕的就是沒有解藥的茲卡病毒。 在台灣衛福部的網站上也列出了多個第二級警示Alert的國家名稱。如果暑假", "len": 687, "body": "<p>這幾天好熱，也都開始規劃暑假的活動；如果大家有看國際新聞，最近最熱門也最令人害怕的就是沒有解藥的茲卡病毒。<\/p>\n<p>在台灣衛福部的網站上也列出了多個第二級警示Alert的國家名稱。如果暑假出國活動有考量以下國家，有可能懷孕的婦女就應避免前往喔。<\/p>\n<p>茲卡病毒第二級警示Alert的國家<\/p>\n<p>一、東南亞：菲律賓、泰國、越南<\/p>\n<p>二、南亞：馬爾地夫<\/p>\n<p>三、大洋洲：美屬薩摩亞、斐濟、馬紹爾群島共和國、新喀里多尼亞、巴布亞紐幾內亞、薩摩亞、索羅門群島、東加王國、萬那杜<\/p>\n<p>四、南美洲：巴西、玻利維亞、哥倫比亞、厄瓜多、法屬圭亞那、蓋亞那共和國、巴拉圭、秘魯、蘇利南、委內瑞拉<\/p>\n<p>五、中美洲：巴貝多、荷屬波奈、貝里斯、哥斯大黎加、古巴、荷屬庫臘索島、多米尼克、多明尼加、薩爾瓦多、格瑞那達、瓜地馬拉、法屬瓜地洛普、海地、宏都拉斯、牙買加、法屬馬丁尼克、墨西哥、尼加拉瓜、巴拿馬共和國、美屬波多黎各、法屬聖巴瑟米、聖露西亞、聖文森及格瑞那丁、聖馬丁、法屬聖馬丁、千里達及托巴哥、美屬維爾京群島、荷屬阿魯巴<\/p>\n<p>衛福部國際間旅遊疫情建議等級表<a href=\"http://www.cdc.gov.tw/countryepidlevel.aspx?treeid=aa2d4b06c27690e6&amp;nowtreeid=4dd5edd98f8580aa\">http://www.cdc.gov.tw/countryepidlevel.aspx?treeid=aa2d4b06c27690e6&amp;nowtreeid=4dd5edd98f8580aa<\/a><\/p>\n<p>圖片來源：世界衛生組織, CDC<\/p>\n<p><a href=\"http://www.cdc.gov/zika/pdfs/imported_case_chikv_denv_zika.pdf\">http://www.cdc.gov/zika/pdfs/imported_case_chikv_denv_zika.pdf<\/a><\/p>\n<p><a href=\"http://www.who.int/emergencies/zika-virus/situation-report/12-may-2016/en/\">http://www.who.int/emergencies/zika-virus/situation-report/12-may-2016/en/<\/a><\/p>"}, {"id": "f1460643256", "date": "2016-04-14", "title": "【觀光餐旅職涯發展--侍酒師職業的現況與未來】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【觀光餐旅職涯發展--侍酒師職業的現況與未來】 【天王侍酒師校園巡迴講座：蔡孝倫侍酒師 Alex Tsai】 時間：2016年5月3日下午1:10~3:00 地點：醒吾科技大學觀餐", "len": 485, "body": "<p>【觀光餐旅職涯發展--侍酒師職業的現況與未來】<\/p>\n<p>【天王侍酒師校園巡迴講座：蔡孝倫侍酒師　Alex Tsai】<\/p>\n<p>時間：2016年5月3日下午1:10~3:00<\/p>\n<p>地點：醒吾科技大學觀餐學院六樓國際會議廳（場地座位有限請盡早入場）<\/p>\n<p>英國WSET (Wine and Spirit Education Trust葡萄酒與烈酒教育基金會) Level 1 初級, Level 2 中級(2009) 與Level 3高級(2013) 品酒師認證<\/p>\n<p>西班牙葡萄酒學院(The Wine Academy of Spain) 認證講師(2011)<\/p>\n<p>國際侍酒師公會(ISG) Level 1 初級與 Level 2 高級(2012) 侍酒師認證<\/p>\n<p>法國布根地葡萄酒公會BIVB(Bureau Interprofessionnel des Vins de Bourgogne) 專家認證(2013): Honour of Burgundy Wine Connoisseur Certificate<\/p>\n<p>[比賽經歷]<\/p>\n<p>TSA台灣最佳侍酒師比賽決賽入圍(Sep. 2012)<\/p>\n<p>Sopexa 台灣最佳法國侍酒師競賽亞軍(Jul. 2015)<\/p>\n<p>Sopexa 亞洲最佳法國侍酒師比賽台灣代表, 準決賽入圍(Dec 2015)<\/p>"}, {"id": "f1458533105", "date": "2016-03-21", "title": "照過來~~照過來~~", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "照過來~~照過來~~ 已領取導遊人員執業證之現職導遊人員，想學韓語、印尼語、越南語、泰語的機會來了，學會了還可以帶外國團喔。 一、訓練期間：105年4月下旬至106年4月30日。 ", "len": 493, "body": "<p>照過來~~照過來~~<\/p>\n<p>已領取導遊人員執業證之現職導遊人員，想學韓語、印尼語、越南語、泰語的機會來了，學會了還可以帶外國團喔。<\/p>\n<p>一、訓練期間：105年4月下旬至106年4月30日。<\/p>\n<p>二、訓練對象：已領取導遊人員執業證之現職導遊人員。<\/p>\n<p>三、外語類別：韓語、印尼語、越南語、泰語。<\/p>\n<p>四、訓練地區：北部、中部、南部地區。<\/p>\n<p>五、訓練期數(班次)：北、中、南部地區共計16期次，每期人數以最多30人為原則，低於12人不開班。<\/p>\n<p>六、訓練方式及課程規劃：課程安排計48節課，每節課50分鐘，內容包括：<\/p>\n<p>(一)始業式1節次。<\/p>\n<p>(二)該語言類別市場概況介紹2節次。<\/p>\n<p>(三)語言實務訓練42節次，包括語言入門技巧學習、自我介紹及接送機接待實務、旅遊景點等導遊接待實務使用之字彙、片語及語句課程及綜合討論與意見交流。<\/p>\n<p>(四)結業口試測驗3節次。<\/p>\n<p>七、訓練費：每人應繳交訓練費用新臺幣5,000元整。<\/p>\n<p>本局「105年導遊人員其他外語(韓語、印尼語、越南語、泰語)訓練」業由中華民國觀光導遊協會取得業務執行權，有關委託業務請與該協會聯繫，聯絡電話：02-25922207~9，網址：<a href=\"http://www1.tourguide.org.tw。\">http://www1.tourguide.org.tw。<\/a><\/p>"}, {"id": "f1453174593", "date": "2016-01-19", "title": "【104學年第2學期TOEIC醒吾科大校園課程報名最後期…", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【104學年第2學期TOEIC醒吾科大校園課程報名最後期限】 為提升並精進全校同學英文程度與實力，達到英語畢業門檻，特設置全校英文證照(多益)TA菁英種子輔導班，經由專業密集的訓練", "len": 306, "body": "<p>【104學年第2學期TOEIC醒吾科大校園課程報名最後期限】<\/p>\n<p>為提升並精進全校同學英文程度與實力，達到英語畢業門檻，特設置全校英文證照(多益)TA菁英種子輔導班，經由專業密集的訓練，掌握英語證照考試方法與訣竅，提升應試成績，增加對考取英語證照的信心，由此推廣至各系各班，分享經驗，協助同班或同系同學應考英語證照，目標以達到多益B1 550分（聽力275、閱讀275）為主。<\/p>\n<p>費用：書費８００元（坊間費用Google就知）<\/p>\n<p>資格：醒吾科大旅運系２～３年級學生<\/p>\n<p>教師：觀餐A 二 6-7,四 8-9 業界教師Kelly<\/p>\n<p>觀餐B 二 6-7,三6-7 業界教師David<\/p>\n<p>想當空姐空少的同學，這是第一關~~<\/p>\n<p>請於1/20週三前向老師報名<\/p>\n<p>歡迎轉貼~~<\/p>"}, {"id": "f1452650008", "date": "2016-01-13", "title": "➽活動宗旨及目標：培養旅遊大亨，瞭解旅遊新創產業的最新脈…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "➽活動宗旨及目標：培養旅遊大亨，瞭解旅遊新創產業的最新脈動，體驗 zero to hero 的創業過程 ➽主辦單位：RTM 泛旅遊 ➽活動時間：2016-1-22 (五) 9:00", "len": 363, "body": "<p>➽活動宗旨及目標：培養旅遊大亨，瞭解旅遊新創產業的最新脈動，體驗 zero to hero 的創業過程<\/p>\n<p>➽主辦單位：RTM 泛旅遊<\/p>\n<p>➽活動時間：2016-1-22 (五)  9:00 ~ 21:00<\/p>\n<p>2016-1-23 (六)  9:00 ~ 21:00<\/p>\n<p>2016-1-24 (日)  9:00 ~ 17:00<\/p>\n<p>➽活動地點：台大法律學院霖澤館 1401會議室<\/p>\n<p>➽活動對象：曾參與 RTM 活動、欲瞭解更多旅遊新創面貌，或想參加 RTM 專案或實習計畫之大學生及社會人士<\/p>\n<p>➽活動類別：培訓課程/專案競賽/企業徵才<\/p>\n<p>➽活動費用：新台幣 990 元 (三天，含餐食、保險)<\/p>\n<p>➽報名期限：2016-1-10 (日) 23:59 止<\/p>\n<p>因應報名踴躍，報名時間延長一週至 2016-1-17 (日) 23:59 止，想報名的朋友請趕緊加快腳步囉！<\/p>\n<p><a href=\"http://www.accupass.com/go/2025_rtm_tycoon\">http://www.accupass.com/go/2025_rtm_tycoon<\/a><\/p>"}, {"id": "f1449195930", "date": "2015-12-04", "title": "104學年度海外參訪活動的同學們：", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "104學年度海外參訪活動的同學們： 請自行下載附件格式完成海外參訪研習心得報告書，規定如下: 1.心得報告書頁數：本文含照片需在12頁以上，不含附件。 2.請以全彩列印並膠裝完成後", "len": 373, "body": "<p>104學年度海外參訪活動的同學們：<\/p>\n<p>請自行下載附件格式完成海外參訪研習心得報告書，規定如下:<\/p>\n<p>1.心得報告書頁數：本文含照片需在12頁以上，不含附件。<\/p>\n<p>2.請以全彩列印並膠裝完成後交至觀院6樓辦公室<\/p>\n<p>3.將電子檔Email: h111@mail.hwu.edu.tw<\/p>\n<p>4.時限：參訪活動結束後２週內繳齊<\/p>\n<p>寧夏參訪團：12/8為限<\/p>\n<p>北京參訪團：12/16為限<\/p>\n<p>河南參訪團：12/24為限(上學期曾參加河南參訪同學也同時限)<\/p>\n<p>【重要】完成參訪同學活動結束2週內將心得報告繳交院辦，即可領取研習證書，如需抵免學分的同學請填寫「海外參訪研習抵免學分申請表」送至院辦審核，此申請表下學期開學前提供同學於教務處註冊組辦理『海外參訪』學分抵免之憑證。<\/p>\n<p><a href=\"http://b017.hwu.edu.tw/files/15-1049-31085,c1106-1.php?Lang=zh-tw\">http://b017.hwu.edu.tw/files/15-1049-31085,c1106-1.php?Lang=zh-tw<\/a><\/p>"}, {"id": "f1447772169", "date": "2015-11-17", "title": "【2016觀光精英盃全國遊程競賽】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【2016觀光精英盃全國遊程競賽】 為了讓您提早準備~以下是比賽的日期及地點 比賽日期及地點： 南區競賽：105年05月16日(一) 大仁科技大學 中區競賽：105年05月17日(", "len": 337, "body": "<p>【2016觀光精英盃全國遊程競賽】<\/p>\n<p>為了讓您提早準備~以下是比賽的日期及地點<\/p>\n<p>比賽日期及地點：<\/p>\n<p>南區競賽：105年05月16日(一) 大仁科技大學<\/p>\n<p>中區競賽：105年05月17日(二) 建國科技大學<\/p>\n<p>北區競賽：105年05月18日(三) 致理科技大學<\/p>\n<p>總決賽： 105年05月31日(二) 中華大學<\/p>\n<p>主題設定：<\/p>\n<p>國內旅遊組(三天兩夜)：產地食材旅行<\/p>\n<p>(以台灣各地食材作旅行安排的主軸，選擇的地區與食材項目不限。例如：台南玉井芒果，則以台南玉井地區周邊景點作行程的串連，並加入產地食材的餐食或體驗活動)<\/p>\n<p>來台旅客組(五天四夜)：親子主題樂園假期<\/p>\n<p>(行程內容需安排一個以上的主題樂園，並安排至少一天的行程於園區內，選擇的樂園必須為合法登記，請參考全臺主題樂園網<a href=\"http://themepark.net.tw/\">http://themepark.net.tw/<\/a>)<\/p>"}, {"id": "f1445515730", "date": "2015-10-22", "title": "2015全球華人觀光餐旅產學合作高峰論壇研習活動", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2015全球華人觀光餐旅產學合作高峰論壇研習活動 時 間：2015年11月16日～17日 地 點：醒吾科技大學（新北市林口區粉寮路一段101號） 11/17第二天專業講座介紹： 美", "len": 292, "body": "<p>2015全球華人觀光餐旅產學合作高峰論壇研習活動<\/p>\n<p>時　　間：2015年11月16日～17日<\/p>\n<p>地　　點：醒吾科技大學（新北市林口區粉寮路一段101號）<\/p>\n<p>11/17第二天專業講座介紹：<\/p>\n<p>美國聖荷西大學餐旅管理系主任嚴祖弘教授<\/p>\n<p>英國University of Surrey李剛教授<\/p>\n<p>研習對象：大專院校、高中職教師、觀光餐旅系所博碩士研究生<\/p>\n<p>【研習費用】<\/p>\n<p>一日研習費用新台幣2000元整；<\/p>\n<p>二日為新台幣3500元整，內容包含如下：<\/p>\n<p>1.高峰論壇及專業論文發表場次<\/p>\n<p>2.一日或二日午餐<\/p>\n<p>3.研習證書(8小時或16小時研習證明)<\/p>\n<p>【線上報名】<\/p>\n<p><a href=\"http://forum.tourism.org.tw/contents.asp?id=13\">http://forum.tourism.org.tw/contents.asp?id=13<\/a><\/p>"}, {"id": "f1445247241", "date": "2015-10-19", "title": "QUOTE；林獻堂與其長子林攀龍與次子林猶龍，於一九二七…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "QUOTE；林獻堂與其長子林攀龍與次子林猶龍，於一九二七年五月十五日出發，於同年六月二十日抵達歐洲大陸，至隔年（一九二八年）三月十四日離開，前往北美洲，於三月二十日抵達美國，之後在", "len": 603, "body": "<p>QUOTE；林獻堂與其長子林攀龍與次子林猶龍，於一九二七年五月十五日出發，於同年六月二十日抵達歐洲大陸，至隔年（一九二八年）三月十四日離開，前往北美洲，於三月二十日抵達美國，之後在五月九日出發，橫渡太平洋，五月二十五日抵達日本橫濱，一九二八年十一月八日安返臺灣，總花費時程約計一年半。其海上行程主要是搭乘「郵船」（輪船），由基隆搭乘「鳳山丸」船舶，至香港轉搭「鹿島丸」郵船，航向新加坡、檳榔嶼、斯里蘭卡、埃及蘇伊士運河，抵達歐洲法國之馬賽。後在歐洲大陸上遍遊十一國，從丹麥到西班牙，從英國到德國，從荷蘭到瑞士，也就是從海島到山陬，從沿海到內陸。此時主要以搭乘火車及汽車為主，尤其前者是往來各國的主要交通工具。後從法國西北部瑟堡（Cherbourg）搭乘「阿機塔尼亞號」（R.M.S.Aquitania）大汽船抵達美國紐約，後購買日本郵船株式會社之「舟車聯絡票」，搭乘由波士頓、芝加哥至洛杉磯的火車，再轉至舊金山搭乘「天洋丸」郵船，航往日本途中還經過了夏威夷。（林獻堂 環球遊記）<\/p>\n<p>最近有部好片阿罩霧風雲2就是在說林獻堂的故事！台灣不是沒有歷史，而是寫歷史的人自以為可以掌控歷史。<\/p>\n<p><a href=\"http://www.cw.com.tw/article/article.action?id=5071527&amp;utm_source=Facebook&amp;utm_medium=referral&amp;utm_campaign=Facebook\">http://www.cw.com.tw/article/article.action?id=5071527&amp;utm_source=Facebook&amp;utm_medium=referral&amp;utm_campaign=Facebook<\/a><\/p>"}, {"id": "f1441854572", "date": "2015-09-10", "title": "【同學們請選修統計學】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【同學們請選修統計學】 昨天，老師在LINE裡拜託同學們修統計學，除了學姊說做專題時會用到之外，也會有以下幫助： 學會統計可謂省小錢 學會統計可以賺到錢 學會統計可能贏大錢 學會統", "len": 603, "body": "<p>【同學們請選修統計學】<\/p>\n<p>昨天，老師在LINE裡拜託同學們修統計學，除了學姊說做專題時會用到之外，也會有以下幫助：<\/p>\n<p>學會統計可謂省小錢<\/p>\n<p>學會統計可以賺到錢<\/p>\n<p>學會統計可能贏大錢<\/p>\n<ol>\n<li>學會統計可謂省小錢<\/li>\n<\/ol>\n<p>學會用Excel統計天天流水帳，你就可以知道原來在鞠躬哈腰賺來的皮肉錢，一部分都成了長皮長肉的大餐、一部分換來了擋皮擋肉的衣鞋、少部分就在手機中被電信業者滑走了！所以學會統計後會少上館子、少買新衣鞋、多用Wifi，可謂省小錢。<\/p>\n<ol start=\"2\">\n<li>學會統計可以賺到錢<\/li>\n<\/ol>\n<p>學會統計調查發問卷，你說可以發現學校附近只有3家便利店、5家飲料店、1家撞球店、1家自助餐及難以計量的早餐店，對於校園內近萬名的學生數量是不對稱的。應該可以在校門口開幾家中餐咖哩店、幾家供徐太宇、林真心念書的泡沬紅茶店；校內美食廣場增加美味自助餐，所以學會統計之後，或許在畢業之前，就擁有3家店，可以賺到不少錢！<\/p>\n<ol start=\"3\">\n<li>學會統計可能贏大錢<\/li>\n<\/ol>\n<p>學精統計機率之後，你可以將2015年72期的6組得獎號碼匯入Excel，利用老師教過的統計方法，跑出機率最高的6組數字，再投資個皮肉錢100元，你就可能在今日亥時起，不用賺皮肉錢、記流水帳、搖珍珠、做早餐；因為學會了統計而成了億萬大亨！<\/p>\n<p>最後最後同學你可以在校門口買下一整排店面，老師會去向你租來開早餐店！<\/p>\n<p>所以請同學一定要加選統計學，事關你的未來呀！！<\/p>\n<h1>醒吾科大選課系統: <a href=\"http://portal.hwu.edu.tw/Portal/login.htm\">http://portal.hwu.edu.tw/Portal/login.htm<\/a><\/h1>"}, {"id": "f1433036203", "date": "2015-05-31", "title": "第三集是「瘋狂的學院」，參賽者們要在一週內體驗大學生活，…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "第三集是「瘋狂的學院」，參賽者們要在一週內體驗大學生活，包括學會準時在上下課十分鐘內用RFID卡片點名，操作一直當機或根本連不上線的網路選課，用連教授也不會用的ican交報告，在和", "len": 444, "body": "<p>第三集是「瘋狂的學院」，參賽者們要在一週內體驗大學生活，包括學會準時在上下課十分鐘內用RFID卡片點名，操作一直當機或根本連不上線的網路選課，用連教授也不會用的ican交報告，在和電腦病毒差不多的學校系統中查預警和成績。<\/p>\n<p>此外，也強制參與須回家看影片的翻轉教學，以及就算不想講話也被逼得一定要講話的團體討論與問題導向式教學。勞動部份，則要當TA教一群故意裝笨的學弟妹，進實驗室做十人份的實驗，幫教授寫論文、掃地、照顧小孩、搬家等等。<\/p>\n<p>==================================================<\/p>\n<p>咦~~ 我真的有叫導師班同學來幫忙搬家呢!! 還有出國時照顧小狗，真是對不起了~~ @[664396576:2048:Jason Chen], @[1744380865:2048:Chih-i Huang], @[100000143594393:2048:Lin Mini], @[100000345041010:2048:世孝徐], 還有好多好多很想再說聲謝謝又標不到的人~~<\/p>"}, {"id": "f1430469248", "date": "2015-05-01", "title": "【Call for Papers】徵稿通知", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【Call for Papers】徵稿通知 全球華人觀光餐旅產學合作高峰論壇暨國際學術研討會 第七屆海峽旅遊教育聯盟年會暨海峽兩岸旅遊觀光研討會 2015 Global Overs", "len": 327, "body": "<p>【Call for Papers】徵稿通知<\/p>\n<p>全球華人觀光餐旅產學合作高峰論壇暨國際學術研討會<\/p>\n<p>第七屆海峽旅遊教育聯盟年會暨海峽兩岸旅遊觀光研討會<\/p>\n<p>2015 Global Overseas Chinese Hospitality &amp; Tourism Industry-academic Cooperation Forum &amp; International Academic Conference<\/p>\n<p>會議時間：2015年11月15~18日(星期日至星期三)共四日<\/p>\n<p>會議地點：台北圓山大飯店<\/p>\n<p>主辦單位：中華觀光管理學會<\/p>\n<p>指導單位：科技部、交通部觀光局、經濟部國貿局<\/p>\n<p>投稿信箱Email: 2015forum@mail.hwu.edu.tw<\/p>\n<p>報名請點選官方網站：<a href=\"http://forum.tourism.org.tw\">http://forum.tourism.org.tw<\/a><\/p>"}, {"id": "f1430208424", "date": "2015-04-28", "title": "全國大觀盃觀光遊程設計競賽的舉辦是希望透過年輕學子的創意…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "全國大觀盃觀光遊程設計競賽的舉辦是希望透過年輕學子的創意來尋找台灣更多值得業界推廣的旅遊行程， 希望參賽者能激發出許多具創意、優質、多樣性的旅遊行程，提供給旅行業界推廣，進而達到產", "len": 678, "body": "<p>全國大觀盃觀光遊程設計競賽的舉辦是希望透過年輕學子的創意來尋找台灣更多值得業界推廣的旅遊行程，<\/p>\n<p>希望參賽者能激發出許多具創意、優質、多樣性的旅遊行程，提供給旅行業界推廣，進而達到產學結合。<\/p>\n<p>主辦單位：中華民國旅行商業同業公會全國聯合會、中華優質旅遊發展協會<\/p>\n<p>協辦單位：臺北城市科技大學觀光事業系、聯賀欣企業管理顧問有限公司<\/p>\n<p>贊助單位：華立圖書股份有限公司<\/p>\n<p>執行單位：臺北城市科技大學民生學院觀光事業系<\/p>\n<p>報名方式 –簡章如附<\/p>\n<p>2015年6月10日（三）下午17:00前，將報名相關資料、旅遊企劃書一式七份及書面檔案光碟一份<\/p>\n<p>（含旅遊企劃書WORD檔及PPT簡報檔）(封面請標示遊程主題)送達臺北城市科技大學觀光事業系<\/p>\n<p>（地址：台北市北投區學園路2號，請註明『2015全國大觀盃觀光遊程設計競賽』）。<\/p>\n<p><a href=\"http://www.htm.tpcu.edu.tw/bin/downloadfile.php?file=WVhSMFlXTm9MelEyTDNCMFlWOHhORGcyTmw4NE5Ea3lNVEE1WHpBME9ETTFMbVJ2WXc9PQ==&amp;fname=KLRPST45WXB5NPOPA5OPHD40CDOPOPQPRLNLFDQPJDUTKL04A5114040UXMLID55STJHZTA5KLMLTWB551NLYX55UXVTCDRL14EDJDA515NLCDB1ED11HCCHEDVTWXOPJDEDEDEHUXIH45QLUTJHVXA5STOPDDA5RLVTVTRPUXUTDG551501EDQPCDVTGDOPJDJHJH45UX11KOKO\">http://www.htm.tpcu.edu.tw/bin/downloadfile.php?file=WVhSMFlXTm9MelEyTDNCMFlWOHhORGcyTmw4NE5Ea3lNVEE1WHpBME9ETTFMbVJ2WXc9PQ==&amp;fname=KLRPST45WXB5NPOPA5OPHD40CDOPOPQPRLNLFDQPJDUTKL04A5114040UXMLID55STJHZTA5KLMLTWB551NLYX55UXVTCDRL14EDJDA515NLCDB1ED11HCCHEDVTWXOPJDEDEDEHUXIH45QLUTJHVXA5STOPDDA5RLVTVTRPUXUTDG551501EDQPCDVTGDOPJDJHJH45UX11KOKO<\/a><\/p>"}, {"id": "f1425546324", "date": "2015-03-05", "title": "【醒吾科大觀餐學院學生專屬】", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【醒吾科大觀餐學院學生專屬】 英商公主號郵輪Princess Cruise in Keelung 基隆港換客服務人員培訓說明會 【性質】兼職工作機會 【日期】104年4月7日13:", "len": 365, "body": "<p>【醒吾科大觀餐學院學生專屬】<\/p>\n<p>英商公主號郵輪Princess Cruise in Keelung<\/p>\n<p>基隆港換客服務人員培訓說明會<\/p>\n<p>【性質】兼職工作機會<\/p>\n<p>【日期】104年4月7日13:00-15:00 (D103)<\/p>\n<p>【日薪】1500元 (供午餐)<\/p>\n<p>【工作內容】辦理國際郵輪登船及下船的手續及導引<\/p>\n<p>【工作時間】以下日期10場最少需到5場 每場次的工作時間6:10~16:00<\/p>\n<p>4/27(一)、4/29(三)、4/30(四)，5/5(二)、5/8(五)、5/14(四)、5/17(日)、5/20(三)、5/23(六)、5/28(四)　(有衝堂的學生將給予公假)<\/p>\n<p>【交通】由學校出發或圓山站的接駁車 am 06:10集合<\/p>\n<p>請有意願的同學即日起至應英系辦或語言中心填寫報名表<\/p>\n<p><a href=\"http://c009.hwu.edu.tw/files/14-1059-27208,r271-1.php\">http://c009.hwu.edu.tw/files/14-1059-27208,r271-1.php<\/a><\/p>"}, {"id": "f1417439291", "date": "2014-12-01", "title": "104年專門職業及技術人員普通考試導遊人員、領隊人員考試…", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "104年專門職業及技術人員普通考試導遊人員、領隊人員考試。 報名日期：自103年11月25日起至12月4日下午5時止。 報名網址： http://register.moex.gov", "len": 620, "body": "<p>104年專門職業及技術人員普通考試導遊人員、領隊人員考試。<\/p>\n<p>報名日期：自103年11月25日起至12月4日下午5時止。<\/p>\n<p>報名網址：<a href=\"http://register.moex.gov.tw\">http://register.moex.gov.tw<\/a><\/p>\n<p>考試日期：<\/p>\n<p>(一)外語領隊人員、華語領隊人員：104年3月14日（星期六）。<\/p>\n<p>(二)外語導遊人員第1試筆試、華語導遊人員：104年3月15日（星期日）。外語導遊人員第2試口試暫定於104年5月23日（星期六）至24日（星期日）分梯次舉行，實際口試日期另行通知。<\/p>\n<p>三、考試地點：本考試分設臺北、桃園、新竹、臺中、嘉義、臺南、高雄、花蓮、臺東、澎湖、金門及馬祖等12考區。（詳細地點另登載於寄發之入場證）<\/p>\n<p>四、報名有關規定事項：<\/p>\n<p>(一)報名日期：自103年11月25日起至12月4日下午5時止。<\/p>\n<p>(二)報名收件截止日期：應考人須於103年12月5日前（含當日，郵戳為憑），以掛號寄出報名表件，始完成報名程序，逾期不予受理，原件退回。<\/p>\n<p>(三)報名郵寄地點：11602臺北市文山區試院路1之1號考選部專技考試司第一科。<\/p>\n<p>(四)報名方式：一律採用網路報名，應考人請登入本部全球資訊網，網址為：www.moex.gov.tw，點選網路報名主站或新站，即可進入網路報名資訊系統入口網站，或輸入網址register.moex.gov.tw（主站）、register.moex2.nat.gov.tw（新站）直接進行報名，並下載列印報名書表，連同應考資格文件及繳款證明等，以掛號郵寄至前開地點。<\/p>"}, {"id": "f1413513916", "date": "2014-10-17", "title": "2014年中華觀光管理學會碩士論文獎甄選即將截止。敬請推…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2014年中華觀光管理學會碩士論文獎甄選即將截止。敬請推薦貴所畢業生報名參加。 【說明】 凡2014年畢業自國內公、私立大學院校觀光相關科系碩士班之學生(含已完成碩士論文，預計於本", "len": 442, "body": "<p>2014年中華觀光管理學會碩士論文獎甄選即將截止。敬請推薦貴所畢業生報名參加。<\/p>\n<p>【說明】<\/p>\n<p>凡2014年畢業自國內公、私立大學院校觀光相關科系碩士班之學生(含已完成碩士論文，預計於本年度畢業者；申請時至頒獎時當年均為本會有效會員)，其碩士論文之研究成果優異並經指導教授推薦者，均可參與甄選。<\/p>\n<p>第一名：獎金壹萬元整，獎狀乙只。<\/p>\n<p>第二名：獎金捌仟元整，獎狀乙只。<\/p>\n<p>第三名：獎金陸仟元整，獎狀乙只。<\/p>\n<p>佳　作：獎狀乙只。<\/p>\n<p>【報名方式】<\/p>\n<p>1.請於2014年11月15日之前，將1.申請表及2.碩士論文電子檔(論文全文)透過電子郵件寄至觀光休閒學報編輯助理古璧慎（jts@tourism.org.tw）收。若於一週內未接獲本會收稿確認之電子郵件，敬請重新將投稿稿件寄出或與總編輯、執行主編聯繫。<\/p>\n<p>2.請備妥：(1)申請表(須簽名)與(2)碩士論文紙本(已裝訂)各乙份，郵寄至 「國立嘉義大學 觀光休閒管理研究所 古璧慎收」，以便於審查。寄送地址：60054嘉義市新民路580號 觀光休閒所。<\/p>\n<p>感謝您的推薦，更歡迎分享給學生教師。<\/p>"}, {"id": "f1400236146", "date": "2014-05-16", "title": "台灣的夜市文化在觀光局的推波助瀾之下已經處處開花；成為台…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "台灣的夜市文化在觀光局的推波助瀾之下已經處處開花；成為台灣之光？ 但是走了幾趟之後發現，由南到北所有的夜市攤位都差不多個樣；設計也差不多俗；環境也差不多亂。 但是我心裡一直覺得有很", "len": 393, "body": "<p>台灣的夜市文化在觀光局的推波助瀾之下已經處處開花；成為台灣之光？<\/p>\n<p>但是走了幾趟之後發現，由南到北所有的夜市攤位都差不多個樣；設計也差不多俗；環境也差不多亂。<\/p>\n<p>但是我心裡一直覺得有很大的疑問：<\/p>\n<p>每次去夜市我們一家三口的平均消費也在三百元以上。<\/p>\n<p>但是都沒有人開發票？<\/p>\n<p>也沒有任何一家收信用卡？？<\/p>\n<p>更沒有那一攤有公司商業登記？？？<\/p>\n<p>當然在招攬生意的工讀生妹妹(看起來是童工!)有沒有勞健保？？？<\/p>\n<p>如果我吃了炸蟹過敏了，衛生局會幫忙檢查嗎？？？？<\/p>\n<p>．．．．．．．．．．．．．．<\/p>\n<p>想到這兒，我真為台灣受薪階級乖乖交稅的我們難過。<\/p>\n<p>因為連官方的分析資料都表示102年台灣攤販全年營業收入 5,510<\/p>\n<p>億元(不知是否含各家新興的大夜市攤商?)，但很有可能除了讓官方的失業率低一點之外，社會所付出的成本可能更高。<\/p>\n<p>參考資料: 主計處102年統計資料<\/p>\n<p><a href=\"http://www.dgbas.gov.tw/np.asp?ctNode=2846\">http://www.dgbas.gov.tw/np.asp?ctNode=2846<\/a><\/p>"}, {"id": "f1397530770", "date": "2014-04-15", "title": "各位親愛的學會會員", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "各位親愛的學會會員 再次邀請各位參加下週一辦理之中華觀光管理學會會員大會暨郵輪產學合作論壇，會中已邀請到美商公主郵輪徐景奇總經理及加勒比海郵輪公司總經理進行專題演講。更獲兩岸觀光產", "len": 332, "body": "<p>各位親愛的學會會員<\/p>\n<p>再次邀請各位參加下週一辦理之中華觀光管理學會會員大會暨郵輪產學合作論壇，會中已邀請到美商公主郵輪徐景奇總經理及加勒比海郵輪公司總經理進行專題演講。更獲兩岸觀光產官學界的支持共同進行「亞洲郵輪市場產官學界面面觀」的高峰論壇。<\/p>\n<p>高峰論壇講者：<\/p>\n<p>(1)交通部觀光局劉喜臨副局長<\/p>\n<p>(2)海旅會台北辦事處滿宏衛主任<\/p>\n<p>(3)山富旅行社陳國森董事長<\/p>\n<p>(4)皇家加勒比海郵輪台灣區公司呂麗齡總經理<\/p>\n<p>(5)醒吾科技大學觀光餐旅學院李銘輝院長<\/p>\n<p>時間: 4/21(一) 0900-1600<\/p>\n<p>地點: 台北市敦化北路一段240號觀光局旅遊服務中心三樓<\/p>\n<p>敬請務必填寫線上回函出席報名表。<\/p>\n<p>如有任何需要協助之處，歡迎您直接回覆Email給我們。<\/p>\n<p>期待您的參與<\/p>\n<p>秘書處敬上<\/p>\n<p>中華觀光管理學會期待您的蒞臨與指導。<\/p>"}, {"id": "f1394609923", "date": "2014-03-12", "title": "「中華觀光管理學會」與「皇家加勒比海郵輪臺灣總代理」及「…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "「中華觀光管理學會」與「皇家加勒比海郵輪臺灣總代理」及「山富旅行社」進行產學合作，首次將以亞洲最大的14萬噸級海洋航行者號郵輪為研習場地，針對觀光餐旅最新的郵輪旅遊趨勢規劃最深入且", "len": 450, "body": "<p>「中華觀光管理學會」與「皇家加勒比海郵輪臺灣總代理」及「山富旅行社」進行產學合作，首次將以亞洲最大的14萬噸級海洋航行者號郵輪為研習場地，針對觀光餐旅最新的郵輪旅遊趨勢規劃最深入且最專業的研習課程，結業後將發給三張郵輪管理、物流管理及博奕管理種子教師證照。<\/p>\n<p>研習內容如下：<\/p>\n<p>（一）研習時間：103年5月18日(日)至5月23日(五)，全程共計六天五夜。<\/p>\n<p>（二）研習地點：中華觀光管理學會研習場地及皇家加勒比海郵輪【Voyager of the Seas海洋航行者號】「基隆、長崎、福岡航線」舉辦研習。<\/p>\n<p>（三）費用：<\/p>\n<p>1.非中華觀光管理學會會員38,500元(四人一室)。<\/p>\n<p>2.中華觀光管理學會會員37,500元(四人一室)。<\/p>\n<p>備註：原自費遊程福岡、長崎二日岸上行程(新台幣5,000元)，已內含於本次費用之中。<\/p>\n<p>（四）研習證照：<\/p>\n<p>「郵輪經營管理種子教師16小時」研習證明及證照<\/p>\n<p>「郵輪物流管理種子教師16小時」研習證明及證照<\/p>\n<p>「郵輪博奕娛樂管理種子教師16小時」研習證明及證照<\/p>\n<p>保留位只有30名，坊間已完售有興趣者可以私訊我喔!!<\/p>"}, {"id": "f1389269032", "date": "2014-01-09", "title": "阿狗問: 「拔拔你看這本書，你當兵時用那一種槍?」", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "阿狗問: 「拔拔你看這本書，你當兵時用那一種槍?」 我: 「五七式步槍」 阿狗問: 「可是沒有五七式呀?」 狗子拔: 「那我找網路給你看: http://zh.wikipedia.", "len": 349, "body": "<p>阿狗問: 「拔拔你看這本書，你當兵時用那一種槍?」<\/p>\n<p>我: 「五七式步槍」<\/p>\n<p>阿狗問: 「可是沒有五七式呀?」<\/p>\n<p>狗子拔: 「那我找網路給你看: <a href=\"http://zh.wikipedia.org/wiki/57%E5%BC%8F%E6%AD%A5%E6%A7%8D\">http://zh.wikipedia.org/wiki/57%E5%BC%8F%E6%AD%A5%E6%A7%8D<\/a> (很不耐煩地說...)」<\/p>\n<p>狗子: 「呀，那就是M14自動步槍啦!!」<\/p>\n<p>狗子拔: 「那你找找有沒有30步槍，因為印象中成功嶺及高中打靶時就是用30步槍」<\/p>\n<p>狗子: 「沒有也...」<\/p>\n<p>後來: 我自己找了一下，原來30步槍是1903年的春田步槍，是二次大戰時的產物，我到底有沒有用過，其實已經不是很記得，但是看形式，很難忘記步槍明顯的拉機柄。<\/p>\n<p><a href=\"http://zh.wikipedia.org/wiki/M1903%E6%98%A5%E7%94%B0%E6%AD%A5%E6%A7%8D\">http://zh.wikipedia.org/wiki/M1903%E6%98%A5%E7%94%B0%E6%AD%A5%E6%A7%8D<\/a><\/p>"}, {"id": "f1387943174", "date": "2013-12-25", "title": "It's our pleasure for the Au…", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "It's our pleasure for the Author, Dr. Ken Black, cited our paper which published in 2011, ", "len": 283, "body": "<p>It's our pleasure for the Author, Dr. Ken Black, cited our paper which published in 2011, Titled \"Differences in Tourism Image among Cruise Passengers across the Taiwan Straits\" , being a case study for business analysis in categorical data in his newest edition book.<\/p>\n<p>It's published and available in Amazon,  but it is too expensive to me.<\/p>"}, {"id": "f1385441134", "date": "2013-11-26", "title": "在校園內看到阿基師剛由廚房上完課出來，", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "在校園內看到阿基師剛由廚房上完課出來， 一身廚師服，旁邊跟著努力認真的學生！ 現在他又在實習餐廳用餐順便幫學生試菜， 教育與現場的實踐！ 真覺得在這個學校教書是件幸福的事!! 想報", "len": 299, "body": "<p>在校園內看到阿基師剛由廚房上完課出來，<\/p>\n<p>一身廚師服，旁邊跟著努力認真的學生！<\/p>\n<p>現在他又在實習餐廳用餐順便幫學生試菜，<\/p>\n<p>教育與現場的實踐！<\/p>\n<p>真覺得在這個學校教書是件幸福的事!!<\/p>\n<p>想報名花蓮最專業的觀光餐旅研究所嗎？<\/p>\n<p>只剩三天11/28截止。<\/p>\n<p>簡章如下:<\/p>\n<p><a href=\"http://www.tht.edu.tw/newspic/103%E5%AD%B8%E5%B9%B4%E5%BA%A6%E8%87%BA%E7%81%A3%E8%A7%80%E5%85%89%E5%AD%B8%E9%99%A2%E7%A0%94%E7%A9%B6%E6%89%80%E7%94%84%E8%A9%A6%E7%B0%A1%E7%AB%A0.pdf\">http://www.tht.edu.tw/newspic/103%E5%AD%B8%E5%B9%B4%E5%BA%A6%E8%87%BA%E7%81%A3%E8%A7%80%E5%85%89%E5%AD%B8%E9%99%A2%E7%A0%94%E7%A9%B6%E6%89%80%E7%94%84%E8%A9%A6%E7%B0%A1%E7%AB%A0.pdf<\/a><\/p>"}, {"id": "f1385343013", "date": "2013-11-25", "title": "給很多在養狗狗的同學們，老師一直說不出口的事。", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "給很多在養狗狗的同學們，老師一直說不出口的事。 我有一個女兒14歲，陪著我們搬了無數次的家，由台北到花蓮，無論我們工作有多忙，她都會在家中等我們回家，無論多久! 無論幾天! 直到有", "len": 546, "body": "<p>給很多在養狗狗的同學們，老師一直說不出口的事。<\/p>\n<p>我有一個女兒14歲，陪著我們搬了無數次的家，由台北到花蓮，無論我們工作有多忙，她都會在家中等我們回家，無論多久! 無論幾天! 直到有一天因為她自己在家被櫃子卡住，我們又在韓國旅遊，等了七天我們回家時，她已經奄奄一息!<\/p>\n<p>我們最辛苦的日子她都會陪我們渡過，無論是在三重被黑道逼著搬家，無論是在木柵與花蓮之間每個週間的螞蟻搬家，一車車的家當都是她陪著我們慢慢地移動，就像我們不想放棄的記憶一樣，總是要一塊塊地拚湊起來。她就像我們的家人一樣，一次都不能缺席。<\/p>\n<p>所以，老師看著大家在學校帶著可愛的、買來的小狗來上課時，都很想告訴各位二件事:<\/p>\n<p>第一件事、如果年輕的你仍有遠大的理想，仍希望可以打工渡假、留學遊學；或是你要移地工作，離鄉背景，建議你們不要養狗狗，因為他們會想你、等你，可是你會忘了他們。<\/p>\n<p>第二件事、如果你很愛狗狗，又有環境可以照顧他們，與他們成為家人，請去領養流浪狗，他們與你在寵物店買的狗狗一樣可愛，一樣忠心，但是你不會鼓勵不合理的飼育行為及完全變質的竉物市場，更可以為他們找一個家。<\/p>\n<p>如果你又愛狗又沒有空養狗，請在11月29日起支持這個國片，九把刀說所有的盈餘全都會幫助到每一個可能可以幫助到的生命。<\/p>\n<p><a href=\"http://youtu.be/FFedOSmGaAE\">http://youtu.be/FFedOSmGaAE<\/a><\/p>"}, {"id": "f1384213668", "date": "2013-11-12", "title": "光豐農會以開發馬太鞍休閒農業區為主題，舉辦馬太鞍創意食材…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "光豐農會以開發馬太鞍休閒農業區為主題，舉辦馬太鞍創意食材旅行遊程設計競賽，主辦單位希望參賽者以馬太鞍自產自銷原料為素材之創意產品，並結合光復鄉在地其他特色資源，創新組合在地食材，整", "len": 506, "body": "<p>光豐農會以開發馬太鞍休閒農業區為主題，舉辦馬太鞍創意食材旅行遊程設計競賽，主辦單位希望參賽者以馬太鞍自產自銷原料為素材之創意產品，並結合光復鄉在地其他特色資源，創新組合在地食材，整合休閒農業區內及在地農業資源如農業生產、農民生活、農村生態及人文特色及自然景觀等，結合與農業相關的活動，發揮地方特色，設計成一種多樣性、精緻化與獨特性的農業旅遊。<\/p>\n<p>一、十二月五日下午五時截止<\/p>\n<p>二、凡對這項遊程設計競賽有興趣者，不限個人或團體，都可以參加，即日起收件，到今年十二月五日下午五時截止，今年十二月六日上午九時，主辦單位將在光豐農會超市二樓邀請評審委員審議，評分標準為主題創意（卅％）、創意食材（廿％）、旅行遊程（廿％）、整體完整性（卅％）。<\/p>\n<p>三、比賽選出前三名，第一名獎金五萬元，第二名三萬元，第三名二萬元。前三名得主將於今年十二月十日刊登於更生日報廣告欄。<\/p>\n<p>四、參賽者將參賽作品含電子檔繳交光豐農會推廣股，地址；花蓮縣光復鄉大同村自強路一之一號。<\/p>\n<p><a href=\"http://www.ksnews.com.tw/newsdetail.php?n_id=0000496446&amp;level2_id=106#.UoFjVEKkzAw.facebook\">http://www.ksnews.com.tw/newsdetail.php?n_id=0000496446&amp;level2_id=106#.UoFjVEKkzAw.facebook<\/a><\/p>"}, {"id": "f1380437115", "date": "2013-09-29", "title": "其實台灣就是做研究的寶地，實在是太有趣!", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "其實台灣就是做研究的寶地，實在是太有趣! 只是這樣的研究經費國科會給鄭明修研究的比例二年也才兩百多萬元台幣， https://nscnt07.nsc.gov.tw/WRS/prog", "len": 338, "body": "<p>其實台灣就是做研究的寶地，實在是太有趣!<\/p>\n<p>只是這樣的研究經費國科會給鄭明修研究的比例二年也才兩百多萬元台幣，<\/p>\n<p><a href=\"https://nscnt07.nsc.gov.tw/WRS/program_list.asp?a=421$415$414$422$418$417$414$413$414$434$9290&amp;b=%E9%84%AD%E6%98%8E%E4%BF%AE\">https://nscnt07.nsc.gov.tw/WRS/program_list.asp?a=421$415$414$422$418$417$414$413$414$434$9290&amp;b=%E9%84%AD%E6%98%8E%E4%BF%AE<\/a><\/p>\n<p>相較於很多大學門來說都是買台設備就沒有了~<\/p>\n<p>怪方蟹現蹤 《熱鍋邊的螃蟹》探索海底奧祕<\/p>\n<p>中國時報【賴秉均╱宜蘭報導】<\/p>\n<p>生存在龜山島海域的烏龜怪方蟹，是宜蘭特有的蟹種，能存活在100度高溫的熱泉裡，37歲的年輕導演林裕翔，與團隊人員花了2年多的時間，潛進深海裡，忍受高溫拍攝怪方蟹的身影，拍到蟹群的那一刻，林裕翔說：「很驚喜、很美！」<\/p>"}, {"id": "f1379990267", "date": "2013-09-24", "title": "重要通知]", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "重要通知] 原住民學生烘焙食品能力訓練為配合大家的上課時間改為15:00~19:00(每週五)上課了, 歡迎所有同學參加喔，由本校廚藝系黃文龍師父教大家做香香的麵包，真的好棒呀! ", "len": 237, "body": "<p>重要通知]<\/p>\n<p>原住民學生烘焙食品能力訓練為配合大家的上課時間改為15:00~19:00(每週五)上課了, 歡迎所有同學參加喔，由本校廚藝系黃文龍師父教大家做香香的麵包，真的好棒呀!<\/p>\n<p>瑞峰老師<\/p>\n<p>內容如下: 趕快去報名喔~~<\/p>\n<hr />\n<p>主旨 原住民學生烘焙食品能力訓練<\/p>\n<p>時間 102/10/04起每週五15:00~19:00，會一直上到12月初<\/p>\n<p>內容 目的:訓練學生培養第二專長，增加就業能力及信心。<\/p>\n<p>實施期限:102學年度第一學期<\/p>\n<p>本校原住民學生優先報名<\/p>\n<p>參加人數:預計招收35名學生<\/p>\n<p>相關報名簡章請至餐旅系系辦洽取。<\/p>"}, {"id": "f1379311241", "date": "2013-09-16", "title": "經濟部中小企業處於9/24（二）10點", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "經濟部中小企業處於9/24（二）10點 在花蓮高商資訊館舉辦創業達人論壇講座<花蓮場>， 本場次邀請到了花蓮香格里拉 張清來董事長、明利旅行社 許兆麟董事長、吉蒸牧場 范紀明創辦人", "len": 279, "body": "<p>經濟部中小企業處於9/24（二）10點<\/p>\n<p>在花蓮高商資訊館舉辦創業達人論壇講座&lt;花蓮場&gt;，<\/p>\n<p>本場次邀請到了花蓮香格里拉 張清來董事長、明利旅行社 許兆麟董事長、吉蒸牧場 范紀明創辦人、PASA空間 江冠明創辦人等創業有成的創業大師與達人蒞臨，以【飄著文化味的休閒觀光更誘人】為主題進行分享，並且邀請到花蓮縣觀光旅館商業同業公會 陳惠慈理事長及和通創投 嚴心雋協理擔任主持群!<\/p>\n<p>同學及老師都可以報名，機會難得且名額有限，欲報從速!<\/p>\n<p>本論壇提供午餐飯盒、精緻茶點，活動完全免費！<\/p>\n<p>趕快上創業育成學習網（<a href=\"http://www.527188.com.tw/Web/RC.aspx）線上報名！\">http://www.527188.com.tw/Web/RC.aspx）線上報名！<\/a><\/p>"}, {"id": "f1377226709", "date": "2013-08-23", "title": "[全程免費] 臺灣觀光學院新三鐵活動師資培訓營", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "[全程免費] 臺灣觀光學院新三鐵活動師資培訓營 聘請業界專業水域及陸域教師開設新三鐵活動師資培訓課程，敬邀北區教學資源中心各夥伴學校教師一同參與活動。 時間為102年9月5-6日 ", "len": 444, "body": "<p>[全程免費] 臺灣觀光學院新三鐵活動師資培訓營<\/p>\n<p>聘請業界專業水域及陸域教師開設新三鐵活動師資培訓課程，敬邀北區教學資源中心各夥伴學校教師一同參與活動。<\/p>\n<p>時間為102年9月5-6日<\/p>\n<p>地點位於花蓮鯉魚潭及臺灣觀光學院<\/p>\n<p>包含基礎課程及實習體驗課程總計22小時，結訓後發給研習證書。<\/p>\n<p>參加本研習課程，需於活動期間著輕便服裝及運動鞋。<\/p>\n<p>本研習課程無需支付報名費用，敬請踴躍參加。<\/p>\n<hr />\n<p>貳、指導單位：教育部技職司<\/p>\n<p>參、承辦單位：北區技專校院教學資源中心、臺灣觀光學院<\/p>\n<p>肆、主辦單位：臺灣觀光學院 學務處體育運動組<\/p>\n<p>伍、參加對象：北區教學資源中心各夥伴學校之教師<\/p>\n<p>陸、參加名額：50人<\/p>\n<p>柒、活動日期及時間：102年9月5日（星期四）10:00 ~18:00<\/p>\n<p>102年 9月6日（星期五）9:00 ~17:00<\/p>\n<p>捌、活動地點：花蓮鯉魚潭、臺灣觀光學院<\/p>\n<p>玖、活動時間與內容：（請參閱附件一）<\/p>\n<p>拾、報名方式：請至體育運動組辦公室報名<\/p>\n<p>拾、聯絡方式：臺灣觀光學院 謝瑞瑜小姐；電話：(038)653906 #835<\/p>\n<p>拾壹、本校地址：花蓮縣壽豐鄉壽山村中興街268號<\/p>\n<hr />"}, {"id": "f1376359883", "date": "2013-08-13", "title": "想當大仁哥嗎？", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "想當大仁哥嗎？ 想當年我也是有考上復興地勤的呢! 但是還好沒去，不然以現在的髮量，根本一點也帥不起來！！ 復興航空招募新血中，8/19日報名截止。 現在任職於復興航空地勤的 @[1", "len": 329, "body": "<p>想當大仁哥嗎？<\/p>\n<p>想當年我也是有考上復興地勤的呢! 但是還好沒去，不然以現在的髮量，根本一點也帥不起來！！<\/p>\n<p>復興航空招募新血中，8/19日報名截止。<\/p>\n<p>現在任職於復興航空地勤的 @[1284236696:2048:Shyh-shin Guo]學長、長榮地勤的 @[100005078321158:2048:陳怡君]學姊@[100000272599932:2048:Max Huang]學長，他們都是台灣觀光學院旅遊系畢業生。<\/p>\n<p>學習專業的最好選擇-台灣觀光學院<\/p>\n<p>最後入學機會: 線上招生報名專屬網站<\/p>\n<p><a href=\"http://ibook.tht.edu.tw/newman\">http://ibook.tht.edu.tw/newman<\/a><\/p>\n<p>入學考試考古題題庫<\/p>\n<p><a href=\"http://www.tht.edu.tw/newspic/102學年度日間部四技二專單獨招生考試題庫.pdf\">http://www.tht.edu.tw/newspic/102學年度日間部四技二專單獨招生考試題庫.pdf<\/a><\/p>"}, {"id": "f1375151667", "date": "2013-07-30", "title": "(一)~8/22(四)是各位的學弟妹進入學校的最後機會，…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "同學們 8/19(一)~8/22(四)是各位的學弟妹進入學校的最後機會，無論畢業於餐旅、商管、資訊、機械等群都可以報名；報名網址為: http://ibook.tht.edu.tw", "len": 501, "body": "<p>同學們<\/p>\n<p>8/19(一)~8/22(四)是各位的學弟妹進入學校的最後機會，無論畢業於餐旅、商管、資訊、機械等群都可以報名；報名網址為: <a href=\"http://ibook.tht.edu.tw/newman/\">http://ibook.tht.edu.tw/newman/<\/a><\/p>\n<p>到時再上網考試，將依考試成績來進行系科的分發。<\/p>\n<p>最重要的是如果是你推薦同學報名，可以盡速填寫附件的協助招生獎學金申請表，每推薦一名單獨招生同學入校就讀，就可以獲得一千元的獎學金。(一定要注意時效在8/23放榜之前申請，如果不在花蓮，可以請老師或同學幫忙喔)<\/p>\n<p><a href=\"http://administration.tht.edu.tw/student_affairs/%E7%94%9F%E8%BC%94%E7%B5%84/100/%E6%A0%A1%E5%85%A7%E7%8D%8E%E5%8A%A9%E5%AD%B8%E9%87%91/%E8%A1%A8%E5%96%AE/%E5%AD%B8%E7%94%9F%E6%A0%A1%E8%AD%BD%E8%A1%8C%E9%8A%B7%E7%8D%8E%E5%AD%B8%E9%87%91%E7%94%B3%E8%AB%8B%E8%A1%A8.doc\">http://administration.tht.edu.tw/student_affairs/%E7%94%9F%E8%BC%94%E7%B5%84/100/%E6%A0%A1%E5%85%A7%E7%8D%8E%E5%8A%A9%E5%AD%B8%E9%87%91/%E8%A1%A8%E5%96%AE/%E5%AD%B8%E7%94%9F%E6%A0%A1%E8%AD%BD%E8%A1%8C%E9%8A%B7%E7%8D%8E%E5%AD%B8%E9%87%91%E7%94%B3%E8%AB%8B%E8%A1%A8.doc<\/a><\/p>\n<p>餐旅管理系 瑞峰老師 敬上<\/p>"}, {"id": "f1371102561", "date": "2013-06-13", "title": "台灣觀光學院四技、二專、五專部單獨招生", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "台灣觀光學院四技、二專、五專部單獨招生 歡迎高中職畢業生(非觀光餐旅類均可) 至線上報名網站上登錄，並填寫報名順序 http://ibook.tht.edu.tw/newman/ ", "len": 324, "body": "<p>台灣觀光學院四技、二專、五專部單獨招生<\/p>\n<p>歡迎高中職畢業生(非觀光餐旅類均可)<\/p>\n<p>至線上報名網站上登錄，並填寫報名順序<\/p>\n<p><a href=\"http://ibook.tht.edu.tw/newman/\">http://ibook.tht.edu.tw/newman/<\/a><\/p>\n<p>如果新鮮人們<\/p>\n<p>1.想當阿基師的徒弟的請填: 廚藝管理系科<\/p>\n<p>2.想當五星級飯店人的請填: 餐旅管理系<\/p>\n<p>3.對美食餐廳高度喜愛的請填: 餐飲管理系<\/p>\n<p>4.期待當導遊領隊當林龍傳人的請填: 觀光旅遊系<\/p>\n<p>5.對花蓮山海戶外休閒活動熱愛的請填: 觀光休閒系<\/p>\n<p>無論你是工業類、電子群、商業群、亦或是普通高中都可以報名喔!<\/p>\n<p>簡章下載: <a href=\"http://www.tht.edu.tw/newspic/20130610.pdf\">http://www.tht.edu.tw/newspic/20130610.pdf<\/a><\/p>\n<p>馬上辦報名處: <a href=\"http://ibook.tht.edu.tw/newman\">http://ibook.tht.edu.tw/newman<\/a><\/p>\n<p>觀光學院歡迎新鮮人!!!<\/p>"}, {"id": "f1370998088", "date": "2013-06-12", "title": "非常感謝 Ariel Chen 找回了10多年前論文, …", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "非常感謝 Ariel Chen 找回了10多年前論文, 更讓自己不斷地想起在中華徵信所下班後周文賢老師為市場研究部開的統計課程，他精實的統計基礎及風趣的上課內容，時時刻刻都在影響著", "len": 492, "body": "<p>非常感謝 Ariel Chen 找回了10多年前論文, 更讓自己不斷地想起在中華徵信所下班後周文賢老師為市場研究部開的統計課程，他精實的統計基礎及風趣的上課內容，時時刻刻都在影響著我！更想起去理成營造台茂購物中心說明研究報告時，周文賢老師為決策系統專業的Defense身影。<\/p>\n<p>後來研究所畢業前委請他做口試委員，結果周老師卻要我每週都要去中興大學企管系與他的研究生共同討論論文，還記得那時每天白天在信欣上班，文化下課之後，還要到復興北路的辦公室上課，準備討論內容，與中興企研的研究生一同上研討會。<\/p>\n<p>有一晚，老師還拿了他新生小女兒的名字統計表給我們大家選，希望為他的掌上明珠取個美麗聰慧的名字。周文賢教授是我工作的啟蒙師、研究所時的共同指導；他的努力與成就是我一生的模範，在業界是專業的顧問；在學界是精實的大家；著作等身的他為統計學及企管界留下了永遠的典範。<\/p>\n<p><a href=\"http://docs.google.com/leaf?id=0B7IuUJKEN1UbMzA2ZmQwNzItOWM2ZS00MTIyLWE2OWYtY2U5NGRkY2I4ZDQ5&amp;sort=name&amp;layout=list&amp;num=50\">http://docs.google.com/leaf?id=0B7IuUJKEN1UbMzA2ZmQwNzItOWM2ZS00MTIyLWE2OWYtY2U5NGRkY2I4ZDQ5&amp;sort=name&amp;layout=list&amp;num=50<\/a><\/p>"}, {"id": "f1369655776", "date": "2013-05-27", "title": "小朋友在花蓮念書很多地方都不錯, 但是唯獨這種儒家思想的…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "小朋友在花蓮念書很多地方都不錯, 但是唯獨這種儒家思想的強迫訓練實在是讓人難以接受!! 小學以前要沒腦地念完弟子規、三字經、論語、唐詩、朱子治家格言、禮運大同篇、諸葛亮戒子書。花蓮", "len": 840, "body": "<p>小朋友在花蓮念書很多地方都不錯, 但是唯獨這種儒家思想的強迫訓練實在是讓人難以接受!!<\/p>\n<p>小學以前要沒腦地念完弟子規、三字經、論語、唐詩、朱子治家格言、禮運大同篇、諸葛亮戒子書。花蓮縣政府的訪視建議第七點還要教師無須逐句解釋，再於生活中接觸時進行機會教育即可!<\/p>\n<p>朱子治家格言我也沒讀過，網路上找找看完內容之後，更覺得這需要孩子去背嗎<\/p>\n<hr />\n<p>黎明即起，灑掃庭除，要內外整潔。既昏便息，關鎖門戶，必親自檢點。一粥一飯，當思來處不易．半絲半縷，恆念物力維艱。宜未雨而綢繆，毋臨渴而掘井。自奉必須儉約，宴客切勿留連。器具質而潔，瓦缶勝金玉。飲食約而精，園蔬勝珍饈。勿營華屋，勿謀良田。<\/p>\n<p>三姑六婆，實淫盜之媒．婢美妾嬌，非閨房之福。奴僕勿用俊美，妻妾切忌艷妝。祖宗雖遠，祭祀不可不誠．子孫雖愚，經書不可不讀。居身務期質樸，教子要有義方。勿貪意外之財，勿飲過量之酒。<\/p>\n<p>與肩挑貿易，勿佔便宜．見貧苦親鄰，須多溫恤。刻薄成家，理無久享．倫常乖舛<\/p>\n<p>立見消亡。兄弟叔侄，須多分潤寡．長幼內外，宜法屬辭嚴。聽婦言，乖骨肉，豈是丈夫．重資財，薄父母，不成人子。嫁女擇佳婿，毋索重聘．娶媳求淑女，毋計厚奩。<\/p>\n<p>見富貴而生讒容者，最可恥．遇貧窮而作驕態者，賤莫甚。居家戒爭訟，訟則終凶。處世戒多言，言多必失。毋恃勢力而凌逼孤寡，勿貪口腹而恣殺生禽。乖僻自是，悔誤必多．頹惰自甘，家道難成。狎昵惡少，久必受其累．屈誌老成，急則可相依。輕聽發言，安知非人之譖訴，當忍耐三思．因事相爭，安知非我之不是，須平心遭暗想。<\/p>\n<p>施惠勿念，受恩莫忘。凡事當留余地，得意不宜再往。人有喜慶，不可生妒忌心。人有禍患，不可生喜幸心。善欲人見，不是真善．惡恐人知，便是大惡。見色而起淫心，報在妻女．匿怨而用暗箭，禍延子孫。<\/p>\n<p>家門和順，雖饔飧不繼，亦有余歡．國課早完，即囊橐無余，自得至樂。讀書誌在聖賢，為官心存君國。守分安命，順時聽天。為人若此，庶乎近焉。<\/p>\n<hr />\n<p><a href=\"http://tw.news.yahoo.com/花蓮推讀經-人本-應家長同意-050027590.html\">http://tw.news.yahoo.com/花蓮推讀經-人本-應家長同意-050027590.html<\/a><\/p>"}, {"id": "f1366795971", "date": "2013-04-24", "title": "Opposite Case Study", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "Opposite Case Study 四月天至花蓮某家連鎖餐廳用餐, 本來要點超大牛肉飯大碗159元(這是印刷好的菜單有的喔), 結果店員告知只有小碗套餐139元; 詢問為何沒有", "len": 418, "body": "<p>Opposite Case Study<\/p>\n<p>四月天至花蓮某家連鎖餐廳用餐, 本來要點超大牛肉飯大碗159元(這是印刷好的菜單有的喔), 結果店員告知只有小碗套餐139元; 詢問為何沒有?<\/p>\n<p>店員回答: 對不起我們只有麵類可以加大;<\/p>\n<p>我說: 可是你們總公司列的彩色菜單上有列;<\/p>\n<p>店員: 真的嗎?<\/p>\n<p>我: 你拿櫃前的菜單給她, 妳看!<\/p>\n<p>店員: 喔, 那我們仍沒賣, 因為如果飯類加大, 我們會不合成本<\/p>\n<p>我: 無言...<\/p>\n<p>這是我期待花蓮重開此連鎖餐廳以來第二次去用餐, 第一次也因為店員的不理人服務態度失望到一陣子不去用餐, 最近看換了店員想再給機會, 結果更無奈!!<\/p>\n<p>最後在該公司的FB上以私訊留言, 請那家公司請多加油!!<\/p>\n<p>他們的回應如下...<\/p>\n<p>在劇場理論觀點服中, 服務接觸時有很多的關卡是可以有機會進行服務補救的, 尤其是一位忠誠的顧客很客氣的提出建言時, 第一線的服務人員應該是一場表演秀的主角, 而不是以內部成本來向顧客說明; 但, 也許這家店是加盟店真的是老板娘來向我解釋那一碗加大的飯會讓他們做不下去的哩!<\/p>"}, {"id": "f1366701411", "date": "2013-04-23", "title": "花錢去地球村不必! 買書自修不必!!", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "花錢去地球村不必! 買書自修不必!! 觀光餐旅系兩位英文名師免費為大家衝多益高分!!! ~~~~~英語能力檢定輔導班~~~~~ 為辦理北區教學資源中心計畫，開設「英語能力檢定輔導班", "len": 311, "body": "<p>花錢去地球村不必! 買書自修不必!!<\/p>\n<p>觀光餐旅系兩位英文名師免費為大家衝多益高分!!!<\/p>\n<p>~~~~~英語能力檢定輔導班~~~~~<\/p>\n<p>為辦理北區教學資源中心計畫，開設「英語能力檢定輔導班」課程，歡迎學生報名。<\/p>\n<p>課程說明如下，敬請協助公告，謝謝。<\/p>\n<p>觀光餐旅系柳瑜佳敬上<\/p>\n<p>※說明：<\/p>\n<p>一、課程：「英語能力檢定輔導班」<\/p>\n<p>二、時間：自4月24日至5月16日止<\/p>\n<p>A班(文法寫作班)每週一晚上6點到9點及週三下午2點到5點；<\/p>\n<p>B班(聽力閱讀班)每週二晚上6點到9點及週四下午2點到5點。<\/p>\n<p>三、地點：觀光大樓201教室<\/p>\n<p>四、名額：30人<\/p>\n<p>五、報名：請至觀光餐旅系辦報名。<\/p>\n<p>六、備註：<\/p>\n<p>免費報名，唯為維持良好學習風氣，需繳交保證金300元；<\/p>\n<p>缺課未超過3次(含)，期滿後全額退還。<\/p>"}, {"id": "f1365588859", "date": "2013-04-10", "title": "觀光餐旅系承辦北區教學資源中心計畫，開設「行動媒體概念與…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "觀光餐旅系承辦北區教學資源中心計畫，開設「行動媒體概念與製作入門」課程，歡迎師生報名。課程說明如下，敬請協助公告，謝謝。 觀光餐旅系鄒桂苑敬上 課程說明： （一）目的：介紹Andr", "len": 432, "body": "<p>觀光餐旅系承辦北區教學資源中心計畫，開設「行動媒體概念與製作入門」課程，歡迎師生報名。課程說明如下，敬請協助公告，謝謝。<\/p>\n<p>觀光餐旅系鄒桂苑敬上<\/p>\n<p>課程說明：<\/p>\n<p>（一）目的：介紹Android系統、設計app並上架。<\/p>\n<p>（二）教師：圖資中心主任林裕增副教授。<\/p>\n<p>（三）時間：102年4月17日起，每週三下午3-5時。<\/p>\n<p>地點：圖資大樓402教室。<\/p>\n<p>（四）名額：20人。<\/p>\n<p>(為便於教學輔導、提升學習成效之故，採小班制教學)<\/p>\n<p>（五）報名：請於開課前上網填妥報名表，額滿為止。網址：<\/p>\n<p><a href=\"https://docs.google.com/a/mail.tht.edu.tw/spreadsheet/viewform?formkey=dFVVVDBudW5qNl9yQ1FIdGRzU3BKaWc6MQ\">https://docs.google.com/a/mail.tht.edu.tw/spreadsheet/viewform?formkey=dFVVVDBudW5qNl9yQ1FIdGRzU3BKaWc6MQ<\/a><\/p>\n<p>（六）聯絡人：計畫助理呂心陶同學<\/p>\n<p>(信箱：10168103@mail.tht.edu.tw)<\/p>\n<p>（七）備註：<\/p>\n<p>免費報名，為維持良好學習風氣，需繳交保證金300元.<\/p>\n<p>缺課未超過3次(含)，期滿後全額退還，並發給研習證明。<\/p>"}, {"id": "f1363354035", "date": "2013-03-15", "title": "對自己最實惠的投資", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "對自己最實惠的投資 在政大書城見到了陳國璋師父的新書【在家練氣功】,請阿狗來代言推薦一下: 本書真的是在解救我們這些忙碌的現代人，成天生活在時間與人情的壓力之中，藉由陳老師所介紹由", "len": 313, "body": "<p>對自己最實惠的投資<\/p>\n<p>在政大書城見到了陳國璋師父的新書【在家練氣功】,請阿狗來代言推薦一下:<\/p>\n<p>本書真的是在解救我們這些忙碌的現代人，成天生活在時間與人情的壓力之中，藉由陳老師所介紹由外而內、柔軟鬆筋的基本功，用最節省的時間與空間，短短的時間就逼出一身的汗水與濁氣，交替成清明自在的身體本質，以個人而言至今為止仍受用無窮，在此以自身的經驗與豐富收穫向讀者推薦陳老師的書，期待有更多的向武之人為自己的健康與未來生活做一個最實惠的投資，更期待每一位讀者都按圖索驥，體驗精氣神全都煥然一新的驚奇感受。<\/p>\n<p>博客來網路書店 <a href=\"http://www.books.com.tw/exep/prod/booksfile.php?item=0010578011\">http://www.books.com.tw/exep/prod/booksfile.php?item=0010578011<\/a><\/p>"}, {"id": "f1345696262", "date": "2012-08-23", "title": "因颱風影響原訂8/25(六)報到，改為通訊報到，", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "因颱風影響原訂8/25(六)報到，改為通訊報到， 報到說明如下: 請各位同仁接到電話時協助告知新生，謝謝。 臺灣觀光學院四技二專日間部單獨招生 報到、註冊作業說明 一、成績暨錄取通", "len": 472, "body": "<p>因颱風影響原訂8/25(六)報到，改為通訊報到，<\/p>\n<p>報到說明如下:<\/p>\n<p>請各位同仁接到電話時協助告知新生，謝謝。<\/p>\n<p>臺灣觀光學院四技二專日間部單獨招生 報到、註冊作業說明<\/p>\n<p>一、成績暨錄取通知寄發時間：101.08.23(週四)下午17時，以宅配方式寄送。<\/p>\n<p>二、報到說明：<\/p>\n<p>1.原訂現場報到時間：101.08.25(週六) 下午13:00~16:00。<\/p>\n<p>(因天秤颱風影響，一律改為通訊報到，請錄取生將報到資料於8/28(二)前郵寄至本校招生組)<\/p>\n<p>三、欲申請住宿錄取生請於8/24(五)上午8點 開始上網登記床位。<\/p>\n<p>四、制服套量可於9月12日(週三)下午13:30~16:00新生輔導日實施。<\/p>\n<p>五、報到攜帶資料：<\/p>\n<p>1.畢業證書或修業證明書正本<\/p>\n<p>2.二吋照片4張(背面註明：單招、錄取學制、系名、姓名)。<\/p>\n<p>3.身份證正反面影本。<\/p>\n<p>4.特殊身份證明文件(需檢附證明文件，例:低收入戶證明、原住民戶藉謄本或殘障手冊等辦理學雜費減免用)<\/p>\n<p>六、9月7日(週五)前完成繳費手續。<\/p>\n<p>七、9月8日(週六)08:00宿舍開放，<\/p>\n<p>八、9月10~12日(週一~三)AM08:00~17:00 新生輔導日，請新生務必出席。<\/p>"}, {"id": "f1345435415", "date": "2012-08-20", "title": "給畢業生(歡迎你們推薦學弟妹來花蓮)", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "給畢業生(歡迎你們推薦學弟妹來花蓮) 畢業之後，會不會想起當年離鄉背景地由各地來到東部生活, 歷經適應, 學習各種酸甜苦辣的過程; 相信你們在西部的忙碌生活中, 花蓮的美, 校園生", "len": 626, "body": "<p>給畢業生(歡迎你們推薦學弟妹來花蓮)<\/p>\n<p>畢業之後，會不會想起當年離鄉背景地由各地來到東部生活, 歷經適應, 學習各種酸甜苦辣的過程; 相信你們在西部的忙碌生活中, 花蓮的美, 校園生活的悠閒仍留在心底的深處, 在這裡除了山野, 田原及星空之外, 老師相信你們也同時找到一生的摯友或伴侶。因為老師也是, 因為有你們的一同走過, 老師在花蓮的生活是如此地豐富與美好。<\/p>\n<p>如果你念舊也願意推薦, 在臺灣觀光學院的人事物仍讓你依戀, 瑞峰老師希望你可以幫忙推薦你的學弟學妹享受花蓮生活的美好, 母校的獨招一直都在進行中，可以請他們上網登記考試, 最後期限是8/23星期四, 歡迎你推薦你的學弟妹或親戚朋友來花蓮求學, 告訴他們這是在台灣的短程留學生涯, 將會有挑戰, 更會有不少的收穫。<\/p>\n<p>報名系統 (http://ibook.tht.edu.tw/newman)<\/p>\n<p>四技二專獨立招生線上考試 <a href=\"http://ibook.tht.edu.tw/newman/testlogin.aspx\">http://ibook.tht.edu.tw/newman/testlogin.aspx<\/a><\/p>\n<p>最後期限至8/23(四)中午 12:00止<\/p>\n<p>你可以請有興趣的學弟妹, 用FB, MSN的方式與老師連繫, 當然你們也可以找更為熟悉的系上老師, 請他們幫忙報名!!<\/p>\n<p>以下是報名的重要連結, 歡迎與老師連繫喔, 並非常歡迎轉載~<\/p>\n<p>報名系統 (http://ibook.tht.edu.tw/newman)<\/p>\n<p>四技二專獨立招生線上考試 <a href=\"http://ibook.tht.edu.tw/newman/testlogin.aspx\">http://ibook.tht.edu.tw/newman/testlogin.aspx<\/a><\/p>\n<p>最後期限至8/23(四)中午 12:00止<\/p>"}, {"id": "f1336223553", "date": "2012-05-05", "title": "更生日報", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2012-05-05更生日報 圖：紙做的原住民風味美食，是利用紙的色調和天然的資源將原住民美食製作出來。（記者鍾仁順／攝） 記者鄭可欣／報導 臺灣觀光學院旅遊管理系畢業成果展昨天和", "len": 392, "body": "<p>2012-05-05更生日報<\/p>\n<p>圖：紙做的原住民風味美食，是利用紙的色調和天然的資源將原住民美食製作出來。（記者鍾仁順／攝） 記者鄭可欣／報導<\/p>\n<p>臺灣觀光學院旅遊管理系畢業成果展昨天和今天兩天下午一時卅分至五時在花蓮遠東百貨和平廣場舉行，此次以綠色旅遊的概念，透過綠色旅遊不僅能夠保護環境，也能達到學習的效果，現場作品都是學生經過數月的巧思和製作，有趣又熱鬧，歡迎民眾前往欣賞。<\/p>\n<p>畢業成果展的現場還有互動遊戲及臺灣觀光學院原民社的舞蹈表演，讓參觀民眾對原住民相關文化有親身的體驗，進而更瞭解原住民的豐富內涵。現場活動熱鬧豐富，除靜態導覽外，亦包含動態活動，包括有ＤＩＹ手創紀念品、低碳美食饗宴、時尚環保髮型秀、愛心義剪、愛心植物認養、樂團演唱等多項精彩內容。<\/p>\n<p><a href=\"http://www.ksnews.com.tw/newsdetail.php?n_id=0000247101&amp;level2_id=104\">http://www.ksnews.com.tw/newsdetail.php?n_id=0000247101&amp;level2_id=104<\/a><\/p>"}, {"id": "f1335790138", "date": "2012-04-30", "title": "採網路報名", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "採網路報名 1.請先至職訓e網： http://www.etraining.gov.tw/index.html 加入e網會員 2.再至產業人才投資方案網： http://tims.", "len": 479, "body": "<p>採網路報名<\/p>\n<p>1.請先至職訓e網：<a href=\"http://www.etraining.gov.tw/index.html\">http://www.etraining.gov.tw/index.html<\/a> 加入e網會員<\/p>\n<p>2.再至產業人才投資方案網：<a href=\"http://tims.etraining.gov.tw/timsonline/index.aspx\">http://tims.etraining.gov.tw/timsonline/index.aspx<\/a> 報名<\/p>\n<p>上課內容<\/p>\n<p>一、  服務禮儀介紹  (1小時)<\/p>\n<p>二、  工作團隊與團隊協作方法(一)  (2小時)<\/p>\n<p>三、  工作團隊與團隊協作方法(二)   (3小時)<\/p>\n<p>四、  花東地區會議展覽產業綜觀  (3小時)<\/p>\n<p>五、  會展產業基本架構及政策  (3小時)<\/p>\n<p>六、  會議展覽及國際會議介紹  (3小時)<\/p>\n<p>七、  會展預算及企畫書撰寫  (3小時)<\/p>\n<p>八、  會展行銷規劃  (3小時)<\/p>\n<p>九、  展覽活動規劃(3小時)<\/p>\n<p>十、  獎勵旅遊行銷 (3小時)<\/p>\n<p>十一、 會議現場管理技巧  (3小時)<\/p>\n<p>十二、 會議報名接待工作流程實務演練  (3小時)<\/p>\n<p>十三、 實用會展英語(3小時)<\/p>\n<p>十四、 會議實務作業規劃(3小時)<\/p>\n<p>十五、 會展場地規劃與運用-視聽器材及動線(3小時)<\/p>\n<p>十六、 展場文宣、場地佈置及人力資源管理      (3小時)<\/p>\n<p>十七、 會展行銷活動個案分析  (3小時)<\/p>\n<p>十八、 國際會議活動與節目安排實習(暫APTA) (3小時)<\/p>\n<p>十九、 安排參訪國際會議活動或展覽 (3小時)<\/p>"}, {"id": "f1312877116", "date": "2011-08-09", "title": "給畢業的THT校友們", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "給畢業的THT校友們 畢業之後，會不會想起當年離鄉背景由各地來到東部生活, 歷經適應, 學習各種酸甜苦辣的過程; 相信你們在各地忙碌生活中, 花蓮的美, 校園生活的悠閒仍留在心底的", "len": 374, "body": "<p>給畢業的THT校友們<\/p>\n<p>畢業之後，會不會想起當年離鄉背景由各地來到東部生活, 歷經適應, 學習各種酸甜苦辣的過程; 相信你們在各地忙碌生活中, 花蓮的美, 校園生活的悠閒仍留在心底的深處, 在這裡除了山野, 田原及星空之外, 老師相信你們也同時找到一生的摯友或伴侶。因為老師也是, 因為有你們的一同走過, 老師在花蓮的生活是如此地豐富與美好。<\/p>\n<p>如果你念舊也願意推薦, 在臺灣觀光學院的人事物仍讓你依戀, 老師希望你可以幫忙推薦你的學弟學妹享受花蓮生活的美好, 母校將於8/28日辦理獨招考試, 歡迎你推薦你的學弟妹或親戚朋友來花蓮求學, 告訴他們這是在台灣的小小留學生涯, 將會有挑戰, 更會有不少的收穫。<\/p>\n<p>可以用FB, Emai與老師連繫, 老師可以幫忙填報名表, 繳報名費等, 歡迎與老師連繫喔~<\/p>\n<p>瑞峰老師<\/p>\n<p>8/28 考試地點：<\/p>\n<p>東  臺灣觀光學院<\/p>\n<p>北  國立台北科技大學<\/p>\n<p>中  國立臺中技術學院<\/p>\n<p>南  國立高雄應用科技大學<\/p>"}, {"id": "f1288186487", "date": "2010-10-27", "title": "轉述外交部領事事務局99年10月27日發布之新聞稿，提醒…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "轉述外交部領事事務局99年10月27日發布之新聞稿，提醒國人赴泰國及印尼巴里島商旅應注意事項(外交部領事事務局網站 http://www.boca.gov.tw所公布之最新訊息 )", "len": 296, "body": "<p>轉述外交部領事事務局99年10月27日發布之新聞稿，提醒國人赴泰國及印尼巴里島商旅應注意事項(外交部領事事務局網站<a href=\"http://www.boca.gov.tw所公布之最新訊息\">http://www.boca.gov.tw所公布之最新訊息<\/a>)：<\/p>\n<p>一、<\/p>\n<p>泰國：泰國自本（10）月10日迄今發生在北部、東北部及中部地區之水災情形已有明顯好轉，目前泰國全境之旅遊警示仍維持為黃色燈號，國人赴泰商旅前請先<\/p>\n<p>注意當地氣象報導及瞭解交通情形。在泰旅遊行程如安排有「遊河」節目，因湄南河及其他各府河川水位高漲且水流湍急，請先向代安排之旅行社確認可否前往，以<\/p>\n<p>策安全。<\/p>\n<p>二、印尼巴里島：鑒於印尼巴里島持續面臨狂犬病威脅，疫情一直未能有效控制，國人如前往旅遊，請特別注意防範，避免感染。<\/p>"}, {"id": "f1273904233", "date": "2010-05-15", "title": "學生要在新加坡轉機至澳洲, 有一個晚上的時間, 在樟宜機…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "學生要在新加坡轉機至澳洲, 有一個晚上的時間, 在樟宜機場要做什麼呢? 1.可以搭 Free City Shuttle進城去看看, 時間表如下連結: http://www.chan", "len": 508, "body": "<p>學生要在新加坡轉機至澳洲, 有一個晚上的時間, 在樟宜機場要做什麼呢?<\/p>\n<p>1.可以搭 Free City Shuttle進城去看看, 時間表如下連結:<a href=\"http://www.changiairport.com/changi/en/airport_guide/transit/suggested_activities/free_city_shuttle.html?__locale=en\">http://www.changiairport.com/changi/en/airport_guide/transit/suggested_activities/free_city_shuttle.html?__locale=en<\/a><\/p>\n<p>2.找地方睡一下Napping Areas, 費用為3小時30元新幣, 連結如下:<a href=\"http://www.plaza-ppl.com/sg_en/nap.php,\">http://www.plaza-ppl.com/sg_en/nap.php,<\/a> 另外有更多的選擇, <a href=\"http://www.changiairport.com/changi/en/airport_guide/exp_changi/rest_n_relax/napping_areas.html\">http://www.changiairport.com/changi/en/airport_guide/exp_changi/rest_n_relax/napping_areas.html<\/a><\/p>\n<p>3.當然也有大椅子可以睡的地方, 應該是不用錢, <a href=\"http://www.changiairport.com/changi/en/airport_guide/exp_changi/rest_n_relax/napping_areas.html\">http://www.changiairport.com/changi/en/airport_guide/exp_changi/rest_n_relax/napping_areas.html<\/a><\/p>\n<p>所有的資料都在以下的中文網頁之中, 大家可以參考看看!<\/p>"}];

function doodle(cat, cls='doodle'){
  const [i,c] = ICON[cat]||ICON["生活記憶"];
  return `<svg class="${cls}" viewBox="0 0 76 76" aria-hidden="true"><ellipse cx="38" cy="40" rx="31" ry="28" fill="${c}" opacity=".75" filter="url(#wash)"/><g class="sk"><use href="#i-${i}"/></g></svg>`;
}
function tag(cat){ const c=(ICON[cat]||ICON["生活記憶"])[1]; return `<span class="tag" style="background:${c}99">${esc(cat)}</span>`; }
function card(a){
  return `<a class="card-a hand" href="#a-${a.id}">${doodle(a.cat)}

      <div class="meta">${tag(a.cat)}<span>${a.date.replace(/-/g,'.')}</span><span>${a.src==='Facebook'?'Facebook':'方格子'}</span></div></div></a>`;
}

function home(){
  const c = countBy();
  return `<div class="hero">
    <div><div class="lead">旅運系老師的筆記本</div>
      <h1>走過的路、<br>帶過的學生、<br><em>記得的事</em>。</h1>
      <p>這裡收著我在課堂、旅途和生活裡寫下的文章：高鐵實習怎麼準備、領隊考試怎麼讀、郵輪甲板上的遊戲，還有台北老旅行社裡的那兩年。</p>
      <div class="facts"><span class="hand">${ARTS.length} 篇文章</span><span class="hand">${ARTS[ARTS.length-1].date.slice(0,4)}–${ARTS[0].date.slice(0,4)}</span></div></div>
    ${CHIBI}</div>
  <section><div class="sec-head"><h2>最新文章</h2><a href="#writing">看全部 ${ARTS.length} 篇 →</a></div>
    <div class="cards">${ARTS.slice(0,6).map(card).join('')}</div></section>
  <section><div class="sec-head"><h2>依主題閱讀</h2></div>
    <div class="chips">${CATS.map(k=>`<button class="chip" type="button" data-go="${k}">${k}<i>${c[k]||0}</i></button>`).join('')}</div></section>
  <section><div class="series hand">${doodle('證照考試')}<div><h3><a href="#writing" data-go="證照考試" style="text-decoration:none">導遊領隊考前陪跑</a></h3><p>每年國考前，一天一題解析、一則提醒，陪學生走到考場。這個 Facebook 系列已經全部收進網站。</p></div>
    <div class="n">${ARTS.filter(a=>/考前/.test(a.title)).length}<small>篇</small></div></div></section>`;
}

function writing(){
  const c = countBy();
  return `<div class="sec-head"><h1 style="font-size:34px">文章</h1></div>
  <div class="tools"><input id="q" class="hand" type="search" placeholder="搜尋標題或內容，例如：高鐵、保險、郵輪" value="${esc(filt.q)}" aria-label="搜尋文章">
    <div class="chips" id="chips"><button class="chip ${filt.cat?'':'on'}" type="button" data-cat="">全部<i>${ARTS.length}</i></button>
    ${CATS.map(k=>`<button class="chip ${filt.cat===k?'on':''}" type="button" data-cat="${k}">${k}<i>${c[k]||0}</i></button>`).join('')}</div></div>
  <div class="count" id="count"></div><div class="cards" id="list"></div>
  <div style="text-align:center;margin-top:22px"><button class="chip" type="button" id="more" style="font-size:16px;padding:6px 22px">再看 24 篇</button></div>`;
}
function renderList(){
  const q = filt.q.trim();
  const r = ARTS.filter(a => (!filt.cat||a.cat===filt.cat) && (!q || a.title.includes(q) || a.body.includes(q)));
  const shown = r.slice(0, filt.n);
  document.getElementById('count').textContent = `共 ${r.length} 篇${r.length>shown.length?`，目前顯示 ${shown.length} 篇`:''}`;
  document.getElementById('list').innerHTML = r.length ? shown.map(card).join('') : `<p class="empty">找不到符合「${esc(q)}」的文章，換個關鍵字試試。</p>`;
  document.getElementById('more').hidden = r.length <= shown.length;
}

function article(id){
  const i = ARTS.findIndex(a=>a.id===id); if(i<0) return `<p class="empty">找不到這篇文章。<a href="#writing">回文章列表</a></p>`;
  const a = ARTS[i], prev = ARTS[i+1], next = ARTS[i-1];
  return `<article class="article"><a class="back" href="#writing">← 全部文章</a>
    <div style="margin-top:14px">${doodle(a.cat)}</div>
    <h1>${esc(a.title)}</h1>
    <div class="meta">${tag(a.cat)}<span>${a.date.replace(/-/g,'.')}</span><span>${a.len.toLocaleString()} 字</span><span>約 ${Math.max(1,Math.round(a.len/400))} 分鐘</span></div>
    <div class="prose">${a.body}</div>
    <div class="origin hand">本文最早發表於${a.src==='Facebook'?' Facebook':'方格子'}：<a href="${a.url}" target="_blank" rel="noopener">${esc(a.url)}</a></div>
    <div class="pn">${prev?`<a class="hand" href="#a-${prev.id}"><span>上一篇</span>${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="hand next" href="#a-${next.id}"><span>下一篇</span>${esc(next.title)}</a>`:''}</div>
  </article>`;
}

function teaching(){
  const t = ARTS.filter(a=>['技職教育','證照考試'].includes(a.cat));
  return `<h1 style="font-size:34px;margin-bottom:6px">教學</h1><p class="lead" style="margin:0">給醒吾旅運與觀光科系同學的課程資源、證照準備與實習經驗。</p>
  <section><div class="cols">
    <div class="box hand">${doodle('證照考試')}<h3>國考領隊證照專區</h3><ul><li>領隊導遊課程筆記</li><li>華語領隊模擬考題</li><li>導遊領隊考前陪跑（已收進文章）</li></ul></div>
    <div class="box hand">${doodle('旅行郵輪')}<h3>郵輪、旅展與微學分</h3><ul><li>郵輪旅遊</li><li>ITF 台北國際旅展</li><li>微學分課程報名</li></ul></div>
    <div class="box hand">${doodle('技職教育')}<h3>觀光法規案例</h3><ul><li>甘肅團與日本團案例比較</li><li>旅行社財務分析</li></ul></div>
  </div><p class="note">這三區的內容目前在 Google Sites 上，正式網站會把講義、筆記和下載連結搬過來。</p></section>
  <section><div class="sec-head"><h2>相關文章</h2></div><div class="cards">${t.map(card).join('')}</div></section>`;
}

function travel(){
  const t = ARTS.filter(a=>a.cat==='旅行郵輪');
  const place = (code,name,txt,col)=>`<div class="box hand"><svg class="doodle" viewBox="0 0 76 76" aria-hidden="true"><ellipse cx="38" cy="40" rx="31" ry="27" fill="${col}" opacity=".75" filter="url(#wash)"/><text x="38" y="47" text-anchor="middle" font-family="LXGW WenKai TC, serif" font-size="20" font-weight="700" fill="#4a3426">${code}</text></svg><h3>${name}</h3><p>${txt}</p></div>`;
  return `<h1 style="font-size:34px;margin-bottom:6px">旅行</h1><p class="lead" style="margin:0">帶團、見學與自己出走的紀錄。</p>
  <section><div class="cols">
    ${place('BKK','泰國 Thailand','目前在 Google Sites 的 Thailand 頁，正式網站會搬過來。','#f2d488')}
    ${place('NGO','名古屋 Nagoya','目前在 Google Sites 的 Nagoya 頁，正式網站會搬過來。','#f1b79c')}
    ${place('YVR','加拿大 Canada','醒吾旅運學海築夢見學，溫哥華與維多利亞。','#a9c9d9')}
  </div></section>
  <section><div class="sec-head"><h2>旅行文章</h2></div><div class="cards">${t.map(card).join('')}</div></section>`;
}

function hello(){
  return `<div class="article"><div class="lead">HELLO</div><h1>你好，我是 Ray</h1>
  <div class="prose"><p>在大學旅運系教書，教的是領隊導遊、郵輪旅遊和觀光法規。教書之前在中華徵信所和旅行業工作過，大學時在民生東路的老旅行社騎機車送簽證，那兩年的故事寫在「駱老闆和他的朋友們」系列裡。</p>
  <p>這個網站整理我在方格子沙龍「隨峰而趣 Rayfong's Travelogue」和 Facebook 上寫的文章，也放課程講義與證照資源。</p></div></div>
  <section><div class="cols">
    <div class="box hand">${doodle('每日晨讀')}<h3>個人簡歷</h3><p>CV（待補：從 Google Sites 搬過來）</p></div>
    <div class="box hand">${doodle('技職教育')}<h3>任教學校</h3><p>醒吾科大旅運系（HWU）<br>臺灣觀光學院（THT）</p></div>
    <div class="box hand">${doodle('生活記憶')}<h3>找到我</h3><p><a href="https://www.facebook.com/chenrayfong" target="_blank" rel="noopener">Facebook</a> · <a href="https://vocus.cc/salon/rayfong" target="_blank" rel="noopener">方格子</a><br>Instagram、YouTube（待補）</p></div>
  </div><p class="note">MY BOOKS 的內容目前在 Google Sites 上，正式網站會搬過來。</p></section>`;
}

function route(){
  const h = (location.hash||'#home').slice(1);
  let v = h.startsWith('a-') ? 'writing' : (['home','writing','teaching','travel','hello'].includes(h)?h:'home');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(h.startsWith('a-')) app.innerHTML = article(h.slice(2));
  else if(v==='writing'){ app.innerHTML = writing(); renderList(); }
  else app.innerHTML = ({home,teaching,travel,hello})[v]();
  window.scrollTo(0,0);
}
app.addEventListener('input', e=>{ if(e.target.id==='q'){ filt.q=e.target.value; filt.n=24; renderList(); }});
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-cat]');
  if(b){ filt.cat=b.dataset.cat; filt.n=24; document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x===b)); renderList(); return; }
  if(e.target.id==='more'){ filt.n+=24; renderList(); return; }
  const g = e.target.closest('[data-go]');
  if(g){ filt.cat=g.dataset.go; filt.q=''; filt.n=24; location.hash='writing'; }
});
window.addEventListener('hashchange', route);
route();
</script>
