暖的風又會吹起。所有這些景象、聲音和氣味都將屬於你，威爾伯——這個美麗的世界，這些寶貴的日子……」<\/p>\n<p>\"This autumn days will shorten and grow cold. The leaves will shake loose form the trees and fall. Christmas will come, then the snowes of winter. ------ Winter will pass, the days will lengthen, the ice will melt in the pasture pond. The song sparrow will return and sing, the frogs will awake, the warm wind will blow again. All these sights and sounds and smells will be yours to enjoy, ------this lovely world, these precious days...\"<\/p>\n<p>其實這十幾天，桃園狒狒也以為自由的日子是這樣吧！<\/p>\n<p>RIP Taoyuan Baboon<\/p>\n<p>圖：春初的壽豐木瓜溪谷收成的稻田及遠方積雪奇萊（拍攝者Rayfong Chen)<\/p>"}, {"id": "f1679704457", "date": "2023-03-25", "title": "【蛋事又何奈】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【蛋事又何奈】 話說這蛋是有個超級小可愛女兒的 Jessie Huang ，前Y17攀岩場櫃台美少女，現任西班牙美豔人妻家中冰箱的蛋。幾週前因為台灣每個人四處都在找蛋，而我卻在看與", "len": 705, "body": "<p>【蛋事又何奈】<\/p>\n<p>話說這蛋是有個超級小可愛女兒的 Jessie Huang ，前Y17攀岩場櫃台美少女，現任西班牙美豔人妻家中冰箱的蛋。幾週前因為台灣每個人四處都在找蛋，而我卻在看與蛋有關的文章，才發現歐洲共同市場的蛋與台灣的蛋在管理上很不一樣。就請她幫忙從家中冰箱取一個出來照個相。<\/p>\n<p>C. P. (應該是品牌)<\/p>\n<p>27-MAR (食用期限3月27日)<\/p>\n<p>2ES43006 (2表示這是圈養雞生的蛋，ES就是西班牙的國家縮寫)<\/p>\n<p>歐盟自2004年起開始規定所有在市場上販售的蛋都要有標記，DE是德國、NL是荷蘭等等。<\/p>\n<p>我覺得標記中的第1個數字最重要，從0至3。<\/p>\n<p>代表著生蛋的母雞是否在有雞權的生活下為我們生產食物。<\/p>\n<p>0：有機雞蛋。室內每平方公尺只能養６隻母雞而且要至少有４平方公尺的室外空間供其活動；母雞所吃的食物也一樣是要有機生產，而且可以追蹤生產來源的。<\/p>\n<p>1：放養雞蛋。每隻母雞室內空間每平方公尺只能養９隻母雞，而且還必須有一個可以全天使用的室外空間。每隻母雞的最小室外空間為 4 平方米。<\/p>\n<p>2：圈養雞蛋。母雞住在有舒服墊料的室內雞舍，一樣每隻母雞室內空間每平方公尺只能養９隻母雞。而且它們不能被關在籠子裡，而是坐在穀倉的高架板，上面覆蓋著木屑。<\/p>\n<p>3：網箱養殖雞蛋，每隻母雞的最小空間是750cm2，差不多就是27*27的大小。<\/p>\n<p>在寫這篇文前，我唯一看得懂的只有食用時效27-MAR，整理資料時一直想起台灣母雞們擠在小小的籠子中渡過一生為我們下蛋，生不太出蛋之後，還要成群地汰除被做成鹽水雞，在台灣夜市來賣，就為台灣母雞感到蛋蛋的憂傷。<\/p>\n<p>好的，報告黃總經理 Jessie Huang我有在雞蛋過期前完成文章喔，不知道你們家這個蛋還在嗎？下次回台我請妳吃鹽水雞喔！<\/p>"}, {"id": "f1679535824", "date": "2023-03-23", "title": "【拒絕的勇氣需要培養】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【拒絕的勇氣需要培養】 小時候念的國中全都是男生，全校分為A+班(前)、A段班(中)及B段班(後)，這三種班我都念過，以後有機會再分享緣由。國二時我是A段班的學生，當年的班導師現是", "len": 856, "body": "<p>【拒絕的勇氣需要培養】<\/p>\n<p>小時候念的國中全都是男生，全校分為A+班(前)、A段班(中)及B段班(後)，這三種班我都念過，以後有機會再分享緣由。國二時我是A段班的學生，當年的班導師現是知名高中退休校長。<\/p>\n<p>我的成績不差，所以擔任了班導師某一門課的小老師，負責登記成績及協助老師改考卷。改完考卷登記好成績之後，就是換老師打人的時間，打手心、打屁股、拉臉頰、半蹲等等，什麼花樣都有。所以有考試的每一位同學都會怕，改考卷登記成績的人也會怕。如果搞錯成績同學會被打錯次數，到時上下裡外都不是人。<\/p>\n<p>同學們常來找小老師要求修改考卷上的改錯處，多半是看錯總是可以在老師下手修理我們之前修改，這事兒麻煩又煩心但是難以回絕！當了老師後，我才發現修改成績這事不該由小老師來做，這根本就是老師在偷懶。<\/p>\n<p>大條的事情有一天總會來的。<\/p>\n<p>一位班上大哥級的同學，根本考得很差，情況就是一定會被打到屁股黑青，他在中午午休來找我「討論」，要我的答案讓他重抄！我不願意，可是我也怕他校外找我麻煩，這是我在國中一年級Ｂ段班鬼混時學來的，人要看勢，要低頭。<\/p>\n<p>事情過了幾天，心中很不快，也很擔心，書也念不下，覺也睡不好！導師後來出現了，將我與他叫去了年級教師綜合辦公室，很大間，很多老師都在的那一種（結果現在我教師辦公室也是這樣，真的很令人不舒服）。<\/p>\n<p>老師說：他不相信那位同學可以考得好，問我是否有協助幫忙改答案？我很害怕，看了看國中同學後，他也點頭，我也就點頭承認！<\/p>\n<p>老師就爆炸了，當場，他要同學與我在辦公室當著全年級老師都在場，要我們手撐在辦公桌上屁股抬高，他惡狠狠地用半人長的藤鞭先抽了同學屁股２０大板；再輪到我也同樣氣呼呼地在眾老師的面前招呼了我的屁股２０大板。<\/p>\n<p>我當下沒哭，同學也沒哭，大哥級的同學對我很誠懇地說了一句:「對不起，以後不會了」<\/p>\n<p>。<\/p>\n<p>打這段文字時，仍可以感受到那種屁股熱熱燙燙、滿滿曲辱與不滿的心痛！但是從那一天起，我在永和外面走動不用再害怕，心中沒有不快，書也念得下了，覺也睡到爬不起來。<\/p>\n<p>但，直到今天我仍很恨我的國二導師。<\/p>\n<h1>管教權修法有感<\/h1>\n<h1>舊文重寫<\/h1>\n<h1>懂得拒絕不容易<\/h1>"}, {"id": "f1678278708", "date": "2023-03-08", "title": "三年前一位金甌女中高三學生，穿著黃色運動服在下課後坐了二…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "三年前一位金甌女中高三學生，穿著黃色運動服在下課後坐了二個小時的公車來系上看學習環境，自己問了不少問題，也看了系上的課程與設備，記得她與同學回家時，林口的校園早已全暗，當下她就堅定", "len": 294, "body": "<p>三年前一位金甌女中高三學生，穿著黃色運動服在下課後坐了二個小時的公車來系上看學習環境，自己問了不少問題，也看了系上的課程與設備，記得她與同學回家時，林口的校園早已全暗，當下她就堅定地向我說：老師我要念醒吾旅運系。<\/p>\n<p>今天學生們用著極度開心的腳步又跳又叫地跑進教室，拿著小小的手機螢幕推向老師我的眼前，大叫：老師！我錄取了！這是她心中的最佳工作。要我仔細看。<\/p>\n<p>我看了，沒看清楚，不知是老花！還是淚！<\/p>\n<h1>與無私關愛的主任與教師們一起工作是最開心的事<\/h1>\n<h1>最佳實習機會在醒吾旅運<\/h1>\n<p>✈️🚄🚞🚢🚌✈️<\/p>\n<h1>空服旅遊實習就業導向的實踐者<\/h1>\n<h1>醒吾科大旅運系<\/h1>\n<h1>醒吾科技大學旅運系<\/h1>\n<h1>醒吾科技大學<\/h1>\n<h1>醒吾旅運<\/h1>\n<h1>intern<\/h1>\n<h1>實習<\/h1>\n<h1>長榮航空<\/h1>\n<h1>evaair<\/h1>"}, {"id": "f1677467923", "date": "2023-02-27", "title": "【米老鼠學位】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【米老鼠學位】 有聽過米老鼠學位Mickey Mouse Degrees嗎？ 英國電訊報 The Telegraph有一篇報導(在留言區)，列出了英國畢業五年後平均薪資最低的十個科", "len": 416, "body": "<p>【米老鼠學位】<\/p>\n<p>有聽過米老鼠學位Mickey Mouse Degrees嗎？<\/p>\n<p>英國電訊報 The Telegraph有一篇報導(在留言區)，列出了英國畢業五年後平均薪資最低的十個科系，這幾個科系的畢業生根本賺不到合理的薪資，只因為他們讀的是米老鼠學位，也就是CP值最差的科系。<\/p>\n<p>1.攝影系<\/p>\n<p>2.翻譯系<\/p>\n<p>3.電影系<\/p>\n<p>4.美術系<\/p>\n<p>5.犯罪學系<\/p>\n<p>6.音樂系<\/p>\n<p>7.英文系<\/p>\n<p>8.活動管理系<\/p>\n<p>9.時尚系<\/p>\n<p>10.建築系<\/p>\n<p>以上科系的英國畢業生平均年薪都不到27K英鎊，也就是不到台幣百萬；英國的麥當勞大麥克一個是3.79英鎊，就是140元台幣左右。學測剛結束，很多高中生現在都在想要讀什麼科系，如何選系選校，如果改用謀生能力來想未來發展，那可能真的不少科系都是米老鼠系。<\/p>\n<p>在AI發展的奇異點上，大學學科作業、文字圖片報告、甚至是統計論文都在一瞬間可能被取代。<\/p>\n<p>附圖是我用Midjourney下指令1分鐘後產出的圖片，可惜我的ID免費試玩已用盡，正在考量要不要花每月300元台幣加入會員。<\/p>"}, {"id": "f1677296045", "date": "2023-02-25", "title": "MSC地中海郵輪環遊世界航線3/15(三)預計在09:0…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "MSC地中海郵輪環遊世界航線3/15(三)預計在09:00-18:00停靠基隆港。今天2/25詩歌號正在南太平洋向澳洲雪梨航行中，好想去基隆港拍照呀！3/15週三8-9節的郵輪課應", "len": 315, "body": "<p>MSC地中海郵輪環遊世界航線3/15(三)預計在09:00-18:00停靠基隆港。今天2/25詩歌號正在南太平洋向澳洲雪梨航行中，好想去基隆港拍照呀！3/15週三8-9節的郵輪課應該直接改去港口旅運大樓上課(老師說夢話中)<\/p>\n<p>MSC Poesia詩歌號在今年1/5由義大利的米蘭啟航進行119天環球之旅。會航經33國及53個港口。一定有人好奇要多少錢，從cruisecritic網路留言找到的資料是2人一室每人至少15750元美金，約台幣50萬元起，當然不同的艙房不一樣費用，想參加MSC環遊世界之旅嗎？<\/p>\n<p>我超級想的喔🥰<\/p>\n<p>其他有關詩歌號郵輪WIKI就在留言區，有興趣可以去點來看。<\/p>\n<p>圖片來源: MSC官網Cruisemapper連結註記在圖片區<\/p>"}, {"id": "f1676859433", "date": "2023-02-20", "title": "好書推薦《高等教育的心盲》郭位", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好書推薦《高等教育的心盲》郭位 1.進步的大學定義就是學生獲得學位時，跟他擁有的學識之間有多少落差，落差越小代表大學越進步。 2.東方社會習慣把學費壓低，結果就是大學受限於經費，購", "len": 309, "body": "<p>好書推薦《高等教育的心盲》郭位<\/p>\n<p>1.進步的大學定義就是學生獲得學位時，跟他擁有的學識之間有多少落差，落差越小代表大學越進步。<\/p>\n<p>2.東方社會習慣把學費壓低，結果就是大學受限於經費，購置設備、招聘人才不容易；要提升教育的話，更該注重經費，也該給老師更多的優待，讓他們可以教好學生，最後獲益的會是整個社會。<\/p>\n<p>3.MIT的科系，系名百年來幾乎不變，但教學內容不斷改變，然而中港台的大學科系名稱常常改變，一有新的熱潮出現就會改名。<\/p>\n<p>4.大學生其實不適合成為通才，大學需要專才教育，企業也需要專業人才，「最重要是因材施教，而不是非有教無類。」<\/p>\n<p>另記，昨天坐到非常舒服的上課桌椅，是椅板坐起來會專心，桌面寫筆記很舒暢，黑板是綠底粉筆不反光的。<\/p>"}, {"id": "f1676106462", "date": "2023-02-11", "title": "連續跑步100週表示這隻Apple Watch快2年，記…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "連續跑步100週表示這隻Apple Watch快2年，記錄一下心得： 1.AW主要拿來當看時間及跑步記錄，NIKE App可以提醒時間與記錄，但是不能算步頻，因為我是跑健康及習慣的", "len": 362, "body": "<p>連續跑步100週表示這隻Apple Watch快2年，記錄一下心得：<\/p>\n<p>1.AW主要拿來當看時間及跑步記錄，NIKE App可以提醒時間與記錄，但是不能算步頻，因為我是跑健康及習慣的，所以沒在意。<\/p>\n<p>2.跑步前同步Podcast再帶上骨傳式耳機可以同時聽好內容的廣播或專訪，這部分很推薦。<\/p>\n<p>3.AW可以當離線信用卡付費很方便，出門可以不用帶錢。<\/p>\n<p>4.AW不能當悠遊卡，所以不能借UBIKE(我試過多次都不成功，也許我是錯的)<\/p>\n<p>5.AW可以隨時看心率及健康指標。但是我睡覺不載手錶所以無法觀測睡眠情形。<\/p>\n<p>6.游泳用過幾次，防水沒問題，而且在室內游池可以記錄短程的來回，因為25公尺常常來回游到不知道。<\/p>\n<p>7.電池只能用一天就要充電，出遠門很麻煩要帶充電線，如果跑全馬是不是會沒電？今年可以找個比賽來試試看。<\/p>\n<p>8.最大缺點是一隻錶要上萬元，我覺得非常貴。<\/p>"}, {"id": "f1674437907", "date": "2023-01-23", "title": "【郵輪難民營】", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【郵輪難民營】 一艘泊在蘇格蘭的首府Glasgow克萊德河旁喬治五世國王碼頭的【志向號郵輪Ambition Cruise Ship】是烏克蘭難民臨時的家。住在其中的難民可以利用郵輪", "len": 504, "body": "<p>【郵輪難民營】<\/p>\n<p>一艘泊在蘇格蘭的首府Glasgow克萊德河旁喬治五世國王碼頭的【志向號郵輪Ambition Cruise Ship】是烏克蘭難民臨時的家。住在其中的難民可以利用郵輪原先設計的餐廳、兒童遊樂設施、商店、清潔和公共空間生活，同時蘇格蘭政府也提供部分的醫療保健和福利支持服務。<\/p>\n<p>蘇格蘭政府安排了好幾艘郵輪來安置從烏俄戰爭中逃出來的難民，因為郵輪完整的生活設施讓流離失所的小孩、婦人暫時有個可以渡過寒冬烈日的住處。現在已有志向號郵輪Ambition Cruise Ship及維多利亞號郵輪MS Victoria I提供了約二千多位難民入住。<\/p>\n<p>【只有和平才有觀光旅遊】<\/p>\n<p>蘇格蘭為烏克蘭難民提供的住房比英國任何其他地區都多，烏克蘭戰爭已經快一年，來到蘇格蘭的烏國難民已超過 22,000 人。 蘇格蘭政府2022年提供了5000 萬英鎊的基金，將未使用會館場所及徵求有意願的房屋房東，來增加可供難民的住房。<\/p>\n<p>這三年來的鎖國防疫，加上反覆的兵役制度，如果戰爭爆發台灣有臨國可以收容與逃難嗎？我覺得沒有，沒有美國綠卡、大英國協簽證、日本居留的台灣人就只有這塊土地，如何運用政治智慧降低戰爭的可能性應該是多數台灣人的期待。<\/p>\n<h1>BBC報導在留言處<\/h1>"}, {"id": "f1674180081", "date": "2023-01-20", "title": "酒館關門我就離開", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "酒館關門我就離開 英國傳奇首相邱吉爾帶領英國挺過二次世界大戰，他對政局與國家的想象與期待應是鞠躬盡瘁，誠如他在選戰落敗時，他向新聞界說了句耐人尋味的名言：酒館關門我就離開 Mr. ", "len": 434, "body": "<p>酒館關門我就離開<\/p>\n<p>英國傳奇首相邱吉爾帶領英國挺過二次世界大戰，他對政局與國家的想象與期待應是鞠躬盡瘁，誠如他在選戰落敗時，他向新聞界說了句耐人尋味的名言：酒館關門我就離開 Mr. Editor, I leave when the pub closes#。有人說這是政治人物優雅退休的身影，也有人提到這是退休老人的離席醉語。<\/p>\n<p>這幾天看到了連前院長兼副總統出書#及蘇院長總辭，比對之下非常有感，以一位曾在KMT打工多年，甚曾以為黨為國工作為榮的過往小兵，看到了一位田僑老人賣光黨產求勝不成多年之後出書，以為酒館仍為他開著，那賴在門前不甘亂語的身影看了令人發笑。<\/p>\n<p>Chruchill, The Economist, 1 February 1965, quoted in Lang- worth, ed., Churchill By Himself, 528.<\/p>\n<p>連戰，連戰回憶錄，17 January 2023，天下文化。<\/p>\n<p>photo source: Gunmaker, Traditional English pub in Marylebone.<\/p>"}, {"id": "f1673667676", "date": "2023-01-14", "title": "依據台灣的人口統計預估2040年(民國129年)#如圖，…", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "依據台灣的人口統計預估2040年(民國129年)#如圖，將會如同現今2021年的日本，成為一個老國(Elder Nation)，定義是全國有三成以上是超過65歲的國民。 成因有三：", "len": 349, "body": "<p>依據台灣的人口統計預估2040年(民國129年)#如圖，將會如同現今2021年的日本，成為一個老國(Elder Nation)，定義是全國有三成以上是超過65歲的國民。<\/p>\n<p>成因有三：#活太老、#生太少、#拒移民<\/p>\n<p>對日本來說已是不可逆的結果，但先進的日本社會卻也漸漸地找出解方，甚至極端老齡化反而激發各方面的創新發展：<\/p>\n<p>1.讓退休族重回工作，老年人要成為社會的貢獻者而不是接受者。<\/p>\n<p>2.政府政策及教育重點在照護產業，激勵更多人學習自我照顧能力。<\/p>\n<p>3.城市規劃著重行走及大眾運輸，能走的人越多，健保支出就越少。<\/p>\n<p>4.改善整合型社區相互照應的機制，利用小型社區整合居住、購物及照護設計讓居民彼此有照應的方式。<\/p>\n<p>5.療養院、保險公司、生命園區橫向整合中。<\/p>\n<p>6.健康科技應用設計是各先進產業研發重點。<\/p>\n<h1>國家地理雜誌的連結放在留言區<\/h1>"}, {"id": "f1673403905", "date": "2023-01-11", "title": "婚宴場地很重要a", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "婚宴場地很重要a 突然間結婚流水席或是星級酒店成了話題。 我先站在流水席那邊，因為我吃過最棒的婚宴就是在台南學生結婚時在民眾活動中心辦的流水席；澎湃美味鮮美好吃、整場主持氣氛佳、回", "len": 494, "body": "<p>婚宴場地很重要a<\/p>\n<p>突然間結婚流水席或是星級酒店成了話題。<\/p>\n<p>我先站在流水席那邊，因為我吃過最棒的婚宴就是在台南學生結婚時在民眾活動中心辦的流水席；澎湃美味鮮美好吃、整場主持氣氛佳、回家還帶上滿滿吃不完的雞湯，紅蟳油飯及水果飲料大包小包回台北路上再回味，500公里車程完全值得。<\/p>\n<p>但我也想支持一下好餐廳，曾吃過最好吃的婚宴菜色，是研究所同學辦在台北植物園旁的海鮮餐廳，從頭到尾絕無冷場，盤盤淨空酒足飯飽，回味至今。<\/p>\n<p>至於星級酒店為何獲得前準新娘的支持，原因無他，因為整場婚宴就是她的展示場，全場二萬起跳的菜新娘預計也吃沒兩口，為了穿上最美最夢幻的衣飾髮妝都已經餓了好幾個月，那計較菜色，重要的是那個可能唯一的婚禮，萬事都得完美呈現，就更計較舞台上不可能有比她美的人，包括表演者都不行，只有五星裝潢粉紅泡泡才能搭上星級新娘。<\/p>\n<p>最後，回想我們的婚宴竟然辦在中正紀念堂正前方的國家圖書館，連上述的場地都歸類不了。或許很多師長好友來祝賀時，當年彼此話題仍是：<\/p>\n<p>a... 國家圖書館可以當婚宴場地？<\/p>\n<p>我們幾乎每週都會開車經過中山南路，仍時常懷疑我們夫妻倆當時在想什麼🤣<\/p>\n<p>圖片來源：台北市電腦商業同業公會 Edtech.tw<\/p>"}, {"id": "f1673050462", "date": "2023-01-07", "title": "放假前考試後與學生聊聊，班上大二學生再一年就要面對企業實…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "放假前考試後與學生聊聊，班上大二學生再一年就要面對企業實習，眼見大三學長姊一直在宣布錄取單位，感覺出來大家都有急迫感。 師：你為什麼一直在打工？ 生：老師我需要錢！ 師：那你每天下", "len": 475, "body": "<p>放假前考試後與學生聊聊，班上大二學生再一年就要面對企業實習，眼見大三學長姊一直在宣布錄取單位，感覺出來大家都有急迫感。<\/p>\n<p>師：你為什麼一直在打工？<\/p>\n<p>生：老師我需要錢！<\/p>\n<p>師：那你每天下課後、周休假日都去麥當勞打工一個月大約可以賺多少？<\/p>\n<p>生：差不多一萬元左右，要看花下去的時間。<\/p>\n<p>師：麥當勞很忙，那你不就沒時間準備各類上課自我進步的內容了！<\/p>\n<p>生：好像是，但是仍很想好好考證照，學有用的工具。<\/p>\n<p>師：那就要時間規劃，善用學校資源，要來上課跟進度。<\/p>\n<p>生：老師那我有機會像學姊學長一樣到 #星宇航空  #長榮航空 #立榮航空 #雄獅旅遊 #台灣高鐵 去實習嗎？<\/p>\n<p>師：當然，但是機會是給準備好的人，學長姊實習時就如同正職人員，也有企業開28K給實習生，比你做到快沒命的10K好很多，又有正常休假甚至是周休二日，畢業後更有機會轉正職員工。<\/p>\n<p>生：謝謝老師，我會好好想想的。<\/p>\n<p>師：記得不要只是想喔！要規劃要行動！老師一直都在。<\/p>\n<p>✈️🚄🚞🚢🚌✈️<\/p>\n<h1>空服旅遊實習就業導向的實踐者<\/h1>\n<h1>醒吾科大旅運系<\/h1>\n<h1>醒吾科技大學旅運系<\/h1>\n<h1>醒吾科技大學<\/h1>\n<h1>醒吾旅運<\/h1>\n<h1>intern<\/h1>\n<h1>企業最愛大學全國排名第七<\/h1>\n<h1>沒上國立大學沒關係<\/h1>\n<h1>加入醒吾旅運系讓你與頂大生當同事<\/h1>"}, {"id": "f1671950085", "date": "2022-12-25", "title": "【民國159年時台灣有一半的人口是老人】4.4倍>>1.…", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【民國159年時台灣有一半的人口是老人】4.4倍>>1.1倍 【民國159年時台灣賺錢的人比花錢的人少】扶養比 40.2 >>109.1 【民國159年時現在看到貼文的人應該都是老", "len": 649, "body": "<p>【民國159年時台灣有一半的人口是老人】4.4倍&gt;&gt;1.1倍<\/p>\n<p>【民國159年時台灣賺錢的人比花錢的人少】扶養比 40.2 &gt;&gt;109.1<\/p>\n<p>【民國159年時現在看到貼文的人應該都是老人】18+<\/p>\n<p>國發會有個人口預測的圖示系統，左圖是現在的人口金字塔圖，右圖是48年後的台灣，已成為倒人口金字塔；而且因為醫療佳、不婚、卒婚及少子化，未來會有多數家戶都是獨居者，家庭生活將成為少數。<\/p>\n<p>民國159年時你幾歲？<\/p>\n<p>In 2070, half of Taiwan's population will be old people and there will be fewer people earning money than spending.<\/p>\n<p>The National Development Council has a graphical system for population forecasting. The blue diagram is the current The diagram in blue is the current population pyramid, and the diagram in red is Taiwan 48 years later. It has become an inverted population pyramid; and because of health care, non-marriage and declining birth rate, most households will be homealone, family life will become a minority.<\/p>\n<p>How old were you in 2070?<\/p>"}, {"id": "f1670723243", "date": "2022-12-11", "title": "【送C羅、葡萄牙回家】", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【送C羅、葡萄牙回家】 葡萄牙大帥哥 #C羅 的老家馬德拉島 #Madeira 其實離摩洛哥很近 葡萄牙的大帥哥足球明星C羅在2022世界盃沒能如願在退休前好好地表現出他的身價！報", "len": 478, "body": "<p>【送C羅、葡萄牙回家】<\/p>\n<p>葡萄牙大帥哥 #C羅 的老家馬德拉島 #Madeira 其實離摩洛哥很近<\/p>\n<p>葡萄牙的大帥哥足球明星C羅在2022世界盃沒能如願在退休前好好地表現出他的身價！報紙標題寫著：【送C羅、葡萄牙回家】。<\/p>\n<p>其實C羅的老家在位於非洲摩洛哥西方的大西洋上，是個如同人間天堂的馬德拉島 #Madeira，是葡萄牙的二個自治區之一，在十五世紀時葡萄牙就開始統治該地。島上的最大港口也是首府豐沙爾 #Funchal 港就是帥哥C羅的出生地。如果有參加地中海及大西洋的郵輪之旅，多數的郵輪都會安排這位如同人間天堂的美麗港口，物價及景色都非常親民宜人。<\/p>\n<p>郵輪的下一站就到北非花園城市 #摩洛哥 卡薩布蘭卡一遊，看看北非諜影中最美笑容的 #英格麗褒曼 曾留下身影的真實場景。<\/p>\n<p>摩洛哥是非洲的君主國，現在的王國世襲傳位從17世紀延續至今，在西方擴張時期曾為法國及西班牙宣告為附屬，但仍保有主權、文化、宗教上的傳承。摩洛哥王國的文化融合了阿拉伯、摩爾、西歐等多元文化，前國王哈桑二世曾形容：「摩洛哥是一棵根植在非洲，但葉子呼吸著歐洲空氣的大樹」<\/p>\n<p>留言處是有停靠上述港口的郵輪航程🛳，超想安排去看看🌅<\/p>"}, {"id": "f1667623974", "date": "2022-11-05", "title": "【少子化校園空間利用-韓國東亞日報專文報導】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【少子化校園空間利用-韓國東亞日報專文報導】 根據韓國教育部的數據，從 1982 年到2020年，共有 3,896 所公立學校關閉。而日本學校停課問題要嚴重得多。根據韓國教育振興院", "len": 605, "body": "<p>【少子化校園空間利用-韓國東亞日報專文報導】<\/p>\n<p>根據韓國教育部的數據，從 1982 年到2020年，共有 3,896 所公立學校關閉。而日本學校停課問題要嚴重得多。根據韓國教育振興院2017年的報告，2002年至2015年間，日本有6811所小學、初中和高中關閉，其中87%被用作教育設施或公共體育設施而沒有出售。<\/p>\n<p>如何活化學校呢？韓國教育單位將所屬關閉的學校2558所及省教育廳所屬學校1338所進行外包。關閉學校被用作增加居民收入的設施，例如露營地和體驗中心，或用作教育、福利和文化設施。<\/p>\n<p>日本校園再利用的獨特實驗也繼續進行中，2014年關閉的日本千葉縣畑田小學，由於附近有火車站和高速公路交叉口，被改造成休息區。住宿設施、畫廊和餐廳已成為前往周邊地區旅遊的必遊之地。此外，根據地區特點，封閉式學校被用於各種目的，例如公共住房設施或兒童發展支持中心。<\/p>\n<p>關閉的學校要如何活化很難，報導中指出專家學者調查：如果在使用關閉學校時排斥當地的居民就很難成功。舉例來說江原道研究所區域發展部部長朱容旭說：“在山區與當地居民見面時，老年人通常選擇公共浴室作為最想要的設施，而年輕人則經常選擇文青書店。<\/p>\n<p>對呀！我也覺得公共浴室很棒，文青書店或文創小物就不必了。<\/p>\n<p>以下是報導原文：關閉學校裡的生態公園義城山村的例子<\/p>\n<p>(留言處有韓文報導，謝謝Google翻譯讓我找到好多有趣的報導，韓文看得懂的學生或好友有誤解請指正)。<\/p>\n<h1>附圖2012小狗子花蓮明義國小<\/h1>"}, {"id": "f1667108154", "date": "2022-10-30", "title": "好多年前念國一時，我只有143-150公分高左右，每天早…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好多年前念國一時，我只有143-150公分高左右，每天早上學校都要開朝會，當時一個班有50幾人，一個年級有37班，全校不算大的操場要在短時間擠進5-6千人，所以每天早上同學們一班班", "len": 390, "body": "<p>好多年前念國一時，我只有143-150公分高左右，每天早上學校都要開朝會，當時一個班有50幾人，一個年級有37班，全校不算大的操場要在短時間擠進5-6千人，所以每天早上同學們一班班地都要往操場移動，途經幾個很窄的走廊。國中生都是一邊推一邊擠地往操場出口爭道，人真的很多又難受，尤其像我這樣的小個子的國一生。<\/p>\n<p>結果就有一天，大家在擠來擠去的同時，我被擠離地騰空了，隨著人群移動，又突然鬆了個縫，結果我就整個人就跌坐被壓在下面，當時的時間感好像暫停了，黑壓壓一片，也不知道被多少同學踩踏推擠過，突然間有位同學很用力地將我整個人一把拉起，又推又拉地擠出可怕的黑黑走廊，直到看到操場的光線，我才有知覺。<\/p>\n<p>這是我第二次差點小命不保的經驗，有沒有後遺症我不知道，只是看到新聞，就隱約地記起那天那種黑暗、無助、沒有時間感的可怕感受。<\/p>\n<p>很心驚！<\/p>\n<p>願死者平靜傷者平安！<\/p>\n<p>圖片來源：1987年永和國中畢業紀念冊<\/p>"}, {"id": "f1665739570", "date": "2022-10-14", "title": "代管退場學校學生學籍資料庫", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "代管退場學校學生學籍資料庫 這世界上唯一不變的就是回憶，所以把握當下努力向前，回頭看時都是感謝當時努力與認真的自己。學校不在了，但是學子們都是社會的中堅，這樣學校的意義就永存了。 ", "len": 309, "body": "<h1>代管退場學校學生學籍資料庫<\/h1>\n<p>這世界上唯一不變的就是回憶，所以把握當下努力向前，回頭看時都是感謝當時努力與認真的自己。學校不在了，但是學子們都是社會的中堅，這樣學校的意義就永存了。<\/p>\n<h1>成績單及畢業證書補發<\/h1>\n<p>花蓮臺灣觀光學院不少導師班同學會問：學校不在了畢業證書如何補發，成績單可以補發嗎？<\/p>\n<p>當然可以，之前有熱心留校的老師在幫忙，現在有正式的管道可以申請，花蓮台灣觀光學院數十年來所有學籍資料因為有老師盡心盡力地整理完成（留校老師功德無量），在2022/9/29全數移交至國立雲林科技大學，現在申請成績單及畢業證書補發可以找有專門負責單位。<\/p>\n<p>雲科大聯絡電話：05-5342601分機2203或5373<\/p>\n<p>網路申請連結在留言處喔！<\/p>\n<h1>轉發不用問<\/h1>"}, {"id": "f1665391599", "date": "2022-10-10", "title": "國慶日不想看遊行，但是上網找日本京都橘大學學系發展與安排…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "國慶日不想看遊行，但是上網找日本京都橘大學學系發展與安排，同時對照國科會的學術分科。簡言之，大學以研究為主，因此大學系所安排就明示什麼是科學，國科會的分類也差不多，同樣規劃了類似的", "len": 4325, "body": "<p>國慶日不想看遊行，但是上網找日本京都橘大學學系發展與安排，同時對照國科會的學術分科。簡言之，大學以研究為主，因此大學系所安排就明示什麼是科學，國科會的分類也差不多，同樣規劃了類似的學門。<\/p>\n<p>以下是台灣國科會包含主分類及次分類計有698學類學門。很長很多但不失標準值得參考。留言處是京都橘大學的學系網頁，再對照台灣高教科系學系內容之後，決定先來去操場跑3000公尺！<\/p>\n<p>強國先強身！不要想太多！<\/p>\n<h1>小黑蚊學門<\/h1>\n<p><strong><strong><strong><strong><strong><strong><strong>以下698學門<\/strong><\/strong><\/strong><\/strong><\/strong><\/strong><\/strong>**<\/p>\n<p>學門代碼<\/p>\n<p>文學一(中國文學、台灣文學、客家文學、原住民文 le": "假日閱讀：日本如何贏得交通戰爭？(文章在留言處)", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "假日閱讀：日本如何贏得交通戰爭？(文章在留言處) 日本平均每年每十萬人因為路殺而死的行人是2.24人；而美國是12.7人。美國在40年前走路上學的小朋友佔4成1，而現在只佔13%。", "len": 405, "body": "<p>假日閱讀：日本如何贏得交通戰爭？(文章在留言處)<\/p>\n<p>日本平均每年每十萬人因為路殺而死的行人是2.24人；而美國是12.7人。美國在40年前走路上學的小朋友佔4成1，而現在只佔13%。<\/p>\n<p>文中討論了日本如何設計出合適於行人生活的城市環境，在這個去不了日本觀光的時刻，大家可以想想如何將台灣的環境重塑，成為尊重行人與路人的美好生活環境。<\/p>\n<p>附上台灣2021年交通事故死亡人數為2962人，依人數多寡次序為高雄市(330人)、台南市(293人)、台中市(280人)、桃園市(264人)、新北市(264人)、台北市(130人)。有明顯的地理趨勢，為什麼呢？<\/p>\n<p>個人非常喜歡走路，任何地點能走就走，能騎UBIKE就騎，小狗子在國小國中時都是自己走路去上下學，我們的確會擔心，但是仍得讓他學著如何在台灣可怕的交通環境中生存。<\/p>\n<p>台灣各地根本拿不出什麼好環境供行人平安順利地走路。<\/p>\n<p>台灣人行道有三害：摩托車、野狗、變電箱。<\/p>\n<p>但最害：路邊沒有人行道。<\/p>"}, {"id": "f1660400096", "date": "2022-08-13", "title": "今天的英聽內容是談到了工作，工作對你重要嗎?", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "今天的英聽內容是談到了工作，工作對你重要嗎? 對我很重要，工作讓我有機會維持家計成就自我，尤其是我的工作是旅遊產業及教學相關，在此產業停擺的兩年半間，才發現國家政策的力量如此巨大，", "len": 482, "body": "<p>今天的英聽內容是談到了工作，工作對你重要嗎?<\/p>\n<p>對我很重要，工作讓我有機會維持家計成就自我，尤其是我的工作是旅遊產業及教學相關，在此產業停擺的兩年半間，才發現國家政策的力量如此巨大，居住其中的人們只能接受安排。<\/p>\n<p>疫情以來我們的政府關起島來自己玩自己，結果也要乖乖打針載口罩的台灣人一起關島。我的學生同事及曾經共事的觀光界好友們都只好另尋他途，找活下去的方式。直至今日政府忙著安排年底選舉減少選情變化，無視於亞洲各國均已逐漸開放觀光，用一個每日14點的記者會持續宣布關島封地。<\/p>\n<p>對比各國積極努力地規劃未來疫後旅遊的巨大變化。在全球疫情減低之時，如果再不開放國際旅遊市場，觀光旅遊的產業及對此行有熱情的世代都將無所適從。<\/p>\n<p>以新加坡樟宜機場為例，除了早早開放國門恢復各項商業活動之外，因疫情將第五航廈計劃暫緩的兩年期間，全面檢討了T5的設計，讓它更模塊化和靈活，未來得以應因疫情管理的新式人流管制航站，並且開始增加人力的訓練與培訓。對比台灣當然期待我們的第三航廈工程仍依計畫進行中可以如期完工，年輕學子與工作者都眼巴巴地期待未來有著與自身所學相關，且具發展性的工作機會在等待他們。<\/p>"}, {"id": "f1659493816", "date": "2022-08-03", "title": "我在1995.9.20在嘉義大林陸軍二兵入伍，1997.…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "我在1995.9.20在嘉義大林陸軍二兵入伍，1997.7.23陸軍上兵退伍。台海飛彈危機期間，新兵入伍就是操課，操到想簽3年半的志願役！ 大林新訓結束之後就是分發抽籤，沒背景的人", "len": 611, "body": "<p>我在1995.9.20在嘉義大林陸軍二兵入伍，1997.7.23陸軍上兵退伍。台海飛彈危機期間，新兵入伍就是操課，操到想簽3年半的志願役！<\/p>\n<p>大林新訓結束之後就是分發抽籤，沒背景的人就要靠手氣，當年睡隔壁床的同梯抽到北竿高登指揮部時(黑白圖_2_Zone6)當場臉就垮了。不久後還收到他從北高指寄來73群的信，字字血淚。<\/p>\n<p>三張圖比對一下，從明天開始也許是歷史的拐點，也或許就如同27年前的台海危機靜靜地就過了；我們在部隊內不知道外面發生了什麼事，家人有沒有擔心？有想過會上戰場嗎？<\/p>\n<p>其實當下就穿著草綠軍服拿著槍當大頭兵操課，看著圍牆外的自由數饅頭，我們有選擇的權利嗎？<\/p>\n<p>昨天晚上車停在立法院旁車格，補習班下課去取車時四周都已經圍起來禁停了，一路上與孩子討論中美台的關係及生於此長於此的台灣人要如何在島上自處與發展，回家後孩子在IG發了影片限動，他也才發現除了現在的高中同學之外，沒人表讚。<\/p>\n<p>期待和平，可以彎腰但不低頭。<\/p>\n<p>Sources:<\/p>\n<p>彩圖2022 <a href=\"http://big5.news.cn/gate/big5/www.news.cn/2022-08/02/c_1128885591.htm\">http://big5.news.cn/gate/big5/www.news.cn/2022-08/02/c_1128885591.htm<\/a><\/p>\n<p>黑白圖_1<\/p>\n<p><a href=\"https://api.semanticscholar.org/CorpusID:158485481\">https://api.semanticscholar.org/CorpusID:158485481<\/a><\/p>\n<p>黑白圖_2<\/p>\n<p><a href=\"https://asiapacific.anu.edu.au/mapsonline/base-maps/taiwan-strait\">https://asiapacific.anu.edu.au/mapsonline/base-maps/taiwan-strait<\/a><\/p>"}, {"id": "f1658288829", "date": "2022-07-20", "title": "今日最美： 花花花 妳上報了，快點分享給家人好友看", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "今日最美： 花花花 妳上報了，快點分享給家人好友看 過去幾年花花花是康柏楷老師在醒吾地創專班學生，我只是時而參與部分課程的插花老師（不是花藝老師喔），時而協助團隊的動腦及遊程規劃課", "len": 426, "body": "<p>今日最美： 花花花 妳上報了，快點分享給家人好友看<\/p>\n<p>過去幾年花花花是康柏楷老師在醒吾地創專班學生，我只是時而參與部分課程的插花老師（不是花藝老師喔），時而協助團隊的動腦及遊程規劃課程的推導。真心覺得這五年來的專班規劃真的好像完成了些什麼階段性的事！好像看到一點點技職教育跨域發展的火花！<\/p>\n<p>每次參與這個班級的課程交流時，總覺得教學內容好似沒有完成，教學設計可以再多點什麼少點什麼，讓學生與教學者交流思考，也因為醒吾科大有如此多元跨域的教育環境，讓我更認識每一位學生的可能性。<\/p>\n<p>江老師 花花花2021從醒吾畢業，2022年在林口的社區中開始看到她在舊街、在社區基地、在校園內開始成為一位整合者，用力地將她的小小努力發出最美好的光；連家人朋友在FB林口大家庭看到樂林協會貼文(如附圖)時，都說這個課程很棒很用心。<\/p>\n<p>請大家給江老師鼓鼓掌，並期待她持續堅持理想，也說一下康柏楷真心佩服您。<\/p>\n<p>相關新聞報導（在留言第一條）：<\/p>\n<p>醒吾校友江適伃跨越學習障礙 發揮繪畫天分協助孩童五育永續發展<\/p>"}, {"id": "f1658191582", "date": "2022-07-19", "title": "天太熱，天未亮就醒突然想起年幼時的回憶，隨手記下。", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "天太熱，天未亮就醒突然想起年幼時的回憶，隨手記下。 幼時住在台中興大五村裡，那是一座有棵與樓同高的玉蘭花樹的二層樓平房職工宿舍，來台北板橋念幼稚園之前，那棟平房是我的家。每天晚上我", "len": 349, "body": "<p>天太熱，天未亮就醒突然想起年幼時的回憶，隨手記下。<\/p>\n<p>幼時住在台中興大五村裡，那是一座有棵與樓同高的玉蘭花樹的二層樓平房職工宿舍，來台北板橋念幼稚園之前，那棟平房是我的家。每天晚上我都是睡在阿公阿嬤中間，床是那種有一條條會夾人皮膚及細毛的板床席，睡覺時身體要直直平平地躺著，用屁股及背來睡覺，其他的姿勢都有幾個身體的點會痛，有點難睡。<\/p>\n<p>台中夏夜沒有涼如水，記憶中木板床底的櫃子上好似有放個電風扇，但是都沒插電也沒開，年幼的我只覺得那個扇頁轉起來很可怕，因為小時候被電風扇打到流血也不是一次兩次而已。壓根沒想過要開來吹涼。<\/p>\n<p>所以每晚，與阿公阿嬤同眠的我會聽著阿公搖扇子的聲音，以及有時搖到我身上有時沒有的微風，和著身上香香涼涼的痱子粉味道，及窗外時有時無的花香味迷迷糊糊地入睡。<\/p>\n<p>回想起來好像夏天也沒那麼熱了。<\/p>"}, {"id": "f1657930649", "date": "2022-07-16", "title": "多年前在花蓮志學街上曾看到一位學生穿著拖鞋，從街上的宿舍…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "多年前在花蓮志學街上曾看到一位學生穿著拖鞋，從街上的宿舍走出來，騎上摩托車油門一開，腳都仍未放上前方踏板就停在50公尺外的早餐店。 我是騎腳踏車去買早餐的，不久看著學生買好吃的再度", "len": 932, "body": "<p>多年前在花蓮志學街上曾看到一位學生穿著拖鞋，從街上的宿舍走出來，騎上摩托車油門一開，腳都仍未放上前方踏板就停在50公尺外的早餐店。<\/p>\n<p>我是騎腳踏車去買早餐的，不久看著學生買好吃的再度跨坐上他的座騎，油門一催50公尺後又回到宿舍上樓去。<\/p>\n<p>志學街上有完善的人行道區，雙線道的街道兩側停滿了學生與居民的摩托車，而台灣太多人因為習慣了機動二輪，就忘記了自己仍有二條腿可以步行。<\/p>\n<p>同樣的事，這前幾天去早餐店也看到一位大叔四肢健全，用摩托車騎數十公尺出社區拿早餐再回社區。<\/p>\n<p>Many years ago, Hualien, I saw a student wearing slippers, walking out of the dormitory on the street, riding a motorcycle, his feet were still not on the front pedal, and than he stopped at breakfast restaurant at 50 meters away.<\/p>\n<p>At that time I went for breakfast on bicycle, and soon I watched the student with food and straddle his ride again. Such distance with the accelerator in seconds, he went back to the dormitory and went upstairs.<\/p>\n<p>Taiwan has a well sidewalk or pedestrian arcade along the narrow streets, but where are full of motorcycles of students and residents. However, Taiwanese are used to two wheels, forgetting that they still have feet to walk.<\/p>\n<p>Recently, I went to the breakfast shop a few days ago and saw an young man, riding a motorcycle dozens of meters out of the community to get food and then back to his house in few seconds.<\/p>\n<p>God.<\/p>"}, {"id": "f1656373637", "date": "2022-06-28", "title": "【走過20世紀的我們將要體認：21世紀將有巨大的轉變】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【走過20世紀的我們將要體認：21世紀將有巨大的轉變】 在未來的百年內，發展中國家的人口將大量取代已發展國家，除非有非常良好的政治制度規劃與落實，否則不均衡的經濟發展將成為人類爭奪", "len": 606, "body": "<p>【走過20世紀的我們將要體認：21世紀將有巨大的轉變】<\/p>\n<p>在未來的百年內，發展中國家的人口將大量取代已發展國家，除非有非常良好的政治制度規劃與落實，否則不均衡的經濟發展將成為人類爭奪資源，甚至是相互戰爭的最大隱憂。回頭看人類文明，人口與文化思想的發展沒有很大的關係；少子化議題只出現在文明國，但是文明國再努力生也生不過發展中國家，想走回頭路很難。<\/p>\n<p>預言一下，未來三十年想要穩定生活不受戰爭所苦的可能方式：<\/p>\n<p>從政治面來看，移居生活至美加、中國，或是日本、台灣、澳洲、紐西蘭等島國都是好地方，因為強大軍事、天然地理邊界及穩定的國家體制是防止開發中大量出現的人口爭奪有限資源的重要依靠。歐洲如果歐盟北約成功整合，就有機會，若無就會回到廿世紀初的混亂，因為阿拉伯人及非洲人會出現在邊界，映照過往千年來的歐洲歷史難以避免。<\/p>\n<p>從經濟面來看，因為科技發展快速，資源分配下的大型企業將主導生活水平，生活所有面向將完全受到科技資源的影響，甚至是會在資訊的環境中發展出另一類的族群與生活方式，跨越國界與種族成為另一類的共同依存的群類，我暫時稱之為網族(Weberian)。<\/p>\n<p>網族已經在現有的社會中依存，例如由動漫Cosplay而成的族群，無分民族都由想象轉為現實，存在於社會之中，特別是在網路上的活躍度遠高過去在現實世界的互動。若此，人口宗教種族的對立將與這些人無關，而且族群中將呈現出完全獨立的社會階層及生活模式(待續)。<\/p>\n<h1>Weberian網族<\/h1>"}, {"id": "f1656399346", "date": "2022-06-28", "title": "我的跑步啟蒙師-吳錦雲老師 RIP", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "我的跑步啟蒙師-吳錦雲老師 RIP 直到今日大學體育選課好像一直都很熱門，大家都想盡辦法別選到不愛的運動項目。真心想不起來當年為什麼會去選修了吳錦雲老師的慢跑課，印象中好像沒有同班", "len": 446, "body": "<p>我的跑步啟蒙師-吳錦雲老師 RIP<\/p>\n<p>直到今日大學體育選課好像一直都很熱門，大家都想盡辦法別選到不愛的運動項目。真心想不起來當年為什麼會去選修了吳錦雲老師的慢跑課，印象中好像沒有同班同學與我選同一節；雖然我只是成千上萬吳老師體育選修課的無名學生，但是從小到大上過的體育課那麼多，我卻只記得吳錦雲老師的課，而且至今受用無窮。<\/p>\n<p>吳錦雲老師的課非常充實，上課時中氣十足，印象中光課前的暖身及折返跑她都親身下場，我們也要跟上，第一節課仍未開始慢跑就已經讓人腿軟手發抖，第二節還要跑貴子路上的操場10圈後，再收操下課。體力不佳的同學真的是放盡力氣也沒辦法讓吳老師滿意下課，期末還要跑校園最外圍三圈當成期末考。<\/p>\n<p>當時知道吳老師年輕是運動健將，但是真的沒想到修她的課時，大學生非體育專科生也要這樣操課。今天看到報導才知道吳錦雲老師當年是三鐵皇后，難怪當時老師都是一邊搖頭一邊陪我們練習，與她的體能相較我們這些沒用的大學生真的是飼料雞。<\/p>\n<p>暑假找時間回學校去跑三圈，感念您當年的指導與教誨！<\/p>\n<p>敬愛的吳老師一路好走 R.I.P.<\/p>"}, {"id": "f1656317710", "date": "2022-06-27", "title": "【2022暑假課外閱讀書目】", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【2022暑假課外閱讀書目】 現代人因為各類螢幕產品都不看實體書，可是看書仍有很多的好處，可以讓人沉靜、想象、反思甚至是腦內創新；所以學生考完期末考最後一刻可以囉嗦時，我仍一直提醒", "len": 750, "body": "<p>【2022暑假課外閱讀書目】<\/p>\n<p>現代人因為各類螢幕產品都不看實體書，可是看書仍有很多的好處，可以讓人沉靜、想象、反思甚至是腦內創新；所以學生考完期末考最後一刻可以囉嗦時，我仍一直提醒學生：好好利用暑假四處走走看看，閱讀學習養成習慣，打工賺錢難免，提升能力趁現在。<\/p>\n<p>以下提供阿狗學校的暑假課外閱讀書目，大家一起來閱讀吧！看不完29本，也找1本好好看完，等大家分享心得喔！<\/p>\n<p>1.奈莉・沙克絲（Nelly Sachs）《蝴蝶的重量》，寶瓶文化<\/p>\n<p>2.吳岱穎，《造夢者》，麥田<\/p>\n<p>3.朱國珍，《Dear 小壯丁：手牽手一起走》，印刻<\/p>\n<p>4.宇文正，《我們的歌》，有鹿文化<\/p>\n<p>5.王盛弘，《雪佛》，馬可孛羅<\/p>\n<p>6.賴香吟，《白色畫像》，印刻<\/p>\n<p>7.蔡素芬，《藍屋子》，聯經<\/p>\n<p>8.陳德政，《神在的地方》，新經典文化<\/p>\n<p>9.陳浪，《漫長的紀念》，尖端<\/p>\n<p>10.沈信宏，《成為男人的方法》，寶瓶文化<\/p>\n<p>11.方子齊，《還不是我的時代》，有鹿文化<\/p>\n<p>12.孫梓評編，《九歌 110 年散文選》，九歌<\/p>\n<p>13.胡晴舫編，《我台北，我街道》，木馬文化<\/p>\n<p>14.林懷民，《激流與倒影》，時報<\/p>\n<p>15.畢柳鶯，《斷食善終》，麥田<\/p>\n<p>16.陳義芝，《為了下一次的重逢》，九歌<\/p>\n<p>17.范俊奇，《鏤空與浮雕 II》，有鹿文化<\/p>\n<p>18.黃宗慧、黃宗潔，《就算牠沒有臉》，麥田<\/p>\n<p>19.楊渡，《未燒書》，聯經<\/p>\n<p>20.劉子超，《失落的衛星》，新經典文化<\/p>\n<p>21.陳育萱，《那些狂烈的安靜》，大塊文化<\/p>\n<p>22.陳思宏，《樓上的好人》，鏡文學<\/p>\n<p>23.楊富閔，《合境平安》，皇冠<\/p>\n<p>24.朱西甯、劉慕沙，《非情書》，印刻<\/p>\n<p>25.羅智成，《荒涼糖果店》，聯合文學<\/p>\n<p>26.郭強生，《如果文學很簡單，我們也不用這麼辛苦》，木馬文化<\/p>\n<p>27.林楷倫，《偽魚販指南》，寶瓶文化<\/p>\n<p>28.陳柏煜，《科學家》，時報<\/p>\n<p>29.楊佳嫻編，《當我們重返書桌》，蔚藍文化<\/p>\n<p>＃寶貝班小狗子<\/p>"}, {"id": "f1656247752", "date": "2022-06-26", "title": "好聽分享-所需時間49mins", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好聽分享-所需時間49mins 至今三十餘年的職場生涯中，從做電子工廠暑期作業員、兼職的保齡球館服務員、旅行社送簽小弟、電訪員、博客來書評寫手、考用書編著作者；到正職的市場調查員、", "len": 529, "body": "<p>好聽分享-所需時間49mins<\/p>\n<p>至今三十餘年的職場生涯中，從做電子工廠暑期作業員、兼職的保齡球館服務員、旅行社送簽小弟、電訪員、博客來書評寫手、考用書編著作者；到正職的市場調查員、通信文書兵、上市櫃產業分析師、網路行銷專案、休閒場館經管、會議場地租借業務、行銷活動管理、資訊系統業務推廣、旅行業經理人、國際領隊、NGO秘書長及技職私校教師等，拉拉雜雜地回想起來，工作期間最有危機感的職務就是私校教師一職！<\/p>\n<p>也因此，每當學期末學生畢業之時，除了協助學生進入職場之外，同步地也考量自身未來，讓危機感化為動力與助力，檢視自己的努力與方向，確認企業單位與自己之間的關係，當然也對照自己的期待與夢想離目標有多遠，與自我危機感來個真實的碰撞。<\/p>\n<p>今天要推薦大家用不同的角度與我一起面對思考未來，這位謝博士畢業於美國名校馬里蘭大學的老師在退休後投入服務餐飲業，觀察社會中對中高年級角色轉換的各種可能性，對謝博士而言因為前有公職退休金是他的重大本錢，但是過早失去職場職位的情境，著實也是讓同為深感危機的自己，有機會可以好好思考如何因應可能而來的變化。<\/p>\n<p>如果聽完後有所心得，歡迎與我分享，如果對你的身旁的家人或朋友有幫助，也可以與大家聊聊他們的看法。<\/p>\n<h1>小狗子又來盪鞦韆<\/h1>\n<h1>高年級不打烊在留言處<\/h1>"}, {"id": "f1656069181", "date": "2022-06-24", "title": "好看分享-時間12m44s", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好看分享-時間12m44s 白天很忙的時候，正在上網課寫學習單的阿狗傳來一個連結，沒時間看，存著。 中午吃飯時配著飯看，結果是眼淚配著吃。 影片主角Sam用正面的生命觀描述著不容易", "len": 464, "body": "<p>好看分享-時間12m44s<\/p>\n<p>白天很忙的時候，正在上網課寫學習單的阿狗傳來一個連結，沒時間看，存著。<\/p>\n<p>中午吃飯時配著飯看，結果是眼淚配著吃。<\/p>\n<p>影片主角Sam用正面的生命觀描述著不容易的事，尤其是成天在抱怨的人們，時時心中就與別人相比較著學歷、財富、職位甚至是外貌。或許是人性使然，以上的成就都很重要，但是最重要的是什麼呢？<\/p>\n<p>先讀一遍，再看一遍影片，再Google山姆的資料，週末了！我們一起勇於挑戰人生，享受生命。<\/p>\n<p>Sam山姆與我們分享了他快樂人生的哲學，簡單記錄如下：<\/p>\n<ol>\n<li>做不來的事就算了，因為還有很多我做得來的。<\/li>\n<\/ol>\n<p>Be Ok with what you ultimately can't do, because there is so much you Can do.<\/p>\n<ol start=\"2\">\n<li>與自己處得來的人相處。<\/li>\n<\/ol>\n<p>Surround yourself with people you want to be around.<\/p>\n<ol start=\"3\">\n<li>向前看向前行。<\/li>\n<\/ol>\n<p>Keep moving forward.<\/p>\n<ol start=\"4\">\n<li>永遠別錯過參加派對的機會。<\/li>\n<\/ol>\n<p>Never miss a party if you can help it.<\/p>\n<p>連結在留言處，如果你與我一樣感動，存著。<\/p>\n<h1>換寶貝班小狗子上場<\/h1>"}, {"id": "f1655636904", "date": "2022-06-19", "title": "好聽分享4-所需時間83mins", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好聽分享4-所需時間83mins 【你晚餐吃什麼？日式？洋式？中式？台式？】 疫情之下有家旅行社接受訪問表示他們好像越來越忙，生意好到開分公司。如果覺得很好奇是什麼樣的旅行社可以在", "len": 420, "body": "<p>好聽分享4-所需時間83mins<\/p>\n<p>【你晚餐吃什麼？日式？洋式？中式？台式？】<\/p>\n<p>疫情之下有家旅行社接受訪問表示他們好像越來越忙，生意好到開分公司。如果覺得很好奇是什麼樣的旅行社可以在此時維持生意，可以點入留言區的連結聽聽看，更想知道大家聽完後的感想。<\/p>\n<p>前陣子家人想參加鳴日號的旅行，查了網站才知道三天二夜的價格，與過往對國旅鐵道產品的認識差異不小，如果真的有經濟能力實在會想體驗一下餐餐精緻、當地旅行風土的頂極設計。<\/p>\n<p>但是快吃晚餐的我仍邊打著字邊想著如何在物價飛漲的期間，不得已地考量著已經重覆吃過的便當店、簡餐店及小麵攤的晚餐，或是去黃昏市場看看今天有什麼3把50元的青菜及一盤100的熟菜可以打發家人一餐。我一路回想到的是中和南勢角黃昏市場、古亭市場、三重三和早市或夜市、木柵木新市場、新店中興市場、吉安黃昏市場、志學學生街、林口文一、文二、福德黃昏市場中的每一攤，也許對我而言那就是每週或每日工作結束後的本土風尚旅行。<\/p>\n<h1>小班小狗子<\/h1>\n<h1>好聽連結在留言處<\/h1>"}, {"id": "f1655535373", "date": "2022-06-18", "title": "好聽分享3-所需時間28mins", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好聽分享3-所需時間28mins 【卡住人生的陷阱】 有些技能是天生就會的，例如：吃 但是吃的工具使用得好就沒那麼簡單。 大家的筷子拿得好嗎？ 前天夜裡加班回家的路程上聽了一段令人", "len": 511, "body": "<p>好聽分享3-所需時間28mins<\/p>\n<p>【卡住人生的陷阱】<\/p>\n<p>有些技能是天生就會的，例如：吃<\/p>\n<p>但是吃的工具使用得好就沒那麼簡單。<\/p>\n<p>大家的筷子拿得好嗎？<\/p>\n<p>前天夜裡加班回家的路程上聽了一段令人深省的Podcast(連結在留言區)，實實在在回想了一下自己有什麼事好像很容易上手而且習慣，後來又再花了很多力氣與時間去重新積累能力的？<\/p>\n<p>實在是太多了，舉個自己奇怪的例子。<\/p>\n<p>【學會正確拿筆寫字】<\/p>\n<p>因為我是先學會正確拿筷子的，所以從小寫字就將筆當成筷子墊在無名指上寫，一路從幼稚園寫到退伍到中華徵信所上班，當時因為同事都是高學歷，興起了在職考研究所的念頭，下班也去南陽街碩士補習班上課，因為要寫考卷，拿筆方式不對，字寫多了手指就會很痛，也寫不快；當時就決定要重新練習握筆的方法。<\/p>\n<p>我花了快六個月的時間重新學如何握筆寫字，從醜醜的字又練回工整，而且可以快速地寫很多研究所開放題考卷，又不費力，考季時整整去考了五六所商學所，雖然字寫得好看沒讓我考上台政交，但是至今為止，我都很開心可以用正確的方式書寫。<\/p>\n<p>而且，我後來又用這個打掉重來的習慣，改掉了不少無聊又自己很介意的小事，一樣對人生沒什麼幫助，但是總是舒坦些。<\/p>\n<h1>小班狗子又來了<\/h1>\n<h1>大人學Podcast嚴肅聽一下<\/h1>\n<h1>連結在留言處<\/h1>"}, {"id": "f1654923688", "date": "2022-06-11", "title": "守護台灣教育平台是輔大社會系戴伯芬老師在努力的平臺，身為…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "守護台灣教育平台是輔大社會系戴伯芬老師在努力的平臺，身為輔大社會畢業系友又是私立技職學校員工，在心態上是很衝突的角色。 對於當一個學校工作者來說，當然私校財務安全是最重要的（所以這", "len": 503, "body": "<p>守護台灣教育平台是輔大社會系戴伯芬老師在努力的平臺，身為輔大社會畢業系友又是私立技職學校員工，在心態上是很衝突的角色。<\/p>\n<p>對於當一個學校工作者來說，當然私校財務安全是最重要的（所以這張圖是以最右欄在排名的，從綠藍青黃至紅燈區)，個人也覺得對於學生來說，有安心工作努力教學的老師應該才是最重要的事！<\/p>\n<p>另外教育部常公布的生師比及註冊率是可調可控可以參考當依據，但是學生未來有沒有母校，在私校來看仍是看有沒有錢存續經營。<\/p>\n<p>:::生師比:::<\/p>\n<p>各校的生師比與財務安全之間的關係由顏色來看就知道呈反向的相關。簡言之就是平均班數人數越多，學校當然越賺錢，財務越健全；所以由生師比看教學品質不一定準確，硬要解釋教學品質與老師不能教太多學生的理論應該只適用在公立大學的環境中。<\/p>\n<p>:::註冊率:::<\/p>\n<p>在註冊率部分，更是文章多多，財團重新投資的私校全校收個百餘位學生，而教師都專案聘，當然數字都好看。<\/p>\n<p>:::財務安全:::<\/p>\n<p>這部分的資訊教育部就很保守不太提了，平台中都暢言希望盡速公告數字，身為領私校薪水的我們只知道努力招生留生，教學品質顧好，畢業實習終身服務，學校的財務才有安全的一刻，而且只是一刻而已。<\/p>\n<p>圖片來源：守護台灣教育平台連結在留言區<\/p>"}, {"id": "f1652526069", "date": "2022-05-14", "title": "是忘記了？還是記了太多別的事？", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "是忘記了？還是記了太多別的事？ 昨天老友提起了一件我完完全全沒記憶的事：永和國中環島畢業旅行。當時國中是有髮禁的時代，打開了三十幾年未曾細看的畢業紀念冊上的小照，證明了當年真的有畢", "len": 339, "body": "<p>是忘記了？還是記了太多別的事？<\/p>\n<p>昨天老友提起了一件我完完全全沒記憶的事：永和國中環島畢業旅行。當時國中是有髮禁的時代，打開了三十幾年未曾細看的畢業紀念冊上的小照，證明了當年真的有畢業旅行這件事。<\/p>\n<p>國中後二年真的任何記憶都沒有。<\/p>\n<p>只記得，我轉了三個班，換了150位同班同學，從B段班念到A+班<\/p>\n<p>只記得，考完聯考回校拿成績單時，老師只對我說：「陳瑞峰，你是考上師大附中全校英文最低分」<\/p>\n<p>只記得<\/p>\n<p>有接近1000天的日子<\/p>\n<p>老師的藤條在空中出了聲<\/p>\n<p>像冬雨般細細地落在左掌上<\/p>\n<p>我沒閉眼<\/p>\n<p>就眼睜睜地看著手上熱辣的紅線<\/p>\n<p>一條一條地累積成為一片紅暈<\/p>\n<p>我沒出聲<\/p>\n<p>因為一絲又一絲的痛已經成為溫度<\/p>\n<p>就靜靜地將恐懼轉為無奈沉入心底<\/p>\n<p>我張著眼<\/p>\n<p>看著左掌當時常年的青紫早已不見<\/p>\n<p>但是想起當年無處可逃的心驚仍舊膽寒<\/p>\n<h1>打這段字時會發抖<\/h1>\n<h1>其實屁股也記得<\/h1>"}, {"id": "f1650006305", "date": "2022-04-15", "title": "好聽分享2-所需時間49mins", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好聽分享2-所需時間49mins 四月天台灣本土破千做個記錄。 附圖也是今天醒吾旅運系正在面試星宇航勤工作的同學現場。 所以我仍想分享何時能出國去玩的資訊。在此推薦【泛旅覓客社】國", "len": 643, "body": "<p>好聽分享2-所需時間49mins<\/p>\n<p>四月天台灣本土破千做個記錄。<\/p>\n<p>附圖也是今天醒吾旅運系正在面試星宇航勤工作的同學現場。<\/p>\n<p>所以我仍想分享何時能出國去玩的資訊。在此推薦【泛旅覓客社】國王的旅耳朵專輯，專訪吉光旅遊林總經理，以獨到的見解分享他的最新觀察，聽完後真覺得能經營旅行業的專業經理人在專業能力、口條解說實在令人欣賞。<\/p>\n<p>先聲明對於感染病毒不能有任何的價值判斷，更不能用數字來劃定那個地方的人或區域是什麼壞東西，因為病毒是不選人的，有宿主就感染，有空間就生存傳佈；對於我們自身而言，就是顧好自己的健康及免疫力增加自己的存活機會，進而減少感染後傳佈的社會責任而已。<\/p>\n<p>其實我在最近就一直上網看出國的機票，只是逛逛不敢下手訂，但是又看到身處歐洲、美國或日本同學好友，早已解封四處去旅行遊玩，有如平行時空令人難以忍受。在課堂上，我也不時地與學生分享2022年以來全球郵輪知名企業如RCCI、CCL的近期股價早已翻漲，出遊人數及訂位數都漸恢復疫前的榮景；所以我最最在乎的就是何時可以開放出國旅行回國不用隔離！個人期待只要接種疫苗在實際預防及防疫信心上是有效的，就可以打開國門不再鎖國，希望這樣的一天趕緊到來，七月也好，九月也好，越快越好。<\/p>\n<p>那吉光旅遊的林總經理怎麼看呢？在第一線打拚的吉光旅遊總經理林瑞昌Domingo，用他最獨家的觀察與見解為我們開光，給我們期待與他現在的準備與作法。想出國的朋友可以聽聽看。<\/p>\n<h1>醒吾旅運星宇航空面試中<\/h1>\n<h1>喜歡用聽的方式來吸收訊息或知識嗎<\/h1>\n<h1>我很喜歡以後會常分享<\/h1>\n<h1>Podcast連結在留言處<\/h1>"}, {"id": "f1649910122", "date": "2022-04-14", "title": "好聽分享1-所需時間46mins", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "好聽分享1-所需時間46mins 這是近期聽完後最感動的一段廣播， 覺得要成為一個\"完整\"的人都是從小事的堅持而做起的。 這位林總裁在剛去美國時約19-20歲時在知名的長島酒店當門", "len": 370, "body": "<p>好聽分享1-所需時間46mins<\/p>\n<p>這是近期聽完後最感動的一段廣播，<\/p>\n<p>覺得要成為一個\"完整\"的人都是從小事的堅持而做起的。<\/p>\n<p>這位林總裁在剛去美國時約19-20歲時在知名的長島酒店當門房，<\/p>\n<p>因為他的特質能很快地與人結識，找到共同點，而且很認真、正直地與他人交往，用同樣的價值觀從門房、工程師、議員、市長到跨國企業的CEO，進而擁有豐富且正向的人生。<\/p>\n<p>說實話當然羨慕他有錢、有機會可以到美國讀書、進修甚至是工作，但是回頭反省若我擁有同樣的機會，以自己的能力與個性在面對種族問題或事件挑戰時，很多話我是說不出口，更難說要挺身而出去嘗試與承擔。<\/p>\n<p>這樣人生的模式也會不一樣，結果也可能會不同。無論如何，收獲很多，在此與朋友分享，如果你有辦法空出你的耳朵，聽聽這段收獲很多的線上訪談內容。<\/p>\n<h1>喜歡用聽的方式來吸收訊息或知識嗎<\/h1>\n<h1>我很喜歡以後會常分享<\/h1>\n<h1>Podcast連結在留言處<\/h1>"}, {"id": "f1649670909", "date": "2022-04-11", "title": "最近在忙什麼？", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "最近在忙什麼？ 當然也忙著日常教學、網課準備、高中職招生及實習訪視；也擔心著寫不完的校務研究、碩論指導、論文期刊撰寫。 但是用盡全力在忙的：在疫情蔓延中協助旅運系的大三學生爭取稀少", "len": 443, "body": "<p>最近在忙什麼？<\/p>\n<p>當然也忙著日常教學、網課準備、高中職招生及實習訪視；也擔心著寫不完的校務研究、碩論指導、論文期刊撰寫。<\/p>\n<p>但是用盡全力在忙的：在疫情蔓延中協助旅運系的大三學生爭取稀少又寶貴的航空旅遊業職場機會。<\/p>\n<p>醒吾科大旅運系的學生有全年度的實習學分。當同學們進入大三就要開始積極地準備履歷資料，安頓自己，整理所學，檢視所能。在長達數月的履歷投遞過程中學習如何求職、面談及接觸企業等。<\/p>\n<p>從二月到四月之間，以下是現在進行式：<\/p>\n<h1>星宇航空21位專案在校面試媒合<\/h1>\n<h1>台灣高鐵客服部3位最後階段<\/h1>\n<h1>雄獅旅遊企旅國旅運通部門13位應聘中<\/h1>\n<h1>新北市旅服中心5位錄取<\/h1>\n<h1>新加坡海外實習3位面試中<\/h1>\n<h1>日本輕井澤實習1位錄取<\/h1>\n<h1>中國實習1位應聘中<\/h1>\n<h1>鼎泰豐萬豪花蓮遠來嘉義文旅瑞穗天合國賓意舍六福五星餐旅全員錄取<\/h1>\n<h1>可樂旅遊OP實習安排中<\/h1>\n<p>上述的實習機會都感謝有醒吾最強大的長官們拉線爭取知名企業＋教師教學訓練證照輔導全力支持，讓每年只收一班的醒吾旅運管理系學生在進入職場的準備及未來表現如此令人期待。<\/p>\n<h1>日間部進修部招生中<\/h1>\n<h1>報名連結在留言處<\/h1>\n<h1>歡迎學生好友轉傳<\/h1>"}, {"id": "f1647748368", "date": "2022-03-20", "title": "【P&O渡輪解聘大量員工，並不是P&O郵輪喔】", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【P&O渡輪解聘大量員工，並不是P&O郵輪喔】 台灣的國際新聞好站關鍵評論網貼出了一篇【P&O郵輪透過影片無預警開除800名員工，掀起各方反彈】的文章，報導中提到了因為疫情造成了在", "len": 682, "body": "<p>【P&amp;O渡輪解聘大量員工，並不是P&amp;O郵輪喔】<\/p>\n<p>台灣的國際新聞好站關鍵評論網貼出了一篇【P&amp;O郵輪透過影片無預警開除800名員工，掀起各方反彈】的文章，報導中提到了因為疫情造成了在P&amp;O渡輪工作的800名員工被突擊解聘，因為發生在勞權立國的英國，引起了不少爭議(原文在留言處)。<\/p>\n<p>源自於英國的P&amp;O公司是全球最老牌的船運公司之一，全名是The Peninsular &amp; Oriental Steam Navigation Company，自1837年成立以來，在複雜的整併與商業過程中，P&amp;O渡輪(P&amp;O Ferries, P&amp;O Maritime and P&amp;O Heritage)三個品牌現在是由杜拜的DP公司操作，這就是此次新聞事件的主角，所以圖中的P&amp;O渡輪就是平時服務在英國、愛爾蘭及歐陸的大型渡輪，是屬於一般交通運輸民生相關的船運公司。<\/p>\n<p>P&amp;O Cruise郵輪公司母公司是美國嘉年華郵輪，與大家熟悉的公主郵輪算是姊妹公司，因為全球疫情危機漸減，現在都開始正常進行郵輪旅遊服務。在官網上也可以看到4-6月的航程已經在販售，一趟Iona號2022年4月9日啟航的挪威峽灣Norwegian Fjords 8日遊一人費用從549~1349歐元真心覺得可以喔(放在留言處)。最新的Iona號內裝也非常典雅舒適，完全的北歐風深得我心，更是P&amp;O Cruise第一艘用天然氣為動力的超級郵輪，介紹影片也放在留言囉。<\/p>\n<p>引用圖片來自於Wikipedia Michiel Hendryckx - Own work<\/p>\n<p>P&amp;O ferries Pride of Burgundy and Pride of Kent in Dover Harbour<\/p>"}, {"id": "f1645841903", "date": "2022-02-26", "title": "【基隆港開港十萬噸級星辰公主號首航20週年】", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【基隆港開港十萬噸級星辰公主號首航20週年】 這週終於在搬了八次家未開封的打包照片中找出珍貴影像，都是用底片拍的照片翻拍。圖中人物都是在2002年星辰公主號首航基隆時上船當郵輪導覽", "len": 675, "body": "<p>【基隆港開港十萬噸級星辰公主號首航20週年】<\/p>\n<p>這週終於在搬了八次家未開封的打包照片中找出珍貴影像，都是用底片拍的照片翻拍。圖中人物都是在2002年星辰公主號首航基隆時上船當郵輪導覽人員訓練的照片！感謝當時同窗Alumi Lu大哥推薦此寶貴機會讓我上船開眼界，當年留下的深刻印象至今仍歷歷在目！<\/p>\n<p>2002年1月25日Star Princess從義大利展開她全新下水的26天全球首航，經由地中海、蘇伊士運河、印度洋、亞太地區，在亞太時有停留基隆港進行郵輪旅遊的商務推廣，當時基隆港第一次迎來了10萬噸級的郵輪，可是基隆港當年的大事！<\/p>\n<p>最後星辰公主移航到她的母港洛杉磯開始了她豐富的航行生涯，直到疫情發生，2020年星辰公主號換了操作公司，加入澳洲區P&amp;O郵輪改名為Pacific Encounter太平洋禮遇號，現在駐航在澳洲布里斯班港，現在她都在澳洲東岸昆士蘭省、大洋洲地區及南太平洋小島上巡航。<\/p>\n<p>對了，其實全球很多地區的郵輪都已經開航，只是大家仍有警覺及擔心不太敢放膽旅行，但是上各大郵輪的官方網頁都可以看到全世界的船票都已經開賣，期待台灣結束旅遊鎖國，這樣不久的未來有機會可以在東澳見到她的身影！<\/p>\n<p>有興趣的朋友或同學可以看留言處的維基百科介紹。<\/p>\n<p>補充：<\/p>\n<p>最欣賞的奧黛麗.赫本在1989年參加Star Cruise公主號（現已易手改名）的擲瓶儀式，並為擲瓶的教母。可惜不是文中2000年星辰公主號，但公主郵輪的教母很多都是以皇室成員為主，例如1984年下水的皇家公主號Royal Pricess就邀請到黛安娜王妃作為教母；而優雅的凱特王妃是2013年新一代皇家公主號的教母。<\/p>"}, {"id": "f1640922094", "date": "2021-12-31", "title": "2021年是感恩年", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2021年是感恩年 感謝一路上陪伴我體諒我無端情緒的另一半 感動上天安排帥兒子，讓他自律與努力豐厚了視野 感恩在職涯上提攜的前輩長官，讓我踏入了另一個境地 感激工作上共同打拚的同事", "len": 312, "body": "<p>2021年是感恩年<\/p>\n<p>感謝一路上陪伴我體諒我無端情緒的另一半<\/p>\n<p>感動上天安排帥兒子，讓他自律與努力豐厚了視野<\/p>\n<p>感恩在職涯上提攜的前輩長官，讓我踏入了另一個境地<\/p>\n<p>感激工作上共同打拚的同事夥伴與貼心學生<\/p>\n<p>更感念每一位家人好友在任何層面上，我都可以感受到支持。<\/p>\n<p>2021是個轉換方向的一年，調整重心讓視角與心可以更為接觸自己；多年人際過載壓抑了情緒與心靈；2022期待自己持續天天跑步，常常聽書讀書，努力展開寫作，學習與人相處。更希望有機會考進理工科類博班學習新知，除了轉換更期待提升。<\/p>\n<p>最後祝福每一位家人、好友、同學、同袍、同事、學生們在2022雲闊天清，心想事成。<\/p>\n<h1>疫情退散出國旅行<\/h1>\n<h1>身體強壯吃遍美食<\/h1>\n<h1>認真打拚年終豐足<\/h1>\n<h1>家人平安父母健康<\/h1>\n<h1>這才是我俗氣心願<\/h1>"}, {"id": "f1640247537", "date": "2021-12-23", "title": "--用有色眼鏡看世界時，世界就變成你眼鏡上的顏色--", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "--用有色眼鏡看世界時，世界就變成你眼鏡上的顏色-- 郵輪觀光產業全亞洲都在努力發展，中國近期也自造巨型郵輪等著佔有全球郵輪產業的巨大發展機會，此時台灣旅遊業只是辦個郵輪旅遊團體遊", "len": 479, "body": "<p>--用有色眼鏡看世界時，世界就變成你眼鏡上的顏色--<\/p>\n<p>郵輪觀光產業全亞洲都在努力發展，中國近期也自造巨型郵輪等著佔有全球郵輪產業的巨大發展機會，此時台灣旅遊業只是辦個郵輪旅遊團體遊，就有人拿著唱高調的放大鏡去看種種不足之處，藉此讓郵輪產業因疫情當理由而停滯，甚至可能在全球復甦期失去發展的機會。<\/p>\n<p>郵輪觀光這是一個合適於台灣民情發展的郵輪旅遊產業，有訓練、有專業、有員工與企業以此為生；有機會讓產業界用專業與品質走向高質量與質感的服務，更有契機讓各離島增加可能的基礎設施，加值各類產品服務。結果卻在此觀光旅遊百業都需要鼓勵與支持之時，自以為是地貼上了一個不合宜的標籤。<\/p>\n<p>這就如台灣Dot Com市場中的蕃薯藤(有人聽過嗎？其實現在還在喔！）在廿世紀末時高佔全台灣亦或是華語界搜尋引擎的龍頭時，有著大好機會可以商業化規模化，甚至是影響華文世界，因為創辦人的社會公益性的堅持，錯失了進入網路世界的大好機會，最後終究成為一場未散的泡沫。<\/p>\n<p>百工百業鐘鼎山林，各自努力雨露均霑，疫情之下郵輪旅遊產業的努力，與期待政府政策支持的聲音。<\/p>\n<p>請支持呂江泉教授所提倡的【拚郵輪經濟 不要汙名化】<\/p>"}, {"id": "f1637123255", "date": "2021-11-17", "title": "去年此時還每週要去方濟支援一整天的教學活動，是個很好的回…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "慘業！ 去年此時還每週要去方濟支援一整天的教學活動，是個很好的回憶，上午四節課上完之後，我還可以去大禮堂跟著老師一起去打團饍，學生與老師都吃四菜一湯，我就帶著環保碗打了菜坐在安靜的", "len": 361, "body": "<p>慘業！<\/p>\n<p>去年此時還每週要去方濟支援一整天的教學活動，是個很好的回憶，上午四節課上完之後，我還可以去大禮堂跟著老師一起去打團饍，學生與老師都吃四菜一湯，我就帶著環保碗打了菜坐在安靜的禮堂中與老師職員們一起用餐，不用到外面去找吃的，也可以快快用完餐休息一下準備下午的連續課程。<\/p>\n<p>學生也很健談，大家都知道我是醒吾科大的老師，其實他們根本沒考四技統測，大家也都考完學測準備升學一般大學，可能是因為知道我是去心酸的，更體貼地關心我，問起教育產業的困境，同學對大學科系出路及招生少子化更是有感，班上同學還開玩笑地說對面的文德女中學生人數沒剩幾人，學校要倒也是文德先倒。<\/p>\n<p>其實去年教的方濟高三觀光旅運實務課程時參與學生都很上進，方濟老師也是努力的教學，學生學測表現也不錯，多半都可以考進國立大學，學校區位也是在內湖捷運線上。<\/p>\n<p>結果.......<\/p>"}, {"id": "f1635903665", "date": "2021-11-03", "title": "讀到了一篇覺得很受用的文章，如果你也是一個常說「不好意思…", "cat": "每日晨讀", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "讀到了一篇覺得很受用的文章，如果你也是一個常說「不好意思」深怕「麻煩別人」的人，可以檢視一下平常在學習及工作上的生活習慣。 自己覺得最受用的是排在最後的三點習慣，原來我本來認知是「", "len": 610, "body": "<p>讀到了一篇覺得很受用的文章，如果你也是一個常說「不好意思」深怕「麻煩別人」的人，可以檢視一下平常在學習及工作上的生活習慣。<\/p>\n<p>自己覺得最受用的是排在最後的三點習慣，原來我本來認知是「放棄」的習慣，在中島先生的文章中是一種必需的「暫停」，但是這些習慣的養成應該是要有順序的，要先在做事或生活時要時時認真在實踐，積極努力地面對工作或人生挑戰！在真的撐不下去時才暫時休息。<\/p>\n<p>如果你將後面的習慣往前排，成天沒事聲聲唉累，時時刻刻人生在暫停，那就可能不是自我肯定，而是自我放棄了！<\/p>\n<p>———————————好文共賞——————————<\/p>\n<p>自我肯定高的人要養成的15個 \"要仍掉的習慣\"及\"要維持的習慣\"<\/p>\n<p>作者：中島輝<\/p>\n<p>&lt;&lt;獲得積極自我的習慣&gt;&gt;<\/p>\n<p>1.樂於接受別人的讚美<\/p>\n<p>2.體認會批評的人永遠都在，人際關係262法則<\/p>\n<p>3.將你小小開心與快樂擴大<\/p>\n<p>4.打造一個可以回歸真實自我的家<\/p>\n<p>&lt;&lt;一個人的時間&gt;&gt;<\/p>\n<p>5.離開手機網路為自己留一個時間<\/p>\n<p>6.不要執著於原先的計畫<\/p>\n<p>7.檢視你並不喜歡且正在做的事<\/p>\n<p>8.做讓你和你周遭人都開心的事<\/p>\n<p>9.減少\"吃什麼\"、\"穿什麼\"的小猶豫，積累這些小猶豫會耗損能量<\/p>\n<p>&lt;&lt;堅定信念的習慣&gt;&gt;<\/p>\n<p>10.自私點，對自己人性點<\/p>\n<p>11.找到想做的事，持續去接受挑戰為自己做點事<\/p>\n<p>12.想做什麼就馬上行動<\/p>\n<p>&lt;&lt;如果很累，沒有動力怎麼辦&gt;&gt;<\/p>\n<p>13.休息一下，好好睡覺，等自己一下<\/p>\n<p>14.不要撐了，放過自己<\/p>\n<p>15.無所事事(放空)的時間會更肯定自我<\/p>\n<p>資料來源：東洋經濟online<\/p>"}, {"id": "f1634307275", "date": "2021-10-15", "title": "凡事勿過度Nothing in Excess (Delp…", "cat": "理財情報", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "凡事勿過度Nothing in Excess (Delphic Maxims德爾斐箴言) 我的老東家［中華徵信所CCIS］近日公佈最新市場調查報告! 大家知道在疫情之下的2020年", "len": 783, "body": "<p>凡事勿過度Nothing in Excess (Delphic Maxims德爾斐箴言)<\/p>\n<p>我的老東家［中華徵信所CCIS］近日公佈最新市場調查報告!<\/p>\n<p>大家知道在疫情之下的2020年，台灣的餐飲營收前三強是那幾家企業嗎？疫情如何改變餐飲生態，未來將如何發展呢？報告書在留言處，有興趣再去讀一讀。<\/p>\n<p>中華徵信所每年都會依據各項客觀資料整理出台灣企業5000大，在1997年時的我仍是CCIS市場部的助理研究員，每年也要負責報告撰寫，同時也要利用這些具市場價值的資料重新整理協助各家企業進行市場分析。協助撰寫上市計畫書公司有櫻花建設、青雲電子、鑽全企業；協助已上市公司增資的有台鳳、東帝士及長生企業(當時的機場捷運營運商)；以上的公司很多都已經下市或消失了，仍記得當時去企業總部報告或洽談時，那些企業對市場研究公司的臉色，其實工作不就是大家都為了一口飯嗎？<\/p>\n<p>印象中對深刻的是野村總合研究所委託CCIS撰寫台灣加入GATT(現在的WTO)的產業影響報告書，經費少到CCIS只能請一位新進員工撰寫，否則根本不合成本，但是因為採訪的內容非常有趣，我盡了全力去研讀各類報導及研究，很多的學術單位論文資料都非常破碎無用，為了這本報告我往返在公司/央圖/世貿圖書館之間，至少花了3個月日夜才寫完中文版，再由野村總合研究所與日本交流協會轉譯為日文發行至日本供產業參考，手邊仍存有當時一字一句打下的血汗。<\/p>\n<p>1997年在中華徵信所上班時，台北仍沒有捷運系統，家住三重三和路租屋處，每天與數以萬計的機車族騎車下台北橋至台北市松山區上班，每天9點上班9點下班，一週至少工作6天，與中國現行盛行的996工作制新興說法相同，根本就是台灣社會新鮮人賣肝的寫實經驗。在低薪與長工時之下，我沒記得賺了多少錢！更沒留下什麼生活回憶！<\/p>\n<p>最現實的就是在CCIS那二年，我開始掉髮慢慢地失去了年少時的髮量，得不償失。<\/p>\n<h1>996工時<\/h1>\n<h1>中華徵信<\/h1>"}, {"id": "f1632811670", "date": "2021-09-28", "title": "【我的小老師妙事】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【我的小老師妙事】 我在板橋後埔國小讀小學時，當年的後埔國小是全世界最多人的小學，全校六個年級有195個班，全校11500多人，當時升降旗照年級輪流，中低年級還因為教室不足而一直只", "len": 599, "body": "<p>【我的小老師妙事】<\/p>\n<p>我在板橋後埔國小讀小學時，當年的後埔國小是全世界最多人的小學，全校六個年級有195個班，全校11500多人，當時升降旗照年級輪流，中低年級還因為教室不足而一直只能上半天課。當年充滿黃沙的小小操場是沒有辦法全校集合的，全校的升旗每一班都是站在自已班前的走廊唱國歌。放學時每個回家的路隊都像是人龍一樣慢慢地花下不少時間才能將全校同學疏散回家。<\/p>\n<p>我還記得有一年中視新聞的周荃主播來校訪問，校方派了幾個不會亂說話的同學去接受採訪，我記得那天我對著攝影機及周荃阿姨說：「我們下課時要上廁所的同學很多，大家都要排隊去尿尿，如果來不及就要回教室了」，後來這一段有被放在中視晚間七點新聞播放，這是我的媒體處女秀。<\/p>\n<p>其實我在念五六年級時，是自然科的小老師，每天早自習就要念課文或考題給同學聽寫或考試，有一天一早因為尿急又要念考題給同學，不敢去上廁所，結果實在忍不住結果就在講台上就尿了一地，褲子也溼透了，地上也有一灘尿水。<\/p>\n<p>我後來還去提了一桶水來教室假裝灑水，也想不起來為什麼那時的教室常常要灑水？是太熱嗎？還是有很多灰塵？就假裝將自己的尿自以為是地沖淡......<\/p>\n<p>結果時間過去了四十年，對自己來說好像什麼都沒沖淡，反而還記得更清楚。<\/p>\n<p>這樣也算當老師的妙事嗎？＠Cherng有很多好笑的例子，留言區有連結，大家點進去快樂一下吧！！<\/p>\n<h1>祝福每位老師教師節快樂<\/h1>\n<h1>學校的廁所很重要<\/h1>\n<h1>再過幾年也許年紀大的我又在講台上閃尿了<\/h1>"}, {"id": "f1631374251", "date": "2021-09-11", "title": "【退場的大學，不退場的學生】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【退場的大學，不退場的學生】 台灣的大學新生預估111學年(2022)的高中畢業生將少於20萬，而且每年以1萬人的人數在減少中，預估在118學年(2029)將少於16萬名畢業生，以", "len": 439, "body": "<p>【退場的大學，不退場的學生】<\/p>\n<p>台灣的大學新生預估111學年(2022)的高中畢業生將少於20萬，而且每年以1萬人的人數在減少中，預估在118學年(2029)將少於16萬名畢業生，以現行69所一般大學來看，每年就提供10萬名以上新生名額，另一制度的技職科大的招生數量幾乎與大學相等，所以將念大學的學生一定有學校可以念，學生的選擇將更為多元，但大學中的教學工作定將更是艱難與複雜。<\/p>\n<p>自己因為九十年代(2000初期)廣設大學的機會，可以讓只有碩士學位的我從業界轉進偏鄉的技職院校；但也因為同一個錯誤的政策，在不久的未來將面臨了教育環境的大退潮。<\/p>\n<p>臉書跳出了台灣觀光學院退場收攤後的報導。一直以曾經在花蓮台灣觀光學院工作過自豪，更與好多貼心的學生結下了終身的緣份，看到花蓮更生日報上報導著最後的123位同學，順利地轉學至慈濟科技大學，依原課程原制度一步步地完成他們的大學學業，雖然轉換過程中一定是充滿著無奈與不安，仍祝福這群同學越走越順。<\/p>\n<p>圖說：攝於2007年12月25日花蓮臺灣觀光學院大操場<\/p>"}, {"id": "f1630299503", "date": "2021-08-30", "title": "正在上學校的線上課程，在談108課綱對技術型高中的教學分…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "正在上學校的線上課程，在談108課綱對技術型高中的教學分享。講師提到了現在全球只剩下兩岸有要大學聯招，所以課綱的學習歷程是為了讓學生可以透過平時的學習資料累積，提供未來多數同學以甄", "len": 406, "body": "<p>正在上學校的線上課程，在談108課綱對技術型高中的教學分享。講師提到了現在全球只剩下兩岸有要大學聯招，所以課綱的學習歷程是為了讓學生可以透過平時的學習資料累積，提供未來多數同學以甄試方式入學高等教育的方式，但，我是很存疑這樣的說法的。<\/p>\n<p>其實聯招分數取才在只要需要智慧菁英人才的國家是永遠會存在的，課綱在設計時應要依著人類喜歡競爭及比序的方式去設計，而不是設計一大堆的方案想取代考試，考試有其合理之處，如何公平地選才是先進國家重要的課題。<\/p>\n<p>韓國每年12月底有大學修學能力試驗（CSAT）決定學生要錄取什麼大學；日本更可怕，每年1月有全國共同學力第一次考試，考完後再由各大學自行主持並決定錄取學生的單獨考試，用所謂的偏差值來定義學生入學的標準。英國也是在5月有 A-Level 高中畢業會考用此標準來供要進入各級大學的畢業生選擇（相關報導先放在留言區)。<\/p>\n<p>不是想戰文，只是覺得大學聯考沒什麼不好，一直將制度改來改去才是不好的。<\/p>"}, {"id": "f1629291006", "date": "2021-08-18", "title": "【停發文不停跑】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【停發文不停跑】 感謝大家陪伴瑞峰跑過1084天不停止的每日3KM跑步，這樣的過程讓自己從從撐不住變成撐住，從不習慣變成習慣，從不自在變成自在，身與心的收獲是難以計量的。因此，如果", "len": 334, "body": "<p>【停發文不停跑】<\/p>\n<p>感謝大家陪伴瑞峰跑過1084天不停止的每日3KM跑步，這樣的過程讓自己從從撐不住變成撐住，從不習慣變成習慣，從不自在變成自在，身與心的收獲是難以計量的。因此，如果您是常看每日跑步文後會動念想要動一動，或真的也起來動一動的不覺得煩的，就轉去參觀瑞峰的IG每日跑步記錄吧(下方留言有)。<\/p>\n<p>FB就不再發跑步文了，也還沒想好要記錄些什麼，也許仍是教學過程的碎念，要退友的就靜靜來囉！（絕對不會去算朋友數的）<\/p>\n<p>感謝正在煩惱FB附圖時，學生突然私訊支援畢業紀念冊照片。圖中的文字四年前寫下的：「給自己一片澄澈就會找到天空」(是建中林明進老師給學生的鼓勵)，「送自己一方期許就能尋得未來」(應是四年前的讀書心得留給我的學生)。2021新學期要接新班導師班了，仍舊很緊張！<\/p>"}, {"id": "f1629121096", "date": "2021-08-16", "title": "前幾天應孩子的邀請上網玩popcat遊戲應付按了幾下，這…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "前幾天應孩子的邀請上網玩popcat遊戲應付按了幾下，這是當天的截圖。 結果今天孩子又傳了另一個與popcat有關的泰國抗議事件來問我的看法，他說原來沒人管的國家疫苗都打在權貴及有", "len": 298, "body": "<p>前幾天應孩子的邀請上網玩popcat遊戲應付按了幾下，這是當天的截圖。<\/p>\n<p>結果今天孩子又傳了另一個與popcat有關的泰國抗議事件來問我的看法，他說原來沒人管的國家疫苗都打在權貴及有錢人身上，人民只能無奈地接受病毒蔓延家人生病。<\/p>\n<p>這幾天世界變化太大，海地大地震、阿富汗政變等等，泰國人民只好藉由popcat來爭取世界對他們的支持。<\/p>\n<p>但靠山山會倒，靠人人會跑。<\/p>\n<p>在全世界亂成一團時，各國人民只能靠自己努力打拚爭取權益，監督國家機器是否真的為國民在服務，對於已經影響到自己權益的時候發出反抗的手段，否則最後就是比拳頭不是比人頭了。<\/p>\n<p>相關資訊放在留言處。<\/p>\n<h1>whathappeninginthailand #popcat<\/h1>"}, {"id": "f1628815215", "date": "2021-08-13", "title": "幾週前出版社打電話來系上邀書稿，嚇了一跳竟然是想出一本會…", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "幾週前出版社打電話來系上邀書稿，嚇了一跳竟然是想出一本會展觀光相關的教科書，隨口問了編輯：在疫情期間為何要出版現在受影響的產業？出版社編輯答不上來，說是總編輯的意思。 事情沒什麼下", "len": 423, "body": "<p>幾週前出版社打電話來系上邀書稿，嚇了一跳竟然是想出一本會展觀光相關的教科書，隨口問了編輯：在疫情期間為何要出版現在受影響的產業？出版社編輯答不上來，說是總編輯的意思。<\/p>\n<p>事情沒什麼下文了，但是世紀瘟疫仍在蔓延中，相關的國家證照考試仍然不知人間疫苦地在辦理中，要不要去報名呢？<\/p>\n<p>如果同學有上過相關課程，對展覽推廣有興趣，這是經濟部國貿局辦理的合格證照，不是非常好考，但可以試試！總是不能畢業找工作時就附上單張大學畢業證書，就想與失業大軍競爭越來越少的工作。<\/p>\n<p>———————下面才是重點———————<\/p>\n<p>110年度國內會議展覽專業人員認證考試簡章已上線，請上金融研訓院網站查詢及報名。<\/p>\n<p>報名：110年6月11日(五)10:00至9月15日(三)17:00<\/p>\n<p>測驗日期： 110年10月17日(日)<\/p>\n<p>試務行政受託辦理單位：金融研訓院測驗中心<\/p>\n<p>聯絡電話:02-3365-3666按1<\/p>\n<p>服務時間：星期一至星期五9:00~17:30<\/p>\n<p>--&gt; 相關報名資訊請點留言處(外連至金融研訓院網站)<\/p>"}, {"id": "f1626936982", "date": "2021-07-22", "title": "從前天起就一直想起2014年到河南鄭州、洛陽、登封見學的…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "從前天起就一直想起2014年到河南鄭州、洛陽、登封見學的往事。家中祖先牌位上列示著客家人常見的【穎川】字堂，其實就代表著自己的姓氏來源應該就來自於附圖下方的穎水之傍，當年旅遊時有感", "len": 636, "body": "<p>從前天起就一直想起2014年到河南鄭州、洛陽、登封見學的往事。家中祖先牌位上列示著客家人常見的【穎川】字堂，其實就代表著自己的姓氏來源應該就來自於附圖下方的穎水之傍，當年旅遊時有感，此時大災時更是覺得難受。<\/p>\n<p>從台灣的電視中看不到太多的新聞，從對岸的資料中也讀不到太多的著墨。但是很清楚的是，此時此刻一定有數以萬計住在河南這幾個城市的家庭找不到親人，尋不著支援，看不到全貌。<\/p>\n<p>YT影片：鄭州四公里長京廣路隧道災情<\/p>\n<p><a href=\"https://www.youtube.com/watch?v=b8Z7WOTSRko&amp;t=3s\">https://www.youtube.com/watch?v=b8Z7WOTSRko&amp;t=3s<\/a><\/p>\n<p>河南鄭州及洛陽在地理位置上位處中原，是過往許多中國朝代的立都之地，但是黃河千年來的洪泛，也讓這兩座古都的地理位置是低於河道的。特別是的夏季的伏汛期，如果再加上這次的大雨，所有的水根本無處可去。<\/p>\n<p>水患可以是天災也可以是人為，1938年中日戰爭期間，國民黨軍隊就利用了黃河河道比地面高的特性，在戰略上選擇了以自然力量抵抗外來民族的侵略。的確在戰爭上當下爭取到了空間及時間上的緩衝，但是在平民百姓的生命及後續數年的農作影響上也有很多的爭議。<\/p>\n<p>WIKI: 花園口決堤事件：<a href=\"https://zh.wikipedia.org/wiki/%E8%8A%B1%E5%9B%AD%E5%8F%A3%E5%86%B3%E5%A0%A4%E4%BA%8B%E4%BB%B6\">https://zh.wikipedia.org/wiki/%E8%8A%B1%E5%9B%AD%E5%8F%A3%E5%86%B3%E5%A0%A4%E4%BA%8B%E4%BB%B6<\/a><\/p>\n<p>此時，二戰時期人事物均以事過境遷，但是河南洪災再起，人民受難，沒很在乎鴻海的鄭州廠，只在乎2014年見學認識的老鄉們一切安好。<\/p>"}, {"id": "f1624325953", "date": "2021-06-22", "title": "住林口最大的好處就是可以一直在人行道上跑步，其實這在日本…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "住林口最大的好處就是可以一直在人行道上跑步，其實這在日本或韓國，甚至是泰國、中國的任何城市都是輕而易舉的。 只有台灣幾乎所有的路都是設計給車走的，人行道是路旁店家住戶的車庫、花園或", "len": 347, "body": "<p>住林口最大的好處就是可以一直在人行道上跑步，其實這在日本或韓國，甚至是泰國、中國的任何城市都是輕而易舉的。<\/p>\n<p>只有台灣幾乎所有的路都是設計給車走的，人行道是路旁店家住戶的車庫、花園或雜貨區。傳統路邊市場買個菜都可以碰到騎車慢行的阿姨或阿伯坐在摩托車上喊價。多數在地居民幾乎都不走路，只是家旁10公尺的早餐店也要用騎車去買。什麼國華街、墾丁大街、日月潭等知名景區就是最好的例子，攤販及店家多層次地在騎樓賣小吃，遊客及當地人混在馬路逛街。亂成一團的照片上了日雜還自以為浪漫。<\/p>\n<p>難就難在看到問題了，如何去改善呢？<\/p>\n<p>從自身做起吧，不要再買摩托車，善用大眾交通工具或Ubike，短距離最好能多用走的；鼓勵有店面的商家消費，對有繳稅的商家多一點支持。在外地觀光旅遊時減少向攤販購買，轉向店家消費，鼓勵願意升級的人。<\/p>"}, {"id": "f1620531169", "date": "2021-05-09", "title": "在當老師之前，我給自己的工作原則是一份工作一定要做一年以…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "在當老師之前，我給自己的工作原則是一份工作一定要做一年以上，如果在同一份工作之中至少也要一年換一個單位讓自己時常跳離舒適圈；此外如果可以在正職中兼差(現在叫斜槓)在能力及時間之內一", "len": 321, "body": "<p>在當老師之前，我給自己的工作原則是一份工作一定要做一年以上，如果在同一份工作之中至少也要一年換一個單位讓自己時常跳離舒適圈；此外如果可以在正職中兼差(現在叫斜槓)在能力及時間之內一定努力嘗試，成敗論薪資，英雄出少年。<\/p>\n<p>在當老師之後，之前的工作經驗及勞動年資全面歸零，在教育環境中論輩論份長幼有序，重新再來；工作中以做多久來當基礎，離退休近不近當話語。最重視是否有升官升等，做的事年復一年相似重復，對於教的學生總聽到一年比一年差(也可能是自己教得一年比一年退步)。<\/p>\n<p>所以我努力在老師的環境中重新再起，2021取得部定副教授，年資也將進入15年，教學能力覺得年年退步，學生與學校都快成為歷史。<\/p>\n<p>將到50歲的自己，一定要再累積下一個能力，才有再起的機會。<\/p>"}, {"id": "f1588484079", "date": "2020-05-03", "title": "【OPEN CAMPUS】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【OPEN CAMPUS】 5/9(六)及5/16(六)醒吾旅運校園開放 ※時間：上午10點至12點 ※地點：新北市林口區醒吾科大觀餐大樓三樓旅運管理系 報名網址↓↓↓↓↓↓ ht", "len": 458, "body": "<p>【OPEN CAMPUS】<\/p>\n<p>5/9(六)及5/16(六)醒吾旅運校園開放<\/p>\n<p>※時間：上午10點至12點<\/p>\n<p>※地點：新北市林口區醒吾科大觀餐大樓三樓旅運管理系<\/p>\n<p>報名網址↓↓↓↓↓↓<\/p>\n<p><a href=\"https://forms.gle/gfZRU6CPWpimujEj7\">https://forms.gle/gfZRU6CPWpimujEj7<\/a><\/p>\n<p>※有興趣的同學及家長都可以來校參加<\/p>\n<p>※請先報名，以利掌握入校園人數<\/p>\n<p>※內容：<\/p>\n<p>09:50-10:00 報到(T306實習旅行社)<\/p>\n<p>10:10-10:50 系科入學方式及師資教學介紹<\/p>\n<p>10:50-11:10 參觀觀餐學院(各層教學設備開放介紹)<\/p>\n<p>11:10-11:15 Tea Break<\/p>\n<p>11:15-11:40 男女宿舍參觀(自由參加)<\/p>\n<p>11:40-12:00 用點心交流時間<\/p>\n<p>隨時現場空服同學及學長姊接待參觀校園<\/p>\n<p>歡迎填寫以下報名表，會有老師與同學連繫喔！！<\/p>\n<p>電話:0226015310分機 2131<\/p>\n<p>陳瑞峰老師<\/p>\n<p>孔令揚老師<\/p>\n<p>交通方式：自行開車可以停校園內<\/p>\n<p>公車：圓山捷運轉936<\/p>\n<p>疫情期間：請先報名登記，請自帶口罩及安全清潔相關均已完善<\/p>\n<p>報名網址↓↓↓↓↓↓<\/p>\n<p><a href=\"https://forms.gle/gfZRU6CPWpimujEj7\">https://forms.gle/gfZRU6CPWpimujEj7<\/a><\/p>"}, {"id": "f1586650279", "date": "2020-04-12", "title": "e-go台灣觀光巴士是很多旅運產業的現狀，這不是個案，是…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "e-go台灣觀光巴士是很多旅運產業的現狀，這不是個案，是台灣社會的明顯病徵，國家一定要重視協助；其實現在台灣的旅運產業早已支撐不住，多數企業中的受雇者都知道生意早已歸零，很多的司機", "len": 488, "body": "<p>e-go台灣觀光巴士是很多旅運產業的現狀，這不是個案，是台灣社會的明顯病徵，國家一定要重視協助；其實現在台灣的旅運產業早已支撐不住，多數企業中的受雇者都知道生意早已歸零，很多的司機及後勤工作者的家庭都是靠著活絡的旅行及交通在維持生計，很多企業主過去已盡力於社會責任，現在國家應有所反饋並協助企業中每個辛勞苦撐的家庭及企業主。<\/p>\n<p>日本、美國及中國的領導人為何在疫情的控管時總是考量再三，其實就是因為經濟的殺傷力，後續帶來的失業率對社會及國家的影響也是同樣巨大及深遠。所以全面的停班鎖國將會讓多數的企業出現危機，美國2020年3月起的失業人口數飆高將會對這個強國帶來多大的影響，是過去所有經濟分析都未及的模式。中國大陸在疫情可控之後便加緊復工復市也是同理。<\/p>\n<p>今日台灣並非擁有大型企業高稅捐社會福利國家，而是中小企業遍佈的對外貿易及服務業經濟體。台灣因為疫情控制得宜，多數產業仍努力維持中，但旅運產業的困境可不能視而不見。<\/p>\n<p>台灣中小型服務業活力就如同國家體內的免疫細胞一樣，更期待政府及政策能回饋點滴，整個國家才有機會重新恢復健康社會。<\/p>\n<h1>每日下午的個案分析很重要<\/h1>\n<h1>基層旅運業從業人員的生計更重要<\/h1>"}, {"id": "f1582589795", "date": "2020-02-25", "title": "有看過2016的奧斯卡最佳影片關鍵少數Hidden Fi…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "有看過2016的奧斯卡最佳影片關鍵少數Hidden Figures嗎? 真實世界的女主角凱薩琳·強森在昨天2/24離開人世，享年101歲。 Hidden Figures是我近年看過", "len": 473, "body": "<p>有看過2016的奧斯卡最佳影片關鍵少數Hidden Figures嗎?<\/p>\n<p>真實世界的女主角凱薩琳·強森在昨天2/24離開人世，享年101歲。<\/p>\n<p>Hidden Figures是我近年看過最感人的影片之一，也不斷地提醒著自己，身為人類不應該有國界、種族、膚色、性別及語言上的歧視與偏見。<\/p>\n<p>雖然身處的台灣處處都是！！<\/p>\n<p>Have you seen the \"Hidden Figures\", the best Oscar film in 2016?<\/p>\n<p>The real-world heroine Catherine G. Johnson passed away yesterday at the age of 101.<\/p>\n<p>Hidden Figures is one of the most touching films I've seen in recent years, and I keep reminding myself that as human beings, we should not have discrimination and prejudice on nations, race, color, gender, and language.<\/p>\n<p>RIP. Katherine G. J.<\/p>"}, {"id": "f1574034663", "date": "2019-11-18", "title": "中興大學特聘教授武東星說，這在比較晚改名科大的技術學院常…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "中興大學特聘教授武東星說，這在比較晚改名科大的技術學院常見。一旦技職司核准招生，各校就可以依據學位授予法自行授予學位，按照現行辦法，各校只要把招生辦法、授予學位的辦法報部核定即可，", "len": 374, "body": "<p>中興大學特聘教授武東星說，這在比較晚改名科大的技術學院常見。一旦技職司核准招生，各校就可以依據學位授予法自行授予學位，按照現行辦法，各校只要把招生辦法、授予學位的辦法報部核定即可，因此參與碩士口試的委員就要負起很大的責任。<\/p>\n<p><a href=\"https://udn.com/news/story/11320/4171083\">https://udn.com/news/story/11320/4171083<\/a><\/p>\n<p>很開心擔任教職至今，唯一一次參加的碩士論文口試委員會，就是參與最優秀美麗的玟妤教授所指導的中國文化大學國企所國際碩士班兩位印尼國際學生論文口試，學期間用全英文撰寫及口試，論文內容更是嚴謹專業。<\/p>\n<p>其實國家圖書館是會將口試委員的姓名完全公告在網路上的。有興趣可以上網查看看有台灣碩博士畢業的朋友姓名。<\/p>\n<p><a href=\"https://ndltd.ncl.edu.tw/cgi-bin/gs32/gsweb.cgi/ccd=CLB_28/webmge?mode=basic\">https://ndltd.ncl.edu.tw/cgi-bin/gs32/gsweb.cgi/ccd=CLB_28/webmge?mode=basic<\/a><\/p>"}, {"id": "f1569283636", "date": "2019-09-24", "title": "英國衛報真實報導", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "英國衛報真實報導 https://www.theguardian.com/business/2019/sep/22/thomas-cook-in-last-ditch-talks-", "len": 504, "body": "<p>英國衛報真實報導<\/p>\n<p><a href=\"https://www.theguardian.com/business/2019/sep/22/thomas-cook-in-last-ditch-talks-to-avoid-collapse\">https://www.theguardian.com/business/2019/sep/22/thomas-cook-in-last-ditch-talks-to-avoid-collapse<\/a><\/p>\n<p>新加坡商業時報報導<\/p>\n<p><a href=\"https://www.businesstimes.com.sg/consumer/top-shareholder-fosun-disappointed-over-thomas-cook-collapse\">https://www.businesstimes.com.sg/consumer/top-shareholder-fosun-disappointed-over-thomas-cook-collapse<\/a><\/p>\n<p>ThomasCook(1841-2019)破產的主因是因為債務破產，近因是拒絕中國巨擘Fosun的投資方案。但是否與自由行網路興起、英國脫歐、地球暖化等等其實在報導中是看不出來的......<\/p>\n<p>---------我是分隔線-------------<\/p>\n<p>以下是聯合報的文載<\/p>\n<p>英國衛報報導，湯瑪士庫克二○○七併購其他旅遊業者積欠大筆債務，加上近年來自由行興起，網路訂票訂位盛行，傳統旅行社經營模式受到嚴重考驗。近兩年歐洲熱浪影響旅遊人次，英國脫歐導致英鎊購買力下滑促使英國人減少出國，也是壓跨湯瑪士庫克的原因。<\/p>\n<p><a href=\"https://udn.com/news/story/6811/4064529\">https://udn.com/news/story/6811/4064529<\/a><\/p>"}, {"id": "f1560918895", "date": "2019-06-19", "title": "@[100002736346111:2048:巫佩君] …", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "@[100002736346111:2048:巫佩君] 同學妳上電視新聞了。 這位圖中的美麗大方的解說員是醒吾科大旅運管理系三年級在學同學 @[100002736346111:20", "len": 335, "body": "<p>@[100002736346111:2048:巫佩君] 同學妳上電視新聞了。<\/p>\n<p>這位圖中的美麗大方的解說員是醒吾科大旅運管理系三年級在學同學 @[100002736346111:2048:巫佩君] ，她很喜愛現場服務講解的工作，2018年曾在廈門靈玲馬戲團暑期見習二個月，口條清楚的她，當時還登上了廈門衛視的專題報導呢！！<\/p>\n<p>今年起，巫同學選擇了在醒吾林口的在地觀光工廠服務，希望將自己的熱情分享給所有的小朋友。<\/p>\n<p>這樣的學生真的很棒呀～～～<\/p>\n<h1>醒吾旅運系<\/h1>\n<p><a href=\"https://www.ettoday.net/news/20190618/1469962.htm?fbclid=IwAR3l3v6aGQ3xizEYxnDquUURBX17pk70wwR3cMXzHEa8p6OsawMu4kV5pow\">https://www.ettoday.net/news/20190618/1469962.htm?fbclid=IwAR3l3v6aGQ3xizEYxnDquUURBX17pk70wwR3cMXzHEa8p6OsawMu4kV5pow<\/a><\/p>"}, {"id": "f1560609194", "date": "2019-06-15", "title": "大目降Tavocan學習之旅：", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "大目降Tavocan學習之旅： 醒吾科大跨領域地方創生實驗班走讀踏查 一年前四位旅運系及觀光系的同學決定走一條與其他同學不一樣的學習之旅：醒吾科大跨領域地方創生實驗班。 沿路上我隨", "len": 569, "body": "<p>大目降Tavocan學習之旅：<\/p>\n<p>醒吾科大跨領域地方創生實驗班走讀踏查<\/p>\n<p>一年前四位旅運系及觀光系的同學決定走一條與其他同學不一樣的學習之旅：醒吾科大跨領域地方創生實驗班。<\/p>\n<p>沿路上我隨口問起是否會推薦學弟妹來嘗試不同的學習方式嗎？大家都沒有回答我，只隨口說要再想一想！！<\/p>\n<p>實驗班同學先親身了解一處有美麗老街的台南新化（大目降），身在台灣卻未曾踏足過的土地的臨場感，走讀了晉發米店、郡九街庄、濟得中藥房、新勝興布莊、梁道故居及長泰西藥房等改造實例；藉由當地拾荒流工作室、山海屯社會企業的真心分享與小組五感發想，燒腦討論下；五個工作組的同學，很快地對照了曾實地投身努力的林口舊街活動企劃，面對面地提出了可供參照的評估嘗試點。<\/p>\n<p>小文化村、社群媒介、老店故事記錄、短期青年返鄉、AR走讀體驗等等的有趣小提案，都讓在場3位老師很驚豔，當地社造者更期待有直接實習對接的可能性。<\/p>\n<p>36小時的南北實地走訪與體驗，再次證明行萬里路的重要性，但主動求知及跨域能力的思考力更是未來工作者的重要競爭力。<\/p>\n<p>同學們仍舊沒有回答我，因為大家都漸漸發現，只有去做去思考，才能面對未知的變化與未來；身為老師的我，更覺得二分法的問題，其實早已不適用已經進階的他們。<\/p>\n<p>而我何其有幸可以隨班附讀～～<\/p>\n<h1>郡九街庄<\/h1>\n<h1>新化<\/h1>\n<h1>回家說真新化<\/h1>\n<p><a href=\"https://www.facebook.com/5DesignAction\">https://www.facebook.com/5DesignAction<\/a><\/p>"}, {"id": "f1558429210", "date": "2019-05-21", "title": "北疆風情自駕十日遊~中國獨庫公路（最後一波報名至5/26…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "北疆風情自駕十日遊~中國獨庫公路（最後一波報名至5/26) 2019/5/30-6/9 參考班機:南方航空:去程CE640 回程CE639 費用: ➤自行購機烏魯木齊來回程機票費約", "len": 469, "body": "<p>北疆風情自駕十日遊~中國獨庫公路（最後一波報名至5/26)<\/p>\n<p>2019/5/30-6/9<\/p>\n<p>參考班機:南方航空:去程CE640 回程CE639<\/p>\n<p>費用:<\/p>\n<p>➤自行購機烏魯木齊來回程機票費約新台幣(30038)元，自行負擔大交通等旅平險不便。<\/p>\n<p>➤行程費用:三人一車(58400)元/人((三位客人+職業司機一人)含稅  (兒童36466/人不佔床，其他待遇同成人。酒店如產生早餐費自理，五歲兒童另議。)<\/p>\n<p>➤四人一車(66240元)/人(四位客人+職業司機一人)含稅，(兒童31900元/人不佔床，其他待遇同成人，酒店如產生早餐費自理，五歲兒童另議。)<\/p>\n<p>➤含餐宿門票表演費<\/p>\n<p>➤國外平安傷害險+乘車意外傷害險(50W)<\/p>\n<p>★以上金額計價皆以新台幣計價<\/p>\n<p>出行交通車輛:;SUV尼桑奇骏、本田CRV、丰田RAV4，租车费分别是600、650，丰田普拉多1000一天<\/p>\n<p>承辦單位：走吧网<\/p>\n<p>台灣區聯絡人:古樹仁  092001072<\/p>\n<p>委託單位:長伶股份有有限公司花蓮分公司<\/p>\n<p>實境分享<\/p>\n<p><a href=\"https://www.youtube.com/watch?time_continue=18&amp;v=VeFQecz66ZI\">https://www.youtube.com/watch?time_continue=18&amp;v=VeFQecz66ZI<\/a><\/p>"}, {"id": "f1558259954", "date": "2019-05-19", "title": "【國中會考】", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【國中會考】 家有國中生，雖然假日仍將看考題當成休息。 不知道有多少的家長會試著將國中生的題目寫寫看，再對應現在自己上課時所碰到的大專學生書寫閱讀能力，心中真實有感。 附件中是剛剛", "len": 633, "body": "<p>【國中會考】<\/p>\n<p>家有國中生，雖然假日仍將看考題當成休息。<\/p>\n<p>不知道有多少的家長會試著將國中生的題目寫寫看，再對應現在自己上課時所碰到的大專學生書寫閱讀能力，心中真實有感。<\/p>\n<p>附件中是剛剛出爐的國中會考國文題目，由單科就有13頁的考題中，再細讀各題文義及多題組的題目長度來看，很懷疑有多少國中生可以於70分鐘內讀完48題，平均每題只有一分半鐘可以回答完，含畫卡。並且完整地讀通思考如此長篇論述的題目，而其答案也如同題目一樣相似又複雜地期待學生找出中文的複雜文義。<\/p>\n<p>以第一題來說，實際上就是4小題的組合題，題目如下：<\/p>\n<p>「『饕餮』是一種古代怪獸,在生物圖鑑與動物園裡找不到,牠和蛟龍、鳳凰一樣,都是虛構的動物,□存在文化裡,□□活靈活現,□□有鮮明的圖樣形象,□繁殖出豐富的語意象徵。」根據文意脈絡,空格處依序填入下列何者最恰當?<\/p>\n<p>(A)雖/竟然/除了/卻 (B)但/可是/僅僅/也<\/p>\n<p>(C)乃/尚且/居然/與 (D)只/但卻/不只/還<\/p>\n<p>請問有爸爸媽媽可以在拿到考卷很緊張的1分半鐘內正確完成此題嗎？<\/p>\n<p>在抖音15秒、Twitter只有140字符的世界閱讀趨勢下，我覺得國文的考題並沒有呈現出明確的中文能力鑑別度，只像一個出題者炫耀語文運用能力的出題舞台，更甚之有以考倒台灣15歲孩子為樂之感。<\/p>\n<h1>其實我這篇字太多學生不會看<\/h1>\n<h1>臉書最適合的文字數為零<\/h1>\n<h1>圖片與影音才是當代王道<\/h1>\n<p><a href=\"https://drive.google.com/file/d/1iBGKtW2dzfcTU-OuEWeIs5a_vbUW5Kqs/view\">https://drive.google.com/file/d/1iBGKtW2dzfcTU-OuEWeIs5a_vbUW5Kqs/view<\/a><\/p>"}, {"id": "f1550971720", "date": "2019-02-24", "title": "阿狗與我晚上一起跑步時問起了七年級國文課的新詩作者吳晟，…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "阿狗與我晚上一起跑步時問起了七年級國文課的新詩作者吳晟，他說詩詞內容令他很有感觸！尤其是陀螺的那句完全形容了他眼中的我！我隨口說起了吳晟是彰化知名的台灣鄉土文學家，作品很多，建議他", "len": 459, "body": "<p>阿狗與我晚上一起跑步時問起了七年級國文課的新詩作者吳晟，他說詩詞內容令他很有感觸！尤其是陀螺的那句完全形容了他眼中的我！我隨口說起了吳晟是彰化知名的台灣鄉土文學家，作品很多，建議他可以上網找來看！<\/p>\n<p>回家後實在好奇隨手查一下，其實我不讀詩的，因為總覺得將俗事寄詞附文強説心愁，不是現在這階段角色應該的！但是此時此刻讀詩倒也是搭著冬雨靜夜的好選擇⋯⋯<\/p>\n<p>負荷---吳晟<\/p>\n<p>下班之後，便是黃昏了。<\/p>\n<p>偶爾也望一望絢麗的晚霞，<\/p>\n<p>卻不再逗留。<\/p>\n<p>因為你們仰向阿爸的小臉，<\/p>\n<p>透露更多的期待。<\/p>\n<p>加班之後，便是深夜了。<\/p>\n<p>偶爾也望一望燦爛的星空，<\/p>\n<p>卻不再沉迷。<\/p>\n<p>因為你們熟睡的小臉，<\/p>\n<p>比星空更迷人。<\/p>\n<p>阿爸每日每日地上下班，<\/p>\n<p>有如自你們手中使勁拋出的陀螺，<\/p>\n<p>繞著你們轉呀轉；<\/p>\n<p>將阿爸激越的豪情，<\/p>\n<p>逐一轉為綿長而細密的柔情。<\/p>\n<p>就像阿公和阿媽，<\/p>\n<p>為阿爸織就了一生<\/p>\n<p>綿長而細密的呵護。<\/p>\n<p>孩子呀﹗阿爸也沒有任何怨言。<\/p>\n<p>只因這是生命中<\/p>\n<p>最沉重<\/p>\n<p>也是最甜蜜的負荷。<\/p>\n<p>------------分隔線-------------<\/p>\n<p>聽說這篇課文在我國一(1984)就已經收錄在國文課本中，可是我完全沒有印象，是真的嗎？<\/p>"}, {"id": "f1550843018", "date": "2019-02-22", "title": "離導遊領隊考試剩下15天。", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "離導遊領隊考試剩下15天。 醒吾旅運系的LINE群中提問了一個連老師都會寫錯的題目，因為自民國105年起國內外團體旅遊定型化契約修改了不少內容。以圖中的31題為例，考的是如果旅客在", "len": 343, "body": "<p>離導遊領隊考試剩下15天。<\/p>\n<p>醒吾旅運系的LINE群中提問了一個連老師都會寫錯的題目，因為自民國105年起國內外團體旅遊定型化契約修改了不少內容。以圖中的31題為例，考的是如果旅客在國外被旅行社放鴿子(旅行業棄置或留滯旅客)，其賠償依全部旅遊費用除以全部旅遊日數乘以棄置或留滯日數後相同金額的倍數違約金有三種可能：故意(5倍)、重大過失(3倍)、過失(1倍)。<\/p>\n<p>考試時就是找關鍵字。這題是重大過失，所以是賠旅遊平均天數金額的３倍。<\/p>\n<p>三萬的五天日本團，平均一天為30000/5=6000元<\/p>\n<p>如果是【故意】是賠5倍，2天算式是<\/p>\n<p>6000<em>2<\/em>5=60000<\/p>\n<p>如果是【重大過失】是賠3倍，這次是2天，所以算式是<\/p>\n<p>6000<em>2<\/em>3=36000<\/p>\n<p>如果是【過失】是賠1倍，2天的算式是<\/p>\n<p>6000*2=12000<\/p>\n<p>以前是一律賠5倍<\/p>"}, {"id": "f1550239654", "date": "2019-02-15", "title": "再22天就要考領隊導遊國家考試了，醒吾科大旅運系考前班L…", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "再22天就要考領隊導遊國家考試了，醒吾科大旅運系考前班LINE群中同學提問了一題很不錯的考古題，其中有三個很容易混淆的法律觀點，請同學參考。 此題解題可以由三部分來分析： 一、旅客", "len": 418, "body": "<p>再22天就要考領隊導遊國家考試了，醒吾科大旅運系考前班LINE群中同學提問了一題很不錯的考古題，其中有三個很容易混淆的法律觀點，請同學參考。<\/p>\n<p>此題解題可以由三部分來分析：<\/p>\n<p>一、旅客與旅行業之間沒有簽約<\/p>\n<p>此部分是旅行業本身的【違規】行為，觀光局可以針對旅行社本身處罰１～５萬之罰款，但是旅客是拿不到任何錢的。<\/p>\n<p>（所以此題不用管這１萬元）<\/p>\n<p>二、旅行社在行前七日前以團體人數不足取消行程<\/p>\n<p>此部分因為旅行社用了團體人數不足的理由取消，所以不能適用2-20天之間的30%(35000*0.35=10500)的對旅客的賠款。<\/p>\n<p>(也就是想太多的同學會錯在這兒)<\/p>\n<p>三、旅客有先付了５千元的定金<\/p>\n<p>此部分在考【民法249條定金】第三款的規範：契約因可歸責於受定金當事人之事由，致不能履行時，該當事人應加倍返還其所受之定金。這才是此題在考的重點，老師課堂中未曾說到過，會錯很合理。<\/p>\n<p>(返還5000元定金，因為團體人數不足是受定金當事人-旅行社的事由，所以要再加5000元給旅客)<\/p>"}, {"id": "f1545358642", "date": "2018-12-21", "title": "30個經典小鎮入選名單：", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "30個經典小鎮入選名單： 北部： 基隆市中正區（海角新樂園無障礙優質行程） 宜蘭市（文教城市） 宜蘭頭城（全台為一路海空3D旅遊小鎮） 台北北投（享受溫泉泡湯） 台北大稻埕（老街區", "len": 427, "body": "<p>30個經典小鎮入選名單：<\/p>\n<p>北部：<\/p>\n<p>基隆市中正區（海角新樂園無障礙優質行程）<\/p>\n<p>宜蘭市（文教城市）<\/p>\n<p>宜蘭頭城（全台為一路海空3D旅遊小鎮）<\/p>\n<p>台北北投（享受溫泉泡湯）<\/p>\n<p>台北大稻埕（老街區如城市博物館）<\/p>\n<p>新北瑞芳（水金九礦山祕境）<\/p>\n<p>新北坪林（品茗勝地）<\/p>\n<p>桃園大溪（總統鎮老街區）<\/p>\n<p>新竹關西（九降風、仙草飄香）<\/p>\n<p>新竹市舊城區（竹塹古蹟）<\/p>\n<p>中部：<\/p>\n<p>苗栗苑裡（藺草編織）<\/p>\n<p>苗栗公館（紅棗故鄉黃金小鎮）<\/p>\n<p>南投集集（鐵馬漫遊鐵道及綠色隧道）<\/p>\n<p>台中新社（菇果花香賞螢趣）<\/p>\n<p>彰化田尾（公路花園）<\/p>\n<p>彰化鹿港（見證工藝之美）<\/p>\n<p>雲林北港（燈會原鄉及擁有歷史文化的百年藝術城鎮）<\/p>\n<p>南部：<\/p>\n<p>嘉義市東區（檜意文創生活圈）<\/p>\n<p>嘉義梅山（茶園、茶香之美）<\/p>\n<p>台南鹽水（蜂炮慶典）<\/p>\n<p>台南後壁（稻米的故鄉）<\/p>\n<p>屏東東港（迎王文化及美食）<\/p>\n<p>屏東恆春（古鎮海角風光）<\/p>\n<p>花東、離島：<\/p>\n<p>台東縣成功鎮（無敵山海景及漁村風光）<\/p>\n<p>花蓮縣瑞穗鄉（泡湯、泛舟，品嚐茶香乳香咖啡香）<\/p>\n<p>澎湖縣湖西鄉（海島度假、悠閒漁村）<\/p>\n<p>金門縣烈嶼鄉（穿梭古今重現戰地時光）<\/p>\n<p>連江縣北竿鄉（特有閩東建築）<\/p>"}, {"id": "f1542168560", "date": "2018-11-14", "title": "當大學校園中在教行銷流通、包裝設計、網路電商等等課程時，…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "當大學校園中在教行銷流通、包裝設計、網路電商等等課程時，同時也在推展環境保護、減塑減碳、在地創生等等課程。中午上班族們外食時用了環保碗筷時，順便手機上下個單不也是一樣的情形。 很心", "len": 315, "body": "<p>當大學校園中在教行銷流通、包裝設計、網路電商等等課程時，同時也在推展環境保護、減塑減碳、在地創生等等課程。中午上班族們外食時用了環保碗筷時，順便手機上下個單不也是一樣的情形。<\/p>\n<p>很心酸！<\/p>\n<p><a href=\"https://tw.news.yahoo.com/%E9%9B%9911%E7%8B%82%E6%AD%A1%E8%B3%BC%E7%89%A9%E5%BE%8C-%E9%82%A3%E4%BA%9B%E4%BD%A0%E7%84%A1%E6%B3%95%E6%83%B3%E5%83%8F%E7%9A%84%E5%8C%85%E8%A3%9D%E7%94%9F%E6%85%8B%E7%81%BD%E9%9B%A3-130000916.html\">https://tw.news.yahoo.com/%E9%9B%9911%E7%8B%82%E6%AD%A1%E8%B3%BC%E7%89%A9%E5%BE%8C-%E9%82%A3%E4%BA%9B%E4%BD%A0%E7%84%A1%E6%B3%95%E6%83%B3%E5%83%8F%E7%9A%84%E5%8C%85%E8%A3%9D%E7%94%9F%E6%85%8B%E7%81%BD%E9%9B%A3-130000916.html<\/a><\/p>"}, {"id": "f1542088700", "date": "2018-11-13", "title": "義大利Fincantieri造船廠將郵輪技術轉移給中國造…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "義大利Fincantieri造船廠將郵輪技術轉移給中國造船，中國制造又更進一步。以基隆為夏季母港的盛世公主號就是2017年Fincantieri造船廠的產品。 其實空中巴士在199", "len": 468, "body": "<p>義大利Fincantieri造船廠將郵輪技術轉移給中國造船，中國制造又更進一步。以基隆為夏季母港的盛世公主號就是2017年Fincantieri造船廠的產品。<\/p>\n<p>其實空中巴士在1994年之後中國也有造A330及A320飛機的工廠，而且市佔率也達到50%！<\/p>\n<p>Italian Fincantieri transferred cruise ship technology to China State Shipbuilding, and China manufacturing went further. The Majestic Princess, with Keelung as its home port in summer, is the product of Fincantieri in 2017.<\/p>\n<p>In fact, since 1994, China also has the factory of A330 and A320 aircraft, and the market share will be more than 50%!<\/p>\n<p><a href=\"https://news.sina.com.tw/article/20181107/28746412.html\">https://news.sina.com.tw/article/20181107/28746412.html<\/a><\/p>"}, {"id": "f1538215758", "date": "2018-09-29", "title": "昨天2018.9.28，印尼的東方大島蘇拉威西島發生大地…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "昨天2018.9.28，印尼的東方大島蘇拉威西島發生大地震，隨之而來的大海嘯更造成了難以回復的傷害，因為這兒不是日本，也不是韓國，所以我們台灣的新聞可能只報一次，就完全不聞不問。 ", "len": 495, "body": "<p>昨天2018.9.28，印尼的東方大島蘇拉威西島發生大地震，隨之而來的大海嘯更造成了難以回復的傷害，因為這兒不是日本，也不是韓國，所以我們台灣的新聞可能只報一次，就完全不聞不問。<\/p>\n<p>蘇拉威西島Sulawesi有18萬平方公里，是台灣的5倍大，比英國本島小一點點而已，住有1700萬人，多數是穆斯林。地震與海嘯對於居住在主要居住在海邊的居民影響一定非常大，現在的死傷人數只是官方的數字，這區域有很多地方是難以與外界連繫的，所以慘劇發生後也許數個月才會有消息傳出來。就像同學們都記得日本東北的大地震，但是如果提起了差不到幾年的南亞大地震、四川大地震，知道的同學一定少上許多。<\/p>\n<p>醒吾校園中有很多的印尼同學，因為印尼種族很多，語言及經濟能力各有不同，現在校園中的同學多半來自城市，這次的蘇拉威西島是相對落後的區域。印尼對台灣人而言可能對多的印象是觀光盛地峇里島，蘇拉威西島就在峇里島的北方，而且大上很多很多，也許你以前不知道，現在你可以關心一下，因為或許這樣的大震或海嘯不知道何時就會再臨台灣。<\/p>\n<p><a href=\"https://global.udn.com/global_vision/story/8662/3393667\">https://global.udn.com/global_vision/story/8662/3393667<\/a><\/p>"}, {"id": "f1538128369", "date": "2018-09-28", "title": "新加坡教育部將減少國小至國中10年級的期中考試次數，以因…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "新加坡教育部將減少國小至國中10年級的期中考試次數，以因應新時代的巨大改變。 未來將努力將學生導向對日常課程及學習活動有學習勤勉、好奇、合作、熱情等PLO積極學習為主，而非以學業成", "len": 606, "body": "<p>新加坡教育部將減少國小至國中10年級的期中考試次數，以因應新時代的巨大改變。<\/p>\n<p>未來將努力將學生導向對日常課程及學習活動有學習勤勉、好奇、合作、熱情等PLO積極學習為主，而非以學業成績為導向。<\/p>\n<p>“On the ground, teachers are on a high-speed train ... rushing, assessments, and preparing the students for exams,” he said. “I think it’s time to take a pause.”<\/p>\n<p>The selection of both awards at these levels will no longer be based on academic scores, said MOE. Instead, the eligibility criteria will be adjusted to recognize “positive learning orientations” such as diligence, curiosity, collaboration and enthusiasm in daily lessons and learning activities.<\/p>\n<p>Read more at <a href=\"https://www.channelnewsasia.com/news/singapore/exams-assessments-scrap-mid-year-primary-secondary-schools-10767370\">https://www.channelnewsasia.com/news/singapore/exams-assessments-scrap-mid-year-primary-secondary-schools-10767370<\/a><\/p>"}, {"id": "f1532502316", "date": "2018-07-25", "title": "馬不停蹄的君瀾酒店集團", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "7/24-25 馬不停蹄的君瀾酒店集團 杭州市的第二天及第三天，進行君瀾酒店集團（NARADA HOTEL GROUP）等四間企業的學生見習訪視。 君瀾酒店雖然是未上市公司，但是其", "len": 598, "body": "<p>7/24-25<\/p>\n<p>馬不停蹄的君瀾酒店集團<\/p>\n<p>杭州市的第二天及第三天，進行君瀾酒店集團（NARADA HOTEL GROUP）等四間企業的學生見習訪視。<\/p>\n<p>君瀾酒店雖然是未上市公司，但是其下酒店遍佈浙江、海南、雲南、上海、重慶、江蘇、湖北、江西、安徽、福建和山西等11個省市，投資管理了50餘家酒店，客房總數逾15000間。今日總部HR徐總監更提到君瀾正以每年25家管理簽約酒店的速度以驚人的速度成長中。也因此，對酒店人力資源有著巨大的需求。<\/p>\n<p>七月的見習生分別來自於文化、靜宜的研究生；暨大、義大、醒吾等15位同學，工作上有集團內的人事專員、行政產品企劃、中西餐飲服務員等等。同學們在工作上都適應上手，且收獲頗豐。其中更有位同學參與了HRD年會活動與總監一共見視了全國的人力資源主管的大場面。<\/p>\n<p>杭州的天氣仍舊酷熱潮溼，也辛苦了不少需要每天交通於住宿及工作崗位上的同學們。一個月的見習更將於下週二結束，能夠有機會來到浙江省省會杭州生活與工作，應該是2018年最難忘的一個暑期規劃。<\/p>\n<p>杭州市容就像個大花園，處處綠意，電動車、公交車、地鐵四通八達。一點也看不出來是個在籍人口近千萬的大城市，阿里巴巴、螞蟻金服、網易等知名電商公司都設在杭州，工作人口約估有二千萬人，所以商業、經濟、工作、旅遊都是江南最進步的城市之一。在千年的西湖邊，我想同學們與我都感受到了杭城千年不變的美景之下，有著跳躍式的發展，並以難以理解的速度在前進著。<\/p>"}, {"id": "f1532358720", "date": "2018-07-23", "title": "大暑日，杭州酷暑", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "7/23大暑日，杭州酷暑 昨天台風好像對太陽不會有任何的影響，一早的新聞就不斷地提醒杭州出門要防曬暑氣旺盛！ 尤其是今天要訪視的是杭州當地知名的宋城娛樂集團，同學們有些人是室外工作", "len": 799, "body": "<p>7/23大暑日，杭州酷暑<\/p>\n<p>昨天台風好像對太陽不會有任何的影響，一早的新聞就不斷地提醒杭州出門要防曬暑氣旺盛！<\/p>\n<p>尤其是今天要訪視的是杭州當地知名的宋城娛樂集團，同學們有些人是室外工作，有些是要穿古裝進行推廣的，有些是酒店大堂服務，當然也有餐飲的服務工作，一共有暨南、澎科、宜蘭、靜宜、醒吾、文化、景文7校14位同學分別宋城集團中的第一世界酒店及宋城主題園見習。<\/p>\n<p>宋城集團是在深圳成指上市的公司，前稱為杭州宋城旅遊發展股份有限公司，成立於1994年9月，於2014年3年更為宋城演藝發展股份有限公司，總部就位於浙江省杭州市，主要經營主題公園及旅遊文化演藝的投資、開發、經營業務。2017年的集團年營收約為150億新台幣，其主要的客源多以大陸地區的遊客為主，所以整體的主題園設計也是朝向大陸遊客喜愛的模式來進行。<\/p>\n<p>同學們來此見習簡單說是一種接地氣的過程，了解13億消費者的特質，面對來自各省的見習生，更要面對杭州七月不同於台灣海洋氣候的爆熱暑氣！住得環境、吃的內容都與台灣家鄉有所不同。訪視後期二位男同學正忙完了活動舞台的準備工作才能與我們一同照相說上話。如果細看，可以看到黑色的衣服上有著白色的鹽漬！在此真的要為同學們願意跳離舒適圏的努力再按個讚！<\/p>\n<p>此次二個提供見習機會的宋城集團企業主管及同事們都盡力關心照顧同學，台灣同學都有感受到人事單位及同事們對他們的照顧，宋城主題園食堂的菜色同學也覺得合口味；休假期間坐公交車到處逛逛、坐火車最遠也去了上海旅遊。在此真的要說，常有人說台灣的學生沒有狼性，我自覺台灣的學生有人性，有溫度，我們的餐旅技職教育落實在這些同學的一舉一動之中，有禮貌、有氣度、有智慧都是狼做不到的。同學們擁有的是舉手投足間的智慧與氣質。真以身為他們的老師感到驕傲。<\/p>\n<p>宋城財務報告<a href=\"http://www.cninfo.com.cn/finalpage/2018-03-28/1204526200.PDF\">http://www.cninfo.com.cn/finalpage/2018-03-28/1204526200.PDF<\/a><\/p>"}, {"id": "f1532266871", "date": "2018-07-22", "title": "乘著風飛往杭州，一早廈門登機口中往上海的航班一一取消了！…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "7/22乘著風飛往杭州，一早廈門登機口中往上海的航班一一取消了！我們是在聽著颱風警報的緊張中，順利地聽到登機通知，只有延誤了半小時就順利進了空橋往下一站杭州出發。 來接機的是五星級", "len": 464, "body": "<p>7/22乘著風飛往杭州，一早廈門登機口中往上海的航班一一取消了！我們是在聽著颱風警報的緊張中，順利地聽到登機通知，只有延誤了半小時就順利進了空橋往下一站杭州出發。<\/p>\n<p>來接機的是五星級開元名都五星酒店的見習生及人資專員李世磊，世磊是河南科技學院的旅遊系畢業生，也是因為實習表現優秀而留在杭州工作，所以此次酒店的輔導工作由他來安排，從同學的反應都可以感受得到同學與酒店同事相處融洽！當然在各項的安排上也可以感覺到他對此份工作的熱愛。<\/p>\n<p>酒店中有四位來自東部宜大、中部靜宜、南部高餐及離島澎科的同學，分屬禮賓接待部及吧台服務！對於兩岸文化的差異與管理風格不同都有深刻地體會！她們還特別提醒要來見習的同學要減肥，因為酒店的制服都非常小件，穿不進去就沒機會站櫃台了。<\/p>\n<p>座談後再與酒店高層主管分享溝通時，無論是金總經理及人資呂總監均因為同學的細膩服務與滿心的熱忱而對台灣餐旅教育多所肯定，更是期待同學未來如有意願加入開元的行列，是非常歡迎的！<\/p>\n<p>明天兩位吧台部的同學將參加開元名都酒店企業內已有13年歷史的全集團服務競賽！祝福他們辛苦的練習將會有好成績！<\/p>"}, {"id": "f1531745372", "date": "2018-07-16", "title": "暴雨⛈️中的慕田峪長城", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "暴雨⛈️中的慕田峪長城 在KKDAY上訂好的長城一日遊，當時是看天氣預報說會好天氣才下訂的！結果人算不如天算！ 一早6:50集合時街道已經積水，大巴也停不進來！大巴一路上到處去接各", "len": 472, "body": "<p>暴雨⛈️中的慕田峪長城<\/p>\n<p>在KKDAY上訂好的長城一日遊，當時是看天氣預報說會好天氣才下訂的！結果人算不如天算！<\/p>\n<p>一早6:50集合時街道已經積水，大巴也停不進來！大巴一路上到處去接各國的落湯雞！延途樹倒水淹，髙速路也改限速60公里！我安慰家人至少我們坐在車上遊車「河」！逛京城！還可以練習英文解說聽力訓練！<\/p>\n<p>9:30到了長城懷柔區山腳下！雨仍在下！景區的領導來電說打雷了䌫車暫停服務！我們都在車上等雨停，同時聽著導遊解釋，後來連導遊都説門票可以退！纜車🚡費也可以退！（我要讚美一下這家地接MUBUS服務專業周到，年輕妹妹導遊英文超好不説，處處為客人安全著想，更安排了座椅供客人休息！）<\/p>\n<p>十點多雨突然變小了天也漸漸清了，導遊誏我下了車建議我們可以用走的上山，在1000多個階梯的挑戰之下，我們汗水淋漓地登上長城10號烽火台，迎接我們的是雲開霧散的美麗慕田峪長城！<\/p>\n<p>後面就不說了！行程結束後請再度下起暴雨，路上全是積水及走不動車陣，連台灣都有新聞報導！<\/p>\n<p><a href=\"http://www.chinanews.com/m/gn/2016/07-21/7946445.shtml\">http://www.chinanews.com/m/gn/2016/07-21/7946445.shtml<\/a><\/p>"}, {"id": "f1530249011", "date": "2018-06-29", "title": "這和昨天在廣播聽到的某遊日部落客在節日中大聲地吹噓，可以…", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "這和昨天在廣播聽到的某遊日部落客在節日中大聲地吹噓，可以在日本瘋狂網購，請最後一天的飯店櫃台代收，再一併打包回台的行為，差不多只是上游與下游的行為而已。 學旅遊的同學，不要做這樣的", "len": 384, "body": "<p>這和昨天在廣播聽到的某遊日部落客在節日中大聲地吹噓，可以在日本瘋狂網購，請最後一天的飯店櫃台代收，再一併打包回台的行為，差不多只是上游與下游的行為而已。<\/p>\n<p>學旅遊的同學，不要做這樣的事！<\/p>\n<p>我以前也是在行政院附近上班呀！<\/p>\n<p><a href=\"https://today.line.me/tw/pc/article/%E8%A1%8C%E6%9D%8E%E8%B6%85%E9%87%8D%E9%A3%86%E7%BD%B5%E6%97%A5%E5%9C%B0%E5%8B%A4+%E5%8F%B0%E5%A5%B3%E8%BD%9F%EF%BC%9A%E6%88%91%E5%9C%A8%E8%A1%8C%E6%94%BF%E9%99%A2%E4%B8%8A%E7%8F%AD-zG9GM7\">https://today.line.me/tw/pc/article/%E8%A1%8C%E6%9D%8E%E8%B6%85%E9%87%8D%E9%A3%86%E7%BD%B5%E6%97%A5%E5%9C%B0%E5%8B%A4+%E5%8F%B0%E5%A5%B3%E8%BD%9F%EF%BC%9A%E6%88%91%E5%9C%A8%E8%A1%8C%E6%94%BF%E9%99%A2%E4%B8%8A%E7%8F%AD-zG9GM7<\/a><\/p>\n<h1>飯店櫃台不是大樓管理員<\/h1>\n<h1>飯店收大量的包裝紙箱及垃圾不是天經地義<\/h1>\n<h1>不要留下自己舊的行李箱在海外因為那種垃圾很難處理<\/h1>"}, {"id": "f1529292878", "date": "2018-06-18", "title": "醒吾科大周燦德校長表示，觀餐學院學生主動積極參與培訓，足…", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "醒吾科大周燦德校長表示，觀餐學院學生主動積極參與培訓，足足花了三、四個月認真準備，態度讓人感動；幾位負責老師利用課餘時間細心指導，更是令人感佩。 旅運管理系三年級學生陳思柔提到，能", "len": 310, "body": "<p>醒吾科大周燦德校長表示，觀餐學院學生主動積極參與培訓，足足花了三、四個月認真準備，態度讓人感動；幾位負責老師利用課餘時間細心指導，更是令人感佩。<\/p>\n<p>旅運管理系三年級學生陳思柔提到，能夠同時取得華語導遊和領隊證照，感謝學校充沛的軟硬體支援，以及老師不辭辛勞的細心指導；為了完成投身旅遊產業的目標，以實現探索世界的畢生夢想，考取國家證照只是第一步，未來希望能夠透過學校四年級的全時實習課程，選擇優質合作廠商進行實習，更進一步朝規劃方向踏實前進。<\/p>\n<h1>這不是廣告文<\/h1>\n<h1>來自新竹的陳思柔同學表示<\/h1>\n<h1>觀光餐旅大樓其實不是在這兒<\/h1>\n<h1>瑞士逼和巴西<\/h1>\n<p>@[100000699948600:2048:陳思柔]、@[100001806441898:2048:曾子薰]<\/p>"}, {"id": "f1523170133", "date": "2018-04-08", "title": "(45歲、44歲、11歲)2017 年，16 至 64 …", "cat": "老後提案", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "(45歲、44歲、11歲)2017 年，16 至 64 歲的工作年齡人口開始下降，支撐社會的人越來越少。 (46歲、45歲、12歲)2018 年，高齡人口占比超過 14%，臺灣正式", "len": 493, "body": "<p>(45歲、44歲、11歲)2017 年，16 至 64 歲的工作年齡人口開始下降，支撐社會的人越來越少。<\/p>\n<p>(46歲、45歲、12歲)2018 年，高齡人口占比超過 14%，臺灣正式進入高齡社會。<\/p>\n<p>(48歲、47歲、14歲)2020 年，扶養比高達 40.7，每 2.5 人就要扶養 1 人。<\/p>\n<p>(50歲、49歲、16歲)2022 年，獨居戶預計將突破 300 萬戶。<\/p>\n<p>(53歲、52歲、19歲)2025 年，臺灣總人口數開始減少。<\/p>\n<p>(54歲、53歲、20歲)2026 年，高齡人口占比超過 20%，臺灣進入超高齡社會。失智症人口預估約有 38 萬人，平均每 40 分鐘增加 1 名患者。<\/p>\n<p>(56歲、55歲、22歲)2028 年，18 歲人口約只剩 15 萬人，大學招生不足額已成家常便飯。<\/p>\n<p>(58歲、57歲、24歲)2030 年，每 4 人就有 1 名高齡者，幼年人口卻只有老年人口的一半。<\/p>\n<p>(62歲、61歲、28歲)2034 年，全國每 2 人就有 1 人超過 50 歲。<\/p>\n<p>(68歲、67歲、34歲)2040 年，老年人口占比超過 30%，工作年齡人口占比跌破 60%，扶養比超過 65。<\/p>\n<p>(78歲、77歲、44歲)2050 年，未滿 15 歲人口不到總人口 10%，而每 5 名高齡者就有 1 名超過 80 歲。<\/p>"}, {"id": "f1522196692", "date": "2018-03-28", "title": "社團法人台灣國際郵輪協會ICCT", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "社團法人台灣國際郵輪協會ICCT 2018郵輪進階專修班 開始招生 2018年郵輪進階專修班 教育訓練網站 http://www.go2free.com.tw/icct/index", "len": 299, "body": "<p>社團法人台灣國際郵輪協會ICCT<\/p>\n<p>2018郵輪進階專修班 開始招生<\/p>\n<p>2018年郵輪進階專修班 教育訓練網站<\/p>\n<p><a href=\"http://www.go2free.com.tw/icct/index.html\">http://www.go2free.com.tw/icct/index.html<\/a><\/p>\n<p>報名方式<\/p>\n<p><a href=\"http://www.go2free.com.tw/icct/2018rules.pdf\">http://www.go2free.com.tw/icct/2018rules.pdf<\/a><\/p>\n<p>台灣國際郵輪協會官方網站<\/p>\n<p><a href=\"http://www.icctw.com.tw/\">http://www.icctw.com.tw/<\/a><\/p>\n<p>課程及師資陣容<\/p>\n<p><a href=\"http://www.go2free.com.tw/icct/images/teachers.jpg\">http://www.go2free.com.tw/icct/images/teachers.jpg<\/a><\/p>\n<p>招生對象<\/p>\n<p>領有執業證之導遊及領隊<\/p>\n<p>觀光相關科系含觀光、餐旅、休閒管理及外語科系在學學生及在職教師<\/p>\n<p>旅遊業、郵輪業、旅館業及休閒觀光產業從業人員<\/p>"}, {"id": "f1521784970", "date": "2018-03-23", "title": "【拒絕的勇氣需要培養】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【拒絕的勇氣需要培養】 看完了小熊媽的分享，想起了念國中二年級時曾經發生在我身上的事件。 多年前的國中全都是男生，全校分為Ａ＋班、Ａ段班及Ｂ段班（這三種班我都念過，以後有機會再分享", "len": 803, "body": "<p>【拒絕的勇氣需要培養】<\/p>\n<p>看完了小熊媽的分享，想起了念國中二年級時曾經發生在我身上的事件。<\/p>\n<p>多年前的國中全都是男生，全校分為Ａ＋班、Ａ段班及Ｂ段班（這三種班我都念過，以後有機會再分享）。國二時我是Ａ段班的學生，當時的班導師現是已退休知名高中校長。<\/p>\n<p>我的成績不差，所以擔任了班導師某一門課的小老師，負責登記成績及協助老師改考卷。改完考卷登記好成績之後，就是換老師打人的時間，打手心、打屁股、拉臉頰、半蹲等等，什麼花樣都有。所以有考試的每一位同學都會怕，改考卷登記成績的人也會怕。如果搞錯成績同學會被打錯次數，到時上下裡外都不是人。<\/p>\n<p>同學們常來找我要求改點小錯，多半是看錯總是可以在老師下手前修改，麻煩又煩心但是難以回絕！現在想想這為什麼是在讀書的學生的事，這根本是老師在偷懶。<\/p>\n<p>有一天大條的事情總會來的。<\/p>\n<p>一位班上大哥級的同學，根本考得很差，情況就是一定會被打到屁股黑青，他在中午午休來找我「討論」，要我的答案讓他重抄！我不願意，可是我也怕他校外找我麻煩，這是我在國中一年級Ｂ段班鬼混時學來的，人要看勢，要低頭。<\/p>\n<p>事情過了幾天，心中很不快，也很擔心，書也念不下，覺也睡不好！導師後來出現了，將我與他叫去了學校年級的教師辦公室（很大間，很多老師都在的那一種）。<\/p>\n<p>老師說；他不相信那位同學可以考得好，問我是否有協助幫忙改答案？<\/p>\n<p>我很害怕，看了看國中同學後，他也點頭，我也就點頭承認！<\/p>\n<p>老師就爆炸了，當場，他要同學與我在辦公室當著全年級老師的面手撐在桌上，他惡狠狠地用半人長的藤鞭先打了同學屁股２０大板；再輪到我也同樣氣呼呼地在眾老師的面前招呼了我的屁股２０大板。<\/p>\n<p>我當下沒哭，同學也沒哭，大哥級的同學對我很誠懇地說了一句:「對不起，以後不會了」。<\/p>\n<p>打這段文字時，仍可以感受到那種屁股熱熱燙燙、滿滿曲辱與不滿的心痛！<\/p>\n<p>但是從那一天起，我在永和外面走動不用再害怕，心中沒有不快，書也念得下了，覺也睡到爬不起來。<\/p>\n<p>但，直到今天我仍很恨我的國二導師。<\/p>"}, {"id": "f1521641099", "date": "2018-03-21", "title": "【台灣觀光知識革命】", "cat": "旅行郵輪", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【台灣觀光知識革命】 3/24 (六) RTM協會為台灣觀光旅遊業的未來把脈！ 歡迎師長好友並同參與！ 【RTM協會〔成立大會〕 & 大旅創時代5論壇 —— 知識革命×玩工起義】 ", "len": 528, "body": "<p>【台灣觀光知識革命】<\/p>\n<p>3/24 (六) RTM協會為台灣觀光旅遊業的未來把脈！<\/p>\n<p>歡迎師長好友並同參與！<\/p>\n<p>【RTM協會〔成立大會〕 &amp; 大旅創時代5論壇 —— 知識革命×玩工起義】<\/p>\n<p>｜日期｜2018 年 . 03月 . 24日 (六)<\/p>\n<p>｜時間｜10:30-18:00 (10:00 開放報到入場)<\/p>\n<p>｜地點｜台北市內湖區石潭路151號2樓<\/p>\n<p>｜費用｜免費入場 FREE<\/p>\n<p>｜參加對象｜<\/p>\n<p>無論是不是在旅遊業，只要您支持創新、支持青年、對台灣土地懷抱情感與熱忱、想在旅遊業求職、或學習觀光產業知識 及 未來趨勢洞見，都歡迎參加！<\/p>\n<p>🔴 免費論壇活動報名<\/p>\n<p><a href=\"https://lihi.cc/DMPDB/0321spkr\">https://lihi.cc/DMPDB/0321spkr<\/a><\/p>\n<p>🔴 知識學習會員申請<\/p>\n<p><a href=\"https://lihi.cc/1cl0E/0321spkr\">https://lihi.cc/1cl0E/0321spkr<\/a><\/p>\n<p>◇ 10:00 - 10:30【報到進場】<\/p>\n<p>◇ 10:30 - 11:00【再也沒有旅遊新創】<\/p>\n<p>◇ 11:00 - 12:30【訂房OTA與超級技術】<\/p>\n<p>... 12:30 - 13:00 休息 ...<\/p>\n<p>◇ 13:00 - 14:00【RTM協會。成立大會】<\/p>\n<p>◇ 14:00 - 15:00【旅行社創新的虛與實】<\/p>\n<p>... 15:00 - 15:30 休息 ...<\/p>\n<p>◇ 15:30 - 16:30【入境市場典範轉移】<\/p>\n<p>◇ 16:30 - 17:30【邊陲策略 x 細分壟斷】<\/p>\n<p>◇ 17:30 - 18:00【Networking】<\/p>"}, {"id": "f1514939928", "date": "2018-01-03", "title": "2017 WEF世界經濟論壇的世界競爭力指標Global…", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2017 WEF世界經濟論壇的世界競爭力指標Global Competitiveness Index報告。台灣排名世界第15名。比以色列(16)、阿聯(杜拜)(17)、澳洲(21)", "len": 409, "body": "<p>2017 WEF世界經濟論壇的世界競爭力指標Global Competitiveness Index報告。台灣排名世界第15名。比以色列(16)、阿聯(杜拜)(17)、澳洲(21)、韓國(26)都前面。<\/p>\n<p>但是報告中指出我們超過10分以上的問題有四個：<\/p>\n<p>1.政策不確定性 Policy instability 20.2<\/p>\n<p>2.勞動條件限制 Restrictive labor regulations 15.7<\/p>\n<p>3.資本與創新不足 Insufficient capacity to innovate 15.4<\/p>\n<p>4.政府官僚效率不佳 Inefficient government bureaucracy 14.6<\/p>\n<p><a href=\"http://reports.weforum.org/global-competitiveness-index-2017-2018/competitiveness-rankings/\">http://reports.weforum.org/global-competitiveness-index-2017-2018/competitiveness-rankings/<\/a><\/p>\n<p>我們沒有不好，只是要再努力，這是2018開工第一天受RTM泛旅遊洗禮的最大收獲。<\/p>"}, {"id": "f1514965754", "date": "2018-01-03", "title": "教育部研擬「專科以上學校校外實習教育法」草案，以確實強化…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "教育部研擬「專科以上學校校外實習教育法」草案，以確實強化校外實習機制及保障實習學生權益，並於107年1月4日起辦理4場次公聽會。 立法重點如下： 1.將專科以上學校辦理校外實習教育", "len": 610, "body": "<p>教育部研擬「專科以上學校校外實習教育法」草案，以確實強化校外實習機制及保障實習學生權益，並於107年1月4日起辦理4場次公聽會。<\/p>\n<p>立法重點如下：<\/p>\n<p>1.將專科以上學校辦理校外實習教育之原則法制化，明定學校應依系科專業性質及職能培育需求開設校外實習課程，如為學生畢業條件應納入學校學則，且為學生選擇符合條件之實習機構。<\/p>\n<p>2.健全學校辦理校外實習教育之機制，明定學校辦理校外實習應成立各級校外實習委員會，並應指派人員於學生實習期間進行輔導及訪視，學生於實習期間認為有損及權益情形，應有處理爭議或申訴之機制。<\/p>\n<p>3.將實習生實習權益保障明確化，視實習內涵將校外實習分為校外實習一般型及校外實習工作型，明定各類型學生適用之權益保障，並強化學生因學習訓練或實習工作而致相關傷害之補償規定，以確實保障實習生實習期間之權益及安全。<\/p>\n<p>4.強化學校安排學生至境外地區實習之辦理原則，加強境外實習生之權益保障，明定學校應確實釐明當地相關法令及簽證規定，並妥適評估實習機構，如有發生實習生權益受損且情勢急迫應立即召回實習生。<\/p>\n<p>5.建立處罰機制，針對學校及實習機構違反相關規定，明示各違反情形之處罰條款，且針對部分違反項目訂有改善期限，如未完成或改善無效者，主管機關得禁止學校或該實習機構辦理及參與校外實習教育。<\/p>\n<p><a href=\"https://www.edu.tw/News_Content.aspx?n=9E7AC85F1954DDA8&amp;s=BC344F28A3D97395\">https://www.edu.tw/News_Content.aspx?n=9E7AC85F1954DDA8&amp;s=BC344F28A3D97395<\/a><\/p>"}, {"id": "f1505355401", "date": "2017-09-14", "title": "我想這篇是中國郵報寫給我們看的！", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "我想這篇是中國郵報寫給我們看的！ 在台灣城市的人行道上不也是停滿了摩托車，行人的路權全都沒了，沒有好走的人行道，也就逼得大家都去走馬路，或是隨著習慣騎摩托車；這根本是國家的落後指標", "len": 464, "body": "<p>我想這篇是中國郵報寫給我們看的！<\/p>\n<p>在台灣城市的人行道上不也是停滿了摩托車，行人的路權全都沒了，沒有好走的人行道，也就逼得大家都去走馬路，或是隨著習慣騎摩托車；這根本是國家的落後指標，大家都視而不見，讓小小的台灣島上，在2017年的今日路上有著13,711,075台摩托車，等於幾乎全台每個成年人都有一台(資料來源：<a href=\"http://stat.motc.gov.tw/mocdb/stmain.jsp?sys=100&amp;funid=a3301。），為求方便，放著讓機車群如城市癌細胞地到處增生，這是城市景觀的殺手，更是國家發展的問題。\">http://stat.motc.gov.tw/mocdb/stmain.jsp?sys=100&amp;funid=a3301。），為求方便，放著讓機車群如城市癌細胞地到處增生，這是城市景觀的殺手，更是國家發展的問題。<\/a><\/p>\n<p>印尼雅加達已經開始處理了，反觀台灣最近機車廣告仍在開學前不斷地放送，刺激年輕學子換車改車，學生去了新加坡、日本實習，不也是走路＋大眾運輸就可以來去自如，台灣想好好發展觀光請由你我的身邊開始！<\/p>\n<p>每個人都改為走路＋大眾運輸，報廢老舊機車，少買新車；台灣就會慢慢變美！<\/p>\n<p><a href=\"http://www.chinapost.com.tw/asia/2017/09/14/500237/in-traffic-choked.htm\">http://www.chinapost.com.tw/asia/2017/09/14/500237/in-traffic-choked.htm<\/a><\/p>"}, {"id": "f1483179487", "date": "2016-12-31", "title": "2016再見～", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2016再見～ 祝福所有的家人、師長、好友、同學、學生新年快樂！ FB貼文說是 新年快樂 都會有煙火！ 我們用亞洲各國的祝福，17來迎接美好幸福的2017～ 日本：あけましておめで", "len": 594, "body": "<p>2016再見～<\/p>\n<p>祝福所有的家人、師長、好友、同學、學生新年快樂！<\/p>\n<p>FB貼文說是 新年快樂 都會有煙火！<\/p>\n<p>我們用亞洲各國的祝福，17來迎接美好幸福的2017～<\/p>\n<p>日本：あけましておめでとう (感謝Hank Li提供，一起迎接新年吧)<\/p>\n<p>韓國：새해 복 많이 받으세요 (Corinna Pai 黃茱蒂 一起開心2017)<\/p>\n<p>菲律賓： Happy New Year<\/p>\n<p>越南：Chúc mừng năm mới<\/p>\n<p>柬埔寨：រីករាយឆ្នាំថ្មី<\/p>\n<p>泰國： สวัสดีปีใหม่<\/p>\n<p>馬來西亞：Selamat Tahun Baru<\/p>\n<p>印尼：Selamat Tahun Baru<\/p>\n<p>尼泊爾：नयाँ वर्षको शुभकामना<\/p>\n<p>爪哇：seneng taun anyar<\/p>\n<p>寮國：ສະບາຍດີປີໃຫມ່<\/p>\n<p>緬甸：ပျြောရှငျတဲ့နှစ်သစ်<\/p>\n<p>斯里蘭卡：සුභ නව වසරක් වේවා<\/p>\n<p>印度：नया साल मुबारक हो<\/p>\n<p>蒙古：Шинэ жилийн мэнд хүргэе<\/p>\n<p>May all my family, friends, colleagues, classmates and students have a Happy, Prosperous, and Productive 2017.<\/p>\n<p>There will be firework if you or me post \" Happy new year\" on the Facebook, let us make a global blessing for our fruitful coming year 2017~~<\/p>"}, {"id": "f1479780371", "date": "2016-11-22", "title": "【106年專門職業及技術人員普通考試導遊人員、領隊人員考…", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【106年專門職業及技術人員普通考試導遊人員、領隊人員考試】 同學們，又到了每年一度的報名熱季。 只有10天報名機會，過了又是另一冬！ 報名日期：自105年11月22日起至12月1", "len": 322, "body": "<p>【106年專門職業及技術人員普通考試導遊人員、領隊人員考試】<\/p>\n<p>同學們，又到了每年一度的報名熱季。<\/p>\n<p>只有10天報名機會，過了又是另一冬！<\/p>\n<p>報名日期：自105年11月22日起至12月1日下午5時止。<\/p>\n<p>考試等級及類科：<\/p>\n<p>(一)外語導遊人員（英語、日語、法語、德語、西班牙語、韓語、泰語、阿拉伯語、俄語、義大利語、越南語、印尼語、馬來語）。<\/p>\n<p>(二)華語導遊人員。<\/p>\n<p>(三)外語領隊人員（英語、日語、法語、德語、西班牙語）。<\/p>\n<p>(四)華語領隊人員。<\/p>\n<p>報名網頁：<a href=\"http://register.moex.gov.tw/\">http://register.moex.gov.tw/<\/a><\/p>\n<p>詳細公告資訊：<\/p>\n<p><a href=\"http://wwwc.moex.gov.tw/main/Exam/wFrmPropertyDetail.aspx?m=3297&amp;c=106040\">http://wwwc.moex.gov.tw/main/Exam/wFrmPropertyDetail.aspx?m=3297&amp;c=106040<\/a><\/p>"}, {"id": "f1477640157", "date": "2016-10-28", "title": "侯勝宗：「探索知識與真理，是大學存在的本質；陪伴學生找到…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "侯勝宗：「探索知識與真理，是大學存在的本質；陪伴學生找到自己，卻是大學真正的價值。雖然大學不能簡單直接的給學生一個清晰的人生目的，但是老師還是有許多事情可以做。例如，透過各式的專題", "len": 315, "body": "<p>侯勝宗：「探索知識與真理，是大學存在的本質；陪伴學生找到自己，卻是大學真正的價值。雖然大學不能簡單直接的給學生一個清晰的人生目的，但是老師還是有許多事情可以做。例如，透過各式的專題實作、產學見習、海外交換、實驗帶領等機制，提供給學生獨立思考的機會、多元對話的空間、深刻生命的分享，與適時的資源提供。這一切不外乎就是要培養出年輕人的目的感，找到自己生命的呼召，啟動他們內在的存在動機，踏上屬於自己的英雄旅程。」<\/p>\n<p><a href=\"http://opinion.cw.com.tw/blog/profile/394/article/4925?utm_source=facebook&amp;utm_medium=social&amp;utm_campaign=daily\">http://opinion.cw.com.tw/blog/profile/394/article/4925?utm_source=facebook&amp;utm_medium=social&amp;utm_campaign=daily<\/a><\/p>"}, {"id": "f1475071294", "date": "2016-09-28", "title": "壞學校是因為學校壞掉了，與學生無關！", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "壞學校是因為學校壞掉了，與學生無關！ 教育者就是學生的生涯領導者！ 學生的形塑來自於師長自身的表現與期望！ 協助學生定下目標，踏實向前；給予學習者夢想，別用言語打擊信心！將愛放在課", "len": 335, "body": "<p>壞學校是因為學校壞掉了，與學生無關！<\/p>\n<p>教育者就是學生的生涯領導者！<\/p>\n<p>學生的形塑來自於師長自身的表現與期望！<\/p>\n<p>協助學生定下目標，踏實向前；給予學習者夢想，別用言語打擊信心！將愛放在課堂中，讓每位學生感受得到！身為教育工作者第十年，利用今天突來的假期，再次想想自己做到了嗎？<\/p>\n<p>我常與家人說到：現在的學生比我念書時的自己更有禮貌，更努力自食其力，更認真地面對自己的未來。在自己走向下一個十年之時，利用今天我要謝謝我十年來的學生，因為有你們，當老師才如此開心！<\/p>\n<p><a href=\"https://www.ted.com/talks/linda_cliatt_wayman_how_to_fix_a_broken_school_lead_fearlessly_love_hard?language=zh-tw\">https://www.ted.com/talks/linda_cliatt_wayman_how_to_fix_a_broken_school_lead_fearlessly_love_hard?language=zh-tw<\/a><\/p>"}, {"id": "f1469502349", "date": "2016-07-26", "title": "【「藍帶頂級廚師證書課程」2016/09/23 中文翻譯…", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "【「藍帶頂級廚師證書課程」2016/09/23 中文翻譯班開課!】 08/05 課程說明會報名中： http://goo.gl/forms/gahK0RIyXYPNcac93 「藍", "len": 349, "body": "<p>【「藍帶頂級廚師證書課程」2016/09/23 中文翻譯班開課!】<\/p>\n<p>08/05 課程說明會報名中：<a href=\"http://goo.gl/forms/gahK0RIyXYPNcac93\">h
