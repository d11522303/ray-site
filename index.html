n<ol start=\"11\">\n<li>導遊遇到遊客眾多時的導覽解說方式，下列何者正確？<\/li>\n<\/ol>\n<p>(A)站在北邊的位置 (B)行動間解說 (C)站在定點面向遊客 (D)禁止遊客提問<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 定點解說能確保聲音傳遞並方便掌控隊伍，且應背向景物面朝遊客。<\/p>\n<ol start=\"12\">\n<li>為預防團員於參觀博物館過程中走失，領隊人員事先須告知團員如發生走失情形時，下列哪一應對方式最不適當？<\/li>\n<\/ol>\n<p>(A)站在原地等候領隊人員來找 (B)直接撥打領隊人員行動電話 (C)自行設法找到團體 (D)尋求博物館服務人員幫忙<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 走失時「自行尋找」容易造成錯過，應原地等候或聯絡領隊。<\/p>\n<ol start=\"13\">\n<li>旅行業辦理國內(外)觀光團體旅遊，發生緊急事故時，應於幾小時內向交通部觀光署報備？<\/li>\n<\/ol>\n<p>(A)12 小時 (B)24 小時 (C)36 小時 (D)48 小時<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 根據法規，發生緊急事故應於24小時內通報。<\/p>\n<ol start=\"14\">\n<li>臺灣每年登山旅遊遭虎頭蜂攻擊，下列何者為風險最高的月份？<\/li>\n<\/ol>\n<p>(A)1~4 月 (B)5~7 月 (C)8~11 月 (D)12 月~隔年 2 月<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 秋季（8-11月）是虎頭蜂築巢與覓食的高峰期，最具攻擊性。<\/p>\n<ol start=\"15\">\n<li>一般而言，解除時差失調問題，每跨越一個時區，約需時多久？<\/li>\n<\/ol>\n<p>(A)約半天 (B)約 1 天 (C)約 2 天 (D)約 3 天<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 生理時鐘調整的通則為跨越一小時時區約需一天適應。<\/p>\n<ol start=\"16\">\n<li>團體旅遊團員夜間外出時，下列有關護照的保管方式，何者正確？<\/li>\n<\/ol>\n<p>(A)由導遊統一集中保管 (B)團員自行保管 (C)託同團團員代為保管 (D)交由旅館服務櫃檯人員代為保管<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 目前多數做法建議個人證件由團員自行隨身保管，以利不時之需（或依各團領隊習慣調整，但B為基本原則）。<\/p>\n<ol start=\"17\">\n<li>導遊帶團乘坐遊覽車時的安全規範，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A)事先確認交通路徑線路順暢 (B)隨時注意遊覽車司機的駕駛行為 (C)隨時提醒團員，勿將手伸出窗外 (D)安排年長者及易暈車的團員坐在後面座位<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 易暈車者應安排在「前座」或「中間」，後座震動較大。<\/p>\n<ol start=\"18\">\n<li>有關泡湯注意事項，下列何者正確？<\/li>\n<\/ol>\n<p>(A)入浴一次時間不宜超過 15 分鐘，總時間不宜超過 1 小時 (B)可攜帶寵物入浴 (C)有心臟病者，最好冷、熱水替換浸泡 (D)全身浴之浸泡高度應超過心臟<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 心臟病者不宜冷熱交替；浸泡高度不宜超過心臟以減輕壓力。<\/p>\n<ol start=\"19\">\n<li>旅行團發生緊急事故時，導遊的優先處置為：<\/li>\n<\/ol>\n<p>(A)通知旅行社總部 (B)搶救與穩定現場受傷者 (C)向媒體發布訊息 (D)安排後續路程<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 人命關天，急救與救災為第一優先。<\/p>\n<ol start=\"20\">\n<li>依據「旅行業管理規則」之規定，旅行業應為團體旅遊投保責任保險，其中意外死亡的最低投保金額為新臺幣多少元？<\/li>\n<\/ol>\n<p>(A)100 萬元 (B)150 萬元 (C)250 萬元 (D)500 萬元<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 現行法規規定旅行業責任保險最低死亡保額為250萬元。<\/p>\n<ol start=\"21\">\n<li>機場入境臺灣之旅客攜帶下列何種物品時，可以免申報通過？<\/li>\n<\/ol>\n<p>(A)牛肉乾 (B)新鮮橘子 (C)肉鬆蛋捲 (D)巧克力<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 肉製品、新鮮蔬果皆嚴禁攜帶或須申報檢疫。巧克力不在此限。<\/p>\n<ol start=\"22\">\n<li>下列何者是臺灣面積（含陸域及海域）最大的國家風景區？<\/li>\n<\/ol>\n<p>(A)東部海岸國家風景區 (B)澎湖國家風景區 (C)雲嘉南濱海國家風景區 (D)花東縱谷國家風景區<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 若包含廣大的海域範圍，澎湖國家風景區的轄區面積最大。<\/p>\n<ol start=\"23\">\n<li>銀髮族藉由旅行中盡情消費並將經驗分享給親友們，此為基於下列何種旅遊動機？<\/li>\n<\/ol>\n<p>(A)促進健康 (B)享樂炫耀 (C)逃避放鬆 (D)拓展社交<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 消費與分享經驗（炫耀性消費）符合「享樂炫耀」的心理動機。<\/p>\n<ol start=\"24\">\n<li>遊客對於喜歡的景點會有較高的重複造訪率，且會透過紀念品購買來提醒自己曾去過該景點。此為下列何種人格型態？<\/li>\n<\/ol>\n<p>(A)依賴型人格 (B)冒險型人格 (C)中庸型人格 (D)自我型人格<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 偏好熟悉環境、尋求安全感與紀念物，屬於Plog理論中的「依賴型/保守型（Psychocentric）」。<\/p>\n<ol start=\"25\">\n<li>下列何者不是銀髮族偏好的旅遊型態？<\/li>\n<\/ol>\n<p>(A)鐵道觀光 (B)手做體驗 (C)溯溪探險 (D)森林療癒<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 溯溪探險體力消耗大且危險性高，不符合銀髮族生理需求。<\/p>\n<ol start=\"26\">\n<li>下列何者不屬於觀光需求的外在環境因素？<\/li>\n<\/ol>\n<p>(A)自然資源 (B)廉價航空 (C)觀光動機 (D)外匯匯率<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 觀光動機是遊客內在的心理因素。<\/p>\n<ol start=\"27\">\n<li>下列有關觀光行為的內容，何者錯誤？<\/li>\n<\/ol>\n<p>(A)觀光活動可視為一種商品 (B)旅遊行程是一種實體商品 (C)觀光產品的購買就是消費 (D)觀光行為是一種消費者行為<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 旅遊行程具有不可儲存性、無形性，屬於「服務商品」而非「實體商品」。<\/p>\n<ol start=\"28\">\n<li>航空公司提供會員貴賓卡，並在特殊節日問候或致贈禮品，為馬斯洛（Maslow）理論的下列何種需求？<\/li>\n<\/ol>\n<p>(A)歸屬需求 (B)生理需求 (C)尊重需求 (D)安全需求<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 會員貴賓卡與節日問候旨在建立團體認同感與社會關係，屬於「愛與歸屬」需求。<\/p>\n<ol start=\"29\">\n<li>「朋友推薦某家民宿而選擇入住」，是屬於下列何種影響因素？<\/li>\n<\/ol>\n<p>(A)個人因素 (B)文化因素 (C)社會因素 (D)心理因素<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 參考群體（朋友、家人）的影響屬於社會因素。<\/p>\n<ol start=\"30\">\n<li>下列何者不是消費者蒐集資訊的來源？<\/li>\n<\/ol>\n<p>(A)人際來源 (B)商業來源 (C)動機來源 (D)公共來源<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 「動機」是資訊搜尋的啟動原因，而非資訊的來源渠道。<\/p>\n<ol start=\"31\">\n<li>旅客對旅遊產品的預期與實際體驗產生落差，是屬於下列何種現象？<\/li>\n<\/ol>\n<p>(A)社會交換 (B)動機強化 (C)近期效應 (D)認知失調<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 當現況與期望不符時產生的心理不適感稱為「認知失調」。<\/p>\n<ol start=\"32\">\n<li>旅客因某導遊互動親切、談吐得體，就認為他的專業能力很強，是屬於下列何種心理效應？<\/li>\n<\/ol>\n<p>(A)投射效應 (B)對比效應 (C)近因效應 (D)月暈效應<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 「月暈效應（Halo Effect）」指因某種特徵良好而擴及對整體的正向評價。<\/p>\n<ol start=\"33\">\n<li>旅遊銷售如實說明產品內容與價值、不誇大或隱瞞，主要目的是為了：<\/li>\n<\/ol>\n<p>(A)建立專業形象與信任 (B)提高衝動購買 (C)增加旅程娛樂性 (D)提高銷售速度<\/p>\n<p>正確答案：(A)<\/p>\n<ol start=\"34\">\n<li>臺灣原住民族中，下列哪一族有紋身（面）習俗？<\/li>\n<\/ol>\n<p>(A)賽夏族 (B)布農族 (C)泰雅族 (D)阿美族<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 泰雅族、太魯閣族、賽德克族以紋面傳統著稱。<\/p>\n<ol start=\"35\">\n<li>旅客持有的一張一年的全額經濟艙機票，下列何者是其改訂的標準規定？<\/li>\n<\/ol>\n<p>(A)必須支付高額改票手續費 (B)須支付淡旺季的艙位差價 (C)通常可以在機票效期內，免費更改日期 (D)必須在原定出發日期前七天完成更改，否則失效<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 全額機票（Full Fare）通常彈性最大，效期內可免費改期。<\/p>\n<ol start=\"36\">\n<li>旅客購買了 Non-refundable 的機票，因航空公司航班取消而無法成行，航空公司應如何處理？<\/li>\n<\/ol>\n<p>(A)僅退還稅金，票價不退 (B)可向旅客收取高額退票手續費 (C)航空公司須全額退款或安排替代航班 (D)只能退還部分票價<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 若是航空公司因素導致取消，即使是不可退票的機票也必須全額退款或妥善處理。<\/p>\n<ol start=\"37\">\n<li>旅客攜帶超大型的攝影器材箱必須託運，下列何者為正確代碼？<\/li>\n<\/ol>\n<p>(A)BSCT (B)BULK (C)CBBG (D)XBAG<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： XBAG 代表超重/超大行李（Excess Baggage）。CBBG 為佔位行李（Cabin Baggage）。<\/p>\n<ol start=\"38\">\n<li>達美航空是下列哪一聯盟的成員？<\/li>\n<\/ol>\n<p>(A)星空聯盟 (B)天合聯盟 (C)優行聯盟 (D)寰宇一家<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 達美航空（Delta）與華航同屬天合聯盟（SkyTeam）。<\/p>\n<ol start=\"39\">\n<li>下列有關航空組織的中文名稱與英文縮寫，何者錯誤？<\/li>\n<\/ol>\n<p>(A)國際航空運輸協會 (IATA) (B)國際民航組織 (ICAO) (C)航空報告公司 (ARC) (D)美國聯邦航空總署 (FAA)<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： ARC 在旅遊界通常指 Airlines Reporting Corporation，考題設計中常以此類簡寫考基礎認知（此題選項(C)較冷門，但A、B、D皆正確）。<\/p>\n<ol start=\"40\">\n<li>若傷口及拍高處止血無效，應採取下列何種止血措施？<\/li>\n<\/ol>\n<p>(A)熱敷局部加壓 (B)使用止血帶於傷口近心端 (C)大面積冰敷患部 (D)只要熱敷即可<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 當加壓止血無效且有生命危險時，最後手段為在近心端使用止血帶。<\/p>\n<ol start=\"41\">\n<li>病人語言模糊、一側肢體癱瘓可能是下列何種症狀？<\/li>\n<\/ol>\n<p>(A)低血糖症 (B)中風 (C)心肌梗塞 (D)頸椎受傷<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 臉斜、手軟、說話不清是中風（Stroke）的三大徵兆。<\/p>\n<ol start=\"42\">\n<li>若發現有人倒地無意識且無呼吸現象，下列何種處置正確？<\/li>\n<\/ol>\n<p>(A)先查看身上證件 (B)移動身體 (C)打電話給家人 (D)確認現場安全後實施 CPR<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 急救第一步是確認環境安全，接著啟動EMS並執行CPR。<\/p>\n<ol start=\"43\">\n<li>關於「辛辛那提」到院前中風指數的檢查項目，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A)請病人嘴角上揚露齒微笑，觀察臉部是否對稱 (B)請病人閉眼並雙手平舉 10 秒，觀察是否下垂 (C)請病人說一句簡單的話，觀察是否正確清晰 (D)請病人雙腳單腳站立 10 秒，觀察是否跌倒<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 辛辛那提中風量表（FAST）包含：臉部（Face）、手臂（Arm）、言語（Speech），不含單腳站立。<\/p>\n<ol start=\"44\">\n<li>單人執行成人 CPR 時，胸部按壓與人工呼吸之比例為：<\/li>\n<\/ol>\n<p>(A)15:2 (B)20:2 (C)25:2 (D)30:2<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 成人 CPR（單人或雙人）的按壓呼吸比均為 30:2。<\/p>\n<ol start=\"45\">\n<li>有轉盤的中餐饗宴，若需取離自己較遠之菜餚時，應該如何做？<\/li>\n<\/ol>\n<p>(A)站起來夾菜 (B)順時針轉動轉盤 (C)逆時針迅速轉動轉盤 (D)看菜餚在左方或右方再轉動<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 轉盤禮儀通常為順時針轉動，且須注意不與他人爭搶。<\/p>\n<ol start=\"46\">\n<li>下列有關 Brunch 之敘述，何者正確？<\/li>\n<\/ol>\n<p>(A)比平常食用更加豐盛的早餐 (B)流行於較貧窮國家，以降低糧食消耗 (C)多半在假日清晨，大家起床較晚，於是合併早、午餐一起用 (D)內容為簡單的牛奶加麵包<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： Brunch 即「早午餐」，結合 Breakfast 與 Lunch。<\/p>\n<ol start=\"47\">\n<li>下列有關宴客禮儀的作法，何者錯誤？<\/li>\n<\/ol>\n<p>(A)陪客身分應高於主賓以示尊重 (B)請柬一旦發出後，不宜輕易更改或取消 (C)英文請柬左下角的 R.S.V.P. 註記，意為回覆參加與否 (D)允諾參與宴會，應準時赴約<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 陪客的身分不應高於主賓，以免喧賓奪主。<\/p>\n<ol start=\"48\">\n<li>下列有關進餐時要注意的餐桌禮儀，何者錯誤？<\/li>\n<\/ol>\n<p>(A)應注意以食物就口，勿以口就食物，且應閉嘴靜嚼，勿大聲談話 (B)口中有魚骨或其他骨刺或果核時，可自口中吐出在空握的拳頭內，然後放在盤子內 (C)如果要取用遠處的調味品，可請鄰座客人幫忙傳遞 (D)女士用餐時如需要補妝，可於座位上遮掩一下再進行補妝<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 餐桌上不宜補妝，應至洗手間進行。<\/p>\n<ol start=\"49\">\n<li>下列有關乘車的禮儀，何者正確？<\/li>\n<\/ol>\n<p>(A)駕駛盤在左的小汽車，如有司機駕駛時，是以後座左側為首位，後座右側為次位，司機旁的座位為最小位 (B)如果是主人親自駕駛小汽車，又與長輩或長官同車時，應讓長輩或長官坐後座 (C)如果是主人親自駕駛小汽車，主人旁的賓客先行下車，後座賓客仍留原座位即可 (D)有司機駕駛的小汽車，依國際慣例，女賓不宜坐前座<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： (A)首位應為後座右側；(B)主人親駕時，首位在前座副駕，長輩應坐前座；(C)主人親駕時若前座空出，後座賓客應移至前座以示禮貌。<\/p>\n<ol start=\"50\">\n<li>有關筷子禮儀，下列何者被視為不禮貌？<\/li>\n<\/ol>\n<p>(A)筷子並排放在筷架上 (B)將筷子直插入飯中 (C)將筷子放在碗邊 (D)團體用餐時使用公筷<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 筷子直插入飯中像祭拜死者（稱「腳尾飯」），是大忌。<\/p>\n<p>圖片：＃醒吾旅運系學生<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773548620", "date": "2026-03-15", "title": "導遊領隊考前陪跑 EP102(國家考試第2天)", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前陪跑 EP102(國家考試第2天) 🥳只靠老師陪跑是不夠的🥳 🎉🎉請任職於星宇航空的以婕來為大家加油🎉🎉 🥳以婕也是我導師班學生🥳 🥰就讀醒吾旅運系考取領隊與導遊雙榜及", "len": 7681, "body": "<p>導遊領隊考前陪跑 EP102(國家考試第2天)<\/p>\n<p>🥳只靠老師陪跑是不夠的🥳<\/p>\n<p>🎉🎉請任職於星宇航空的以婕來為大家加油🎉🎉<\/p>\n<p>🥳以婕也是我導師班學生🥳<\/p>\n<p>🥰就讀醒吾旅運系考取領隊與導遊雙榜及格🥰<\/p>\n<h1>115年交通部觀光署導遊人員評量測驗<\/h1>\n<h1>導遊執業法規<\/h1>\n<h1>現場解題 (答項由AI協助，請先參考便可)<\/h1>\n<ol>\n<li>下列何者非發展觀光條例之制定目的？<\/li>\n<\/ol>\n<p>(A) 平衡城鄉差距 (B) 敦睦國際友誼 (C) 宏揚傳統文化 (D) 增進國民身心健康<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 依據《發展觀光條例》第1條，目的包含(B)(C)(D)及發展觀光產業、開拓國家財源。<\/p>\n<ol start=\"2\">\n<li>有關導遊人員之評量測驗，下列敘述何者錯誤？<\/li>\n<\/ol>\n<p>(A) 華語導遊人員類科，以各科目平均成績滿六十分為及格<\/p>\n<p>(B) 外語導遊人員類科筆試，以各科目平均成績滿六十分且外國語科目成績滿五十分為及格。部分科目免試者，以外國語科目成績滿六十分為及格<\/p>\n<p>(C) 外語導遊人員類科口試，以各口試委員之評分皆滿六十分為及格<\/p>\n<p>(D) 有一科成績為零分者，不予及格<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 依據《導遊人員管理規則》，外語導遊人員類科口試，以各口試委員之評分成績平均滿六十分為及格。<\/p>\n<ol start=\"3\">\n<li>交通部觀光署在亞洲那些城市設置駐外辦事處？<\/li>\n<\/ol>\n<p>(A) 東京、大阪、釜山、新加坡、吉隆坡、曼谷、香港、北京、上海 (福州)、河內等地<\/p>\n<p>(B) 東京、大阪、首爾、新加坡、吉隆坡、曼谷、香港、北京、上海 (福州)、澳門等地<\/p>\n<p>(C) 東京、大阪、釜山、新加坡、吉隆坡、曼谷、香港、北京、上海 (福州)、胡志明市等地<\/p>\n<p>(D) 東京、大阪、首爾、新加坡、吉隆坡、曼谷、香港、北京、上海 (福州)、福岡等地<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 此題考點為觀光署目前的駐外據點，包含越南胡志明市及韓國釜山等。<\/p>\n<ol start=\"4\">\n<li>依據旅行業管理規則規定，有關不得聘為旅行業經理人之敘述，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 曾犯組織犯罪防制條例規定之罪，經有罪判決確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後未逾五年<\/p>\n<p>(B) 曾犯詐欺、背信、侵占罪經宣告有期徒刑一年以上之判決確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後未逾三年<\/p>\n<p>(C) 曾犯詐欺、背信、侵占罪經宣告有期徒刑一年以上之判決確定，尚未執行<\/p>\n<p>(D) 應全程統一保管旅客證件以免遺失<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 經理人消極資格依《旅行業管理規則》第14條。選項(D)與經理人任用資格無關，且導遊領隊不應「強制」全程統一保管證件，應尊重旅客意願。<\/p>\n<ol start=\"5\">\n<li>依據發展觀光條例規定，主管機關為勘定風景特定區範圍，得派員進入公私有土地實施勘查或測量。但應先以前述方式通知土地所有權人或其使用人？<\/li>\n<\/ol>\n<p>(A) 當面通知 (B) 公告通知 (C) 電話通知 (D) 書面通知<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 依據《發展觀光條例》第16條，應先「書面」通知。<\/p>\n<ol start=\"6\">\n<li>旅行業所派遣之隨團服務人員執行業務時應遵守之規定，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 不得未經旅客要求而變更旅程 (B) 應揭露行程資訊內容 (C) 不得有不利國家之言行 (D) 應全程統一保管旅客證件以免遺失<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 旅行業管理規則第36條，服務人員不得擅自變更行程或損害國家利益。<\/p>\n<ol start=\"7\">\n<li>依據發展觀光條例規定，旅行業未依規定辦理履約保證保險或責任保險，主管機關處置作為，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 處新臺幣三萬元以上五十萬元以下罰鍰<\/p>\n<p>(B) 處新臺幣十萬元以上五十萬元以下罰鍰<\/p>\n<p>(C) 得立即停止其辦理旅客出國及國內旅遊業務<\/p>\n<p>(D) 限於三個月內辦妥投保，逾期未辦妥者，得廢止其旅行業執照<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 依條例第55條，罰鍰額度為 3萬至 50萬。<\/p>\n<ol start=\"8\">\n<li>依據旅行業管理規則規定，旅行業辦理團體旅遊業務，下列敘述何者錯誤？<\/li>\n<\/ol>\n<p>(A) 甲種旅行業、乙種旅行業代理綜合旅行業辦理團體旅遊業務，應經綜合旅行業之委託，並以綜合旅行業名義與旅客簽訂旅遊契約，並由銷售旅行業副署<\/p>\n<p>(B) 旅行業經營自行組團業務，未經旅客書面同意，不得將該旅行業務轉讓其他旅行業辦理<\/p>\n<p>(C) 旅行業受理旅行業務之轉讓時，應與旅客重新簽訂旅遊契約<\/p>\n<p>(D) 甲種旅行業、乙種旅行業經營自行組團業務，得將其招攬文件置於其他旅行業，委託該其他旅行業代為銷售、招攬<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 轉讓時應經旅客書面同意，但不需要重新簽約，而是由受讓之旅行業承擔原契約權利義務。<\/p>\n<ol start=\"9\">\n<li>依據旅行業管理規則規定，旅行業經理人訓練測驗成績以一百分為滿分，及格分數為多少分？<\/li>\n<\/ol>\n<p>(A) 六十分 (B) 六十五分 (C) 七十分 (D) 七十五分<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 經理人、導遊、領隊訓練測驗及格分數均為 60 分。<\/p>\n<ol start=\"10\">\n<li>依據導遊人員管理規則規定，外語導遊人員評量測驗應測科目缺考者，如何處理？<\/li>\n<\/ol>\n<p>(A) 可視缺考科目自助補考 (B) 視為零分 (C) 缺考科目不計入平均成績 (D) 只影響外國語科目成績<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 缺考科目以零分計算。<\/p>\n<ol start=\"11\">\n<li>依據管理外匯條例規定，對於故意不申報或申報不實外匯者，罰鍰範圍為何？<\/li>\n<\/ol>\n<p>(A) 新臺幣三萬元以上六十萬元以下 (B) 新臺幣三萬元以上一百萬元以下 (C) 按交易金額二倍以下 (D) 沒收外匯<\/p>\n<p>正確答案：(B)<\/p>\n<ol start=\"12\">\n<li>依據旅行業管理規則規定，旅行業以所屬或透過其他網路平台、行動應用程式(APP)或其他電子方式經營旅行業務者，應於其頁面及介面揭露下列那些必要事項？<\/li>\n<\/ol>\n<p>①公司名稱、種類、地址 ②公司資本額及保證金 ③公司商品協會會員編號 ④公司註冊編號及代表人姓名 ⑤公司電話、傳真、電子信箱帳號及聯絡人<\/p>\n<p>(A) ①②③ (B) ①②④ (C) ①③⑤ (D) ①④⑤<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 依管理規則第21-1條，需揭露名稱、種類、地址、註冊編號、代表人、電話等聯絡資訊。<\/p>\n<ol start=\"13\">\n<li>外籍旅客在購物退稅之特約商店，同一日向同一特約商店購物累計含稅消費金額在新臺幣多少元以上，得於購物當日持入境證照向商店申請開立退稅表單？<\/li>\n<\/ol>\n<p>(A) 三千元以上；六十天內 (B) 三千元以上；九十天內 (C) 二千元以上；六十天內 (D) 二千元以上；九十天內<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 購物退稅門檻為當日單店含稅 2,000元，且須於 90天 內攜物出境。<\/p>\n<ol start=\"14\">\n<li>國際旅客最高參加我國旅行社舉辦之國內團體旅遊時，旅行社應指派或僱用導遊人員執行接待或引導觀光旅客旅遊業務，若未依規定指派適法導遊人員而執行業務者，依據發展觀光條例規定，處新臺幣多少元罰鍰，並禁止其執業？<\/li>\n<\/ol>\n<p>(A) 一萬元以上三萬元以下 (B) 一萬元以上五萬元以下 (C) 一萬元以上十萬元以下 (D) 二萬元以上十萬元以下<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 發展觀光條例第55條，未指派導遊領隊處 1萬至 5萬。<\/p>\n<ol start=\"15\">\n<li>王先生高中畢業後，欲執行接待日本、歐美等地非華語之觀光旅客應參加何種評量測驗，並領取何種執業證？<\/li>\n<\/ol>\n<p>(A) 考取華語導遊人員執業證即可，搭配外語翻譯人員執行業務<\/p>\n<p>(B) 應參加外語導遊人員類科評量測驗，並領取外語導遊人員執業證<\/p>\n<p>(C) 參加華語導遊人員評量測驗，因為來臺旅遊者均應具備華語溝通能力<\/p>\n<p>(D) 必須同時通過華語導遊人員及外語導遊人員兩類科的評量測驗<\/p>\n<p>正確答案：(B)<\/p>\n<ol start=\"16\">\n<li>依據護照條例規定，下列那種情形得申請換發護照？<\/li>\n<\/ol>\n<p>(A) 護照剩餘效期不足二年 (B) 所持護照非屬現行最新樣式者 (C) 持照人之相貌變更與護照照片不符 (D) 護照內植晶片無法讀取<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 護照條例第15條，相貌變更與照片不符應申請換發。<\/p>\n<ol start=\"17\">\n<li>發展觀光條例的名詞定義中，下列何者為依規定程序劃定之優美風景地區？<\/li>\n<\/ol>\n<p>(A) 觀光地區 (B) 國家公園 (C) 自然人文生態景觀區 (D) 風景特定區<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 這是《發展觀光條例》第2條的法律定義。<\/p>\n<ol start=\"18\">\n<li>有關觀光遊憩地區及其主管機關，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 大學實驗林：教育部 (B) 自然地景：農業部 (C) 國家公園：交通部 (D) 水庫：經濟部<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 國家公園的主管機關為 內政部（國土管理署）。<\/p>\n<ol start=\"19\">\n<li>依據交通部觀光署組織規程，有關「觀光遊憩產業之發展規劃」係屬於該署哪一單位業務？<\/li>\n<\/ol>\n<p>(A) 國際組 (B) 企劃組 (C) 執行組 (D) 旅遊推廣組<\/p>\n<p>正確答案：(B)<\/p>\n<ol start=\"20\">\n<li>依據發展觀光條例規定，觀光主管機關對當地特有產品及手工藝品之作為為何？<\/li>\n<\/ol>\n<p>①應會同有關機關調查統計 ②輔導改良其生產及製作技術，提高品質，標明價格 ③洽請旅行業者協助促銷販售 ④應在觀光地區商圈集中銷售<\/p>\n<p>(A) ①②③ (B) ①②④ (C) ①③④ (D) ②③④<\/p>\n<p>正確答案：(B)<\/p>\n<ol start=\"21\">\n<li>依據導遊人員管理規則規定，有關參加導遊人員職前訓練之退訓，下列何者正確？<\/li>\n<\/ol>\n<p>①缺課節數逾十五分之一者 ②受訓期間對講座、輔導員或其他辦理訓練人員施以強暴脅迫者 ③由他人冒名頂替參加訓練者 ④經退訓，其已繳納之訓練費用，不得申請退還<\/p>\n<p>(A) ①②③ (B) ①②④ (C) ①③④ (D) ②③④<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 缺課規定通常是逾 十分之一 即退訓（第21條）。<\/p>\n<ol start=\"22\">\n<li>依據外匯收支或交易申報辦法規定，非居住民可逕向銀行業辦理每筆新臺幣結匯或結售之限額為何？<\/li>\n<\/ol>\n<p>(A) 十萬美元 (B) 十五萬美元 (C) 二十萬美元 (D) 二十五萬美元<\/p>\n<p>正確答案：(A)<\/p>\n<ol start=\"23\">\n<li>依據發展觀光條例規定，旅客進入自然人文生態景觀區未依規定申請專業導覽人員陪同進入者，目的事業主管機關得處行為人罰鍰新臺幣多少元？<\/li>\n<\/ol>\n<p>(A) 一萬元以下 (B) 二萬元以下 (C) 三萬元以下 (D) 四萬元以下<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 第62條，處新臺幣三萬元以下罰鍰。<\/p>\n<ol start=\"24\">\n<li>國際性主要組織的英文縮寫，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 國際航空運輸協會：IATA (B) 國際會議協會：ICCA (C) 亞太經濟合作會議：APTA (D) 聯合國教育、科學及文化組織：UNESCO<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 亞太經濟合作會議應為 APEC。<\/p>\n<ol start=\"25\">\n<li>依據旅行業管理規則規定，下列何者不是乙種旅行業之業務內容？<\/li>\n<\/ol>\n<p>(A) 招攬或接待本國旅客或取得合法居留證件之外國人、香港、澳門居民及大陸地區人民國內旅遊、食宿、交通及提供有關服務<\/p>\n<p>(B) 提供旅客於購買旅遊商品或服務時，附隨代收透過其所屬網路平台或行動應用程式(APP)，與保險業合作推廣旅遊相關保險商品之保險費<\/p>\n<p>(C) 代理綜合旅行業招攬國內團體旅遊業務<\/p>\n<p>(D) 代理外國旅行業辦理聯絡、推廣、報價等業務<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 代理外國旅行業業務是 綜合旅行業 的專屬業務。<\/p>\n<ol start=\"26\">\n<li>依據旅行業管理規則規定，旅行業以商標權服務旅客，應由該旅行業依法申請商標註冊，報請交通部觀光署備查，報請備查之商標，以幾個為限？<\/li>\n<\/ol>\n<p>(A) 一個 (B) 二個 (C) 三個 (D) 四個<\/p>\n<p>正確答案：(A)<\/p>\n<ol start=\"27\">\n<li>依據發展觀光條例規定，為提升我國高級觀光服務品質，以外語輔助解說國內特有生態及人文觀光資源，由各目的事業主管機關在自然人文生態景觀區所設置具備外語能力之人員為何？<\/li>\n<\/ol>\n<p>(A) 導遊人員 (B) 領隊人員 (C) 專業導覽人員 (D) 外語觀光導覽人員<\/p>\n<p>正確答案：(D)<\/p>\n<ol start=\"28\">\n<li>依據旅行業管理規則規定，乙種旅行業之實收資本總額，不得少於新臺幣多少元？<\/li>\n<\/ol>\n<p>(A) 三千萬元 (B) 六百萬元 (C) 一百二十萬元 (D) 一百萬元<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 綜合 2,500萬、甲種 600萬、乙種 120萬。<\/p>\n<ol start=\"29\">\n<li>依據導遊人員管理規則規定，外語導遊人員評量測驗報名資格可分為那兩種？<\/li>\n<\/ol>\n<p>(A) 通用型與專用型 (B) 初級與高級 (C) 普通制與特別制 (D) 國內制與國際制<\/p>\n<p>正確答案：(A)<\/p>\n<ol start=\"30\">\n<li>外國旅客在臺旅遊期間，前往銀行欲持歐元現鈔兌換新臺幣，係以下列何種歐元匯率兌換？<\/li>\n<\/ol>\n<p>(A) 即期買匯 (B) 即期賣匯 (C) 現金買匯 (D) 現金賣匯<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 銀行向客戶買入外幣現鈔，使用「現金買匯」。<\/p>\n<ol start=\"31\">\n<li>依據出入境通關須知規定，出境旅客攜帶外幣現鈔超過限額時應主動向海關申報，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 僅能於超過限額內辦理申報 (B) 金額以二萬美元為限<\/p>\n<p>(C) 申報不實者，逾額部分沒入 (D) 申報不實者，申報金額全數沒入<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 僅對「超過且未申報」或「申報不實」的部分沒入。<\/p>\n<ol start=\"32\">\n<li>依據發展觀光條例規定，旅遊產品需由旅行業專賣販售，但以下的何種旅遊行程產品可以在便利商店買到？<\/li>\n<\/ol>\n<p>(A) 外國人來臺旅遊行程 (B) 台灣高鐵或臺鐵運輸公司之車票<\/p>\n<p>(C) 國人出國之團體旅遊 (D) 國人國內套裝旅遊<\/p>\n<p>正確答案：(B)<\/p>\n<ol start=\"33\">\n<li>有關外國旅行業在本國設立分公司之規定，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 應向交通部觀光署申請核准 (B) 應依法辦理認許及分公司登記<\/p>\n<p>(C) 業務範圍、實收資本額準用本國旅行業分公司之規定 (D) 保證金準用本國旅行業之規定<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 外國旅行業設立分公司，其資本額與保證金是準用「總公司」的規定，而非分公司。<\/p>\n<ol start=\"34\">\n<li>(案例題) 王小明的家在東部海岸國家風景區範圍內，最近他父親將老家的平房打掉，原地改建成色彩鮮豔華麗的三層樓高洋房，小明跟他父親說：「爸爸，這要向國家風景區管理處先申請看可不可以啦！」他父親說：「不必吧，建築執照是向縣政府申請，又不是管理處。」有關上述議題，下列敘述何者正確？<\/li>\n<\/ol>\n<p>(A) 不論翻修建築物之構造、構造、色彩等，小明的父親只要直接按照建築法向縣政府申請就可以<\/p>\n<p>(B) 在縣政府核准及全部完工之後，為維持國家風景特定區之美觀，再就建築物之造形、構造、色彩等向國家風景區管理處申請審查裝定核發<\/p>\n<p>(C) 為維持國家風景特定區之美觀，區內建築物之造形、構造、色彩等，國家風景區管理處得實施規劃限制<\/p>\n<p>(D) 為維護人民居住自由權，區內建築物之造形、構造、色彩等，國家風景區管理處不得實施規劃限制<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 依據第19條，管理處對建築物造形、構造、色彩有規劃限制權。<\/p>\n<ol start=\"35\">\n<li>依據發展觀光條例，下列何者不屬於主管機關核發之觀光專用標章？<\/li>\n<\/ol>\n<p>(A) 旅行業 (B) 民宿經營者 (C) 旅館業 (D) 觀光遊樂業<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 旅行業沒有觀光專用標章。<\/p>\n<ol start=\"36\">\n<li>觀光遊樂業、旅館業、旅行業、觀光遊憩業或民宿經營者，經主管機關實施定期或不定期檢查結果有不合規定者，除依相關法令辦理外，發展觀光條例規定之處置為何？<\/li>\n<\/ol>\n<p>①令限期改善，屆期仍未改善者，處新臺幣三萬元以上三十萬元以下罰鍰<\/p>\n<p>②情節重大者，並得定期停止其營業之全部或一部<\/p>\n<p>③仍繼續營業者，處新臺幣五萬元以上三十萬元以下罰鍰<\/p>\n<p>④經受停止營業處分仍繼續營業者，廢止其營業執照或登記證<\/p>\n<p>(A) ①②③ (B) ①②④ (C) ①③④ (D) ②③④<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 依第54條規定。<\/p>\n<ol start=\"37\">\n<li>下列何者為目前臺灣觀光 CIS 品牌標語？<\/li>\n<\/ol>\n<p>(A) Heart of Asia (B) Waves of Wonder (C) Touch Your Heart (D) Time for Taiwan<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 最新品牌為 Waves of Wonder（台灣魅力，驚喜無限）。<\/p>\n<ol start=\"38\">\n<li>依據發展觀光條例規定，於風景特定區或觀光地區內有下列那些行為者，由其目的事業主管機關處新臺幣一萬元以上五萬元以下罰鍰？<\/li>\n<\/ol>\n<p>①擅自經營固定或流動攤販 ②任意拋棄、焚燒垃圾或廢棄物 ③將車輛開入禁止車輛進入或停放於禁止停車之地區 ④擅自設置指示標誌、廣告物 ⑤強行向旅客拍照並收取費用<\/p>\n<p>(A) ①④⑤ (B) ①②③ (C) ③④⑤ (D) ①③④<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 依第64條。②屬於環保範疇或額度不同，⑤強行拍照罰鍰更高且涉及刑法。<\/p>\n<ol start=\"39\">\n<li>依據發展觀光條例規定，觀光遊樂業、觀光旅館業及旅館業配合觀光政策提升服務品質，經中央主管機關核定者，其直接使用之不動產可享受地價稅及房屋稅減免。關於該租稅優惠，下列何者正確？<\/li>\n<\/ol>\n<p>(A) 減免期限不得超過一年 (B) 減免期限為五年，屆期前得延長一次，延長期間以五年為限 (C) 減免期限不得超過三年 (D) 減免期限為十年，屆期前得延長一次，延長期間以十年為限<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 依第49條，5+5原則。<\/p>\n<ol start=\"40\">\n<li>依據發展觀光條例規定，未依本條例領取登記證而經營民宿者，處新臺幣多少元罰鍰，並勒令歇業？<\/li>\n<\/ol>\n<p>(A) 三萬元以上十五萬元以下 (B) 五萬元以上三十萬元以下 (C) 十五萬元以上五十萬元以下 (D) 十萬元以上一百萬元以下<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 依第55條第6項，民宿罰 6萬至 30萬（法規近期有修正，此題選項 A 較接近舊制或特定區分）。<\/p>\n<ol start=\"41\">\n<li>請問下列何者屬於臺灣地區與大陸地區關係條例所界定的臺端居民？<\/li>\n<\/ol>\n<p>(A) 持有中華民國國籍的香港永久居民 (B) 持有護照的香港永久居民 (C) 持有英國國民（海外）護照的香港永久居民 (D) 持有日本護照的香港永久居民<\/p>\n<p>正確答案：(A)<\/p>\n<ol start=\"42\">\n<li>張先生在經濟部擔任第十一職等公務員，預定利用連續假期到大陸地區旅遊，他應向下列那一個部門申請許可，始得前往？<\/li>\n<\/ol>\n<p>(A) 國家安全局 (B) 大陸委員會 (C) 內政部 (D) 法務部<\/p>\n<p>正確答案：(C)<\/p>\n<p>解析： 公務員赴陸由內政部審查。<\/p>\n<ol start=\"43\">\n<li>為強化保障國人赴大陸地區及香港、澳門旅遊及人身安全，我國政府發布大陸地區及香港、澳門旅遊警示的主管機關為何？<\/li>\n<\/ol>\n<p>(A) 交通部觀光署 (B) 外交部 (C) 內政部 (D) 大陸委員會<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： 兩岸事務由陸委會發布。<\/p>\n<ol start=\"44\">\n<li>有關大陸地區人民組團來臺觀光活動，下列敘述何者正確？<\/li>\n<\/ol>\n<p>①應由旅行業組團辦理，並以團進團出方式為之，每團人數四人以上五十人以下<\/p>\n<p>②旅行業辦理接待大陸地區人民來臺從事個人旅遊，不得接收由香港、澳門或大陸地區旅行業、其他機構或個人組成之個人旅遊旅客團體<\/p>\n<p>③所謂個人旅遊旅客團體，指全團均由來臺從事個人旅遊之旅客所組成，或由來臺從事個人旅遊之旅客與來臺從事觀光活動以外之目的之大陸地區人民所組成<\/p>\n<p>④個人旅遊旅客團體，由大陸地區人士或香港、澳門居民隨團執行領隊人員業務者，推定係由香港、澳門或大陸地區旅行業、其他機構或個人組成<\/p>\n<p>(A) ①②③ (B) ①②④ (C) ①③④ (D) ②③④<\/p>\n<p>正確答案：(D)<\/p>\n<p>解析： ① 團體人數通常規定為 5人以上 40人以下。<\/p>\n<ol start=\"45\">\n<li>依據臺灣地區與大陸地區人民關係條例規定，使大陸地區人民非法進入臺灣地區者，處一年以上七年以下有期徒刑，得併科多少罰金？<\/li>\n<\/ol>\n<p>(A) 新臺幣五十萬元以下 (B) 新臺幣一百萬元以下 (C) 新臺幣二百萬元以下 (D) 新臺幣三百萬元以下<\/p>\n<p>正確答案：(B)<\/p>\n<ol start=\"46\">\n<li>陳先生原設籍中國大陸，目前設籍加拿大，盼前來臺灣旅遊。請問若其符合下列何種情形，即非臺灣地區與大陸地區人民關係條例所規範之大陸地區人民？<\/li>\n<\/ol>\n<p>(A) 旅居國外四年以上或取得當地國籍 (B) 旅居國外四年以上並取得當地國籍 (C) 旅居國外六年以上或取得當地永久居留權 (D) 旅居國外六年以上並取得當地國籍<\/p>\n<p>正確答案：(B)<\/p>\n<ol start=\"47\">\n<li>臺灣地區與大陸地區人民關係條例係以規範涉及兩岸人民往來交流有關之權利義務事項為原則，下列何者是該條例所規範處理項目？<\/li>\n<\/ol>\n<p>①兩岸主權定位問題 ②兩岸政治與經貿議題 ③規範兩岸人民往來交流所衍生之法律事項 ④大陸地區人民在臺取得後取得職務工作之規定<\/p>\n<p>(A) ①② (B) ②③ (C) ③④ (D) ①④<\/p>\n<p>正確答案：(C)<\/p>\n<ol start=\"48\">\n<li>大陸地區人民申請來臺觀光符合一定情形者，內政部移民署得發給逐次加簽或一年多次入出境許可證。下列敘述何者正確？<\/li>\n<\/ol>\n<p>①最近十二個月內曾經符合規定來臺從事個人旅遊二次以上，且無違規情形<\/p>\n<p>②大陸地區帶團領隊<\/p>\n<p>③持有與臺灣地區旅行業者所簽訂合作契約之導遊<\/p>\n<p>④持有經大陸地區核發往來臺灣之個人旅遊多次簽<\/p>\n<p>(A) ①②③ (B) ①②④ (C) ②③④ (D) ①③④<\/p>\n<p>正確答案：(B)<\/p>\n<ol start=\"49\">\n<li>旅行業及導遊人員辦理接待來臺觀光之大陸地區人民業務，應遵守相關規定，下列敘述何者錯誤？<\/li>\n<\/ol>\n<p>(A) 每一團應派逾至少 1 名導遊人員<\/p>\n<p>(B) 行程變更時得視情況通報主管機關<\/p>\n<p>(C) 於團體入境後 2 小時內填具人員接待通報表<\/p>\n<p>(D) 於團體出境後 24 小時內，應通報出境人數及未出境人員名單<\/p>\n<p>正確答案：(B)<\/p>\n<p>解析： 無需通報主管機關。<\/p>\n<ol start=\"50\">\n<li>臺灣旅行業者辦理大陸地區人民來臺從事觀光活動業務，在臺旅遊行程應避開下列那個地方？<\/li>\n<\/ol>\n<p>(A) 國家實驗研究院臺灣半導體研究中心 (B) 東北角鼻頭國小 (C) 龍山寺 (D) 國家人權博物館<\/p>\n<p>正確答案：(A)<\/p>\n<p>解析： 依規定不得進入軍事國防、科技研發等機敏地點。<\/p>\n<p>圖片：＃醒吾旅運系學生<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773572758", "date": "2026-03-15", "title": "導遊領隊考前陪跑 EP103(最終回)", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前陪跑 EP103(最終回) 給醒吾旅運的學生們： 二日辛苦的交通部觀光署領隊導遊考試結束了！無論考得如何，我們都要為自己的努力給予最大的掌聲，因為我們自始至終都努力不懈", "len": 7739, "body": "<p>導遊領隊考前陪跑 EP103(最終回)<\/p>\n<h1>給醒吾旅運的學生們：<\/h1>\n<p>二日辛苦的交通部觀光署領隊導遊考試結束了！無論考得如何，我們都要為自己的努力給予最大的掌聲，因為我們自始至終都努力不懈堅持到最後一刻，沒有中途放棄，沒有成為考試關卡的逃兵！<\/p>\n<p>相信大家都已經感覺到：原來只要參與和行動，就可以獲得很大的成就感，而考試的結果只是所有過程的一小部分，或許是開心也可能是失望，但我們都已真實地去面對與挑戰，也都更熟悉各種關卡的規則與套路。<\/p>\n<p>未來在學校學習與實習的每一刻，都可能會有自覺難以獲得或需要爭取的機會，記得這一次我們共同長跑１００日準備國家考試的經驗，想想那些畫滿重點的課本與筆記，和永遠都記不完的觀光旅遊導覽知識，還有我們一起挑燈夜戰的不變情誼，這樣的一切都會在不遠的未來，都會因為這些養分，讓我們成長為自己期待的樣子。<\/p>\n<p>很開心！感謝大家與老師們一同走過備考的100天😘<\/p>\n<h1>115年交通部觀光署導遊人員評量測驗<\/h1>\n<h1>觀光資源概要<\/h1>\n<h1>現場解題 (答項由AI協助，請先參考便可)<\/h1>\n<ol>\n<li>日本統治臺灣以後，致力壓制平地漢人的抗日活動，無暇顧及原住民的反抗，因此沿襲清代的什麼制度，以阻擋原住民的攻擊？<\/li>\n<\/ol>\n<p>(A) 通事制度 (B) 軍工匠制度 (C) 番屯制度 (D) 隘勇制度<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 隘勇制度是清領至日治初期用以防範原住民、劃分漢番界線並保護樟腦開採的武裝警戒制度。<\/p>\n<ol start=\"2\">\n<li>北迴鐵路的興建對東臺灣影響甚鉅，請問這條鐵路是政府那一個計畫所推動的交通建設？<\/li>\n<\/ol>\n<p>(A) 十大建設 (B) 十二項建設 (C) 十四項建設 (D) 六年國建<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 十大建設包含六項交通建設，北迴鐵路即為其一（1973年動工，1980年通車）。<\/p>\n<ol start=\"3\">\n<li>日治時期臺灣曾發生的漢人農民反抗事件，史稱為下列何者？<\/li>\n<\/ol>\n<p>(A) 郭懷一事件 (B) 濱田彌兵衛事件 (C) 麻豆溪事件 (D) 二林事件<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 二林事件（1925年）是日治時期因甘蔗收購價格爭議引發的農民運動，被視為臺灣農民運動的先聲。<\/p>\n<ol start=\"4\">\n<li>臺灣是多元族群社會，但歷史上跨族群衝突事件亦不少，下列何者牽涉原住民、漢人及西方人？<\/li>\n<\/ol>\n<p>(A) 朱一貴事件 (B) 戴潮春事件 (C) 羅妹號事件 (D) 加禮宛事件<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 羅妹號事件（1867年）涉及美國船隻、排灣族人及清廷（由西方外交官李仙得介入談判），促成了《南岬之盟》。<\/p>\n<ol start=\"5\">\n<li>臺灣於那一個時期開始引進「星期制」及實施「格林威治標準時間」？<\/li>\n<\/ol>\n<p>(A) 民國時期 (B) 日治時期 (C) 清治時期 (D) 荷治時期<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 日本統治臺灣後，為統治便利及現代化，導入了西方的曆法、時間概念與星期制。<\/p>\n<ol start=\"6\">\n<li>位於草嶺古道間的「虎字碑」是那一位清朝官員所立？<\/li>\n<\/ol>\n<p>(A) 徐宗幹 (B) 劉銘傳 (C) 沈葆楨 (D) 劉明燈<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 虎字碑與雄鎮蠻煙碑皆為清同治年間，臺灣總兵劉明燈巡視古道時所題。<\/p>\n<ol start=\"7\">\n<li>「王得祿墓」列屬國定古蹟，請問當年王得祿是因那一場戰爭的爆發，而受清廷之命防禦澎湖，不久卻於防禦期間病逝？<\/li>\n<\/ol>\n<p>(A) 鴉片戰爭 (B) 英法聯軍 (C) 清法戰爭 (D) 牡丹社事件<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 王得祿（清代臺灣官職最高者）於1841年鴉片戰爭期間受命防守澎湖，因積勞成疾病逝，享年72歲。<\/p>\n<ol start=\"8\">\n<li>臺灣不少地方普遍有一個類似的傳說，在戰爭爆發時，會出現媽祖顯靈接炸彈保護民眾，這個傳說所指的戰爭是：<\/li>\n<\/ol>\n<p>(A) 霧社事件時日本空襲原住民部落 (B) 八二三砲戰時中共轟炸金門 (C) 太平洋戰爭時盟軍轟炸臺灣 (D) 抗日戰爭時日軍轟炸中國城市<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 二戰末期（太平洋戰爭），美軍對日治下的臺灣進行大規模轟炸，全臺各地的媽祖廟（如大甲、朴子等）皆有媽祖接炸彈的民俗傳說。<\/p>\n<ol start=\"9\">\n<li>新港文書是荷蘭統治臺灣時期，荷蘭傳教士幫助當時的原住民留下用羅馬文字書寫的文字記錄。請問該文書與下列那一族群有關？<\/li>\n<\/ol>\n<p>(A) 凱達格蘭族 (B) 西拉雅族 (C) 道卡斯族 (D) 巴宰族<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 新港文書（僧侶文字）是台南地區西拉雅族平埔族群所使用的語言記錄。<\/p>\n<ol start=\"10\">\n<li>清明治理臺灣採取「為防亂而治臺」的政策，由於下列那一事件的刺激才出現轉變？<\/li>\n<\/ol>\n<p>(A) 林爽文事件 (B) 大南澳事件 (C) 戴潮春事件 (D) 牡丹社事件<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 1874年的牡丹社事件讓清廷意識到臺灣主權的重要性，從「消極治台」轉向「積極開化」。<\/p>\n<ol start=\"11\">\n<li>臺灣史前文化博物館是臺灣首座國家級的考古博物館，其「康樂本館」外圍有何遺址？<\/li>\n<\/ol>\n<p>(A) 牛罵頭遺址 (B) 十三行遺址 (C) 芝山岩遺址 (D) 卑南遺址<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 國立臺灣史前文化博物館康樂本館位於台東，正是因為興建南迴鐵路卑南站時發現卑南遺址而決定興建。<\/p>\n<ol start=\"12\">\n<li>頂郊為艋舺地區最重要的郊商之一，請問頂郊主要的貿易區域為那個地方？<\/li>\n<\/ol>\n<p>(A) 嘉應州 (B) 廣州 (C) 海南 (D) 泉州<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 清代郊商分「頂、下」，頂郊主要由泉州晉江、惠安、南安商人組成，貿易對象多為泉州。<\/p>\n<ol start=\"13\">\n<li>臺南孔廟中的櫺星門和大成門皆不繪製門神，而以門釘裝飾，請問一扇門左右兩邊一共有幾個門釘？<\/li>\n<\/ol>\n<p>(A) 36 (B) 72 (C) 108 (D) 144<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 孔廟為最高等級建築，其門釘數為「九的倍數」，每扇門54顆，左右兩扇門合計108顆。<\/p>\n<ol start=\"14\">\n<li>樟腦曾為臺灣在十九世紀產業的世界級商品，下列描述何者為正確的組合？①樟腦之生產順利與否端視與原住民之關係 ②大稻埕商人李春生因之致富 ③帶動沿山地帶城鎮的發展 ④樟腦問題是清治末期臺灣與外國糾紛之導火線<\/li>\n<\/ol>\n<p>(A) ①③ (B) ③④ (C) ②④ (D) ②③<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 李春生是以「烏龍茶」致富而非樟腦；樟腦糾紛在清治時期雖有發生（如樟腦戰爭），但與外國糾紛的導火線並非其核心定義。①與③最符合當時社會與經濟現狀。<\/p>\n<ol start=\"15\">\n<li>民國四十三年，美國根據那一部法規協助臺灣，並繼續支持我國在聯合國的代表權？<\/li>\n<\/ol>\n<p>(A) 臺灣關係法 (B) 中美共同防禦條約 (C) 聯合國憲章 (D) 韓戰停戰協定<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 1954年（民國四十三年）簽署《中美共同防禦條約》，奠定了冷戰時期美台軍事同盟關係。<\/p>\n<ol start=\"16\">\n<li>關於臺灣教育的發展，下列敘述何者正確？<\/li>\n<\/ol>\n<p>(A) 荷蘭時代即有設立漢人讀書的學校 (B) 被稱為全臺首學的臺南孔廟是清代臺灣府建制的學校 (C) 日治時期實施義務教育 (D) 臺灣的大專院校是二次大戰後才逐步設立<\/p>\n<p>答案：(C)<\/p>\n<p>解析： (A)荷蘭時期是教原住民新港文字。(B)孔廟是鄭氏時期由陳永華建議設立。(D)日治時期已有台北帝大。1943年日治時期確實開始實施六年制國民義務教育。<\/p>\n<ol start=\"17\">\n<li>「清法戰爭滬尾戰役」為慶祝1884年10月8日法軍攻打淡水的歷史餐宴，其中有一道菜名為「九大人脆酥芋」，以紀念當時淡水守將，請問是那一位將軍？<\/li>\n<\/ol>\n<p>(A) 張李成 (B) 劉銘傳 (C) 孫開華 (D) 廖高元<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 清法戰爭滬尾之役的主帥是孫開華將軍，他指揮清軍與民勇成功擊退法軍登陸。<\/p>\n<ol start=\"18\">\n<li>日本統治臺灣初期對地方社會進行控制的制度性工具，那一項不包括在內？<\/li>\n<\/ol>\n<p>(A) 街庄制度 (B) 警察制度 (C) 保甲制度 (D) 徵兵制度<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 徵兵制度是日治末期（1945年才實施）為因應二戰人力需求，並非初期控制工具。<\/p>\n<ol start=\"19\">\n<li>對臺灣社會產生重大影響的二二八事件，相關發展之先後順序應為：①官方查緝私菸處置不當引發各地動盪，臺籍菁英為維持治安出面組織「二二八事件處理委員會」，最後卻喪命或入獄 ②臺灣人民對脫離日本殖民回歸祖國欣喜期待，但很快就對戰後在臺的新政權表現普遍不滿 ③部分臺籍人士轉赴海外推動臺灣獨立運動 ④政府以清鄉名義進行大規模搜捕<\/li>\n<\/ol>\n<p>(A) ②①④③ (B) ②④③① (C) ①④②③ (D) ①③②④<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 背景不滿(②) -&gt; 查緝私菸爆發與處理委員會成立(①) -&gt; 軍隊抵台後之清鄉(④) -&gt; 海外運動興起(③)。<\/p>\n<ol start=\"20\">\n<li>下列關於基督宗教傳教士之貢獻，那一個組合的描述正確？①馬雅各首先來臺宣教 ②馬偕與李庥共同建立臺灣第一間西式醫院 ③巴克禮發行《臺灣府城教會報》 ④甘為霖致力於盲人教育<\/li>\n<\/ol>\n<p>(A) ①③④ (B) ②③④ (C) ①②④ (D) ①②③<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 台灣第一間西式醫院（新樓醫院）是由馬雅各創立的。馬偕活動於北台灣。其餘選項皆正確。<\/p>\n<ol start=\"21\">\n<li>中橫公路原為臺灣中部東西往來的要道，921集集大地震以後因山崩而中斷，目前因地質破碎而尚未修復，僅開放便道供當地居民特定時段往來。中斷的路段位於那一條河川的谷地？<\/li>\n<\/ol>\n<p>(A) 立霧溪 (B) 木瓜溪 (C) 大甲溪 (D) 大安溪<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 中橫公路西段（德基至谷關）受災最重，該段緊鄰大甲溪流域。<\/p>\n<ol start=\"22\">\n<li>臺灣的地名往往隱含區域文化與歷史意義，請問下列那一個地名與明鄭時期駐軍或屯田拓墾有關？<\/li>\n<\/ol>\n<p>(A) 林鳳營 (B) 五結 (C) 六張犁 (D) 瑞穗<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 凡地名帶有「營」字者，多與明鄭軍屯有關，如林鳳營（林鳳將軍）、新營、柳營。<\/p>\n<ol start=\"23\">\n<li>臺灣四面環海，周圍有多個大小不一、成因各異的島嶼，請問眾多離島中，主要由於火山活動為本體堆積形成的島嶼為下列何者？<\/li>\n<\/ol>\n<p>(A) 琉球嶼 (B) 龜山島 (C) 綠島 (D) 基隆嶼<\/p>\n<p><em>(此題可能為複選概念或單選最典型者)<\/em><\/p>\n<p>答案：(B)、(C)、(D) 皆為火山島。 (若為單選且根據觀光熱度，通常選 B 或 C。但在國家考試標準答案中，琉球嶼是珊瑚礁島，其餘三者均是火山島。)<\/p>\n<ol start=\"24\">\n<li>臺灣北部區域夏季受季風作用，有「竹風蘭雨」的俗諺，觀光活動容易受到影響。請問此氣候特性主要發生在那個季節？<\/li>\n<\/ol>\n<p>(A) 春 (B) 夏 (C) 秋 (D) 冬<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 冬季東北季風盛行，新竹因地形產生強風，蘭陽平原（宜蘭）則因地形抬升造成連日陰雨。<\/p>\n<ol start=\"25\">\n<li>澎湖境內著名景點奎壁山的摩西分海，是位於海中的赤嶼在潮汐變化時，會顯現出與澎湖本島陸地相連的路徑。請問就海岸地形而言，該現象發生在那個位置？<\/li>\n<\/ol>\n<p>(A) 潮間帶 (B) 沙丘丘帶 (C) 潮汐帶 (D) 高位海階面<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 「摩西分海」路徑平時淹沒於海水中，僅在退潮時露出的地帶稱為潮間帶。<\/p>\n<ol start=\"26\">\n<li>臺灣的珍貴生物，如山椒魚、櫻花鉤吻鮭、山毛櫸等都是重要的保育物種，請問上述子遺生物具有何種重要的保育價值？<\/li>\n<\/ol>\n<p>(A) 具藥用價值 (B) 族群的基因庫龐大 (C) 為冰河時期留存至今的物種 (D) 與蚊子幼蟲演化有關<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 櫻花鉤吻鮭與山椒魚皆為著名的「冰河孑遺生物」。<\/p>\n<ol start=\"27\">\n<li>臺灣位於歐亞板塊邊緣，受到板塊推擠，各地皆有溫泉。請問下列那個地方的溫泉是屬於火山作用的硫磺泉？<\/li>\n<\/ol>\n<p>(A) 四重溪溫泉 (B) 關子嶺溫泉 (C) 礁溪溫泉 (D) 北投溫泉<\/p>\n<p>答案：(D)<\/p>\n<p>解析： 北投位於大屯火山群，是典型的硫磺泉。關子嶺是泥漿溫泉，礁溪是碳酸氫鈉泉。<\/p>\n<ol start=\"28\">\n<li>臺灣行政區的命名，往往因治理政權的更迭而產生變動，請問下列那些地名的新舊對應是不一致的？<\/li>\n<\/ol>\n<p>(A) 打貓→民雄 (B) 半線→彰化 (C) 諸羅→嘉義 (D) 打狗→高雄<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 打貓改名為民雄；打貓≠苗栗。苗栗古稱「貓裏」。<\/p>\n<ol start=\"29\">\n<li>臺灣前往北美觀光的飛機常在深夜起飛，主要考量時差的調整問題。小明搭乘華航班機前往溫哥華(W123°)參加會議，他於11月30日在桃園機場23:00起飛，飛行時間約10小時，會議結束後他搭乘當地時間12月6日02:00的班機返回桃園機場，飛行時間約12小時。請問小明抵達溫哥華與回到桃園機場的當地時間，分別是：<\/li>\n<\/ol>\n<p>(A) 12月1日 17:00 抵達溫哥華，12月6日 06:00 回到桃園機場<\/p>\n<p>(B) 11月30日 17:00 抵達溫哥華，12月7日 06:00 回到桃園機場<\/p>\n<p>(C) 12月1日 05:00 抵達溫哥華，12月7日 18:00 回到桃園機場<\/p>\n<p>(D) 11月30日 05:00 抵達溫哥華，12月6日 06:00 回到桃園機場<\/p>\n<p>答案：(B)<\/p>\n<p>解析：<\/p>\n<ol>\n<li>\n<p>時差：桃園(E120)與溫哥華(W120基準)差16小時（桃園快16小時）。<\/p>\n<\/li>\n<li>\n<p>去程：11/30 23:00 + 10hr = 12/1 09:00 (台灣時間)。減去16小時時差 = 11/30 17:00 (溫哥華時間)。<\/p>\n<\/li>\n<li>\n<p>回程：12/6 02:00 (溫哥華時間) + 12hr = 12/6 14:00 (溫哥華時間)。加上16小時時差 = 12/7 06:00 (台灣時間)。<\/p>\n<\/li>\n<li>\n<p>臺灣各地有不少具當地的特色農特產品，其中「柚花茶」是結合該地項農產的特色商品，請問「柚花茶」是下列那一地的特產？<\/p>\n<\/li>\n<\/ol>\n<p>(A) 臺東卑南鄉 (B) 花蓮瑞穗鄉 (C) 臺南麻豆區 (D) 桃園觀音區<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 瑞穗鶴岡盛產文旦，當地結合柚花與茶葉製成獨特的「柚花茶」。<\/p>\n<ol start=\"31\">\n<li>臺灣早期利用篝火誘使鱗翅魚產生趨光性，以吸引青鱗魚群靠近船隻進行捕撈，此技術已逐漸式微。請問下列何地正積極振興此項傳統技術？<\/li>\n<\/ol>\n<p>(A) 屏東東港 (B) 宜蘭蘇澳 (C) 新北金山 (D) 臺中梧棲<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 此為金山著名的「蹦火仔」傳統漁法。<\/p>\n<ol start=\"32\">\n<li>下列那一組動物及其主要棲地的對應關係正確？①黑面琵鷺—雪霸國家公園、玉山國家公園 ②石虎—花蓮萬榮山地、屏東恆春半島 ③櫻花鉤吻鮭—七家灣溪、羅葉尾谷 ④綿崿龜—臺南曾文溪口、蘭陽溪口 ⑤黑面琵鷺—台江內海濕地、七股潟湖<\/li>\n<\/ol>\n<p>(A) ①② (B) ③⑤ (C) ①④ (D) ①⑤<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 黑面琵鷺在七股(⑤)；櫻花鉤吻鮭在七家灣溪(③)。石虎主要在苗栗台中淺山，綿崿龜（可能是指食蛇龜）棲地非所列。<\/p>\n<ol start=\"33\">\n<li>請問鵝鑾鼻及小琉球景點分別隸屬於那一個國家風景區管理？①東北角及宜蘭海岸國家風景區 ②北海岸及觀音山國家風景區 ③雲嘉南濱海國家風景區 ④東部海岸國家風景區 ⑤茂林國家風景區<\/li>\n<\/ol>\n<p>(A) ①③ (B) ②④ (C) ③⑤ (D) ①⑤<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 此題描述有誤，鵝鑾鼻屬墾丁國家公園；小琉球屬大鵬灣國家風景區。若依選項邏輯，小琉球曾與茂林國風景區共同推廣。<em>註：此題選項可能與最新行政劃分略有出入。<\/em><\/p>\n<ol start=\"34\">\n<li>下列那些鄉鎮曾獲得國際慢城認證？①宜蘭縣三星鄉 ②花蓮縣鳳林鎮 ③苗栗縣南庄鄉 ④嘉義縣大林鎮 ⑤屏東縣潮州鎮<\/li>\n<\/ol>\n<p>(A) ①②③ (B) ②③④ (C) ③④⑤ (D) ①④⑤<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 臺灣通過認證的四個慢城為：鳳林、南庄、三義、大林。<\/p>\n<ol start=\"35\">\n<li>臺灣的觀光節慶活動，下列說明何者正確？①鹿港天后宮媽祖遶境—多於農曆三月二十三日前後舉行 ②國際熱氣球嘉年華—主要於冬季舉行 ③東港迎王平安祭典—每三年定期舉行並吸引大量信眾參與 ④平溪天燈節—每年於元宵節時舉行<\/li>\n<\/ol>\n<p>(A) ①② (B) ②③ (C) ③④ (D) ①④<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 熱氣球是在夏季（台東鹿野高台）。媽祖遶境全台皆有，最知名是大甲媽。東港迎王是三年一科。天燈是元宵節。<\/p>\n<ol start=\"36\">\n<li>日治初期，臺灣糖業蓬勃發展，巔峰時期共有43座製糖工廠。戰後這些糖廠也持續運作，但隨著生產成本過高等因素，臺灣製糖產業開始沒落。迄今，大部分糖廠不是裁撤，就是轉型為觀光糖廠。請問下列那一座糖廠仍持續製糖事業？<\/li>\n<\/ol>\n<p>(A) 雲林虎尾糖廠 (B) 高雄橋仔頭糖廠 (C) 花蓮光復糖廠 (D) 臺南新營糖廠<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 目前臺灣僅存虎尾與善化兩座糖廠仍在進行壓榨製糖。<\/p>\n<ol start=\"37\">\n<li>臺灣歷經荷蘭、西班牙、明鄭、滿清與日本的統治，造就當代臺灣豐富多元的文化內涵，請問下列那些文化特色的敘述正確？①屏東萬金聖母聖殿為荷蘭傳教士起造，現為縣定古蹟 ②基隆和平島的諸聖教堂為西班牙人所建造的建築 ③臺南孔廟興建於明鄭時期 ④現存清代布政使司衙門門樓位於臺南市 ⑤新竹火車站是日治時期所興建<\/li>\n<\/ol>\n<p>(A) ①③④ (B) ①④⑤ (C) ②③⑤ (D) ③④⑤<\/p>\n<p>答案：(C)<\/p>\n<p>解析： (1)萬金聖母殿是天主教（西班牙/道明會相關）非荷蘭。(4)布政使司衙門在台北植物園內。(2)、(3)、(5)正確。<\/p>\n<h1>第 4 頁<\/h1>\n<ol start=\"38\">\n<li>有關我國的離島，下列敘述何者正確？①蘭嶼有國家公園之假設 ②馬祖列島有國家風景區之假設 ③以「北海坑道」著名的島嶼是金門 ④以「朝日溫泉」著名的島嶼是小琉球 ⑤以「風櫃聽濤」著名的澎湖<\/li>\n<\/ol>\n<p>(A) ①②⑤ (B) ②③ (C) ②⑤ (D) ③④<\/p>\n<p>答案：(C)<\/p>\n<p>解析： (1)蘭嶼非國家公園。(3)北海坑道在馬祖最有名（金門也有翟山）。(4)朝日溫泉在綠島。(2)與(5)正確。<\/p>\n<ol start=\"39\">\n<li>省道臺三線又被稱為「內山公路」，屬於景觀公路的一項。其主要分布沿著山地與平地的淺山地區而興建，沿途有不少獨具特色的觀光活動。請問下列那一項活動，是旅遊團體觀光台三線行程中較少納入的？<\/li>\n<\/ol>\n<p>(A) 鹿港老街體驗 (B) 品嚐古坑咖啡 (C) 騎行東豐自行車道 (D) 旗山老街探訪<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 鹿港老街位於彰化沿海，不屬於台三線（內山）沿線。<\/p>\n<ol start=\"40\">\n<li>臺灣擁有多個惡地地形區，成為地方獨特地景。下列那些風景區因惡地地形而聞名？①苗栗火炎山 ②宜蘭抹抹茶山 ③高雄月世界 ④臺東利吉 ⑤南投九九峰<\/li>\n<\/ol>\n<p>(A) ①②⑤ (B) ①③④ (C) ②③⑤ (D) ③④⑤<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 抹茶山是植被景觀。火炎山、月世界、利吉均為著名的惡地（泥岩或礫岩）。<\/p>\n<ol start=\"41\">\n<li>根據資源管理法規，進入下列何地無需事先申請？<\/li>\n<\/ol>\n<p>(A) 福山植物園 (B) 億載金城 (C) 玉山主峰 (D) 插天山自然保留區<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 億載金城為開放古蹟觀光景點。其餘三者均需預約申請或辦理入山/入園證。<\/p>\n<ol start=\"42\">\n<li>下列各類觀光資源與其對應的管理法規何者正確？<\/li>\n<\/ol>\n<p>(A) 自然保留區—文化資產保存法 (B) 國家自然公園—風景特定區管理規則 (C) 國家森林遊樂區—野生動物保育法 (D) 國家風景區—國家公園法<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 自然保留區與古蹟同屬《文資法》管轄。國家公園依《國家公園法》，風景區依《發展觀光條例》。<\/p>\n<ol start=\"43\">\n<li>在臺灣民間信仰中，那一位神明被尊奉為「醫藥與冶病」之神，主管醫療事務？<\/li>\n<\/ol>\n<p>(A) 保生大帝 (B) 天上聖母 (C) 巧聖先師 (D) 田都元帥<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 保生大帝（吳真人）是著名的醫藥之神。<\/p>\n<ol start=\"44\">\n<li>知名的「關子嶺溫泉區」位於下列那一個國家風景區的範圍內？<\/li>\n<\/ol>\n<p>(A) 雲嘉南濱海國家風景區 (B) 茂林國家風景區 (C) 西拉雅國家風景區 (D) 西拉雅國家風景區<\/p>\n<p><em>(註：圖中選項C與D重複)<\/em><\/p>\n<p>答案：(C)<\/p>\n<p>解析： 關子嶺溫泉隸屬於西拉雅國家風景區。<\/p>\n<ol start=\"45\">\n<li>近年來國家風景區管理處為提升臺灣的旅遊品質，積極透過活動的舉辦吸引國內外遊客。下列有關活動主題與對應主辦的國家風景區管理處何者正確？<\/li>\n<\/ol>\n<p>(A) 草嶺古道芒花季—北海岸及觀音山國家風景區管理處 (B) 澎湖國際熱氣球嘉年華—東部海岸國家風景區管理處 (C) 雙年賞蝶—西拉雅國家風景區管理處 (D) 山谷燈光節—參山國家風景區管理處<\/p>\n<p>答案：(D)<\/p>\n<p>解析： (A)草嶺古道屬東北角。(B)熱氣球主場在台東縱谷。(C)賞蝶活動多在茂林。(D)山谷燈光節確為參山處（梨山、谷關）主辦。<\/p>\n<ol start=\"46\">\n<li>試問旅遊使用量對觀光遊憩品質成行為改變的影響程度，據以判定之遊憩承載量為下列何者？<\/li>\n<\/ol>\n<p>(A) 社會承載量 (B) 生態承載量 (C) 實質承載量 (D) 設施承載量<\/p>\n<p>答案：(A)<\/p>\n<p>解析： 社會承載量是指遊客因擁擠感而影響心理感受與滿意度。<\/p>\n<ol start=\"47\">\n<li>「和平島地質公園」目前隸屬於下列那一個國家風景區的範圍？<\/li>\n<\/ol>\n<p>(A) 東北角及宜蘭海岸國家風景區 (B) 北海岸及觀音山國家風景區 (C) 東部海岸國家風景區 (D) 花東縱谷國家風景區<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 基隆和平島現已劃歸北觀國家風景區管轄。<\/p>\n<ol start=\"48\">\n<li>我國國土最寬領域範圍內，最北端所設立的燈塔為下列何者？<\/li>\n<\/ol>\n<p>(A) 彭佳嶼燈塔 (B) 東引燈塔 (C) 三貂角燈塔 (D) 花蓮港燈塔<\/p>\n<p>答案：(B)<\/p>\n<p>解析： 東引燈塔（中柱港附近）是我國領土最北端的燈塔。若僅指台灣本島則為富貴角。<\/p>\n<ol start=\"49\">\n<li>依國家公園法之分區管制，下列何者屬於嚴格限制開發行為之地區？<\/li>\n<\/ol>\n<p>(A) 遊憩區 (B) 史蹟保存區 (C) 特別景觀區 (D) 一般管制區<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 特別景觀區與生態保護區是國家公園內管制最嚴格的地區，禁止開發與商業行為。<\/p>\n<ol start=\"50\">\n<li>下列 4 座「龍山寺」，依建築的時間先後順序排列為何？①臺南龍山寺 ②艋舺龍山寺 ③淡水龍山寺 ④鳳山龍山寺<\/li>\n<\/ol>\n<p>(A) ②③④① (B) ③④②① (C) ①②④③ (D) ④③①②<\/p>\n<p>答案：(C)<\/p>\n<p>解析： 臺灣五座龍山寺（台南、鹿港、鳳山、艋舺、淡水）多建於清代。通常台南龍山寺（康熙年間）最早，淡水龍山寺（咸豐年間）較晚。<\/p>\n<p>圖片：＃醒吾旅運系學生<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773455442", "date": "2026-03-14", "title": "導遊領隊考前陪跑 EP99", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前陪跑 EP99 115年領隊人員評量測驗試題 #領隊實務 現場解題 (答項由AI協助，請先參考便可) 1.關於中風之急救作法的敘述，下列何者錯誤？ (A)患者意識清醒時", "len": 7512, "body": "<p>導遊領隊考前陪跑 EP99<\/p>\n<h1>115年領隊人員評量測驗試題 #領隊實務<\/h1>\n<h1>現場解題 (答項由AI協助，請先參考便可)<\/h1>\n<p>1.關於中風之急救作法的敘述，下列何者錯誤？<\/p>\n<p>(A)患者意識清醒時給予平躺，頭肩部墊高(B)若有分泌物流出，使患者頭側一邊(C)鬆解衣物並保暖(D)可立即給予飲水並協助其飲用。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：中風患者可能會有吞嚥障礙，貿然給水會導致嗆到或吸入性肺炎。<\/p>\n<p>2.下列何種情況適合使用哈姆立克法(HeimlichManeuver)急救施作？<\/p>\n<p>(A)呼吸道異物完全阻塞(B)呼吸道異物部分阻塞(C)心跳停止(D)呼吸停止。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：哈姆立克法專用於排除呼吸道完全阻塞的異物。部分阻塞應鼓勵咳嗽；心跳呼吸停止需施作CPR。<\/p>\n<p>3.火災燒傷造成傷害初期，最易導致死亡的原因，下列敘述何者正確？<\/p>\n<p>(A)傷口感染(B)呼吸道吸入性燒傷(C)燒傷產生的脫水休克(D)燒傷引起的疼痛。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：火場初期最致命的是濃煙導致的呼吸道吸入性灼傷與窒息。<\/p>\n<p>4.有關燒燙傷的緊急處理口訣：「沖脫泡蓋送」，在送醫前的緊急處理過程中，下列敘述何者錯誤？<\/p>\n<p>(A)沖：在流動的清水下沖洗10分鐘，勿施太太大(B)脫：脫除燙傷部位之飾品及衣物(C)泡：如無傷口情形，可持續在冷水中浸泡著(D)送：蓋上濕紗布或乾淨的濕衣物。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：沖水時間通常建議為15-30分鐘，直到痛感減輕。<\/p>\n<p>5.新冠病毒主要經由下列哪一種途徑傳染？<\/p>\n<p>(A)空氣或飛沫傳染(B)食物或飲水傳染(C)接觸傳染(D)蟲媒傳染。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：新冠病毒（COVID-19）主要透過呼吸道飛沫與氣溶膠傳播。<\/p>\n<p>6.旅遊途中有團員突然有呼吸急促、盜汗、心悸、嘔心、嘔吐、胸悶痛等症狀，可能有何健康問題，且應如何處置？<\/p>\n<p>(A)心灼熱感：建議吃制酸劑(B)食物哽在食道：建議喝水(C)心臟病發作：建議打當地緊急電話(D)胸悶痛：建議服用止痛藥物。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：題幹描述的是典型心肌梗塞症狀，屬急症，必須立即就醫。<\/p>\n<p>7.團員生病需送醫時，應明確描述病情告知醫師，下列敘述何者錯誤？<\/p>\n<p>(A)完整的主訴，可以快速引導醫師正確的診斷(B)由鄰居上往下循序做主訴(C)詳細說明所有曾罹患的疾病(D)應告知家族相關病史。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：應以「目前最不舒服的症狀（主訴）」優先說明，而非依照地理位置排序。<\/p>\n<p>8.經由飲食不當，吃到被污染的食物而引起的肝炎，下列何者正確？<\/p>\n<p>(A)A型肝炎(B)B型肝炎(C)C型肝炎(D)D型肝炎。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：A肝與E肝主要是經由糞口（飲食）傳染。<\/p>\n<p>9.旅遊團共30人，其中包含3位素食者，1位糖尿病患者，領隊在訂餐時，提供了以下資訊：旅行團名稱、用餐人數、餐食為七菜一湯，餐標每人為20歐元、預計抵達時間18:30。請問領隊最主要忽略下列哪一項關鍵資訊，導致餐廳無法妥善安排？<\/p>\n<p>(A)帶團人員姓名(B)何時要支付訂金給餐廳(C)是否需要包廂或特殊座位安排(D)特殊飲食需求人數。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：領隊未明確告知餐廳有3位素食及1位糖尿病特殊需求。<\/p>\n<p>10.東澳8天旅行團於清晨抵達布里斯班(Brisbane)後，立即展開觀光行程，午後前往黃金海岸並入住海灘旁的飯店，領隊告知團員休息補眠2小時，並預定下午5點喚醒；請問領隊應如何向飯店總機表達喚醒團員需求？<\/p>\n<p>(A)Collectcall(B)Check-incall(C)Follow-upcall(D)Wake-upcall。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：飯店晨喚服務稱為Wake-upcall。<\/p>\n<p>11.團體旅遊入住飯店時，旅客要求領隊安排與同親友鄰近之房間，方便彼此的聯繫，請問領隊人員應如何安排一種較適當的客房房型給該組團員？<\/p>\n<p>(A)AccessibleRoom(B)ConnectingRoom(C)DormitoryRoom(D)FamilyRoom。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：ConnectingRoom（連通房）中間有門可互通，適合親友。<\/p>\n<p>12.義瑞法12天旅遊團體於出發前召開行前說明會，領隊說明該團班機臺北起飛時間為2月8日23:25(GMT+8)，直飛(Non-stop)羅馬抵達時間為2月9日07:15(GMT+1)，團員詢問該班機飛往目的地的需要飛行時間為何？<\/p>\n<p>(A)13小時20分鐘(B)13小時50分鐘(C)14小時20分鐘(D)14小時50分鐘。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：先將兩地換成同一時區（如GMT+8）。抵達時間為2/914:15(GMT+8)。從2/823:25到2/914:15，總時長為14小時50分鐘。<\/p>\n<p>13.團體抵達餐廳時，發現餐廳並未保留座位，導致團員必須等待至少50分鐘，追查原因是領隊未事先再確認；下列何者是領隊最合適的處理方式？<\/p>\n<p>(A)當場責怪餐廳失誤，要求立即安排座位並給予賠償(B)向團員誠懇致歉，先安置團員於餐廳外休息區，再積極協調餐廳加快處理，並準備補償方案(C)因餐廳無法即時應變，帶領團員立即離開，另尋附近餐廳用餐，不必與原餐廳再行協調(D)立即向團員致歉與說明是公司內部作業疏失，與自己操作無關。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：領隊應展現專業與誠意，優先安置旅客並解決問題，不應推諉責任或在客人面前與餐廳爭吵。<\/p>\n<p>14.領隊帶團抵達義大利威尼斯(Venice)用餐時，發現餐廳地點位於巷弄中且門牌路標辨識不易，為預防團員因此分散迷路，下列何者為領隊最合適的作法？<\/p>\n<p>(A)抵達當地後再依手機導航隨時帶領團員前往餐廳(B)領隊以口頭方式描述路線後，讓團員分組自由前往餐廳，並要求各組回報到達狀況(C)指派團員協助辨識路線，讓團員自由活動後再各自前往餐廳集合(D)先瞭解餐廳的正確位置，並記住附近明顯地標，以利團員辨識餐廳位置。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：熟悉地形、尋找地標是預防走失的最佳專業做法。<\/p>\n<p>15.在辦理團體退房(Check-Out)手續，準備離開飯店前，領隊最重要工作有：(1)詢問團員個人行李和貴重物品是否確實及上車前已確認看見自己大行李上車(2)住宿與個人消費費用等是否已付清(3)清點團體行李件數是否有缺少及是否全數運上遊覽車(4)請團員上車點名。下列何者為領隊較合適的操作順序？<\/p>\n<p>(A)4-3-2-1(B)2-1-3-4(C)2-3-1-4(D)1-2-3-4。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：流程通常是：結清帳單(2)-&gt;提醒個人行李與物品(1)-&gt;清點團體行李上車(3)-&gt;上車點名(4)。<\/p>\n<p>16.西羅馬帝國於西元476年滅亡，對應中國朝代，下列何者正確？<\/p>\n<p>(A)漢朝(B)唐朝(C)南北朝(D)宋朝。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：西元476年為中國的南北朝時期。<\/p>\n<p>17.下列那一位法國國王在位時間最短？<\/p>\n<p>(A)路易十三(B)路易十四(C)路易十五(D)路易十六。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：路易十六在法國大革命中被處死，在位時間相對較短且下場最慘（雖然路易十九僅在位20分鐘，但選項中以十六為準）。<\/p>\n<p>18.使用ABACUS訂位系統，輸入123NOVSFOTPE11PYVR，其指定的轉機點為下列那個城市？<\/p>\n<p>(A)NOV(B)SFO(C)TPE(D)YVR。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：指令結構中，SFO(舊金山)為轉機點，TPE為出發地或目的地。<\/p>\n<p>19.出國團體搭機旅遊，帶團人員應特別注意各個機場之MCT規定。所謂的MCT規定指的是下列何者？<\/p>\n<p>(A)最短轉機時間限制(B)最長轉機時間限制(C)最低團體人數限制(D)最高行李重量限制。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：MCT=MinimumConnectingTime。<\/p>\n<p>20.航空票務訂位中航空公司代號，下列何者正確？<\/p>\n<p>(A)大韓航空KA(B)馬來西亞航空MS(C)華信航空AS(D)澳洲航空QF。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：大韓航空是KE，馬航是MH，華信是AE。澳洲航空正確為QF。<\/p>\n<p>21.航空票務訂位中機場代號，下列何者正確？<\/p>\n<p>(A)日本東京羽田HNT(B)日本大阪關西KIX(C)韓國首爾仁川ICL(D)美國紐約甘迺迪EWK。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：羽田是HND，仁川是ICN，甘迺迪是JFK。KIX為關西機場正確代號。<\/p>\n<p>22.航空票務訂位中，有關機位確認狀態，下列代號何者錯誤？<\/p>\n<p>(A)KR(B)HK(C)KK(D)KL。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：HK(Confirmed),KK(Confirming),KL(Waitlistconfirmed)。KR不是標準機位狀態代號。<\/p>\n<p>23.航空票務訂位中，那一項為有關旅客攜帶寵物託運特殊行李使用代號？<\/p>\n<p>(A)PEAG(B)PEBG(C)PEBC(D)PETC。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：PETC=PetInCabin(或一般寵物代號)。<\/p>\n<p>24.關於英文邀請函，通常會在左下角註記何種縮寫代號，代表敬請回覆？<\/p>\n<p>(A)ASAP(B)ASST(C)MAAS(D)RSVP。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：RSVP(Répondezs'ilvousplaît)。<\/p>\n<p>25.旅館房價，僅供住宿「不包含任何餐食」的計費方式，稱之為何？<\/p>\n<p>(A)AmericanPlan(AP)(B)ContinentalPlan(CP)(C)EuropeanPlan(EP)(D)BermudaPlan(BP)。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：EP為純住宿。<\/p>\n<p>26.有關名片遞送的禮儀，下列敘述何者較為適宜？<\/p>\n<p>(A)名片印刷內容朝下，避免別人看到(B)接收過對方名片，應立即收起，之後再看(C)名片須同時遞給多人，順序要「由遠而近」(D)由職位較低者先遞送名片給職位較高者。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：國際禮儀中，位階低者應先遞名片。<\/p>\n<p>27.傳統英式下午茶用餐禮儀，是以三層瓷盤下午茶架擺放各式點心，請問最上層應放置何種點心？<\/p>\n<p>(A)三明治(B)鹹派(C)司康(D)水果塔。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：傳統由下而上是鹹到甜：底層三明治，中層司康，上層甜點/水果。<\/p>\n<p>28.在美國搭乘三排座椅之九人座小巴士，下列何者為最尊之座位？<\/p>\n<p>(A)司機旁邊(B)司機後面最後一排右邊靠門座位(C)司機後面一排中間座位(D)最後第三排中間座位。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：小巴通常以司機後方、右側靠門位置（方便上下車且安全）為尊。<\/p>\n<p>29.在國家重要典禮演奏國歌時，在場的政府文職官員應行何種禮才恰當？<\/p>\n<p>(A)拱手禮(B)扶手禮(C)舉手禮(D)握手禮。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：文職官員行「扶手禮」（右手按左胸），軍職行舉手禮。<\/p>\n<p>30.用餐禮儀中，西餐進餐時，如果餐具掉落，應如何處置？<\/p>\n<p>(A)自行撿起(B)請服務生協助換新餐具(C)拿別的餐具代替(D)請附近的人幫忙撿起。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：旅客不應自行彎腰撿拾，應示意服務生處理。<\/p>\n<p>31.預防團員於參觀途中走失，領隊宜採何種方式最合適？<\/p>\n<p>(A)將行程向駐外單位報備，以便隨時提供援助(B)提供團員當地警方電話，以備不時之需(C)事先與旅客約定，在原地等候以待領隊回頭尋找(D)將主要資料如機票、護照、簽證等存放於旅館保險箱內，以策安全。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：「原地等候」是防止走失後距離越拉越遠的最有效指導。<\/p>\n<p>32.下列何者不是旅行業者經常利用附加費用之方式，轉向團體旅遊旅客收取費用之項目？<\/p>\n<p>(A)機票(B)機場稅(C)簽證費用(D)燃油附加費。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：機票是主體費用，非附加費用(Surcharge)。<\/p>\n<p>33.帶團搭乘郵輪時，因惡劣天氣因素導致無法如期靠岸，團員開始抱怨並擔心行程受影響，此時領隊應如何處理？<\/p>\n<p>(A)向旅客保證一定會照原有行程(B)向旅客誠實說明情況，安撫情緒，並隨時協調後續行程調整(C)請旅客自行上網查詢資訊(D)無視抱怨，等天氣好轉再說。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：誠實溝通、專業協調是領隊危機處理的核心。<\/p>\n<p>34.依緊急事故處理「CRISIS」六部曲之內涵，關於「說明(Interpretation)」，下列敘述何者正確？<\/p>\n<p>(A)取得相關文件，如報案文件(B)主要在控制、掌握客人行動及心態(C)向各個可能的人員尋求協助(D)保持冷靜，藉5W2H建立思考及反應模式。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：Interpretation在此架構下意指對狀況的說明與掌控旅客心理。<\/p>\n<p>35.有關搭乘遊覽車遇緊急事故，若自動門及安全門皆無法開啟，需使用車窗擊破器擊碎車窗玻璃逃生時，下列操作方法何者正確？<\/p>\n<p>(A)直接敲擊玻璃中央(B)敲擊玻璃四個角落(C)敲擊玻璃下緣中點(D)先敲擊破壞再用腳踹開。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：強化玻璃的四角是最脆弱點。<\/p>\n<p>36.有關旅行社所投保旅行業責任保險附加「海外緊急救助」，是由下列何機關（構）所提供出國旅客緊急的各項救助服務？<\/p>\n<p>(A)交通部觀光署(B)外交部(C)中華民國旅行業品質保障協會(D)保險機構（公司）。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：這是保險契約的一部分，由保險公司及其特約救援公司提供。<\/p>\n<p>37.旅外國人遭遇急難，駐外機構確認當事人短時間內無法獲得財務支援，且有迫切返國需要時，駐外機構得提供候補返國期間基本生活費借款，其最高金額不超過多少美元？<\/p>\n<p>(A)500(B)600(C)800(D)1,000。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：旅外國人遭遇急難，駐外機構經確認當事人無法立即於短時間內依第八點方式獲得財務濟助，且有迫切返國需要者，得代購最經濟之返國機票，及提供當事人於候機返國期間不逾八百美元（或等值當地幣）之基本生活費用借款。<\/p>\n<p>38.下列何者屬於我國駐外機構可提供之急難救助？<\/p>\n<p>(A)調解民事、刑事或勞資糾紛(B)代墊醫療、住院等款項(C)提供涉及司法事件之法律意見(D)提供遭遇不可抗力事件之因應資訊及必要協助。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：駐外機構不介入司法與金錢代墊，但提供資訊與行政協助。<\/p>\n<p>39.旅遊途中因不可抗力或不可歸責於旅行社的事由，致無法履行預定之旅程、食宿或遊覽項目時，下列敘述何者適當？<\/p>\n<p>(A)因行程減少或增加的費用，均由旅行社自行承擔(B)旅客同意變更行程後，不得主張任何退款或補償(C)因行程減少而節省之費用，應退還旅客；因不可抗力增加之費用，不得向旅客收取(D)因行程減少而節省之費用，應退還旅客；因不可抗力增加之費用，得向旅客收取。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：根據定型化契約，節省的退還旅客，增加的由旅客負擔（但通常由雙方協商）。<\/p>\n<p>40.團員在國外發生「非因旅行社故意或過失所致」的身體或財產事故時，下列敘述何者最適當？<\/p>\n<p>(A)旅行社應盡善良管理人之注意，全額支付旅客所有醫療及相關費用(B)旅行社應盡善良管理人之注意協助旅客處理，費用由旅客自行負擔，且事前應告知可能費用(C)非因旅行社故意或過失所致，旅行社無須提供協助，旅客需自行處理事宜(D)非因旅行社故意或過失所致，旅行社僅需提供所衍生之食宿與交通費用。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：領隊有道義與契約上的協助義務，但非由旅行社買單。<\/p>\n<p>41.若團員因旅行社過失（例如未辦妥簽證）而被目的地的國拒絕入境，下列處理方式何者正確？<\/p>\n<p>(A)旅行社無須負擔費用，由團員自行處理返國或滯留問題(B)安排團員至下一站與其他團員會合，或安排返國，所衍生費用由旅行社負擔(C)領隊僅需提供聯絡資訊，無須安排後續行程或返國(D)旅行社僅負責通知國外代理旅行社，由代理旅行社負責費用及處理。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：旅行社過失導致無法入境，須負擔賠償與回程費用。<\/p>\n<p>42.有關海外急難救助(OverseasEmergencyAssistance,OEA)，下列敘述何者正確？<\/p>\n<p>(A)僅提供醫療諮詢與住院安排服務，不包含法律或旅行相關協助(B)是一種國際性救援服務，涵蓋醫療、法律、旅遊及緊急事件協助等多項緊急支援服務(C)為信用卡附贈的海外緊急救援服務提供，不提供保險公司保戶使用(D)保戶出國時，即可無條件使用海外急難救助服務，與保險契約狀態無關。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：OEA涵蓋範圍廣泛，包含醫療轉院、法律推薦等。<\/p>\n<p>43.某團員參加北歐12日團體旅遊行程，因冰島火山爆發導致航班取消，延後8日返國。滯留期間每日額外住宿與旅行費用支出為新臺幣3,000元，依旅行業責任保險額外住宿與旅行費用附加條款，每一旅遊團員理賠金額上限為多少元？<\/p>\n<p>(A)8,000元(B)16,000元(C)20,000元(D)24,000元。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：依保險條款，海外旅程更改費用之理賠限額通常為新台幣2萬元。<\/p>\n<p>44.為降低國外旅遊時因跨越時區多而產生的時差影響，下列何項作法最優當？<\/p>\n<p>(A)抵達目的地後立即安排重要會議或旅遊行程，以加速生理時鐘調整(B)飛行途中多飲酒或含咖啡因飲料，可幫助維持清醒，減少時差反應(C)出發前可逐步調整睡眠時間，抵達後白天多曬陽光，夜晚避免光照(D)可自行購買含褪黑激素的保健食品，以快速調整生理時鐘。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：陽光是調整生理時鐘最自然的工具。<\/p>\n<p>45.旅客於海外因意外受傷需緊急就醫，若不懂當地語言，請領隊辦理協助的服務，下列何者除外？<\/p>\n<p>(A)代墊或代付入院保證金(B)提供醫院及專業翻譯人員名單(C)協助與家人聯繫(D)協助通知保險公司。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：領隊與旅行社不負擔代墊醫療費用的義務。<\/p>\n<p>46.團體因班機取消，導致全團滯留機場，且飯店全滿，作為領隊應如何處置？<\/p>\n<p>(A)立即安撫團員，聯繫旅行社與航空公司安排餐券或臨時住宿(B)要求團員自行解決住宿，隔日再集合(C)讓團員投票決定要不要改搭其他航空公司(D)立即退票改搭其他航空公司。<\/p>\n<p>答案：(A)<\/p>\n<p>解析：領隊應優先安撫並透過公司管道向航空公司爭取權益。<\/p>\n<p>47.若旅行團遇到天然災害（例如地震、颱風、洪水）時，導致團員受傷，下列何者並非領隊負責的工作？<\/p>\n<p>(A)將團員送醫(B)通知旅行社(C)向媒體說明(D)照顧團員並記錄事件處理過程。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：發言權通常歸屬於公司發言人，領隊應避免私自對媒體發表評論。<\/p>\n<p>48.帶領銀髮族團體入住旅館，為使行李員將行李儘快送到房間，領隊應如何處理最為適當？<\/p>\n<p>(A)請行李員在20分鐘內完成所有行李運送(B)請團員自行提行李至房間(C)領隊親自一間一間送行李(D)協助行李員在行李牌上寫上房號。<\/p>\n<p>答案：(D)<\/p>\n<p>解析：標註清楚房號能最有效提升行李運送效率。<\/p>\n<p>49.團體於日本旅遊時遇強震，以致當地交通全面中斷，領隊應如何因應？<\/p>\n<p>(A)按照行程表前往景點(B)請旅客自行活動(C)帶團撤離至安全區域並通報旅行社與駐外館處(D)等待媒體報導再決定。<\/p>\n<p>答案：(C)<\/p>\n<p>解析：安全第一，並立即啟動通報機制。<\/p>\n<p>50.團體返臺至桃園機場，發現一名團員行李未到，經領隊向航空公司詢問登記後，確認行李須等隔日才能抵臺，請問領隊可以幫此名團員向航空公司爭取什麼權益？<\/p>\n<p>(A)申請行李延誤費(B)將行李送達團員住處(C)申請日常用品支出費用(D)申請旅遊不便險。<\/p>\n<p>答案：(B)<\/p>\n<p>解析：行李延誤時，航空公司負有將行李送達旅客指定地點（住處或飯店）的義務。<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773476550", "date": "2026-03-14", "title": "導遊領隊考前陪跑 EP100", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前陪跑 EP100 115年領隊人員評量測驗試題 #領隊法規 現場解題 (答項由AI協助，請先參考便可) 小英高職觀光科畢業，目前擔任旅行社業務人員，同時兼任領隊人員。需", "len": 8345, "body": "<p>導遊領隊考前陪跑 EP100<\/p>\n<h1>115年領隊人員評量測驗試題 #領隊法規<\/h1>\n<h1>現場解題 (答項由AI協助，請先參考便可)<\/h1>\n<ol>\n<li>小英高職觀光科畢業，目前擔任旅行社業務人員，同時兼任領隊人員。需幾年年資才具備旅行業經理人受訓資格？<\/li>\n<\/ol>\n<p>(A) 2年 (B) 3年 (C) 5年 (D) 6年<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 依《旅行業管理規則》，高職畢業從事旅行業業務、領隊工作者，需滿 6 年年資方可參加經理人訓練。<\/p>\n<ol start=\"2\">\n<li>小李帶團前往美國，途中巴士發生車禍，導致 2 位旅客死亡、5 位旅客重傷。小李依據規定應於時限之內儘速回報受僱旅行業者與哪一單位？<\/li>\n<\/ol>\n<p>(A) 駐美國臺北經濟文化代表處 (B) 交通部觀光署駐紐約辦事處 (C) 交通部觀光署駐舊金山辦事處 (D) 交通部觀光署<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 發生重大事故時，領隊應立即處理並通報受僱旅行業，旅行業應即向交通部觀光署報備。<\/p>\n<ol start=\"3\">\n<li>依「領隊人員管理規則」規定，參加領隊人員職前訓練測驗，因正當事由，經核准延期測驗者，應於最長多久期間內申請測驗？<\/li>\n<\/ol>\n<p>(A) 3個月 (B) 6個月 (C) 1年 (D) 2年<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 依規定，經核准延期測驗者，應於 6 個月內申請測驗。<\/p>\n<ol start=\"4\">\n<li>大明擔任領隊工作因故其領隊人員執業證被廢止，請問大明至少需幾年之後才能再任領隊工作？<\/li>\n<\/ol>\n<p>(A) 1年 (B) 3年 (C) 5年 (D) 10年<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 執業證經廢止者，自廢止之日起 5 年內不得領取執業證。<\/p>\n<ol start=\"5\">\n<li>依「領隊人員管理規則」規定，領隊人員取得結業證書或執業證後，連續多久未執行領隊業務者，應依規定重新參加訓練結業，領取或換領執業證後，始得執行領隊業務？<\/li>\n<\/ol>\n<p>(A) 1年 (B) 2年 (C) 3年 (D) 5年<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 連續 3 年未執行領隊業務者，重返崗位需重新參加職前訓練。<\/p>\n<ol start=\"6\">\n<li>未依「發展觀光條例」規定取得執業證而執行領隊人員業務者，應處罰鍰之範圍為何？<\/li>\n<\/ol>\n<p>(A) 新臺幣 3,000 元以上 15,000 元以下 (B) 新臺幣 5,000 元以上 25,000 元以下 (C) 新臺幣 10,000 元以上 50,000 元以下 (D) 新臺幣 30,000 元以上 150,000 元以下<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 無照執行領隊業務者，處 1 萬元以上 5 萬元以下罰鍰。<\/p>\n<ol start=\"7\">\n<li>「Tourism 2030 臺灣觀光政策白皮書」推動重點工作策略，下列幾項正確？①觀光品牌全球引客 ②智慧景區價值升級 ③跨域整合多元旅遊 ④環島亮點捲動出國<\/li>\n<\/ol>\n<p>(A) ①②③ (B) ①②④ (C) ①③④ (D) ②③④<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 策略包含品牌引客、智慧升級、跨域旅遊等，「環島亮點捲動出國」非其核心策略方針（重點在吸引外客來台）。<\/p>\n<ol start=\"8\">\n<li>依據「發展觀光條例」，下列對旅行業的敘述，那幾項正確？①要求投保履約保證保險和責任保險 ②規定非法經營或違規行為的罰鍰 ③經營應先向各級主管機關申請核准 ④劃分業別（綜合、甲種、乙種旅行業）<\/li>\n<\/ol>\n<p>(A) ①③④ (B) ①②④ (C) ①②③ (D) ②③④<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 旅行業經營需向「中央」主管機關（觀光署）申請，而非「各級」。<\/p>\n<ol start=\"9\">\n<li>綜合旅行業可經營下列那幾項業務？①委託或代理其他綜合旅行業招攬的業務 ②委託甲種旅行業代為招攬或接待國內外旅客並安排旅遊、食宿及交通業務 ③委託乙種旅行業代為招攬或接待本國旅客並安排旅遊、食宿及交通等國內團體旅遊業務 ④設計國內外旅程、安排導遊人員或領隊人員 ⑤向旅客收取中途離隊之離團費用<\/li>\n<\/ol>\n<p>(A) ②③④⑤ (B) ①②④⑤ (C) ①③④⑤ (D) ①②③④<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 綜合旅行業業務廣泛，包含委託甲/乙種代辦，但不得向旅客隨意收取「離團費用」（除非契約另有約定）。<\/p>\n<ol start=\"10\">\n<li>依「旅行業管理規則」，旅行業應繳納之保證金規定，下列何者正確？<\/li>\n<\/ol>\n<p>(A) 綜合旅行業新臺幣 1,200 萬元 (B) 甲種旅行業新臺幣 150 萬元 (C) 乙種旅行業新臺幣 100 萬元 (D) 綜合、甲種、乙種旅行業每一分公司皆為新臺幣 30 萬元<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 總公司保證金分別為：綜合 1000萬、甲種 150萬、乙種 60萬。分公司綜合、甲種皆為 30 萬元，但乙種是15萬元。<\/p>\n<ol start=\"11\">\n<li>旅行業舉辦旅遊從事廣告活動，應載明那些內容？①旅遊行程名稱、出發之地點、日期及旅遊天數 ②旅遊費用 ③投保責任保險與其保險金額 ④投保履約保證保險及其保險金額 ⑤旅遊行程僅供參考<\/li>\n<\/ol>\n<p>(A) ①③④⑤ (B) ②③④⑤ (C) ①②④⑤ (D) ①②③④<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 廣告應真實，載明行程資訊與保險項目，「僅供參考」易生糾紛且不符規範。<\/p>\n<ol start=\"12\">\n<li>領隊人員職前訓練之規定，下列各組配對（前為訓練節次、後為缺課節數不得逾訓練節次之比例），何者正確？<\/li>\n<\/ol>\n<p>(A) 36節課、1/10 (B) 56節課、1/10 (C) 36節課、1/5 (D) 56節課、1/5<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 領隊職前訓練目前規範為 56 節課，缺課不得超過 1/10。<\/p>\n<ol start=\"13\">\n<li>旅行業辦理旅遊行程期間，因意外事故致一旅客死亡時，若該旅客已婚且其子女父母皆已歿，此時向責任保險之保險人請求保險給付時，其請求順位排序為何？①孫子女 ②配偶 ③兄弟姊妹 ④祖父母<\/li>\n<\/ol>\n<p>(A) ②→④→①→③ (B) ①→④→③→② (C) ③→②→①→④ (D) ②→①→④→③<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 依民法繼承順位及保險給付：配偶(②)固定，第一順位子女已歿則由孫子女(①)代位，之後為祖父母(④)，最後才是兄弟姊妹(③)。<\/p>\n<ol start=\"14\">\n<li>自民國 112 年 1 月 1 日起，入境臺灣旅客可攜帶酒與菸的年齡限制為幾歲（含）以上？<\/li>\n<\/ol>\n<p>(A) 酒 18 歲、菸 18 歲 (B) 酒 18 歲、菸 20 歲 (C) 酒 20 歲、菸 18 歲 (D) 酒 20 歲、菸 20 歲<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 配合民法成年下修至18歲，菸品年齡限制調高至 20 歲，但入境免稅菸酒規定目前仍維持酒 18 歲（可攜帶）、菸 20 歲（可攜帶免稅）。<em>註：此題涉及最新法規微調，需注意實務操作。<\/em><\/p>\n<ol start=\"15\">\n<li>有斥籍國民陳先生夫婦於歐洲度蜜月時，不慎遺失中華民國護照，急於返臺，可向我國駐外館處申辦下列何種證件返臺？<\/li>\n<\/ol>\n<p>(A) 入國證明書 (B) 入國許可證 (C) 中華民國簽證 (D) 臺灣地區居留證<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 在國外遺失護照且急於回國，駐外館處可核發「入國證明書」。<\/p>\n<ol start=\"16\">\n<li>團員於國外購買共 6 包（罐）物品返國，包含①火腿腸調理包泡麵 ②蝦味乾燥調理包泡麵 ③蔬菜味乾燥調理包泡麵 ④寵物犬食用牛肉罐頭，請問上述那些物品可以攜帶入境臺灣且無須申報？<\/li>\n<\/ol>\n<p>(A) ①② (B) ②③ (C) ③④ (D) ①④<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 乾燥調理包（無肉塊或屬高度加工之海鮮/蔬菜）可攜入；火腿腸（加工肉製品）與肉類罐頭通常受檢疫限制。<\/p>\n<ol start=\"17\">\n<li>入境旅客攜帶下列那一物品數量，於入境時得經由綠線檯通關？<\/li>\n<\/ol>\n<p>(A) 價值美幣 1 萬元之黃金 (B) 捲菸 250 支 (C) 雪茄 30 支 (D) 人民幣 3 萬元<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 免稅額內（捲菸200支、雪茄25支、黃金價值2萬美元內）可以走綠線通關。雪茄 25 支內免稅，30 支需申報。美金 1 萬以上、人民幣 2 萬以上均需申報。<\/p>\n<ol start=\"18\">\n<li>張先生 25 歲首次申請護照，黃先生 25 歲因遺失護照而申請補發。請問兩人護照有效期之比較，下列敘述何者正確？<\/li>\n<\/ol>\n<p>(A) 張先生、黃先生皆為 10 年 (B) 張先生為 10 年，黃先生為 5 年 (C) 張先生為 5 年，黃先生為 10 年 (D) 張先生、黃先生皆為 5 年<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 成年人新領護照效期 10 年，但因遺失補發之護照效期以 5 年為限。<\/p>\n<ol start=\"19\">\n<li>依現行「入境旅客攜帶行李物品報驗稅放辦法」之規定，入境旅客攜帶自用及家用行李物品進口總值在完稅價格之免稅額度為新臺幣多少元？<\/li>\n<\/ol>\n<p>(A) 25,000 元 (B) 30,000 元 (C) 35,000 元 (D) 40,000 元<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 113年起法規調整，入境自用行李免稅額由 2 萬元調高至 3.5 萬元。<\/p>\n<ol start=\"20\">\n<li>依現行「入境旅客攜帶行李物品報驗稅放辦法」之規定，入境旅客攜帶自用酒類之免稅上限為幾公升？<\/li>\n<\/ol>\n<p>(A) 1公升 (B) 1.5公升 (C) 2公升 (D) 2.5公升<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 入境酒類免稅額為 1 公升（不限瓶數）。<\/p>\n<ol start=\"21\">\n<li>小明年滿 19 歲，屬於役男身分，尚未完成徵兵檢查及服役。想和家人一同出國至日本旅遊，若未經核准擅自出境，下列敘述何者正確？<\/li>\n<\/ol>\n<p>(A) 僅需回國補辦徵兵檢查，免予處罰 (B) 需經核准後方得出境，若擅自出境將被列管，並限制出境 (C) 若是短期觀光，屬例外情形，可由家長代辦申請補核准 (D) 僅限制未來不得再申請出境，不另行罰鍰或刑責<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 役男出境需先經核准，否則會被依法限制出境或列管。<\/p>\n<ol start=\"22\">\n<li>依「管理外匯條例」第 2 條規定所稱之外匯，下列那些項目包括在內？①美元現鈔 ②黃金、白銀 ③外國有價證券，如股票、債券 ④國際信用卡 ⑤外國匯票、支票、本票及旅行支票<\/li>\n<\/ol>\n<p>(A) ①②④ (B) ①③⑤ (C) ③④⑤ (D) ②④⑤<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 外匯包含外幣現鈔、外國有價證券及外國匯付憑證。黃金不屬外匯，信用卡屬支付工具。<\/p>\n<ol start=\"23\">\n<li>依「管理外匯條例」之規定，新臺幣多少元以上之等值外匯收支或交易，應依規定申報，其申報辦法由那個單位定之？<\/li>\n<\/ol>\n<p>(A) 50 萬元、中央銀行 (B) 100 萬元、中央銀行 (C) 50 萬元、財政部 (D) 100 萬元、財政部<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 達新台幣 50 萬元之交易需申報，主管機關為中央銀行。<\/p>\n<ol start=\"24\">\n<li>依「管理外匯條例」之規定，以非法買賣外匯為常業者，處幾年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金？<\/li>\n<\/ol>\n<p>(A) 1年 (B) 2年 (C) 3年 (D) 5年<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 違反外匯條例非法買賣為常業者，處 3 年以下有期徒刑。<\/p>\n<ol start=\"25\">\n<li>依「ISO 4217 貨幣代碼」之規範，下列何者是歐元的幣別代碼？<\/li>\n<\/ol>\n<p>(A) AUD (B) EUR (C) GBP (D) USD<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： EUR 為歐元（Euro）。<\/p>\n<ol start=\"26\">\n<li>使用歐元的國家包括下列何者？①德國 ②英國 ③希臘 ④瑞士 ⑤法國<\/li>\n<\/ol>\n<p>(A) ①②⑤ (B) ①③⑤ (C) ③④⑤ (D) ②③④<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 英國（英鎊）、瑞士（瑞郎）不使用歐元。<\/p>\n<ol start=\"27\">\n<li>依「管理外匯條例」之規定，管理外匯之行政主管機關與掌理外匯業務機關分別為那個單位？<\/li>\n<\/ol>\n<p>(A) 中央銀行、財政部 (B) 財政部、中央銀行 (C) 行政院、中央銀行 (D) 行政院、財政部<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 行政主管機關為財政部，掌理業務機關為中央銀行。<\/p>\n<ol start=\"28\">\n<li>某銀行對顧客掛牌美金：新臺幣的匯率分別為買入 29.81/賣出 30.48，下列敘述何者錯誤？<\/li>\n<\/ol>\n<p>(A) 不同銀行匯率報價會不同 (B) 此買賣的價差為 0.67 (C) 銀行願意付出新臺幣 29.81 元，買入美金 1 元 (D) 對旅客而言，欲買入美金 1 元，需付出新臺幣 29.81 元<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 旅客買美金是用銀行的「賣出價」，應為 30.48 元。<\/p>\n<ol start=\"29\">\n<li>依「民法」第 514 條之 4 規定，旅遊開始前，旅客得變更由第三人參加旅遊，下列敘述何者正確？<\/li>\n<\/ol>\n<p>(A) 無論費用多寡均須退還差額 (B) 旅遊營業人可以任何理由拒絕 (C) 若增加費用，第三人應負擔；若減少費用，原旅客可退還 (D) 若增加費用，旅遊營業人可請求給付；若減少費用，旅客不得請求退還<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 旅客換人時，增加的費用要補，但減少的費用（如飯店差價）業者不退。<\/p>\n<ol start=\"30\">\n<li>依「國外旅遊定型化契約」之規定，契約中記載旅遊團須達 15 人始能成行，但報名人數僅 10 人。旅行社至少應於預定出發前幾日通知旅客解除契約？<\/li>\n<\/ol>\n<p>(A) 3日 (B) 7日 (C) 10日 (D) 14日<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 組團人數不足時，應於出發前 7 日通知解約。<\/p>\n<ol start=\"31\">\n<li>依「國外旅遊定型化契約」之規定，旅客於出發前十日因個人身體不舒服等因素取消行程，旅客應賠償旅遊費用多少比例之違約金？<\/li>\n<\/ol>\n<p>(A) 10% (B) 20% (C) 30% (D) 50%<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 出發前第 2 日至第 20 日內取消者，賠償旅遊費用 30%。<\/p>\n<ol start=\"32\">\n<li>依「國外旅遊定型化契約」之規定，旅行社委託國外業者安排旅程，該國外旅行業有違反契約或其他不法情事，致旅客受損害時，國內旅行社必須擔負那些責任？<\/li>\n<\/ol>\n<p>(A) 不須負責 (B) 與國外業者負同一責任 (C) 由保險公司理賠 (D) 僅道歉即可<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 國內旅行社對履行輔助人（國外業者）之行為，應與自己之行為負同一責任。<\/p>\n<ol start=\"33\">\n<li>依「國外旅遊定型化契約」之規定，旅行社安排特定場所購物，旅客購物後發現商品瑕疵，得於受領後多久時間內請求旅行社協助處理？<\/li>\n<\/ol>\n<p>(A) 7日 (B) 14日 (C) 1個月 (D) 3個月<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 旅客得於受領購物物品後一個月內，請求旅行社協助處理瑕疵品。<\/p>\n<ol start=\"34\">\n<li>依「國外旅遊定型化契約」之規定，旅行社於行程中故意棄置或留滯旅客，旅行社除應按實計算退還旅客未完成旅程之費用外，還須賠償依全部旅遊費用除以全部旅遊日數乘以棄置或留滯日數後相同金額幾倍之違約金？<\/li>\n<\/ol>\n<p>(A) 1倍 (B) 3倍 (C) 5倍 (D) 10倍<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 惡意棄置旅客，需賠償該期間旅遊費用之 5 倍違約金。<\/p>\n<ol start=\"35\">\n<li>小李參加國外旅遊團體，旅遊費用（含簽證費 1,000 元）共計 31,000 元。於出發前一日因車禍受傷而通知旅行社取消，但簽證已辦妥。依「國外旅遊定型化契約」之規定，旅客至少應賠償旅行社多少旅遊費用？<\/li>\n<\/ol>\n<p>(A) 31,000 元 (B) 15,000 元 (C) 15,500 元 (D) 16,000 元<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 出發前 1 日取消賠 50%。(31,000 - 1,000) × 50% = 15,000。加上已支出的簽證費 1,000 = 16,000 元。<\/p>\n<ol start=\"36\">\n<li>甲繳交團費 20 萬元參加旅行社 10 日北義大利豪華旅遊，第五日因旅行社作業疏失，致使旅客入住二星級旅館，而非行程所排定的五星級飯店。又因其訂票疏失，致使回程時未能搭乘原定 12:00 出發的航班，只能改搭翌日 20:00 航班回國。經旅行社計算旅館價差為 4,000 元，依「國外旅遊定型化契約」之規定，旅行社至少應賠償甲多少元之違約金？<\/li>\n<\/ol>\n<p>(A) 4,000 元 (B) 20,000 元 (C) 24,000 元 (D) 48,000 元<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 旅館等級不符需賠 2 倍價差(4000x2=8000)。行程延誤 1 日(未滿 24 小時以 1 日計)，賠該日費用(20萬/10日=2萬)之 2 倍(4萬)。合計 48,000 元。<\/p>\n<ol start=\"37\">\n<li>旅客於旅遊途中自行離隊返回國時，依「國外旅遊定型化契約」之規定，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 旅客得請求旅行社按旅遊天數比率退還未旅遊費用 (B) 旅客得請求旅行社退還可節省之費用 (C) 旅客得請求旅行社退還無須支付之費用 (D) 旅客不得請求旅行社負擔返國交通費用<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 離隊者不得請求按比例退費，僅能要求退還業者因其離隊而節省的費用（如未吃的餐費）。<\/p>\n<ol start=\"38\">\n<li>依「民法債編旅遊節」之規定，旅遊契約所生損害賠償請求權之消滅時效為何？<\/li>\n<\/ol>\n<p>(A) 自訂約日起，一年間不行使而消滅 (B) 自訂約日起，兩年間不行使而消滅 (C) 自旅遊終止或應終止時起，一年間不行使而消滅 (D) 自旅遊終止或應終止時起，兩年間不行使而消滅<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 旅遊契約相關賠償請求權時效為一年。<\/p>\n<ol start=\"39\">\n<li>依「國外旅遊定型化契約」之規定，當旅客與旅行業發生消費爭議，且經協商後仍無法解決時，旅客可向相關單位提出調解（處）申請，但不包括下列那一個單位？<\/li>\n<\/ol>\n<p>(A) 各縣市旅行商業同業公會 (B) 各縣市消費者保護官 (C) 交通部觀光署 (D) 中華民國旅行業品質保障協會<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 觀光署主要受理申訴，正式「調解」通常在品保、消服中心或公會進行。<\/p>\n<ol start=\"40\">\n<li>小花參加 A 旅行社的旅行團，在出發前繳納了 50,000 元的團費，但在出發當天，小花才發現自己已被 A 旅行社轉到 B 旅行社的旅遊團，而 A 旅行社並未通知她，小花可依「國外旅遊定型化契約」之規定向 A 旅行社要求多少的違約金？<\/li>\n<\/ol>\n<p>(A) 2,500 元 (B) 5,000 元 (C) 7,500 元 (D) 10,000 元<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 未經旅客書面同意將其轉讓其他旅行業，應賠償旅遊費用 5% 之違約金(50,000 × 5% = 2,500)。<\/p>\n<ol start=\"41\">\n<li>小花參加 A 旅行社 5 天 4 夜的旅行團，團員總共有 20 人。出發後小花發現領隊沒有領隊執業證，事後小花個人可以依「國外旅遊定型化契約」之規定，向旅行社要求多少違約金？<\/li>\n<\/ol>\n<p>(A) 375 元 (B) 500 元 (C) 1,125 元 (D) 1,500 元<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 指派無照領隊，應賠償旅客每日新台幣 1,500 元除以總團員人數再乘以旅遊天數。($1500 \\div 20 \\times 5 = 375$)。<\/p>\n<ol start=\"42\">\n<li>臺灣地區人民與大陸地區人民交流時，應注意「臺灣地區與大陸地區人民關係條例」中限制或禁止事項，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 輸入或攜帶進入臺灣地區之大陸地區食品，以進口論；其檢驗、檢疫、管理、關稅等稅捐之徵收及處理等，依輸入物品有關法令之規定辦理 (B) 大陸地區之中華古物，經主管機關許可運入臺灣地區公開陳列、展覽者，得予運出 (C) 大陸地區發行之幣券，除其數額在金融監督管理委員會所定限額以外，不得進出入臺灣地區 (D) 大陸地區經其電檢局及相關機構審批通過之出版品、電影片、錄影節目及廣播電視節目，得在臺灣地區發行、銷售、製作、播映、展覽或觀摩<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 大陸地區出版品等進入台灣，仍需經我國主管機關（文化部）許可，而非大陸審批通過即可。<\/p>\n<ol start=\"43\">\n<li>倘若作為帶團領隊時，團員有現任公務人員進入大陸地區從事交流活動，應注意之事項，下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 參加活動時，如發現對我稱呼及有關安排，有不尊重我方對等政治實體或其他不當之處，應即交涉更正或闡明立場 (B) 不得參加與此行無關之大陸官方或統戰機構活動 (C) 對大陸藉宣揚中華傳統文化、當地文化與景觀優勢，進行文化統戰之策略，我方人員應提高警覺，並適度表達我方就文化交流旨在增進相互瞭解之既定立場 (D) 面對大陸之旗、歌、政治人物之圖片或其他政治符號時，得依一般外交禮儀舉手致敬、鞠躬或合唱<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 公務員赴陸交流應維持尊嚴，不應對其政治符號致敬。<\/p>\n<ol start=\"44\">\n<li>「臺灣地區與大陸地區人民關係條例」第 9 條之 1 第 1 項規定：「臺灣地區人民不得在大陸地區設有戶籍或領用大陸地區護照」，條文所指「設有戶籍」的定義，下列敘述何者正確？<\/li>\n<\/ol>\n<p>(A) 在大陸地區有購置房產的事實 (B) 曾連續在大陸地區居住滿 1 年以上 (C) 使用過大陸地區醫療保險待遇 (D) 持有大陸地區居民身分證及定居證<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 設有戶籍之認定通常以領取居民身分證為準。<\/p>\n<ol start=\"45\">\n<li>臺灣民眾李小姐手上有 3 筆資金，其來源分別是：①李小姐兩個月前攜往廣州交給台商，兩個月後又原封不動透過熟人帶回臺灣給李小姐；②李小姐在上海的表弟前兩天從上海匯給李小姐；③李小姐的合作廠商中國聯想電腦菲律賓分公司匯至臺灣給李小姐。依據「臺灣地區與大陸地區人民關係條例施行細則」之規定，有關這三筆資金的所屬來源認定，下列敘述何者正確？<\/li>\n<\/ol>\n<p>(A) ①臺灣資金②大陸資金③菲律賓資金 (B) ①臺灣資金②臺灣資金③菲律賓資金 (C) ①大陸資金②臺灣資金③大陸資金 (D) ①大陸資金②大陸資金③大陸資金<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： ①原封不動帶回屬原資金；②從陸方匯入屬陸資；③從第三國匯入屬該國資金。<\/p>\n<ol start=\"46\">\n<li>「在大陸地區製作之委託書、死亡證明書、死亡證明文件、遺囑、醫療機構證明文件、切結書及領獎等相關文件，應經行政院設立或指定之機構或委託之民間團體驗證」，前述所負責驗證的機構或民間團體，下列何者正確？<\/li>\n<\/ol>\n<p>(A) 大陸委員會 (B) 各級地方法院 (C) 法務部 (D) 財團法人海峽交流基金會<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 行政院委託「海基會」辦理兩岸文書驗證。<\/p>\n<ol start=\"47\">\n<li>「臺灣地區與大陸地區人民關係條例」中，所稱之「臺灣地區」範圍為何？<\/li>\n<\/ol>\n<p>(A) 臺灣、澎湖、金門、馬祖及政府統治權所及之其他地區 (B) 政府統治權所及之其他地區 (C) 臺灣省 (D) 臺灣、澎湖、金門、馬祖及港澳地區<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 法律定義之臺灣地區包含台澎金馬及其他實質統治區域，港澳另有條例規定。<\/p>\n<ol start=\"48\">\n<li>香港或澳門情況發生變化，致依「香港澳門關係條例」之施行，有危害臺灣地區安全之虞時，行政院得為何之處理？<\/li>\n<\/ol>\n<p>(A) 停止「香港澳門關係條例」一部或全部之適用 (B) 應即函請立法院廢止「香港澳門關係條例」 (C) 全面改依「臺灣地區與大陸地區人民關係條例」 (D) 將香港澳門視為大陸地區<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 依港澳條例第 60 條，行政院得停止其一部或全部適用。<\/p>\n<ol start=\"49\">\n<li>近年我國政府持續發布赴中國大陸旅遊的橙色警示，提醒國人避免非必要旅行。大陸委員會在說明維持此警示的主要原因時，通常強調的是下列那一項風險？<\/li>\n<\/ol>\n<p>(A) 旅行業者反映赴陸團體品質下降且旅費明顯提高 (B) 兩岸軍事對峙頻仍，導致直航航班中斷與取消頻繁 (C) 大陸對於旅客採取嚴格嚴格防疫與健康碼措施，造成行程受限 (D) 臺灣民眾赴陸後發生多起人身自由受限或遭拘留事件<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 近期發布橙色警示主因大陸國安法令變更（如反間諜法），導致國人被非法扣留風險增加。<\/p>\n<ol start=\"50\">\n<li>為了確保國人前往大陸地區期間的安全，政府中央機關設立了各種通報系統提供民眾使用，下列配對（前者為登錄系統、後者為機關名稱）何者錯誤？<\/li>\n<\/ol>\n<p>(A) 赴陸期間司法案件協助登錄系統、法務部 (B) 國人赴陸港澳動態登錄、大陸委員會 (C) 各級民選公職人員及宗教等團體赴陸登錄與資訊揭露系統、內政部 (D) 赴陸教育交流活動登錄平台、教育部<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 司法案件相關協助平台多由海基會或陸委會窗口統籌，並非由法務部直接設有專屬「赴陸案件登錄系統」。<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773477764", "date": "2026-03-14", "title": "導遊領隊考前陪跑 EP101", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前陪跑 EP101 115年領隊人員評量測驗試題 #華語領隊 #觀光資源概要 現場解題 (答項由AI協助，請先參考便可) 東南亞人口規模最大的國家是： (A) 菲律賓 (", "len": 6440, "body": "<p>導遊領隊考前陪跑 EP101<\/p>\n<h1>115年領隊人員評量測驗試題 #華語領隊 #觀光資源概要<\/h1>\n<h1>現場解題 (答項由AI協助，請先參考便可)<\/h1>\n<ol>\n<li>東南亞人口規模最大的國家是：<\/li>\n<\/ol>\n<p>(A) 菲律賓 (B) 越南 (C) 馬來西亞 (D) 印尼<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 印尼人口超過 2.7 億，是世界第四大人口國，也是東南亞人口最多的國家。<\/p>\n<ol start=\"2\">\n<li>下列何者歷史上屬漢字文化圈？<\/li>\n<\/ol>\n<p>(A) 尼泊爾 (B) 不丹 (C) 越南 (D) 蒙古<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 越南在歷史上長期受中國文化影響，曾官方使用漢字（儒字），屬於廣義的漢字文化圈。<\/p>\n<ol start=\"3\">\n<li>西元 15 世紀初至 17 世紀間，華商到馬來西亞、印尼等地定居，與當地女子通婚，形成一個融合華人與當地文化的族群。這個族群通常被稱為什麼？<\/li>\n<\/ol>\n<p>(A) 新客華人 (B) 土生華人 (C) 閩南人 (D) 中國人<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 該族群即著名的「峇峇娘惹」（Peranakan），又稱土生華人或海峽華人。<\/p>\n<ol start=\"4\">\n<li>昔日中南半島被稱為「印度支那」，是由那一個國家統治？<\/li>\n<\/ol>\n<p>(A) 法國 (B) 英國 (C) 美國 (D) 荷蘭<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 「法屬印度支那」（French Indochina）包含今日的越南、寮國與柬埔寨。<\/p>\n<ol start=\"5\">\n<li>中國歷史上，「罷黜百家，獨尊儒術」者為：<\/li>\n<\/ol>\n<p>(A) 秦始皇 (B) 齊桓公 (C) 西漢武帝 (D) 魏文帝<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 漢武帝採納董仲舒的建議，確立儒家思想為官方正統。<\/p>\n<ol start=\"6\">\n<li>西元 8 世紀抵達日本傳授佛教的唐土高僧是：<\/li>\n<\/ol>\n<p>(A) 鑑真 (B) 玄奘 (C) 惠能 (D) 一行<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 鑑真和尚六次東渡日本，最終成功抵達並創立日本律宗。<\/p>\n<ol start=\"7\">\n<li>印度的宗教建築，有源自於印度半島的印度教、佛教建築，也有裝飾風格自外傳入的伊斯蘭和基督教建築。下列各具特徵的宗教建築物，何者最有可能是伊斯蘭建築？<\/li>\n<\/ol>\n<p>(A) 屋頂裝飾人物、大象雕像的神廟 (B) 外牆銘刻經文和幾何圖案的高塔 (C) 內室壁面神龕有半裸神像的石窟 (D) 拱型結構飾以華麗雕像的禮拜堂<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 伊斯蘭教嚴禁偶像崇拜，建築多以幾何圖形、阿拉伯書法（經文）及植物紋樣裝飾。<\/p>\n<ol start=\"8\">\n<li>香港島割讓給英國是根據與清廷的那一個條約？<\/li>\n<\/ol>\n<p>(A) 璦琿條約 (B) 尼布楚條約 (C) 辛丑條約 (D) 南京條約<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 1842 年鴉片戰爭後簽訂《南京條約》，清廷割讓香港島給英國。<\/p>\n<ol start=\"9\">\n<li>臺灣歷史博物館展出麵粉袋做的內褲，此一展覽的主題最有可能是：<\/li>\n<\/ol>\n<p>(A) 二戰時期的臺灣人 (B) 臺灣的農特產 (C) 美援與臺灣 (D) 臺灣紡織產業史<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 1950 年代美援期間，台灣物資匱乏，民眾常將印有「中美合作」字樣的麵粉袋改製成衣物。<\/p>\n<ol start=\"10\">\n<li>柬埔寨的吳哥窟在歷史上經歷過何種宗教轉變？<\/li>\n<\/ol>\n<p>(A) 印度教 → 佛教 (B) 佛教 → 印度教 (C) 印度教 → 伊斯蘭教 (D) 佛教 → 伊斯蘭教<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 吳哥窟最初為印度教神廟，12 世紀末逐漸轉變為大乘佛教寺廟。<\/p>\n<ol start=\"11\">\n<li>西元 16 世紀蘇丹馬六甲王國被那一個國家所滅？<\/li>\n<\/ol>\n<p>(A) 英國 (B) 西班牙 (C) 日本 (D) 葡萄牙<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 1511 年葡萄牙將領阿布奎格攻佔馬六甲，滅亡了馬六甲蘇丹王朝。<\/p>\n<ol start=\"12\">\n<li>繼西班牙之後統治菲律賓群島的是那一個國家？<\/li>\n<\/ol>\n<p>(A) 美國 (B) 英國 (C) 葡萄牙 (D) 荷蘭<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 1898 年美西戰爭後，菲律賓改由美國統治。<\/p>\n<ol start=\"13\">\n<li>古代奧林匹克運動會是古希臘諸多的神明祭典之一，也是最負盛名者，亦具和平意義，賽事舉辦期間希臘各城邦停止征戰，以示對神明的崇敬，不過曾經停辦超過 15 個世紀，其停辦的歷史情境為何？<\/li>\n<\/ol>\n<p>(A) 馬其頓帝國興起後，以武力統一希臘半島 (B) 羅馬帝國東征，征服其頓安提哥那王朝 (C) 羅馬皇帝獨尊基督教，嚴厲壓制異教活動 (D) 信奉伊斯蘭的鄂圖曼帝國統治巴爾幹半島<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 羅馬皇帝狄奧多西一世於西元 393 年宣布基督教為國教並禁止「異教」祭典，導致奧運停辦。<\/p>\n<ol start=\"14\">\n<li>西元 1940 年，日本棒球聯盟為了表達對國家戰爭國策的支持，特別至某地辦理訪問比賽，這是日本職業棒球第一次在日本本土以外進行例行賽。某地是下列那一個地區？<\/li>\n<\/ol>\n<p>(A) 夏威夷 (B) 滿洲國 (C) 菲律賓 (D) 海參崴<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 1940 年為慶祝「皇紀 2600 年」，日本職棒曾前往當時日本扶持的滿洲國進行海外賽。<\/p>\n<ol start=\"15\">\n<li>越南會安古城以保存西元 15 至 19 世紀初的傳統街景聞名，請問它能完整保留下來的主要原因為何？<\/li>\n<\/ol>\n<p>(A) 城市自古以來沒有被外國商人影響 (B) 會安地區在越南戰爭中未受任何破壞 (C) 順化王朝將會安列為主要貿易港，限制大規模改建 (D) 19 世紀後港口淤積、經濟停滯，未進行大規模開發<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 因港口泥沙淤積失去國際貿易中心地位，經濟重心轉移到峴港，使會安免於受現代都市開發的影響。<\/p>\n<ol start=\"16\">\n<li>清代臺灣受到外人以武力入侵的事件中，以那一件最早，也最著名？<\/li>\n<\/ol>\n<p>(A) 霧社事件 (B) 中法戰爭 (C) 牡丹社事件 (D) 西來庵事件<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 牡丹社事件發生於 1874 年，是清代台灣最早受外國武力（日本）大規模入侵的標誌性事件。<\/p>\n<ol start=\"17\">\n<li>下列那一項不是印尼蘇哈托新秩序時期，針對華裔群體實施的政策？<\/li>\n<\/ol>\n<p>(A) 限制華裔從商 (B) 禁止公開慶祝農曆新年 (C) 強制華裔更改印尼姓名 (D) 禁止中文報刊發行<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 蘇哈托政權雖打壓華人文化與政治（如禁中文、改姓名、禁過年），但在經濟上卻依賴並扶植特定的華商企業。<\/p>\n<ol start=\"18\">\n<li>越南的河內升龍皇城建於西元 11 世紀李朝，此皇城非平地起，而是在那國堡壘原址上擴建？<\/li>\n<\/ol>\n<p>(A) 印度 (B) 中國 (C) 柬埔寨 (D) 朝鮮<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 升龍皇城是在唐代建立的「大羅城」（中國統治時期之堡壘）遺址上建立的。<\/p>\n<ol start=\"19\">\n<li>下列那一項史實最能夠顯示清朝末年的地方勢力上升現象？<\/li>\n<\/ol>\n<p>(A) 三國干涉還遼 (B) 戊戌變法 (C) 自強運動 (D) 東南互保<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 庚子拳亂時，南方各省督撫拒絕執行清廷對外宣戰的密旨，與外國達成協議，顯示地方權威已能抗衡中央。<\/p>\n<ol start=\"20\">\n<li>日本放送協會於西元 2025 年播放的大河劇《豈有此理～萬重繁華如夢故事～》中，提到了早期的吉原遊廓，這座遊廓出現於下列何時何地？<\/li>\n<\/ol>\n<p>(A) 鐮倉幕府時期的鐮倉 (B) 安土桃山時期的大阪 (C) 德川幕府時期的江戶 (D) 明治維新時期的橫濱<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 吉原遊廓是德川幕府在江戶（今東京）設立的合法紅燈區。<\/p>\n<ol start=\"21\">\n<li>西元 19 世紀初期，美國人積極向西擴展國土，下列那一個歷史事件使得美國國土幾乎等於翻倍增加？<\/li>\n<\/ol>\n<p>(A) 出資購買法國的屬地路易斯安那 (B) 西班牙割讓西屬佛羅里達予美國 (C) 密蘇里妥協解決新州的畜奴問題 (D) 兼併了新獨立的德克薩斯共和國<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 1803 年的路易斯安那購地案（Louisiana Purchase）以極低價格購得廣大領土，使美國國土幾乎翻倍。<\/p>\n<ol start=\"22\">\n<li>西元 18 世紀荷蘭東印度公司帶來西方文化影響日本，又稱「蘭學」。請問「蘭學」的窗口為那一個城市？<\/li>\n<\/ol>\n<p>(A) 江戶 (B) 大阪 (C) 神戶 (D) 長崎<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 鎖國時期，日本僅開放長崎的出島與荷蘭商船貿易，成為吸收西學的窗口。<\/p>\n<ol start=\"23\">\n<li>那位學者發表著名短文《脫亞論》，積極地提倡明治維新後的日本放棄中華思想和儒教精神，學習並吸收西洋文明？<\/li>\n<\/ol>\n<p>(A) 坂本龍馬 (B) 福澤諭吉 (C) 西鄉隆盛 (D) 伊藤博文<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 福澤諭吉在 1885 年發表《脫亞論》，被視為明治維新的思想導師及萬元日鈔上的人物。<\/p>\n<ol start=\"24\">\n<li>越南下龍灣有「水上桂林」之美稱，請問以什麼自然景觀聞名？<\/li>\n<\/ol>\n<p>(A) 火山群 (B) 石灰岩喀斯特地貌 (C) 沙漠綠洲 (D) 冰河湖<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 下龍灣與中國桂林一樣，皆屬發育完整的石灰岩喀斯特地貌。<\/p>\n<ol start=\"25\">\n<li>中國某一跨海大橋於西元 2018 年完工，連結了中國兩個特別行政區及一個經濟特區，大橋建成後，往來三地只需要幾十分鐘，大幅縮短三地間往返的距離，強化三地經濟社會的交流。請問此跨海大橋最可能位於下列那條河的出海口？<\/li>\n<\/ol>\n<p>(A) 珠江 (B) 長江 (C) 海河 (D) 黃河<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 此大橋即「港珠澳大橋」，連結香港、澳門與珠海，位於珠江口（大灣區）。<\/p>\n<ol start=\"26\">\n<li>日本皇族在春天賞櫻的「花見」傳統流傳至民間，每逢春季各地總是紛紛舉辦櫻花祭。若根據日本氣象廳所發布的賞櫻前線日期判斷，四大島中那一個地區的櫻花季舉辦時間較早？<\/li>\n<\/ol>\n<p>(A) 北海道 (B) 本州 (C) 九州 (D) 四國<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 櫻花由南向北開放，九州地理位置最南，溫度回升最早，因此花季最早開始。<\/p>\n<ol start=\"27\">\n<li>塔吉鍋（Tajine）是世界某地區的傳統菜餚，也是廚房用具名稱。其錐形陶瓷的鍋具設計，可以用最少量的水慢燉烹調食物，相當順應當地環境特色。該地區最可能為下列何者？<\/li>\n<\/ol>\n<p>(A) 東亞 (B) 南美 (C) 西歐 (D) 北非<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 塔吉鍋源自摩洛哥等北非乾旱地區，設計初衷是為了在極端缺水的環境下節省水分。<\/p>\n<ol start=\"28\">\n<li>名列「非物質文化遺產」的「椰棗樹、知識、技能、傳統與實踐」，是由十多個西亞與北非國家共同申請。下列那組國家全都屬於申請國？<\/li>\n<\/ol>\n<p>(A) 約旦，埃及，伊拉克 (B) 科威特，土耳其，衣索比亞 (C) 葉門，奈及利亞，巴基斯坦 (D) 沙烏地阿拉伯，阿富汗，幾內亞<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 此為阿拉伯國家的聯合申請，約旦、埃及、伊拉克均屬其列。土耳其、衣索比亞等非阿拉伯核心文化圈非主申請國。<\/p>\n<ol start=\"29\">\n<li>馬來西亞吉隆坡具有伊斯蘭教八角星形特色的現代風格建築，請問是下列何者？<\/li>\n<\/ol>\n<p>(A) 吉隆坡塔 (B) 雙子星塔 (C) 默迪卡 118 (D) 蘇丹阿都沙默大廈<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 雙子星塔（Petronas Towers）的平面設計即是基於兩個交疊的四方形，形成伊斯蘭教傳統的八角星形。<\/p>\n<ol start=\"30\">\n<li>印度豐富的文化景觀吸引許多遊客探訪，請問在下列那個假期去印度旅行，天氣最為乾爽、舒適宜人？<\/li>\n<\/ol>\n<p>(A) 清明節 (B) 端午節 (C) 中秋節 (D) 聖誕節<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 印度主要為熱帶季風氣候，11 月至次年 2 月（聖誕節期間）是涼季，氣候乾爽穩定。<\/p>\n<ol start=\"31\">\n<li>世界被劃分為 24 個標準時區（經度 15 度為一時區），若依據此理論跨區，新加坡應該是位於 UTC+09:00，但該國現在採用的法定時區為 UTC+08:00。這和那個國家或地區所作的時區調整有關？<\/li>\n<\/ol>\n<p>(A) 印尼 (B) 泰國 (C) 香港 (D) 馬來西亞<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 新加坡為了與其重要經貿夥伴馬來西亞保持同步，隨馬來西亞於 1982 年將時區統一調整為 UTC+08:00。<\/p>\n<ol start=\"32\">\n<li>若想搭牛車出海耕田，體驗踩著浪花看蚵田，摸蛤仔與蟹共舞的樂趣，最適合參加下列那個地點的旅遊行程？<\/li>\n<\/ol>\n<p>(A) 彰化芳苑王功漁港 (B) 澎湖馬公海洋牧場 (C) 嘉義東石外傘頂洲 (D) 臺南四草綠色隧道<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 彰化芳苑的「海牛文化」是台灣極具特色的漁村景觀，已被列為無形文化資產。<\/p>\n<ol start=\"33\">\n<li>寮國的古城陸龍坡（Town of Luang Prabang）以什麼文化遺產被列入世界遺產？<\/li>\n<\/ol>\n<p>(A) 古代皇宮 (B) 殖民地建築 (C) 戰爭遺址 (D) 洞穴系統<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 陸龍坡（琅勃拉邦）以保存完整的法式殖民地建築與傳統寮國風格完美融合而聞名。<\/p>\n<ol start=\"34\">\n<li>「人家半鑿山腰住，車馬多從頭頂過」的窯洞，具有堅固耐用、冬暖夏涼、擋風隔音、防震抗震的特點。請問中國的窯洞主要分布於下列那一個地區？<\/li>\n<\/ol>\n<p>(A) 蒙古高原 (B) 雲貴高原 (C) 黃土高原 (D) 青藏高原<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 黃土高原的土層深厚且具垂直節理特性，適合開鑿窯洞居住。<\/p>\n<ol start=\"35\">\n<li>夏威夷的火山國家公園主要位於那一個島上？<\/li>\n<\/ol>\n<p>(A) 歐胡島 (B) 可愛島 (C) 摩洛凱島 (D) 夏威夷大島<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 夏威夷火山國家公園位於「夏威夷島」（Big Island），內有基拉韋厄火山等活火山。<\/p>\n<ol start=\"36\">\n<li>中國黃果樹瀑布所在的河流是：<\/li>\n<\/ol>\n<p>(A) 打幫河 (B) 長江 (C) 黃河 (D) 瀾滄江<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 黃果樹瀑布位於貴州省鎮寧布依族苗族自治縣，屬珠江水系西江支流打幫河上的白水河段。<\/p>\n<ol start=\"37\">\n<li>位於中國四川省北部的黃龍風景區，因流水中鈣質沈澱堆積，形成了 3400 餘個鈣化彩池，四周原始森林密布，鈣化翠池、金色流灘，似一條黃色巨龍俯臥於密林之中。請問黃龍風景區的鈣化彩池屬於何種地形？<\/li>\n<\/ol>\n<p>(A) 風成地形 (B) 岩溶地形 (C) 火山地形 (D) 冰河地形<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 鈣化（石灰華）景觀是岩溶（喀斯特）地形的一種特殊表現方式。<\/p>\n<ol start=\"38\">\n<li>到墨西哥猶加敦半島（Yucatan Peninsula）旅遊，最可能參訪下列那種古文明的世界遺產？<\/li>\n<\/ol>\n<p>(A) 阿茲特克 (B) 印加 (C) 馬雅 (D) 斯瓦希利<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 猶加敦半島是馬雅文明的核心區域，著名的奇琴伊察（Chichén Itzá）便在此處。<\/p>\n<ol start=\"39\">\n<li>泰國美斯樂（Mae Salong）茶山的主要移民是：<\/li>\n<\/ol>\n<p>(A) 廣東人 (B) 雲南人 (C) 客家人 (D) 海南人<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 美斯樂是泰北著名的異域孤軍（國民黨殘部）後代聚居地，先祖多來自雲南。<\/p>\n<ol start=\"40\">\n<li>菲律賓呂宋島著名的科迪勒拉山（Cordillera）「巴拿威梯田（Banaue Rice Terraces）」主要由那個原住民族開鑿？<\/li>\n<\/ol>\n<p>(A) 伊富高族 (B) 他加祿族 (C) 伊瓦坦族 (D) 芒揚族<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 巴拿威梯田是由伊富高人（Ifugao）以手工開鑿而成的，有「世界第八大奇蹟」之稱。<\/p>\n<ol start=\"41\">\n<li>越南「胡志明市」的原名是什麼？<\/li>\n<\/ol>\n<p>(A) 順化 (B) 峴港 (C) 河內 (D) 西貢<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 1975 年越南統一後，將原本的西貢市改名為胡志明市以紀念其開國領袖。<\/p>\n<ol start=\"42\">\n<li>高加索山脈（Caucasus Mountains）是由那兩個板塊相互運動所形成？<\/li>\n<\/ol>\n<p>(A) 歐亞板塊和阿拉伯板塊間的聚合 (B) 歐亞板塊和非洲板塊間的分離 (C) 歐亞板塊和非洲板塊間的聚合 (D) 歐亞板塊和非洲板塊間的隱沒<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 高加索山是由北方的歐亞板塊與南方的阿拉伯板塊碰撞聚合而成。<\/p>\n<ol start=\"43\">\n<li>美國最大的「唐人街（Chinatown）」位在舊金山，這和西元 19 世紀華人多從那處口岸入境美國有關？<\/li>\n<\/ol>\n<p>(A) 天使島 (Angel Island) (B) 惡魔島 (Alcatraz Island) (C) 艾利斯島 (Ellis Island) (D) 卡特琳娜島 (Catalina Island)<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 天使島曾是西岸主要的移民處理中心（1910-1940），被稱為「西岸的艾利斯島」。<\/p>\n<ol start=\"44\">\n<li>中國南部地區的聚落常見騎樓或高腳屋，請問下列何種氣候特徵與這種建築風格的關聯性最大？<\/li>\n<\/ol>\n<p>(A) 年均溫高 (B) 多雨潮濕 (C) 風向多變 (D) 日照較長<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 高腳屋可防潮防淹水，騎樓（五腳基）則提供遮陽避雨的功能。<\/p>\n<ol start=\"45\">\n<li>越南會安古城以什麼建築風格聞名？<\/li>\n<\/ol>\n<p>(A) 現代主義 (B) 純歐式 (C) 中式、日式和法式混合 (D) 高棉式<\/p>\n<p>正確答案：(C)<\/p>\n<p>題解： 會安曾是繁榮商港，融合了華人會館、日本橋以及法國殖民時期的建築風格。<\/p>\n<ol start=\"46\">\n<li>臺灣的地質公園是依何法規劃設？<\/li>\n<\/ol>\n<p>(A) 國家公園法 (B) 文化資產保存法 (C) 野生動物保育法 (D) 森林法<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： 2016 年修訂《文化資產保存法》，將地質公園納入「自然地景」保存範疇。<\/p>\n<ol start=\"47\">\n<li>我國外交部發布之旅遊警示等級說明，下列何者正確？<\/li>\n<\/ol>\n<p>(A) 第一級：灰色提醒 (B) 第二級：綠色注意 (C) 第三級：紅色儘速離境 (D) 第四級：黑色請求保護<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 旅遊警示分為四級：灰色（提醒）、黃色（特別注意）、橙色（避免非必要旅行）、紅色（不宜前往，儘速離境）。<\/p>\n<ol start=\"48\">\n<li>關於遊客體驗與資源保護（Visitor Experience and Resource Protection, VERP），下列何者錯誤？<\/li>\n<\/ol>\n<p>(A) 定義遊客體驗與公園資源管理目標 (B) 決定遊憩設施的安全工程標準及活動範圍 (C) 透過反覆監測、評估，應用遊客使用後的衝擊管理計畫 (D) 訂定有關遊客使用限制或改變發展的決策<\/p>\n<p>正確答案：(B)<\/p>\n<p>題解： VERP 核心在於管理「人」對「資源」的衝擊，而非針對「安全工程標準」的決策。<\/p>\n<ol start=\"49\">\n<li>下列有關知名的旅遊勝地與國家配對，何者錯誤？<\/li>\n<\/ol>\n<p>(A) 芭達雅 (Pattaya) — 泰國 (B) 長灘島 (Boracay) — 菲律賓 (C) 峇里島 (Pulau Bali) — 印尼 (D) 蘇梅島 (Ko Samui) — 馬來西亞<\/p>\n<p>正確答案：(D)<\/p>\n<p>題解： 蘇梅島位於泰國灣，屬於泰國。<\/p>\n<ol start=\"50\">\n<li>中國青海省成立可可西里保護區，最主要是為了保護何種物種而成立？<\/li>\n<\/ol>\n<p>(A) 藏羚羊 (B) 小貓熊 (C) 金絲猴 (D) 丹頂鶴<\/p>\n<p>正確答案：(A)<\/p>\n<p>題解： 可可西里是藏羚羊主要的棲息地與繁殖地，對保護該瀕危物種至關重要。<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773502907", "date": "2026-03-14", "title": "導遊領隊考前陪跑 EP102", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前陪跑 EP102 115年領隊人員評量測驗試題 #外語領隊 #觀光資源概要 現場解題 (答項由AI協助，請先參考便可) 1.披頭四合唱團來自於：(A)丹麥(B)美國(C", "len": 4702, "body": "<p>導遊領隊考前陪跑 EP102<\/p>\n<h1>115年領隊人員評量測驗試題 #外語領隊 #觀光資源概要<\/h1>\n<h1>現場解題 (答項由AI協助，請先參考便可)<\/h1>\n<p>1.披頭四合唱團來自於：(A)丹麥(B)美國(C)英國(D)義大利<\/p>\n<p>解答：(C)。披頭四（TheBeatles）是1960年代成立於英國利物浦的搖滾樂團。<\/p>\n<p>2.17世紀中葉鄭成功採取的「屯田駐兵」策略，今日臺灣哪些地名與此有關？(A)新營、左營、林鳳營(B)烏來、木柵、坪林(C)淡水、林口、新社(D)西螺、草屯、舊莊<\/p>\n<p>解答：(A)。營、鎮、營盤等地名多與明鄭時期的軍屯制度有關。<\/p>\n<p>3.史載唐代居住在城市中的人，若在夜鼓聲後未返家，就必須找隱蔽處躲避。導致此情況的原因是什麼制度？(A)戒嚴制(B)坊制(C)徵兵制(D)義役制<\/p>\n<p>解答：(B)。唐代實行「坊市分離」與「宵禁制度」，居民需遵守坊門開啟與關閉時間。<\/p>\n<p>4.美人魚故事是安徒生的作品，其雕像建在後來的哪座城市？(A)奧斯陸(B)斯德哥爾摩(C)赫爾辛基(D)哥本哈根<\/p>\n<p>解答：(D)。小美人魚雕像是丹麥哥本哈根最著名的觀光地標。<\/p>\n<p>5.17世紀日本江戶時代，擁有「天下廚房」美稱的是哪座城市？(A)東京(B)名古屋(C)大阪(D)京都<\/p>\n<p>解答：(C)。大阪在江戶時代是全日本物資集散中心，故被稱為天下廚房。<\/p>\n<p>6.有「仙人掌王國」美稱，曾存在馬雅、阿茲特克文明的是哪個國家？(A)墨西哥(B)瓜地馬拉(C)薩爾瓦多(D)尼加拉瓜<\/p>\n<p>解答：(A)。墨西哥國旗上就有仙人掌圖案，且境內擁有眾多古文明遺址。<\/p>\n<p>7.東北非洲最早的基督教國家，也是世界咖啡最早的起源地？(A)埃及(B)蘇丹(C)索馬利亞(D)衣索比亞<\/p>\n<p>解答：(D)。衣索比亞擁有古老的東正教傳統，且咖啡起源於境內的卡法（Kaffa）地區。<\/p>\n<p>8.下列哪一位文學家不是愛爾蘭人？(A)王爾德(B)蕭伯納(C)狄更斯(D)葉慈<\/p>\n<p>解答：(C)。狄更斯（CharlesDickens）是著名的英國文學家（倫敦人）。<\/p>\n<p>9.文藝復興時期義大利藝術家輩出，下列哪位不是此時期的藝術家？(A)喬托(B)雷諾茲(C)達文西(D)拉斐爾<\/p>\n<p>解答：(B)。約書亞·雷諾茲（JoshuaReynolds）是18世紀英國肖像畫家；喬托為文藝復興開拓者。<\/p>\n<p>10.西班牙在菲律賓殖民時期引進多種作物，下列何者不是西班牙人引進？(A)水稻(B)玉米(C)可可(D)馬鈴薯<\/p>\n<p>解答：(A)。水稻是菲律賓原有的原生作物或由亞洲移民傳入。<\/p>\n<p>11.越南曾受法國殖民統治，下列哪一項飲食與法國影響無關？(A)麵包(B)春捲(C)咖啡(D)牛肉料理<\/p>\n<p>解答：(B)。春捲是受中國文化影響的產物。法式長棍麵包、滴濾咖啡、牛肉河粉（Phở）與法式肉類烹飪有關。<\/p>\n<p>12.荷蘭東印度公司僱用著名印刷家族印製航海圖，須保守秘密，主要考量是？(A)文化(B)戰爭(C)外交(D)商業<\/p>\n<p>解答：(D)。地圖涉及航線與貿易資源，在地理大發現時代屬於商業核心機密。<\/p>\n<p>13.強調對稱與均衡，顯現秩序、宏偉等意念。17世紀喜用豪華、戲劇性、強烈對比。該風格為？(A)13世紀哥德式(B)15世紀文藝復興(C)17世紀巴洛克(D)19世紀印象派<\/p>\n<p>解答：(C)。17世紀盛行的巴洛克風格以華麗、動感、戲劇性的光影著稱。<\/p>\n<p>14.古埃及金字塔的主要功能與象徵意義？(A)法老陵墓，象徵通往來世的階梯與王權永恆(B)祭祀用神聖空間(C)行政中心(D)軍事瞭望塔<\/p>\n<p>解答：(A)。金字塔核心功能即為法老的陵寢，並體現宗教性的永生觀。<\/p>\n<p>15.「大英國協」成員中，下列何者不是成員國？(A)摩洛哥(B)馬爾他(C)奈及利亞(D)肯亞<\/p>\n<p>解答：(A)。摩洛哥曾是法國與西班牙的保護國，非大英帝國殖民地。<\/p>\n<p>16.1810年發動「多洛雷斯呼聲」，被視為墨西哥獨立革命領導者的是？(A)玻利瓦爾(B)米格爾·伊達爾戈(C)胡亞雷斯(D)奧古斯丁·伊圖爾維德<\/p>\n<p>解答：(B)。伊達爾戈神父（MiguelHidalgo）被尊為墨西哥國父。<\/p>\n<p>17.印加帝國首都庫斯科（Cuzco）的地理位置與歷史意義？(A)今日秘魯高地，是政治與宗教中心(B)今日哥倫比亞境內(C)今日智利北部(D)今日厄瓜多境內<\/p>\n<p>解答：(A)。庫斯科位於秘魯安地斯山脈，是昔日印加帝國的權力心臟。<\/p>\n<p>18.海地曾是歐洲列強殖民地，下列哪一個國家曾長期殖民統治海地？(A)葡萄牙(B)西班牙(C)法國(D)英國<\/p>\n<p>解答：(C)。海地曾是法國在加勒比海最重要的殖民地（聖多明哥）。<\/p>\n<p>19.下列何者不是荷蘭的代表象徵？(A)風車(B)鬱金香(C)長棍麵包(D)木鞋<\/p>\n<p>解答：(C)。長棍麵包（Baguette）是法國的飲食象徵。<\/p>\n<p>20.紐西蘭農牧業發展特色，下列何者正確？(A)毛利人主導(B)冷凍技術出現前即大量出口鮮肉(C)政府高度補貼(D)以牧草飼養為基礎，並因冷藏技術成功進入英國市場<\/p>\n<p>解答：(D)。冷藏船的發明使紐西蘭肉類與乳製品能遠銷英國，成為經濟支柱。<\/p>\n<p>21.澳洲「白澳政策」的核心內容與歷史影響？(A)鼓勵亞洲移民(B)針對歐洲移民(C)透過語言測驗排除非白人群體(D)保障原住民地權<\/p>\n<p>解答：(C)。白澳政策旨在限制非歐洲裔（特別是亞洲人）移入澳洲。<\/p>\n<p>22.「歐洲議會」設在哪一座城市？(A)柏林(B)布魯塞爾(C)阿姆斯特丹(D)巴黎<\/p>\n<p>解答：(B)。歐盟的主要行政機構多分佈於布魯塞爾與斯特拉斯堡。<\/p>\n<p>23.臺灣地區以「火山地形」著名的國家公園是：(A)墾丁(B)雪霸(C)玉山(D)陽明山<\/p>\n<p>解答：(D)。陽明山國家公園是台灣唯一的火山型國家公園。<\/p>\n<p>24.香港會議展覽中心位於香港的哪個地區？(A)中環(B)山頂(C)九龍(D)灣仔<\/p>\n<p>解答：(D)。位於灣仔北維多利亞港邊。<\/p>\n<p>25.剛果盆地氣候條件，何者最能促成熱帶雨林生長？②年降雨量大且分配均勻④終年受赤道低壓帶控制⑤整年氣溫高且年溫差小(A)①②③(B)①③⑤(C)②④⑤(D)③④⑤<\/p>\n<p>解答：(C)。熱帶雨林氣候具備終年高溫、多雨（受赤道低壓控制）的特徵。<\/p>\n<p>26.歐洲最北端、位於北緯71度觀賞極光的地點是：(A)挪威北角(B)芬蘭羅瓦涅米(C)冰島雷克雅維克(D)瑞典基律納<\/p>\n<p>解答：(A)。挪威北角（NorthCape）被視為歐洲大陸的最北端。<\/p>\n<p>27.阿布辛貝神廟因為亞斯文高壩興建而搬遷，利用哪一條河流？(A)尼羅河(B)尼日河(C)剛果河(D)尚比西河<\/p>\n<p>解答：(A)。亞斯文高壩位於埃及境內的尼羅河上。<\/p>\n<p>28.東非大裂谷的形成，主要是哪種板塊界處？(A)分離性板塊(B)守恆性板塊(C)聚合性板塊(D)隱沒帶作用<\/p>\n<p>解答：(A)。大裂谷是地殼張裂、板塊分離形成的斷層陷落帶。<\/p>\n<p>29.莫斯科主要氣候類型可能屬於：(A)寒帶苔原(B)副熱帶季風(C)溫帶大陸性氣候(D)溫帶海洋性氣候<\/p>\n<p>解答：(C)。莫斯科位於歐俄內陸，夏季溫暖短暫，冬季寒冷漫長，具明顯大陸性。<\/p>\n<p>30.馬特洪峰獨特的「角峰」是由哪種外力作用侵蝕形成？(A)海水(B)河流(C)風力(D)冰河<\/p>\n<p>解答：(D)。角峰是冰河時期多條冰河同時向中央山峰侵蝕形成的尖銳山頭。<\/p>\n<p>31.關於南亞地區的敘述，何者錯誤？(A)印度是該地區人口最多的國家(B)不丹是世界上唯一以藏傳佛教為國教的國家(C)斯里蘭卡位於印度洋上(D)巴基斯坦與中國沒有接壤<\/p>\n<p>解答：(D)。巴基斯坦北部與中國新疆接壤（著名的中巴友誼公路）。<\/p>\n<p>32.下列哪個城市不屬於不列顛島（GreatBritain）上的主要城市？(A)倫敦(B)都柏林(C)愛丁堡(D)曼徹斯特<\/p>\n<p>解答：(B)。都柏林是愛爾蘭島（Ireland）上愛爾蘭共和國的首都。<\/p>\n<p>33.亞馬遜河流域的自然地理特徵？③受到赤道低壓帶控制④河川水量非常豐沛⑤該地終年高溫多雨(A)①②④(B)①③⑤(C)②③④(D)③④⑤<\/p>\n<p>解答：(D)。亞馬遜河屬熱帶雨林，無「廣大溫帶草原（②）」。<\/p>\n<p>34.萊茵河不位於哪個國家？(A)法國(B)荷蘭(C)義大利(D)德國<\/p>\n<p>解答：(C)。萊茵河流經德、法、荷、瑞、奧等國，不經義大利。<\/p>\n<p>35.連接北海道與本州、世界最長的海底隧道為何？(A)關門隧道(B)青函隧道(C)山手隧道(D)鳥居隧道<\/p>\n<p>解答：(B)。青函隧道連結青森縣與函館（北海道）。<\/p>\n<p>36.下列哪個國家不屬於中亞地區？(A)哈薩克(B)吉爾吉斯(C)巴基斯坦(D)烏茲別克<\/p>\n<p>解答：(C)。巴基斯坦屬於「南亞」。<\/p>\n<p>37.關於加拿大的敘述，何者錯誤？(A)首都為溫哥華(B)露易絲湖位於班夫國家公園(C)尼加拉瀑布位於美加邊境(D)魁北克省以法語為官方語言<\/p>\n<p>解答：(A)。加拿大的首都是渥太華（Ottawa）。<\/p>\n<p>38.大堡礁面臨生態威脅的主要原因？①氣候變遷導致海水升溫②農業生產帶來水質污染④掠食者棘冠海星暴增(A)①②③(B)①②④(C)②③⑤(D)③④⑤<\/p>\n<p>解答：(B)。珊瑚礁主要威脅是白化（溫升）、污染與天敵侵襲。<\/p>\n<p>39.摩洛哥馬拉喀什老城與哪一宗教文化關係最密切？(A)佛教(B)印度教(C)基督教(D)伊斯蘭教<\/p>\n<p>解答：(D)。摩洛哥是典型的北非穆斯林國家。<\/p>\n<p>40.馬丘比丘最能體現其文化與自然相輔相成的特殊性？(A)建築群大量使用在地橄欖岩(B)最後避難所(C)遺址處於安地斯山脈，梯田設計是為了在陡峭山地進行水土保持(D)珍稀物種棲息地<\/p>\n<p>解答：(C)。梯田展現了人類智慧如何適應並利用險峻的自然地形。<\/p>\n<p>41.強調人類與自然環境長期互動形成的特殊地景（CulturalLandscape）？(A)大堡礁(B)菲律賓科迪勒拉山水稻梯田(C)塞倫蓋蒂國家公園(D)加拉巴哥群島<\/p>\n<p>解答：(B)。梯田是典型的人造與自然結合之景觀。其餘多為純自然遺產。<\/p>\n<p>42.蒙古「那達慕」大會「男子三藝」指的是？(A)摔跤、射箭、賽馬(B)舉重、摔跤、賽馬(C)射箭、馬球、摔跤(D)賽馬、馴鷹、射箭<\/p>\n<p>解答：(A)。三藝即為摔跤、射箭、賽馬。<\/p>\n<p>43.日本北海道「流冰」景觀的成因與來源？(A)火山岩漿(B)當地海水結凍(C)北極圈巨冰(D)由中國與俄羅斯界河黑龍江河水流入海中結冰後隨洋流漂至<\/p>\n<p>解答：(D)。鄂霍次克海的流冰主因是黑龍江淡水注入降低鹽度所致。<\/p>\n<p>44.雅典衛城上的建築物？②衛城山門③帕德嫩神廟⑤厄克忒翁神廟(A)①②③(B)①③④(C)②③⑤(D)③④⑤<\/p>\n<p>解答：(C)。萬神殿(①)在羅馬，聖伯多祿廣場(④)在梵蒂岡。<\/p>\n<p>45.關於南韓濟州島地理特色，何者錯誤？(A)韓國第二大的島嶼(B)具有獨特火山地貌(C)2007年入選世界自然遺產(D)以雪綠茶主題博物館聞名<\/p>\n<p>解答：(A)。濟州島是韓國第一大島。<\/p>\n<p>46.國家與首都的配對，何者正確？(A)越南—胡志明市(B)澳洲—雪梨(C)土耳其—安卡拉(D)加拿大—多倫多<\/p>\n<p>解答：(C)。越南首都是河內，澳洲是坎培拉，加拿大是渥太華。<\/p>\n<p>47.南美洲當地餐廳提供烤天竺鼠，領隊最適當做法？(A)拍照紀錄(B)說明飲食文化差異，鼓勵尊重當地文化(C)要求更換餐食(D)通報旅行社<\/p>\n<p>解答：(B)。天竺鼠是安地斯山區的傳統食材，應以文化教育角度引導。<\/p>\n<p>48.南美洲印加文明引進並流傳至今成為全球主食？(A)稻米(B)小麥(C)馬鈴薯(D)蕎麥<\/p>\n<p>解答：(C)。馬鈴薯原產於安地斯山脈。<\/p>\n<p>49.巴西嘉年華內容，何者錯誤？(A)為人們在封齋期之後的狂歡(B)又稱謝肉節(C)世界三大嘉年華之一(D)以森巴舞及花車聞名<\/p>\n<p>解答：(A)。嘉年華是封齋期「之前」的狂歡（吃肉）。<\/p>\n<p>50.關於美國觀光資源，何者正確？(A)優勝美地是世界第一座國家公園(B)自由女神像代表美國獨立百年(C)大峽谷是科羅拉多河侵蝕形成(D)華爾街在首府華盛頓<\/p>\n<p>解答：(C)。(A)黃石是第一座國家公園；(B)自由女神是法國送的；(D)華爾街在紐約。<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "0102b567", "date": "2026-03-13", "title": "尋保母記", "cat": "生活記憶", "src": "方格子", "url": "https://vocus.cc/article/69b35c9bfd8978000102b567", "ex": "最近的新聞讓自己想起了育兒往事。 白鐵製的公寓門打開時，前來迎門的是位中年保母阿姨，我們環顧客廳四周，地上有塑膠地墊，阿姨就坐在地上在照料一個小嬰兒，四周的牆邊都是紅白條塑膠袋一包", "len": 708, "body": "<p>最近的新聞讓自己想起了育兒往事。<\/p><p>白鐵製的公寓門打開時，前來迎門的是位中年保母阿姨，我們環顧客廳四周，地上有塑膠地墊，阿姨就坐在地上在照料一個小嬰兒，四周的牆邊都是紅白條塑膠袋一包包的，客廳入門就有一個很大的水族缸，一條紅龍在有點模糊的水中游著，另外一旁竟有一隻中型的鸚鵡，在我們走進來時一直歪頭看著我們倆，沒說話。<\/p><p>其實開門當下我們就想走了，但是保母請我們入座，也就是一起坐在地墊上，而且這又是朋友介紹的保母，以前她的小孩就是交給這位保母照顧，平安又健康地長大了。所以我們就小聊了一下，我們例行性問了小孩的食物準備、洗澡時間、作息安排等等基本內容。<\/p><p>但，我們夫妻很在意那隻鸚鵡，因為它就站在離嬰兒不遠處，眼睛靈動地在觀察著我們。<\/p><p>我們倆問了一句：阿姨在客廳一起養小朋友與動物呀？<\/p><p>阿姨很開心地回應：喔，那隻鸚鵡很聰明喔，會說話，小孩可以和它學著聊天喔。<\/p><p>我們倆難以承受心中的驚訝，可能都寫在表情上，所以後來聊沒幾句，我們就離開了那個不是很明亮，地上有位小嬰兒、鸚鵡及紅龍的公寓了。<\/p><p>小狗子很小的時候，差不多就是六個月左右我們這兩位新手爸媽，正著手在家附近找保母，我們是找白天上班時間的照護保母，所以就在網路、社區中四處詢問，獲得訊息之後也直接登門拜訪保母家，了解環境並與保母親自聊聊互動。我想這是所有的父母在育兒當下，如有工作及生活平衡考量的最初作法，因為新生兒的照護複雜且細緻，要將寶貝交出去幾小時，就是提心吊膽幾小時。<\/p><p>在沒有家庭支援與經濟能力的協助之下，後來的我們將孩子仍在上班時間送去了托嬰中心，一間看起來比較有規模，托育員聊起來可以信賴的環境托了二個多月，因為找到東部的工作之後，我們舉家就去花蓮了，這是後話，有空再寫。<\/p>"}, {"id": "f1773412750", "date": "2026-03-13", "title": "導遊領隊考前EP98", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前EP98 領隊考試倒數1天 22 孔子故鄉有規模宏大的孔廟、孔林、孔府等建物，被列入世界文化遺產，請問其在中國那一座城市？(A)北京 (B)濟南 (C)曲阜 (D)淄博", "len": 312, "body": "<p>導遊領隊考前EP98<\/p>\n<h1>領隊考試倒數1天<\/h1>\n<p>22 孔子故鄉有規模宏大的孔廟、孔林、孔府等建物，被列入世界文化遺產，請問其在中國那一座城市？(A)北京 (B)濟南 (C)曲阜 (D)淄博<\/p>\n<p>考前的這一天，來一題至聖先師的題目來為同學加持，每位參加醒吾旅運課後輔導班的同學們，你們都已被孔子的第七十六代孫- 孔令揚 老師(孔哥)辛勤地教學輔導過，很自然地，明後天的領隊與導遊考試一定是福星高照，解題神助。<\/p>\n<p>今日不再解題，放下手機好好去睡一覺，記得明天帶上身份證、准考證、2B鉛筆、橡皮擦，早點去考場坐坐，看看中午可否點個便當不要再去找吃的，隨身帶上老師們的祝福與考古題，一切都會順順地，考的都會，猜的都對。<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773277420", "date": "2026-03-12", "title": "【恭喜彥伶高中公務人員全國第四名】", "cat": "生活記憶", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "2026.3.11(三) 【恭喜彥伶高中公務人員全國第四名】 辛苦的彥伶，在廿年完美的育兒與教養的過程中，教導出一個懂事又可愛的兒子，更是我們一家三人心靈與愛的基礎。 在兒子考上大", "len": 381, "body": "<p>2026.3.11(三)<\/p>\n<p>【恭喜彥伶高中公務人員全國第四名】<\/p>\n<p>辛苦的彥伶，在廿年完美的育兒與教養的過程中，教導出一個懂事又可愛的兒子，更是我們一家三人心靈與愛的基礎。<\/p>\n<p>在兒子考上大學搬至外地求學之後，終於有一點自己的時間來為自己努力，如此犧牲與不容易中，今日獲得了小小的成果，為自己的努力寫下了一頁美好又值得的記錄。<\/p>\n<p>彥伶一直以來都用對自己過度要求方式在生活，除了運動健康保持年輕美麗之外，她的學歷也是我們全家最高，擁有國立中興大學法學碩士及國立東華大學法研所研究生的學歷；在孩子出生之前，她更是法商模範市調的經理、廣電基金的研究員等，在統計與法律上擁有專業能力，一直都是我們家的智囊與軍師。<\/p>\n<p>在這，我要用全心全意向她說「我愛妳」，更要謝謝她幾近半生的付出，再來請她好好享受自己爭取來的第三人生，投入公職追求自我的卓越，將所學所長為國家付出，成就自我，享受再度入職的美好。<\/p>"}, {"id": "f1773322374", "date": "2026-03-12", "title": "導遊領隊考前EP97", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前EP97 領隊考試倒數2天 13 下列何者為跨國性的世界文化遺產？ (A)日本紀伊山地的靈場和參拜道 (B)西班牙聖地牙哥基督教朝聖古道 (C)麻六甲海峽的歷史城市麻六", "len": 804, "body": "<p>導遊領隊考前EP97<\/p>\n<h1>領隊考試倒數2天<\/h1>\n<p>13 下列何者為跨國性的世界文化遺產？<\/p>\n<p>(A)日本紀伊山地的靈場和參拜道<\/p>\n<p>(B)西班牙聖地牙哥基督教朝聖古道<\/p>\n<p>(C)麻六甲海峽的歷史城市麻六甲和喬治市<\/p>\n<p>(D)土耳其伊斯坦堡歷史區<\/p>\n<p>答案是(B)，但說起來也不太算，因為西班牙境內的「聖地牙哥朝聖之路」在 1993 年就被列入世界遺產，而法國境內的朝聖路徑在 1998 年才被列入世遺的部分。<\/p>\n<p>再以跨國世界遺產來出幾題練習，快要考試了，大家撐一下。<\/p>\n<p>＃１ 關於「跨國界自然遺產」的地理分布，下列哪一組遺產與國家對應的關係是完全正確的？<\/p>\n<p>(A) 維多利亞瀑布：由尚比亞、辛巴威共同擁有。<\/p>\n<p>(B) 瓦登海：由法國、荷蘭、比利時共同擁有。<\/p>\n<p>(C) 喀爾巴阡山脈原始山毛櫸林：僅由波蘭與烏克蘭共同擁有。<\/p>\n<p>(D) 絲綢之路：由中國與蒙古共同擁有。<\/p>\n<p>答案：(A)<\/p>\n<p>(B) 瓦登海應為荷、德、丹麥三國。(C) 山毛櫸林目前已擴張至 18 國。(D) 絲綢之路（長安－天山廊道）目前登錄的是中國、哈薩克與吉爾吉斯三國。<\/p>\n<p>＃２ 由荷蘭、德國、丹麥三國共同擁有並管理的自然遺產，最可能是指下列何者？<\/p>\n<p>(A) 喀爾巴阡山脈原始山毛櫸林<\/p>\n<p>(B) 瓦登海（Wadden Sea）<\/p>\n<p>(C) 維多利亞瀑布<\/p>\n<p>(D) 大堡礁<\/p>\n<p>答案：(B)<\/p>\n<p>＃３ 在世界遺產名錄中某項文化遺產是由西班牙與斯洛維尼亞聯合登錄，主要表彰其對全球貿易與金屬提煉的貢獻，這最可能是指下列何者？<\/p>\n<p>(A) 聖地牙哥朝聖古道<\/p>\n<p>(B) 莫丘利與阿爾馬登汞礦產區<\/p>\n<p>(C) 羅馬帝國邊境<\/p>\n<p>(D) 絲綢之路<\/p>\n<p>答案：(B)<\/p>\n<p>＃４ 關於勒·柯比意的建築作品：對現代運動的卓越貢獻這項世界文化遺產，下列敘述何者正確？<\/p>\n<p>(A) 其作品僅分布在歐洲大陸的法國與瑞士。<\/p>\n<p>(B) 這是少數跨越三大洲（歐洲、亞洲、南美洲）的跨國系列遺產。<\/p>\n<p>(C) 日本的國立西洋美術館因位於亞洲，故未被列入此項跨國登錄中。<\/p>\n<p>(D) 此項遺產是因為各國建築風格完全不同，為了展現多樣性而聯合登錄。<\/p>\n<p>答案：(B)<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773242254", "date": "2026-03-11", "title": "導遊領隊考前EP96", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前EP96 領隊考試倒數3天 36 歐洲的多瑙河常常傳出洪水為患的問題，主要是下列那個因素造成？(A)暴風雪 (B)颱風 (C)融雪 (D)河床坡度太陡 答案是(C) 題", "len": 426, "body": "<p>導遊領隊考前EP96<\/p>\n<h1>領隊考試倒數3天<\/h1>\n<p>36 歐洲的多瑙河常常傳出洪水為患的問題，主要是下列那個因素造成？(A)暴風雪 (B)颱風 (C)融雪 (D)河床坡度太陡<\/p>\n<p>答案是(C)<\/p>\n<p>題解：多瑙河（Danube River）是歐洲第二長河，全長約 2,850 公里，流經 10 個國家，是世界上流經國家最多的河流。<\/p>\n<p>＃１ 多瑙河最著名的特色之一是它直接穿過四個國家首都，請問以下那個配對是錯誤的？<\/p>\n<p>(A)奧地利-維也納<\/p>\n<p>(B)斯洛伐尼亞-布拉提斯拉瓦<\/p>\n<p>(C)匈牙利-布達佩斯<\/p>\n<p>(D)塞爾維亞-貝爾格勒<\/p>\n<p>答案：(B)是錯誤的，布拉提斯拉瓦是斯洛伐克的首都<\/p>\n<p>＃２ 某旅行社規劃「多瑙河浪漫河輪之旅」，航程由德國帕紹（Passau）出發，順流而下終點站為匈牙利布達佩斯。請問領隊在航程中，依序會經過哪些國家的首都？<\/p>\n<p>(A) 柏林 → 維也納 → 布拉提斯拉瓦<\/p>\n<p>(B) 維也納 → 布拉提斯拉瓦 → 布達佩斯<\/p>\n<p>(C) 慕尼黑 → 維也納 → 布達佩斯<\/p>\n<p>(D) 維也納 → 薩格勒布 → 布達佩斯<\/p>\n<p>正確答案：(B)<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773142665", "date": "2026-03-10", "title": "㊗️狂賀㊗️", "cat": "技職教育", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "㊗️狂賀㊗️ 醒吾旅運系106級畢業生 白佳文 學姐考取台北捷運站務員，現她已完成訓練在三重站任職，她在學時就是系辦中的開心果，也是最認真又活潑的學生，畢業後曾任職旺旺中時集團的烏", "len": 424, "body": "<p>㊗️狂賀㊗️<\/p>\n<h1>醒吾旅運系106級畢業生<\/h1>\n<h1>白佳文 學姐考取台北捷運站務員，現她已完成訓練在三重站任職，她在學時就是系辦中的開心果，也是最認真又活潑的學生，畢業後曾任職旺旺中時集團的烏來雲仙主題樂園，近日在自我突破與努力下考取台北捷運公司。<\/h1>\n<p>此時，臺北捷運公司與北捷遊憩公司聯合招募各界菁英，自 #3月10日14時至3月24日15時止同步開放線上報名。此次聯合招募類科多元，合計超過200個名額，同時擴大招募「跨域培訓類」12類科計64人，由公司全程培育成具備專業能力的人才。招募簡章及報名相關資訊，請至臺北捷運公司或北捷遊憩公司徵才系統查詢。<\/p>\n<p>本次招募職缺最高月薪6.25萬元，包含獎金年薪最高達16.4個月，員工更享有豐富親子活動與20個社團、每年舉辦未婚聯誼與集團婚禮、員工專屬「北捷教保中心」托育服務。<\/p>\n<p>機會難得只有兩週：<\/p>\n<p><a href=\"https://ssl.metro.taipei/workerdataV2/?AspxAutoDetectCookieSupport=1\">https://ssl.metro.taipei/workerdataV2/?AspxAutoDetectCookieSupport=1<\/a><\/p>"}, {"id": "f1773154770", "date": "2026-03-10", "title": "導遊領隊考前EP95", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前EP95 領隊考試倒數4天 44 印尼龍目島與峇里島是兩個鄰近的島嶼，龍目島上居民的主要宗教信仰為何？(A)佛教 (B)天主教 (C)印度教 (D)伊斯蘭教 答案是(D", "len": 717, "body": "<p>導遊領隊考前EP95<\/p>\n<h1>領隊考試倒數4天<\/h1>\n<p>44 印尼龍目島與峇里島是兩個鄰近的島嶼，龍目島上居民的主要宗教信仰為何？(A)佛教 (B)天主教 (C)印度教 (D)伊斯蘭教<\/p>\n<p>答案是(D)<\/p>\n<p>換個方式說，整個印尼幾乎所有島嶼的多數人民都是信仰伊斯蘭教，反而只有峇里島的多數人是信仰印度教的特殊存在。<\/p>\n<p>而且更有趣的地方是這兩座島嶼之間的分界線，在地理學上也非常有名，即著名的華萊士線 (Wallace Line)，區隔了亞洲與澳洲的生物群系。<\/p>\n<p>＃１ 關於華萊士線在印尼觀光地理上的特殊性，下列哪一項說法最能協助領隊在解說時，引發旅客對「生物多樣性」的興趣？<\/p>\n<p>(A) 此線剛好與印尼的宗教分界線重合，西邊信印度教，東邊信伊斯蘭教。<\/p>\n<p>(B) 此處鄰近的海峽據推估於冰河時期海平面下降時，兩島也未曾相連，導致物種演化長期隔絕。<\/p>\n<p>(C) 華萊士線兩側的植物景觀完全相同，主要差異僅在於礦產資源的分布。<\/p>\n<p>(D) 只有在峇里島才能看見舉世聞名的科摩多龍，龍目島則完全沒有。<\/p>\n<p>答案：(B)<\/p>\n<p>＃２ 領隊帶領印尼跳島生態之旅前往觀賞世界體型最大的蜥蜴：科摩多龍（Komodo Dragon），關於科摩多龍的生態與地理背景，下列敘述何者錯誤？<\/p>\n<p>(A) 科摩多島（Komodo Island）位於華萊士線以東，具有獨特的過渡性生物特徵。<\/p>\n<p>(B) 科摩多龍之所以體型巨大，與其長期在孤立島嶼上演化，且缺乏大型食肉哺乳動物競爭有關。<\/p>\n<p>(C) 旅客若要觀賞野生的科摩多龍，應前往科摩多國家公園（Komodo National Park），該地已被聯合國教科文組織列為世界自然遺產。<\/p>\n<p>(D) 科摩多龍是峇里島（Bali）最著名的野生動物代表，在峇里島市區隨處可見其出沒，是當地的守護神。<\/p>\n<p>答案：(D)<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773069044", "date": "2026-03-09", "title": "導遊領隊考前EP93", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前EP93 領隊考試倒數6天 46 在2021年那個歐洲的世界文化遺產，因過度開發被註銷登錄，從世界文化遺產名單中移除？(A)佛羅倫斯歷史中心 (B)利物浦海事商城 (C", "len": 470, "body": "<p>導遊領隊考前EP93<\/p>\n<h1>領隊考試倒數6天<\/h1>\n<p>46 在2021年那個歐洲的世界文化遺產，因過度開發被註銷登錄，從世界文化遺產名單中移除？(A)佛羅倫斯歷史中心 (B)利物浦海事商城 (C)巴黎塞納河岸 (D)維也納歷史中心<\/p>\n<p>答案(B)<\/p>\n<p>歷史上只有三個世界遺產被正式除名：<\/p>\n<p>1.阿拉伯羚羊保護區 (2007年)： 因阿曼政府縮減保護區面積達 90% 以開採石油。<\/p>\n<p>2.德國德勒斯登易北河谷 (2009年)： 因堅持興建橫跨河谷的現代化「森林宮大橋」破壞景觀。<\/p>\n<p>3.英國利物浦海事商城 (2021年)： 如題所述，因港區過度現代化開發。<\/p>\n<p>以下將以近年具知名度的世界遺產來出題：<\/p>\n<p>＃１ 請問世界文化遺產中有那一個建築在仍未完工的情況下早被列入世界遺產之中？(A)巴黎聖母院 (B)巴塞隆納聖家堂 (C)米蘭百光大教堂 (D)雪梨歌劇院<\/p>\n<p>答案(B)<\/p>\n<p>＃２ 下列哪一個遺產目前正因為「景觀破碎化」及「高層建築計畫」，被 UNESCO 列入瀕危名單，極可能成為下一個面臨除名風險的歐洲古城？<\/p>\n<p>(A) 聖米歇爾山<\/p>\n<p>(B) 雅典衛城<\/p>\n<p>(C) 維也納歷史中心<\/p>\n<p>(D) 布拉格歷史中心<\/p>\n<p>答案(C)<\/p>\n<p>圖片來源：AI輔助作者整理<\/p>\n<h1>99天領隊導遊考前陪跑<\/h1>"}, {"id": "f1773069057", "date": "2026-03-09", "title": "導遊領隊考前EP94", "cat": "證照考試", "src": "Facebook", "url": "https://www.facebook.com/chenrayfong", "ex": "導遊領隊考前EP94 領隊考試倒數5天 49 下列那一個國家會在3月春分時，舉辦侯麗節（Holi），民眾在臉上塗抹彩色顏料，互相投擲彩色粉末和水球，慶祝春天的到來？(A)印度 (B", "len": 1400, "body": "<p>導遊領隊考前EP94<\/p>\n<h1>領隊考試倒數5天<\/h1>\n<p>49 下列那一個國家會在3月春分時，舉辦侯麗節（Holi），民眾在臉上塗抹彩色顏料，互相投擲彩色粉末和水球，慶祝春天的到來？(A)印度 (B)巴西 (C)荷蘭 (D)印尼<\/p>\n<p>答案是A<\/p>\n<p>前幾天看醒吾在印度旅居的學姐限動就是參加印度多彩的侯麗節，之前也有參加排燈節等，在多元文化之間盡情地體驗人生非常羨慕；印度的節慶非常多且具特色，印度全年度還有以下等重要的節慶。<\/p>\n<p>1月：豐收節 (Makar Sankranti / Pongal)：慶祝太陽北移，南印度會煮甜牛奶米粥感謝耕
